# nyxAgent Configuration Template
# Documentation: https://github.com/dkblinux98/nyxAgent

nyxagent:
  version: "1.0.0"

project:
  # Project identification
  name: "nyxGPT"
  github_org: "dkblinux98"
  github_repo: "nyxGPT"
  project_number: 2

branches:
  # Branch strategy
  # IMPORTANT: NEVER merge to main/master - use release branches
  # Feature branches are created from and merged back to release branch
  # main/master is reserved for releases only (human controlled)
  release_branch: "v2.0.0"
  main_branch: "v2.0.0"

agents:
  # Enable/disable agents for this project
  developer:
    enabled: true
    github_username: "myGPT-developer-agent"
  review:
    enabled: true
    github_username: "myGPT-review-agent"
  scrummaster:
    enabled: true
    github_username: "myGPT-scrummaster-agent"
  qa:
    enabled: true
  stakeholder:
    enabled: false

# Optional: Project-specific overrides
# Uncomment and customize as needed

