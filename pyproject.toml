[project]
name = "nyxGPT"
version = "1.0.0"
description = "Local ChatGPT-style system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "cassandra-driver>=3.29.2",
  "python-frontmatter>=1.0.0",
  "markdown>=3.5",
  "beautifulsoup4>=4.12",
  "pypdf>=3.17",
  "pdfplumber>=0.11.0",
  "python-docx>=1.0.0",
  "python-pptx>=0.6.23",
  "python-multipart>=0.0.6",
  "tiktoken>=0.5.0",
  "ebooklib>=0.18",
  "pytesseract>=0.3.10",
  "pdf2image>=1.16.0",
  "pillow>=10.0.0",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
ui = [
  "httpx>=0.27",
  "textual>=0.58",
]

dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-mock>=3.12",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "textual>=0.58",
  "mypy>=1.8",
  "ruff>=0.1",
  "types-Markdown",
  "reportlab>=4.0",
]

[project.scripts]
nyxgpt = "nyxgpt.cli:cli"

# By default, run all tests. Use -m unit or -m integration to filter.
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: fast unit tests with no external dependencies",
  "integration: tests requiring external services (Ollama/Cassandra/Docker)",
  "all: alias marker for running the full test suite",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

# Ignore missing imports for third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "frontmatter",
    "cassandra.*",
    "textual.*",
    "pdfplumber",
    "reportlab.*",
    "docx.*",
    "pptx.*",
    "ebooklib.*",
    "pytesseract",
    "pdf2image",
    "PIL.*",
]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"