[project]
name = "myGPT"
version = "1.0.0"
description = "Local ChatGPT-style system"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mygpt = "mygpt.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"