[project]
name = "myGPT"
version = "1.0.0"
description = "Local ChatGPT-style system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "cassandra-driver>=3.29.2",
  "python-frontmatter>=1.0.0",
  "markdown>=3.5",
  "beautifulsoup4>=4.12",
  "pypdf>=3.17",
  "python-multipart>=0.0.6",
  "tiktoken>=0.5.0",
]

[project.optional-dependencies]
ui = [
  "httpx>=0.27",
  "textual>=0.58",
]

dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-mock>=3.12",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "mypy>=1.8",
  "ruff>=0.1",
]

[project.scripts]
mygpt = "mygpt.cli:cli"

# By default, run all tests. Use -m unit or -m integration to filter.
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v"
testpaths = ["tests"]
markers = [
  "unit: fast unit tests with no external dependencies",
  "integration: tests requiring external services (Ollama/Cassandra/Docker)",
  "all: alias marker for running the full test suite",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"