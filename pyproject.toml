[project]
name = "nyxGPT"
version = "2.0.0"
description = "Local ChatGPT-style system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "cassandra-driver>=3.29.2",
  "python-frontmatter>=1.0.0",
  "markdown>=3.5",
  "beautifulsoup4>=4.12",
  "pypdf>=3.17",
  "pdfplumber>=0.11.0",
  "python-docx>=1.0.0",
  "python-pptx>=0.6.23",
  "python-multipart>=0.0.6",
  "tiktoken>=0.5.0",
  "ebooklib>=0.18",
  "pytesseract>=0.3.10",
  "pdf2image>=1.16.0",
  "pillow>=10.0.0",
  "psutil>=5.9.0",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.24.0",
  "opentelemetry-sdk>=1.24.0",
  "opentelemetry-exporter-otlp-proto-http>=1.24.0",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-cassandra>=0.45b0",
  "sentry-sdk>=2.0",
  # ops.py imports httpx unconditionally (GlitchTip HTTP client) and the api
  # imports ops.py, so httpx is a core runtime dep -- not just a ui/dev extra.
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  # Testing
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-mock>=3.12",
  "pytest-asyncio>=0.23",

  # Type checking
  "mypy>=1.8",
  "types-Markdown",
  "types-psutil",

  # Linting & formatting
  "ruff>=0.1",
  "black>=24.0",
  "yamllint>=1.35",
  "interrogate>=1.7",

  # Pre-commit hooks
  "pre-commit>=3.6",

  # Development tools
  "httpx>=0.27",
  "reportlab>=4.0",
]

[project.scripts]
nyxgpt = "nyxgpt.cli:cli"

# By default, run all tests. Use -m unit or -m integration to filter.
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: fast unit tests with no external dependencies",
  "integration: tests requiring external services (Ollama/Cassandra/Docker)",
  "all: alias marker for running the full test suite",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

# Ignore missing imports for third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "frontmatter",
    "cassandra.*",
    "pdfplumber",
    "reportlab.*",
    "docx.*",
    "pptx.*",
    "ebooklib.*",
    "pytesseract",
    "pdf2image",
    "PIL.*",
    "fastapi",
    "fastapi.*",
    "starlette.*",
    "pydantic",
    "pydantic.*",
    "bs4",
    "pypdf",
    "httpx",
    "tiktoken",
    "psutil",
    "markdown",
    "opentelemetry.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ARG"]

[tool.ruff.isort]
known-first-party = ["nyxgpt"]

[tool.interrogate]
# Docstring-coverage gate (issue #3225). Nested/closure functions and classes
# (e.g. retry-callback closures) are exempt as trivial implementation
# details of an already-documented enclosing function.
ignore-nested-functions = true
ignore-nested-classes = true
fail-under = 100
verbose = 1
exclude = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
