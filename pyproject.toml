[project]
name = "nyxGPT"
version = "3.0.0"
description = "Local ChatGPT-style system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "cassandra-driver>=3.29.2",
  "python-frontmatter>=1.0.0",
  "markdown>=3.5",
  "beautifulsoup4>=4.12",
  "pypdf>=3.17",
  "pdfplumber>=0.11.0",
  "python-docx>=1.0.0",
  "python-pptx>=0.6.23",
  "python-multipart>=0.0.6",
  "tiktoken>=0.5.0",
  "ebooklib>=0.18",
  "pytesseract>=0.3.10",
  "pdf2image>=1.16.0",
  "pillow>=10.0.0",
  "psutil>=5.9.0",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.24.0",
  "opentelemetry-sdk>=1.24.0",
  "opentelemetry-exporter-otlp-proto-http>=1.24.0",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-cassandra>=0.45b0",
  # Instruments urllib.request (ollama_client.py's HTTP client) so outbound
  # Ollama calls get a client span plus automatic W3C traceparent header
  # injection -- the "no hand-rolled header forwarding" correlation backbone
  # requirement (#3430).
  "opentelemetry-instrumentation-urllib>=0.45b0",
  "sentry-sdk>=2.0",
  # ops.py imports httpx unconditionally (GlitchTip HTTP client) and the api
  # imports ops.py, so httpx is a core runtime dep -- not just a ui/dev extra.
  "httpx>=0.27",
  # ops.py imports this unconditionally for `nyxgpt ops secrets-sync`'s
  # libsodium sealed-box encryption of GitHub Actions secret values (#3505).
  "pynacl>=1.5",
]

[project.optional-dependencies]
dev = [
  # Testing
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-mock>=3.12",
  "pytest-asyncio>=0.23",
  # Builds an installable wheel in test_resources_packaging.py to verify
  # nyxgpt.resources resolves via importlib.resources from a real,
  # non-editable install with no repo checkout present (#3621).
  "build>=1.0",

  # Type checking
  "mypy>=1.8",
  "types-Markdown",
  "types-psutil",

  # Linting & formatting
  "ruff>=0.1",
  "black>=24.0",
  "yamllint>=1.35",
  "interrogate>=1.7",

  # Security scanning (#3501)
  "bandit[toml]>=1.7",
  "pip-audit>=2.7",

  # Pre-commit hooks
  "pre-commit>=3.6",

  # Development tools
  "httpx>=0.27",
  "reportlab>=4.0",
]

# `nyxgpt ops verify` (#3555): Playwright dashboard screenshots. Kept out of
# the base/dev dependency sets -- it pulls a browser binary via a separate
# `playwright install` step, which most nyxGPT commands never need.
verify = [
  "playwright>=1.45,<2",
]

# `nyxgpt cloud` (#3630, P6-11-class): AWS SDK for the cloud deployment
# lifecycle commands (allow-ip today; deploy/destroy later, #3513). Kept out
# of the base dependency set -- only AWS deployments need it, not the local
# stack every other command drives.
#
# `keyring` backs `nyxgpt cloud credentials-setup`'s optional OS-keychain
# destination for AWS access keys (#3512) -- also cloud-only, so it lives
# in this extra rather than the base install.
cloud = [
  "boto3>=1.34",
  "keyring>=24",
]

[project.scripts]
nyxgpt = "nyxgpt.cli:cli"

# By default, run all tests. Use -m unit or -m integration to filter.
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "unit: fast unit tests with no external dependencies",
  "integration: tests requiring external services (Ollama/Cassandra/Docker)",
  "all: alias marker for running the full test suite",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# nyxgpt.resources ships the ops layer's runtime data (compose files, config
# templates, launchd/systemd unit templates, Grafana/Prometheus/promtail
# provisioning, helper scripts) inside the installable package, so an
# installed (non-editable) build has no dependency on a source checkout --
# see `nyxgpt.ops._sync_packaged_resources` and #3621. The package directory
# itself contains symlinks back to the canonical top-level files
# (docker/, docker-compose.yml, ops/, .env.example, four scripts/*.sh,
# terraform/aws/ for the AWS substrate `nyxgpt cloud infra` provisions --
# #3509, terraform/local/ for the local stack `nyxgpt ops install --terraform
# --local` applies -- #3835, and the product docs for the web UI's Support ->
# Docs viewer -- #3745) rather than copies, so there is exactly one place to
# edit each file;
# setuptools dereferences symlinks when it builds the wheel/sdist, so the
# built artifact contains real file content, not links.
#
# resources/docs/ is the one place this is per *file* rather than per
# directory (#3809): `docs/` also holds the documents about how this
# repository builds itself -- the agent loop, CI process, contributor setup,
# this project's own GitHub tokens -- and none of that is product help for a
# user opening Support -> Docs. One symlink per product document makes the
# packaged set an allow-list: a newly added process doc is simply not in it,
# so it cannot reach the artifact. The selection is named in
# `nyxgpt.support.DOC_SECTIONS` (which also groups it for the viewer), and
# tests/unit/test_support_docs.py asserts the two match exactly.
[tool.setuptools.package-data]
# "**/*" (glob-style) doesn't match dotfiles, so .env.example needs its own
# explicit entry.
"nyxgpt.resources" = ["**/*", ".env.example"]

[tool.setuptools.exclude-package-data]
# docker/config.docker.ini is gitignored and generated at runtime by
# `_generate_compose_config` -- never part of the tracked, packaged
# resources. A dev checkout that ran a pre-#3621 `nyxgpt ops install` (back
# when this file was written repo-relative into docker/, not
# ~/.nyxGPT/docker/) could still have a stale copy sitting in the repo's
# docker/ directory the resources/docker symlink resolves through; exclude
# it explicitly so a wheel built from such a tree can't embed that
# secret-bearing file (it carries [auth] api_key / [monitoring]
# grafana_admin_password / an error-tracking DSN -- see
# `_generate_compose_config`).
#
# The terraform/aws entries are the same defence for the AWS substrate
# (#3509): `terraform init` run directly in that directory (as CI's validate
# gate does) leaves a multi-hundred-megabyte .terraform/ plugin cache behind,
# and a hand-run `terraform apply` there would drop state/tfvars carrying
# real infrastructure ids next to the tracked config. All of it is
# gitignored, none of it belongs in a wheel -- `nyxgpt cloud infra` keeps the
# real state and tfvars under ~/.nyxGPT/cloud/ instead.
#
# terraform/local/ (#3835) needs no entries here: it is symlinked per *file*
# (the four .tf sources plus terraform.tfvars.example), so the state, tfvars
# and .terraform/ cache a dev checkout accumulates in its own terraform/
# directory are not reachable through the packaged tree at all -- the same
# allow-list reasoning resources/docs/ uses above.
#
# The two k8s secrets are the third case of the same defence (#3834), and
# there are two of them because the Kubernetes path generates two:
# `_ensure_k8s_secret` writes k8s/secret.yaml (the deployment's real
# `[auth] api_key`) and `_ensure_k8s_observability_secret` writes
# k8s/observability/secret.yaml (the Grafana admin password, the Slack
# webhook and the GlitchTip DSN -- see `_k8s_observability_secret_values`).
# Both are gitignored and both are now written under ~/.nyxGPT/k8s -- but a
# checkout that ran a pre-#3834 `nyxgpt ops install --kubernetes` or
# `nyxgpt ops observability --kubernetes` still has one sitting in the repo's
# k8s/ directory that the resources/k8s symlink resolves through. Excluding
# one and not the other would leave the class half-swept.
#
# The observability one needs TWO entries, and the reason is a setuptools
# trap worth naming: `[tool.setuptools.packages.find]` in pyproject enables
# namespace packages, so `k8s/observability/` -- an importable-looking name --
# is discovered as the package `nyxgpt.resources.k8s.observability` as well
# as being swept up by `nyxgpt.resources`'s own `**/*`. The file is therefore
# collected TWICE, and `exclude_data_files` only applies a pattern to the
# package it is keyed under (`spec.get(package)` in setuptools' build_py), so
# either copy alone still reaches the wheel. Both were verified by building
# one: with only the `nyxgpt.resources` entry below, and with only the
# per-package key after it, the built wheel still contained the secret.
# `.terraform/` needs no second key because it is not a legal package name
# and so is never split off. tests/unit/test_resources_packaging.py plants
# both secrets before the build, so a wheel that carries one fails the suite
# rather than shipping.
"nyxgpt.resources" = [
  "docker/config.docker.ini",
  "k8s/secret.yaml",
  "k8s/observability/secret.yaml",
  "terraform/aws/.terraform/*",
  "terraform/aws/.terraform/**/*",
  "terraform/aws/.terraform.lock.hcl",
  "terraform/aws/*.tfstate",
  "terraform/aws/*.tfstate.*",
  "terraform/aws/*.tfvars",
  "terraform/aws/tfplan",
]
# Keyed by the namespace package that actually owns the file -- see above.
"nyxgpt.resources.k8s.observability" = ["secret.yaml"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

# Ignore missing imports for third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "frontmatter",
    "cassandra.*",
    "pdfplumber",
    "reportlab.*",
    "docx.*",
    "pptx.*",
    "ebooklib.*",
    "pytesseract",
    "pdf2image",
    "PIL.*",
    "fastapi",
    "fastapi.*",
    "starlette.*",
    "pydantic",
    "pydantic.*",
    "bs4",
    "pypdf",
    "httpx",
    "tiktoken",
    "psutil",
    "markdown",
    "opentelemetry.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["nyxgpt"]

[tool.interrogate]
# Docstring-coverage gate (issue #3225). Nested/closure functions and classes
# (e.g. retry-callback closures) are exempt as trivial implementation
# details of an already-documented enclosing function.
ignore-nested-functions = true
ignore-nested-classes = true
fail-under = 100
verbose = 1
exclude = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.bandit]
# SAST scan of runtime code only -- tests intentionally exercise things
# bandit flags out of context (e.g. hardcoded test fixtures, subprocess
# calls against local test services). See security/README.md for the CI
# gate (severity/confidence thresholds) and suppression conventions (#3501).
exclude_dirs = ["tests", ".venv", "venv", "web"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
