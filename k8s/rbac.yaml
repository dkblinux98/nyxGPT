apiVersion: v1
kind: ServiceAccount
metadata:
  name: nyxgpt-api
  namespace: nyxgpt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nyxgpt-api-deploy-ops
  namespace: nyxgpt
  # Grants exactly what deploy.py/canary.py's kubectl calls need (see
  # docs/kubernetes.md#bluegreen-deployment and #canary-deployment): read
  # access to check Deployment health, patch the Service selector to cut
  # blue/green traffic over, and scale the stable/canary Deployments'
  # replica counts -- plus what self_heal.py's watchdog needs (see
  # docs/self-healing.md#kubernetes-mode) to list this namespace's
  # nyxgpt-api Pods and delete one to force its Deployment/ReplicaSet to
  # recreate it. No broader cluster access than that -- in particular, no
  # access to Secrets, ConfigMaps, or any resource outside this namespace.
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nyxgpt-api-deploy-ops
  namespace: nyxgpt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nyxgpt-api-deploy-ops
subjects:
  - kind: ServiceAccount
    name: nyxgpt-api
    namespace: nyxgpt
