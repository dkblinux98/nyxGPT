apiVersion: v1
kind: ServiceAccount
metadata:
  name: nyxgpt-api
  namespace: nyxgpt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nyxgpt-api-deploy-ops
  namespace: nyxgpt
  # Grants exactly what canary.py's kubectl calls need (see
  # docs/kubernetes.md#canary-deployment): read access to check Deployment
  # health, patch a Deployment's image to deploy a new version (`kubectl set
  # image`, `nyxgpt canary deploy`/promote), and scale the stable/canary
  # Deployments' replica counts to shift traffic -- plus what self_heal.py's
  # watchdog needs (see docs/self-healing.md#kubernetes-mode) to list this
  # namespace's nyxgpt-api Pods and delete one to force its
  # Deployment/ReplicaSet to recreate it. No broader cluster access than
  # that -- in particular, no access to Secrets, ConfigMaps, or any resource
  # outside this namespace. (Blue/green's Service-selector patch permission
  # was retired along with deploy.py -- see #3409.)
  #
  # `pods/proxy` (get) is what makes the canary gate honest (#3829): it lets
  # canary.py read the /metrics of the Pods carrying `track=canary`
  # specifically, instead of judging the rollout by the counters of whichever
  # Pod happens to be serving the dashboard request. Read-only, one verb, and
  # the proxied endpoint (/metrics) is the same unauthenticated one Prometheus
  # scrapes.
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nyxgpt-api-deploy-ops
  namespace: nyxgpt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nyxgpt-api-deploy-ops
subjects:
  - kind: ServiceAccount
    name: nyxgpt-api
    namespace: nyxgpt
