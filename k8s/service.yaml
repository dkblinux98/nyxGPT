apiVersion: v1
kind: Service
metadata:
  name: nyxgpt-api
  namespace: nyxgpt
spec:
  # Selects Pods from BOTH nyxgpt-api-stable and nyxgpt-api-canary (they share
  # the app: nyxgpt-api-canary-pool label) -- the same selector as
  # service-canary.yaml. This is the primary in-cluster entry point for the
  # api; traffic split between stable/canary is managed by replica count via
  # `nyxgpt canary start/promote/rollback` (see docs/kubernetes.md), not by
  # this selector. Blue/green (a `color` selector flip) was retired -- see #3409.
  selector:
    app: nyxgpt-api-canary-pool
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
