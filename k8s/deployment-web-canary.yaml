apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyxgpt-web-canary
  namespace: nyxgpt
  labels:
    app: nyxgpt-web-canary-pool
    track: canary
spec:
  # Starts at 0 replicas -- `nyxgpt canary start --component web` scales this
  # up to the requested traffic weight. Managed by `nyxgpt canary
  # start/promote/rollback --component web` (see docs/kubernetes.md). Do not
  # attach an HPA to this Deployment -- autoscaling would fight the canary
  # tool's replica-count-based traffic split.
  replicas: 0
  selector:
    matchLabels:
      app: nyxgpt-web-canary-pool
      track: canary
  template:
    metadata:
      labels:
        app: nyxgpt-web-canary-pool
        track: canary
    spec:
      containers:
        - name: nyxgpt-web
          image: nyxgpt-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NYXGPT_API_BASE_URL
              value: "http://nyxgpt-api:8000"
            - name: NYXGPT_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-secrets
                  key: api-key
            # The web tier is a Next.js process: it reads its tracing wiring
            # from the environment (web/src/instrumentation.ts), NOT from
            # k8s/configmap.yaml, so the collector rewrite that file makes for
            # the api has to be repeated here (#3990). Left unset, the default
            # in that file is `http://localhost:4318/v1/traces` -- which inside
            # this Pod is this Pod, so every span the web tier produced was
            # dropped and Jaeger only ever knew about itself.
            - name: NYXGPT_TRACING_ENABLED
              value: "true"
            - name: NYXGPT_OTLP_ENDPOINT
              value: "http://otel-collector:4318/v1/traces"
            # Same per-install DSN the api gets, for the errors this tier
            # reports itself (route handlers and browser reports, see
            # instrumentation.ts `onRequestError`). Empty until
            # `nyxgpt ops install --kubernetes` has provisioned GlitchTip.
            - name: NYXGPT_ERROR_TRACKING_DSN
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-secrets
                  key: error-tracking-dsn
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            # Tracks deployment-web-stable.yaml -- see the note there and in
            # deployment-canary.yaml: the canary Pod schedules last, so it is
            # the first casualty of an over-reserved node (#3825).
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
