apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyxgpt-web-canary
  namespace: nyxgpt
  labels:
    app: nyxgpt-web-canary-pool
    track: canary
spec:
  # Starts at 0 replicas -- `nyxgpt canary start --component web` scales this
  # up to the requested traffic weight. Managed by `nyxgpt canary
  # start/promote/rollback --component web` (see docs/kubernetes.md). Do not
  # attach an HPA to this Deployment -- autoscaling would fight the canary
  # tool's replica-count-based traffic split.
  replicas: 0
  selector:
    matchLabels:
      app: nyxgpt-web-canary-pool
      track: canary
  template:
    metadata:
      labels:
        app: nyxgpt-web-canary-pool
        track: canary
    spec:
      containers:
        - name: nyxgpt-web
          image: nyxgpt-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NYXGPT_API_BASE_URL
              value: "http://nyxgpt-api:8000"
            - name: NYXGPT_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-secrets
                  key: api-key
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            # Tracks deployment-web-stable.yaml -- see the note there and in
            # deployment-canary.yaml: the canary Pod schedules last, so it is
            # the first casualty of an over-reserved node (#3825).
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
