# Self-hosted error tracking (GlitchTip), the `errors` half of the
# observability layer: Postgres, Redis, the web app, and the Celery worker.
# Exception data stays inside this cluster -- nothing talks to Sentry SaaS,
# exactly as in Compose mode.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip-postgres
  namespace: nyxgpt
  labels:
    app: glitchtip-postgres
    tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glitchtip-postgres
  template:
    metadata:
      labels:
        app: glitchtip-postgres
        tier: observability
    spec:
      containers:
        - name: postgres
          image: postgres:16.14
          env:
            - name: POSTGRES_USER
              value: glitchtip
            - name: POSTGRES_DB
              value: glitchtip
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-observability-secrets
                  key: glitchtip-postgres-password
            # The image refuses to initialise into a non-empty mount root;
            # a subdirectory keeps it happy on any volume type.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "glitchtip"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        # Ephemeral for the same reason as Prometheus/Loki above: `nyxgpt ops
        # down --kubernetes` deletes the local cluster outright.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: glitchtip-postgres
  namespace: nyxgpt
  labels:
    app: glitchtip-postgres
    tier: observability
spec:
  selector:
    app: glitchtip-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip-redis
  namespace: nyxgpt
  labels:
    app: glitchtip-redis
    tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glitchtip-redis
  template:
    metadata:
      labels:
        app: glitchtip-redis
        tier: observability
    spec:
      containers:
        - name: redis
          image: redis:7.4.9-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: glitchtip-redis
  namespace: nyxgpt
  labels:
    app: glitchtip-redis
    tier: observability
spec:
  selector:
    app: glitchtip-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip
  namespace: nyxgpt
  labels:
    app: glitchtip
    tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glitchtip
  template:
    metadata:
      labels:
        app: glitchtip
        tier: observability
    spec:
      initContainers:
        # Compose runs migrations as a one-shot `glitchtip-migrate` service.
        # A Kubernetes Job would be the literal translation, but a Job's spec
        # is immutable once created, so re-applying this overlay after an
        # image bump would fail on it. An initContainer re-runs the same
        # `manage.py migrate` on every rollout, is idempotent by Django's own
        # design, and retries on its own until Postgres accepts connections.
        - name: migrate
          image: glitchtip/glitchtip:6.2.0
          command: ["./manage.py", "migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-observability-secrets
                  key: glitchtip-database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-observability-secrets
                  key: glitchtip-secret-key
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      containers:
        - name: glitchtip
          image: glitchtip/glitchtip:6.2.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-observability-secrets
                  key: glitchtip-database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-observability-secrets
                  key: glitchtip-secret-key
            - name: REDIS_URL
              value: redis://glitchtip-redis:6379/0
            - name: PORT
              value: "8080"
            - name: EMAIL_URL
              value: consolemail://
            # The operator reaches GlitchTip through `nyxgpt ops
            # port-forward --target glitchtip`, which publishes it on the
            # same local port Compose mode does.
            - name: GLITCHTIP_DOMAIN
              value: http://localhost:8080
            - name: DEFAULT_FROM_EMAIL
              value: errors@nyxgpt.local
            - name: CELERY_WORKER_AUTOSCALE
              value: "1,3"
            - name: CELERY_WORKER_MAX_TASKS_PER_CHILD
              value: "10000"
            # Self-registration let anyone reaching the UI mint their own org
            # and shadow the provisioned project (#3565) -- accounts come
            # from `nyxgpt ops glitchtip-init` only.
            - name: ENABLE_USER_REGISTRATION
              value: "False"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            # 256Mi, not the old 512Mi (#3825): the web tier measures ~146Mi
            # in steady state, and the Pod's effective request is already
            # floored at the 256Mi its migrate initContainer above asks for,
            # so reserving more bought nothing but an unschedulable
            # prometheus. Limit unchanged for the ingest bursts.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: glitchtip
  namespace: nyxgpt
  labels:
    app: glitchtip
    tier: observability
spec:
  # Name matches the Compose service: Grafana's GlitchTip (Infinity)
  # datasource queries `http://glitchtip:8080`.
  selector:
    app: glitchtip
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glitchtip-worker
  namespace: nyxgpt
  labels:
    app: glitchtip-worker
    tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glitchtip-worker
  template:
    metadata:
      labels:
        app: glitchtip-worker
        tier: observability
    spec:
      # Compose expresses this container's start-up order explicitly --
      # `depends_on` glitchtip-redis `service_healthy`, glitchtip-postgres
      # `service_healthy` and glitchtip-migrate
      # `service_completed_successfully`. This overlay stated none of it, and
      # Kubernetes has no `depends_on`, so the worker Pod started in parallel
      # with Redis and Postgres coming up. That is the #4208 defect, and it is
      # unrecoverable rather than slow: `runworker`'s FIRST act is
      # `Worker.run()` -> `backend._rescue_tasks()`, an unguarded Valkey call,
      # and the scheduler's first act is `acquire_lock`. Measured on this
      # image -- a worker started while the broker was not yet accepting
      # connections processed 0 of 0 tasks and never recovered, with the
      # container `running` and 0 restarts, whether the Service name was
      # unresolvable or resolved to a closed port; the same image started
      # after Redis was accepting processed 91 of 92. #4182 read the symptom
      # as queue latency and raised the smoke wait from 120s to 240s; no
      # deadline helps, because nothing is in flight.
      #
      # So the dependency is stated the only way Kubernetes offers: the
      # worker's own process does not begin until its datastores will answer.
      initContainers:
        - name: wait-for-redis
          # Same image as the glitchtip-redis Deployment above, for the
          # `redis-cli` the glitchtip image does not carry.
          image: redis:7.4.9-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h glitchtip-redis -p 6379 ping; do
                echo "waiting for glitchtip-redis to accept connections"
                sleep 2
              done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: wait-for-migrations
          image: glitchtip/glitchtip:6.2.0
          # Compose's `glitchtip-migrate: service_completed_successfully` and
          # `glitchtip-postgres: service_healthy` in one question, asked of
          # the only authority on it. `migrate --check` exits 0 only when no
          # migration is unapplied, and non-zero both when some are and when
          # Postgres will not answer (verified against this image: 0 on a
          # migrated database, 1 on an unreachable one). It applies nothing,
          # so it cannot race the `migrate` initContainer on the glitchtip
          # Deployment that does.
          command:
            - sh
            - -c
            - |
              until ./manage.py migrate --check; do
                echo "waiting for glitchtip migrations to be applied"
                sleep 3
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-observability-secrets
                  key: glitchtip-database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-observability-secrets
                  key: glitchtip-secret-key
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      containers:
        - name: worker
          image: glitchtip/glitchtip:6.2.0
          command: ["./bin/run-celery-with-beat.sh"]
          ports:
            # Declared for documentation and for `kubectl port-forward`; the
            # probes below reach it on 127.0.0.1 inside the container, and
            # nothing else consumes it. There is deliberately no Service and
            # no Prometheus scrape job: prometheus.yaml has two static jobs
            # (nyxgpt-api, prometheus) and no Kubernetes service discovery, so
            # adding one would be a new moving part this defect does not need.
            # `nyxgpt ops status` reads the same page through `kubectl exec`.
            - name: metrics
              containerPort: 9090
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-observability-secrets
                  key: glitchtip-database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-observability-secrets
                  key: glitchtip-secret-key
            - name: REDIS_URL
              value: redis://glitchtip-redis:6379/0
            - name: EMAIL_URL
              value: consolemail://
            - name: CELERY_WORKER_AUTOSCALE
              value: "1,3"
            - name: CELERY_WORKER_MAX_TASKS_PER_CHILD
              value: "10000"
            # Read by django_vtasks/conf.py. Kept for the Compose twin's
            # parity and for `runworker`'s own heartbeat, but deliberately NOT
            # what the probes below read: in a reproduction of the #4208 wedge
            # this file's mtime was measured FRESH while the consumer was
            # doing nothing at all, because `Worker.run()` had not returned
            # and so `_heartbeat_loop` kept writing. See
            # glitchtip-worker-ready.py.
            - name: VTASKS_HEALTH_CHECK_FILE
              value: /tmp/vtasks_health_check
            # Turns the consumer's own counters into something a probe can
            # read. `runworker` starts this server before it starts either
            # half, so it answers even when the worker is wedged -- which is
            # exactly what makes "served, but publishing no consumer metrics"
            # a usable signal.
            - name: VTASKS_METRICS_PORT
              value: "9090"
          volumeMounts:
            - name: probe
              mountPath: /etc/nyxgpt/probes
              readOnly: true
          # Ready means CONSUMING, not running (#4208 AC1). This Deployment
          # fronts no Service, so NotReady routes nothing away from anything;
          # what it does is make the half-dead state visible to every surface
          # that already reads readiness -- `kubectl get pods`, the
          # `nyxgpt ops status` workload lines and the SRE dashboard rows that
          # read them, and scripts/k8s-local-smoke.sh's rollout wait -- instead
          # of teaching each of those about vtasks separately.
          readinessProbe:
            exec:
              command:
                - python
                - /etc/nyxgpt/probes/glitchtip-worker-ready.py
            # The worker has to boot Django and take the scheduler lock before
            # its first task; 40s is comfortably past that on a ballasted
            # node, and the start-up wedge this catches is permanent, so
            # nothing is lost by asking later.
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          # And a restart is the recovery, because the wedge cannot clear
          # itself: the consumer only ever calls `_rescue_tasks` once, at
          # start-up. By the time this fires, whatever was not accepting
          # connections at boot has had minutes to come up, so the restarted
          # process gets past it -- the same reason the Compose twin's
          # `restart: unless-stopped` works once something declares the
          # container unhealthy. Deliberately slacker than readiness
          # (--max-stall-seconds 420 against readiness's 180, x3 failures):
          # NotReady is a report and should be prompt, while a restart throws
          # away in-flight work and must be sure.
          livenessProbe:
            exec:
              command:
                - python
                - /etc/nyxgpt/probes/glitchtip-worker-ready.py
                - --max-stall-seconds
                - "420"
                - --state-file
                - /tmp/nyxgpt-glitchtip-worker-liveness.state
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        # Generated by kustomize from k8s/observability/
        # glitchtip-worker-ready.py -- see kustomization.yaml. One file, read
        # by both substrates, so the Kubernetes probes and the Compose
        # healthcheck cannot drift into disagreeing about what "the worker is
        # healthy" means.
        - name: probe
          configMap:
            name: glitchtip-worker-probe
