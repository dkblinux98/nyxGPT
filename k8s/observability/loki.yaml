# Loki, the log store behind Grafana's Loki datasource and Logs Drilldown.
# Config mirrors docker/loki-config.yml (single-binary, filesystem storage,
# 14-day retention) -- it needs no host-specific paths, so the only reason
# it is restated here rather than reused is kustomize's inability to read
# files above its own root.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: nyxgpt
data:
  local-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 336h
      reject_old_samples: true
      reject_old_samples_max_age: 168h

    compactor:
      working_directory: /loki/compactor
      delete_request_store: filesystem
      retention_enabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: nyxgpt
  labels:
    app: loki
    tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        tier: observability
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.6.13
          args:
            - -config.file=/etc/loki/local-config.yaml
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: nyxgpt
  labels:
    app: loki
    tier: observability
spec:
  # Name matches the Compose service: Grafana's shared datasource
  # provisioning points at `http://loki:3100`.
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
  type: ClusterIP
