# OpenTelemetry collector: the OTLP endpoint the API exports spans to,
# forwarding into Jaeger. Same topology and same config as Compose mode
# (docker/otel-collector-config.yaml) -- in-cluster the API reaches it at
# `http://otel-collector:4318` instead of the host-published port, which is
# what the app tier's OTEL_EXPORTER_OTLP_ENDPOINT must point at in this mode.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: nyxgpt
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      batch: {}

    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: nyxgpt
  labels:
    app: otel-collector
    tier: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        tier: observability
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.157.0
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
          # No HTTP readiness probe: the contrib image is built FROM scratch
          # and exposes no health endpoint by default -- the same reason its
          # Compose service carries no healthcheck. A TCP probe on the OTLP
          # receiver is the strongest signal available.
          readinessProbe:
            tcpSocket:
              port: otlp-http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: nyxgpt
  labels:
    app: otel-collector
    tier: observability
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
  type: ClusterIP
