# Template for k8s/observability/secret.yaml, which is NEVER committed
# (see .gitignore) -- `nyxgpt ops install/observability --kubernetes`
# bootstraps the real file from this one and fills it from ~/.nyxGPT/config.ini
# (`_ensure_k8s_observability_secret` in src/nyxgpt/ops.py).
#
# Every value here is a working placeholder, not a blank: Grafana resolves
# the Slack webhook and the GlitchTip API token through `$__file{}`
# provisioning expansion at startup, and its alerting validator refuses to
# boot on an EMPTY contact-point URL (#3538). An unconfigured webhook must
# therefore still be a non-functional-but-present string, exactly as the
# Compose path's `_ensure_grafana_secret_placeholders` writes one.
apiVersion: v1
kind: Secret
metadata:
  name: nyxgpt-observability-secrets
  namespace: nyxgpt
type: Opaque
stringData:
  # Grafana's own admin login (user `admin`). Overwritten from
  # [monitoring] grafana_admin_password when config.ini sets it.
  grafana-admin-password: "change-me"
  # Mounted at /etc/nyxgpt-secrets/slack-webhook-url for
  # docker/grafana/provisioning/alerting/contact-points.yml.
  slack-webhook-url: "https://hooks.slack.invalid/UNCONFIGURED"
  # Mounted at /etc/nyxgpt-secrets/glitchtip-grafana-token for
  # docker/grafana/provisioning/datasources/glitchtip.yml.
  glitchtip-grafana-token: "UNCONFIGURED-glitchtip-token"
  # GlitchTip's Django SECRET_KEY and its Postgres password. Local-cluster
  # substrate values: GlitchTip here is reachable only from inside the
  # cluster (ClusterIP) or through `nyxgpt ops port-forward`.
  glitchtip-secret-key: "nyxgpt-local-glitchtip-secret-key"
  glitchtip-postgres-password: "glitchtip"
  # Django reads the password inline in the URL, so this must stay
  # consistent with glitchtip-postgres-password above -- `nyxgpt ops`
  # rewrites both together.
  glitchtip-database-url: "postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip"
