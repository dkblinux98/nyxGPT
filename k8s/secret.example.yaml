apiVersion: v1
kind: Secret
metadata:
  name: nyxgpt-secrets
  namespace: nyxgpt
type: Opaque
stringData:
  # Copy this file to secret.yaml, replace the value below, and apply
  # secret.yaml instead (it is gitignored so real keys never get committed).
  api-key: "change-me"
  # The GlitchTip DSN the api and web Pods report errors to (#3990). Left
  # EMPTY here on purpose: GlitchTip mints a new project key per install, so
  # there is no value a template can carry. `nyxgpt ops install --kubernetes`
  # provisions the in-cluster GlitchTip and writes the real DSN into this key
  # (`_k8s_provision_glitchtip` in src/nyxgpt/ops.py, the Kubernetes
  # equivalent of `nyxgpt ops glitchtip-init`).
  #
  # The KEY must exist even when empty: k8s/deployment-{stable,canary}.yaml
  # and their web counterparts reference it through `secretKeyRef`, and a
  # missing key leaves every app Pod in CreateContainerConfigError rather
  # than merely without error tracking.
  error-tracking-dsn: ""
