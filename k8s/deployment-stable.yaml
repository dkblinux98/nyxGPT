apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyxgpt-api-stable
  namespace: nyxgpt
  labels:
    app: nyxgpt-api-canary-pool
    track: stable
spec:
  # Managed by `nyxgpt canary start/promote/rollback` (see docs/kubernetes.md).
  # Do not attach an HPA to this Deployment -- autoscaling would fight the
  # canary tool's replica-count-based traffic split.
  #
  # RESTS AT 1 (#3833). This used to ship `replicas: 4` so that a rollout
  # could carve a 25% traffic step out of a standing pool -- which charged
  # every install 3072Mi of reservations, including single-node local ones
  # where 4 replicas buy no HA at all. `nyxgpt canary start` now GROWS the
  # pool for the duration of a rollout and returns it to whatever count it
  # finds here, so raising this number is still how you get more steady-state
  # capacity, and nothing re-inflates it behind your back.
  replicas: 1
  selector:
    matchLabels:
      app: nyxgpt-api-canary-pool
      track: stable
  template:
    metadata:
      labels:
        app: nyxgpt-api-canary-pool
        track: stable
    spec:
      serviceAccountName: nyxgpt-api
      containers:
        - name: nyxgpt-api
          image: nyxgpt-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: NYXGPT_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-secrets
                  key: api-key
            # The GlitchTip DSN this deployment reports errors to (#3990).
            # Provisioned per-install by `nyxgpt ops install --kubernetes`
            # (`_k8s_provision_glitchtip`) into the nyxgpt-secrets Secret and
            # merged into `[error_tracking] dsn` by docker/entrypoint.sh --
            # the api reads config.ini, not the environment. It cannot be
            # baked into k8s/configmap.yaml because GlitchTip mints a new
            # project key per install. Empty until provisioning has run (and
            # on a `--skip-observability` install), which leaves error
            # tracking inert rather than misdirected.
            - name: NYXGPT_ERROR_TRACKING_DSN
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-secrets
                  key: error-tracking-dsn
          volumeMounts:
            - name: config
              mountPath: /etc/nyxgpt/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            # The REQUEST reserves node capacity at schedule time; the LIMIT
            # contains the peak. Four replicas at the old 512Mi request
            # reserved 2Gi of an 8Gi workstation node to run ~300Mi of actual
            # process, which is what left prometheus (and later the canary
            # Pod) Pending on a default kind node (#3825). 256Mi covers the
            # api's steady state with room above the ~75Mi measured at light
            # load; the 1Gi limit below is unchanged, so a RAG or concurrent
            # chat burst still has the same ceiling it always had.
            #
            # Same reasoning for cpu: four replicas at 250m reserved a whole
            # core of a 4-core VM to serve an idle stack, and CPU is what
            # actually blocked the canary Pod once the memory was right. The
            # 1-core limit is unchanged.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: nyxgpt-config
