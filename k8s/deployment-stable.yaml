apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyxgpt-api-stable
  namespace: nyxgpt
  labels:
    app: nyxgpt-api-canary-pool
    track: stable
spec:
  # Managed by `nyxgpt canary start/promote/rollback` (see docs/kubernetes.md).
  # Do not attach an HPA to this Deployment -- autoscaling would fight the
  # canary tool's replica-count-based traffic split.
  replicas: 4
  selector:
    matchLabels:
      app: nyxgpt-api-canary-pool
      track: stable
  template:
    metadata:
      labels:
        app: nyxgpt-api-canary-pool
        track: stable
    spec:
      serviceAccountName: nyxgpt-api
      containers:
        - name: nyxgpt-api
          image: nyxgpt-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: NYXGPT_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-secrets
                  key: api-key
          volumeMounts:
            - name: config
              mountPath: /etc/nyxgpt/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: nyxgpt-config
