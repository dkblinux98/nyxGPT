apiVersion: v1
kind: ConfigMap
metadata:
  name: nyxgpt-config
  namespace: nyxgpt
data:
  config.ini: |
    [nyxgpt]
    default_model = qwen3:0.6b
    chat_timeout_seconds = 180
    # Chat session storage backend. "file" keeps sessions on each pod's own
    # filesystem, which forks the session list per pod/replica -- and the
    # stable Deployment is not pinned to one Pod: a canary rollout grows the
    # pool (#3833) and every restart replaces the Pod, so consecutive
    # requests from one browser would land on different pods and see
    # different sessions. This deployment therefore
    # uses "cassandra" (#3786), backed by the in-cluster Cassandra in
    # k8s/statefulset-cassandra.yaml, so every replica -- and every other
    # deployment mode -- shares one session list. See docs/session-storage.md.
    # Can also be overridden per-pod via the NYXGPT_SESSION_BACKEND env var.
    session_backend = cassandra
    sessions_dir = /root/.nyxGPT/sessions
    vectorstore_dir = /root/.nyxGPT/vectorstore

    [logging]
    level = INFO
    dir = /root/.nyxGPT/logs

    [ollama]
    # The in-cluster Ollama (k8s/statefulset-ollama.yaml + service-ollama.yaml,
    # #3786), reached by its Service name -- the same hostname the Compose and
    # Terraform deployments use. This replaced `host.docker.internal:11434`,
    # which does not resolve from a Pod on Linux clusters and pointed at a host
    # Ollama that `nyxgpt ops install --kubernetes --local` stops anyway: the
    # stack came up with no reachable LLM and no chat was possible.
    base_url = http://ollama:11434

    [api]
    # 0.0.0.0 here is the pod's network namespace, not the host's -- required
    # so kube-proxy can route Service traffic to the container at all (see
    # k8s/service.yaml, k8s/service-canary.yaml: both are `type: ClusterIP`
    # with no NodePort/LoadBalancer/Ingress, so nothing routes this outside
    # the cluster). This is not the same exposure as binding 0.0.0.0 in the
    # native or Compose deployment (docs/security.md#network-security) --
    # reviewed as part of #3195. Auth is enabled below regardless, since the
    # API is still reachable cluster-wide rather than just localhost.
    host = 0.0.0.0
    port = 8000

    [auth]
    # The API is reachable cluster-wide rather than just localhost, so auth
    # is enabled here. The key itself is injected from the nyxgpt-secrets
    # Secret (see secret.example.yaml) and merged in by docker/entrypoint.sh.
    enabled = true
    api_key =
    header = X-API-Key

    [rate_limit]
    enabled = false

    [rag]
    # Off by default, matching the native/Compose default in
    # example.config.ini -- RAG chat context only helps once you have
    # ingested documents. The Cassandra it needs IS part of this deployment
    # (k8s/statefulset-cassandra.yaml, #3786) and cassandra_hosts below
    # already points at it, so turning this on is a one-line change, not a
    # bring-your-own-database exercise.
    enable_chat_context = false
    # Pre-pulled by the ollama StatefulSet's postStart hook, and required by
    # its readiness probe, exactly like default_model above (#3824): RAG is a
    # per-session toggle, so the embedding model has to be there even while
    # `enable_chat_context` is false. Keep identical to
    # NYXGPT_EMBEDDING_MODEL in k8s/statefulset-ollama.yaml --
    # tests/unit/test_k8s_manifests.py asserts the two match.
    embedding_model = nomic-embed-text
    embedding_dim = 768
    cassandra_hosts = cassandra
    cassandra_port = 9042
    cassandra_keyspace = nyxgpt
    cassandra_table = rag_chunks

    [tracing]
    # THE CONTAINER-NETWORK REWRITE THIS FILE USED TO OMIT (#3990). Without a
    # [tracing] section the api falls back to config.py's default
    # `http://localhost:4318/v1/traces`, which inside a Pod is *that Pod* --
    # so every span was exported into a socket nothing listens on, the
    # OTLPSpanExporter dropped them silently (it is fire-and-forget by
    # design), otel-collector received nothing, and Jaeger knew exactly one
    # service: itself. An operator saw "traces in Jaeger, nothing in
    # Grafana", which is not a Grafana defect at all.
    #
    # `otel-collector` is the Service in k8s/observability/otel-collector.yaml
    # -- the same hostname the Compose/Terraform deploys rewrite this to
    # (`_COMPOSE_CONFIG_OVERRIDES` in src/nyxgpt/ops.py). The web tier is
    # wired to the same collector through NYXGPT_OTLP_ENDPOINT in
    # k8s/deployment-web-{stable,canary}.yaml: it is a Next.js process and
    # reads env, not this file.
    enabled = true
    service_name = nyxgpt-api
    otlp_endpoint = http://otel-collector:4318/v1/traces
    # BROWSER-facing, so it stays localhost: the operator reaches Jaeger
    # through `nyxgpt ops port-forward --target jaeger`, which publishes it
    # on this exact port (K8S_PORT_FORWARD_TARGETS). Same split the Compose
    # path makes between service-to-service endpoints and *_ui_url values.
    jaeger_ui_url = http://localhost:16686

    [error_tracking]
    # The other omitted rewrite (#3990). With no [error_tracking] section the
    # api reported nothing to GlitchTip at all, so the SRE dashboard's error
    # panels were empty even once Grafana's token was valid.
    #
    # `dsn` is deliberately EMPTY here and filled at runtime, exactly like
    # `[auth] api_key` above: a DSN carries a per-install project key minted
    # by the in-cluster GlitchTip, so it cannot be a constant in a committed
    # manifest. `nyxgpt ops install --kubernetes` provisions it
    # (`_k8s_provision_glitchtip` in src/nyxgpt/ops.py -- the Kubernetes
    # equivalent of `nyxgpt ops glitchtip-init`), stores it in the
    # nyxgpt-secrets Secret, and docker/entrypoint.sh merges
    # NYXGPT_ERROR_TRACKING_DSN into this line on container start. An empty
    # DSN leaves error tracking inert rather than broken (see
    # error_tracking.init_error_tracking), which is what a
    # `--skip-observability` install should get.
    #
    # The DSN GlitchTip mints names its own browser-facing host, so ops
    # rewrites its host:port to the in-cluster `glitchtip:8080` Service
    # before storing it -- a Pod using the browser-facing localhost DSN
    # silently drops every event (#3565, the same failure in Compose).
    enabled = true
    dsn =
    # BROWSER-facing, like jaeger_ui_url above: `nyxgpt ops port-forward
    # --target glitchtip` publishes GlitchTip on this port.
    glitchtip_ui_url = http://localhost:8080
