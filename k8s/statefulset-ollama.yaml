# The deployment's LLM tier (#3786). Before this, k8s/configmap.yaml pointed
# the api at `host.docker.internal:11434` -- an address that does not resolve
# from a Pod on Linux clusters at all, and which pointed at a host Ollama that
# `nyxgpt ops install --kubernetes --local` has stopped anyway. The result was
# a stack whose Pods all reported Running and which could not answer a single
# chat message.
#
# A StatefulSet rather than a Deployment: `ollama serve` owns a single model
# blob store that it both reads and writes, so its Pod needs a stable identity
# and its own durable volume, and two Pods must never be started against the
# same one (the same storage argument that makes an Ollama *canary* pair
# infeasible -- see docs/kubernetes.md#ollama-canary-feasibility; this is one
# instance, not a stable/canary pair).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: nyxgpt
  labels:
    app: ollama
    tier: llm
spec:
  serviceName: ollama
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        tier: llm
    spec:
      containers:
        - name: ollama
          # Keep this pin identical to docker-compose.yml's `ollama` service
          # and terraform/main.tf's docker_image.ollama -- see
          # docs/docker-compose.md#image-pinning for the policy and how to
          # bump them together.
          image: ollama/ollama:0.32.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
          env:
            # The model the api asks for by default. MUST stay identical to
            # `[nyxgpt] default_model` in k8s/configmap.yaml -- a mismatch
            # means the pod is Ready with a model nobody requests, and chat
            # fails with a 404 from Ollama. tests/unit/test_k8s_manifests.py
            # asserts the two match.
            - name: NYXGPT_DEFAULT_MODEL
              value: qwen3.5:0.8b
            # The RAG embedding model, under the same contract against `[rag]
            # embedding_model` in k8s/configmap.yaml (#3824). Pulled and gated
            # on even though `enable_chat_context` ships false: RAG is a
            # per-session toggle the user can turn on at any moment, and
            # turning it on must not stall on a ~275 MB download.
            - name: NYXGPT_EMBEDDING_MODEL
              value: nomic-embed-text
          lifecycle:
            postStart:
              exec:
                # Pull the required models once the server is up, so a fresh
                # install can answer a chat message -- with RAG on or off --
                # without the operator pulling anything by hand. A model
                # already in the volume is skipped, which is what makes an
                # offline restart a no-op rather than a crash.
                #
                # It used to end in a blanket `|| true`, and that swallowed
                # every pull failure with no retry and no record (#3956
                # acceptance failure, 2026-08-22): cluster DNS was down, both
                # pulls failed instantly, the hook reported success, and the
                # Pod sat 0/1 forever behind a readiness probe that could
                # never pass. The deploy surfaced it as "Ollama did not become
                # ready in time" -- true, and three layers from the cause.
                #
                # So: retry with exponential backoff, and when the model is
                # STILL absent after the last attempt, exit non-zero. kubelet
                # kills the container and records the hook's output in a
                # `FailedPostStartHook` event, which is where the operator
                # can read the actual error -- `lookup registry.ollama.ai ...:
                # connection refused`, not a timeout on something three
                # layers downstream of it. The restart retries the pull, so a
                # genuinely transient outage still heals itself; what it no
                # longer does is heal itself silently and forever.
                #
                # The `ollama show` guard is what keeps the offline-restart
                # case exempt: a volume that already has both models never
                # reaches a pull, so it never reaches the failure exit.
                command:
                  - /bin/sh
                  - -c
                  - |
                    set -u
                    ERR_LOG=/root/.ollama/nyxgpt-model-pull.err
                    rm -f "$ERR_LOG"
                    until ollama list >/dev/null 2>&1; do sleep 2; done
                    rc=0
                    for model in "$NYXGPT_DEFAULT_MODEL" "$NYXGPT_EMBEDDING_MODEL"; do
                      [ -n "$model" ] || continue
                      ollama show "$model" >/dev/null 2>&1 && continue
                      attempt=1
                      delay=5
                      pulled=0
                      while [ "$attempt" -le 5 ]; do
                        if out="$(ollama pull "$model" 2>&1)"; then
                          pulled=1
                          break
                        fi
                        echo "nyxgpt: pull of '$model' failed (attempt $attempt/5): $out"
                        echo "pull of '$model' failed (attempt $attempt/5): $out" >> "$ERR_LOG"
                        attempt=$((attempt + 1))
                        [ "$attempt" -le 5 ] || break
                        sleep "$delay"
                        delay=$((delay * 2))
                      done
                      if [ "$pulled" -ne 1 ]; then
                        echo "nyxgpt: giving up on model '$model' after 5 attempts; last error: $out"
                        rc=1
                      fi
                    done
                    exit "$rc"
          readinessProbe:
            # Ready means "can serve a chat with the configured model, and an
            # embedding with the configured embedding model" -- not merely
            # "port is open". The Service must not get endpoints while either
            # is still downloading, or the first chat (or the first request
            # after RAG is toggled on) races the pull and fails.
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  ollama show "$NYXGPT_DEFAULT_MODEL" >/dev/null 2>&1 &&
                  ollama show "$NYXGPT_EMBEDDING_MODEL" >/dev/null 2>&1
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            # A cold pull of the default model over a slow link can take
            # several minutes; don't give up on it.
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # CPU inference on the default small model; sized for a
              # workstation cluster, not a GPU node. Raise both if you point
              # `[nyxgpt] default_model` at something bigger.
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
        # No storageClassName -- see the note in statefulset-cassandra.yaml.
