apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyxgpt-web-stable
  namespace: nyxgpt
  labels:
    app: nyxgpt-web-canary-pool
    track: stable
spec:
  # Managed by `nyxgpt canary start/promote/rollback --component web` (see
  # docs/kubernetes.md). Do not attach an HPA to this Deployment -- autoscaling
  # would fight the canary tool's replica-count-based traffic split.
  #
  # RESTS AT 1 (#3833), for the same reason as k8s/deployment-stable.yaml: the
  # canary pool is grown for a rollout and returned to this count afterwards,
  # so no install carries a standing inflated pool just to make canary
  # possible.
  replicas: 1
  selector:
    matchLabels:
      app: nyxgpt-web-canary-pool
      track: stable
  template:
    metadata:
      labels:
        app: nyxgpt-web-canary-pool
        track: stable
    spec:
      containers:
        - name: nyxgpt-web
          image: nyxgpt-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Server-side base URL the Next.js proxy routes use to reach the
            # api Service over the cluster network (see web/src/lib/apiProxy.ts)
            # -- mirrors docker-compose.yml's `web` service env.
            - name: NYXGPT_API_BASE_URL
              value: "http://nyxgpt-api:8000"
            - name: NYXGPT_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-secrets
                  key: api-key
            # The web tier is a Next.js process: it reads its tracing wiring
            # from the environment (web/src/instrumentation.ts), NOT from
            # k8s/configmap.yaml, so the collector rewrite that file makes for
            # the api has to be repeated here (#3990). Left unset, the default
            # in that file is `http://localhost:4318/v1/traces` -- which inside
            # this Pod is this Pod, so every span the web tier produced was
            # dropped and Jaeger only ever knew about itself.
            - name: NYXGPT_TRACING_ENABLED
              value: "true"
            - name: NYXGPT_OTLP_ENDPOINT
              value: "http://otel-collector:4318/v1/traces"
            # Same per-install DSN the api gets, for the errors this tier
            # reports itself (route handlers and browser reports, see
            # instrumentation.ts `onRequestError`). Empty until
            # `nyxgpt ops install --kubernetes` has provisioned GlitchTip.
            - name: NYXGPT_ERROR_TRACKING_DSN
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-secrets
                  key: error-tracking-dsn
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            # Reserve twice the ~96Mi a Next.js production server actually
            # holds, not the 256Mi four replicas used to reserve: that Gi of
            # reservation is part of what oversubscribed an 8Gi node (#3825).
            # The 512Mi limit is unchanged, so a render burst is unaffected.
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
