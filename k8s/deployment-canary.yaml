apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyxgpt-api-canary
  namespace: nyxgpt
  labels:
    app: nyxgpt-api-canary-pool
    track: canary
spec:
  # Starts at 0 replicas -- `nyxgpt canary start` scales this up to the
  # requested traffic weight. Managed by `nyxgpt canary start/promote/rollback`
  # (see docs/kubernetes.md). Do not attach an HPA to this Deployment --
  # autoscaling would fight the canary tool's replica-count-based traffic split.
  replicas: 0
  selector:
    matchLabels:
      app: nyxgpt-api-canary-pool
      track: canary
  template:
    metadata:
      labels:
        app: nyxgpt-api-canary-pool
        track: canary
    spec:
      serviceAccountName: nyxgpt-api
      containers:
        - name: nyxgpt-api
          image: nyxgpt-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: NYXGPT_AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-secrets
                  key: api-key
            # The GlitchTip DSN this deployment reports errors to (#3990).
            # Provisioned per-install by `nyxgpt ops install --kubernetes`
            # (`_k8s_provision_glitchtip`) into the nyxgpt-secrets Secret and
            # merged into `[error_tracking] dsn` by docker/entrypoint.sh --
            # the api reads config.ini, not the environment. It cannot be
            # baked into k8s/configmap.yaml because GlitchTip mints a new
            # project key per install. Empty until provisioning has run (and
            # on a `--skip-observability` install), which leaves error
            # tracking inert rather than misdirected.
            - name: NYXGPT_ERROR_TRACKING_DSN
              valueFrom:
                secretKeyRef:
                  name: nyxgpt-secrets
                  key: error-tracking-dsn
          volumeMounts:
            - name: config
              mountPath: /etc/nyxgpt/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            # Must track deployment-stable.yaml: `nyxgpt canary start` scales
            # this Deployment up on a node the stable pool is already sitting
            # on, so an over-reserved canary Pod is the one that cannot
            # schedule (#3825 -- "canary is broken" was really Insufficient
            # memory). Same request, same limit as stable.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: nyxgpt-config
