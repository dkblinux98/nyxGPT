apiVersion: v1
kind: Service
metadata:
  name: nyxgpt-web
  namespace: nyxgpt
spec:
  # Selects Pods from BOTH nyxgpt-web-stable and nyxgpt-web-canary (they share
  # the app: nyxgpt-web-canary-pool label) -- the same selector as
  # service-web-canary.yaml. This is the primary in-cluster entry point for
  # the web UI; traffic split between stable/canary is managed by replica
  # count via `nyxgpt canary start/promote/rollback --component web` (see
  # docs/kubernetes.md), not by this selector. Mirrors service.yaml's model
  # for the api component (#3409).
  selector:
    app: nyxgpt-web-canary-pool
  ports:
    - name: http
      port: 3000
      targetPort: http
  # STAYS ClusterIP here, deliberately (#3986). The local install publishes
  # this Service on the host by PATCHING it to a NodePort, but only on the
  # `kind` cluster nyxGPT provisions and only for the node ports that
  # cluster's `extraPortMappings` publish on 127.0.0.1
  # (`ops._publish_k8s_app_tier_nodeports`). Declaring the NodePort in the
  # base manifest instead would apply it everywhere these manifests are
  # applied -- including the AWS k3s deployment, whose invariant is that
  # nothing but port 22 is open on the instance (#3503, docs/security.md).
  # Same posture on a bring-your-own local cluster: nyxGPT does not open node
  # ports on a cluster it did not create, and reaches it through the managed
  # background forward instead.
  type: ClusterIP
