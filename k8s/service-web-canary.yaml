apiVersion: v1
kind: Service
metadata:
  name: nyxgpt-web-canary
  namespace: nyxgpt
spec:
  # Selects Pods from BOTH nyxgpt-web-stable and nyxgpt-web-canary (they
  # share the app: nyxgpt-web-canary-pool label). kube-proxy round-robins
  # across every matching Pod endpoint, so the canary's replica count
  # relative to the total is its approximate traffic share -- there is no
  # in-cluster proxy/ingress to configure, just `kubectl scale`
  # (see `nyxgpt canary start/promote/rollback --component web`).
  selector:
    app: nyxgpt-web-canary-pool
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
