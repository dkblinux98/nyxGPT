# Pre-commit hooks for nyxAgent
# See https://pre-commit.com for more information

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-yaml
        name: Check YAML syntax
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: detect-private-key

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: Lint YAML files
        # line-length is a WARNING, not an error (owner decision, 2026-08-22).
        # Three tracked files already exceeded 120 on v3.0.0 -- 13 lines in
        # macos-brew-smoke.yml, 49 in developer_auto_implement.yml, 1 in
        # docker-compose.yml -- none of them introduced by the commit that
        # tripped the hook. Because yamllint exits non-zero on errors, ANY
        # commit touching those files failed, and the usual escape is
        # `--no-verify`, which skips EVERY hook including detect-private-key
        # and detect-secrets. On 2026-08-22 detect-private-key caught a real
        # key literal (#3992) and end-of-file-fixer a missing newline (#3811)
        # in files agents merely touched; a blanket bypass would have skipped
        # both. Trading a style error for a warning keeps the security hooks
        # armed, which is the trade that matters. Every other yamllint rule
        # (syntax, truthy, indentation, ...) still errors and still blocks.
        args: ['-d', '{extends: default, rules: {line-length: {max: 120, level: warning}, document-start: disable}}']
        types: [yaml]

  # Check for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets in code
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

# Global settings
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
