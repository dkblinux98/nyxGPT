name: Retro Dashboard - Refresh All Data

# One dispatch refreshes every input the retrospective dashboard reads, in
# sequence, and lands them all on the default branch through one data pull
# request. The refresh session dispatches this once per pass instead of the
# five single-file dumps, then pulls, builds and publishes.
#
# Why one workflow (2026-09-17): the daily refresh had drifted to generating
# inputs locally in the session and dispatching only whichever dumps it chose.
# Each pass then refreshed a different subset -- churn was the slowest, so it
# was dropped most often -- and project_fields.json cannot be produced
# anywhere but here (it needs the project-scoped token and the Project
# GraphQL), so it went five days stale while every pass reported success. A
# workflow that produces all seven files leaves the session nothing to
# choose: it dispatches this, and the builder refuses (exit 3) to call a pass
# with a stale input a refresh.
#
# Every dump runs even if an earlier one fails, whatever was produced is
# published and landed, and the last step turns the run red naming each dump
# that did not land -- so a green run means EVERY file landed, and a red run
# says exactly which did not while the rest still did (#3808: a failed dump is
# reported, never skipped). The single-file dump workflows remain for
# re-running one named failure, one at a time.
#
# The dumps are call-per-item walks under one token, so each waits for the
# hourly REST budget before starting (scripts/retrospective/await_rate_limit.sh)
# rather than dying mid-walk the way the review-rounds dump did on 2026-09-17
# straight after a 76-minute churn dump.
#
# The snapshots do NOT get pushed at the dispatching branch: the default
# branch's ruleset requires a pull request, and the direct push was rejected
# with GH013 (#3815). publish_data_branch.sh puts them on claude/retro-data and
# merge_data_branch.sh lands them on the default branch through a pull request
# it opens, approves with a second agent identity (the ruleset requires one
# approving review and GitHub refuses self-approval, #3815) and merges.

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: "Days of run history the spend and churn dumps walk (each run or round costs an API call or a log download)"
        required: false
        default: "30"

# All retro workflows publish to and merge the same claude/retro-data branch,
# so they take turns rather than racing each other over it. GitHub keeps only
# the newest PENDING run per group, which is why this is one workflow and not
# five dispatched back to back.
concurrency:
  group: retro-data-branch
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: read
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Each dump is continue-on-error so a failure in one never costs the
      # others their refresh; the outcomes are read back in the last two steps.
      - name: Dump issue corpus and merged-PR times
        id: corpus
        continue-on-error: true
        run: |
          scripts/retrospective/await_rate_limit.sh
          python3 scripts/retrospective/dump_issue_corpus.py

      - name: Dump project fields
        id: project_fields
        continue-on-error: true
        env:
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          scripts/retrospective/await_rate_limit.sh
          scripts/retrospective/dump_project_fields.sh

      - name: Dump native relationships
        id: relationships
        continue-on-error: true
        run: |
          scripts/retrospective/await_rate_limit.sh
          python3 scripts/retrospective/dump_relationships.py
          jq '{generated_at, issues: (.issues | length)}' \
            scripts/retrospective/data/relationships.json

      - name: Dump review rounds
        id: review_rounds
        continue-on-error: true
        run: |
          scripts/retrospective/await_rate_limit.sh
          python3 scripts/retrospective/dump_review_rounds.py

      - name: Dump spend telemetry
        id: spend
        continue-on-error: true
        env:
          SPEND_WINDOW_DAYS: ${{ inputs.window_days }}
        run: |
          scripts/retrospective/await_rate_limit.sh
          python3 scripts/retrospective/dump_spend.py

      - name: Dump churn-cost telemetry
        id: churn
        continue-on-error: true
        env:
          CHURN_WINDOW_DAYS: ${{ inputs.window_days }}
          CHURN_PRICE_SHEET_JSON: ${{ vars.CHURN_PRICE_SHEET_JSON }}
        run: |
          scripts/retrospective/await_rate_limit.sh
          python3 scripts/retrospective/dump_churn.py

      - name: Publish every snapshot that was produced to the retro data branch
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
          OUTCOME_CORPUS: ${{ steps.corpus.outcome }}
          OUTCOME_PROJECT_FIELDS: ${{ steps.project_fields.outcome }}
          OUTCOME_RELATIONSHIPS: ${{ steps.relationships.outcome }}
          OUTCOME_REVIEW_ROUNDS: ${{ steps.review_rounds.outcome }}
          OUTCOME_SPEND: ${{ steps.spend.outcome }}
          OUTCOME_CHURN: ${{ steps.churn.outcome }}
        run: |
          set -euo pipefail
          d=scripts/retrospective/data
          files=()
          if [ "$OUTCOME_CORPUS" = success ]; then files+=("$d/all_issues.json" "$d/pr_times.json"); fi
          if [ "$OUTCOME_PROJECT_FIELDS" = success ]; then files+=("$d/project_fields.json"); fi
          if [ "$OUTCOME_RELATIONSHIPS" = success ]; then files+=("$d/relationships.json"); fi
          if [ "$OUTCOME_REVIEW_ROUNDS" = success ]; then files+=("$d/reviews_final.json" "$d/dashboard_data.json"); fi
          if [ "$OUTCOME_SPEND" = success ]; then files+=("$d/spend.json"); fi
          if [ "$OUTCOME_CHURN" = success ]; then files+=("$d/churn.json"); fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no dump produced anything; nothing to publish"
            exit 1
          fi
          echo "publishing: ${files[*]}"
          scripts/retrospective/publish_data_branch.sh \
            "chore(retro): refresh retrospective data" "${files[@]}"

      - name: Land it on the default branch
        env:
          # The publish above pushes with GITHUB_TOKEN, and a GITHUB_TOKEN push
          # deliberately does NOT trigger other workflows -- so this job lands
          # the refresh itself rather than relying on retro_data_merge.yml
          # firing (#3815). Opens and merges the data pull request.
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN || github.token }}
          # Approves it, as a DIFFERENT identity -- the base branch's
          # ruleset requires one approving review and GitHub refuses
          # self-approval, so the two tokens must not be the same agent.
          APPROVE_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          DATA_BRANCH: claude/retro-data
        run: scripts/retrospective/merge_data_branch.sh

      - name: Report every dump that did not land
        env:
          OUTCOME_CORPUS: ${{ steps.corpus.outcome }}
          OUTCOME_PROJECT_FIELDS: ${{ steps.project_fields.outcome }}
          OUTCOME_RELATIONSHIPS: ${{ steps.relationships.outcome }}
          OUTCOME_REVIEW_ROUNDS: ${{ steps.review_rounds.outcome }}
          OUTCOME_SPEND: ${{ steps.spend.outcome }}
          OUTCOME_CHURN: ${{ steps.churn.outcome }}
        run: |
          set -euo pipefail
          failed=()
          check() { if [ "$2" != success ]; then failed+=("$1 ($2)"); fi; }
          check "issue corpus + PR times (all_issues.json, pr_times.json)" "$OUTCOME_CORPUS"
          check "project fields (project_fields.json; re-run: retro_project_fields_dump.yml)" "$OUTCOME_PROJECT_FIELDS"
          check "native relationships (relationships.json; re-run: retro_relationships_dump.yml)" "$OUTCOME_RELATIONSHIPS"
          check "review rounds (reviews_final.json, dashboard_data.json; re-run: retro_review_rounds_dump.yml)" "$OUTCOME_REVIEW_ROUNDS"
          check "spend telemetry (spend.json; re-run: retro_spend_dump.yml)" "$OUTCOME_SPEND"
          check "churn cost (churn.json; re-run: retro_churn_dump.yml)" "$OUTCOME_CHURN"
          if [ "${#failed[@]}" -eq 0 ]; then
            echo "every retrospective input was refreshed and landed"
            exit 0
          fi
          {
            echo "## Dumps that did not land"
            for f in "${failed[@]}"; do echo "- $f"; done
            echo
            echo "The other inputs were published and landed. Read the failed step above, then re-run the named single-file dump (one at a time; they share a concurrency group)."
          } >> "$GITHUB_STEP_SUMMARY"
          for f in "${failed[@]}"; do echo "::error::dump did not land: $f"; done
          exit 1
