name: Sweep PR Status

# Backstop half of the #3742 PR lane invariant. PRs get Status "In Review"
# at creation (PR hygiene, #3307); the merge flow and the
# pull_request:closed handler now stamp them to "Closed" on the way out.
# This sweep catches what those two cannot reach: cards that predate the
# invariant (13 + 3 hand-swept on 2026-08-10, 10 on 2026-08-13) and any
# stamp that lost to a flaky API. Issues are never touched.
#
# Schedule applies changes (this is a self-healing invariant, not a
# proposal); manual dispatch defaults to dry-run so the owner can inspect
# first. The logic lives in scripts/agents/reconcile_pr_lane.sh so it is
# testable outside Actions.
#
# Note on the first run: GitHub only fires `schedule` from the DEFAULT
# branch, so the daily run starts once master fast-forwards at the next
# release ceremony. Until then — including the one-time backfill of the
# cards that were already stranded when this landed — dispatch this
# workflow against the release branch (Run workflow -> Branch: the active
# release branch, dry_run: false); the run then uses this branch's copy of
# both the workflow and the script.

on:
  schedule:
    # 07:20 UTC daily — after the overnight agent traffic, before the owner's day.
    - cron: '20 7 * * *'
  workflow_dispatch:
    inputs:
      source_status:
        description: 'Only sweep PRs currently in this Status (blank = every active lane)'
        required: false
        default: ''
      target_status:
        description: 'Status to move swept PRs to (blank = configured STATUS_CLOSED)'
        required: false
        default: ''
      dry_run:
        description: 'true = list only, false = apply'
        required: true
        default: 'true'

permissions:
  contents: read

concurrency:
  group: sweep-pr-status
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Write config
        run: |
          cat > /tmp/nyxgpt-config.ini <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          echo "NYXGPT_CONFIG_FILE=/tmp/nyxgpt-config.ini" >> "$GITHUB_ENV"

      - name: Sweep merged/closed PRs into the terminal lane
        env:
          SOURCE_STATUS: ${{ inputs.source_status }}
          TARGET_STATUS: ${{ inputs.target_status }}
          # Scheduled runs heal the board; manual runs honour the input.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: bash scripts/agents/reconcile_pr_lane.sh
