name: Sweep PR Status

# Admin helper: PRs get Status "In Review" at creation (PR hygiene, #3307)
# but nothing moves them after merge/close, so they accumulate and drown the
# owner's issue-acceptance queue. This sweep finds project items that are
# MERGED or CLOSED pull requests sitting in the source status and moves them
# to the target status. Issues are never touched. Dry-run by default.

on:
  workflow_dispatch:
    inputs:
      source_status:
        description: 'Only sweep PRs currently in this Status'
        required: true
        default: 'In Review'
      target_status:
        description: 'Status to move swept PRs to'
        required: true
        default: 'Closed'
      dry_run:
        description: 'true = list only, false = apply'
        required: true
        default: 'true'

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Write config
        run: |
          cat > /tmp/nyxgpt-config.ini <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          echo "NYXGPT_CONFIG_FILE=/tmp/nyxgpt-config.ini" >> "$GITHUB_ENV"

      - name: Sweep merged/closed PRs
        env:
          SOURCE_STATUS: ${{ inputs.source_status }}
          TARGET_STATUS: ${{ inputs.target_status }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          source scripts/agents/lib/gh_project.sh
          load_config
          require_gh_auth
          require_cmd python3
          project_id="$(get_project_id)"

          # Validate the target status option exists before touching anything.
          single_select_option_id "$STATUS_FIELD" "$TARGET_STATUS" >/dev/null

          read -r -d '' QUERY <<'GQL' || true
          query($project:ID!, $after:String){
            node(id:$project){
              ... on ProjectV2{
                items(first:100, after:$after){
                  pageInfo{ hasNextPage endCursor }
                  nodes{
                    id
                    content{
                      __typename
                      ... on PullRequest { number state title }
                    }
                    fieldValues(first:50){
                      nodes{
                        __typename
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          field{ ... on ProjectV2SingleSelectField { name } }
                          name
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          GQL

          page_file="$(mktemp)"
          targets_file="$(mktemp)"
          after=""
          while : ; do
            if [[ -n "$after" ]]; then
              graphql "$QUERY" -F project="$project_id" -f after="$after" > "$page_file"
            else
              graphql "$QUERY" -F project="$project_id" > "$page_file"
            fi

            STATUS_FIELD="$STATUS_FIELD" SOURCE_STATUS="$SOURCE_STATUS" \
            python3 - "$page_file" >> "$targets_file" <<'PY'
          import json, os, sys
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          status_field = os.environ.get("STATUS_FIELD", "Status")
          source = os.environ["SOURCE_STATUS"]
          for it in d["data"]["node"]["items"]["nodes"]:
              c = it.get("content") or {}
              if c.get("__typename") != "PullRequest":
                  continue
              if c.get("state") not in ("MERGED", "CLOSED"):
                  continue
              status = None
              for fv in it["fieldValues"]["nodes"]:
                  if fv.get("__typename") == "ProjectV2ItemFieldSingleSelectValue" \
                     and (fv.get("field") or {}).get("name") == status_field:
                      status = fv.get("name")
              if status == source:
                  print(f"{it['id']}\t{c['number']}\t{c['state']}\t{c['title']}")
          PY

            has_next="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); pi=d["data"]["node"]["items"]["pageInfo"]; print("yes" if pi["hasNextPage"] else "no")' "$page_file")"
            if [[ "$has_next" == "yes" ]]; then
              after="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["data"]["node"]["items"]["pageInfo"]["endCursor"])' "$page_file")"
            else
              break
            fi
          done

          count="$(wc -l < "$targets_file" | tr -d ' ')"
          echo "=== ${count} merged/closed PR(s) in '${SOURCE_STATUS}' (dry_run=${DRY_RUN}) ==="
          cut -f2- "$targets_file" | while IFS=$'\t' read -r num state title; do
            echo "PR|${num}|${state}|${title}"
          done

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: no changes applied."
            exit 0
          fi

          moved=0
          while IFS=$'\t' read -r item_id num state title; do
            set_project_field_value "$item_id" "$STATUS_FIELD" "$TARGET_STATUS"
            moved=$((moved+1))
            echo "moved PR #${num} -> ${TARGET_STATUS}"
          done < "$targets_file"
          echo "=== Moved ${moved} PR(s) to '${TARGET_STATUS}' ==="
