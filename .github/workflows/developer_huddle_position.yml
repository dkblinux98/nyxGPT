name: Developer Agent - Huddle Position

# #3687 review huddle protocol: when review_agent_auto_review.yml's
# "Trigger huddle" step posts a HUDDLE_TRIGGERED comment (a judgment-call
# disagreement, or a 2nd failed verifiable-defect cycle), this workflow
# posts the developer agent's *position* -- what it believes the problem
# is, what was tried, what it proposes -- instead of attempting another
# blind fix. It then kicks off scrummaster mediation
# (scrummaster_huddle_mediation.yml) via the HUDDLE_MEDIATION_REQUESTED
# marker, the same comment-triggered-workflow pattern used throughout this
# repo (READY_FOR_NEXT_ISSUE, RETRY_IMPLEMENTATION, PAUSE_SPRINT).

on:
  issue_comment:
    types: [created]

jobs:
  post-position:
    if: >-
      vars.AGENTS_ENABLED == 'true' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'HUDDLE_TRIGGERED') &&
      github.event.comment.user.login == vars.REVIEW_AGENT
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    env:
      GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Auth gh
        run: gh auth status

      - name: Validate required secrets
        env:
          # #3837: a secret is substituted as shell *source* when interpolated
          # here, so its characters are parsed -- and an xtrace or a parse
          # error can echo it. Read it as data instead; presence is all this
          # step checks.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DEVELOPER_AGENT_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not configured"
            exit 1
          fi
          if [[ -z "$DEVELOPER_AGENT_TOKEN" ]]; then
            echo "::error::DEVELOPER_AGENT_TOKEN secret is not configured"
            exit 1
          fi

      - name: Get PR number
        id: get_pr
        run: echo "pr_number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"

      # #3736: one position run per huddle, whatever the thread looks like.
      # The review workflow can execute a single verdict twice (the
      # pull_request_review event and the structured-comment fallback), and
      # on PR #3728 both posted a HUDDLE_TRIGGERED -- two position runs, two
      # mediations, the second of which had to diagnose the duplication
      # itself. The review side now guards against posting the second
      # trigger; this is the guard that holds even if one still lands: only
      # the round's *first* trigger comment gets a position.
      - name: Huddle dedupe guard
        id: guard
        env:
          # #3837: step outputs reach the shell as data, never as source.
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.get_pr.outputs.pr_number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          PRIMARY=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --paginate --jq '.[]' | jq -s '{comments: .}' \
            | python3 scripts/agents/lib/huddle_state.py guard HUDDLE_TRIGGERED "$COMMENT_ID")
          echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"
          if [[ "$PRIMARY" != "true" ]]; then
            echo "::notice::Comment $COMMENT_ID is a duplicate huddle trigger for this review round -- standing down"
          fi

      - name: Post developer position
        if: steps.guard.outputs.primary == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          prompt: |
            A review huddle was triggered on PR #${{ steps.get_pr.outputs.pr_number }}
            (see the HUDDLE_TRIGGERED comment on the PR for why). Per the developer
            runbook's huddle section (agents/runbooks/developer-runbook.md), your job
            here is narrow: post your *position*, do NOT attempt another fix.

            1. Read the PR thread in full: `gh pr view ${{ steps.get_pr.outputs.pr_number }} --comments`
               and `gh pr diff ${{ steps.get_pr.outputs.pr_number }}`.
            2. Read the linked issue for the original acceptance criteria.
            3. Post exactly one comment on the PR
               (`gh pr comment ${{ steps.get_pr.outputs.pr_number }} --body "..."`)
               structured as:

               ## Developer Position

               ### What I believe the problem is
               [your diagnosis]

               ### What was tried
               [prior fix attempts and why they didn't land]

               ### What I propose
               [proceed as-is / a specific different approach / a specific descope
               (e.g. drop a flaky test, split the issue) / escalate to the owner --
               be concrete, this is read by a fresh scrummaster mediation run next]

               HUDDLE_DEV_POSITION

            4. After posting that comment, post a second, separate comment containing
               exactly the line `HUDDLE_MEDIATION_REQUESTED` (this triggers the
               scrummaster mediation run). Do not combine it into the same comment as
               step 3 -- keep them as two comments so both markers are unambiguous.

            Do NOT write, edit, or commit any code in this run. Do NOT change issue
            status or assignments. Your only task is the two comments above.
          claude_args: >-
            --model ${{ vars.AGENT_MODEL_HUDDLE || 'claude-fable-5' }}
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Read,Grep"
          show_full_output: true
