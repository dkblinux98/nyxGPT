name: Sweep Parked Blocked Issues

# Owner process rule 2026-08-04 (#3631): review_accept_and_merge.sh parks a
# merged issue at "In Review" instead of "Acceptance Testing" when it has
# open native blocked-by dependencies -- the owner cannot meaningfully
# accept a feature whose acceptance criteria depend on unfinished work. This
# sweep finds every parked issue whose blockers have ALL completed (merged
# and themselves Acceptance Testing or beyond) and promotes it, moving the
# whole dependency set to Acceptance Testing together.
#
# THE SCHEDULE WAS REMOVED (#4201, ledger D-070), exactly as on its sibling
# "Promote Accepted Features" and for the same reasons -- see that
# workflow's header, and D-060 / the 2026-08-25 drain-gate removal for the
# two earlier instances of this class. It was `*/30 * * * *`.
#
# This workflow is DISPATCH-ONLY. What it waits on is a blocker completing,
# and the actor that completes one is the review merge path, so that path
# dispatches it through the one shared helper `dispatch_acceptance_sweeps`
# (scripts/agents/lib/gh_project.sh), as do the release ceremony and the
# drain gate release. An OWNER board move raises no event a user project can
# subscribe to, so that case is one deliberate dispatch:
#
#   gh workflow run sweep_parked_blocked_issues.yml --ref <release branch> -f dry_run=true
#   gh workflow run sweep_parked_blocked_issues.yml --ref <release branch>
#
# Nothing is stranded by the cron's absence: sweep_parked_blocked_issues()
# already resolves a parked blocker chain to a fixed point within one run
# (it never needed a tick per hop), and a run with nothing promotable moves
# nothing and posts nothing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be promoted without changing anything"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    if: vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Write ephemeral config
        run: |
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"
          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"

      - name: Sweep parked blocked issues
        env:
          # #3837: dispatch inputs reach the shell as data, never as source.
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          DRY_RUN=0
          if [[ "$DRY_RUN_INPUT" == "true" ]]; then
            DRY_RUN=1
          fi
          DRY_RUN="$DRY_RUN" scripts/agents/sweep_parked_blocked_issues.sh
