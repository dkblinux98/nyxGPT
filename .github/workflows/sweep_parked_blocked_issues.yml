name: Sweep Parked Blocked Issues

# Owner process rule 2026-08-04 (#3631): review_accept_and_merge.sh parks a
# merged issue at "In Review" instead of "Acceptance Testing" when it has
# open native blocked-by dependencies -- the owner cannot meaningfully
# accept a feature whose acceptance criteria depend on unfinished work. This
# sweep finds every parked issue whose blockers have ALL completed (merged
# and themselves Acceptance Testing or beyond) and promotes it, moving the
# whole dependency set to Acceptance Testing together.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be promoted without changing anything"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    if: vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Write ephemeral config
        run: |
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"
          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"

      - name: Sweep parked blocked issues
        run: |
          DRY_RUN=0
          if [[ "${{ github.event.inputs.dry_run || 'false' }}" == "true" ]]; then
            DRY_RUN=1
          fi
          DRY_RUN="$DRY_RUN" scripts/agents/sweep_parked_blocked_issues.sh
