name: Usage Limit Auto-Retry

# Self-healing companion to developer_auto_implement.yml's usage-limit
# detection (Phase 0). When a developer run dies because the Claude usage
# window is exhausted, the failure handler labels the issue
# "usage-limit-retry" and records a retry-after timestamp in a marker
# comment. This cron re-fires the developer agent (via the proven
# unassign/re-assign trigger) once that timestamp has passed.
#
# Runs under SCRUMMASTER_AGENT_TOKEN per the identity policy
# (administrative actions are performed by myGPT-scrummaster-agent).

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  retry:
    if: vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
      REPO: ${{ github.repository }}
      DEV_AGENT: ${{ vars.DEV_AGENT }}
      REVIEW_AGENT: ${{ vars.REVIEW_AGENT }}
    steps:
      - name: Retry usage-limited issues
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(date +%s)

          ISSUES=$(gh api "repos/$REPO/issues?labels=usage-limit-retry&state=open&per_page=100" \
            --paginate --jq '.[] | select(has("pull_request") | not) | .number' || true)

          if [ -z "$ISSUES" ]; then
            echo "No issues pending usage-limit retry."
            exit 0
          fi

          for ISSUE in $ISSUES; do
            echo "::group::Issue #$ISSUE"

            # --jq runs once per fetched page -- stream matches across all
            # pages first, then slurp+last (see AGENTS.md).
            RETRY_AFTER=$(gh api "repos/$REPO/issues/$ISSUE/comments" --paginate \
              --jq '.[].body | capture("<!-- usage-limit-retry-after: (?<t>[0-9]+) -->").t' 2>/dev/null \
              | jq -s -r 'last // empty' || true)

            if [ -n "$RETRY_AFTER" ] && [ "$NOW" -lt "$RETRY_AFTER" ]; then
              echo "Not yet: retry scheduled for epoch $RETRY_AFTER (now $NOW)."
              echo "::endgroup::"
              continue
            fi

            echo "Retry window reached — re-firing developer agent."
            gh issue edit "$ISSUE" --repo "$REPO" --remove-label "usage-limit-retry"
            gh issue comment "$ISSUE" --repo "$REPO" --body "🔁 **Scrummaster Agent**: Usage-limit retry window reached — re-assigning @$DEV_AGENT to resume implementation."

            # Unassign then re-assign to emit the 'assigned' event that
            # triggers developer_auto_implement.yml (its only trigger).
            gh api -X DELETE "repos/$REPO/issues/$ISSUE/assignees" \
              -f "assignees[]=$DEV_AGENT" >/dev/null 2>&1 || true
            sleep 3
            gh api -X POST "repos/$REPO/issues/$ISSUE/assignees" \
              -f "assignees[]=$DEV_AGENT" >/dev/null

            echo "::endgroup::"
          done

      - name: Retry usage-limited PR reviews
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(date +%s)

          PRS=$(gh api "repos/$REPO/issues?labels=usage-limit-retry&state=open&per_page=100" \
            --paginate --jq '.[] | select(has("pull_request")) | .number' || true)

          if [ -z "$PRS" ]; then
            echo "No PRs pending usage-limit review retry."
            exit 0
          fi

          for PR in $PRS; do
            echo "::group::PR #$PR"

            # --jq runs once per fetched page -- stream matches across all
            # pages first, then slurp+last (see AGENTS.md).
            RETRY_AFTER=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq '.[].body | capture("<!-- usage-limit-retry-after: (?<t>[0-9]+) -->").t' 2>/dev/null \
              | jq -s -r 'last // empty' || true)

            if [ -n "$RETRY_AFTER" ] && [ "$NOW" -lt "$RETRY_AFTER" ]; then
              echo "Not yet: retry scheduled for epoch $RETRY_AFTER (now $NOW)."
              echo "::endgroup::"
              continue
            fi

            echo "Retry window reached — re-requesting review."
            gh pr edit "$PR" --repo "$REPO" --remove-label "usage-limit-retry"
            gh pr comment "$PR" --repo "$REPO" --body "🔁 **Scrummaster Agent**: Usage-limit retry window reached — re-requesting review from @$REVIEW_AGENT."

            # Un-request then re-request to emit the 'review_requested' event
            # that triggers claude-code-review.yml.
            gh api -X DELETE "repos/$REPO/pulls/$PR/requested_reviewers" \
              -f "reviewers[]=$REVIEW_AGENT" >/dev/null 2>&1 || true
            sleep 3
            gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" \
              -f "reviewers[]=$REVIEW_AGENT" >/dev/null

            echo "::endgroup::"
          done
