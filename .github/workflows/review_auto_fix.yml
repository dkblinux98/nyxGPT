name: Review Agent Auto-Fix Loop

# Test Coverage Note:
# Automated tests for this workflow are deferred to a follow-up issue due to:
# 1. Complexity of testing GitHub Actions workflows (requires act or similar tooling)
# 2. Need to establish test infrastructure for workflow automation first
# 3. Initial rollout will be manual pilot testing before production use
# TODO: Create follow-up issue for workflow test coverage

on:
  issue_comment:
    types: [created]

jobs:
  auto-fix:
    # Only run if:
    # 1. Auto-fix enabled
    # 2. Comment is on PR
    # 3. Comment is from github-actions bot
    # 4. Comment starts with "## Code Review - REQUEST_CHANGES"
    if: >-
      ${{ vars.REVIEW_AUTO_FIX_ENABLED == 'true'
          && github.event.issue.pull_request
          && github.event.comment.user.login == 'github-actions[bot]'
          && startsWith(github.event.comment.body, '## Code Review - REQUEST_CHANGES') }}
    runs-on: ubuntu-latest

    # Prevent concurrent runs on same PR to avoid race conditions in loop counting
    concurrency:
      group: auto-fix-${{ github.event.issue.number }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    env:
      GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Auth gh
        run: gh auth status

      - name: Check CI status
        id: ci
        run: |
          PR="${{ github.event.issue.number }}"

          echo "Checking CI status for PR #$PR..."

          # Get CI check status
          CI_STATUS=$(gh pr view "$PR" --repo "${{ github.repository }}" --json statusCheckRollup --jq '.statusCheckRollup[].state' | grep -v "SUCCESS" | head -1 || echo "SUCCESS")

          if [[ "$CI_STATUS" != "SUCCESS" ]]; then
            echo "CI is not green (status: $CI_STATUS). Skipping auto-fix until CI passes."
            gh pr comment "$PR" --repo "${{ github.repository }}" --body "⚠️ **Review Agent**: Auto-fix skipped because CI is not green. Please fix CI failures first."
            exit 0
          fi

          echo "✓ CI is green, proceeding with auto-fix"

      - name: Write ephemeral config.ini (runner temp)
        shell: bash
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/mygpt-config.ini"

          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF

          echo "MYGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"
          echo "Wrote ephemeral config at $CFG"

      - name: Verify config loads
        shell: bash
        run: |
          set -euo pipefail
          bash -lc '
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            echo "config ok: $REPO_OWNER/$REPO_NAME project $PROJECT_OWNER#$PROJECT_NUMBER release=$RELEASE_BRANCH"
          '

      - name: Get PR number
        id: pr
        run: |
          PR_NUMBER="${{ github.event.issue.number }}"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "PR number: $PR_NUMBER"

      - name: Count review iterations
        id: count
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"

          # Query PR comments from github-actions[bot] starting with "## Code Review - REQUEST_CHANGES"
          # Only count REQUEST_CHANGES iterations, not APPROVE comments
          COUNT=$(gh pr view "$PR" --repo "${{ github.repository }}" --json comments --jq '
            [.comments[] |
             select(.author.login == "github-actions[bot]" and
                    (.body | startswith("## Code Review - REQUEST_CHANGES")))] |
            length
          ')

          echo "loop_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Review loop count (REQUEST_CHANGES only): $COUNT"

          if [[ "$COUNT" -gt 3 ]]; then
            echo "escalate=true" >> "$GITHUB_OUTPUT"
            echo "Escalation required: More than 3 review loops detected"
          else
            echo "escalate=false" >> "$GITHUB_OUTPUT"
            echo "Continuing with auto-fix (loop $(($COUNT + 1))/3)"
          fi

      - name: Escalate to human (if 3+ loops)
        if: steps.count.outputs.escalate == 'true'
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"

          echo "Escalating PR #$PR to human after 3 review attempts"

          gh pr comment "$PR" --repo "${{ github.repository }}" --body "@${{ vars.HUMAN_OWNER }} claude bot has attempted to review and fix this PR 3 times but issues persist. Manual intervention is required."

          gh pr edit "$PR" --repo "${{ github.repository }}" --add-assignee "${{ vars.HUMAN_OWNER }}"

          echo "✓ Escalation complete"
          exit 0

      - name: Get issue number from PR
        if: steps.count.outputs.escalate == 'false'
        id: issue
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"
          ISSUE=$(gh pr view "$PR" --repo "${{ github.repository }}" --json body -q '.body' | sed -n 's/.*Closes #\([0-9]*\).*/\1/p' | head -1)

          if [[ -z "$ISSUE" ]]; then
            echo "ERROR: Could not extract issue number from PR body"
            exit 1
          fi

          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "Issue number: $ISSUE"

      - name: Get PR branch name
        if: steps.count.outputs.escalate == 'false'
        id: branch
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"
          BRANCH=$(gh pr view "$PR" --repo "${{ github.repository }}" --json headRefName -q .headRefName)

          if [[ -z "$BRANCH" ]]; then
            echo "ERROR: Could not get PR branch name"
            exit 1
          fi

          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "PR branch: $BRANCH"

      - name: Checkout PR branch
        if: steps.count.outputs.escalate == 'false'
        run: |
          BRANCH="${{ steps.branch.outputs.branch_name }}"

          echo "Fetching and checking out branch: $BRANCH"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

          echo "✓ Checked out PR branch"

      - name: Post fix start comment
        if: steps.count.outputs.escalate == 'false'
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"
          COUNT="${{ steps.count.outputs.loop_count }}"
          NEXT_ITERATION=$(($COUNT + 1))

          gh pr comment "$PR" --repo "${{ github.repository }}" --body "🔧 **Review Agent**: Auto-fix loop iteration $NEXT_ITERATION/3 starting...

          Analyzing review findings and implementing fixes.

          [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Parse review findings
        if: steps.count.outputs.escalate == 'false'
        id: findings
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"

          echo "Extracting most recent Code Review comment..."

          # Get most recent "## Code Review - REQUEST_CHANGES" comment
          REVIEW_BODY=$(gh pr view "$PR" --repo "${{ github.repository }}" --json comments --jq '
            [.comments[] |
             select(.author.login == "github-actions[bot]" and
                    (.body | startswith("## Code Review - REQUEST_CHANGES")))] |
            last |
            .body
          ')

          if [[ -z "$REVIEW_BODY" ]]; then
            echo "ERROR: Could not find review comment"
            exit 1
          fi

          # Validate review body starts with expected header
          if ! echo "$REVIEW_BODY" | head -1 | grep -q "^## Code Review - REQUEST_CHANGES"; then
            echo "ERROR: Review comment does not have expected format"
            exit 1
          fi

          # Use GitHub artifact storage instead of /tmp for security
          FINDINGS_FILE="$RUNNER_TEMP/review-findings.txt"
          echo "$REVIEW_BODY" > "$FINDINGS_FILE"

          # Verify file was written correctly
          if [[ ! -f "$FINDINGS_FILE" ]]; then
            echo "ERROR: Failed to write review findings file"
            exit 1
          fi

          echo "findings_file=$FINDINGS_FILE" >> "$GITHUB_OUTPUT"
          echo "✓ Review findings extracted to $FINDINGS_FILE"
          echo "Preview (first 500 chars):"
          head -c 500 "$FINDINGS_FILE"

      - name: Run Claude Code to fix issues
        if: steps.count.outputs.escalate == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          claude_args: '--allowed-tools "Bash,Read,Write,Edit,Glob,Grep"'
          prompt: |
            You are the developer agent fixing code review issues for PR #${{ steps.pr.outputs.pr_number }}.

            ## Context

            - PR: #${{ steps.pr.outputs.pr_number }}
            - Issue: #${{ steps.issue.outputs.issue_number }}
            - Branch: ${{ steps.branch.outputs.branch_name }}
            - Review iteration: $((${{ steps.count.outputs.loop_count }} + 1))/3

            ## Review Findings

            The code review findings are in `${{ steps.findings.outputs.findings_file }}`. Read that file to see all the issues.

            ## Your Task

            Fix ALL Critical and Medium issues identified in the code review. DO NOT fix Minor issues (they are style/nits and don't block merge).

            ## Requirements

            1. Read and parse `${{ steps.findings.outputs.findings_file }}` to understand all Critical and Medium issues
            2. Fix each issue thoroughly with proper testing
            3. Run relevant tests to verify your fixes work
            4. Make a SINGLE commit with all fixes included
            5. Use this exact commit message format:
               ```
               fix: address code review findings (review loop $((${{ steps.count.outputs.loop_count }} + 1))) (#${{ steps.issue.outputs.issue_number }})
               ```
            6. Push the commit to update the PR

            ## Important Notes

            - You are already on the PR branch `${{ steps.branch.outputs.branch_name }}`
            - All fixes must be in ONE commit (not multiple commits)
            - After you push, the PR will be automatically re-reviewed
            - This is iteration $((${{ steps.count.outputs.loop_count }} + 1)) of maximum 3 loops

            Begin by reading the review findings file, then implement all the fixes.

      - name: Post fix complete comment
        if: steps.count.outputs.escalate == 'false' && success()
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"
          COUNT="${{ steps.count.outputs.loop_count }}"
          NEXT_ITERATION=$(($COUNT + 1))

          gh pr comment "$PR" --repo "${{ github.repository }}" --body "✅ **Review Agent**: Auto-fix iteration $NEXT_ITERATION/3 complete.

          Fixes have been pushed to branch \`${{ steps.branch.outputs.branch_name }}\`. The PR will be automatically re-reviewed shortly."

      - name: Post fix failure comment
        if: steps.count.outputs.escalate == 'false' && failure()
        run: |
          PR="${{ steps.pr.outputs.pr_number }}"

          gh pr comment "$PR" --repo "${{ github.repository }}" --body "❌ **Review Agent**: Auto-fix failed during execution.

          @${{ vars.HUMAN_OWNER }} Manual intervention required. See [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."

          gh pr edit "$PR" --repo "${{ github.repository }}" --add-assignee "${{ vars.HUMAN_OWNER }}"
