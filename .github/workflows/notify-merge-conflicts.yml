name: Notify Merge Conflicts

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-conflicts:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read
      contents: read

    steps:
      - name: Check for merge conflicts
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Check if PR is mergeable (null means GitHub is still computing, false means conflicts)
            console.log(`PR #${pr.number} mergeable status: ${pr.mergeable}`);
            console.log(`PR #${pr.number} mergeable_state: ${pr.mergeable_state}`);

            // If mergeable is explicitly false, there are conflicts
            if (pr.mergeable === false) {
              core.setOutput('has_conflicts', 'true');
              core.setOutput('pr_number', pr.number);
              core.setOutput('pr_title', pr.title);
              core.setOutput('pr_url', pr.html_url);
              core.setOutput('pr_author', pr.user.login);
              core.setOutput('base_branch', pr.base.ref);
              core.setOutput('head_branch', pr.head.ref);
            } else {
              core.setOutput('has_conflicts', 'false');
            }

      - name: Extract issue number from PR
        if: steps.check.outputs.has_conflicts == 'true'
        id: get_issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const match = pr.body.match(/Closes #(\d+)/);
            if (match) {
              core.setOutput('issue_number', match[1]);
              return match[1];
            }
            core.setOutput('issue_number', '');
            return '';

      - name: Assign issue to human owner
        if: steps.check.outputs.has_conflicts == 'true' && steps.get_issue.outputs.issue_number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = parseInt('${{ steps.get_issue.outputs.issue_number }}');
            const human_owner = '${{ vars.HUMAN_OWNER }}';

            // Assign issue to human owner (status remains "In Review")
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              assignees: [human_owner]
            });

            console.log(`Assigned issue #${issue_number} to ${human_owner}`);

      - name: Comment on PR
        if: steps.check.outputs.has_conflicts == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr_number = ${{ steps.check.outputs.pr_number }};
            const issue_number = '${{ steps.get_issue.outputs.issue_number }}';
            const human_owner = '${{ vars.HUMAN_OWNER }}';
            const base_branch = '${{ steps.check.outputs.base_branch }}';
            const head_branch = '${{ steps.check.outputs.head_branch }}';

            let body = '⚠️ **Merge Conflict Detected**\n\n' +
              'This PR has merge conflicts with base branch `' + base_branch +
              '` and cannot be merged automatically.\n\n' +
              '**To resolve:**\n' +
              '1. `git checkout ' + head_branch + '`\n' +
              '2. `git pull origin ' + base_branch + '`\n' +
              '3. Resolve conflicts in affected files\n' +
              '4. `git add . && git commit`\n' +
              '5. `git push origin ' + head_branch + '`';

            if (issue_number) {
              body += '\n\nIssue #' + issue_number + ' has been assigned to @' +
                human_owner + ' and remains in "In Review" status pending conflict resolution.';
            } else {
              body += '\n\n@' + human_owner + ' has been notified via Slack.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: body
            });

      - name: Send Slack notification
        if: steps.check.outputs.has_conflicts == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0ABH478QC8",
              "text": "⚠️ Merge Conflict Detected in PR #${{ steps.check.outputs.pr_number }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "⚠️ Merge Conflict in Pull Request"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": >-
                        *PR:*\n<${{ steps.check.outputs.pr_url }}|#${{
                        steps.check.outputs.pr_number }} - ${{
                        steps.check.outputs.pr_title }}>
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ steps.check.outputs.pr_author }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": >-
                        *Branches:*\n`${{ steps.check.outputs.head_branch }}`
                        → `${{ steps.check.outputs.base_branch }}`
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": >-
                      This PR has merge conflicts with the base branch
                      and cannot be merged until they are resolved.
                      Issue has been assigned to @${{ vars.HUMAN_OWNER }}
                      and remains in 'In Review' status.
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View PR"
                      },
                      "url": "${{ steps.check.outputs.pr_url }}"
                    }
                  ]
                }
              ]
            }
