name: Notify Merge Conflicts

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-conflicts:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read
      contents: read

    steps:
      - name: Check for merge conflicts
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Check if PR is mergeable (null means GitHub is still computing, false means conflicts)
            console.log(`PR #${pr.number} mergeable status: ${pr.mergeable}`);
            console.log(`PR #${pr.number} mergeable_state: ${pr.mergeable_state}`);

            // If mergeable is explicitly false, there are conflicts
            if (pr.mergeable === false) {
              core.setOutput('has_conflicts', 'true');
              core.setOutput('pr_number', pr.number);
              core.setOutput('pr_title', pr.title);
              core.setOutput('pr_url', pr.html_url);
              core.setOutput('pr_author', pr.user.login);
              core.setOutput('base_branch', pr.base.ref);
              core.setOutput('head_branch', pr.head.ref);
            } else {
              core.setOutput('has_conflicts', 'false');
            }

      - name: Send Slack DM notification
        if: steps.check.outputs.has_conflicts == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_USER_ID }}",
              "text": "⚠️ Merge Conflict Detected in PR #${{ steps.check.outputs.pr_number }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "⚠️ Merge Conflict in Pull Request"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*PR:*\n<${{ steps.check.outputs.pr_url }}|#${{ steps.check.outputs.pr_number }} - ${{ steps.check.outputs.pr_title }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ steps.check.outputs.pr_author }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branches:*\n`${{ steps.check.outputs.head_branch }}` → `${{ steps.check.outputs.base_branch }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "This PR has merge conflicts with the base branch and cannot be merged until they are resolved."
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View PR"
                      },
                      "url": "${{ steps.check.outputs.pr_url }}"
                    }
                  ]
                }
              ]
            }
