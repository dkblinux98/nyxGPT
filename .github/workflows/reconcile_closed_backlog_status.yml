name: Reconcile Closed Backlog Status

# Project-hygiene maintenance (manual). Moves CLOSED issues that are still sitting
# in Backlog / In Progress on the board to "In Review" (assigned to the human
# owner), mirroring what review_accept_and_merge.sh does on a normal merge.
# Closed issues drift into Backlog when work is hand-driven or the status step is
# missed. Runs dry (preview only) by default.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — list stuck closed issues, change nothing'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: reconcile-closed-backlog
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Reconcile closed Backlog/In-Progress issues -> In Review
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          cat > /tmp/nyxgpt-config.ini <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          export NYXGPT_CONFIG_FILE=/tmp/nyxgpt-config.ini
          bash scripts/agents/reconcile_closed_status.sh
