name: Retro Dashboard - Dump Spend Telemetry

# Derives per-issue spend telemetry (Claude-invoking workflow steps, total
# workflow runs, runner minutes, retry/self-heal cycle count) from GitHub
# Actions run history and commits it to scripts/retrospective/data/spend.json
# on the dispatching branch. Owner-endorsed direction from the 2026-08-09
# cost post-mortem (#3696): this is the raw signal an anomaly-watching
# process reads to judge whether spend on an issue is unusual -- not a fixed
# cap. Read-only against GitHub Actions; writes only the JSON snapshot. Used
# by the owner's retrospective dashboard.

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Dump spend telemetry
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/retrospective/dump_spend.py

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/retrospective/data/spend.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(retro): refresh spend telemetry snapshot"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
