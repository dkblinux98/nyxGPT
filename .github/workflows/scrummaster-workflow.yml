name: Scrummaster Agent Workflow

on:
  schedule:
    - cron: '0 9 * * 1-5'  # Weekdays at 9 AM UTC
  workflow_dispatch:

jobs:
  select-next:
    uses: dkblinux98/nyxAgent/.github/workflows/reusable-scrummaster-select-issue.yml@v1.0.0
    with:
      config_path: '.nyxagent/config.yaml'
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN_NYXAGENT: ${{ secrets.GH_TOKEN_NYXAGENT }}
