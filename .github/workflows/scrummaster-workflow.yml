name: Scrummaster Agent Workflow

on:
  workflow_dispatch:
  # Note: Scheduled triggers can be added later if needed

jobs:
  select-next:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: dkblinux98/nyxAgent/.github/workflows/scrummaster-agent.yml@v1.0.0
    with:
      mode: 'select-next'
      config_path: '.nyxagent/config.yaml'
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NYXAGENT_WORKFLOW_TOKEN: ${{ secrets.NYXAGENT_WORKFLOW_TOKEN }}
