name: Add issue to release issue on milestone assignment

on:
  issues:
    types: [milestoned]

permissions:
  issues: write

jobs:
  add:
    if: vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issue = context.payload.issue;
            if (issue.pull_request) return;

            const issueNumber = issue.number;
            const milestoneTitle = issue.milestone?.title || "(no milestone)";

            const releaseIssueNumber = Number(process.env.RELEASE_ISSUE_NUMBER);
            if (!releaseIssueNumber) {
              core.setFailed("Missing RELEASE_ISSUE_NUMBER repo variable.");
              return;
            }

            const rel = await github.rest.issues.get({ owner, repo, issue_number: releaseIssueNumber });
            const body = rel.data.body || "";

            // Release wall (owner decision 2026-07-31): only track issues whose
            // milestone belongs to THIS release. Milestone titles carry the
            // release version ("Phase 6 — ... (v3.0.0)") and so does the release
            // issue's title ("Release v2.0.0"); a version mismatch means the
            // issue belongs to a different release's tracking issue. Before this
            // gate, filing the Phase 6 (v3.0.0) issues appended all 17 to the
            // v2.0.0 release issue #2759. If either side has no parseable
            // version, keep the pre-gate behavior (add).
            const verRe = /v\d+\.\d+\.\d+/;
            const relVer = (rel.data.title || "").match(verRe)?.[0];
            const msVer = milestoneTitle.match(verRe)?.[0];
            if (relVer && msVer && relVer !== msVer) {
              core.notice(`Issue #${issueNumber} milestone is ${msVer} but the configured release issue #${releaseIssueNumber} is ${relVer} — not adding (belongs to that release's own tracking issue).`);
              return;
            }

            // Avoid duplicates
            if (body.includes(`#${issueNumber}`)) return;

            const line = `- [ ] #${issueNumber}`;
            const newBody = body.trimEnd() + `\n${line}\n`;

            await github.rest.issues.update({
              owner, repo, issue_number: releaseIssueNumber,
              body: newBody
            });

            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: `Added to release tracking issue #${releaseIssueNumber} (milestone: **${milestoneTitle}**).`
            });
        env:
          RELEASE_ISSUE_NUMBER: ${{ vars.RELEASE_ISSUE_NUMBER }}
