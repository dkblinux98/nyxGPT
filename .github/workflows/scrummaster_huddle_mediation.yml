name: Scrummaster Agent - Huddle Mediation

# #3687 review huddle protocol: once the developer agent has posted its
# HUDDLE_DEV_POSITION and the HUDDLE_MEDIATION_REQUESTED marker
# (developer_huddle_position.yml), this workflow runs a *fresh* scrummaster
# invocation -- fresh context is structural: every invocation starts
# memoryless -- that reads only the PR thread (the dev position and the
# review position already on it) and posts a decision comment choosing one
# of: proceed / change approach / descope / escalate to owner.
#
# The decision is advisory text the next fix cycle (triggered separately,
# same as any other REQUEST_CHANGES redispatch) reads and follows; this
# workflow does not itself dispatch the fix. "escalate" is the one
# exception: it runs the same escalation primitives review_agent_auto_review.yml
# uses (assign_issue_verified + sprint_autopilot_kick) so a huddle that
# concludes "only the owner can decide this" hands off exactly like the
# 3-cycle/spec-ambiguity escalation paths do.

on:
  issue_comment:
    types: [created]

jobs:
  mediate:
    if: >-
      vars.AGENTS_ENABLED == 'true' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'HUDDLE_MEDIATION_REQUESTED') &&
      github.event.comment.user.login == vars.DEV_AGENT
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    env:
      GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Auth gh
        run: gh auth status

      - name: Validate required secrets
        env:
          # #3837: a secret interpolated here is substituted as shell source;
          # read it as data instead. Presence is all this step checks.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCRUMMASTER_AGENT_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not configured"
            exit 1
          fi
          if [[ -z "$SCRUMMASTER_AGENT_TOKEN" ]]; then
            echo "::error::SCRUMMASTER_AGENT_TOKEN secret is not configured"
            exit 1
          fi

      - name: Get PR and issue number
        id: get_pr
        run: |
          set -euo pipefail
          PR="${{ github.event.issue.number }}"
          ISSUE=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.body // ""' \
            | sed -n 's/.*Closes #\([0-9]*\).*/\1/p' | head -1)

          if [[ -z "$ISSUE" ]]; then
            echo "::error::PR #$PR body does not contain 'Closes #N' -- cannot mediate without a linked issue"
            exit 1
          fi

          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"

      # #3736: one mediation per huddle. A duplicated huddle produced two
      # mediation runs on PR #3728 (2026-08-11) racing to post competing
      # decisions on the same thread. Only the round's *first*
      # HUDDLE_MEDIATION_REQUESTED marker mediates; a later one stands down.
      - name: Mediation dedupe guard
        id: guard
        env:
          # #3837: step outputs reach the shell as data, never as source.
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.get_pr.outputs.pr_number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          PRIMARY=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --paginate --jq '.[]' | jq -s '{comments: .}' \
            | python3 scripts/agents/lib/huddle_state.py guard HUDDLE_MEDIATION_REQUESTED "$COMMENT_ID")
          echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"
          if [[ "$PRIMARY" != "true" ]]; then
            echo "::notice::Comment $COMMENT_ID is a duplicate mediation request for this review round -- standing down"
          fi

      - name: Run mediation
        id: mediate
        if: steps.guard.outputs.primary == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          prompt: |
            You are mediating a review huddle on PR #${{ steps.get_pr.outputs.pr_number }}
            (issue #${{ steps.get_pr.outputs.issue_number }}), per the huddle protocol in
            agents/runbooks/scrummaster-runbook.md and issue #3687. This is a fresh,
            memoryless invocation on purpose -- base your decision only on what is
            actually in the PR thread, not on any assumption about prior sessions.

            1. Read the full PR thread: `gh pr view ${{ steps.get_pr.outputs.pr_number }} --comments`.
               Find the review agent's code review comment (its position) and the
               developer agent's "## Developer Position" comment (its position).
            2. Read the linked issue #${{ steps.get_pr.outputs.issue_number }} for the
               original acceptance criteria.
            3. Decide exactly one of:
               - **proceed**: the dev's existing approach is right, keep going as-is.
               - **change-approach**: state the specific different approach to take.
               - **descope**: state the specific descope (e.g. drop a named flaky test,
                 split off a follow-up issue) that resolves the disagreement.
               - **escalate**: only the owner can resolve this (spec ambiguity or a
                 genuine deadlock) -- if you choose this, ALSO run the standard
                 escalation:
                 `bash -lc "cd '$GITHUB_WORKSPACE' && source scripts/agents/lib/gh_project.sh && load_config && require_gh_auth && assign_issue_verified '${{ steps.get_pr.outputs.issue_number }}' \"\$HUMAN_OWNER\" && gh pr edit ${{ steps.get_pr.outputs.pr_number }} --add-assignee \"\$HUMAN_OWNER\" && sprint_autopilot_kick '${{ steps.get_pr.outputs.issue_number }}' escalated"`
                 Do not run that command for any decision other than escalate.
            4. Post exactly one decision comment on the PR
               (`gh pr comment ${{ steps.get_pr.outputs.pr_number }} --body "..."`):

               ## Huddle Decision

               **Decision:** [proceed|change-approach|descope|escalate]

               ### Rationale
               [why, referencing the dev's and review's positions]

               ### What happens next
               [for proceed/change-approach/descope: what the developer agent should
               do in the next fix cycle; for escalate: note the owner has been
               assigned]

               HUDDLE_DECISION: [proceed|change-approach|descope|escalate]

            Do NOT write, edit, or commit any code. Do NOT modify issue status or
            assignments except via the escalate command above, and only if you chose
            escalate. Your task is the mediation decision comment (and, for escalate
            only, the escalation command).
          claude_args: >-
            --model ${{ vars.AGENT_MODEL_HUDDLE || 'claude-fable-5' }}
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh issue view:*),Bash(bash -lc*),Read,Grep"
          show_full_output: true
