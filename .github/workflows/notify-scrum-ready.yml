name: Scrummaster Agent - Select and Start Next Issue

on:
  issue_comment:
    types: [created]

jobs:
  dispatch-next:
    if: contains(github.event.comment.body, 'READY_FOR_NEXT_ISSUE')
    uses: dkblinux98/nyxAgent/.github/workflows/reusable-notify-scrum-ready.yml@v1.0.0
    with:
      repository: ${{ github.repository }}
      config_path: '.nyxagent/config.yaml'
      release_branch: ${{ vars.RELEASE_BRANCH }}
      trigger_issue_number: ${{ github.event.issue.number }}
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN_NYXAGENT: ${{ secrets.GH_TOKEN_NYXAGENT }}
