name: Retro Dashboard - Dump Churn Cost

# Derives per-round churn-cost telemetry -- token spend per Claude-invoking
# workflow step, split into context re-establishment vs change production,
# rolled up per issue across rounds -- from GitHub Actions run history and
# job logs, and publishes scripts/retrospective/data/churn.json to the retro
# data branch. Owner decision (2026-08-14, churn-cost discussion,
# #3776): the per-session cost of re-onboarding a zero-memory agent is
# invisible in ordinary spend math, so the retrospective makes it visible.
# Read-only against GitHub Actions; writes only the JSON snapshot.
#
# The snapshot does NOT get pushed at the dispatching branch: the default
# branch's ruleset requires a pull request, and the direct push was rejected
# with GH013 (#3815). publish_data_branch.sh puts it on claude/retro-data and
# merge_data_branch.sh lands it on the default branch through a pull request
# it opens and merges, so a green run of this workflow means the data landed.
#
# Dollars are attached only when the CHURN_PRICE_SHEET_JSON repo variable
# holds a price sheet (shape: scripts/retrospective/data/price_sheet.example.json,
# which ships zeroed placeholders so the repo asserts no rate -- #3744).
# Rates are owner-configured and never committed: passing them through the
# variable keeps them out of the checkout entirely, and dollars are computed
# here at dump time, so editing the variable changes nothing until this
# workflow is re-dispatched. Unset, the churn view reports tokens only.
# The hand-maintained stale-context incident log
# (data/stale_context_incidents.json) is validated here, so a malformed edit
# fails this workflow instead of silently disappearing from the dashboard.

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: "Days of run history to walk (each round costs a log download)"
        required: false
        default: "30"

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Dump churn-cost telemetry
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          REPO: ${{ github.repository }}
          CHURN_WINDOW_DAYS: ${{ inputs.window_days }}
          CHURN_PRICE_SHEET_JSON: ${{ vars.CHURN_PRICE_SHEET_JSON }}
        run: python3 scripts/retrospective/dump_churn.py

      - name: Publish snapshot to the retro data branch
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          scripts/retrospective/publish_data_branch.sh \
            "chore(retro): refresh churn-cost telemetry snapshot" \
            scripts/retrospective/data/churn.json

      - name: Land it on the default branch
        env:
          # The publish above pushes with GITHUB_TOKEN, and a GITHUB_TOKEN push
          # deliberately does NOT trigger other workflows -- so this job lands
          # the refresh itself rather than relying on retro_data_merge.yml
          # firing. That also makes a green dump mean the data landed, which
          # #3815 was precisely the absence of. retro_data_merge.yml still
          # covers the runbook's manual step 8 (an operator's PAT push does
          # trigger it); the merge is idempotent either way.
          GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN || secrets.SCRUMMASTER_AGENT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          DATA_BRANCH: claude/retro-data
        run: scripts/retrospective/merge_data_branch.sh
