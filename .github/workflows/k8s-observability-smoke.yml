name: Kubernetes Observability Smoke

# Least-privilege token: this gate only reads the checked-out code (CodeQL #2).
permissions:
  contents: read

# Question this job answers: does a `--kubernetes --local` deployment actually
# GET an observability layer, on a real cluster?
#
# #3787 (owner acceptance, 2026-08-15): the k8s --local round shipped with no
# prometheus/grafana/loki/jaeger/glitchtip anywhere in the cluster -- the
# Compose observability profiles cannot apply in that mode, and nothing else
# did. Inspection could not catch it and did not: only running the deploy and
# looking at the cluster shows an empty observability tier. So this gate runs
# both halves on a real kind cluster (D-006 fault injection):
#
#   1. the pre-fix state -- apply ONLY the app-tier kustomization, the entire
#      set of manifests `install --kubernetes` used to apply, and assert the
#      cluster has ZERO observability workloads (the defect, reproduced);
#   2. the fix -- `nyxgpt ops observability --kubernetes --local`, then assert
#      all ten workloads roll out, every UI answers from the host with NO
#      port-forward running (#3986: the deploy publishes them on the cluster it
#      provisioned, and the SRE panels were all ERR_CONNECTION_REFUSED before
#      it did), Grafana has its four provisioned datasources and the SRE Home
#      dashboard, and promtail is really shipping Pod logs into Loki.
#
# The api/web images are deliberately NOT built here: the claim under test is
# about the observability tier, the app tier's own bring-up is covered
# elsewhere, and building both images would triple this job's runtime for no
# extra coverage of the thing that broke.
#
# The second job answers the OTHER half of #3986's reachability question, on
# the topology the first one cannot reproduce: a cluster nyxGPT did not create
# and whose host ports are therefore not nyxGPT's to map. See its own header.
on:
  pull_request:
    paths:
      - 'k8s/**'
      - 'src/nyxgpt/ops.py'
      - 'docker/grafana/**'
      - '.github/workflows/k8s-observability-smoke.yml'
  push:
    paths:
      - 'k8s/**'
      - 'src/nyxgpt/ops.py'
      - 'docker/grafana/**'
      - '.github/workflows/k8s-observability-smoke.yml'

jobs:
  k8s-observability-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nyxgpt (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Seed a native config from the tracked example
        run: |
          mkdir -p "$HOME/.nyxGPT"
          cp example.config.ini "$HOME/.nyxGPT/config.ini"

      - name: Create the local cluster
        # `nyxgpt ops` provisions this itself when nothing is reachable
        # (#3596/#3724); creating it up front keeps the two halves below on one
        # cluster so half 1's "nothing here" is about the same cluster half 2
        # then fills.
        #
        # With nyxGPT's OWN config, rendered from the code under test (#3986):
        # a bare `kind create cluster` publishes no host ports, which would
        # route the deploy onto its bring-your-own-cluster path and leave the
        # published-NodePort half of the SRE reachability fix unexercised here.
        # Rendering it means a change to `KIND_HOST_PORT_MAPPINGS` cannot drift
        # away from what CI creates.
        run: |
          python -c "from nyxgpt import ops; print(ops._kind_cluster_config())" > kind-cluster.yaml
          cat kind-cluster.yaml
          kind create cluster --name nyxgpt-local --config kind-cluster.yaml --wait 120s

      - name: Reproduce the defect -- app tier only, no observability
        run: |
          set -euo pipefail
          # Exactly what `install --kubernetes` applied before #3787. Raw
          # kubectl is deliberate HERE and only here: this step reconstructs
          # the old code path to prove it was broken. Every operator-facing
          # path is a `nyxgpt` command (see the steps below).
          # #3834: the manifests live under ~/.nyxGPT/k8s now (package data
          # the product syncs), so the injection applies the same tree the
          # wrapped teardown at the end of this job deletes -- applying the
          # checkout's copy would leave `ops down --kubernetes` reporting "no
          # app tier bootstrapped" for an app tier that is running.
          K8S_DIR=$(python -c 'from nyxgpt import ops; ops._sync_packaged_resources(); print(ops.K8S_DIR)')
          cp "$K8S_DIR/secret.example.yaml" "$K8S_DIR/secret.yaml"
          kubectl apply -k "$K8S_DIR/"
          found=$(kubectl -n nyxgpt get deploy,daemonset \
            -l tier=observability --no-headers 2>/dev/null | wc -l | tr -d ' ')
          echo "observability workloads after the pre-#3787 apply: $found"
          if [ "$found" != "0" ]; then
            echo "::error::fault injection failed: the app-tier manifests already ship observability, so this gate proves nothing"
            exit 1
          fi
          # The bootstrapped secret.yaml stays where it was written: the
          # wrapped teardown at the end of this job deletes the app tier
          # through the same kustomization it came from, and it looks for that
          # file under K8S_DIR to decide there is an app tier at all.

          # Same rationale as not building the api/web images: the data/LLM
          # tier (#3786) is applied above so the injection really is the whole
          # pre-#3787 kustomization, but its Pods would pull multi-GB Cassandra
          # and Ollama images (plus a model) onto the kind node's disk and
          # contribute nothing to a claim about the OBSERVABILITY tier. #3786's
          # own gate (k8s-local-smoke.yml) is what exercises them. Scale to
          # zero rather than delete, so the manifests stay applied.
          kubectl -n nyxgpt scale statefulset/cassandra statefulset/ollama --replicas=0

          # Same reasoning, and now load-bearing rather than merely tidy.
          # #3990 made `ops observability` re-mint the GlitchTip DSN and then
          # `rollout restart` + WAIT FOR the two DSN consumers
          # (ops.K8S_DSN_CONSUMER_DEPLOYMENTS) so nothing downstream reads a
          # half-rolled stack. Correct in a real cluster, where the install
          # built those images -- but this job deliberately never builds them
          # (see the header), so their Pods sit in ErrImagePull and the wait
          # could only ever time out. The app tier is a prop here, not a
          # subject: no step below asserts anything about api/web. At 0
          # replicas the restart still happens and its rollout completes
          # immediately, so the observability claim is tested unchanged.
          kubectl -n nyxgpt scale \
            deploy/nyxgpt-api-stable deploy/nyxgpt-web-stable \
            deploy/nyxgpt-api-canary deploy/nyxgpt-web-canary --replicas=0

      - name: nyxgpt ops observability --kubernetes --local
        run: nyxgpt ops observability --kubernetes --local

      - name: Wait for every observability workload to roll out
        run: |
          set -euo pipefail
          for d in prometheus grafana loki otel-collector jaeger \
                   glitchtip-postgres glitchtip-redis glitchtip glitchtip-worker; do
            kubectl -n nyxgpt rollout status "deploy/$d" --timeout=600s
          done
          kubectl -n nyxgpt rollout status ds/promtail --timeout=300s

      - name: Verify the UIs answer with NO port-forward running (#3986)
        run: |
          set -uo pipefail
          fail=0
          # The ports here are the ones the admin dashboard's observability
          # links already use (Grafana 3001, Prometheus 9090, Jaeger 16686,
          # GlitchTip 8080). If these drift, the dashboard tiles break.
          #
          # And nothing forwards them (#3986, owner re-test 2026-08-26): this
          # step used to background `nyxgpt ops port-forward --target
          # observability` itself, which is exactly what made it blind to the
          # defect an operator hit -- a healthy install whose SRE panels were
          # all ERR_CONNECTION_REFUSED until they opened a terminal. The deploy
          # above publishes these on the host and verifies them before it
          # returns; this asserts the same thing from outside, with no forward.
          #
          # Matched on the running message's own prefix, NOT on the word
          # "running": the negative answer is "No managed background
          # port-forward is running.", so the `grep -qi 'running'` this step
          # shipped with was true in both states and failed a run whose six
          # node ports were published and whose four SRE UIs all answered 200.
          # The sentinel is `ops.PORT_FORWARD_STATUS_RUNNING_SENTINEL`, pinned
          # by tests/unit/test_port_forward_status_predicate.py.
          if nyxgpt ops port-forward --status | grep -q 'Background port-forward running'; then
            echo "::error::a managed background forward is running -- the deploy should have published the node ports on this cluster"
            fail=1
          fi
          if pgrep -f "kubectl.*port-forward" >/dev/null 2>&1; then
            pgrep -af "kubectl.*port-forward"
            echo "::error::a stray port-forward is running -- this step must prove reachability WITHOUT one"
            fail=1
          fi
          docker port nyxgpt-local-control-plane || true
          kubectl -n nyxgpt get svc grafana prometheus jaeger glitchtip \
            -o custom-columns='NAME:.metadata.name,TYPE:.spec.type,NODEPORT:.spec.ports[*].nodePort'

          check() { # <label> <url> <expected>
            code=000
            for _ in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$2" || echo 000)
              [ "$code" = "$3" ] && break
              sleep 3
            done
            echo "  $1 -> $code (expect $3)"
            [ "$code" = "$3" ] || { echo "::error::$1 expected $3, got $code"; fail=1; }
          }
          check "grafana health" http://127.0.0.1:3001/api/health 200
          check "prometheus ready" http://127.0.0.1:9090/-/ready 200
          check "jaeger UI" http://127.0.0.1:16686/ 200
          check "glitchtip UI" http://127.0.0.1:8080/ 200

          # Grafana's provisioning is generated from docker/grafana at apply
          # time and only resolves because the overlay's Services carry the
          # Compose service names -- a rename breaks these silently.
          # Asked of the product rather than hardcoded: `nyxgpt ops
          # observability --kubernetes` writes this Secret wherever
          # `K8S_OBSERVABILITY_DIR` points, which #3834 moved out of the
          # checkout to ~/.nyxGPT/k8s/observability. Reading it by that name
          # means the next move relocates this check with it.
          obs_secret=$(python -c 'from nyxgpt import ops; print(ops.K8S_OBSERVABILITY_DIR / "secret.yaml")')
          pw=$(grep 'grafana-admin-password:' "$obs_secret" | sed 's/.*: "//; s/"$//')
          datasources=$(curl -s -u "admin:$pw" http://127.0.0.1:3001/api/datasources | jq -r '[.[].name] | sort | join(",")')
          echo "  grafana datasources -> $datasources"
          [ "$datasources" = "GlitchTip,Jaeger,Loki,Prometheus" ] || {
            echo "::error::expected the four provisioned datasources, got $datasources"; fail=1; }
          for uid in prometheus loki jaeger; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "admin:$pw" "http://127.0.0.1:3001/api/datasources/uid/$uid/health")
            echo "  datasource $uid health -> $code"
            [ "$code" = "200" ] || { echo "::error::datasource $uid is not healthy in-cluster"; fail=1; }
          done
          # SRE Home is what the admin dashboard's SRE Overview tile opens.
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "admin:$pw" http://127.0.0.1:3001/d/nyxgpt-sre-home)
          echo "  SRE Home dashboard -> $code"
          [ "$code" = "200" ] || { echo "::error::SRE Home dashboard missing in Kubernetes mode"; fail=1; }
          exit $fail

      - name: Verify promtail is shipping Pod logs into Loki
        run: |
          set -uo pipefail
          kubectl -n nyxgpt port-forward svc/loki 3100:3100 > /tmp/loki-forward.log 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" 2>/dev/null || true' EXIT
          sleep 10
          # `job="nyxgpt"` plus a per-service `service_name` is the label
          # contract every curated Explore link and dashboard query depends on
          # (docker/promtail-config.yml ships the same one in Compose mode).
          for _ in $(seq 1 20); do
            jobs_json=$(curl -s --max-time 20 http://127.0.0.1:3100/loki/api/v1/label/job/values || echo '{}')
            echo "$jobs_json" | jq -e '.data | index("nyxgpt")' >/dev/null 2>&1 && break
            sleep 6
          done
          echo "  loki job labels -> $jobs_json"
          echo "$jobs_json" | jq -e '.data | index("nyxgpt")' >/dev/null || {
            echo "::error::no job=nyxgpt logs reached Loki -- promtail is not shipping"; exit 1; }
          services=$(curl -s --max-time 20 http://127.0.0.1:3100/loki/api/v1/label/service_name/values | jq -r '.data | join(",")')
          echo "  loki service_name labels -> $services"
          case "$services" in *grafana*) ;; *)
            echo "::error::expected per-service labels in Loki, got $services"; exit 1;; esac

      - name: nyxgpt ops status reports the layer
        run: nyxgpt ops status | grep -A 12 'Kubernetes observability'

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n nyxgpt get all
          kubectl -n nyxgpt get events --sort-by=.lastTimestamp | tail -40
          for d in prometheus grafana loki jaeger promtail glitchtip; do
            echo "::group::logs $d"
            kubectl -n nyxgpt logs "deploy/$d" --tail 80 2>&1 || \
              kubectl -n nyxgpt logs "ds/$d" --tail 80 2>&1 || true
            echo "::endgroup::"
          done
          # What the host can actually reach (#3986): the node's published
          # ports, the Services' types, and whatever managed forward the
          # deploy established on a cluster it could not map.
          docker port nyxgpt-local-control-plane || true
          kubectl -n nyxgpt get svc -o custom-columns='NAME:.metadata.name,TYPE:.spec.type,NODEPORT:.spec.ports[*].nodePort' || true
          nyxgpt ops port-forward --status || true
          cat "$HOME/.nyxGPT/k8s/port-forward.log" 2>/dev/null || true
          cat /tmp/loki-forward.log 2>/dev/null || true

      - name: Tear down
        if: always()
        # The wrapped teardown, including the kind cluster nyxgpt provisioned.
        run: nyxgpt ops down --kubernetes || kind delete cluster --name nyxgpt-local || true

  # Question this job answers: on a cluster nyxGPT did NOT create, does the
  # deploy leave the SRE UIs reachable by itself -- and does `--stop` give the
  # host ports back?
  #
  # This is #3986's acceptance criterion 4 ("where host port mapping is not
  # nyxGPT's to arrange, the access path is established by the install itself
  # ... not left as a manual step"), and it is the one criterion the owner
  # could not test: their re-test (2026-08-26) says of it "BYO -- inspection
  # only -- I did not stand up a second, non-nyxGPT cluster". Inspection is
  # exactly what #3775 says is not evidence, so the bring-your-own topology
  # gets its own job rather than a note in the PR.
  #
  # The job above cannot carry this leg, and not for want of trying: it creates
  # its cluster from nyxGPT's OWN rendered kind config, so the node container
  # holds 3001/8080/9090/16686 on loopback for the cluster's whole life
  # (extraPortMappings are fixed at creation and cannot be withdrawn from a
  # running node). A `kubectl port-forward` can never bind them there -- the
  # only thing it could produce is `address already in use`. So the forward
  # path is only *provable* on a node that does not hold those ports, which is
  # what a bring-your-own cluster is.
  #
  # Bare `kind create cluster`, and under a name that is NOT the reserved
  # `nyxgpt-local`: that makes it a cluster nyxGPT must use as it finds
  # (`_ensure_kubectl_and_cluster`) and must never destroy (`_down_kubernetes_steps`),
  # both of which this job then asserts rather than taking on trust.
  k8s-observability-byo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    env:
      BYO_CLUSTER: nyxgpt-byo
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nyxgpt (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Seed a native config from the tracked example
        # GlitchTip provisioning stores its admin credentials here; without it
        # that step skips (successfully) and the GlitchTip UI would answer a
        # login page either way -- but the skip would make this job quieter
        # about a path the other one exercises.
        run: |
          mkdir -p "$HOME/.nyxGPT"
          cp example.config.ini "$HOME/.nyxGPT/config.ini"

      - name: Create a bring-your-own cluster -- bare kind, no nyxGPT config
        run: |
          kind create cluster --name "$BYO_CLUSTER" --wait 120s
          kubectl config current-context

      - name: The precondition -- this node publishes none of the SRE host ports
        # Without this the whole job could pass on a cluster that happened to
        # map them, and it would be the first job over again. Asked of the
        # product's own table so a change to `K8S_OBSERVABILITY_HOST_PORT_MAPPINGS`
        # cannot drift away from what is asserted here.
        run: |
          set -uo pipefail
          echo "node port mappings:"
          docker port "${BYO_CLUSTER}-control-plane" || echo "(none)"
          # The host port is the last colon-separated field of each mapping
          # line, same as `ops._kind_published_host_ports` reads it. Compared
          # as a whole field, not as a substring: a kind node maps its API
          # server onto a random high port, and `:30011` contains `:3001`.
          mapped=$(docker port "${BYO_CLUSTER}-control-plane" 2>/dev/null \
            | sed 's/.*://' | sort -u)
          wanted=$(python -c 'import nyxgpt.ops as o; print(" ".join(str(h) for h, _n in o.K8S_OBSERVABILITY_HOST_PORT_MAPPINGS))')
          echo "SRE host ports (K8S_OBSERVABILITY_HOST_PORT_MAPPINGS): $wanted"
          fail=0
          for host in $wanted; do
            if printf '%s\n' "$mapped" | grep -qx "$host"; then
              echo "::error::this node publishes host port ${host} -- not a bring-your-own topology, the forward path cannot be proved here"
              fail=1
            fi
          done
          exit $fail

      - name: nyxgpt ops observability --kubernetes --local
        # The ONLY command this job runs against the cluster. #3986's AC4 is
        # that the access path is established by this, with no second command
        # -- so a forward started by the job itself would make it vacuous.
        run: nyxgpt ops observability --kubernetes --local

      - name: Wait for every observability workload to roll out
        run: |
          set -euo pipefail
          for d in prometheus grafana loki otel-collector jaeger \
                   glitchtip-postgres glitchtip-redis glitchtip glitchtip-worker; do
            kubectl -n nyxgpt rollout status "deploy/$d" --timeout=600s
          done
          kubectl -n nyxgpt rollout status ds/promtail --timeout=300s

      - name: The deploy established the managed background forward itself (#3986 AC4)
        run: |
          set -uo pipefail
          fail=0
          # Matched on the running message's own prefix
          # (`ops.PORT_FORWARD_STATUS_RUNNING_SENTINEL`, pinned by
          # tests/unit/test_port_forward_status_predicate.py), never on the
          # word "running" -- the idle message contains that word too, which
          # is what made this class of guard true in both states.
          nyxgpt ops port-forward --status
          if ! nyxgpt ops port-forward --status | grep -q 'Background port-forward running'; then
            echo "::error::the deploy left no managed background forward on a cluster whose host ports it cannot map -- the SRE tier is unreachable until the operator opens a terminal (#3986)"
            fail=1
          fi
          # Supervised and detached, which is the property a bare `kubectl
          # port-forward` lacks: it dies with the Pod it attached to.
          pgrep -af "kubectl.*port-forward" || true
          kubectl -n nyxgpt get svc grafana prometheus jaeger glitchtip \
            -o custom-columns='NAME:.metadata.name,TYPE:.spec.type,NODEPORT:.spec.ports[*].nodePort'
          exit $fail

      - name: All four SRE UIs answer through it
        run: |
          set -uo pipefail
          fail=0
          check() { # <label> <url> <expected>
            code=000
            for _ in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$2" || echo 000)
              [ "$code" = "$3" ] && break
              sleep 3
            done
            echo "  $1 -> $code (expect $3)"
            [ "$code" = "$3" ] || { echo "::error::$1 expected $3, got $code"; fail=1; }
          }
          check "grafana health" http://127.0.0.1:3001/api/health 200
          check "prometheus ready" http://127.0.0.1:9090/-/ready 200
          check "jaeger UI" http://127.0.0.1:16686/ 200
          check "glitchtip UI" http://127.0.0.1:8080/ 200
          exit $fail

      - name: nyxgpt ops port-forward --stop releases every host port
        # The other half of an access path nyxGPT establishes: it has to be
        # nyxGPT's to take back. A `--stop` that reported success while the
        # child kept the ports would leave the next install unable to bind
        # them, with nothing on screen to say why.
        run: |
          set -uo pipefail
          fail=0
          nyxgpt ops port-forward --stop
          # The same sentinel as above, read the other way round -- NOT the
          # idle sentence. `tests/unit/test_port_forward_status_predicate.py`
          # pins every `--status` grep in this repo to this one pattern, and
          # two spellings of the same question is how the predicate drifted in
          # the first place.
          if nyxgpt ops port-forward --status | grep -q 'Background port-forward running'; then
            nyxgpt ops port-forward --status
            echo "::error::--stop returned but --status still reports a forward"
            fail=1
          fi
          if pgrep -af "kubectl.*port-forward"; then
            echo "::error::--stop left a kubectl port-forward child alive"
            fail=1
          fi
          # And the ports really are free: asserted by the UIs going dark, not
          # by the absence of a pid. Five attempts, not twenty -- this waits
          # for a port to STOP answering.
          for probe in "grafana=http://127.0.0.1:3001/api/health" \
                       "prometheus=http://127.0.0.1:9090/-/ready" \
                       "jaeger=http://127.0.0.1:16686/" \
                       "glitchtip=http://127.0.0.1:8080/"; do
            still=0
            for _ in $(seq 1 5); do
              if curl -fsS -o /dev/null --max-time 5 "${probe#*=}" 2>/dev/null; then still=1; fi
              sleep 2
            done
            echo "  ${probe%%=*} after --stop -> $([ "$still" = 1 ] && echo answering || echo dark)"
            [ "$still" = 0 ] || {
              echo "::error::${probe%%=*} still answers after --stop -- the host port was not released"; fail=1; }
          done
          exit $fail

      - name: nyxgpt ops down --kubernetes never destroys a cluster it did not create
        run: |
          set -uo pipefail
          nyxgpt ops down --kubernetes || true
          if ! kind get clusters | grep -qx "$BYO_CLUSTER"; then
            echo "::error::the wrapped teardown deleted a bring-your-own cluster"
            exit 1
          fi
          echo "  $BYO_CLUSTER survived the wrapped teardown"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n nyxgpt get all || true
          kubectl -n nyxgpt get events --sort-by=.lastTimestamp | tail -40 || true
          docker port "${BYO_CLUSTER}-control-plane" || true
          kubectl -n nyxgpt get svc \
            -o custom-columns='NAME:.metadata.name,TYPE:.spec.type,NODEPORT:.spec.ports[*].nodePort' || true
          nyxgpt ops port-forward --status || true
          cat "$HOME/.nyxGPT/k8s/port-forward.log" 2>/dev/null || true

      - name: Tear down
        if: always()
        # Deleted HERE, by the job that created it -- deliberately not by
        # `nyxgpt ops down`, which the step above asserts leaves it alone.
        run: kind delete cluster --name "$BYO_CLUSTER" || true
