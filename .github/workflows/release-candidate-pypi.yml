name: Release Candidate (PyPI)

# Publishes the release-branch tip to PyPI as a PEP 440 pre-release --
# `3.0.0rcN` (#3727).
#
# Why this exists: acceptance testing of the repo-less and cloud paths
# installs nyxGPT *from PyPI* (`pip install nyxgpt`, the EC2 user-data
# bootstrap, `nyxgpt cloud deploy`), so without a published artifact it can
# only ever exercise the last stable release -- never the tip carrying the
# acceptance-failure fixes merged during that same round of testing. An RC
# gives a clean machine (or EC2 instance) something to install by exact pin,
# with no repo checkout.
#
# This is the one, deliberate exception to release-artifacts.yml's "PyPI is
# deliberately NOT published here" rule, and it does not touch the stable
# path: `scripts/release_ceremony.sh` Phase 2 still publishes `3.0.0` from
# the owner's machine with the owner's token, unchanged. An RC is for
# acceptance only -- never announced, never a release.
#
# Guardrails (each one enforced, not just described):
#   * dispatch-only -- there is no push/tag/release trigger below;
#   * release branches only -- the version step refuses any ref that is not
#     `v<X.Y.Z>` matching pyproject.toml's declared version;
#   * pre-release version -- what gets uploaded is always `<release>rcN`, so
#     `pip install nyxgpt` cannot resolve to it (pip excludes pre-releases
#     unless the user passes `--pre` or pins the version exactly);
#   * no number reuse -- the next RC number is read from what PyPI already
#     serves, and PyPI itself rejects a re-upload.
#
# The guardrails and the version arithmetic live in
# `src/nyxgpt/release_candidate.py` (unit-tested), not in shell here, so CI
# and `nyxgpt release rc` can never disagree about what `3.0.0rcN` means.
#
# OWNER SETUP (one-time, either option):
#   a) Trusted Publishing (preferred, no stored secret): on pypi.org ->
#      project `nyxgpt` -> Publishing, add a GitHub publisher with
#      owner `dkblinux98`, repository `nyxGPT`, workflow
#      `release-candidate-pypi.yml`, environment blank. The `id-token: write`
#      permission below is what mints the OIDC token.
#   b) API token: add a project-scoped PyPI token as the repo Actions secret
#      `PYPI_API_TOKEN` (the same token `release_ceremony.sh` uses from
#      config.ini -- `nyxgpt ops secrets-sync` can push it).
# When the secret is present it is used; otherwise the job falls back to
# Trusted Publishing. See docs/cloud.md#release-candidates-acceptance-testing-unreleased-code.

on:
  workflow_dispatch:
    inputs:
      rc_number:
        description: 'RC number to publish (blank = next unused, e.g. 2 -> 3.0.0rc2)'
        required: false
        default: ''
      dry_run:
        description: 'Build, check and smoke-install only -- upload nothing to PyPI'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish-rc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC); unused with the token fallback
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: pip install --quiet build twine httpx

      - name: Resolve the RC version and pin pyproject.toml
        id: version
        env:
          RC_NUMBER: ${{ inputs.rc_number }}
          # `nyxgpt.release_candidate` only needs stdlib + httpx, so it runs
          # straight from the checkout -- no need to install the package
          # (whose own version is what this step is about to rewrite).
          PYTHONPATH: src
        run: |
          set -euo pipefail
          # This is the release-branch guardrail: the module exits non-zero
          # for any ref that is not v<X.Y.Z> matching the declared version.
          RC_VERSION=$(python -m nyxgpt.release_candidate \
            --branch "$GITHUB_REF_NAME" \
            --rc-number "$RC_NUMBER" \
            --pin pyproject.toml)
          echo "rc_version=${RC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${RC_VERSION} from ${GITHUB_REF_NAME}"
          # The pin is build-time only -- it is never committed, so the
          # release branch keeps declaring the stable version it heads for.
          git --no-pager diff -- pyproject.toml

      - name: Build sdist + wheel
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - name: Clean-venv smoke (the artifact must import and answer --help)
        run: |
          set -euo pipefail
          python -m venv /tmp/smokeenv
          /tmp/smokeenv/bin/pip install --quiet dist/*.whl
          /tmp/smokeenv/bin/python -c "import nyxgpt"
          INSTALLED=$(/tmp/smokeenv/bin/python -c "from importlib.metadata import version; print(version('nyxgpt'))")
          echo "installed version: ${INSTALLED}"
          [ "$INSTALLED" = "${{ steps.version.outputs.rc_version }}" ] || {
            echo "::error::built artifact reports ${INSTALLED}, expected ${{ steps.version.outputs.rc_version }}"
            exit 1
          }
          /tmp/smokeenv/bin/nyxgpt --help >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: nyxgpt-rc-${{ steps.version.outputs.rc_version }}
          path: dist/*

      - name: Dry run -- nothing uploaded
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::dry_run: built and verified ${{ steps.version.outputs.rc_version }}, uploaded nothing."

      - name: Choose the publishing credential
        id: auth
        if: ${{ !inputs.dry_run }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          # A stored token wins when the owner has one; otherwise this job
          # relies on Trusted Publishing (see OWNER SETUP above). Only the
          # emptiness of the secret is ever echoed, never the secret.
          if [ -n "${PYPI_API_TOKEN:-}" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Publishing with the PYPI_API_TOKEN Actions secret"
          else
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "No PYPI_API_TOKEN secret set -- publishing via Trusted Publishing (OIDC)"
          fi

      - name: Publish to PyPI (API token)
        if: ${{ !inputs.dry_run && steps.auth.outputs.mode == 'token' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        if: ${{ !inputs.dry_run && steps.auth.outputs.mode == 'oidc' }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify PyPI serves the RC
        if: ${{ !inputs.dry_run }}
        env:
          RC_VERSION: ${{ steps.version.outputs.rc_version }}
        run: |
          code=000
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/nyxgpt/${RC_VERSION}/json")
            [ "$code" = "200" ] && break
            echo "pypi.org does not serve nyxgpt==${RC_VERSION} yet (attempt $i/20, http $code) -- retrying in 15s"
            sleep 15
          done
          if [ "$code" != "200" ]; then
            echo "::error::pypi.org never served nyxgpt==${RC_VERSION}"
            exit 1
          fi

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          RC_VERSION: ${{ steps.version.outputs.rc_version }}
        run: |
          {
            echo "### Release candidate \`${RC_VERSION}\` published"
            echo ""
            echo "Acceptance-only pre-release cut from \`${GITHUB_REF_NAME}\`."
            echo "\`pip install nyxgpt\` still resolves to the latest **stable** release."
            echo ""
            echo '```'
            echo "pip install nyxgpt==${RC_VERSION}"
            echo "nyxgpt cloud user-data --os linux --version ${RC_VERSION}"
            echo "nyxgpt cloud deploy --version ${RC_VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
