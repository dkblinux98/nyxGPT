name: Loop Config Diagnostic

# Read-only diagnostic: prints the agent-loop gate variables into the run
# log so an agent session (which cannot read repo Actions variables via the
# API) can see exactly what the loop workflows' `if:` conditions evaluate
# against. Compares the agent logins the gates expect vs. reality, and shows
# the release-pointer vars that the flip churns. Same "read-it-from-the-log"
# pattern as code_scan_report.yml. Prints login NAMES only -- no secrets.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Print loop gate variables
        run: |
          echo "AGENTS_ENABLED        = '${{ vars.AGENTS_ENABLED }}'"
          echo "HUMAN_OWNER           = '${{ vars.HUMAN_OWNER }}'"
          echo "SCRUM_AGENT           = '${{ vars.SCRUM_AGENT }}'"
          echo "DEV_AGENT             = '${{ vars.DEV_AGENT }}'"
          echo "REVIEW_AGENT          = '${{ vars.REVIEW_AGENT }}'"
          echo "RELEASE_BRANCH        = '${{ vars.RELEASE_BRANCH }}'"
          echo "RELEASE_ISSUE_NUMBER  = '${{ vars.RELEASE_ISSUE_NUMBER }}'"
          echo "---"
          echo "This run's actor      = '${{ github.actor }}'"
          echo "Default branch head   = '${{ github.ref_name }}'"
