name: Branch Guard Smoke

# Executed evidence (ledger D-006) for #3862's branch-deletion guard.
#
# The question this job answers by RUNNING: given three branches that look
# identical from the outside -- same author, no PR, closed issue, weeks old --
# does the cleanup delete exactly the redundant one and refuse the two holding
# the only copy of their work?
#
# It is a fault-injection job (#3753's template), not just a run of the guard:
# the first half proves the cheap signals INVERT the truth on this data
# (commit count ranks the fully-landed branch as the most unmerged; ancestry
# calls it unmerged; merging it conflicts), and only then does the second half
# show the content check getting all three right. Without the first half the
# job would pass on any machine where the defect cannot reproduce, which is
# exactly how an rc candidate passed CI and died on the owner's Mac (#3753).
#
# Nothing here touches a real branch or a real remote: it plants a scratch bare
# `origin` in a temp directory.

on:
  pull_request:
    paths:
      - "scripts/agents/lib/branch_content.py"
      - "scripts/agents/lib/gh_project.sh"
      - "scripts/agents/reconcile_dead_branches.sh"
      - "scripts/agents/developer_create_branch.sh"
      - "scripts/agents/developer_ensure_pr_exists.sh"
      - "scripts/agents/review_accept_and_merge.sh"
      - "scripts/agents/developer_submit_for_review.sh"
      - "scripts/branch-guard-smoke.sh"
      - "scripts/agents/reconcile_work_branch.sh"
      - "scripts/agents/snapshot_safe_add.sh"
      - "tests/test_branch_hygiene.sh"
      - "tests/test_ensure_pr_exists.sh"
      - "tests/test_reconcile_work_branch.sh"
      - "tests/unit/test_branch_content.py"
      - "tests/unit/test_developer_retry_continuity.py"
      - ".github/workflows/branch-guard-smoke.yml"
      - ".github/workflows/developer_auto_implement.yml"
  push:
    paths:
      - "scripts/agents/lib/branch_content.py"
      - "scripts/agents/lib/gh_project.sh"
      - "scripts/agents/reconcile_dead_branches.sh"
      - "scripts/agents/developer_create_branch.sh"
      - "scripts/agents/developer_ensure_pr_exists.sh"
      - "scripts/agents/review_accept_and_merge.sh"
      - "scripts/agents/developer_submit_for_review.sh"
      - "scripts/branch-guard-smoke.sh"
      - "scripts/agents/reconcile_work_branch.sh"
      - "scripts/agents/snapshot_safe_add.sh"
      - "tests/test_branch_hygiene.sh"
      - "tests/test_ensure_pr_exists.sh"
      - "tests/test_reconcile_work_branch.sh"
      - "tests/unit/test_branch_content.py"
      - "tests/unit/test_developer_retry_continuity.py"
      - ".github/workflows/branch-guard-smoke.yml"
      - ".github/workflows/developer_auto_implement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-guard-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: The guard refuses the branch that holds the only copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Plant the three branch shapes and run the guard against them
        run: bash scripts/branch-guard-smoke.sh

      - name: The rescue backstop, and the contract that keeps it recoverable
        # #3862 round 2: the rescue draft is only worth opening if a
        # reassignment can find it and finish it. This runs the script end to
        # end against a real bare origin and a stub gh, and pins the marker
        # string it writes to the one developer_auto_implement.yml matches --
        # the coupling that stops a rescue draft from becoming permanent debris
        # whose head branch no cleanup may touch.
        #
        # #3862 round 2 adds the case that reopened the issue: the caller
        # passes NO branch, because the branch the run pushed is not the one
        # the workspace is standing on when the backstop fires. Its
        # fault-injection half restores the retired `git branch
        # --show-current` form and shows it rescuing nothing on the same
        # fixture.
        run: bash tests/test_ensure_pr_exists.sh

      - name: The unit fixtures, including the rebased-but-landed ledger case
        # `pip install -e .` and not just `pip install pytest`: the root
        # `tests/conftest.py` imports `tests/log_guard.py` (-> psutil) and
        # `nyxgpt.config`/`nyxgpt.logging`, and nothing puts `src/` on the path
        # but the install. Without it pytest dies at collection with exit 4 and
        # this job reports a red check that says nothing about the guard.
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .
          pip install pytest
          python -m pytest tests/unit/test_branch_content.py -v

  retry-continuity:
    name: A failed verification continues the work, it does not restart it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reproduce run #4033 and prove the retry continues rather than restarts
        # #4038. The question this answers by RUNNING: attempt 1 pushes its
        # work, verification fails, and attempt 2 starts on a fresh
        # `claude/issue-N-<timestamp>` branch cut from the release branch --
        # because that is what claude-code-action does on every invocation.
        # Does the run end with ONE branch carrying both attempts, or with two
        # divergent branches and a rescue draft PR?
        #
        # Fault-injection job (#3753's template), not just a run of the fix:
        # case 1b runs the RETIRED force-push form -- the one the review path
        # used at developer_auto_implement.yml:864 until this change -- against
        # the identical fixture and shows it erasing attempt 1's commit. A
        # check that cannot fail proves nothing.
        run: bash tests/test_reconcile_work_branch.sh

      - name: The wiring the shell test cannot see
        # Whether the reconciliation runs at all, whether the retry prompts
        # name the branch instead of asserting continuity, and whether the
        # action is still pinned to a commit rather than the floating `@v1`
        # tag that let its branch handling change underneath this repo.
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .
          pip install pytest
          python -m pytest tests/unit/test_developer_retry_continuity.py -v

  closure-gate:
    name: A merge that cannot be verified does not close its issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fault injection — an unverifiable merge must refuse to close
        # #3789 and #3815 were both closed as `completed` with their fixes
        # stranded. The gate in review_accept_and_merge.sh is only worth
        # anything if it says no when the content is not there, so prove that
        # half directly against the check it calls.
        run: bash scripts/closure-gate-smoke.sh
