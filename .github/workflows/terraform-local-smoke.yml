name: Terraform Local Smoke

# Least-privilege token: this smoke gate only reads the checked-out code (CodeQL #2).
permissions:
  contents: read

# The full-stack local deploy is `nyxgpt ops install --terraform`
# (there is no raw `docker compose up` full-stack path). This gate exercises
# that command end-to-end -- a real deploy of the Terraform stack + Docker
# images + observability -- to catch the class of integration defects that
# unit-test / type-check CI can't see: web build errors, the api's missing
# example.config.ini / httpx, the terraform network aliases + cassandra
# cluster name, the derived-config transforms, and observability on the
# terraform network (Prometheus scraping the api). Since #3824 it also sends
# the first chat message: the `--terraform` install now pulls the configured
# chat and embedding models after `apply`, and the only way to know a Terraform
# deploy is chattable is to chat with it. (The fault-injected half of that
# proof -- delete the model, watch the chat fail, re-install, watch it work --
# lives in linux-native-smoke.yml, where re-running the install is cheap.)
# See the trigger scope below.
#
# TWO jobs, one per install mode (#3835):
#
#   terraform-local-smoke     `--dev`: images built from this ref's working
#                             tree. This is what the job did before #3835, when
#                             the deploy was permanently (and silently) in dev
#                             mode -- so it keeps testing THIS ref's code.
#   terraform-artifact-smoke  the default artifact path, run from a wheel
#                             installed into a venv with no checkout in reach,
#                             AT A RELEASE CANDIDATE VERSION (#3985). Answers
#                             the question the other job structurally cannot:
#                             can a machine with no repository deploy at all,
#                             and can it deploy the build acceptance testing
#                             is actually holding? It is the executed evidence
#                             for #3835's repo-less acceptance criterion and
#                             for #3985's rc criterion.

# Scoped to Terraform changes only. Standing up the full `--terraform`
# stack is expensive, so this must not gate every code review -- it runs only
# when the Terraform config, the packaged copy of it, the install-mode marker
# or this workflow changes. Trade-off: it will NOT catch app-code (src/**,
# web/**), Dockerfile/Compose, or ops.py deploy-logic changes that could break
# the deploy. Add those globs back here if that broader coverage is wanted.
#
# `src/nyxgpt/ops.py` is on the list since #3985: the artifact path's images
# are now BUILT by ops (from the published source tarballs) rather than pulled
# from a registry, so a change to that build is a change to what this job
# deploys. It is the same reason k8s-artifact-smoke.yml carries the glob.
on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'src/nyxgpt/resources/terraform/**'
      - 'src/nyxgpt/ops.py'
      - 'src/nyxgpt/install_mode.py'
      - 'src/nyxgpt/model_bootstrap.py'
      - 'src/nyxgpt/release_tarball.py'
      - 'scripts/first-chat-smoke.py'
      - '.github/workflows/terraform-local-smoke.yml'
  push:
    paths:
      - 'terraform/**'
      - 'src/nyxgpt/resources/terraform/**'
      - 'src/nyxgpt/ops.py'
      - 'src/nyxgpt/install_mode.py'
      - 'src/nyxgpt/model_bootstrap.py'
      - 'src/nyxgpt/release_tarball.py'
      - 'scripts/first-chat-smoke.py'
      - '.github/workflows/terraform-local-smoke.yml'

jobs:
  terraform-local-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'

      - name: Install nyxgpt (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Seed a native config from the tracked example
        run: |
          mkdir -p "$HOME/.nyxGPT"
          # example.config.ini is the human template / schema source of truth;
          # it's a valid native config for a from-scratch bring-up.
          cp example.config.ini "$HOME/.nyxGPT/config.ini"

      - name: Pre-create Docker bind-mount volume dirs (Linux runner perms)
        run: |
          # On the Linux runner, Docker creates missing bind-mount source dirs
          # as root, so the non-root users inside the observability containers
          # (prometheus=nobody, grafana=472, loki=10001, postgres=999) can't
          # write their data dir and the container crash-loops -> unhealthy ->
          # the whole `--terraform` deploy fails. Docker Desktop on
          # macOS maps these to the invoking user, so this only bites CI. Pre-
          # create them world-writable before bring-up so every container's
          # user can write regardless of its uid.
          for d in prometheus grafana loki glitchtip-postgres glitchtip-uploads \
                   cassandra ollama nyxgpt-data; do
            mkdir -p "$HOME/.nyxGPT/volumes/$d"
            chmod 777 "$HOME/.nyxGPT/volumes/$d"
          done

      # --dev is what this job has always tested (#3835): images built from
      # the checked-out tree. Without the flag it would deploy the published
      # images instead, and this job would stop covering the ref under test.
      #
      # And no --local: local is the default locality since #3948, so the
      # command a user now types carries no locality flag. This deploy is the
      # executed evidence for that default -- the artifact job below still
      # passes --local explicitly, which is the evidence that it remains
      # accepted as a no-op.
      - name: nyxgpt ops install --terraform --dev
        run: nyxgpt ops install --terraform --dev

      - name: The deployment must report its own install mode, not the native one
        run: |
          set -euo pipefail
          nyxgpt ops status | tee /tmp/status.txt
          grep -q "Install mode (terraform): dev" /tmp/status.txt
          grep -q "terraform api: running  \[dev\]" /tmp/status.txt

      # #3984, asserted against the APPLIED STATE rather than the source: the
      # provider must have built nothing, in the mode where it used to build
      # the most. Its build streams the context through the daemon's legacy
      # (pre-BuildKit) endpoint, which on Docker 29.x with the containerd
      # image store fails deterministically ("archive/tar: invalid tar
      # header", "unpigz: ... corrupted -- invalid deflate data").
      #
      # This runner cannot reproduce THAT failure -- ubuntu-latest runs an
      # older daemon with the classic image store, where the legacy build
      # works, which is exactly why this job was green throughout the defect.
      # So the assertion is the one CI can actually make and that a
      # regression would break: no `build` block reached the state, and both
      # images ops built are present. Re-adding `dynamic "build"` fails this
      # step here and fails test_terraform_stack.py's source-level guard.
      - name: Terraform itself must have built neither image
        run: |
          set -euo pipefail
          terraform -chdir="$HOME/.nyxGPT/terraform" show -json > /tmp/tfstate.json
          builds=$(jq '[.values.root_module.resources[]
                        | select(.type == "docker_image")
                        | select(.values.build != null and (.values.build | length) > 0)]
                       | length' /tmp/tfstate.json)
          echo "  docker_image resources carrying a build block -> ${builds} (expect 0)"
          [ "$builds" = "0" ] || {
            echo "::error::the docker provider built an image -- the #3984 regression"
            jq '.values.root_module.resources[] | select(.type == "docker_image")' /tmp/tfstate.json
            exit 1
          }
          # ...and the images terraform consumed are the ones ops built.
          docker image inspect nyxgpt-api:local >/dev/null
          docker image inspect nyxgpt-web:local >/dev/null

      # The other half of #3984's acceptance: staleness is ops' job now, and
      # a rebuilt tag still has to roll the containers. Touch a fingerprinted
      # source file, re-install, and require the api container to be a
      # different container than before.
      - name: A source change must rebuild and roll the container
        run: |
          set -euo pipefail
          before=$(docker inspect --format '{{.Id}}' nyxgpt-tf-api)
          echo "# terraform-local-smoke rebuild probe" >> src/nyxgpt/__init__.py
          nyxgpt ops install --terraform --dev
          after=$(docker inspect --format '{{.Id}}' nyxgpt-tf-api)
          echo "  nyxgpt-tf-api ${before:0:12} -> ${after:0:12}"
          [ "$before" != "$after" ] || {
            echo "::error::a source change did not roll the api container"
            exit 1
          }
          git checkout -- src/nyxgpt/__init__.py

      - name: Verify core + observability are actually serving
        run: |
          set -uo pipefail
          fail=0
          # `nyxgpt ops install --terraform` returns once its own
          # internal health-waits (Grafana's Compose healthcheck, etc.) are
          # satisfied, but that doesn't cover every container's own startup
          # tail (e.g. a container reporting healthy just as its app finishes
          # binding its port). Poll for up to 60s (20 attempts * 3s) before
          # giving up, instead of a single-shot check that can race it (#3636).
          check() { # <label> <url> <expected> [<attempts>] [<delay>]
            label="$1" url="$2" expected="$3" attempts="${4:-20}" delay="${5:-3}"
            code=000
            i=1
            while [ "$i" -le "$attempts" ]; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
              [ "$code" = "$expected" ] && break
              sleep "$delay"
              i=$((i + 1))
            done
            echo "  $label -> $code (expect $expected)"
            [ "$code" = "$expected" ] || { echo "::error::$label expected $expected, got $code"; fail=1; }
          }
          check "api  /api/v1/models" http://localhost:8000/api/v1/models 200
          check "web  /"              http://localhost:3000/ 200
          check "web  /api/models"    http://localhost:3000/api/models 200
          check "grafana health"      http://localhost:3001/api/health 200
          check "jaeger UI"           http://localhost:16686/ 200
          check "glitchtip UI"        http://localhost:8080/ 200
          # Prometheus must be scraping the terraform api over the shared network.
          prom_targets="http://localhost:9090/api/v1/targets?state=active"
          api_target=$(curl -s --max-time 20 "$prom_targets" | jq -r '
            first(.data.activeTargets[]
                  | select(((.labels.job // "") + .scrapeUrl) | test("api"))
                  | .health) // "MISSING"' 2>/dev/null || echo ERR)
          echo "  prometheus api target -> $api_target (expect up)"
          [ "$api_target" = "up" ] || { echo "::error::prometheus is not scraping the api (got $api_target)"; fail=1; }
          exit $fail

      # The acceptance question for #3824, asked of the Terraform run mode:
      # can a user send a first chat message without anyone having pulled a
      # model by hand? The install's `required models` step is what makes this
      # possible; this is what proves it did.
      - name: First chat must work with no manual model pull
        run: |
          python3 scripts/first-chat-smoke.py \
            --install-cmd "nyxgpt ops install --terraform --dev" \
            --skip-fault-injection

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          for c in nyxgpt-tf-api nyxgpt-tf-web nyxgpt-tf-cassandra \
                   nyxgpt-prometheus-1 nyxgpt-grafana-1 nyxgpt-loki-1 \
                   nyxgpt-otel-collector-1 nyxgpt-glitchtip-migrate-1; do
            echo "::group::logs $c"; docker logs "$c" --tail 80 2>&1 || true; echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: nyxgpt ops down --terraform || true

  # Can a machine with NO repository deploy the Terraform stack, at the
  # version it is actually running? (#3835, #3985)
  #
  # The job above cannot answer that: it installs nyxgpt editable from the
  # checkout, so every repo-relative path it needs happens to exist. Here
  # nyxgpt is a wheel installed into a venv, `REPO_ROOT` resolves inside
  # site-packages, and the install is run from an empty directory -- the
  # Terraform configuration has to come from package data, the api/web images
  # from the published source tarballs, and nothing from a checkout.
  #
  # The version is stamped as an rc, deliberately: an rc is what acceptance
  # testing installs, an rc publishes no container image, and the pre-#3985
  # code silently deployed the previous *stable* release in that case. See the
  # stamp step below.
  terraform-artifact-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.5'

      # The version under test is stamped as a RELEASE CANDIDATE before the
      # wheel is built (#3985, fault injection per CLAUDE.md/#3753). The
      # branch's declared version is a plain `3.0.0`, and a plain version is
      # the one case the old code happened to survive -- `ghcr.io/.../
      # nyxgpt-api:3.0.0` might exist, so the pull could succeed and the job
      # stay green while the mode was broken for every candidate. An rc is
      # what the owner actually installs during acceptance, and an rc
      # publishes NO container image at all (release-artifacts.yml triggers
      # on `released`; a prerelease fires `prereleased`), so this is the
      # configuration that failed. Nothing downstream may substitute another
      # release for it.
      - name: Stamp an rc version, build the wheel, install it into a clean venv
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re
          p = pathlib.Path("pyproject.toml")
          text = p.read_text()
          new, n = re.subn(r'^version = "([^"]+)"$', r'version = "\1rc99"', text,
                           count=1, flags=re.MULTILINE)
          assert n == 1, "could not stamp the rc version into pyproject.toml"
          p.write_text(new)
          PY
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir /tmp/wheel
          mkdir -p /tmp/clean
          python -m venv /tmp/clean/venv
          /tmp/clean/venv/bin/pip install --quiet /tmp/wheel/*.whl
          RC_VERSION=$(/tmp/clean/venv/bin/python -c \
            'from nyxgpt import ops; print(ops._native_service_version())')
          echo "RC_VERSION=${RC_VERSION}" >> "$GITHUB_ENV"
          case "$RC_VERSION" in *rc99) ;; *)
            echo "::error::expected an rc version, got ${RC_VERSION}"; exit 1 ;;
          esac

      # Both halves of the "no checkout" claim, before anything is deployed:
      # the wheel must contain the Terraform configuration, and the installed
      # nyxgpt must NOT believe it is running from a checkout (which is what
      # would silently re-enable every repo-relative path).
      - name: The installed package must be repo-less and carry the configuration
        working-directory: /tmp/clean
        run: |
          set -euo pipefail
          ./venv/bin/python - <<'PY'
          from nyxgpt import ops
          assert ops._dev_checkout_root() is None, ops.REPO_ROOT
          packaged = ops._packaged_local_terraform_dir()
          missing = [n for n in ("main.tf", "variables.tf", "outputs.tf", "versions.tf")
                     if not (packaged / n).is_file()]
          assert not missing, f"wheel is missing {missing} from {packaged}"
          print("repo-less:", ops.REPO_ROOT, "| config:", packaged)
          PY

      # PRE-FIX PATH MUST FAIL (#3985, fault-injection half). The old code
      # pulled `ghcr.io/<owner>/nyxgpt-api:<version>` and fell back to
      # `:latest`. Prove the rc image genuinely does not exist, so the green
      # deploy below cannot be green by having quietly pulled one -- and so a
      # regression that reintroduces the registry dependency fails here
      # rather than deploying the wrong release.
      - name: The rc under test must have no published container image
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/nyxgpt-api:${RC_VERSION}"
          if docker manifest inspect "$ref" >/tmp/manifest.txt 2>&1; then
            echo "::error::${ref} exists -- this job can no longer prove the"
            echo "::error::artifact path is independent of the registry"
            exit 1
          fi
          echo "  ${ref} -> $(head -1 /tmp/manifest.txt)"

      # The artifacts the install below consumes: the two service source
      # tarballs a release publishes, built by the same builder the release
      # publishes with (`release_tarball._create_dist_tarball`) and staged for
      # `$NYXGPT_ARTIFACT_DIR` -- the supported escape hatch for "this version
      # is not published yet", exactly as k8s-artifact-smoke.sh stages them.
      # An rc publishes precisely these, which is the whole reason the
      # Terraform artifact path builds from them now (#3985).
      - name: Stage the published-shape source tarballs for the rc under test
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/src" python - "$RC_VERSION" /tmp/artifacts <<'PY'
          import sys
          from pathlib import Path

          from nyxgpt import release_tarball

          version, out = sys.argv[1], Path(sys.argv[2])
          for name in ("nyxgpt-api", "nyxgpt-web"):
              print("staged", release_tarball._create_dist_tarball(out, name, version))
          PY
          ls /tmp/artifacts/dist
          # The tarballs are vendored, so the rc stamp has served its purpose:
          # restore the tracked version before anything else in the job reads
          # the checkout's pyproject.toml.
          git checkout -- pyproject.toml

      - name: Seed a native config from the tracked example
        run: |
          mkdir -p "$HOME/.nyxGPT"
          cp example.config.ini "$HOME/.nyxGPT/config.ini"

      - name: Pre-create Docker bind-mount volume dirs (Linux runner perms)
        run: |
          # Same reason as the job above: Docker creates missing bind-mount
          # sources as root on the Linux runner, and the non-root users inside
          # the observability containers then can't write their data dir.
          for d in prometheus grafana loki glitchtip-postgres glitchtip-uploads \
                   cassandra ollama nyxgpt-data; do
            mkdir -p "$HOME/.nyxGPT/volumes/$d"
            chmod 777 "$HOME/.nyxGPT/volumes/$d"
          done

      # Run from an empty directory: nothing here resolves relative to the
      # checkout, and a regression that reintroduces such a lookup fails.
      # --local is passed deliberately here (#3948): it is now a no-op, and
      # this is the executed proof that the flag existing scripts and docs
      # still carry is accepted rather than rejected as unrecognized.
      # No NYXGPT_TF_*_IMAGE override: the real resolution runs. Before #3985
      # this job DID set them, which is precisely why it never caught the
      # defect -- the override short-circuited the registry pull the owner's
      # machine actually took. The only staging is $NYXGPT_ARTIFACT_DIR, the
      # same escape hatch every other artifact-path smoke uses for a version
      # that is not published yet.
      - name: nyxgpt ops install --terraform --local (artifact path, rc, no checkout)
        working-directory: /tmp/clean
        env:
          NYXGPT_ARTIFACT_DIR: /tmp/artifacts/dist
        run: /tmp/clean/venv/bin/nyxgpt ops install --terraform --local

      - name: The deployment must run THE RC, and report which build it is
        working-directory: /tmp/clean
        run: |
          set -euo pipefail
          ./venv/bin/nyxgpt ops status | tee /tmp/status.txt
          grep -q "Install mode (terraform): artifact" /tmp/status.txt
          grep -q "terraform api: running  \[artifact\]" /tmp/status.txt
          # #3985's acceptance criterion: the running CLI's OWN version, rc
          # included, named in what status reports.
          grep -q "nyxgpt-api:artifact-${RC_VERSION}" /tmp/status.txt
          grep -q "nyxgpt-web:artifact-${RC_VERSION}" /tmp/status.txt
          # ...and no other release substituted for it, anywhere.
          if grep -q ":latest" /tmp/status.txt; then
            echo "::error::a :latest image reached the deployment -- the #3985 regression"
            exit 1
          fi
          # The containers must actually be running those images, not just be
          # reported as doing so. Compared by image ID, not by name: main.tf
          # sets `image = docker_image.api.image_id`, so the container records
          # the digest rather than the tag.
          for pair in "nyxgpt-tf-api nyxgpt-api" "nyxgpt-tf-web nyxgpt-web"; do
            set -- $pair
            running=$(docker inspect --format '{{.Image}}' "$1")
            want=$(docker image inspect --format '{{.Id}}' "$2:artifact-${RC_VERSION}")
            echo "  $1 -> ${running:0:19} (want ${want:0:19})"
            [ "$running" = "$want" ] || {
              echo "::error::$1 is not running $2:artifact-${RC_VERSION}"
              exit 1
            }
          done

      # Fault injection (#3753's template): the runner cannot reach the
      # post-upgrade state of a pre-#3835 deployment naturally -- containers
      # up, marker absent -- so it is injected. Those deployments were built
      # from a working tree, so reporting them as the artifact default states
      # the reverse of the truth. Marker is restored afterwards; the serving
      # checks below run against the same untouched stack.
      - name: A live deployment whose mode was never recorded must not read as artifact
        working-directory: /tmp/clean
        run: |
          set -euo pipefail
          mv ~/.nyxGPT/install-mode-terraform.json /tmp/install-mode-terraform.json
          ./venv/bin/nyxgpt ops status | tee /tmp/status-unrecorded.txt
          grep -q "Install mode (terraform): not recorded" /tmp/status-unrecorded.txt
          grep -q "terraform api: running  \[unrecorded\]" /tmp/status-unrecorded.txt
          # Not `! grep ...`: bash's `set -e` explicitly does not fire on a
          # command whose status is inverted by `!`, so that spelling would
          # assert nothing at all.
          if grep -q "Install mode (terraform): artifact" /tmp/status-unrecorded.txt; then
            echo "::error::an unrecorded live deployment was reported as artifact"
            exit 1
          fi
          # doctor reports it too -- and does not fail over it: an unknown
          # build is not a fault, and the stack is serving.
          ./venv/bin/nyxgpt ops doctor | tee /tmp/doctor-unrecorded.txt || true
          grep -q "nothing recorded what these containers were built from" /tmp/doctor-unrecorded.txt
          mv /tmp/install-mode-terraform.json ~/.nyxGPT/install-mode-terraform.json
          ./venv/bin/nyxgpt ops status | grep -q "Install mode (terraform): artifact"

      - name: Verify core + observability are actually serving
        run: |
          set -uo pipefail
          fail=0
          check() { # <label> <url> <expected> [<attempts>] [<delay>]
            label="$1" url="$2" expected="$3" attempts="${4:-20}" delay="${5:-3}"
            code=000
            i=1
            while [ "$i" -le "$attempts" ]; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
              [ "$code" = "$expected" ] && break
              sleep "$delay"
              i=$((i + 1))
            done
            echo "  $label -> $code (expect $expected)"
            [ "$code" = "$expected" ] || { echo "::error::$label expected $expected, got $code"; fail=1; }
          }
          check "api  /api/v1/models" http://localhost:8000/api/v1/models 200
          check "web  /"              http://localhost:3000/ 200
          check "web  /api/models"    http://localhost:3000/api/models 200
          check "grafana health"      http://localhost:3001/api/health 200
          exit $fail

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          for c in nyxgpt-tf-api nyxgpt-tf-web nyxgpt-tf-cassandra \
                   nyxgpt-prometheus-1 nyxgpt-grafana-1; do
            echo "::group::logs $c"; docker logs "$c" --tail 80 2>&1 || true; echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        working-directory: /tmp/clean
        run: ./venv/bin/nyxgpt ops down --terraform || true
