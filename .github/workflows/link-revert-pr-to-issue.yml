name: Link Revert PR to Original Issue

on:
  pull_request:
    types: [opened]

jobs:
  link-revert:
    if: startsWith(github.event.pull_request.body, 'Reverts')
    uses: dkblinux98/nyxAgent/.github/workflows/reusable-link-revert-pr-to-issue.yml@v1.0.0
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_body: ${{ github.event.pull_request.body }}
      repository: ${{ github.repository }}
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
