name: Retro Dashboard Stamp Smoke

# Which question does this job answer? (#3775 executed verification)
#
#   "Does a built retro.html actually show a reader when it was built and how
#    old each dump behind it is — and does the staleness callout fire only
#    when the data really is behind the page?"
#
# The stamps are rendered by the template's JavaScript at page load, so unit
# tests can prove the numbers reached the HTML but not that anyone sees them:
# one template typo blanks the dashboard silently. This job builds the real
# dashboard from a data directory whose stamps are injected (one dump fresh,
# one 30 days behind, the issue corpus unstamped), runs the page script in
# Node, and asserts on the rendered strings. Injecting both halves is the
# point — a lab where every dump is fresh would pass with the callout deleted.
#
# What it does NOT cover: how the stamps look (layout, colour, dark mode) —
# that is the owner's eye on the published artifact.

on:
  push:
    paths:
      - "scripts/retrospective/build_dashboard.py"
      - "scripts/retrospective/retro_template.html"
      - "scripts/retrospective/dump_review_rounds.py"
      - "tests/test_retro_dashboard_stamps.sh"
      - "tests/retro_render_check.mjs"
      - ".github/workflows/retro-dashboard-stamp-smoke.yml"
  pull_request:
    paths:
      - "scripts/retrospective/build_dashboard.py"
      - "scripts/retrospective/retro_template.html"
      - "scripts/retrospective/dump_review_rounds.py"
      - "tests/test_retro_dashboard_stamps.sh"
      - "tests/retro_render_check.mjs"
      - ".github/workflows/retro-dashboard-stamp-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stamps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the dashboard and read its stamps back out of the rendered page
        run: bash tests/test_retro_dashboard_stamps.sh
