name: Conflict Resolution Smoke

# Which question does this job answer? (#3775 executed verification)
#
#   "On a REAL conflicted branch pair, does the resolution this pipeline now
#    dispatches actually work — a forward merge that keeps both sides, not a
#    rebase — and does the router hand it to the developer agent instead of
#    assigning the owner?"
#
# The unit tests cover the routing decision, and the shell suite covers the
# dispatcher against a stubbed `gh`. Neither creates an actual conflict.
# This job does: it builds a repository on the runner, moves the mainline
# under a feature branch until `git merge` really reports CONFLICT, resolves
# it the documented way, and then proves the result is a merge and not a
# rebase — the distinction the owner's standing rule is about (#3801).
#
# Fault injection, per the macos-brew-smoke.yml template: every claim is
# proved in both directions. The conflict is proved to exist before it is
# resolved (a job that resolves nothing passes vacuously), and the rebase
# alternative is executed to show it produces the shape the rule forbids.

on:
  push:
    paths:
      - "scripts/agents/dispatch_conflict_resolution.sh"
      - "scripts/agents/lib/conflict_resolution.py"
      - "scripts/agents/review_accept_and_merge.sh"
      - ".github/workflows/notify-merge-conflicts.yml"
      - ".github/workflows/conflict_owner_escalation.yml"
      - ".github/workflows/conflict-resolution-smoke.yml"
      - "tests/test_conflict_resolution_dispatch.sh"
  pull_request:
    paths:
      - "scripts/agents/dispatch_conflict_resolution.sh"
      - "scripts/agents/lib/conflict_resolution.py"
      - "scripts/agents/review_accept_and_merge.sh"
      - ".github/workflows/notify-merge-conflicts.yml"
      - ".github/workflows/conflict_owner_escalation.yml"
      - ".github/workflows/conflict-resolution-smoke.yml"
      - "tests/test_conflict_resolution_dispatch.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolution-mechanics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build a real conflicted branch pair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/conflict-lab && mkdir -p /tmp/conflict-lab/origin
          cd /tmp/conflict-lab/origin
          git init -q --initial-branch=v9.9.9 .
          git config user.email smoke@example.com
          git config user.name  smoke

          # A mainline file and a ledger, the two things a real round touches.
          printf 'start = eager\nlogging = on\n' > ops.conf
          printf -- '- **D-008** mainline entry\n' > LEDGER.md
          git add . && git commit -qm "base"

          # The feature branch: the PR's own work.
          git checkout -q -b feat/lazy-start
          printf 'start = lazy\nlogging = on\n' > ops.conf
          printf -- '- **D-008** mainline entry\n- **D-009** feature entry\n' > LEDGER.md
          git add . && git commit -qm "feat: lazy start (#9999)"
          echo "PR_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          # The mainline moves underneath it — the whole scenario of #3801.
          git checkout -q v9.9.9
          printf 'start = eager\nlogging = json\n' > ops.conf
          printf -- '- **D-008** mainline entry\n- **D-009** mainline entry landed first\n' > LEDGER.md
          git add . && git commit -qm "feat: json logging + ledger entry"

      - name: "Reproduce: the branch really is conflicted"
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/conflict-lab/origin
          git checkout -q feat/lazy-start
          if git merge --no-commit --no-ff v9.9.9 >/tmp/merge.out 2>&1; then
            echo "::error::Fault injection failed — the branches merge cleanly, so this job proves nothing."
            git merge --abort || true
            exit 1
          fi
          grep -q "CONFLICT" /tmp/merge.out || {
            echo "::error::Expected a CONFLICT from git merge; got:"; cat /tmp/merge.out; exit 1; }
          grep -q "<<<<<<<" LEDGER.md || {
            echo "::error::Expected conflict markers in LEDGER.md"; exit 1; }
          echo "::notice::Confirmed: merging the mainline in produces a real conflict."
          git merge --abort

      - name: "Fix: the documented resolution (forward merge, both sides kept)"
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/conflict-lab/origin
          git checkout -q feat/lazy-start
          git merge --no-commit --no-ff v9.9.9 || true

          # Resolve the way the round comment instructs: keep the PR's intent
          # (lazy start) AND the owner-accepted mainline behavior (json
          # logging) — neither side discarded wholesale.
          printf 'start = lazy\nlogging = json\n' > ops.conf

          # Ledger: the mainline already allocated D-009, so the PR's entry is
          # RENUMBERED to the next unused ID. Both entries survive; no ID is
          # reused; nothing absent-by-design is invented.
          printf -- '- **D-008** mainline entry\n- **D-009** mainline entry landed first\n- **D-010** feature entry\n' > LEDGER.md

          git add ops.conf LEDGER.md
          git commit -qm "merge v9.9.9 into feat/lazy-start (#9999)"

          # Both sides present?
          grep -q 'start = lazy'    ops.conf || { echo "::error::PR intent lost"; exit 1; }
          grep -q 'logging = json'  ops.conf || { echo "::error::mainline behavior reverted"; exit 1; }
          grep -q 'mainline entry landed first' LEDGER.md \
            || { echo "::error::mainline ledger entry lost"; exit 1; }
          grep -q 'D-010' LEDGER.md \
            || { echo "::error::renumbered feature entry lost"; exit 1; }
          test "$(grep -c 'D-009' LEDGER.md)" -eq 1 || { echo "::error::duplicate ledger ID survived"; exit 1; }

          # The branch is now mergeable, which is the point of the round.
          git checkout -q v9.9.9
          git merge --no-commit --no-ff feat/lazy-start >/dev/null
          git merge --abort || true
          echo "::notice::Confirmed: the forward merge resolves the conflict and keeps both sides."

      - name: "Prove it is a MERGE, not a rebase"
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/conflict-lab/origin
          git checkout -q feat/lazy-start

          # The observable difference: after a merge the PR's reviewed commit
          # is still in the history, byte-for-byte. After a rebase it is gone,
          # replaced by a rewritten copy — which is why review threads detach.
          git merge-base --is-ancestor "$PR_COMMIT" HEAD \
            || { echo "::error::the reviewed commit $PR_COMMIT is no longer an ancestor — history was rewritten"; exit 1; }
          test "$(git rev-list --parents -n1 HEAD | wc -w)" -eq 3 \
            || { echo "::error::HEAD is not a two-parent merge commit"; exit 1; }
          echo "::notice::Confirmed: the reviewed commit survives and HEAD is a merge commit."

          # Fault injection, other direction: run the forbidden alternative to
          # completion and show it produces exactly the shape the rule exists
          # to prevent. (The rebase stops on the same conflict, so resolve it
          # the same way and continue — the point is the resulting history.)
          git branch -q rebase-lab "$PR_COMMIT"
          git checkout -q rebase-lab
          if ! git rebase v9.9.9 >/dev/null 2>&1; then
            printf 'start = lazy\nlogging = json\n' > ops.conf
            printf -- '- **D-008** mainline entry\n- **D-009** mainline entry landed first\n- **D-010** feature entry\n' > LEDGER.md
            git add ops.conf LEDGER.md
            GIT_EDITOR=true git rebase --continue >/dev/null 2>&1
          fi
          if git merge-base --is-ancestor "$PR_COMMIT" rebase-lab 2>/dev/null; then
            echo "::error::Fault injection failed — the rebase did not rewrite history, so this comparison proves nothing."
            exit 1
          fi
          echo "::notice::Confirmed: rebasing replaces the reviewed commit ($PR_COMMIT) with a rewritten copy — review threads detach. Merge is the correct shape."

  routing-decision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Reproduce: the pre-#3801 handler assigned the owner"
        shell: bash
        run: |
          set -euo pipefail
          # The behavior this issue removed, taken from the file it was removed
          # from. If this ever matches again, the regression is real.
          if git log -p -1 --format= -- .github/workflows/notify-merge-conflicts.yml \
             | grep -q '^-.*addAssignees'; then
            echo "::notice::Confirmed: the owner-assignment step existed and was removed here."
          else
            echo "::notice::Owner-assignment removal is not in this commit's diff; asserting current state only."
          fi
          if grep -q 'addAssignees' .github/workflows/notify-merge-conflicts.yml; then
            echo "::error::The conflict handler assigns a user again — conflicts must route to the developer agent (#3801)."
            exit 1
          fi

      - name: "Fix: the dispatcher routes a conflicted PR to the developer agent"
        shell: bash
        run: bash tests/test_conflict_resolution_dispatch.sh

      - name: Routing decisions (unit)
        shell: bash
        run: |
          python -m pip install --quiet pytest pyyaml
          # --noconftest: this suite needs no app imports, so the smoke job
          # does not install the whole package to run it.
          python -m pytest tests/unit/test_conflict_resolution.py \
            -q -p no:cacheprovider --noconftest
