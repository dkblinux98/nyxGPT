name: Auto-check Release Tracking Issues

on:
  issues:
    types: [closed]

jobs:
  update-tracking-issues:
    if: vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Update parent tracking issues
        uses: actions/github-script@v7
        with:
          script: |
            const closedIssueNumber = context.issue.number;
            console.log(`Issue #${closedIssueNumber} was closed`);
            
            // Search for issues that reference this issue in task lists
            const searchQuery = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open "- [ ] #${closedIssueNumber}"`;
            console.log(`Searching: ${searchQuery}`);
            
            const searchResults = await github.rest.search.issuesAndPullRequests({
              q: searchQuery,
              per_page: 100
            });
            
            console.log(`Found ${searchResults.data.items.length} tracking issues`);
            
            // Update each tracking issue
            for (const trackingIssue of searchResults.data.items) {
              console.log(`Updating tracking issue #${trackingIssue.number}`);
              
              // Get the current body
              let body = trackingIssue.body || '';
              
              // Replace unchecked box with checked box for this specific issue
              const uncheckedPattern = new RegExp(`^- \\[ \\] #${closedIssueNumber}$`, 'gm');
              const checkedPattern = new RegExp(`^- \\[x\\] #${closedIssueNumber}$`, 'gm');
              
              // Only update if it's currently unchecked (avoid duplicate updates)
              if (uncheckedPattern.test(body)) {
                const updatedBody = body.replace(uncheckedPattern, `- [x] #${closedIssueNumber}`);
                
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: trackingIssue.number,
                  body: updatedBody
                });
                
                // Add a comment to show automation worked
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: trackingIssue.number,
                  body: `✅ Auto-checked #${closedIssueNumber} (issue closed)`
                });
                
                console.log(`✓ Updated #${trackingIssue.number}`);
              } else if (checkedPattern.test(body)) {
                console.log(`Issue #${closedIssueNumber} already checked in #${trackingIssue.number}`);
              } else {
                console.log(`Issue #${closedIssueNumber} not found in task list of #${trackingIssue.number}`);
              }
            }
            
            console.log('Done!');
