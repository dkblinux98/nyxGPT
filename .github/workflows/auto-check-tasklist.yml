name: Auto-check Release Tracking Issues

on:
  issues:
    types: [closed]

jobs:
  update-tracking:
    uses: dkblinux98/nyxAgent/.github/workflows/reusable-auto-check-tasklist.yml@v1.0.0
    with:
      issue_number: ${{ github.event.issue.number }}
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
