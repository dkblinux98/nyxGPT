name: Developer Agent - Pull Next Issue

# The developer pulls; nobody pushes work at them (#3883).
#
# Selection used to run here in the scrummaster's context under the rule
# `lowest Phase, then lowest issue number` -- a condition expression standing
# where D-004 reserves judgment, and a push. Nothing compared a candidate's
# likely file footprint against work already in flight, so on 2026-08-18 four
# PRs collided on `src/nyxgpt/app.py`, each costing a conflict round.
#
# What runs now is the pull (scripts/agents/developer_pull_next.sh), in the
# developer agent's context and under its token: plan order from the sprint
# the scrummaster groomed (#3908), relationships eligibility, a WIP limit read
# from the board and open PRs rather than from memory, and a file-overlap
# check. Its reasoning is quoted into the dispatch comment, so a wrong pull is
# visible instead of merely wrong.
#
# The guards did not move: the escalation and cross-issue-anomaly pause
# backstops, the release wall, the hard sprint boundary and the #3665
# fall-through retry all still run, in scrummaster_dispatch_next.sh.
#
# Started by a repository_dispatch, never by a comment (#3882).
#
# The kick used to be the token READY_FOR_NEXT_ISSUE in an issue comment, which
# made prose into an API: a workflow's own guidance text could start work, and
# twice did (#3706, #3790 -- ~500 runs in two hours). Two layers of gating were
# built to make comments safe to parse, which is effort spent making the wrong
# mechanism survivable.
#
# What the comment was actually doing is a cross-identity handoff: the review
# agent, finishing a merge, asking the scrummaster to select the next issue.
# repository_dispatch is that, natively -- an event with a name, not text to be
# pattern-matched, and unforgeable by anything that merely mentions it.
on:
  repository_dispatch:
    types: [dispatch-next-issue]

permissions:
  issues: write
  contents: read

jobs:
  pull-next-issue:
    if: vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Serialize dispatches: a burst of READY_FOR_NEXT_ISSUE triggers landing
    # within seconds of each other (post-merge autopilot kick + a manual
    # kick + a stray retry, observed on #3647) each ran select-and-start
    # independently, so more than one picked the same Backlog issue before
    # the earlier run's status/assignment write had propagated -- producing
    # duplicate developer runs. A single, non-cancelling concurrency group
    # makes every dispatch see the prior run's committed state before it
    # selects, on top of the per-issue idempotency guard in
    # scrummaster_start_issue.sh (classify_backlog_claim_state).
    concurrency:
      group: developer-pull
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
      # #3695 human-channel (Slack DM) escalation notifications, sent by
      # scrummaster_dispatch_next.sh on the dispatch-paused/queue-blocked
      # terminal outcomes below. Absent/failing degrades gracefully to the
      # existing comment-only behavior (see notify_human_escalation,
      # scripts/agents/lib/gh_project.sh).
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
      # #3911: that DM is signed by the scrummaster, not by this job's token.
      # The dispatch-block report is the scrummaster's even though this
      # workflow runs as DEVELOPER_AGENT_TOKEN, so the role is set by
      # scrummaster_dispatch_next.sh itself; only its token is passed here.
      SLACK_USER_TOKEN_SCRUM: ${{ secrets.SLACK_USER_TOKEN_SCRUM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Auth gh
        run: gh auth status

      - name: Write ephemeral config.ini (runner temp)
        shell: bash
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"

          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          RELEASE_ISSUE_NUMBER=${{ vars.RELEASE_ISSUE_NUMBER }}
          SPRINT_AUTOPILOT=${{ vars.SPRINT_AUTOPILOT }}
          SPRINT_FIELD=${{ vars.SPRINT_FIELD }}
          EOF

          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"
          echo "Wrote ephemeral config at $CFG"

      - name: Verify config loads
        shell: bash
        run: |
          set -euo pipefail
          bash -lc '
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            echo "config ok: $REPO_OWNER/$REPO_NAME project $PROJECT_OWNER#$PROJECT_NUMBER release=$RELEASE_BRANCH"
          '

      - name: Post start comment
        uses: actions/github-script@v7
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_ISSUE: ${{ vars.RELEASE_ISSUE_NUMBER }}
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = Number(process.env.RELEASE_ISSUE);
            const runUrl =
              `https://github.com/${process.env.REPO}/actions/runs/${process.env.RUN_ID}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: (
                '🤖 **Developer Agent**: Signal received. ' +
                'Pulling the next issue from the sprint plan...\n\n' +
                `[View workflow run](${runUrl})`
              )
            });

      - name: Pull the next issue (fall through on unclaimable candidates)
        id: start
        shell: bash
        env:
          SPRINT_AUTOPILOT: ${{ vars.SPRINT_AUTOPILOT }}
          KICK_ACTOR: ${{ github.actor }}
          KICK_OWNER: ${{ vars.HUMAN_OWNER }}
        run: |
          set -euo pipefail
          # Sprint-scope selection for AGENT-posted kicks while autopilot is
          # on (#3480, tightened by #3706): the automatic loop is bound by
          # the current sprint, so an agent kick may only claim work in the
          # active iteration. With no active iteration the script now STOPS
          # (exit 1) rather than falling back to unscoped selection -- the
          # conservative stop the policy documents; the fallback let a kick
          # that arrived just after the window closed dispatch future-sprint
          # work automatically.
          #
          # A kick posted by the human owner stays UNSCOPED -- the owner
          # override in #3706: a deliberate manual kick may pull work
          # forward across the sprint boundary. The release wall applies to
          # both paths regardless. The login comparison is case-insensitive
          # to match the job-level `if:` above (GitHub expression `==` on
          # strings ignores case; bash `!=` does not), so an owner kick can
          # never be scoped merely because vars.HUMAN_OWNER is cased
          # differently from the actual login.
          SPRINT_ARGS=""
          if [[ "$SPRINT_AUTOPILOT" == "true" && "${KICK_ACTOR,,}" != "${KICK_OWNER,,}" ]]; then
            SPRINT_ARGS="--sprint-scoped"
          else
            echo "Unscoped selection (autopilot=${SPRINT_AUTOPILOT}, kick by ${KICK_ACTOR})."
          fi

          # scrummaster_dispatch_next.sh (#3665) runs the fall-through
          # loop: the #3647-era guard treated ANY existing assignee
          # (including assign_backlog.yml's normal scrummaster stamp) as
          # "already claimed" and halted the whole dispatch on the
          # lowest-numbered candidate, silently blocking the entire queue
          # behind a single bad-state issue (#3593, ~5 days). The dispatch
          # script now classifies *who* holds the claim per-candidate and
          # excludes/retries on any skip, bounded so a systemic problem
          # fails loudly instead of looping forever. Its stdout is exactly
          # `next_issue=...` and a `tried<<NYXGPT_TRIED_EOF ... EOF` block --
          # both already in $GITHUB_OUTPUT format.
          # PULL_EXPLAIN_FILE carries the decision's reasoning back out: which
          # issue, at what position in the plan, and what it skipped to get
          # there. It is quoted into the dispatch comment because a pull that
          # chose wrongly can only be corrected if the choice is visible
          # (D-004).
          export PULL_EXPLAIN_FILE="$RUNNER_TEMP/pull-decision.json"
          bash -lc "./scripts/agents/scrummaster_dispatch_next.sh $SPRINT_ARGS" >> "$GITHUB_OUTPUT"

          if [[ -s "$PULL_EXPLAIN_FILE" ]]; then
            {
              echo "pull_reason<<NYXGPT_REASON_EOF"
              jq -r '.reason' "$PULL_EXPLAIN_FILE"
              jq -r '.considered[]? | "  - skipped #\(.issue): \(.skipped)\(if .detail then " (" + .detail + ")" else "" end)"' \
                "$PULL_EXPLAIN_FILE"
              echo "NYXGPT_REASON_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Post escalation-pause comment
        if: steps.start.outputs.paused == 'true'
        uses: actions/github-script@v7
        env:
          PAUSE_REASON: ${{ steps.start.outputs.pause_reason }}
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = Number(process.env.RELEASE_ISSUE);
            const reason = process.env.PAUSE_REASON;
            const body = reason === 'cross_issue_anomaly'
              ? '⏸️ **Developer Agent**: Pull paused -- an unresolved cross-issue ' +
                'infrastructure anomaly is open. See the loud report on the release ' +
                'tracking issue (#3694 cross-issue infrastructure-anomaly pause backstop). ' +
                'Dispatch resumes once the anomaly is resolved (an owner `RESOLVE_ANOMALY` ' +
                'comment) or its detection window elapses.'
              : '⏸️ **Developer Agent**: Pull paused -- 2 or more unresolved ' +
                'escalations (open issues assigned to the owner, excluding the release ' +
                'tracking issue). See the loud report on ' +
                'the release tracking issue (#3687 unresolved-escalation pause backstop). ' +
                'Dispatch resumes automatically once the count drops below 2.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });

      - name: Post no issues comment
        if: steps.start.outputs.paused != 'true' && steps.start.outputs.next_issue == '' && steps.start.outputs.tried == ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = Number(process.env.RELEASE_ISSUE);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: (
                '⚠️ **Developer Agent**: Nothing eligible to pull.\n\n' +
                'Every Backlog candidate was blocked, held, overlapped work already in ' +
                'flight, or the WIP limit was already reached.'
              )
            });

      - name: Post queue-blocked comment
        if: steps.start.outputs.paused != 'true' && steps.start.outputs.next_issue == '' && steps.start.outputs.tried != ''
        uses: actions/github-script@v7
        # #3820: `tried` is a multi-line list of issue titles/reasons -- as
        # source text a backtick or `${` in a title would break out of the
        # template literal. Read it from the environment instead.
        env:
          TRIED: ${{ steps.start.outputs.tried }}
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = Number(process.env.RELEASE_ISSUE);
            const tried = (process.env.TRIED || '').trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: (
                `🛑 **Developer Agent**: Pulled nothing this dispatch -- every eligible ` +
                `Backlog candidate was unclaimable:\n\n` +
                '```\n' + tried + '\n```\n\n' +
                'This is a head-of-line block on the whole queue. Please inspect the listed ' +
                'issue(s) and resolve manually (see #3665 for the decision matrix).'
              )
            });

      - name: Fail run on queue block
        if: steps.start.outputs.next_issue == '' && steps.start.outputs.tried != ''
        shell: bash
        run: |
          echo "::error::Dispatch started nothing -- every eligible Backlog candidate was unclaimable. See the queue-blocked comment on this issue for details."
          exit 1

      - name: Post completion comment
        if: steps.start.outputs.next_issue != ''
        uses: actions/github-script@v7
        env:
          NEXT_ISSUE: ${{ steps.start.outputs.next_issue }}
          DEV_AGENT: ${{ vars.DEV_AGENT }}
          TRIED: ${{ steps.start.outputs.tried }}
          PULL_REASON: ${{ steps.start.outputs.pull_reason }}
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = Number(process.env.RELEASE_ISSUE);
            const next_issue = process.env.NEXT_ISSUE;
            const dev_agent = process.env.DEV_AGENT;
            const tried = (process.env.TRIED || '').trim();
            const skippedNote = tried
              ? `\n\nSkipped ${tried.split('\n').length} unclaimable candidate(s) before this one:\n\`\`\`\n${tried}\n\`\`\``
              : '';
            // Why this issue and not the one above it in the plan. Read from
            // the environment, not interpolated: a file path or issue title
            // in the reasoning must not break out of the template literal
            // (#3820).
            const reason = (process.env.PULL_REASON || '').trim();
            const reasonNote = reason ? `\n\n**Why this issue:**\n\n\`\`\`\n${reason}\n\`\`\`` : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: (
                `🚀 **Developer Agent**: Pulled issue #${next_issue} -- moved to ` +
                `**In Progress** and assigned to @${dev_agent}\n\n` +
                `Developer auto-implementation workflow will begin momentarily.\n\n` +
                `[View issue](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${next_issue})` +
                skippedNote + reasonNote
              )
            });
