name: macOS Brew Smoke

# Installs the Homebrew formulas on a real macOS Homebrew and asserts the keg
# actually works (#3753). Until this existed the brew path was
# documentation-verified only: every formula change shipped unexecuted, and
# the keg venv bootstrap broke on stock Homebrew macOS with an `ensurepip`
# exit 1 that no CI job could have seen. GitHub-hosted macos-15 runners ship
# Homebrew, so `brew install` is testable for real -- the "no macOS CI"
# limitation applies to EC2 Mac, not to plain brew-install verification.
#
# Two jobs, because they answer two different questions:
#
#   keg-install  Does the recipe in THIS checkout install? Stamps the rc
#                formulas from the working tree into a throwaway local tap and
#                installs from a file:// tarball, so a broken recipe fails on
#                the PR that wrote it -- no publish required. The throwaway tap
#                deliberately carries no stable formula, which also keeps the
#                absent-`conflicts_with`-counterpart case (#3753) exercised.
#                It also *injects* the empty-`platform.mac_ver()` condition
#                the owner's Mac exhibited and this runner does not, because a
#                job that only runs the install is green on any machine that
#                fails to reproduce the bug -- which is exactly how the rc5
#                candidate passed here and failed there. Since #3814 it injects
#                the *cause* underneath that symptom as well: a `python@3.12`
#                whose `pyexpat` will not load, which is what the empty
#                `mac_ver()` (#3753) and the misleading pip ImportError (#3788)
#                both were. The install has to refuse it up front, and the
#                stripped-preflight control has to show the recipe walking
#                straight past it the way rc12 did. Since #3854 it also
#                asserts what the install *says*: the transcript has to name
#                `nyxgpt up` and what `brew services start` leaves out. That
#                assertion lives in the keg-install job and not in
#                published-tap deliberately -- published-tap can be dispatched
#                against an older candidate, whose formulas predate the
#                caveats, and a gate that fails on correct history is a gate
#                people learn to ignore.
#                Since #4043's second acceptance round it answers one more:
#                when the api is asked -- through its own HTTP endpoint, by a
#                process inside its own launchd job -- to restart itself, does
#                anything start it again? `brew services restart` is a
#                boot-out and a *separate* bootstrap, and the boot-out takes
#                the `brew` issuing it down with the rest of the job's process
#                tree, so the api was stopped by a command that could not
#                survive to restart it. That step starts the real service,
#                drives the real endpoint, and injects the pre-fix keg first
#                so the runner has to reproduce the dead-and-de-registered
#                service before the fixed half is allowed to mean anything.
#   published-tap  Does what the owner actually types work? `brew tap` +
#                `brew install` against the real published tap, and then --
#                since #3860 -- the whole user path after it:
#                `scripts/macos-user-path-smoke.sh` runs `nyxgpt --version`,
#                `nyxgpt up`, the API's `/health` and `/api/v1/sessions`, the
#                web UI on :3000, `nyxgpt ops status`, `nyxgpt down`,
#                `brew uninstall`/`untap` and the launchd/plist residue check.
#                Before that it proved a keg builds and never once invoked the
#                product, which is how #3850/#3851/#3853/#3854/#3857/#3859 all
#                reached owner acceptance over green runs. Needs a published
#                candidate, so it runs on dispatch and after an rc cut, never
#                on a PR.
#   mac-model-backend  Does the EC2 Mac bootstrap's model backend actually
#                work (#4150)? `brew install ollama`, `brew services start`,
#                and the configured-model pull, executed -- with the
#                install-without-pull near-miss measured in between, because a
#                fix that stopped at the install would leave chat just as
#                broken while changing the symptom from a 502 to an empty list.
#                EC2 Mac hardware is a documented D-006 exception; this runner
#                is not that hardware but it is arm64 macOS with the same
#                Homebrew, and it runs the commands rather than reading them.
#   stable-over-candidate  Does `conflicts_with` hold when the counterpart is
#                actually there, in BOTH install orders? `keg-install`'s
#                throwaway tap deliberately carries no stable formula, which
#                covers the absent-counterpart case (#3753) and leaves the
#                present-counterpart case -- stable installed, candidate on
#                top -- covered nowhere. That is the case the owner hit
#                (#3853). Both orders are asserted, because `conflicts_with`
#                is directional: it is checked only when the formula declaring
#                it is the one being installed, so a one-sided declaration
#                guards one order and nothing at all in the other. Builds both
#                channels from the working tree, so it needs no publish and
#                runs on PRs.
#                Since #3861 it also answers the question after that one: on a
#                machine where two channels ARE installed, does an install
#                reconcile the one it replaces, or leave two `keep_alive`
#                service sets registered on ports 8000/3000? That state is no
#                longer reachable by installing (the assertions above are
#                exactly that it is refused), so the #3861 step *stages* it
#                deliberately -- which is the honest shape, because packaging
#                guards the machines that install after the declaration
#                shipped and reconcile is what every machine already in the
#                state needs. Same runner, one job: #3861 shares this one
#                rather than paying a second macOS runner to rebuild it.
#                Since #4043 it answers one more, from the same machine state
#                and for the same reason: with the candidate keg installed
#                alone and registering its service as `nyxgpt-api@3.0.0rc`,
#                can self-heal restart it? The injection barrier every
#                self-heal service name passes through had no `@`, so the
#                watchdog could not heal `api` or `web` on any rc install --
#                the channel release candidates are accepted on. That step
#                reverts the barrier in the installed keg and measures the
#                refusal before restoring it and measuring the restart, so
#                the job cannot pass by running on a machine that fails to
#                reproduce the bug.

#
# Cost: macOS runners bill at a multiple of Linux, so the PR trigger is
# paths-filtered down to the formulas, the stamping script, the install-identity
# model, the web tier's version resolution (#3982) and this file.
# Since #3982 the PR run also builds the web keg, which is a real `npm ci` +
# `next build`. That is bought deliberately: `homebrew/**` already triggered
# this workflow, so a change to `nyxgpt-web.rb` ran this job and then skipped
# the only step that builds the formula it changed. The filter above is narrow
# and cold enough to pay for it; that is why the web files named there are the
# two small ones and not `web/**`.
# Deliberately NOT in the filter: `scripts/macos-user-path-smoke.sh` and its
# unit test. No PR-triggered job runs that script (the job that drives it needs
# a published candidate, so it is dispatch/rc-cut only), so a script-only PR
# would spend two macOS runners to execute nothing that changed;
# `tests/unit/test_macos_user_path_smoke.py` pins its content on every PR
# instead, and the script itself is exercised by the dispatch/rc-cut run.
# Also deliberately NOT in the filter: `src/nyxgpt/ops.py`, which holds the
# install-identity *detection* the reconcile step drives. It is one of the
# hottest files in the tree, and filtering on it would put two macOS runners
# behind every ops change; `install_mode.py` -- the model itself, and the file
# a change to this behavior has to touch -- is in the filter instead, with
# `tests/unit/test_install_identity.py` pinning the ops half on every PR.
on:
  pull_request:
    paths:
      - 'homebrew/**'
      - 'scripts/build_homebrew_artifacts.py'
      # Unlike macos-user-path-smoke.sh below, this one IS in the filter: the
      # PR-triggered keg-install job runs it, so a change to it changes what
      # this workflow asserts on the next PR.
      - 'scripts/homebrew-caveats-smoke.sh'
      # Same reasoning, for the `candidate-upgrade` job: this script is what
      # that job asserts, so a change to it changes what the next PR measures
      # (#4133).
      - 'scripts/macos-upgrade-smoke.sh'
      # The running-vs-installed comparison itself (#4133). In the filter for
      # the reason `ops.py` is NOT: it is small, focused, and its only
      # consumers are the install step, `ops status`, `doctor` and the
      # Infrastructure page -- all of which make a claim about a *process* on
      # a real machine that only `candidate-upgrade` can execute. The
      # `candidate-upgrade` job also injects a revert of this file into the
      # installed keg, so a change to its shape has to re-run that job.
      - 'src/nyxgpt/running_build.py'
      - 'src/nyxgpt/release_tarball.py'
      - 'src/nyxgpt/install_mode.py'
      # The parser every brew state reaches a comparison through, the one the
      # identity step's reconcile depends on to decide what is registered
      # (#3861), and since #4043 the home of `SEGMENT_PATTERN` -- the
      # definition of a formula name self-heal will act on, which the
      # stable-over-candidate job's heal step injects and restores.
      # `ops.py` is deliberately NOT here -- it changes on nearly every PR,
      # and a macOS job that runs every time is a job people learn to ignore
      # -- but this file is small, focused, and its readers are the health
      # gate and the retire.
      #
      - 'src/nyxgpt/brew_services.py'
      # `self_heal.py` IS here since #4043's second round, and the reason it
      # was excluded before has been overtaken. The old reason was sound: the
      # only thing it carried that this workflow measured was an inline copy
      # of the pattern above, and a unit test pins that on every PR for free.
      # What it carries now is *which command restarts a brew service* --
      # whether the restart is one launchd operation or a stop and a separate
      # start -- and that is a launchd fact about a running service, which no
      # unit test can reach: the pre-fix code passed the whole unit suite and
      # failed owner acceptance twice. ~40 commits in two months against
      # `ops.py`'s ~214, so this is not the every-PR cost that keeps `ops.py`
      # out.
      - 'src/nyxgpt/self_heal.py'
      # The web tier's own version, derived from the directory the keg's
      # wrapper `cd`s into (#3982). This is a claim about a Homebrew keg on
      # macOS, so it is asserted here rather than only in vitest -- a unit
      # test can replicate the directory shape, it cannot prove that is where
      # the Next server actually runs. The route is in the filter too because
      # it is what serves the pair the assertion reads.
      - 'web/src/lib/webVersion.ts'
      - 'web/src/app/api/info/route.ts'
      # The EC2 Mac bootstrap and the model-bootstrap module behind it (#4150).
      # These two are what the `mac-model-backend` job below exists for: the
      # template's Ollama block is a claim about what happens when a real macOS
      # machine runs it, and `model_bootstrap.py` decides which models get
      # pulled. Both are small and cold, so filtering on them costs a macOS
      # runner only when the behavior under test actually changes.
      #
      # `src/nyxgpt/ops.py` is still deliberately absent -- see the note above:
      # it changes on nearly every PR, and `ops required-models` is a thin
      # wrapper over `model_bootstrap`, which IS filtered. The parity test and
      # tests/unit/test_models_endpoints.py pin the rest on every PR, cheaply.
      - 'scripts/cloud/ec2-user-data-macos.sh.tmpl'
      - 'scripts/cloud/ec2-user-data-linux.sh.tmpl'
      - 'src/nyxgpt/model_bootstrap.py'
      - '.github/workflows/macos-brew-smoke.yml'
  workflow_dispatch:
    inputs:
      formula_version:
        description: 'Published candidate to install from the tap, e.g. 3.0.0rc4 (blank = skip that job)'
        required: false
        default: ''
      include_web:
        description: 'Also install nyxgpt-web (adds a full Next.js build)'
        type: boolean
        default: false
      run_keg_install:
        description: "Also install this checkout's own formulas"
        type: boolean
        default: true
  workflow_call:
    inputs:
      formula_version:
        description: 'Published candidate to install from the tap, e.g. 3.0.0rc4'
        required: false
        type: string
        default: ''
      run_keg_install:
        description: "Also install the calling ref's own formulas (off by default)"
        required: false
        type: boolean
        default: false

# Read-only: both jobs only check the repo out and drive brew locally.
permissions:
  contents: read

jobs:
  keg-install:
    name: Install the working tree's formulas
    # PRs and dispatch build from the checkout. An rc cut calls this workflow
    # for the published-tap job only, and gets this one skipped by the
    # `run_keg_install` default -- deliberately NOT gated on
    # `github.event_name`, which inside a called workflow reports the
    # *caller's* event (`workflow_dispatch`), never `workflow_call`.
    if: ${{ github.event_name == 'pull_request' || inputs.run_keg_install }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The keg builds its venv from Homebrew's python@3.12 (the formula's
      # declared dependency), NOT from the setup-python above -- that one only
      # runs the stamping script, which is stdlib-only (#3741).
      - name: Install the formula's declared Python dependency
        run: |
          set -euo pipefail
          brew install python@3.12
          # #3788: the owner's Mac had python@3.12 3.12.14 and this runner
          # had 3.12.13_4 at the rc11 cut, whose older bundled pip did not
          # carry the self-modification guard that killed the install. Testing
          # whatever pip the runner image was baked with is testing the past,
          # so pull the keg up to what `brew install` gives a user today.
          #
          # `brew update` first, and that is the whole point of the step:
          # `brew upgrade` can only see versions the local metadata knows
          # about, and the runner image's metadata predates the owner's
          # 3.12.14 -- without it the upgrade prints "already installed" and
          # the job silently keeps testing the image's pip.
          brew update || echo "::warning::brew update failed; the keg may not reach current"
          set +e
          upgrade_log="$(brew upgrade python@3.12 2>&1)"
          upgrade_rc=$?
          set -e
          echo "$upgrade_log"
          if [ "$upgrade_rc" -ne 0 ]; then
            # "already installed" is the one non-zero worth tolerating on its
            # wording: it means current is what is already here.
            if printf '%s' "$upgrade_log" | grep -qF "already installed"; then
              echo "python@3.12 is already at the newest version Homebrew knows about"
            # Otherwise tolerate it only on the OUTCOME this step is about:
            # python@3.12 is at the newest version Homebrew knows and runs.
            # `brew upgrade` also exits non-zero when one of the formula's
            # DEPENDENCIES fails to link, which on a hosted runner is a
            # property of the image rather than anything about nyxGPT -- run
            # 36996645910 upgraded python@3.12 3.12.14 -> 3.12.15 and printed
            # "Upgraded 1 requested outdated package", then exited 1 because
            # `openssl@3` could not symlink `bin/openssl` over the
            # `openssl@1.1` already owning it. Exiting there spent the entire
            # job, including the #3859 teardown step that is this workflow's
            # only executed proof of the launchd residue sweep, on a symlink
            # collision in a keg nyxGPT never calls.
            elif [ -z "$(brew outdated --quiet python@3.12)" ] \
              && "$(brew --prefix python@3.12)/bin/python3.12" -m pip --version >/dev/null 2>&1; then
              echo "::warning::brew upgrade exited ${upgrade_rc};" \
                "python@3.12 is current and runs -- link conflict(s) below"
              printf '%s\n' "$upgrade_log" | grep -i 'could not symlink' || true
            else
              echo "::error::brew upgrade python@3.12 failed"
              exit "$upgrade_rc"
            fi
          fi
          brew list --versions python@3.12
          # State in the log which pip is actually under test, so a future
          # green run says what it tested rather than being taken on trust.
          "$(brew --prefix python@3.12)/bin/python3.12" -m pip --version

      - name: Show the python@3.12 keg's ensurepip state
        # Diagnostics for the failure this job exists to catch: if ensurepip is
        # broken on the runner too, the log says so instead of leaving a bare
        # exit 1. Never fails the job -- the recipe no longer uses ensurepip,
        # and proving that is the point.
        continue-on-error: true
        run: |
          PY="$(brew --prefix python@3.12)/bin/python3.12"
          echo "python: $PY"
          "$PY" --version
          "$PY" -m pip --version
          ls "$("$PY" -c 'import ensurepip, os; print(os.path.dirname(ensurepip.__file__))')/_bundled" || true
          # What this runner answers for the call that killed the rc5 install,
          # and whether this keg ships a sitecustomize of its own -- the
          # formula's shim is a sitecustomize on PYTHONPATH, so it would
          # shadow one (it chains through, and this says whether that path is
          # ever taken here).
          "$PY" -c 'import platform; print("mac_ver:", platform.mac_ver())'
          "$PY" - <<'PY'
          import os
          import sys
          import sysconfig

          # Not just purelib: on this keg purelib is the *prefix* copy
          # (HOMEBREW_PREFIX/lib/python3.12/site-packages) and the
          # sitecustomize Homebrew ships lives in the keg's own framework
          # site-packages, so a purelib-only probe answers "none" while the
          # interpreter is in fact running one (#3788, round 3). State the
          # machine truth: every sitecustomize on sys.path, and the one that
          # was actually imported.
          purelib = sysconfig.get_paths()["purelib"]
          print("purelib:", purelib)
          found = [
              os.path.join(entry or os.curdir, "sitecustomize.py")
              for entry in sys.path
              if os.path.isfile(os.path.join(entry or os.curdir, "sitecustomize.py"))
          ]
          print("sitecustomize on sys.path:", ", ".join(found) if found else "none")
          try:
              import sitecustomize
          except ImportError:
              print("imported sitecustomize: none")
          else:
              print("imported sitecustomize:", getattr(sitecustomize, "__file__", "?"))
          import pip

          print("keg pip:", pip.__file__)
          PY
          # #3788's condition, reported as a fact about this runner: the
          # owner's keg pip could not import its own wheel installer, which is
          # what pip 26.2's guard reported as an ImportError from
          # `_prevent_import_hook`. Says outright whether this machine is in
          # that state -- the injection step below does not depend on it.
          "$PY" - <<'PY'
          import importlib.util

          name = "pip._internal.operations.install.wheel"
          try:
              spec = importlib.util.find_spec(name)
          except Exception as exc:  # noqa: BLE001 - diagnostics only
              spec = None
              print(f"keg pip wheel installer: lookup raised {exc!r}")
          print("keg pip wheel installer:", spec.origin if spec else "MISSING (#3788 condition)")
          PY

      # The gap this closes (#3753, round 2): the rc5 smoke job went green on
      # this runner while the identical install failed on the owner's Mac,
      # because the runner's build environment answers
      # `platform.mac_ver()` and theirs did not. A job that only runs the
      # install cannot catch that class -- it can only catch it on machines
      # that happen to reproduce it. So stop hoping the runner reproduces the
      # condition and inject it: assert pip really dies here without the fix
      # (so a green result below means something), then assert the formula's
      # own shim survives it.
      - name: Reproduce the empty mac_ver() failure, then prove the shim fixes it
        run: |
          set -euo pipefail

          PY="$(brew --prefix python@3.12)/bin/python3.12"
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/broken" "$WORK/fixed"

          # The observed fault: platform.mac_ver() answering with no release,
          # which is what the owner's build environment handed pip.
          cat > "$WORK/fault.py" <<'FAULT'
          import platform

          platform.mac_ver = lambda *args, **kwargs: ("", ("", "", ""), "")
          FAULT
          cp "$WORK/fault.py" "$WORK/broken/sitecustomize.py"

          # The fix, read back out of the formula this checkout ships rather
          # than copied here, so this can never test a stale spelling of it.
          PYTHONPATH=scripts python3 - "$WORK" <<'BUILD'
          import pathlib
          import sys

          from build_homebrew_artifacts import extract_build_shim

          work = pathlib.Path(sys.argv[1])
          formula = pathlib.Path("homebrew/nyxgpt-api.rb").read_text(encoding="utf-8")
          fault = (work / "fault.py").read_text(encoding="utf-8")
          shim = extract_build_shim(formula)
          (work / "fixed" / "sitecustomize.py").write_text(fault + "\n" + shim, encoding="utf-8")
          BUILD

          echo "=== negative control: the recipe's pip bootstrap, mac_ver() empty ==="
          # The whole bootstrap, not one command of it: pip parses mac_ver()
          # both in truststore (its TLS backend) and in
          # `packaging.tags.mac_platforms`, so this asserts the recipe dies
          # somewhere in there without the shim, without betting on which
          # step gets there first.
          "$PY" -m venv --without-pip "$WORK/venv-broken"
          mkdir -p "$WORK/wheelhouse-broken"
          set +e
          (
            set -e
            PYTHONPATH="$WORK/broken" "$PY" -m pip download --no-deps --only-binary :all: \
              --disable-pip-version-check --dest "$WORK/wheelhouse-broken" pip
            broken_wheel="$(ls "$WORK"/wheelhouse-broken/pip-*.whl | head -1)"
            PYTHONPATH="$WORK/broken" "$WORK/venv-broken/bin/python" "$broken_wheel/pip" \
              install --no-index --disable-pip-version-check "$broken_wheel"
          ) > "$WORK/broken.log" 2>&1
          broken_rc=$?
          set -e
          tail -30 "$WORK/broken.log" || true
          if [ "$broken_rc" -eq 0 ]; then
            echo "pip started with an empty platform.mac_ver(), so the check"
            echo "below would pass whether or not the fix works. Re-derive the"
            echo "reproduction before trusting this job."
            echo "::error::this runner no longer reproduces #3753"
            exit 1
          fi
          grep -qF "invalid literal for int() with base 10: ''" "$WORK/broken.log" || {
            echo "pip failed, but not with #3753's ValueError, so this is no"
            echo "longer testing the failure the owner reported."
            echo "::error::the #3753 reproduction has drifted"
            exit 1
          }
          echo "reproduced: pip exits $broken_rc with the owner's ValueError"

          echo "=== the same bootstrap with the formula's shim in place ==="
          "$PY" -m venv --without-pip "$WORK/venv-fixed"
          mkdir -p "$WORK/wheelhouse-fixed"
          (
            set -e
            PYTHONPATH="$WORK/fixed" "$PY" -m pip download --no-deps --only-binary :all: \
              --disable-pip-version-check --dest "$WORK/wheelhouse-fixed" pip
            fixed_wheel="$(ls "$WORK"/wheelhouse-fixed/pip-*.whl | head -1)"
            # The bootstrap's second interpreter is the venv's, running pip
            # out of the wheel by zipimport -- a green run here also proves
            # the shim reaches that process, the env-inheritance property the
            # whole #3753 fix rests on.
            PYTHONPATH="$WORK/fixed" "$WORK/venv-fixed/bin/python" "$fixed_wheel/pip" \
              install --no-index --disable-pip-version-check "$fixed_wheel"
          ) 2>&1 | tee "$WORK/fixed.log" | tail -20
          "$WORK/venv-fixed/bin/pip" --version
          grep -qF "so pip can start" "$WORK/fixed.log" || {
            echo "::error::the shim never fired, so a green result here proves nothing about the fix."
            exit 1
          }

      # Round 3 of the same lesson (#3788, D-006). rc11's smoke passed here on
      # python@3.12 3.12.13_4 while the identical install died on the owner's
      # 3.12.14 -- the third green-by-luck result of the runner/user
      # version-drift class. The step above now pulls the keg to current, but
      # "current" still drifts, so the failure itself is injected rather than
      # waited for: the owner's keg pip could not import
      # `pip._internal.operations.install.wheel`, pip 26.2 swallowed that into
      # `_MISSING_MODULES` and its audit hook re-raised it as the owner's
      # ImportError. Reproduce exactly that machine state, prove rc11's
      # bootstrap dies on it, then prove this checkout's does not.
      #
      # Injected by taking the module away, not by emulating its absence.
      # Two earlier spellings put a meta-path finder in a `sitecustomize` on
      # PYTHONPATH, and both failed on the vehicle rather than on the recipe:
      # the first scoped itself by `abspath` and never matched in the
      # symlink-resolved `pip --python` child; the second shadowed the keg's
      # own `sitecustomize` and moved which pip was under test. The general
      # fault there is that an emulated condition runs in an interpreter
      # environment that `brew install` does not have, so the emulation
      # becomes the thing being tested. Moving the file is the machine state
      # itself: no PYTHONPATH, no import hooks -- provided it is moved at its
      # realpath. Homebrew's prefix tree symlinks into the Cellar and pip's
      # `--python` child re-execs through `get_runnable_pip()`, which resolves
      # symlinks, so taking away the prefix entry leaves the file that child
      # imports in place; that is how run 31870665799 fired the self-check
      # through a dangling symlink and still passed the negative control.
      # Removed at its realpath, the hole is the same one for every route:
      # the keg pip, its `--python` re-exec child, and `brew install`. It is
      # restored by a trap before anything else runs.
      - name: "Reproduce the #3788 keg-pip failure, then prove the new bootstrap survives it"
        run: |
          set -euo pipefail

          PY="$(brew --prefix python@3.12)/bin/python3.12"
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/wheelhouse"

          # The realpath, not the path it was imported by: Homebrew links the
          # prefix tree into the Cellar, and the copy `pip --python` re-execs
          # is the resolved one.
          WHEEL_PY="$("$PY" -c 'import os, pip._internal.operations.install.wheel as m; print(os.path.realpath(m.__file__))')"
          WHEEL_LINK="$("$PY" -c 'import pip._internal.operations.install.wheel as m; print(m.__file__)')"
          HIDDEN="$WHEEL_PY.3788-hidden"
          echo "keg pip wheel installer: $WHEEL_PY"
          echo "  imported by this python as: $WHEEL_LINK"

          restore_the_keg() {
            if [ -e "$HIDDEN" ]; then
              mv -f "$HIDDEN" "$WHEEL_PY"
            fi
          }
          # Every exit path, including the ones that fail below: the steps
          # after this one install the formulas with this same keg pip.
          trap restore_the_keg EXIT

          mv "$WHEEL_PY" "$HIDDEN"
          # Source-based caching means a stale __pycache__ entry is ignored
          # once the .py is gone, but leave nothing to reason about -- on both
          # sides of the link, since either may carry one.
          rm -f "$(dirname "$WHEEL_PY")"/__pycache__/wheel.*.pyc
          rm -f "$(dirname "$WHEEL_LINK")"/__pycache__/wheel.*.pyc

          echo "=== self-check: the keg is really in the owner's state before anything is inferred ==="
          # The arbiter, kept from the previous spelling and for the reason it
          # was added: a fault that does not fire produces a passing negative
          # control, which in a log is indistinguishable from "the bug is
          # gone". Assert the condition exists, in this process and in a
          # child, before believing anything below.
          "$PY" - <<'CHECK'
          import os
          import subprocess
          import sys

          import pip

          print("keg pip:", pip.__file__)

          # Both routes pip can be imported by here, because they are not the
          # same directory: this process reaches it through Homebrew's prefix
          # tree, and `pip --python` re-execs `get_runnable_pip()`, which is
          # `Path(pip.__file__).resolve().parent` -- the Cellar. Checking only
          # the first is what let the previous spelling through: it fired
          # through a dangling prefix symlink while the child imported an
          # untouched Cellar copy and installed happily. Resolve the *file*,
          # as `get_runnable_pip()` does -- Homebrew's prefix directory is
          # usually real with only its files linked, so resolving the
          # directory would collapse both routes into one and quietly stop
          # probing the child's.
          as_imported = os.path.dirname(pip.__file__)
          resolved = os.path.dirname(os.path.realpath(pip.__file__))
          routes = [("prefix", os.path.dirname(as_imported))]
          if resolved != as_imported:
              routes.append(("resolved (Cellar)", os.path.dirname(resolved)))

          for name, site_packages in routes:
              probe = (
                  "import sys\n"
                  f"sys.path.insert(0, {site_packages!r})\n"
                  "import pip\n"
                  "print('  pip imported from', pip.__file__)\n"
                  "import pip._internal.operations.install.wheel\n"
              )
              done = subprocess.run(
                  [sys.executable, "-c", probe],
                  capture_output=True,
                  text=True,
              )
              print(f"-- {name} route: {site_packages}")
              print(done.stdout.rstrip() or "  (no output)")
              if done.returncode == 0:
                  print(f"::error::the keg pip can still import its wheel installer by its {name} route; #3788's condition was not created")
                  sys.exit(1)
              if "No module named 'pip._internal.operations.install.wheel'" not in done.stderr:
                  print(done.stderr.rstrip())
                  print(f"::error::the {name} route failed to import it for some other reason")
                  sys.exit(1)
          print("  the keg pip cannot import its wheel installer, as on the owner's Mac")
          CHECK

          echo "=== negative control: rc11's bootstrap, which installs through the keg's pip ==="
          "$PY" -m venv --without-pip "$WORK/venv-old"
          set +e
          "$PY" -m pip --python "$WORK/venv-old/bin/python" install --upgrade pip \
            > "$WORK/old.log" 2>&1
          old_rc=$?
          set -e
          tail -25 "$WORK/old.log" || true
          if [ "$old_rc" -eq 0 ]; then
            echo "rc11's bootstrap survived a keg pip that cannot import its"
            echo "wheel installer, so the check below would pass whether or"
            echo "not the new bootstrap helps. Re-derive the reproduction."
            echo "::error::this runner no longer reproduces #3788"
            exit 1
          fi
          grep -qF "No module named 'pip._internal.operations.install.wheel'" "$WORK/old.log" || {
            echo "the old bootstrap failed, but not with the owner's ImportError."
            echo "::error::the #3788 reproduction has drifted"
            exit 1
          }
          echo "reproduced: rc11's bootstrap exits $old_rc with the owner's ImportError"

          echo "=== this checkout's bootstrap, same keg state ==="
          "$PY" -m venv --without-pip "$WORK/venv-new"
          # `download` is the only keg-pip subcommand the recipe still uses,
          # and it never reaches the module that is missing.
          "$PY" -m pip download --no-deps --only-binary :all: \
            --disable-pip-version-check --dest "$WORK/wheelhouse" pip
          WHEEL="$(ls "$WORK"/wheelhouse/pip-*.whl | head -1)"
          "$WORK/venv-new/bin/python" "$WHEEL/pip" install --no-index \
            --disable-pip-version-check "$WHEEL"
          "$WORK/venv-new/bin/pip" --version

          echo "=== restore the keg, and prove it is whole again ==="
          restore_the_keg
          trap - EXIT
          "$PY" -c 'import pip._internal.operations.install.wheel as m; print("restored:", m.__file__)'

      # Round 4 of the same lesson, and a different fault (#4122, D-006).
      # With #3814 out of the way the owner's macOS 27 Mac reached PyPI and
      # was refused there, on every attempt, at any time after boot:
      #
      #   SSLError(SSLCertVerificationError('OSStatus -26276'))
      #
      # Homebrew builds under `sandbox-exec` with `(deny mach-lookup)`, and
      # Security.framework's trust evaluation needs a mach service that is
      # not allowlisted -- so the evaluation cannot be PERFORMED, which is
      # why the status is `errSecInternal` rather than a named certificate
      # rejection, and why `curl` succeeds outside the sandbox while pip
      # fails seconds later inside it.
      #
      # This runner is macos-15 and does not reproduce it: the sandbox
      # profile is the same on both, so the difference is macOS 27's
      # Security stack and NO amount of running the plain install here will
      # ever surface it. EC2 Mac hardware is a documented D-006 exception
      # (docs/live-verification-ci.md), so waiting for the condition is not
      # an option and a job that waits is green by luck forever -- the same
      # shape as #3753's rc5 and #3788's rc11. Inject it instead: make pip's
      # truststore path fail the way the sandbox makes it fail, and assert
      # BOTH halves of the fix, because the first one alone is not a fix.
      # With the networked calls flagged and build isolation left on, the
      # owner measured the failure MOVING from `.../simple/pip/` to
      # `.../simple/setuptools/` -- `pip install <source tree>` spawns a
      # separate pip to fetch the build backend, and that child inherits no
      # `--use-deprecated`.
      #
      # The flags are read back out of the formula this checkout ships
      # rather than copied here, like the mac_ver() shim above: a formula
      # that loses one runs the "fixed" half without it and fails.
      - name: "Reproduce the sandboxed trust failure, then prove both flags clear it"
        run: |
          set -euo pipefail

          PY="$(brew --prefix python@3.12)/bin/python3.12"
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/sabotage" "$WORK/tree"

          # Force the network for every probe below. Measured while writing
          # this step: pip's HTTP cache serves the index page and the wheel,
          # so a warm cache makes the negative controls pass and proves
          # nothing. It is the ENV var and not `--no-cache-dir` because the
          # build-isolation child inherits the environment and not the
          # parent's flags -- which is the whole point of control 2.
          export PIP_NO_CACHE_DIR=1

          # The observed fault, at the layer that observes it. truststore is
          # pip's default TLS backend since 24.2 and the only part of pip
          # that calls Security.framework; inside the sandbox its trust
          # evaluation comes back errSecInternal. Patched onto the vendored
          # module after it loads, so pip's own decision about whether to use
          # truststore at all is what this step measures -- which is exactly
          # what `--use-deprecated=legacy-certs` changes.
          cat > "$WORK/sabotage/sitecustomize.py" <<'FAULT'
          import importlib.abc
          import importlib.util
          import ssl
          import sys

          TARGET = "pip._vendor.truststore._api"
          OSSTATUS = (
              "[SSL: CERTIFICATE_VERIFY_FAILED] certificate verify failed: "
              "OSStatus -26276"
          )


          def _refuse(*args, **kwargs):
              raise ssl.SSLCertVerificationError(OSSTATUS)


          class _Sandboxed(importlib.abc.MetaPathFinder):
              """Let truststore import, then deny it the trust evaluation."""

              def find_spec(self, fullname, path=None, target=None):
                  if fullname != TARGET:
                      return None
                  sys.meta_path.remove(self)
                  try:
                      spec = importlib.util.find_spec(fullname)
                  finally:
                      sys.meta_path.insert(0, self)
                  if spec is None or spec.loader is None:
                      return None
                  inner = spec.loader

                  class _Loader(importlib.abc.Loader):
                      def create_module(self, spec):
                          return inner.create_module(spec)

                      def exec_module(self, module):
                          inner.exec_module(module)
                          module._verify_peercerts_impl = _refuse
                          print(
                              "sandbox-fault: truststore trust evaluation denied "
                              "(OSStatus -26276)",
                              file=sys.stderr,
                          )

                  spec.loader = _Loader()
                  return spec


          sys.meta_path.insert(0, _Sandboxed())
          FAULT
          "$PY" -c "import ast,pathlib; ast.parse(pathlib.Path('$WORK/sabotage/sitecustomize.py').read_text())"

          # A source tree with nyxGPT's own build-system table and none of its
          # dependencies: the property under test is pip's build isolation,
          # not nyxGPT's package, and the real tree is installed for real by
          # the `brew install` steps below.
          "$PY" - "$WORK/tree/pyproject.toml" <<'TREE'
          import pathlib
          import sys
          import tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          build_system = pyproject["build-system"]
          requires = ", ".join(repr(item) for item in build_system["requires"])
          pathlib.Path(sys.argv[1]).write_text(
              "[build-system]\n"
              f"requires = [{requires}]\n"
              f"build-backend = {build_system['build-backend']!r}\n"
              "\n"
              "[project]\n"
              'name = "nyxgpt-sandbox-probe"\n'
              'version = "0.0.0"\n',
              encoding="utf-8",
          )
          print(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          TREE

          # The flags the shipped recipe actually puts on each call.
          PYTHONPATH=scripts "$PY" - "$WORK" <<'FLAGS'
          import pathlib
          import sys

          from build_homebrew_artifacts import (
              LEGACY_CERTS_FLAG,
              NO_BUILD_ISOLATION_FLAG,
              pip_invocations,
          )

          work = pathlib.Path(sys.argv[1])
          calls = pip_invocations(pathlib.Path("homebrew/nyxgpt-api.rb").read_text(encoding="utf-8"))
          sandbox_flags = {LEGACY_CERTS_FLAG, NO_BUILD_ISOLATION_FLAG}


          def flags_of(predicate, what):
              match = [call for call in calls if predicate(call)]
              if len(match) != 1:
                  raise SystemExit(f"expected exactly one {what} pip call, found {len(match)}")
              return " ".join(flag for flag in match[0].literals if flag in sandbox_flags)


          for name, predicate in (
              ("download", lambda call: "download" in call.literals),
              ("tree", lambda call: call.installs_a_source_tree),
              (
                  "seed",
                  lambda call: "install" in call.literals
                  and {"setuptools", "wheel"} <= set(call.literals),
              ),
          ):
              value = flags_of(predicate, name)
              (work / f"{name}-flags").write_text(value, encoding="utf-8")
              print(f"{name} call carries: {value or '(no sandbox flags)'}")
          FLAGS

          DOWNLOAD_FLAGS="$(cat "$WORK/download-flags")"
          TREE_FLAGS="$(cat "$WORK/tree-flags")"
          SEED_FLAGS="$(cat "$WORK/seed-flags")"

          echo "=== negative control 1: the recipe's pip download, trust evaluation denied ==="
          # Printed because it is the one thing that could make this control
          # fail honestly: truststore is pip's default TLS backend only since
          # 24.2, and `--use-deprecated=legacy-certs` only exists from there
          # too. A keg pip older than that neither exhibits the fault nor
          # accepts the fix, and the drift message below is what to read.
          "$PY" -m pip --version
          mkdir -p "$WORK/wheelhouse-broken"
          set +e
          PYTHONPATH="$WORK/sabotage" "$PY" -m pip download --no-deps --only-binary :all: \
            --disable-pip-version-check --dest "$WORK/wheelhouse-broken" pip \
            > "$WORK/broken.log" 2>&1
          broken_rc=$?
          set -e
          tail -20 "$WORK/broken.log" || true
          if [ "$broken_rc" -eq 0 ]; then
            echo "pip downloaded with its trust evaluation denied, so the checks"
            echo "below would pass whether or not the flags work."
            echo "::error::this runner no longer reproduces #4122"
            exit 1
          fi
          grep -qF "OSStatus -26276" "$WORK/broken.log" || {
            echo "pip failed, but not with the owner's errSecInternal, so this is"
            echo "no longer testing the failure that was reported. Check the pip"
            echo "version above: below 24.2 it does not use truststore at all,"
            echo "and the recipe's own legacy-certs flag would be rejected."
            echo "::error::the #4122 reproduction has drifted"
            exit 1
          }
          echo "reproduced: pip exits $broken_rc with the owner's OSStatus -26276"

          echo "=== the same download with the recipe's flags ==="
          mkdir -p "$WORK/wheelhouse"
          # shellcheck disable=SC2086  # the flag list is read out of the formula
          PYTHONPATH="$WORK/sabotage" "$PY" -m pip download --no-deps --only-binary :all: \
            --disable-pip-version-check $DOWNLOAD_FLAGS --dest "$WORK/wheelhouse" pip
          WHEEL="$(ls "$WORK"/wheelhouse/pip-*.whl | head -1)"
          echo "downloaded: $WHEEL"

          # The venv is populated exactly as the recipe does it -- offline,
          # out of the wheel by zipimport -- so the sabotage cannot touch it
          # and the two halves below differ only in the flags under test.
          bootstrap_venv() {
            "$PY" -m venv --without-pip "$1"
            "$1/bin/python" "$WHEEL/pip" install --no-index \
              --disable-pip-version-check "$WHEEL" > /dev/null
          }

          echo "=== negative control 2: legacy-certs alone, build isolation left on ==="
          # The half the owner measured: the parent is flagged, the child pip
          # build isolation spawns is not, so the failure moves rather than
          # clearing. This is why `--no-build-isolation` is in the recipe.
          # `legacy-certs` is spelled out here rather than read from the
          # formula on purpose -- this control is the pre-fix command, and it
          # has to stay the pre-fix command however the recipe changes.
          bootstrap_venv "$WORK/venv-isolated"
          set +e
          PYTHONPATH="$WORK/sabotage" "$WORK/venv-isolated/bin/pip" install \
            --disable-pip-version-check --use-deprecated=legacy-certs "$WORK/tree" \
            > "$WORK/isolated.log" 2>&1
          isolated_rc=$?
          set -e
          tail -25 "$WORK/isolated.log" || true
          if [ "$isolated_rc" -eq 0 ]; then
            echo "an isolated build fetched its backend with the parent's trust"
            echo "evaluation denied, so --no-build-isolation is not provably"
            echo "load-bearing here and this control proves nothing."
            echo "::error::the #4122 build-isolation reproduction has drifted"
            exit 1
          fi
          grep -qF "OSStatus -26276" "$WORK/isolated.log" || {
            echo "::error::the isolated build failed for some other reason"
            exit 1
          }
          grep -qiE "setuptools" "$WORK/isolated.log" || {
            echo "the failure did not name the build backend, so it is not the"
            echo "child-process failure this control is about."
            echo "::error::the #4122 build-isolation reproduction has drifted"
            exit 1
          }
          echo "reproduced: the build-isolation child exits $isolated_rc on the backend fetch"

          echo "=== the recipe's own sequence: seed the backend, then install with both flags ==="
          bootstrap_venv "$WORK/venv-fixed"
          # shellcheck disable=SC2086  # as above
          PYTHONPATH="$WORK/sabotage" "$WORK/venv-fixed/bin/pip" install \
            --disable-pip-version-check $SEED_FLAGS setuptools wheel
          # shellcheck disable=SC2086  # as above
          PYTHONPATH="$WORK/sabotage" "$WORK/venv-fixed/bin/pip" install \
            --disable-pip-version-check $TREE_FLAGS "$WORK/tree" \
            2>&1 | tee "$WORK/fixed.log" | tail -10
          "$WORK/venv-fixed/bin/pip" show nyxgpt-sandbox-probe > /dev/null
          echo "the recipe's sequence installs a source tree with Apple's trust store unreachable"

      - name: Stamp the rc formulas from this checkout
        env:
          # The rc channel is what the owner installs, so smoke-test that
          # rendering (renamed class, conflicts_with block), not just stable.
          SMOKE_VERSION: 3.0.0rc0
        run: |
          set -euo pipefail
          python scripts/build_homebrew_artifacts.py "$SMOKE_VERSION" dist/homebrew \
            "file://${PWD}/dist/homebrew/dist" --channel rc
          ls -1 dist/homebrew/*.rb

          # #3850 (re-test): the tarball has to *declare* the version it is
          # named for. rc13 shipped a `nyxgpt-api-3.0.0rc13.tar.gz` whose
          # vendored pyproject.toml still said `version = "3.0.0"` -- the
          # release branch's stable number -- so the keg's pip metadata
          # claimed the stable release and `nyxgpt up` reconciled the stable
          # channel. Checked here, on the tarball this runner just built, so
          # a stamping regression is named at the build rather than three
          # steps later as a confusing version mismatch.
          DECLARED="$(tar -xzOf "dist/homebrew/dist/nyxgpt-api-${SMOKE_VERSION}.tar.gz" \
            "nyxgpt-api-${SMOKE_VERSION}/pyproject.toml" \
            | awk -F'"' '/^version =/{print $2; exit}')"
          echo "the vendored pyproject.toml declares: ${DECLARED}"
          test "$DECLARED" = "$SMOKE_VERSION" || {
            echo "::error::the ${SMOKE_VERSION} tarball declares ${DECLARED}"
            exit 1
          }

      - name: Create a throwaway local tap
        run: |
          set -euo pipefail
          brew tap-new nyxgpt/brew-smoke --no-git 2>/dev/null || brew tap-new nyxgpt/brew-smoke
          TAP_DIR="$(brew --repository nyxgpt/brew-smoke)"
          mkdir -p "$TAP_DIR/Formula"
          # Only the candidate formulas -- this tap intentionally has no
          # stable counterpart, so `conflicts_with "nyxgpt-api"` here names a
          # formula the tap does not carry (the #3753 secondary finding).
          cp dist/homebrew/*.rb "$TAP_DIR/Formula/"
          ls -1 "$TAP_DIR/Formula/"

      # The cause underneath #3753 and #3788, injected (#3814). Both of those
      # were patched against a guess -- the empty `platform.mac_ver()` and the
      # `No module named 'pip._internal.operations.install.wheel'` were two
      # symptoms of one broken `pyexpat` in the owner's `python@3.12` keg, and
      # three release candidates were burnt debugging pip instead of the
      # interpreter under it. nyxGPT cannot repair a Homebrew bottle; what it
      # can do is refuse to build on one and say why.
      #
      # This runner is green by luck for that class: its bottle matches its OS,
      # so `pyexpat` imports fine and a preflight would pass here whether or
      # not it works. So the condition is forced, at the realpath every import
      # route resolves to, and both halves are proved with the real
      # `brew install`:
      #
      #   1. self-check -- the interpreter is really in the owner's state
      #      (xml.parsers.expat and plistlib unimportable, mac_ver() empty)
      #   2. the mask, reproduced: the recipe's own pip bootstrap on that
      #      interpreter dies with the owner's misleading ImportError
      #   3. negative control: `brew install` of this same formula with the
      #      preflight stripped out walks straight past the broken interpreter
      #      and into the pip bootstrap -- the rc12 behaviour
      #   4. the shipped formula: `brew install` refuses, before the venv, with
      #      the keg path, the dyld error verbatim and the operator action
      #   5. restore, and prove the interpreter and the preflight are whole
      #      (the install steps after this one run on this same keg)
      #
      # Fidelity note: the owner's `.so` loads and fails to resolve a symbol
      # (`_XML_SetAllocTrackerActivationThreshold` against the system
      # libexpat), which cannot be manufactured on a runner whose libexpat
      # matches its bottle. What is injected instead is an unloadable
      # extension at exactly that path, so the failure still comes out of dyld
      # (`dlopen(...)`) at the same import site. The property under test is
      # that the preflight quotes whatever the interpreter says and refuses --
      # not that this runner can reproduce Apple's SDK skew.
      - name: "Reproduce the broken pyexpat, then prove the preflight refuses to build on it"
        run: |
          set -euo pipefail

          PY="$(brew --prefix python@3.12)/bin/python3.12"
          TAP_DIR="$(brew --repository nyxgpt/brew-smoke)"
          FORMULA="$TAP_DIR/Formula/nyxgpt-api@3.0.0rc.rb"
          WORK="$(mktemp -d)"

          # The realpath, not the path it was imported by: Homebrew's prefix
          # tree links into the Cellar, and a hole punched in the prefix copy
          # leaves the Cellar one that other routes resolve to untouched --
          # #3788's third red round is what taught this job that.
          EXPAT_SO="$("$PY" -c 'import os, pyexpat; print(os.path.realpath(pyexpat.__file__))')"
          HIDDEN="$EXPAT_SO.3814-hidden"
          echo "pyexpat extension: $EXPAT_SO"

          cp "$FORMULA" "$WORK/formula.rb.shipped"
          restore_the_machine() {
            if [ -e "$HIDDEN" ]; then
              mv -f "$HIDDEN" "$EXPAT_SO"
            fi
            cp -f "$WORK/formula.rb.shipped" "$FORMULA"
          }
          # Every exit path: the steps after this one install the formulas
          # with this same keg, from this same tap.
          trap restore_the_machine EXIT

          # Not `mv` alone: a *missing* file raises ModuleNotFoundError, while
          # the owner's fault came out of dyld. An unloadable file at the same
          # path keeps the failure on the dlopen route.
          mv "$EXPAT_SO" "$HIDDEN"
          printf 'nyxgpt: deliberately not a mach-o file (#3814)\n' > "$EXPAT_SO"

          echo "=== self-check: the interpreter is really in the owner's state ==="
          # A fault that does not fire produces a passing negative control,
          # which in a log is indistinguishable from "the bug is gone".
          #
          # The observed error is written out rather than assumed: the claim
          # under test is that the refusal quotes what the *loader* said, so
          # the later assertion greps for the string this step actually saw
          # instead of hard-coding dyld's current phrasing.
          NYXGPT_SMOKE_WORK="$WORK" "$PY" - <<'CHECK'
          import os
          import platform
          import sys

          work = os.environ["NYXGPT_SMOKE_WORK"]
          observed = None
          for module in ("xml.parsers.expat", "plistlib"):
              try:
                  __import__(module)
              except Exception as exc:  # noqa: BLE001 - this is the assertion
                  print(f"  import {module}: {type(exc).__name__}: {exc}")
                  if observed is None:
                      observed = str(exc).splitlines()[0]
                  if "dlopen(" not in str(exc):
                      # Not fatal: the condition (this interpreter cannot load
                      # pyexpat) is created either way, and that is what the
                      # preflight has to catch. Say it, because the owner's
                      # fault came out of dyld and a drift here is worth seeing.
                      print(f"::warning::{module} failed, but not through dlopen -- injected shape has drifted")
              else:
                  print(f"::error::{module} still imports; #3814's condition was not created")
                  sys.exit(1)

          # The #3753 symptom, which is what makes the two issues one issue.
          release = platform.mac_ver()[0]
          print(f"  platform.mac_ver()[0]: {release!r}")
          if release:
              print("::error::mac_ver() still answers, so this is not the state the owner's Mac was in")
              sys.exit(1)
          with open(os.path.join(work, "observed-error.txt"), "w", encoding="utf-8") as handle:
              handle.write((observed or "") + "\n")
          print("  the interpreter cannot load pyexpat, as on the owner's Mac")
          CHECK

          echo "=== the mask: what a machine in this state reported before #3814 ==="
          # Frozen on purpose, and deliberately NOT read out of the formula:
          # this is rc12's *behaviour* (repair mac_ver and carry on), which the
          # shipped shim no longer has. It is the condition, not the fix.
          mkdir -p "$WORK/rc12-shim"
          cat > "$WORK/rc12-shim/sitecustomize.py" <<'STUB'
          import platform
          import subprocess

          release = subprocess.run(
              ["/usr/bin/sw_vers", "-productVersion"],
              capture_output=True,
              text=True,
              check=False,
          ).stdout.strip()
          platform.mac_ver = lambda *args, **kwargs: (release, ("", "", ""), platform.machine())
          STUB
          "$PY" -m venv --without-pip "$WORK/venv-mask"
          mkdir -p "$WORK/wheelhouse-mask"
          set +e
          (
            set -e
            PYTHONPATH="$WORK/rc12-shim" "$PY" -m pip download --no-deps --only-binary :all: \
              --disable-pip-version-check --dest "$WORK/wheelhouse-mask" pip
            mask_wheel="$(ls "$WORK"/wheelhouse-mask/pip-*.whl | head -1)"
            PYTHONPATH="$WORK/rc12-shim" "$WORK/venv-mask/bin/python" "$mask_wheel/pip" \
              install --no-index --disable-pip-version-check "$mask_wheel"
          ) > "$WORK/mask.log" 2>&1
          mask_rc=$?
          set -e
          tail -25 "$WORK/mask.log" || true
          if [ "$mask_rc" -eq 0 ]; then
            echo "the recipe's bootstrap survived an interpreter that cannot load"
            echo "pyexpat, so this runner is no longer reproducing what the owner hit."
            echo "::error::this runner no longer reproduces #3814's downstream failure"
            exit 1
          fi
          if grep -qF "No module named 'pip._internal.operations.install.wheel'" "$WORK/mask.log"; then
            echo "reproduced: exit $mask_rc, reported as the owner's ImportError -- a module"
            echo "that is present the whole time. THAT is why three fixes aimed at pip."
          else
            # Not fatal: the mask is pip's behaviour, not nyxGPT's, and a pip
            # release may report the same fault differently. What must not
            # change is that it fails, which is asserted above. Say so loudly
            # instead of silently accepting a different reproduction.
            echo "::warning::the bootstrap failed on the broken interpreter, but not"
            echo "::warning::with pip 26.2's masked ImportError -- pip's reporting changed (#3814)"
          fi
          if grep -qiE 'pyexpat|libexpat' "$WORK/mask.log"; then
            echo "note: this pip names the real cause; the mask is narrower than it was"
          else
            echo "confirmed: nothing in that failure names pyexpat, expat or the interpreter"
          fi

          echo "=== negative control: the same install with the preflight stripped out ==="
          PYTHONPATH=scripts python3 - "$FORMULA" <<'STRIP'
          import pathlib
          import sys

          from build_homebrew_artifacts import strip_interpreter_preflight

          formula = pathlib.Path(sys.argv[1])
          formula.write_text(
              strip_interpreter_preflight(formula.read_text(encoding="utf-8")), encoding="utf-8"
          )
          STRIP
          set +e
          brew install --verbose nyxgpt/brew-smoke/nyxgpt-api@3.0.0rc \
            > "$WORK/stripped-install.log" 2>&1
          stripped_rc=$?
          set -e
          tail -40 "$WORK/stripped-install.log" || true
          brew uninstall --force nyxgpt-api@3.0.0rc >/dev/null 2>&1 || true
          if [ "$stripped_rc" -eq 0 ]; then
            echo "::error::the install SUCCEEDED on an interpreter that cannot load"
            echo "::error::pyexpat -- the reproduction is wrong"
            exit 1
          fi
          if grep -qF "refusing to build against" "$WORK/stripped-install.log"; then
            echo "::error::the stripped formula still refused -- the preflight was not actually removed"
            exit 1
          fi
          # The point of this control: without the preflight the recipe walks
          # PAST the broken interpreter and starts building on it, dying
          # somewhere downstream. Several spellings, because which downstream
          # failure comes first depends on the pip of the day -- what must be
          # true is that the recipe got as far as running Python at all.
          grep -qE "venv --without-pip|pip download|invalid literal for int|not repairing the value" \
            "$WORK/stripped-install.log" || {
            echo "::error::the stripped install failed before it ran any Python, so"
            echo "::error::this control does not show the recipe walking past the fault"
            exit 1
          }
          echo "reproduced: exit $stripped_rc, after the recipe had already begun building on it"

          echo "=== the shipped formula, same broken interpreter ==="
          cp -f "$WORK/formula.rb.shipped" "$FORMULA"
          set +e
          brew install --verbose nyxgpt/brew-smoke/nyxgpt-api@3.0.0rc \
            > "$WORK/preflight-install.log" 2>&1
          preflight_rc=$?
          set -e
          tail -60 "$WORK/preflight-install.log" || true
          brew uninstall --force nyxgpt-api@3.0.0rc >/dev/null 2>&1 || true
          if [ "$preflight_rc" -eq 0 ]; then
            echo "::error::the shipped formula built a keg on an interpreter that cannot load pyexpat"
            exit 1
          fi
          # Everything the owner asked the message to carry: that it refused,
          # the keg it refused, the dyld error verbatim, and what to do.
          for needle in \
            "refusing to build against" \
            "nyxgpt-preflight: this interpreter cannot import part of its own" \
            "import xml.parsers.expat" \
            "brew reinstall python@3.12" \
            "Update macOS"
          do
            grep -qF "$needle" "$WORK/preflight-install.log" || {
              echo "::error::the refusal does not carry \"$needle\" -- the operator cannot act on it"
              exit 1
            }
          done
          # The loader's own words, quoted -- compared against what the
          # self-check above actually observed, not against a phrasing this
          # file guessed. That string is what makes the fault searchable, which
          # is the property the owner asked the message to have.
          OBSERVED="$(head -1 "$WORK/observed-error.txt")"
          test -n "$OBSERVED" || { echo "::error::the self-check recorded no loader error"; exit 1; }
          grep -qF "$OBSERVED" "$WORK/preflight-install.log" || {
            echo "expected verbatim: $OBSERVED"
            echo "::error::the refusal summarises the loader error instead of quoting it"
            exit 1
          }
          grep -qF "$(brew --prefix python@3.12)" "$WORK/preflight-install.log" \
            || grep -qF "/python@3.12/" "$WORK/preflight-install.log" \
            || { echo "::error::the refusal never names the keg it is refusing"; exit 1; }
          # And it stopped BEFORE doing any work, which is the whole point:
          # rc12's failure came 200 lines later, inside pip.
          if grep -qF "venv --without-pip" "$WORK/preflight-install.log"; then
            echo "::error::the install created its venv anyway -- the preflight is not stopping the build"
            exit 1
          fi
          echo "good: refused up front, with the keg path, the dyld error and the remedy"

          echo "=== is the web keg exposed to this at all? measured, not assumed ==="
          # nyxgpt-web builds with npm and its wrapper parses config.ini with
          # /usr/bin/python3 (Apple's, which ships with the OS and cannot skew
          # against it), so a broken python@3.12 keg is not its problem -- but
          # that is a claim about the dependency graph, so read it off brew
          # rather than asserting it. If the web formula ever grows a
          # python@3.12 dependency, this fails and it needs the preflight too
          # (`validate_interpreter_preflight` fails the release build on the
          # same rule).
          brew info --json=v2 --formula nyxgpt/brew-smoke/nyxgpt-web@3.0.0rc \
            > "$WORK/web-info.json"
          python3 - "$WORK/web-info.json" <<'WEB'
          import json
          import sys

          info = json.loads(open(sys.argv[1], encoding="utf-8").read())["formulae"][0]
          declared = sorted(
              set(info.get("dependencies", [])) | set(info.get("build_dependencies", []))
          )
          print("MEASURED: nyxgpt-web declares:", ", ".join(declared) or "(none)")
          if any(dep.startswith("python@") for dep in declared):
              print("::error::nyxgpt-web now depends on a brewed python, so it needs the #3814 preflight too")
              sys.exit(1)
          WEB

          echo "=== restore the interpreter, and prove both it and the preflight are whole ==="
          restore_the_machine
          trap - EXIT
          "$PY" -c 'import xml.parsers.expat, plistlib, platform; print("restored:", platform.mac_ver()[0])'
          # The preflight itself, read back out of the formula that ships it
          # (never a copy in this file), run on the repaired interpreter: it
          # has to PASS as well as fail, or the install steps below would be
          # blocked by the very check this step just proved.
          PYTHONPATH=scripts python3 - "$FORMULA" "$WORK/preflight.py" <<'OK'
          import pathlib
          import sys

          from build_homebrew_artifacts import extract_interpreter_preflight

          formula, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          out.write_text(
              extract_interpreter_preflight(formula.read_text(encoding="utf-8")), encoding="utf-8"
          )
          OK
          "$PY" "$WORK/preflight.py" | tee "$WORK/preflight-ok.log"
          grep -qF "nyxgpt-preflight: ok" "$WORK/preflight-ok.log" || {
            echo "::error::the restored interpreter does not pass the preflight the formula ships"
            exit 1
          }

      - name: Install nyxgpt-api from the local tap
        run: |
          set -euo pipefail
          # `pipefail` is what makes the `tail` safe: a failing `brew install`
          # still fails the step rather than being masked by tail's exit 0.
          # The trimmed tail is the readable part; the full Homebrew log is
          # dumped by the on-failure step below.
          #
          # `tee` keeps the whole transcript, because the next step asserts
          # against what the operator was *told*, and the caveats are printed
          # once, at install time (#3854).
          brew install --verbose nyxgpt/brew-smoke/nyxgpt-api@3.0.0rc 2>&1 \
            | tee "$RUNNER_TEMP/install-nyxgpt-api.log" | tail -80

      - name: "Prove the install tells the operator to run `nyxgpt up`"
        # #3854: the owner ran `brew services start` because that is what
        # Homebrew told them to, and got a stack with no Ollama, no Cassandra
        # and no observability. Every job here was green throughout -- they all
        # asked whether the keg builds, and none asked what the install says.
        #
        # The script injects the condition itself (strip `caveats`, ask brew
        # what it would print, require the check to fail), so this is not a
        # gate that only ever runs against a good formula. See its header.
        run: |
          ./scripts/homebrew-caveats-smoke.sh nyxgpt/brew-smoke/nyxgpt-api@3.0.0rc \
            "$RUNNER_TEMP/install-nyxgpt-api.log"

      - name: Verify the keg venv was really built
        run: |
          set -euo pipefail
          KEG="$(brew --prefix nyxgpt-api@3.0.0rc)"
          VENV="$KEG/libexec/venv"
          test -x "$VENV/bin/python3" || { echo "::error::no venv python in the keg"; exit 1; }
          # The bootstrap this job exists to defend: pip has to be IN the venv,
          # put there without ensurepip.
          "$VENV/bin/pip" --version
          "$VENV/bin/python3" -c 'import nyxgpt.app; print("nyxgpt.app imports")'
          # Inside the venv only -- deliberately not the operability check.
          # This exact line was green for every rc while `nyxgpt` was
          # unreachable from a shell (#3850); the step below is the one that
          # answers "can the operator run it?".
          "$VENV/bin/nyxgpt" --version
          test -f "$KEG/bin/nyxgpt-api" || { echo "::error::no nyxgpt-api wrapper"; exit 1; }
          # `brew test` runs the formula's own test block against the keg.
          brew test nyxgpt/brew-smoke/nyxgpt-api@3.0.0rc

      - name: "Prove the keg exposes a runnable `nyxgpt`, and that a CLI-less keg fails"
        # #3850: `brew install` succeeded, the dashboard came up, and
        # `nyxgpt up` answered `zsh: command not found`. The console script
        # existed the whole time -- in the keg's venv, on nobody's PATH -- so
        # every check that reached into the venv passed. This step asks the
        # operator's question instead: is the command on PATH, by name.
        #
        # Unlike the mac_ver and keg-pip steps above, the condition needs no
        # emulation: an unexposed CLI reproduces on this runner exactly as it
        # did on the owner's Mac. What is still worth proving is that the new
        # check would have *caught* it, so the CLI is taken away and the same
        # function is re-run -- a check that only ever runs against a good keg
        # is indistinguishable from no check at all.
        run: |
          set -euo pipefail
          KEG="$(brew --prefix nyxgpt-api@3.0.0rc)"
          KEG_CLI="$KEG/bin/nyxgpt"
          HIDDEN="$RUNNER_TEMP/nyxgpt-cli-link"

          # One function, used for both the negative control and the real
          # assertion: a check re-typed for the injection proves nothing about
          # the check that ships.
          cli_is_operable() {
            command -v nyxgpt >/dev/null 2>&1 || { echo "nyxgpt is not on PATH"; return 1; }
            nyxgpt --version || return 1
          }

          echo "=== what the keg exposes ==="
          ls -l "$KEG/bin"
          test -e "$KEG_CLI" || { echo "::error::the keg installs no nyxgpt CLI"; exit 1; }

          restore_the_cli() {
            # `-L` before `-e`: Homebrew writes `bin/nyxgpt` as a *relative*
            # link into libexec, so the copy parked under $RUNNER_TEMP dangles
            # and `-e` -- which follows the link -- would report it missing and
            # skip the restore, leaving the keg broken for the steps after
            # this one.
            if [ -L "$HIDDEN" ] || [ -e "$HIDDEN" ]; then
              mv "$HIDDEN" "$KEG_CLI"
            fi
          }
          trap restore_the_cli EXIT

          echo "=== negative control: the keg #3850 shipped, with no CLI in bin ==="
          # `mv` moves the symlink itself, so the prefix link left behind
          # dangles -- which is the state the owner's install was in.
          mv "$KEG_CLI" "$HIDDEN"
          if cli_is_operable; then
            echo "::error::the CLI check passes against a keg with no CLI -- it tests nothing"
            exit 1
          fi
          echo "good: the check fails when the CLI is not exposed"

          echo "=== restore, and prove the shipped keg is operable ==="
          restore_the_cli
          trap - EXIT
          command -v nyxgpt
          cli_is_operable

      - name: "Prove the candidate keg reports the candidate, and picks the rc channel"
        # #3850's re-test failure. The CLI-on-PATH fix above held -- the owner
        # ran `/opt/homebrew/bin/nyxgpt` on an rc13 keg. What it *said* was
        # `nyxgpt 3.0.0`, and that is the whole defect: an artifact install has
        # no checkout above the package, so pip metadata is the only thing that
        # says which channel a keg belongs to. `ops._native_service_version()`
        # reads it, `ops._remote_tap_formula()` maps a version with no `rc`
        # marker to the STABLE formula, and so `nyxgpt up` from the candidate
        # installed the stable 2.1.0 pair beside it and started that -- a 2.1.0
        # web tier against a 3.0.0-line API, which read as a missing feature.
        #
        # The step above proves the command runs; this proves it is the right
        # build. Both halves are asserted, because either one alone is the
        # shape of check that already shipped a broken keg twice.
        env:
          SMOKE_VERSION: 3.0.0rc0
        run: |
          set -euo pipefail

          # One function for the assertion and its negative control -- a
          # control that re-types the check proves nothing about the check.
          reported_version_is() {
            test "$1" = "nyxgpt ${SMOKE_VERSION}"
          }

          REPORTED="$(nyxgpt --version)"
          echo "the keg reports: ${REPORTED}"

          # Injected condition: exactly what rc13 printed out of a candidate
          # keg -- the release line with the rc suffix dropped. The condition
          # does NOT reproduce naturally here (this checkout's pyproject and
          # the smoke version share a release line only by coincidence of the
          # fix), so feed the pre-fix answer in and require a failure.
          if reported_version_is "nyxgpt ${SMOKE_VERSION%%rc*}"; then
            echo "::error::the check accepts the stable version out of a candidate keg -- it tests nothing"
            exit 1
          fi
          echo "good: the check rejects the version the pre-fix keg reported"

          reported_version_is "$REPORTED" || {
            echo "::error::keg is ${SMOKE_VERSION}, but its CLI reports '${REPORTED}'"
            exit 1
          }

          # ...and the consequence, at the one function that made the wrong
          # call. Asserted by running the real routing in the keg's own venv
          # rather than by running `nyxgpt up`, which would install a second
          # stack on the runner to observe a decision made before the install.
          KEG="$(brew --prefix "nyxgpt-api@${SMOKE_VERSION%%rc*}rc")"
          ROUTE='import sys; from nyxgpt import ops'
          ROUTE="$ROUTE; print(ops._remote_tap_formula(sys.argv[1], ops._native_service_version()))"
          for service in nyxgpt-api nyxgpt-web; do
            FORMULA="$("$KEG/libexec/venv/bin/python3" -c "$ROUTE" "$service")"
            echo "${service}: a \`nyxgpt up\` from this keg would reconcile ${FORMULA}"
            case "$FORMULA" in
              *@*rc) ;;
              *)
                echo "::error::a candidate keg routes ${service} to the stable formula '${FORMULA}'"
                exit 1
                ;;
            esac
          done

      - name: Run a no-op CLI subcommand against a machine with no stack
        # `--version` proves the entry point resolves; it does not prove the
        # CLI can do anything once the app code loads. `ops status` reports
        # what is running and is documented to always exit 0 -- so on a runner
        # with no nyxGPT stack, no Docker and no repo checkout, a non-zero exit
        # or a traceback is a real defect in the artifact install path (the
        # class of fault #3759 shipped: paths resolved relative to a repo that
        # is not there).
        run: |
          set -euo pipefail
          nyxgpt ops status

      - name: Install nyxgpt-web from the local tap
        # On PRs as well as on dispatch since #3982. `homebrew/**` has always
        # triggered this workflow, so a change to `nyxgpt-web.rb` ran this job
        # -- and then skipped the only step that builds that formula, because
        # `include_web` is a dispatch input and is empty on a PR. The web keg
        # therefore shipped unexecuted on every PR that touched it, and the
        # #3982 web-version claim (below) is a claim about this keg's install
        # layout that nothing on macOS ever ran. The cost is a real `npm ci` +
        # `next build`, which is why it is bought only on the narrow packaging
        # path filter above and not on a hot file.
        if: ${{ inputs.include_web || github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          brew install --verbose nyxgpt/brew-smoke/nyxgpt-web@3.0.0rc 2>&1 \
            | tee "$RUNNER_TEMP/install-nyxgpt-web.log" | tail -80
          brew test nyxgpt/brew-smoke/nyxgpt-web@3.0.0rc
          # The owner is told this twice, once per keg, so both formulas are
          # asserted (#3854). This one only runs when the web keg is built,
          # which is why tests/unit/test_homebrew_caveats_smoke.py pins the web
          # formula's caveats on every PR as well.
          ./scripts/homebrew-caveats-smoke.sh nyxgpt/brew-smoke/nyxgpt-web@3.0.0rc "$RUNNER_TEMP/install-nyxgpt-web.log"

      - name: "The web keg reports its OWN keg version, on macOS (#3982)"
        # The incident this issue was filed for happened on the owner's Mac:
        # a 2.1.0 `nyxgpt-web` keg served :3000 against a 3.0.0-line
        # `nyxgpt-api` on :8000, and the header read `v3.0.0` because the UI
        # had only ever asked the API. The fix resolves the web tier's version
        # from the directory the keg's wrapper `cd`s into
        # (`cd "#{libexec}"`, homebrew/nyxgpt-web.rb) -- which is a claim
        # about a real Homebrew install on a real Mac, not about a regex.
        # `scripts/systemd-native-smoke.sh` makes the same assertion for the
        # Linux native build for the same reason; this is its macOS half, and
        # it is the platform the defect was actually observed on.
        #
        # Two deliberate choices:
        #
        #   the wrapper, not `brew services`  the launchd service reads its
        #     env from the plist and would need the stub below threaded
        #     through it. The `cd` under test is in the wrapper, and the
        #     service runs exactly this file (`run ["/bin/bash", opt_bin/...]`),
        #     so running it directly executes the claim without simulating it.
        #     `/bin/bash` because Homebrew's Cleaner strips the exec bit.
        #
        #   a stub API, not the real one  `/api/info` proxies `/api/v1/info`
        #     and cannot answer while the upstream is down. Standing up
        #     Cassandra and the API here would test those instead, and this
        #     runner has no Docker for the first. The stub's version is
        #     deliberately one nothing in this tree reports (`9.9.9`), so the
        #     assertion cannot pass by reading the API's number for the web
        #     tier's -- which is the exact bug (#3982).
        if: ${{ inputs.include_web || github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail

          KEG_VERSION="$(brew list --versions nyxgpt-web@3.0.0rc | awk '{print $2}')"
          KEG_PREFIX="$(brew --prefix nyxgpt-web@3.0.0rc)"
          echo "keg version: ${KEG_VERSION:-<none>}"
          test -n "$KEG_VERSION" || { echo "::error::could not read the installed keg's version"; exit 1; }

          cat > "$RUNNER_TEMP/stub_api.py" <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer


          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps(
                      {"release_version": "9.9.9", "release_channel": "stable"}
                  ).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, *args):
                  pass


          HTTPServer(("127.0.0.1", 8899), Handler).serve_forever()
          PY
          python3 "$RUNNER_TEMP/stub_api.py" &
          STUB_PID=$!

          # A throwaway HOME so this never edits the job's real config, and so
          # the port cannot collide with anything the earlier steps started.
          WEB_HOME="$RUNNER_TEMP/webhome"
          mkdir -p "$WEB_HOME/.nyxGPT"
          printf '[web]\nhost = 127.0.0.1\nport = 3111\n' > "$WEB_HOME/.nyxGPT/config.ini"

          HOME="$WEB_HOME" NYXGPT_API_BASE_URL="http://127.0.0.1:8899" \
            /bin/bash "$KEG_PREFIX/bin/nyxgpt-web" > "$RUNNER_TEMP/web-keg.log" 2>&1 &
          WEB_PID=$!

          cleanup() {
            kill "$WEB_PID" 2>/dev/null || true
            kill "$STUB_PID" 2>/dev/null || true
            # The wrapper execs npm, which runs `next` as a child; killing the
            # wrapper's pid does not reap it.
            pkill -f 'next-server' 2>/dev/null || true
            pkill -f 'next start' 2>/dev/null || true
          }
          trap cleanup EXIT

          code="000"
          for _ in $(seq 1 60); do
            code="$(curl -s -o "$RUNNER_TEMP/info.json" -w '%{http_code}' \
              --max-time 15 http://127.0.0.1:3111/api/info || true)"
            [ "$code" = "200" ] && break
            sleep 3
          done
          echo "--- keg server log (tail) ---"
          tail -40 "$RUNNER_TEMP/web-keg.log" || true
          echo "--- GET /api/info -> $code ---"
          cat "$RUNNER_TEMP/info.json" 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::the web keg did not answer /api/info (got $code)"
            exit 1
          fi

          cat > "$RUNNER_TEMP/read_info.py" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              payload = json.load(fh)
          for key in ("web_version_source", "web_version", "release_version"):
              print(payload.get(key) or "-")
          PY
          SOURCE="$(python3 "$RUNNER_TEMP/read_info.py" "$RUNNER_TEMP/info.json" | sed -n 1p)"
          VERSION="$(python3 "$RUNNER_TEMP/read_info.py" "$RUNNER_TEMP/info.json" | sed -n 2p)"
          UPSTREAM="$(python3 "$RUNNER_TEMP/read_info.py" "$RUNNER_TEMP/info.json" | sed -n 3p)"

          fail=0
          if [ "$SOURCE" != "homebrew-keg" ]; then
            echo "::error::web_version_source was '$SOURCE', expected homebrew-keg -- the Next server's cwd is not inside the Cellar keg"
            fail=1
          fi
          if [ "$VERSION" != "$KEG_VERSION" ]; then
            echo "::error::the web tier reported '$VERSION', but the installed keg is '$KEG_VERSION'"
            fail=1
          fi
          if [ "$UPSTREAM" != "9.9.9" ]; then
            echo "::error::the upstream payload was not passed through (release_version '$UPSTREAM', expected the stub's 9.9.9)"
            fail=1
          fi
          if [ "$VERSION" = "$UPSTREAM" ]; then
            echo "::error::the web tier reported the API's version as its own -- this is #3982's defect"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "good: the web keg reports its own version ($VERSION) beside the API's ($UPSTREAM)"

      - name: "A Homebrew post-install soft failure is not an install failure (#3861)"
        # The owner's 2026-08-21 acceptance run: `nyxgpt up` reported `native
        # api service` and `native web service` FAILED and left the machine
        # with no listener on :8000 or :3000 -- while both kegs were complete,
        # both `opt` links were intact and `brew linkage` was clean. The
        # nonzero exit was real. What it reported was not the install.
        #
        # Homebrew's post-build phase uses `ofail`, not `odie`
        # (`formula_installer.rb` lines 1214/1242/1250/1259/1313/1324). `ofail`
        # sets `Homebrew.failed` and RETURNS: the installer finishes the keg,
        # prints the caveats and `==> Summary`, and only `brew.rb`'s closing
        # `exit Homebrew.failed? ? 1 : 0` turns the flag into a status of 1.
        # `Failed to fix install linkage` -- the one the owner hit -- is
        # unavoidable for a source build (`formula_installer.rb:999` runs
        # `fix_dynamic_linkage` unconditionally unless a *poured bottle* opts
        # out, and this project ships no bottles), so ops cannot make the exit
        # go away. It can stop reading it as the install's verdict.
        #
        # THE CONDITION IS INJECTED, and it has to be: a runner installs one
        # channel from one tap into a clean prefix, so no `ofail` fires here
        # naturally. What is injected is the owner's own 2026-08-17 shape --
        # a non-keg file sitting on the link target, so `brew link` cannot
        # make the symlink -- because that member of the class reproduces
        # deterministically while the tiktoken dylib-ID one depends on a wheel
        # the resolver picks. Both are the same `ofail` path and the same exit
        # status; the fix is aimed at the path, not at either wording.
        #
        # The dual-tap half of the same acceptance comment rides along: a
        # SECOND tap carrying the same formula names is created first, so
        # every brew call ops makes below is made on a machine where a bare
        # formula name is ambiguous -- the state of every dev machine that has
        # tested the published tap alongside the local one.
        env:
          SMOKE_VERSION: 3.0.0rc0
        run: |
          set -uo pipefail
          FORMULA="nyxgpt-api@${SMOKE_VERSION%%rc*}rc"
          SPEC="nyxgpt/brew-smoke/${FORMULA}"
          KEG="$(brew --prefix "$FORMULA")"
          LINK="$(brew --prefix)/bin/nyxgpt-api"

          # --- the machine state: two taps, one formula name -------------
          brew tap-new nyxgpt/dual-tap --no-git 2>/dev/null || brew tap-new nyxgpt/dual-tap
          SECOND="$(brew --repository nyxgpt/dual-tap)"
          mkdir -p "$SECOND/Formula"
          cp dist/homebrew/*.rb "$SECOND/Formula/"
          brew tap-trust nyxgpt/dual-tap || brew trust nyxgpt/dual-tap \
            || echo "::warning::neither 'brew tap-trust' nor 'brew trust' accepted the second tap"
          ambiguous=0
          brew info "$FORMULA" > "$RUNNER_TEMP/ambiguity.log" 2>&1 || ambiguous=$?
          echo "bare \`brew info $FORMULA\` exited $ambiguous"
          if [ "$ambiguous" = "0" ]; then
            echo "::error::two taps carry ${FORMULA} and brew still resolved the bare name -- this step is no longer running on the machine state #3861 describes"
            exit 1
          fi
          grep -qi 'multiple taps' "$RUNNER_TEMP/ambiguity.log" || {
            echo "--- brew info output ---"; cat "$RUNNER_TEMP/ambiguity.log"
            echo "::error::the bare name failed, but not for tap ambiguity -- the dual-tap state was not reached"
            exit 1
          }
          echo "good: the bare formula name is ambiguous, as it is on the owner's Mac"

          # --- an interpreter that survives the keg being rebuilt ---------
          # A copied venv still resolves its root from the executable's own
          # location, and this one lives outside the Cellar -- so the reinstall
          # below cannot pull site-packages out from under the process that is
          # driving it.
          # This copy failed SILENTLY on 2026-08-24 and the step died three
          # lines later on `line 35: .../opsvenv/bin/python3: No such file or
          # directory` -- a message that names the symptom and hides the
          # cause. `cp -R` is quiet in both of the ways it can go wrong here:
          # copying into a target that already exists nests the tree one level
          # down, and copying a dangling symlink reproduces the dangle. Bash
          # reports a dangling interpreter symlink with the same "No such
          # file" as a missing one, so the two are indistinguishable from the
          # log. Every branch below therefore names what it found.
          SRC_VENV="$KEG/libexec/venv"
          [ -n "$KEG" ] || { echo "::error::brew --prefix ${FORMULA} returned nothing"; exit 1; }
          [ -x "$SRC_VENV/bin/python3" ] || {
            echo "--- ${SRC_VENV}/bin ---"; ls -l "$SRC_VENV/bin" 2>&1 | head -20
            echo "::error::the keg has no runnable interpreter at ${SRC_VENV}/bin/python3"
            exit 1; }

          # Never copy into an existing directory: that is the nesting trap.
          rm -rf "$RUNNER_TEMP/opsvenv"
          cp -R "$SRC_VENV" "$RUNNER_TEMP/opsvenv" || {
            echo "::error::could not copy the keg venv out of ${SRC_VENV}"; exit 1; }
          OPS_PY="$RUNNER_TEMP/opsvenv/bin/python3"

          # A venv's bin/python3 is a symlink chain. Homebrew's resolves
          # absolutely, so `cp -R` normally carries it intact -- but if the
          # chain ever lands on a relative hop it dangles once copied out of
          # the Cellar. Re-copy dereferenced in that case (what
          # `python -m venv --copies` produces: a real interpreter beside a
          # pyvenv.cfg, which still finds its stdlib through `home =`).
          if ! "$OPS_PY" -c 'import sys' 2>/dev/null; then
            echo "--- the copied interpreter does not run; source chain ---"
            ls -l "$SRC_VENV/bin" | grep -i python || true
            echo "--- copied chain ---"
            ls -l "$RUNNER_TEMP/opsvenv/bin" | grep -i python || true
            echo "retrying the copy with symlinks dereferenced"
            rm -rf "$RUNNER_TEMP/opsvenv"
            cp -RL "$SRC_VENV" "$RUNNER_TEMP/opsvenv" || {
              echo "::error::dereferenced copy of ${SRC_VENV} failed too"; exit 1; }
          fi
          "$OPS_PY" -c 'import sys' 2>/dev/null || {
            echo "::error::no working interpreter at ${OPS_PY} after both copy strategies"
            exit 1; }
          "$OPS_PY" -c 'from nyxgpt import ops; print("ops loaded from", ops.__file__)'

          # --- inject: a non-keg file on the link target ------------------
          rm -f "$LINK"
          : > "$LINK"
          test -f "$LINK" && ! test -L "$LINK" || {
            echo "::error::could not plant a plain file at ${LINK}"; exit 1; }

          # --- measure: raw brew, so the class is proved on this runner ---
          rc=0
          brew reinstall "$SPEC" > "$RUNNER_TEMP/ofail.log" 2>&1 || rc=$?
          echo "raw \`brew reinstall\` exited $rc"
          tail -30 "$RUNNER_TEMP/ofail.log"
          if [ "$rc" = "0" ]; then
            echo "::error::the injected link conflict did not make brew exit non-zero -- everything below would pass vacuously"
            exit 1
          fi
          # Homebrew has more than one phrasing for "the keg built, but I could
          # not put its symlinks on the prefix", and which one you get depends
          # on the brew version and on whether the block is found during `link`
          # or during the post-install. Pinning ONE sentence made this gate
          # assert a string rather than the condition: on 2026-08-24 brew
          # exited 1 with the keg installed -- exactly the #3861 case -- and
          # this grep still failed it. Match the class instead.
          if ! grep -qE 'Could not symlink|already exists\. You may want to remove it|The `brew link` step did not complete successfully|The post-install step did not complete successfully' "$RUNNER_TEMP/ofail.log"; then
            # `tail -30` above is caveats, so "see the log above" showed the
            # operator nothing about the failure. Print the whole thing.
            echo "--- ofail.log in full ---"
            cat "$RUNNER_TEMP/ofail.log"
            echo "--- end ofail.log ---"
            echo "::error::brew exited ${rc}, but not for a blocked link -- see ofail.log in full above"
            exit 1
          fi
          brew list --versions "$FORMULA" || {
            echo "::error::the keg is gone, so this is a real install failure and not the ofail case"
            exit 1
          }
          test -x "$KEG/bin/nyxgpt-api" || {
            echo "::error::the keg has no nyxgpt-api wrapper -- not the ofail case"; exit 1; }
          echo "good: brew exited ${rc} with a complete keg -- the class #3861 is about, reproduced"

          # --- the fix: ops resolves that exit against the keg ------------
          cat > "$RUNNER_TEMP/soft_failure.py" <<'PY'
          import pathlib
          import sys

          from nyxgpt import ops

          spec, formula, version, marker_dir = sys.argv[1:5]

          outcome = ops._brew_install_or_reinstall(
              spec,
              formula,
              sha256="ci-3861",
              marker_dir=pathlib.Path(marker_dir),
              version=version,
              entrypoint="nyxgpt-api",
          )
          print("DECISION:", outcome.decision)
          print("WARNING:", outcome.warning)
          if not outcome.warning:
              sys.exit("ops reported a clean install -- brew's soft failure was not surfaced at all")
          if "brew link" not in outcome.warning:
              sys.exit("the warning does not name the Homebrew step that failed")

          # The tolerance is not blanket, and this is the half that says so:
          # a formula that does not exist fails BEFORE Homebrew has a keg, so
          # there is nothing for the verification to find and the exit status
          # must still be fatal.
          try:
              ops._brew_install_or_reinstall(
                  "nyxgpt/brew-smoke/nyxgpt-no-such-formula",
                  "nyxgpt-no-such-formula",
                  sha256="ci-3861",
                  marker_dir=pathlib.Path(marker_dir),
                  version="0.0.0",
                  entrypoint="nyxgpt-no-such-formula",
              )
          except RuntimeError as exc:
              print("CONTROL: a real failure still raises:", str(exc).splitlines()[0])
          else:
              sys.exit("a formula that does not exist installed 'successfully' -- the tolerance is blanket")
          PY
          "$OPS_PY" "$RUNNER_TEMP/soft_failure.py" \
            "$SPEC" "$FORMULA" "$SMOKE_VERSION" "$RUNNER_TEMP/marker" || {
            echo "::error::ops did not survive a Homebrew post-install soft failure (#3861)"
            exit 1
          }

          # --- restore, and prove the runner is whole for the steps after -
          rm -f "$LINK"
          brew link --overwrite "$SPEC" 2>&1 | tail -5
          test -L "$LINK" || { echo "::error::${LINK} was not restored"; exit 1; }
          command -v nyxgpt || { echo "::error::no nyxgpt on PATH after the injection"; exit 1; }
          nyxgpt --version

      - name: "The api restarts itself when the UI asks it to (#4043)"
        # Executed evidence for #4043's SECOND acceptance round, and the one
        # thing its first round's evidence could not be: the restart is driven
        # from INSIDE the service being restarted.
        #
        # The question. `brew services restart` is two launchd operations with
        # a `brew` process in between -- boot the job out, then bootstrap it
        # again. When the api restarts itself that `brew` is a child of the
        # job being booted out, so launchd takes it down with the rest of the
        # job's process tree and it never reaches the start half. The owner's
        # rc17 log is the whole mechanism: `POST
        # /api/v1/infra/restart-required` 200, `Shutting down`, `Finished
        # server process`, and then nothing -- with `brew services list`
        # reporting `none`, `launchctl list` carrying no entry, and the web UI
        # 502ing until `nyxgpt ops restart api` was run from a shell.
        #
        # Why the existing `stable-over-candidate` step (same issue number)
        # could not see it, which is the lesson worth keeping: it drives
        # `restart_native_component("api")` from a CLI child of the runner's
        # shell. That process is not inside the launchd job, so the boot-out
        # never reaches it, the restart completes, and the step is green --
        # the D-051(a) shape, where executed verification existed for the
        # path, passed, and certified the defect. Parentage is the variable,
        # so the driver has to be the api itself, and the only way in is the
        # real endpoint. That also makes this the acceptance scenario rather
        # than a model of it: endpoint -> `_do_restart_required` ->
        # `heal_now` -> `restart_native_component` -> the service manager, and
        # the returning process retiring its own notice.
        #
        # Both halves, because a job that only runs the fixed code is green on
        # any machine that fails to reproduce the bug (the rc5 lesson, #3753).
        # Half one reverts the hand-off in the *installed keg's* copy and
        # requires the api to end up dead and de-registered; half two restores
        # it and requires the api to answer again, under a new pid, with the
        # notice gone. The injection asserts its own edit landed, and the step
        # restores every piece of `$HOME` state it touched.
        #
        # Only `self_heal.py`'s hand-off is injected, because that is the one
        # this endpoint routes through. `ops._restart_native_service` carries
        # the same hand-off for `POST /api/v1/config/restart` (which reaches
        # `ops.restart()` from inside the api the same way) and calls the same
        # shared function, so a regression there fails the unit test that pins
        # it rather than needing a second macOS reproduction.
        run: |
          set -euo pipefail

          KEG_NAME=nyxgpt-api@3.0.0rc
          SPEC="nyxgpt/brew-smoke/$KEG_NAME"
          API="http://127.0.0.1:8000"
          PY="$(brew --prefix "$KEG_NAME")/libexec/venv/bin/python3"
          test -x "$PY" || { echo "::error::no venv python in $KEG_NAME"; exit 1; }
          SH="$("$PY" -c 'import nyxgpt.self_heal as m; print(m.__file__)')"
          echo "driver: $PY"
          echo "keg self_heal: $SH"
          cp "$SH" "$RUNNER_TEMP/self_heal.shipped.py"

          CFG="$HOME/.nyxGPT/config.ini"
          PENDING="$HOME/.nyxGPT/pending-restart.json"
          mkdir -p "$HOME/.nyxGPT"
          # `if`, not `test ... &&`: under `set -e` a failing left-hand side of
          # an `&&` list aborts the step (the trap this file already documents
          # at the stable-over-candidate heal step).
          HAD_CFG=0
          if [ -f "$CFG" ]; then HAD_CFG=1; cp "$CFG" "$RUNNER_TEMP/config.ini.orig"; fi
          HAD_PENDING=0
          if [ -f "$PENDING" ]; then HAD_PENDING=1; cp "$PENDING" "$RUNNER_TEMP/pending.orig"; fi

          cleanup() {
            cp "$RUNNER_TEMP/self_heal.shipped.py" "$SH" 2>/dev/null || true
            brew services stop "$SPEC" >/dev/null 2>&1 || true
            if [ "$HAD_CFG" = 1 ]; then cp "$RUNNER_TEMP/config.ini.orig" "$CFG"; else rm -f "$CFG"; fi
            if [ "$HAD_PENDING" = 1 ]; then cp "$RUNNER_TEMP/pending.orig" "$PENDING"; else rm -f "$PENDING"; fi
          }
          trap cleanup EXIT

          # The api needs a config.ini and will not start without one. The
          # PACKAGED example is used, read through importlib.resources the way
          # the product reads it, so this cannot seed settings the shipped
          # defaults do not have. It ships `[auth] enabled = false` (so the
          # POST below needs no key), `[self_heal] enabled = false` (so the
          # watchdog cannot restart anything behind this step's back),
          # `[nyxgpt] session_backend = file` (no Cassandra, which this runner
          # has no Docker for) and `[rate_limit] enabled = false` -- the field
          # the owner's own reproduction flagged as restart-required.
          export PYTHONDONTWRITEBYTECODE=1
          "$PY" - <<'PY'
          import importlib.resources
          import pathlib

          text = (
              importlib.resources.files("nyxgpt.resources")
              .joinpath("example.config.ini")
              .read_text(encoding="utf-8")
          )
          dst = pathlib.Path.home() / ".nyxGPT" / "config.ini"
          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(text, encoding="utf-8")
          print(f"seeded {dst} from the packaged example ({len(text)} bytes)")
          PY

          # Registration is a launchd fact, not a state word (D-032(d)), and
          # Homebrew has used two label schemes -- `homebrew.mxcl.<formula>`
          # for years, `sh.brew.<formula>` now. Asking only one is how an
          # earlier step here read a running service as unregistered (run
          # 36996645910). `brew_services.LAUNCHD_LABEL_PREFIXES` is the
          # product's copy of this same pair.
          label() {
            local prefix
            for prefix in homebrew.mxcl. sh.brew.; do
              if launchctl list "${prefix}${KEG_NAME}" >/dev/null 2>&1; then
                printf '%s' "${prefix}${KEG_NAME}"
                return 0
              fi
            done
            return 1
          }
          plist_path() {
            local prefix
            for prefix in homebrew.mxcl. sh.brew.; do
              if [ -e "$HOME/Library/LaunchAgents/${prefix}${KEG_NAME}.plist" ]; then
                printf '%s' "$HOME/Library/LaunchAgents/${prefix}${KEG_NAME}.plist"
                return 0
              fi
            done
            return 1
          }
          api_pid() {
            local lbl
            lbl="$(label || true)"
            [ -n "$lbl" ] || return 1
            launchctl list "$lbl" 2>/dev/null | awk -F'= ' '/"PID"/ {gsub(/[^0-9]/, "", $2); print $2}'
          }
          # Brew's own state, read through the product's parser: brew colours
          # the Status column and the escapes survive a pipe, so a raw
          # comparison against `none` passes in exactly the state it exists to
          # catch (D-032(f)).
          cat > "$RUNNER_TEMP/brew_state.py" <<'PY'
          import subprocess
          import sys

          from nyxgpt import brew_services

          out = subprocess.run(
              ["brew", "services", "list"], capture_output=True, text=True, check=True
          ).stdout
          print(brew_services.parse_services_list(out).get(sys.argv[1], "<absent>"))
          PY
          brew_state() { "$PY" "$RUNNER_TEMP/brew_state.py" "$KEG_NAME"; }

          up() {  # up <seconds> -- is the api answering?
            local deadline=$(( SECONDS + $1 ))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if curl -fsS --max-time 5 "$API/health" >/dev/null 2>&1; then return 0; fi
              sleep 2
            done
            return 1
          }
          down() {  # down <seconds> -- has the api stopped answering?
            local deadline=$(( SECONDS + $1 ))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if ! curl -fsS --max-time 5 "$API/health" >/dev/null 2>&1; then return 0; fi
              sleep 2
            done
            return 1
          }
          err_log() {
            echo "--- nyxgpt-api.err.log (tail) ---"
            tail -40 "$(brew --prefix)/var/log/nyxgpt-api.err.log" 2>/dev/null || true
            echo "--- brew services list ---"
            brew services list || true
            echo "--- launchctl ---"
            launchctl list | grep -i nyxgpt || echo "(no nyxgpt job loaded)"
          }
          # One pending `api` key, written by the product's own writer rather
          # than by hand -- `mark_pending` is what the Configuration Wizard
          # calls, and the state file is the documented cross-process contract
          # (`restart_state`). The api re-reads it per request, so no restart
          # is needed for it to see this.
          cat > "$RUNNER_TEMP/pend.py" <<'PY'
          """Raise one pending `api` restart, the way a wizard save does."""
          import json

          from nyxgpt import restart_state

          restart_state.mark_pending("api", {"rate_limit.enabled": "false"})
          print("pending:", json.dumps(restart_state.snapshot()))
          PY
          pend() { "$PY" "$RUNNER_TEMP/pend.py"; }

          start_api() {
            brew services start "$SPEC" 2>&1 | tail -5
            up 180 || {
              echo "::error::the api keg did not answer $API/health after brew services start"
              err_log; exit 1
            }
            PLIST="$(plist_path || true)"
            test -n "$PLIST" || {
              echo "::error::the api is answering but launchd has no plist for $KEG_NAME --"
              echo "::error::nothing below could measure a registration"
              err_log; exit 1
            }
            echo "api up: pid=$(api_pid) label=$(label) state=$(brew_state) plist=$PLIST"
          }

          # Non-vacuity, before anything is measured: if brew cannot run a
          # service for this keg at all, neither half below is about anything.
          echo "=== bring the candidate's api service up under launchd ==="
          start_api

          echo
          echo "=== half one: the pre-#4043 keg -- the restart handed to a doomed child ==="
          python3 - "$SH" <<'INJECT'
          import sys

          # Built line by line rather than as a triple-quoted block: every
          # line of a YAML `run: |` scalar must carry at least the block's own
          # indentation, and a literal copy of this (Python-indented) source
          # would dedent below it and break the workflow file itself.
          HANDOFF = "\n".join(
              [
                  "    if _is_macos():",
                  "        handed_off = kickstart_brew_service(name)",
                  "        if handed_off is not None:",
                  "            return handed_off",
                  "",
              ]
          )
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          if HANDOFF not in text:
              sys.exit(
                  f"::error::{path} does not carry #4043's launchd hand-off; the injection is a "
                  "no-op and half one would pass by looking like half two"
              )
          open(path, "w", encoding="utf-8").write(text.replace(HANDOFF, "", 1))
          print(f"reverted the hand-off in {path} -- this keg now restarts via brew services")
          INJECT
          # The running api already imported the module, so it has to be
          # replaced by a process that is NOT inside the job (this shell is a
          # child of the runner, which is the whole difference being measured).
          brew services restart "$SPEC" 2>&1 | tail -5
          up 180 || { echo "::error::the api did not come back after the injection"; err_log; exit 1; }
          PID_BEFORE="$(api_pid)"
          pend
          echo "pre-fix api pid=$PID_BEFORE state=$(brew_state)"
          CODE="$(curl -s -o "$RUNNER_TEMP/pre.json" -w '%{http_code}' --max-time 20 \
            -X POST -H 'Content-Type: application/json' -d '{"target":"api"}' \
            "$API/api/v1/infra/restart-required" || true)"
          echo "POST /infra/restart-required -> $CODE $(cat "$RUNNER_TEMP/pre.json" 2>/dev/null || true)"
          test "$CODE" = "200" || {
            echo "::error::the endpoint did not accept the restart request (got $CODE)"
            err_log; exit 1
          }
          down 60 || {
            echo "::error::the pre-fix keg never even stopped the api -- this is not"
            echo "::error::reproducing #4043, so half two would prove nothing"
            err_log; exit 1
          }
          echo "the api stopped. the question is whether anything starts it again."
          if up 120; then
            echo "::error::the api came back on the PRE-FIX keg, so this runner does not"
            echo "::error::reproduce #4043 and half two below would prove nothing. Expected:"
            echo "::error::launchd boots the job out, taking the 'brew services restart' child"
            echo "::error::with it, and nothing performs the start half."
            err_log
            exit 1
          fi
          STATE_PRE="$(brew_state)"
          PLIST_PRE=absent
          if plist_path >/dev/null; then PLIST_PRE=present; fi
          echo "reproduced: api down, brew state='$STATE_PRE', plist=$PLIST_PRE"
          err_log
          # The owner's exact readings, asserted rather than just printed: the
          # boot-out de-registers the job, which is what removes the formula's
          # own `keep_alive true` safety net along with it.
          test "$PLIST_PRE" = absent || {
            echo "::error::the api is down but the job is still registered -- that is not"
            echo "::error::the failure #4043 describes (service left 'none'/unloaded), so the"
            echo "::error::mechanism here is something else"
            exit 1
          }

          echo
          echo "=== half two: the shipped keg -- the restart handed to launchd ==="
          cp "$RUNNER_TEMP/self_heal.shipped.py" "$SH"
          start_api
          PID_BEFORE="$(api_pid)"
          pend
          echo "shipped api pid=$PID_BEFORE state=$(brew_state)"
          CODE="$(curl -s -o "$RUNNER_TEMP/post.json" -w '%{http_code}' --max-time 20 \
            -X POST -H 'Content-Type: application/json' -d '{"target":"api"}' \
            "$API/api/v1/infra/restart-required" || true)"
          echo "POST /infra/restart-required -> $CODE $(cat "$RUNNER_TEMP/post.json" 2>/dev/null || true)"
          test "$CODE" = "200" || {
            echo "::error::the endpoint did not accept the restart request (got $CODE)"
            err_log; exit 1
          }
          # AC1: the api answers again, with no CLI intervention. Nothing
          # between here and the assertion runs a `nyxgpt ops` or `brew`
          # command -- that is the point.
          up 180 || {
            echo "::error::the api did not answer again after the restart it was asked for -- #4043 is NOT fixed"
            err_log
            exit 1
          }
          PID_AFTER="$(api_pid)"
          STATE_AFTER="$(brew_state)"
          PLIST_AFTER="$(plist_path || true)"
          echo "after: pid=$PID_AFTER (was $PID_BEFORE) state=$STATE_AFTER plist=${PLIST_AFTER:-absent}"
          err_log
          fail=0
          # A restart, not a survival: an api that merely never went down
          # would answer /health throughout and prove nothing.
          if [ -z "$PID_AFTER" ] || [ "$PID_AFTER" = "$PID_BEFORE" ]; then
            echo "::error::the api's pid did not change ($PID_BEFORE -> ${PID_AFTER:-<none>})"
            echo "::error::-- it answered without having restarted"
            fail=1
          fi
          # AC3: brew reports it started and launchd holds the job.
          if [ "$STATE_AFTER" = none ] || [ "$STATE_AFTER" = "<absent>" ]; then
            echo "::error::brew reports $KEG_NAME as '$STATE_AFTER' after the restart"
            fail=1
          fi
          if [ -z "$PLIST_AFTER" ]; then
            echo "::error::launchd has no plist for $KEG_NAME after the restart -- the job"
            echo "::error::was de-registered, which is what left the owner's machine"
            echo "::error::unrecoverable (D-032(d))"
            fail=1
          fi
          # AC2 and AC4: the notice retires itself, and stays retired on a
          # fresh read -- `restart_state.clear_started`, called by the process
          # that came back, is the only actor that can report a self-restart.
          # `attempts` must not carry a failure for `api` either: a refusal
          # and a success were indistinguishable before #4043's first round,
          # and a stale `failed` here would be the same defect inverted.
          curl -fsS --max-time 10 "$API/api/v1/infra/restart-status" > "$RUNNER_TEMP/status.json"
          cat "$RUNNER_TEMP/status.json"; echo
          "$PY" - "$RUNNER_TEMP/status.json" <<'PY' || fail=1
          import json
          import sys

          status = json.load(open(sys.argv[1], encoding="utf-8"))
          problems = []
          if "api" in status.get("pending", {}):
              problems.append(
                  "the pending-restart notice is still raised for `api` after a restart that "
                  f"worked: {status['pending']['api']}"
              )
          attempt = status.get("attempts", {}).get("api")
          if attempt and attempt.get("status") == "failed":
              problems.append(f"a failed attempt is recorded for `api`: {attempt}")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY
          [ "$fail" -eq 0 ] || exit 1
          echo "good: the api restarted itself, came back under a new pid, stayed"
          echo "      registered, and retired its own notice"

          # Leave the machine as the steps below expect it: no listener on
          # :8000 and no service registered. The teardown step further down
          # registers the services it tears down from a clean slate, and
          # `brew services stop` de-registers (D-032(d)) -- checked rather
          # than assumed, since this step started a service the earlier ones
          # did not.
          brew services stop "$SPEC" 2>&1 | tail -5 || true
          ! plist_path >/dev/null || {
            echo "::error::$KEG_NAME is still registered with launchd after 'brew services"
            echo "::error::stop' -- this step has left a service behind for the steps below"
            echo "::error::(D-032(d))"
            exit 1
          }

      - name: "Stop: prove `nyxgpt ops stop ollama-logs` boots out the ollama log watcher"
        # Executed evidence for #4033. The owner found `follow-ollama-logs.sh`
        # and its `tail -F` still running with no `nyxgpt` command able to stop
        # them: ops had `_stop_native_log_follower("ollama-logs")` wired to the
        # right label and nothing called it, so `launchctl bootout` was the
        # supported path. Inspection cannot see an argparse `choices` list
        # rejecting a target, and it cannot see whether `bootout` actually
        # unloaded the agent -- only running it can.
        #
        # Fault injection, same shape as the #3859 step below, because "it is
        # stopped afterwards" is worthless without "it was running before":
        #
        #   1. inject and bootstrap a `com.nyxgpt.ollama-logs` agent, and
        #      assert launchd really has it loaded
        #   2. `nyxgpt ops stop ollama-logs` -- assert it exits 0 (the
        #      pre-fix binary exits 2 here with an argparse "invalid choice"
        #      error, which is the defect) and that the job is gone
        #   3. the cassandra follower, injected alongside, must still be
        #      loaded: a single named target stops one agent, not both
        #   4. re-inject and prove `stop all` takes the ollama follower too,
        #      which is the other half `all` did not cover
        run: |
          set -euo pipefail
          LA="$HOME/Library/LaunchAgents"
          mkdir -p "$LA"

          inject() {
            cat > "$LA/$1.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key><string>$1</string>
            <key>ProgramArguments</key>
            <array><string>/bin/bash</string><string>-lc</string><string>sleep 3600</string></array>
            <key>RunAtLoad</key><true/>
          </dict>
          </plist>
          PLIST
            launchctl bootstrap "gui/$(id -u)" "$LA/$1.plist" 2>/dev/null || true
          }
          loaded() { launchctl list 2>/dev/null | grep -q "$1"; }

          echo "=== inject both log followers ==="
          inject com.nyxgpt.cassandra-logs
          inject com.nyxgpt.ollama-logs

          # A runner whose launchd session is not a `gui` domain cannot load
          # an agent at all. Skip rather than pass vacuously -- a green tick
          # that proved nothing is worse than an honest skip.
          if ! loaded com.nyxgpt.ollama-logs; then
            echo "::warning::launchd would not bootstrap into gui/$(id -u); \
          skipping the runtime half (the argparse half is asserted below)"
            nyxgpt ops stop ollama-logs --quiet
            echo "good: 'ops stop ollama-logs' is an accepted target (exit 0)"
            exit 0
          fi
          echo "good: com.nyxgpt.ollama-logs is loaded -- there is something to stop"

          echo "=== the wrapped stop ==="
          nyxgpt ops stop ollama-logs --quiet
          if loaded com.nyxgpt.ollama-logs; then
            launchctl list | grep -i nyxgpt || true
            echo "::error::com.nyxgpt.ollama-logs survived 'nyxgpt ops stop ollama-logs' (#4033)"
            exit 1
          fi
          echo "good: the ollama log watcher is unloaded"

          if ! loaded com.nyxgpt.cassandra-logs; then
            echo "::error::stopping ollama-logs also stopped cassandra-logs -- \
          a named target must stop exactly one agent"
            exit 1
          fi
          echo "good: cassandra-logs untouched by a named ollama-logs stop"

          echo "=== and 'all', which did not cover it either ==="
          inject com.nyxgpt.ollama-logs
          loaded com.nyxgpt.ollama-logs \
            || { echo "::error::re-injection failed -- the check below is vacuous"; exit 1; }
          nyxgpt ops stop --quiet || true
          if loaded com.nyxgpt.ollama-logs; then
            echo "::error::com.nyxgpt.ollama-logs survived 'nyxgpt ops stop all' (#4033)"
            exit 1
          fi
          echo "good: 'stop all' covers every log follower"

      - name: "Teardown: prove the wrapped uninstall clears what `brew uninstall` cannot"
        # #3859. The owner ran `brew uninstall` on both candidate formulas and
        # then `brew untap`, and was left with api and web still serving on
        # :8000/:3000 out of deleted kegs, three `com.nyxgpt.*` agents still
        # loaded (one at PID 58068), five plists still in ~/Library/LaunchAgents
        # -- and, the tap being gone, no formula name left to hand
        # `brew services stop`. Homebrew has no uninstall hook, so nothing in a
        # `brew uninstall` could ever have cleaned that up.
        #
        # The condition is *injected* rather than waited for: this job installs
        # a keg, it does not run `nyxgpt ops install`, so the three agents that
        # outlived the owner's uninstall would not otherwise exist here and the
        # step would be green on a machine that never reproduced the bug --
        # exactly how rc5 passed CI and died on the owner's Mac (#3753).
        #
        # Both halves are proven in one run, because "it is clean afterwards"
        # is worthless without "it was dirty before" and "the command we had
        # before this fix does not clean it":
        #
        #   1. inject the agents, and assert they are really there
        #   2. `nyxgpt ops down` -- the supported stop that existed before this
        #      issue -- and assert the plists SURVIVE it. That is the defect,
        #      reproduced. `down` stops a stack and leaves it installed by
        #      design, which is why it was never the missing command.
        #   3. `nyxgpt ops uninstall` -- and assert nothing is left loaded or
        #      registered.
        #   4. `brew uninstall` + `brew untap` afterwards, then the same
        #      residue check, since the ordering the caveats prescribe has to
        #      survive the removal it precedes.
        run: |
          set -euo pipefail
          LA="$HOME/Library/LaunchAgents"
          mkdir -p "$LA"

          # One function, used for the negative control and the real
          # assertion alike: a residue check re-typed per call site proves
          # nothing about the one that matters.
          nyxgpt_plists() {
            find "$LA" -maxdepth 1 -iname '*nyxgpt*' 2>/dev/null || true
          }
          nyxgpt_jobs() {
            launchctl list 2>/dev/null | grep -i nyxgpt || true
          }

          echo "=== inject the agents nyxgpt ops install writes, and brew never knew about ==="
          for label in com.nyxgpt.cassandra-logs com.nyxgpt.ollama-logs com.nyxgpt.ollama-env; do
            cat > "$LA/$label.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key><string>$label</string>
            <key>ProgramArguments</key>
            <array><string>/bin/bash</string><string>-lc</string><string>sleep 3600</string></array>
            <key>RunAtLoad</key><true/>
          </dict>
          </plist>
          PLIST
            # Tolerated: a hosted runner's launchd session is not always a
            # `gui` domain. The plist on disk is the half that matters -- it is
            # what reloads at the next login, and what nothing removed.
            launchctl bootstrap "gui/$(id -u)" "$LA/$label.plist" 2>/dev/null || true
          done
          # And the Homebrew-managed half: the population that held :8000 on
          # the owner's Mac after its keg was deleted. Tolerated, because a
          # runner that cannot start a brew service still exercises everything
          # above -- but when it can, this is the real thing rather than a
          # simulation of it.
          brew services start nyxgpt-api@3.0.0rc 2>&1 | tail -5 || true

          echo "--- injected ---"
          nyxgpt_plists
          test -n "$(nyxgpt_plists)" \
            || { echo "::error::injection failed -- the rest of this step would be vacuous"; exit 1; }

          echo "=== negative control: the command that existed before #3859 ==="
          nyxgpt ops down --quiet || true
          if [ -z "$(nyxgpt_plists)" ]; then
            echo "::error::ops down already removed the agents -- this check tests nothing"
            exit 1
          fi
          echo "good: the plists survive 'nyxgpt ops down', which is the defect"

          echo "=== the wrapped teardown ==="
          nyxgpt ops uninstall --quiet
          LEFT="$(nyxgpt_plists)"
          if [ -n "$LEFT" ]; then
            echo "$LEFT"
            echo "::error::nyxgpt plists remain in ~/Library/LaunchAgents after the teardown"
            exit 1
          fi
          JOBS="$(nyxgpt_jobs)"
          if [ -n "$JOBS" ]; then
            echo "$JOBS"
            echo "::error::a nyxgpt launchd job is still loaded after the teardown"
            exit 1
          fi
          echo "good: nothing loaded, nothing registered"

          echo "=== and the removal the teardown precedes ==="
          for formula in $(brew list --formula | grep -i '^nyxgpt' || true); do
            brew uninstall --force "$formula" 2>&1 | tail -5
          done
          brew untap nyxgpt/brew-smoke 2>&1 | tail -5 || true
          LEFT="$(nyxgpt_plists)"
          JOBS="$(nyxgpt_jobs)"
          if [ -n "$LEFT$JOBS" ]; then
            echo "$LEFT"
            echo "$JOBS"
            echo "::error::residue after teardown + brew uninstall + brew untap (#3859)"
            exit 1
          fi
          echo "clean: no nyxgpt plist, no nyxgpt launchd job"

      - name: Install logs on failure
        if: failure()
        run: |
          for log in ~/Library/Logs/Homebrew/nyxgpt-api@3.0.0rc/*; do
            echo "--- $log ---"
            cat "$log" || true
          done

  stable-over-candidate:
    name: Install the candidate onto a machine that already has the stable
    # The counterpart-present case (#3860). `keg-install`'s throwaway tap
    # carries no stable formula on purpose, so the only `conflicts_with` shape
    # under test there is the one where the named formula is absent -- benign,
    # and not the case the owner hit. Both channels are built from this
    # checkout, so this needs no publish and runs on every formula PR.
    if: ${{ github.event_name == 'pull_request' || inputs.run_keg_install }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the formula's declared Python dependency
        run: brew install python@3.12

      - name: Build both channels from this checkout
        run: |
          set -euo pipefail
          # A release version on the stable channel (the script's own guardrail
          # refuses a pre-release there) and the matching candidate on the rc
          # channel, so the rc formula's `conflicts_with "nyxgpt-api"` names a
          # formula that is really in the tap.
          python scripts/build_homebrew_artifacts.py 3.0.0 dist/stable \
            "file://${PWD}/dist/stable/dist"

          python scripts/build_homebrew_artifacts.py 3.0.0rc0 dist/rc \
            "file://${PWD}/dist/rc/dist" --channel rc

          # Each tarball has to DECLARE the version it is named for, because
          # `nyxgpt.ops._native_service_version` reads exactly that metadata
          # out of the installed keg to decide which channel's formula an
          # artifact install resolves (`_remote_tap_formula`) -- and the
          # identity step below asks each keg, from inside its own venv, which
          # channel it is in. An rc keg declaring the stable version would make
          # that step detect "stable" while sitting in the candidate's own keg,
          # measuring the same channel twice and reading as two.
          #
          # The stamp is the BUILDER's since #3850:
          # `release_tarball._vendor_pyproject` pins the version it was asked
          # for into the vendored copy, so both builds above declare correctly
          # no matter what this checkout says, and no step here mutates the
          # checkout. Until that fix the tarball vendored `pyproject.toml`
          # as-is, and this step carried a trap-guarded mutation of the
          # checkout to work around it; the workaround is retired with the
          # defect it worked around, and what is checked here now is the
          # builder's own stamp on the two tarballs this runner just built.
          # `awk` printing nothing fails the comparison, so a tarball with no
          # version line cannot pass this quietly.
          declared_version() {
            tar -xzOf "$1/dist/nyxgpt-api-$2.tar.gz" "nyxgpt-api-$2/pyproject.toml" \
              | awk -F'"' '/^version =/{print $2; exit}'
          }
          for want in 3.0.0:dist/stable 3.0.0rc0:dist/rc; do
            VERSION="${want%%:*}"
            DIR="${want##*:}"
            DECLARED="$(declared_version "$DIR" "$VERSION")"
            echo "${DIR}: the vendored pyproject.toml declares '${DECLARED}'"
            test "$DECLARED" = "$VERSION" || {
              echo "a keg built from this tarball would report '${DECLARED}',"
              echo "and resolve the channel that version names, not ${VERSION}'s."
              echo "::error::the ${VERSION} tarball declares '${DECLARED}' (#3850)"
              exit 1
            }
          done

          ls -1 dist/stable/*.rb dist/rc/*.rb

      - name: Create a tap carrying both channels
        run: |
          set -euo pipefail
          brew tap-new nyxgpt/both-channels --no-git 2>/dev/null || brew tap-new nyxgpt/both-channels
          TAP_DIR="$(brew --repository nyxgpt/both-channels)"
          mkdir -p "$TAP_DIR/Formula"
          # api only: the web formula's keg is a full Next.js build and adds
          # nothing to what this job asks, which is what Homebrew does with two
          # formulas that declare a conflict.
          cp dist/stable/nyxgpt-api.rb "$TAP_DIR/Formula/"
          cp dist/rc/nyxgpt-api@3.0.0rc.rb "$TAP_DIR/Formula/"
          ls -1 "$TAP_DIR/Formula/"
          grep -n 'conflicts_with' "$TAP_DIR/Formula/nyxgpt-api@3.0.0rc.rb"

          # Trust the WHOLE tap, for the reason #3770 established and this job
          # reproduced (run 32202247518): brew implicitly trusts the formula
          # named on the command line, but installing `nyxgpt-api@3.0.0rc`
          # makes it resolve `conflicts_with "nyxgpt-api"`, which *loads* the
          # stable formula -- and a `brew tap-new` tap is untrusted, so that
          # load is refused with "Refusing to load formula ... from untrusted
          # tap". Untrusted, this job measures the tap-trust gate instead of
          # `conflicts_with`, which is the only thing it exists to measure.
          # Two spellings because the subcommand is not the same on every
          # Homebrew (the same pair the published-tap job uses); a Homebrew
          # with neither has nothing to trust.
          brew tap-trust nyxgpt/both-channels || brew trust nyxgpt/both-channels \
            || echo "::warning::neither 'brew tap-trust' nor 'brew trust' accepted the tap -- proceeding untrusted"

      - name: Install the stable, then the candidate on top of it
        run: |
          set -uo pipefail

          brew install --verbose nyxgpt/both-channels/nyxgpt-api 2>&1 | tail -40
          command -v nyxgpt || { echo "::error::the stable keg leaves no nyxgpt on PATH"; exit 1; }
          nyxgpt --version

          echo "=== brew install <candidate> with the stable already installed ==="
          # A refusal is a legitimate outcome here (it is what `conflicts_with`
          # promises), and the assertion below is about the *state the machine
          # is left in*, not this exit code. Omitting `set -e` is not enough to
          # say that: Actions runs a `run:` body with no `shell:` key as
          # `/bin/bash -e {0}`, so errexit arrives already on and `set -uo
          # pipefail` does not clear it. Before this, a refusal aborted the step
          # here -- the job was red exactly when `conflicts_with` worked, and
          # candidate.log, the one artifact saying why, was never printed
          # (run 32200501142). Capture the code in a `||` list, which errexit
          # does not act on, rather than trying to switch errexit off.
          rc=0
          brew install --verbose nyxgpt/both-channels/nyxgpt-api@3.0.0rc > candidate.log 2>&1 || rc=$?
          echo "candidate install exited $rc"
          tail -40 candidate.log

          stable_installed=0
          candidate_installed=0
          brew list --versions nyxgpt-api > /dev/null 2>&1 && stable_installed=1
          brew list --versions nyxgpt-api@3.0.0rc > /dev/null 2>&1 && candidate_installed=1
          echo "stable installed: $stable_installed / candidate installed: $candidate_installed"
          brew list --versions | grep -i nyxgpt || true

          if [ "$stable_installed" = "1" ] && [ "$candidate_installed" = "1" ]; then
            echo "Both channels are installed at once. The candidate formula declares"
            echo "conflicts_with \"nyxgpt-api\" precisely so this state cannot exist, and"
            echo "this is the state the owner's Mac was in: two kegs, one CLI name, and a"
            echo "health probe looking for a service name only one of them registers."
            echo "::error::stable and candidate are installed simultaneously despite conflicts_with (#3853)"
            exit 1
          fi

          # A refusal only counts as `conflicts_with` holding if brew refused
          # FOR THAT REASON. An untrusted tap refuses too ("Refusing to load
          # formula ... from untrusted tap", #3770's shape, which this job hit
          # in run 32202247518), and a refusal to load is indistinguishable
          # from a refusal to conflict when all you look at is "the candidate
          # is not installed". Homebrew's wording here is verified, not
          # guessed: run 32204454740 logged
          # `Cannot install nyxgpt/both-channels/nyxgpt-api@3.0.0rc because
          # conflicting formulae are installed.`
          if [ "$candidate_installed" = "0" ]; then
            grep -qi 'conflicting formulae are installed' candidate.log || {
              echo "::error::the candidate was refused, but not for conflicts_with -- brew gave some other reason (see candidate.log above); this job is measuring something other than the conflict"
              exit 1
            }
            echo "refused for the declared conflict, which is conflicts_with working"
          fi

          # Whatever Homebrew chose, the machine has to be left usable: a
          # dangling `nyxgpt` after a refused install is the #3850 shape again.
          command -v nyxgpt || { echo "::error::no nyxgpt on PATH after the candidate install attempt"; exit 1; }
          nyxgpt --version || { echo "::error::nyxgpt is on PATH but does not run after the candidate install attempt"; exit 1; }

      - name: "Control: the same candidate installs once the stable is gone"
        # Without this, a candidate that simply fails to build would pass the
        # step above and read as "conflicts_with held".
        run: |
          set -euo pipefail
          brew uninstall nyxgpt-api 2>&1 | tail -20 || true
          brew install --verbose nyxgpt/both-channels/nyxgpt-api@3.0.0rc 2>&1 | tail -40
          brew list --versions nyxgpt-api@3.0.0rc
          command -v nyxgpt
          nyxgpt --version

      - name: "Self-heal can restart the candidate's own service (#4043)"
        # Executed evidence for #4043, on the machine state the step above
        # just reached rather than in a second job: the candidate keg
        # installed alone, on a real Homebrew, registering its service under
        # the versioned formula name. That is the exact state the defect
        # needs and the one no other job leaves behind.
        #
        # The question: the injection barrier every self-heal service name
        # passes through had no `@`, so `brew_services.resolve` correctly
        # resolved `api` to `nyxgpt-api@3.0.0rc` and `_restart_brew_service`
        # then refused it as an invalid name -- the watchdog could not heal
        # `api` or `web` on any rc install, which is the channel release
        # candidates are accepted on. Unit tests pin the pattern; they cannot
        # say that the name brew actually registers is the name the product
        # resolves, nor that brew accepts the command that follows.
        #
        # Both halves are proved, in that order, because a job that only runs
        # the fixed code is green on every machine that fails to reproduce
        # the bug (the rc5 lesson, #3753): the keg's own copies of the two
        # files are first reverted to the pre-fix pattern and the refusal is
        # measured, then restored and the restart is measured. The injection
        # edits the installed keg, never the checkout, and asserts the sed
        # actually landed -- a no-op sed would make the first half pass by
        # looking like the second.
        run: |
          set -euo pipefail

          KEG=nyxgpt-api@3.0.0rc
          PY="$(brew --prefix "$KEG" 2>/dev/null)/libexec/venv/bin/python3"
          if [ ! -x "$PY" ]; then
            PY="$(ls -d "$(brew --cellar "$KEG")"/*/libexec/venv/bin/python3 2>/dev/null | tail -1)"
          fi
          test -n "$PY" && test -x "$PY" || { echo "::error::no venv python in $KEG"; exit 1; }
          echo "driver: $PY"

          echo "=== what brew itself registers for the candidate ==="
          brew services list
          # Non-vacuity: if brew does not list the versioned name, the product
          # never resolves to it and neither half below is about anything.
          brew services list | grep -q "$KEG" || {
            echo "::error::brew does not register a service for $KEG -- nothing here resolves to a versioned name, so this step is measuring nothing"
            exit 1
          }

          BS="$("$PY" -c 'import nyxgpt.brew_services as m; print(m.__file__)')"
          SH="$("$PY" -c 'import nyxgpt.self_heal as m; print(m.__file__)')"
          echo "keg modules: $BS / $SH"
          cp "$BS" /tmp/brew_services.shipped.py
          cp "$SH" /tmp/self_heal.shipped.py
          # The keg carries compiled bytecode from its install. Rewriting a
          # .py updates its mtime, which invalidates the cached .pyc, but
          # nothing here should add new ones either.
          export PYTHONDONTWRITEBYTECODE=1

          cat > /tmp/heal_driver.py <<'PY'
          """Resolve `api` the way the watchdog does, then restart it."""
          import json
          import sys

          from nyxgpt import brew_services, self_heal

          snapshot = self_heal._brew_services_snapshot()
          resolved = brew_services.resolve("api", "nyxgpt-api", snapshot)
          result = self_heal.restart_native_component("api")
          print(
              json.dumps(
                  {
                      "pattern": brew_services.SEGMENT_PATTERN
                      if hasattr(brew_services, "SEGMENT_PATTERN")
                      else "(pre-#4043: no SEGMENT_PATTERN)",
                      "resolved": resolved,
                      "ok": result.ok,
                      "message": result.message,
                      "details": result.details,
                  }
              ),
              file=sys.stderr,
          )
          print(json.dumps({"resolved": resolved, "ok": result.ok, "message": result.message}))
          PY

          cat > /tmp/brew_state.py <<'PY'
          """Brew's own state for one service, read the way the product reads it.

          NEVER compare the Status column as a raw string here. D-032(f)
          measured, in this same workflow, that `brew services list` colours
          its Status tokens and that the escapes survive a pipe -- `ESC[39mnone
          ESC[0m` through `cat -v` (run 32233162053) and `ESC[31merror` through
          `awk` (run 32228088507). A coloured `none` compares unequal to
          `"none"`, so a literal `[ "$STATE" != "none" ]` passes in exactly the
          state it exists to catch. `brew_services.parse_services_list` strips
          the escapes and is the one chokepoint every state read in the product
          goes through, so this step reads through it too.
          """
          import subprocess
          import sys

          from nyxgpt import brew_services

          out = subprocess.run(
              ["brew", "services", "list"], capture_output=True, text=True, check=True
          ).stdout
          print(brew_services.parse_services_list(out).get(sys.argv[1], "<absent>"))
          PY

          # Registration is a launchd fact, not a state word: D-032(d). The
          # plist is the file launchd reloads at the next login, and it is what
          # `registered()` in the #3861 step below asserts on for the same
          # reason. Both signals are captured before the restart as well as
          # after, so a guard that cannot move is visible as one instead of
          # passing as evidence.
          # BOTH of Homebrew's label schemes, because this step measured the
          # wrong one and failed a restart that worked: run 36996645910 logged
          # `brew services list` reporting the keg `started` with
          # `~/Library/LaunchAgents/sh.brew.nyxgpt-api@3.0.0rc.plist`, while
          # this assertion looked only for `homebrew.mxcl.` and reported
          # "launchd has no plist ... nothing was restarted". Homebrew renamed
          # its service labels from `homebrew.mxcl.<formula>` to
          # `sh.brew.<formula>`; `brew_services.LAUNCHD_LABEL_PREFIXES` is the
          # product's copy of this same list (aliased by `ops.py`, and read by
          # `self_heal.py` since #4043), and the registration is a plist under
          # EITHER (D-032(d)).
          plist_path() {
            local svc="$1" prefix
            for prefix in homebrew.mxcl. sh.brew.; do
              if [ -e "$HOME/Library/LaunchAgents/${prefix}${svc}.plist" ]; then
                printf '%s' "$HOME/Library/LaunchAgents/${prefix}${svc}.plist"
                return 0
              fi
            done
            return 1
          }

          echo
          echo "=== half one: the pre-#4043 barrier, injected into the installed keg ==="
          python3 - "$BS" "$SH" <<'INJECT'
          import sys

          WIDE = r"[A-Za-z0-9][A-Za-z0-9._-]*(?:@[A-Za-z0-9][A-Za-z0-9._-]*)?"
          NARROW = r"[A-Za-z0-9][A-Za-z0-9._-]*"
          touched = 0
          for path in sys.argv[1:]:
              text = open(path, encoding="utf-8").read()
              if WIDE not in text:
                  sys.exit(f"::error::{path} does not carry the #4043 pattern; the injection is a no-op")
              open(path, "w", encoding="utf-8").write(text.replace(WIDE, NARROW))
              touched += 1
          print(f"reverted the barrier in {touched} keg module(s)")
          INJECT

          rc=0
          "$PY" /tmp/heal_driver.py > before.json || rc=$?
          echo "driver exited $rc"
          cat before.json
          reproduced=0
          python3 - <<'CHECK' || reproduced=$?
          import json
          import sys

          d = json.load(open("before.json"))
          if d["resolved"] != "nyxgpt-api@3.0.0rc":
              sys.exit(f"resolved {d['resolved']!r}, not the candidate's own service")
          if d["ok"] is not False:
              sys.exit("the pre-fix barrier restarted the service -- not reproducing #4043")
          if "invalid service name" not in d["message"]:
              sys.exit(f"refused for some other reason: {d['message']!r}")
          print("reproduced:", d["message"])
          CHECK
          if [ "$reproduced" != "0" ]; then
            echo "::error::the pre-#4043 barrier did NOT refuse the candidate's service name on this machine -- the second half below would prove nothing"
            exit 1
          fi
          # It refused, so it cannot have run a brew command: the service must
          # still be exactly as brew left it after the install.
          brew services list | grep "$KEG"

          echo
          echo "=== half two: the shipped barrier ==="
          cp /tmp/brew_services.shipped.py "$BS"
          cp /tmp/self_heal.shipped.py "$SH"
          # What brew reports for the keg BEFORE the restart. The injection
          # above never touched `parse_services_list`, so this reads the same
          # way either side of the restore.
          STATE_BEFORE="$("$PY" /tmp/brew_state.py "$KEG")"
          # `if`, not `test ... && VAR=`: under `set -e` a failing left-hand
          # side of an `&&` list aborts the step.
          PLIST_BEFORE=absent
          if plist_path "$KEG" >/dev/null; then PLIST_BEFORE=present; fi
          echo "before the restart: state=$STATE_BEFORE plist=$PLIST_BEFORE"
          "$PY" /tmp/heal_driver.py > after.json
          cat after.json
          brew services list
          python3 - <<'CHECK'
          import json
          import sys

          d = json.load(open("after.json"))
          if d["resolved"] != "nyxgpt-api@3.0.0rc":
              sys.exit(f"resolved {d['resolved']!r}")
          if "invalid service name" in d["message"]:
              sys.exit(f"still refused with the fix in place: {d['message']!r}")
          if d["ok"] is not True:
              sys.exit(f"self-heal could not restart the candidate service: {d['message']!r}")
          print("restarted:", d["message"])
          CHECK
          # brew has to have acted, not just been asked: a formula it knows
          # about with no service loaded reads `none` and has no plist, so both
          # signals have to have moved.
          STATE_AFTER="$("$PY" /tmp/brew_state.py "$KEG")"
          PLIST_AFTER=absent
          PLIST_AFTER_PATH="$(plist_path "$KEG" || true)"
          if [ -n "$PLIST_AFTER_PATH" ]; then PLIST_AFTER=present; fi
          echo "after the restart:  state=$STATE_AFTER plist=$PLIST_AFTER ${PLIST_AFTER_PATH}"
          # Non-vacuity of the two assertions below, which is the whole point
          # of capturing the before: if the keg was ALREADY registered and
          # already off `none` before the restart, neither of them can fail and
          # they say nothing about whether this restart did anything. Say so
          # rather than letting the step pass as evidence it is not.
          if [ "$PLIST_BEFORE" = present ] && [ "$STATE_BEFORE" != none ]; then
            echo "::error::brew already reported $KEG as registered ($PLIST_BEFORE) and '$STATE_BEFORE' BEFORE the restart -- the assertions below cannot fail, so this half proves nothing; find what started the service earlier in the job"
            exit 1
          fi
          test "$PLIST_AFTER" = present || {
            echo "::error::self-heal reported a successful restart but launchd has no plist for $KEG -- nothing is registered, so nothing was restarted (D-032(d): the plist is the registration, not the Status column)"
            exit 1
          }
          [ "$STATE_AFTER" != none ] && [ "$STATE_AFTER" != "<absent>" ] || {
            echo "::error::self-heal reported a successful restart but brew still reports $KEG as '$STATE_AFTER'"
            exit 1
          }

          # Leave the machine as the next step expects it: a running service
          # on :8000 is not what "install the stable onto an installed
          # candidate" is measuring. The candidate reached this step
          # registered-never-started (asserted above), and `brew services stop`
          # de-registers (D-032(d)), so check that it did rather than assuming
          # it -- this step now mutates state the steps below read, and the
          # #3861 step registers both service sets from a clean slate.
          brew services stop "$KEG" 2>&1 | tail -5 || true
          ! plist_path "$KEG" >/dev/null || {
            echo "::error::$KEG is still registered with launchd after 'brew services stop' -- this step has left a service behind for the steps below (D-032(d))"
            exit 1
          }

      - name: The other direction -- the stable onto an installed candidate
        # Beyond AC4, which names only the direction above. This is the order
        # the owner actually reached #3853 by, and until that issue was fixed
        # it was the direction where "both installed" could happen: run
        # 32202943938 answered ledger Q-002 here -- `conflicts_with` is
        # directional, only the rc formula declared it, so brew built and
        # installed the stable keg to completion
        # (`/opt/homebrew/Cellar/nyxgpt-api/3.0.0: 6,140 files`) and only then
        # failed `brew link` on the symlink collision -- `Could not symlink
        # bin/nyxgpt ... is a symlink belonging to nyxgpt-api@3.0.0rc`. A failed
        # link is not a guard: the keg stayed installed, /opt/homebrew/bin/nyxgpt
        # still pointed at the candidate, and the machine ended at
        # `stable installed: 1 / candidate installed: 1`.
        #
        # THE DEBT IS PAID HERE (#3853, ledger D-026). Between PR #3925 and
        # this fix the both-installed outcome was emitted as a `::warning::`
        # naming #3853 rather than failing, because #3853 was open and its fix
        # direction was parked by Q-002 -- a gate that hard-fails on a defect
        # the project has decided not to fix yet is a permanent red that trains
        # readers to ignore it. Q-002 is answered and the packaging fix has
        # landed (`scripts/build_homebrew_artifacts.py`'s
        # `render_stable_formula` declares `conflicts_with` on the stable side
        # too), so this is a hard assertion again. Both orders are now the same
        # assertion, which is the point: a one-sided conflict guarded one
        # install order and nothing at all in the other.
        run: |
          set -uo pipefail
          # Same rc-capture as the step above, for the same reason: the default
          # shell is `/bin/bash -e {0}`, so a legitimate refusal would otherwise
          # abort the step before a single assertion ran.
          rc=0
          brew install --verbose nyxgpt/both-channels/nyxgpt-api > stable-on-top.log 2>&1 || rc=$?
          echo "stable install exited $rc"
          tail -40 stable-on-top.log

          stable_installed=0
          candidate_installed=0
          brew list --versions nyxgpt-api > /dev/null 2>&1 && stable_installed=1
          brew list --versions nyxgpt-api@3.0.0rc > /dev/null 2>&1 && candidate_installed=1
          echo "stable installed: $stable_installed / candidate installed: $candidate_installed"

          if [ "$stable_installed" = "1" ] && [ "$candidate_installed" = "1" ]; then
            echo "Both channels are installed at once, in the stable-onto-candidate order."
            echo "Since #3853 the stable formula declares conflicts_with its own line's"
            echo "candidate, so brew must refuse this. Reaching here means that declaration"
            echo "was dropped, was not stamped by build_homebrew_artifacts.py, or names a"
            echo "formula other than the one in this tap -- check the conflicts_with line in"
            echo "the stable formula printed by the tap step above."
            echo "::error::stable and candidate are installed simultaneously despite conflicts_with (#3853)"
            exit 1
          fi

          # Same discipline as the candidate-onto-stable step: a refusal only
          # counts as `conflicts_with` holding if brew refused FOR THAT REASON.
          # An untrusted tap refuses too (#3770's shape), and "the stable is not
          # installed" cannot tell those apart on its own.
          if [ "$stable_installed" = "0" ]; then
            grep -qi 'conflicting formulae are installed' stable-on-top.log || {
              echo "::error::the stable was refused, but not for conflicts_with -- brew gave some other reason (see stable-on-top.log above); this step is measuring something other than the conflict"
              exit 1
            }
            echo "refused for the declared conflict, which is conflicts_with working in the direction #3853 found unguarded"
          fi

          command -v nyxgpt || { echo "::error::no nyxgpt on PATH after the stable install attempt"; exit 1; }
          nyxgpt --version || { echo "::error::nyxgpt is on PATH but does not run after the stable install attempt"; exit 1; }

      - name: "The install-identity reconcile leaves exactly one service set (#3861)"
        # Executed evidence for #3861 (D-006), on the job #3860 already built
        # for this exact machine state rather than a second one.
        #
        # The packaging steps above answer "can two channels be installed at
        # once?" Since #3853 the answer is no, in both orders -- that is what
        # they now hard-assert. This step answers the question that survives
        # it: on a machine where two channels ARE installed, does an install
        # *reconcile* the previous one, or does it leave two `keep_alive`
        # service sets registered on ports 8000/3000 the way the owner's Mac
        # did for seven hours? Packaging cannot answer that. `conflicts_with`
        # is checked when a formula is installed, so it guards machines that
        # install *after* the declaration shipped; every machine already in
        # the bad state (the owner's, and anyone who installed before it),
        # every hand-installed keg, and the local `file://` tap path whose
        # checked-in formulas `build_homebrew_artifacts.py` never stamps, all
        # still arrive at reconcile carrying two service sets.
        #
        # So the state is STAGED here rather than reached by installing, which
        # is a deliberate change from the first version of this step: that one
        # simply relied on the stable install succeeding on top of the
        # candidate, and it did, because the one-sided declaration Q-002 found
        # left that order unguarded. #3853 has since closed it. Staging is the
        # honest shape -- this step is not measuring whether brew allows two
        # kegs (the steps above do that, and fail if it does), it is measuring
        # what `nyxgpt ops` does when it finds them.
        #
        # MEASURED, not assumed (run 32227410541): `conflicts_with` is checked
        # against the **linked** keg, not the installed one. Brew's own refusal
        # says so -- "Please `brew unlink nyxgpt-api@3.0.0rc` before
        # continuing" -- so the staging simply follows that instruction and
        # touches nothing else. It needs no edit to the tap, which matters
        # because the step after this one measures the stable formula's own
        # declaration. (The first attempt did edit it, with `sed
        # '/conflicts_with/d'`, and that broke the formula outright: the
        # declaration spans two lines and deleting the first left an orphan
        # `because:` -- "syntax errors found", same run.) It also says
        # something true about the guard: `conflicts_with` stops a second
        # *linked* install, so two kegs on one machine remain reachable and
        # reconcile remains the thing that has to handle them.
        #
        # What still needs proving is that the FIX is what removes the second
        # service set, so the driver first prints the old gate's own verdict:
        # `previous.mode != target` is `artifact != artifact`, i.e. False. The
        # pre-#3861 code could not have acted on this machine, and the step
        # fails if that stops being true (the model would then be back to
        # something a mode comparison can see, and this evidence would be
        # measuring nothing).
        #
        # Both directions run, using each keg's own venv python: the candidate
        # keg's declares 3.0.0rc0 (the builder stamps the tarball it names, and
        # the build step above asserts it) so it detects the candidate
        # channel, the stable keg's declares 3.0.0 so it detects the stable
        # one. api only, for the same reason the rest of this job is api only.
        run: |
          set -euo pipefail

          echo "=== stage the two-keg machine this step is about ==="
          # Exactly what brew's refusal above prescribes, and nothing more:
          # unlink the candidate, install the stable beside it. The tap is not
          # touched, so the measurement step after this one still reads the
          # formula `render_stable_formula` produced.
          brew unlink nyxgpt-api@3.0.0rc
          brew install --verbose nyxgpt/both-channels/nyxgpt-api > stage-stable.log 2>&1 || true
          tail -20 stage-stable.log
          brew list --versions nyxgpt-api || {
            echo "::error::could not stage the stable keg alongside the candidate even with the candidate unlinked (see stage-stable.log above) -- this step has nothing to reconcile and is measuring nothing"
            exit 1
          }
          brew list --versions nyxgpt-api@3.0.0rc || {
            echo "::error::the candidate keg is gone, so staging replaced the two-keg machine instead of creating it"
            exit 1
          }
          brew list --versions | grep -i nyxgpt || true

          reconcile_from() {
            # $1 = keg whose venv python runs the reconcile (the `nyxgpt` the
            #      operator would be invoking), $2 = the api service name the
            #      marker records as the PREVIOUS install.
            local keg="$1" previous_api="$2"
            local py prev_version prev_channel
            # The marker records what the PREVIOUS install actually was, so
            # the "Install identity changing" line the reconcile prints names a
            # transition this machine really made. Placeholders would print a
            # version move that never happened, and the log is read by people
            # diagnosing exactly this. Fall back rather than fail: the marker's
            # version is not what the retire keys on -- the service names are.
            prev_version="$(brew list --versions "$previous_api" 2>/dev/null | awk '{print $NF}' | tail -1)"
            [ -n "$prev_version" ] || prev_version="unknown"
            case "$previous_api" in
              *@*) prev_channel="candidate" ;;
              *)   prev_channel="stable" ;;
            esac
            # `brew --prefix <formula>` for a keg whose `brew link` failed
            # still resolves (the opt link is made during install, before
            # linking), but fall back to the Cellar rather than assume it:
            # the staged keg above is deliberately an unlinked one.
            py="$(brew --prefix "$keg" 2>/dev/null)/libexec/venv/bin/python3"
            if [ ! -x "$py" ]; then
              py="$(ls -d "$(brew --cellar "$keg")"/*/libexec/venv/bin/python3 2>/dev/null | tail -1)"
            fi
            test -n "$py" && test -x "$py" || { echo "::error::no venv python in $keg"; exit 1; }
            echo "reconcile driver for $keg: $py"
            NYXGPT_PREVIOUS_API="$previous_api" \
            NYXGPT_PREVIOUS_VERSION="$prev_version" \
            NYXGPT_PREVIOUS_CHANNEL="$prev_channel" "$py" - <<'PY'
          import os
          import sys

          from nyxgpt import install_mode, ops
          from nyxgpt.install_mode import INSTALL_MODE_ARTIFACT, InstallIdentity

          previous_api = os.environ["NYXGPT_PREVIOUS_API"]
          previous = InstallIdentity.build(
              mode=INSTALL_MODE_ARTIFACT,
              manager="brew",
              services={"api": previous_api},
              version=os.environ["NYXGPT_PREVIOUS_VERSION"],
              channel=os.environ["NYXGPT_PREVIOUS_CHANNEL"],
          )
          install_mode.write_install_mode(INSTALL_MODE_ARTIFACT, None, identity=previous)

          target = ops._native_install_identity(dev=False)
          print(f"previous: {previous.detail()}")
          print(f"target:   {target.detail()}")

          # Non-vacuity: the gate this change replaced compared modes, and
          # both of these ARE artifact installs. If this ever prints True the
          # step is no longer evidence of anything.
          old_gate_would_have_acted = previous.mode != target.mode
          print(f"pre-#3861 gate (previous.mode != target): {old_gate_would_have_acted}")
          if old_gate_would_have_acted:
              sys.exit("the two identities differ by MODE -- this is not the artifact-to-artifact case")

          if previous_api in target.service_names:
              sys.exit(f"{previous_api} is the target's own service -- nothing would be retired")

          results = ops._reconcile_install_mode(dev=False)
          for r in results:
              print(("ok   " if r.ok else "FAIL ") + r.message + (f" | {r.details}" if r.details else ""))
          sys.exit(0 if all(r.ok for r in results) else "a reconcile step failed")
          PY
          }

          # The registration IS the plist brew copies into
          # ~/Library/LaunchAgents: that file, not `brew services stop`'s exit
          # code and not `brew services list`'s Status column, is what launchd
          # reloads at the next login. Both of the other two signals have now
          # been measured lying here, in opposite directions:
          #
          #   - the exit code says 0 for a service it did not stop (the first
          #     version of this step trusted it, run 32222041921);
          #   - a column-based read reported a service registered whose plist
          #     was already gone and whose job was already unloaded (run
          #     32228088507 -- the reconcile's escalation found no plist to
          #     remove, and the read still listed it). The `cat -v` capture
          #     below settled why, in run 32233162053: every state token is
          #     ANSI-wrapped (`ESC[39mnoneESC[0m`), so an unstripped `none`
          #     fails `!= "none"` and reads as registered. NOT a column that
          #     outlives the registration -- the same capture shows the
          #     just-retired service reading `none` with an empty File field
          #     within the second. `brew_services.parse_services_list` strips
          #     escapes now; the column still is not asserted on here, because
          #     a state word answers "is it running" and `error`/`stopped` are
          #     states of a registered service.
          #
          # So `registered` keys on the plist, exactly as
          # `ops._brew_service_will_restart` does. `brew services list` is
          # still printed, because it is the useful thing to read in the log;
          # it is just not what anything asserts on.
          # Either label scheme counts as registered, for the reason the
          # self-heal step above records: Homebrew writes `sh.brew.<formula>`
          # now and `homebrew.mxcl.<formula>` historically, and this step's
          # whole subject is whether a plist is on disk. Checking one scheme
          # would read every registration on a current Homebrew as absent --
          # which would fail the "measuring nothing" guard below rather than
          # pass quietly, but for the wrong reason.
          any_plist() {
            local prefix
            for prefix in homebrew.mxcl. sh.brew.; do
              if [ -e "$HOME/Library/LaunchAgents/${prefix}${1}.plist" ]; then
                return 0
              fi
            done
            return 1
          }

          registered() {
            local svc
            for svc in $(brew list --formula | grep '^nyxgpt-' || true); do
              if any_plist "$svc"; then
                printf '%s ' "$svc"
              fi
            done
            echo
          }

          plist_gone() {
            ! any_plist "$1"
          }

          echo "=== register BOTH service sets: the state the owner's Mac was in ==="
          brew services start nyxgpt-api || true
          brew services start nyxgpt-api@3.0.0rc || true
          brew services list || true
          echo "brew's own view (advisory here -- an 'error' state is a crash-looping"
          echo "keg, which is the state the owner's Mac was in, but a state word says"
          echo "whether it RUNS, not whether launchd will start it again, so it is not"
          echo "what this step asserts on):"
          brew services list | awk '$1 ~ /^nyxgpt-/ {print "  " $1 " -> " $2}'
          echo "the plists, which are the registration:"
          ls -1 "$HOME/Library/LaunchAgents" | grep nyxgpt || echo "  (none)"
          before="$(registered)"
          echo "registered before: $before"
          case "$before" in
            *"nyxgpt-api "*|*"nyxgpt-api") ;;
            *) echo "::error::the stable keg registered no brew service -- this step is measuring nothing"; exit 1 ;;
          esac
          case "$before" in
            *nyxgpt-api@3.0.0rc*) ;;
            *) echo "::error::the candidate keg registered no brew service -- this step is measuring nothing"; exit 1 ;;
          esac

          echo "=== a candidate install over a recorded stable retires the stable service ==="
          reconcile_from nyxgpt-api@3.0.0rc nyxgpt-api

          # Brew's rows immediately after a retire, byte-for-byte. `cat -v`
          # renders escapes as `^[[31m` instead of letting the log viewer
          # swallow them; run 32233162053 is where this settled "stale column"
          # vs "coloured state token" in favour of the colour -- the retired
          # service printed `nyxgpt-api ^[[39mnone^[[0m` with an empty File
          # field, so the column was current and only the escapes broke the
          # read. Kept as the standing witness: if brew ever stops colourising,
          # or starts wrapping a token `strip_ansi` does not cover, this is the
          # line that shows it. Advisory only -- the plist assertions below are
          # what pass or fail this step -- and printed here, before anything
          # else touches the machine, so nothing can refresh the rows first.
          echo "=== post-retire \`brew services list\`, verbatim (cat -v) ==="
          brew services list 2>&1 | cat -v || true
          echo "=== end verbatim ==="

          after="$(registered)"
          echo "registered after: $after"
          case "$after" in
            *nyxgpt-api@3.0.0rc*) ;;
            *) echo "::error::the candidate's own service was retired -- the target must never retire itself"; exit 1 ;;
          esac
          case "$after" in
            *"nyxgpt-api "*|*"nyxgpt-api")
              echo "::error::the previously-recorded stable service is still registered after the reconcile (#3861)"
              exit 1 ;;
          esac
          plist_gone nyxgpt-api || {
            echo "::error::nyxgpt-api's LaunchAgent plist survived the retire -- launchd will start it again at the next login (#3861)"
            exit 1
          }

          echo "=== and the reverse: a stable install over a recorded candidate retires the candidate ==="
          brew services start nyxgpt-api@3.0.0rc || true
          reconcile_from nyxgpt-api nyxgpt-api@3.0.0rc
          after="$(registered)"
          echo "registered after: $after"
          case "$after" in
            *nyxgpt-api@3.0.0rc*)
              echo "::error::the previously-recorded candidate service is still registered after the reconcile (#3861)"
              exit 1 ;;
          esac
          plist_gone 'nyxgpt-api@3.0.0rc' || {
            echo "::error::nyxgpt-api@3.0.0rc's LaunchAgent plist survived the retire -- launchd will start it again at the next login (#3861)"
            exit 1
          }

          echo "=== the machine is still usable ==="
          command -v nyxgpt
          nyxgpt --version

          # Hand the next step the machine state it documents: candidate
          # installed and linked, stable not installed at all. The staged keg
          # and the unlink were this step's own scaffolding and must not
          # outlive it -- leaving them would have the measurement below read a
          # two-keg machine with the wrong `nyxgpt` on PATH.
          echo "=== unstage: remove the keg this step installed, relink the candidate ==="
          brew uninstall --ignore-dependencies nyxgpt-api 2>&1 | tail -5 || true
          brew link --overwrite nyxgpt-api@3.0.0rc 2>&1 | tail -5
          brew list --versions | grep -i nyxgpt || true
          command -v nyxgpt
          nyxgpt --version

      - name: "Measure: the same conflict after the candidate is retired from the tap"
        # An open question, measured rather than guessed (#3853, ledger Q-007).
        #
        # The release ceremony deletes a shipped line's candidate formulas from
        # the tap (`scripts/retire_rc_formulas.sh`), so after 3.0.0 ships the
        # stable formula's `conflicts_with "nyxgpt-api@3.0.0rc"` names a formula
        # the tap no longer carries -- while an operator's machine may still
        # have that KEG installed. Two things follow, and neither is knowable
        # from reading Homebrew's source:
        #
        #   1. does the conflict still hold, because `Formulary` can load the
        #      formula back from the installed keg's own `.brew/*.rb`; and
        #   2. what does a user with no candidate installed see -- an absent
        #      counterpart is documented as a benign warning (#3753), but on the
        #      STABLE formula that warning lands on the main install path, and
        #      Homebrew's wording for it ("should be removed from ...") is
        #      advice this project must not follow.
        #
        # This step reproduces exactly that state and prints the answer. It is
        # NOT a hard assertion, because nothing has established what the answer
        # should be yet -- per ledger D-026, a gate records what is open and
        # fails on what is settled. The machine-left-usable checks stay hard.
        # When the run answers it, that answer closes Q-007 and this step
        # becomes an assertion.
        run: |
          set -uo pipefail
          TAP_DIR="$(brew --repository nyxgpt/both-channels)"

          # Reach the state: candidate installed, stable not, rc formula gone
          # from the tap.
          brew uninstall nyxgpt-api 2>&1 | tail -5 || true
          brew install --verbose nyxgpt/both-channels/nyxgpt-api@3.0.0rc 2>&1 | tail -10
          brew list --versions nyxgpt-api@3.0.0rc || {
            echo "::warning::could not stage the candidate, so this measurement did not run"
            exit 0
          }
          rm -f "$TAP_DIR/Formula/nyxgpt-api@3.0.0rc.rb"
          echo "tap now carries:"; ls -1 "$TAP_DIR/Formula/"

          rc=0
          brew install --verbose nyxgpt/both-channels/nyxgpt-api > retired-counterpart.log 2>&1 || rc=$?
          echo "stable install exited $rc with the candidate formula retired"
          tail -40 retired-counterpart.log

          stable_installed=0
          brew list --versions nyxgpt-api > /dev/null 2>&1 && stable_installed=1
          echo "MEASURED: stable installed after retirement: $stable_installed"
          if grep -qi 'conflicting formulae are installed' retired-counterpart.log; then
            echo "MEASURED: the conflict still held -- brew resolved the retired formula (installed keg)"
          elif grep -qi 'should be removed from' retired-counterpart.log; then
            echo "MEASURED: brew could not resolve the retired formula and advised removing the declaration"
            echo "::warning::#3853/Q-007: with the candidate formula retired from the tap, the stable formula's conflicts_with does not resolve. Read this step's log before changing the declaration -- the advice brew prints must not be followed blindly."
          else
            echo "MEASURED: neither wording appeared -- read retired-counterpart.log above"
          fi

          # Whatever it turns out to be, the machine has to stay usable.
          command -v nyxgpt || { echo "::error::no nyxgpt on PATH after the retired-counterpart install attempt"; exit 1; }
          nyxgpt --version || { echo "::error::nyxgpt is on PATH but does not run after the retired-counterpart install attempt"; exit 1; }

      - name: Install logs on failure
        if: failure()
        run: |
          # The redirected install logs first: when a step above fails before
          # its `tail`, these carry the reason brew gave, and Homebrew's own
          # per-formula logs do not (they only exist for installs that got as
          # far as building).
          for log in candidate.log stable-on-top.log retired-counterpart.log; do
            [ -f "$log" ] || continue
            echo "--- $log ---"
            cat "$log" || true
          done
          for log in ~/Library/Logs/Homebrew/nyxgpt-api*/*; do
            [ -f "$log" ] || continue
            echo "--- $log ---"
            cat "$log" || true
          done

  published-tap:
    name: Install the published candidate from the real tap
    # The owner's literal command path. Needs a published candidate and a
    # configured tap, so it is dispatch/rc-cut only.
    if: ${{ inputs.formula_version != '' && vars.HOMEBREW_TAP_REPO != '' }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      # The user-path script lives in the repository (so it can be run by hand
      # on a real Mac and pinned by a unit test), which is the only reason this
      # job needs a checkout. Nothing below runs *from* it: the script `cd`s to
      # $HOME before touching the product, so a command can still not resolve a
      # path relative to a repo the user does not have (#3759).
      - uses: actions/checkout@v4

      - name: Tap and install the candidate
        id: install
        env:
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          VERSION: ${{ inputs.formula_version }}
        run: |
          set -euo pipefail
          # `dkblinux98/homebrew-nyxgpt` -> the `dkblinux98/nyxgpt` brew names.
          TAP="${TAP_REPO/homebrew-/}"
          RELEASE="${VERSION%%rc*}"
          echo "tapping $TAP for nyxgpt-api@${RELEASE}rc"
          brew tap "$TAP"
          # The owner's literal path includes the third-party tap trust step
          # (#3752). Trust the WHOLE TAP, never a single formula: installing
          # `nyxgpt-api@X.Y.Zrc` makes brew resolve its
          # `conflicts_with "nyxgpt-api"`, which *loads* the stable formula
          # too, so a grant scoped to the formula named on the command line
          # leaves the install refusing its own counterpart. That is exactly
          # how both rc8 publish runs died (#3770) -- brew implicitly trusted
          # the requested `nyxgpt-api@3.0.0rc` and then refused the stable
          # `nyxgpt-api` the tap started carrying with the #3763 backfill.
          #
          # Two spellings, because the subcommand is not the same on every
          # Homebrew: the runner's own gate prescribes `brew trust <tap>`,
          # while `brew tap-trust <tap>` is the spelling the docs and the
          # generated install commands use. Try both -- a swallowed "unknown
          # command" is precisely what left this job untrusted before.
          # Failing both is still tolerated: a Homebrew old enough not to
          # gate third-party taps has neither subcommand and nothing to trust.
          brew tap-trust "$TAP" || brew trust "$TAP" \
            || echo "::warning::neither 'brew tap-trust' nor 'brew trust' accepted $TAP -- proceeding untrusted"
          # A `conflicts_with` naming a formula the tap does not carry is
          # benign -- brew warns and installs anyway (docs/homebrew.md). That
          # is the ABSENT-counterpart case only: when the counterpart is
          # actually INSTALLED, brew refuses, and the `stable-over-candidate`
          # job asserts both directions of that on a real runner. Reading the
          # "warns anyway" behaviour more broadly than the absent case is what
          # left #3853's direction unguarded (ledger Q-002 / D-030).
          #
          # "Is the stable counterpart actually in the tap?" kept being
          # answered by guesswork after the #3737 backfill. Report it as a
          # fact instead. Never fails the job: an absent counterpart does not
          # break the install.
          echo "--- formulas this tap actually carries ---"
          ls -1 "$(brew --repository "$TAP")"/Formula 2>/dev/null \
            || ls -1 "$(brew --repository "$TAP")" 2>/dev/null \
            || true
          if brew info --formula "${TAP}/nyxgpt-api" >/dev/null 2>&1; then
            echo "stable counterpart nyxgpt-api: present -- conflicts_with resolves, no warning expected"
          else
            echo "conflicts_with names a formula this tap does not carry."
            echo "Benign: brew warns and installs anyway (docs/homebrew.md)."
            echo "::warning::no stable nyxgpt-api formula in the tap"
          fi
          # Both formulas, because that is the documented candidate install
          # (docs/homebrew.md: `brew install nyxgpt-api@X.Y.Zrc
          # nyxgpt-web@X.Y.Zrc`) and because the user path below asks the web
          # UI for a page (#3857). Installed as two commands so the log says
          # which one failed.
          brew install --verbose "${TAP}/nyxgpt-api@${RELEASE}rc" 2>&1 | tail -80
          brew install --verbose "${TAP}/nyxgpt-web@${RELEASE}rc" 2>&1 | tail -80

      - name: Verify the installed keg
        env:
          VERSION: ${{ inputs.formula_version }}
        run: |
          set -euo pipefail
          RELEASE="${VERSION%%rc*}"
          KEG="$(brew --prefix "nyxgpt-api@${RELEASE}rc")"
          VENV="$KEG/libexec/venv"
          "$VENV/bin/pip" --version
          "$VENV/bin/python3" -c 'import nyxgpt.app; print("nyxgpt.app imports")'
          "$VENV/bin/nyxgpt" --version
          test -f "$KEG/bin/nyxgpt-api" || { echo "::error::no nyxgpt-api wrapper"; exit 1; }
          # The owner's own next command after `brew install` (#3850). The
          # line above only proves the entry point exists *inside* the keg;
          # this is the one that fails if the published formula leaves the CLI
          # unreachable, which is what shipped through rc12.
          command -v nyxgpt || { echo "::error::nyxgpt is not on PATH after brew install"; exit 1; }
          # And it has to report the candidate it IS (#3850, re-test). rc13
          # answered `nyxgpt 3.0.0` from a `3.0.0rc13` keg, because the tarball
          # vendored the release branch's pyproject.toml verbatim -- and that
          # metadata is what `ops._remote_tap_formula` reads to choose a
          # channel, so `nyxgpt up` installed the stable 2.1.0 pair beside the
          # candidate and started it. This job installs from the real tap, so
          # it is the one that would have caught the published keg.
          REPORTED="$(nyxgpt --version)"
          echo "the published keg reports: ${REPORTED}"
          test "$REPORTED" = "nyxgpt ${VERSION}" || {
            echo "::error::installed ${VERSION} but the CLI reports '${REPORTED}'"
            exit 1
          }
          # Documented to always exit 0, so a failure here is the artifact
          # path breaking on a machine with no stack and no checkout.
          nyxgpt ops status
          # The installed version has to be the candidate that was asked for,
          # not whatever the tap happened to already carry.
          brew list --versions "nyxgpt-api@${RELEASE}rc" | grep -F "$VERSION"

      # The half this workflow never had (#3860). Everything above proves an
      # install produced files; this runs the product: version, up, API,
      # session list, web UI, status, down, uninstall, untap, residue. The
      # assertions and the one allowlist of what a hosted macOS runner cannot
      # run live in the script, next to the reasons -- see
      # scripts/macos-user-path-smoke.sh and docs/live-verification-ci.md.
      #
      # Runs even when the keg verification above failed, as long as something
      # was installed to run against. That step's checks are a subset of this
      # script's, so letting it gate this one means the *first* open defect
      # hides the state of everything after it -- run 32202247518 stopped at
      # `command -v nyxgpt` (#3850, reproduced against the published rc12) and
      # never reached the user path at all. The script's own rule is that a
      # failure is recorded rather than aborting; this is that rule at the job
      # level. The job still fails: a failed step above is not un-failed by
      # this one running.
      - name: Run the user path end to end
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        env:
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          VERSION: ${{ inputs.formula_version }}
        run: |
          set -euo pipefail
          TAP="${TAP_REPO/homebrew-/}"
          ./scripts/macos-user-path-smoke.sh "$VERSION" "$TAP"

      - name: Service logs on failure
        if: failure()
        run: |
          for log in /opt/homebrew/var/log/nyxgpt-*.log /usr/local/var/log/nyxgpt-*.log; do
            [ -f "$log" ] || continue
            echo "--- $log ---"
            tail -100 "$log" || true
          done
          echo "--- brew services list ---"
          brew services list || true
          echo "--- launchctl (nyxgpt) ---"
          launchctl list | grep -i nyxgpt || echo "no nyxgpt launchd jobs"

      - name: Install logs on failure
        if: failure()
        env:
          VERSION: ${{ inputs.formula_version }}
        run: |
          RELEASE="${VERSION%%rc*}"
          for log in ~/Library/Logs/Homebrew/nyxgpt-api@${RELEASE}rc/*; do
            echo "--- $log ---"
            cat "$log" || true
          done

  candidate-upgrade:
    name: Upgrade one candidate to the next with the stack running
    # The question none of the jobs above asks: they install ONE version and
    # stop. #4133 is about the second one -- a `brew upgrade` on a host where
    # the api is already serving. On the owner's Mac that left a pre-upgrade
    # process holding :8000 from a venv the upgrade had deleted, while `nyxgpt
    # ops install` reported 56/56 steps `[OK]` and `nyxgpt ops status`
    # reported the new keg's version. Nothing available to the operator
    # distinguished that from a correct install, and the symptom was deferred
    # to whenever the service next restarted.
    #
    # Builds BOTH versions from this checkout into one throwaway tap, so it
    # needs no publish and runs on every PR that touches the comparison. The
    # two formulas render the same name (`nyxgpt-api@3.0.0rc`) at different
    # versions, which is what makes `brew upgrade` a real upgrade rather than
    # a second install.
    #
    # A separate job rather than more steps on `stable-over-candidate`: that
    # one's machine state is "two channels installed", which `conflicts_with`
    # exists to prevent and which this scenario must not involve. One channel,
    # two versions, one service -- and it has to *run* the service, which no
    # other PR-triggered job here does.
    #
    # Everything substantive lives in `scripts/macos-upgrade-smoke.sh` (so it
    # can be run by hand on a real Mac and pinned by a unit test); that script
    # `cd`s to $HOME before touching the product, so nothing it runs can
    # resolve a path relative to a repo a user does not have (#3759).
    #
    # It stages the survivor TWICE, and that is the shape of the proof rather
    # than belt-and-braces: the install step and `nyxgpt ops restart api` are
    # two different repairs, the first consumes the state, and the second is
    # the one printed on every mismatch surface. Measuring it only after the
    # first had already cleaned up is how `restart api` stayed a no-op against
    # an unregistered survivor through a whole review cycle.
    if: ${{ github.event_name == 'pull_request' || inputs.run_keg_install }}
    runs-on: macos-15
    # Raised from 75 with the second staging (two more service starts and
    # another repair wait). A gate that reds out on its own clock is a gate
    # people learn to re-run rather than read.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The kegs build their venvs from Homebrew's python@3.12 (the formulas'
      # declared dependency), not from the setup-python above -- that one only
      # runs the stdlib-only stamping script (#3741).
      - name: Install the formula's declared Python dependency
        run: brew install python@3.12

      - name: Build two candidates of the same formula from this checkout
        run: |
          set -euo pipefail
          python scripts/build_homebrew_artifacts.py 3.0.0rc0 dist/rc0 \
            "file://${PWD}/dist/rc0/dist" --channel rc
          python scripts/build_homebrew_artifacts.py 3.0.0rc1 dist/rc1 \
            "file://${PWD}/dist/rc1/dist" --channel rc
          ls -1 dist/rc0/*.rb dist/rc1/*.rb

          # The upgrade only exists if both stamp the SAME formula name. If the
          # channel ever renders a per-version name, `brew upgrade` becomes a
          # second install and this job silently stops testing an upgrade.
          test -f 'dist/rc0/nyxgpt-api@3.0.0rc.rb' && test -f 'dist/rc1/nyxgpt-api@3.0.0rc.rb' || {
            echo "::error::the two builds did not render the same formula name -- there is no upgrade here"
            exit 1
          }

          # And only if the two tarballs DECLARE different versions: the keg's
          # own `nyxgpt --version`, and `ops._native_service_version`, read
          # that metadata (#3850). Two tarballs declaring one version would
          # make both kegs report the same build and the comparison would be
          # measuring nothing.
          declared() {
            tar -xzOf "dist/$1/dist/nyxgpt-api-$2.tar.gz" "nyxgpt-api-$2/pyproject.toml" \
              | awk -F'"' '/^version =/{print $2; exit}'
          }
          RC0="$(declared rc0 3.0.0rc0)"
          RC1="$(declared rc1 3.0.0rc1)"
          echo "rc0 declares '${RC0}' / rc1 declares '${RC1}'"
          test "$RC0" = "3.0.0rc0" && test "$RC1" = "3.0.0rc1" || {
            echo "::error::the stamped versions are wrong (#3850), so the two kegs are not two builds"
            exit 1
          }

      - name: Create a tap carrying the first candidate only
        run: |
          set -euo pipefail
          brew tap-new nyxgpt/upgrade-smoke --no-git 2>/dev/null \
            || brew tap-new nyxgpt/upgrade-smoke
          TAP_DIR="$(brew --repository nyxgpt/upgrade-smoke)"
          mkdir -p "$TAP_DIR/Formula"
          # api only: the web keg is a full Next.js build and adds nothing to
          # the question here, which is about a python venv.
          cp 'dist/rc0/nyxgpt-api@3.0.0rc.rb' "$TAP_DIR/Formula/"
          ls -1 "$TAP_DIR/Formula/"

          # Trust the WHOLE tap, for the reason #3770 established: installing
          # `nyxgpt-api@3.0.0rc` makes brew resolve its
          # `conflicts_with "nyxgpt-api"`, which loads the stable formula, and
          # a `brew tap-new` tap is untrusted so that load is refused. Two
          # spellings because the subcommand is not the same on every Homebrew.
          brew tap-trust nyxgpt/upgrade-smoke || brew trust nyxgpt/upgrade-smoke \
            || echo "::warning::neither 'brew tap-trust' nor 'brew trust' accepted the tap -- proceeding untrusted"

      - name: Install the first candidate
        run: |
          set -euo pipefail
          brew install --verbose nyxgpt/upgrade-smoke/nyxgpt-api@3.0.0rc 2>&1 | tail -40
          brew list --versions nyxgpt-api@3.0.0rc
          command -v nyxgpt
          nyxgpt --version

      - name: Upgrade with the stack running, and prove the live interpreter moves
        run: |
          ./scripts/macos-upgrade-smoke.sh \
            3.0.0rc0 3.0.0rc1 nyxgpt/upgrade-smoke 'dist/rc1/nyxgpt-api@3.0.0rc.rb'

      - name: Service and keg state on failure
        if: failure()
        run: |
          echo "--- brew services list ---"
          brew services list || true
          echo "--- installed versions ---"
          brew list --versions | grep -i nyxgpt || true
          echo "--- Cellar ---"
          ls -1 "$(brew --cellar)"/nyxgpt-api@3.0.0rc/ 2>/dev/null || true
          echo "--- launchctl (nyxgpt) ---"
          launchctl list | grep -i nyxgpt || echo "no nyxgpt launchd jobs"
          for log in /opt/homebrew/var/log/nyxgpt-*.log /usr/local/var/log/nyxgpt-*.log; do
            [ -f "$log" ] || continue
            echo "--- $log ---"
            tail -100 "$log" || true
          done
          for log in ~/Library/Logs/Homebrew/nyxgpt-api@3.0.0rc/*; do
            [ -f "$log" ] || continue
            echo "--- $log ---"
            cat "$log" || true
          done

  # --- Does the EC2 Mac bootstrap's model backend actually work? (#4150) ----
  #
  # The question this job answers. `nyxgpt cloud deploy --os macos` shipped a
  # Mac with a healthy api, a healthy web and no Ollama at all: the macOS
  # user-data template installed the two kegs and stopped, so
  # `GET /api/v1/models` 502'd on `[Errno 61] Connection refused` to
  # 127.0.0.1:11434 and chat could not work. The fix adds Homebrew's ollama,
  # `brew services start ollama`, and the configured-model pull to that
  # template -- three runtime claims about what happens on a macOS machine,
  # and `tests/unit/test_cloud_user_data_template_parity.py` can only prove
  # the template *says* them.
  #
  # Why this is the accepted evidence. EC2 Mac hardware is one of the few
  # genuine D-006 exceptions (docs/live-verification-ci.md) -- CI cannot
  # provision a Dedicated Host. A GitHub-hosted macos-15 runner is not EC2 Mac,
  # but it is arm64 macOS with the same Homebrew, and it executes the exact
  # commands the bootstrap runs rather than inspecting them. End-to-end on real
  # EC2 Mac hardware is the owner's acceptance test; this is what has to be
  # green before it gets there.
  #
  # The condition is injected, not hoped for (#3753's lesson). Between
  # installing Ollama and pulling into it the job MEASURES the near-miss state
  # -- a running Ollama with an empty store -- and asserts the API reports it
  # differently from an unreachable one. That matters because a fix that
  # installed Ollama and forgot the pull would leave chat just as broken while
  # changing the symptom from a 502 to an empty list, and this job would have
  # passed. The pull is a separate step on macOS precisely because on Linux it
  # lives inside `nyxgpt ops install`, which an EC2 Mac cannot run.
  mac-model-backend:
    name: The model backend, installed and pulled on real macOS
    # PRs and dispatch. Not on the rc-cut `workflow_call` path: that caller
    # wants the published-tap job, and this one proves a property of the
    # working tree's bootstrap, which a published candidate does not carry.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The CLI the bootstrap drives. Installed from the checkout rather than
      # the tap: the claim under test is about THIS tree's
      # `ops required-models` and THIS tree's macOS template, and a published
      # keg carries neither.
      - name: Install the nyxgpt CLI from the working tree
        run: |
          set -euo pipefail
          python -m venv "$HOME/cli-venv"
          "$HOME/cli-venv/bin/python" -m pip install --quiet --upgrade pip
          "$HOME/cli-venv/bin/python" -m pip install --quiet -e '.[dev]'
          echo "$HOME/cli-venv/bin" >> "$GITHUB_PATH"

      # Exactly what the bootstrap seeds, by the same route: a copy of the
      # packaged example.config.ini. So the models this job pulls are the
      # models a deployed instance requires, and a change to the shipped
      # default changes what is tested here without anyone editing this file.
      - name: Seed ~/.nyxGPT/config.ini the way the bootstrap does
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.nyxGPT"
          EXAMPLE_CONFIG="$(python -c \
            "import importlib.resources as r; print(r.files('nyxgpt.resources').joinpath('example.config.ini'))")"
          cp "$EXAMPLE_CONFIG" "$HOME/.nyxGPT/config.ini"
          nyxgpt ops required-models --help >/dev/null
          python - <<'PY'
          from nyxgpt.config import load_config
          from nyxgpt.model_bootstrap import required_models
          wanted = required_models(load_config(None))
          assert wanted, "the seeded config requires no models -- nothing to test"
          for m in wanted:
              print(f"required {m.role} model: {m.name} (from {m.setting})")
          PY

      # The starting state the defect left behind, asserted rather than
      # assumed: nothing named ollama, and nothing on :11434.
      - name: Assert the machine starts with no model backend
        run: |
          set -euo pipefail
          if command -v ollama >/dev/null 2>&1; then
            echo "This runner already has ollama; the install step below would be a no-op" >&2
            exit 1
          fi
          if curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            echo "Something is already listening on :11434" >&2
            exit 1
          fi
          echo "OK: no ollama, nothing on :11434 -- the state an --os macos deploy used to leave"

      # The API's answer in that state, measured. This is the 502 from the
      # owner's acceptance report, reproduced here, so the assertion after the
      # pull is a comparison and not a lone claim.
      - name: Measure what the API says with no Ollama at all
        run: |
          set -euo pipefail
          python - <<'PY'
          from fastapi.testclient import TestClient
          from nyxgpt.app import app

          response = TestClient(app, raise_server_exceptions=False).get("/api/v1/models")
          print(response.status_code, response.text)
          assert response.status_code == 502, "an unreachable Ollama must be an error"
          message = response.json()["error"]["message"]
          assert "Nothing is answering" in message, message
          assert "ops restart ollama" in message, message
          PY

      # Homebrew's formula, not Ollama's official installer. ollama ships an
      # arm64 bottle, so this is a download-and-link with no source build --
      # which is why it does not touch the pip/TLS sandbox failure that blocks
      # `nyxgpt-api@` source installs on macOS 27 (#4121).
      - name: brew install ollama
        run: |
          set -euo pipefail
          brew install ollama
          BREW_PREFIX="$(brew --prefix)"
          test -x "$BREW_PREFIX/bin/ollama" \
            || { echo "no ollama binary at $BREW_PREFIX/bin/ollama" >&2; exit 1; }
          echo "OK: $("$BREW_PREFIX/bin/ollama" --version)"

      - name: brew services start ollama, and wait for :11434
        run: |
          set -euo pipefail
          brew services start ollama
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "OK: Ollama answering on :11434"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama never started answering on :11434 after 120s" >&2
          brew services list || true
          exit 1

      # THE INJECTED CONDITION. Installing Ollama is not the fix; this is the
      # state a fix that stopped there would ship, and it is measured rather
      # than reasoned about. If these assertions ever fail because the store is
      # pre-warmed, the step below proves nothing and says so.
      - name: Prove install-without-pull is still broken, and reads differently
        run: |
          set -euo pipefail
          TAGS="$(curl -fsS http://127.0.0.1:11434/api/tags)"
          echo "$TAGS"
          python - "$TAGS" <<'PY'
          import json
          import sys

          from fastapi.testclient import TestClient

          from nyxgpt.app import app
          from nyxgpt.config import load_config
          from nyxgpt.model_bootstrap import required_models

          installed = json.loads(sys.argv[1]).get("models") or []
          assert installed == [], (
              "Ollama already holds models, so this step cannot demonstrate the "
              f"install-without-pull state: {installed}"
          )

          response = TestClient(app, raise_server_exceptions=False).get("/api/v1/models")
          print(response.status_code, response.text)
          # A 200 and an empty list: the request succeeded and the honest answer
          # is that there is nothing to serve. Chat is still broken.
          assert response.status_code == 200, response.text
          body = response.json()
          assert body["models"] == [], body
          detail = body["detail"]
          # And it does NOT read like the unreachable case measured earlier.
          assert "holds no models" in detail, detail
          assert "Nothing is answering" not in detail, detail
          assert "ops required-models" in detail, detail
          # Naming the models this install requires, read from configuration.
          for model in required_models(load_config(None)):
              assert model.name in detail, (model.name, detail)
          print("OK: install-without-pull is a distinct, named, still-broken state")
          PY

      # The second half of the bootstrap's model block, run as the bootstrap
      # runs it. No model name is passed: the command reads
      # `[nyxgpt] default_model` and `[rag] embedding_model` from the config
      # seeded above.
      - name: nyxgpt ops required-models
        run: |
          set -euo pipefail
          nyxgpt ops required-models

      - name: Assert :11434 now lists every configured model
        run: |
          set -euo pipefail
          TAGS="$(curl -fsS http://127.0.0.1:11434/api/tags)"
          echo "$TAGS"
          python - "$TAGS" <<'PY'
          import json
          import sys

          from nyxgpt.config import load_config
          from nyxgpt.model_bootstrap import normalize_model_name, required_models

          installed = {
              normalize_model_name(str(m.get("name") or m.get("model") or ""))
              for m in (json.loads(sys.argv[1]).get("models") or [])
          }
          print("installed:", sorted(installed))
          for model in required_models(load_config(None)):
              assert normalize_model_name(model.name) in installed, (
                  f"{model.role} model {model.name!r} was not pulled; Ollama holds "
                  f"{sorted(installed)}"
              )
          print("OK: every configured model is in the store Ollama serves from")
          PY

      # The acceptance criterion, through the product's own endpoint rather
      # than Ollama's: a 200 with at least one model and no remediation text.
      - name: Assert GET /api/v1/models answers 200 with a model
        run: |
          set -euo pipefail
          python - <<'PY'
          from fastapi.testclient import TestClient

          from nyxgpt.app import app
          from nyxgpt.config import get_default_model, load_config

          response = TestClient(app, raise_server_exceptions=False).get("/api/v1/models")
          print(response.status_code, response.text)
          assert response.status_code == 200, response.text
          body = response.json()
          assert body["models"], "the endpoint still reports no models"
          assert "detail" not in body, body
          chat_model = get_default_model(load_config(None))
          assert any(name.startswith(chat_model.split(":")[0]) for name in body["models"]), (
              chat_model,
              body["models"],
          )
          print("OK: /api/v1/models answers 200 with the configured chat model")
          PY

      # Idempotent, because the bootstrap is re-run by every re-deploy: a
      # second pass must report the models present and download nothing.
      - name: Assert a re-run is a no-op
        run: |
          set -euo pipefail
          OUT="$(nyxgpt ops required-models 2>&1)"
          echo "$OUT"
          echo "$OUT" | grep -qi "already installed" \
            || { echo "a re-run did not report the models as already present" >&2; exit 1; }

      # Enabled at boot, not just running now. A service started in the wrong
      # launchd domain works until the instance reboots and is then silently
      # gone -- which on a Dedicated Host is discovered expensively.
      #
      # Registration is a launchd fact, not a state word (D-032(d)): the plist
      # in ~/Library/LaunchAgents under EITHER of Homebrew's label schemes is
      # what gets loaded at the next login, so that file is what the
      # boot-survival claim rests on. `ops._brew_service_will_restart` is the
      # product's own answer to that question -- plist first, then launchctl --
      # and is called here rather than re-implemented, because the last two
      # re-implementations of this read in this file both measured the wrong
      # thing.
      #
      # The Status column is NOT grepped, and that is not a style choice:
      # D-032(f) measured, in this same workflow, that brew colours its state
      # tokens and that the escapes survive a pipe (`ESC[39mnoneESC[0m` through
      # `cat -v`, run 32233162053; `ESC[31merror` through `awk`, run
      # 32228088507). An ANSI-wrapped `started` matches no literal, so the
      # `brew services list | grep -E '^ollama\s+(started|scheduled)'` this
      # step used to run could fail on a machine where ollama is registered
      # and running -- a *required* gate measuring its own parsing instead of
      # the machine. Where the state is genuinely wanted (is it running right
      # now, as opposed to merely registered) it comes through
      # `brew_services.parse_services_list`, the one chokepoint every state
      # read in the product goes through, which strips the escapes first.
      - name: Assert the ollama service is registered with brew services
        run: |
          set -euo pipefail
          brew services list || true
          python - <<'PY'
          import subprocess

          from nyxgpt import brew_services, ops

          out = subprocess.run(
              ["brew", "services", "list"], capture_output=True, text=True, check=True
          ).stdout
          state = brew_services.parse_services_list(out).get("ollama", "<absent>")
          candidates = ops._brew_service_plist_candidates("ollama")
          present = [str(path) for path in candidates if path.exists()]
          print("state (escapes stripped):", state)
          print("launchd plists searched:", [str(path) for path in candidates])
          print("launchd plists present: ", present)

          # Boot survival: does anything start it again at the next login?
          assert ops._brew_service_will_restart("ollama"), (
              "nothing will start ollama again after a reboot: no brew LaunchAgent "
              f"under {[str(path) for path in candidates]} and no loaded launchd job"
          )
          # Running now, too -- the parsed state, never the raw column. `error`
          # and `stopped` are states of a *registered* service, so the
          # assertion above cannot stand in for this one.
          assert state in {"started", "scheduled"}, (
              f"ollama is registered with launchd but brew reports state {state!r}"
          )
          print(f"OK: ollama is registered with launchd and brew reports it {state}")
          PY

      - name: Ollama logs on failure
        if: failure()
        run: |
          brew services list || true
          for log in /opt/homebrew/var/log/ollama.log /usr/local/var/log/ollama.log; do
            [ -f "$log" ] || continue
            echo "--- $log ---"
            tail -200 "$log" || true
          done
          launchctl list | grep -i ollama || echo "no ollama launchd job"
