name: Linux Native Smoke

# Exercises the Linux-native (systemd --user) install path end-to-end via
# scripts/systemd-native-smoke.sh: `nyxgpt ops install` -> every unit active
# and api/web responding -> diagnostics -> `nyxgpt ops down` (#3508). This is
# the review agent's only way to see systemd-path regressions -- unit tests
# mock systemctl; this runs the real thing on a real systemd userland.
#
# Scoped like terraform-local-smoke.yml: a full native install is expensive,
# so it runs only when the ops/self-heal layer, the systemd unit templates,
# the smoke script, or this workflow change.
on:
  pull_request:
    paths:
      - 'src/nyxgpt/ops.py'
      - 'src/nyxgpt/self_heal.py'
      - 'ops/systemd/**'
      - 'scripts/systemd-native-smoke.sh'
      - '.github/workflows/linux-native-smoke.yml'
  push:
    paths:
      - 'src/nyxgpt/ops.py'
      - 'src/nyxgpt/self_heal.py'
      - 'ops/systemd/**'
      - 'scripts/systemd-native-smoke.sh'
      - '.github/workflows/linux-native-smoke.yml'

# Read-only workflow: the smoke run only checks out the repo and drives the
# local install; it never writes to the repository or its APIs (CodeQL #33,
# actions/missing-workflow-permissions -- same pattern as #3628/#3642).
permissions:
  contents: read

jobs:
  linux-native-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install nyxgpt (editable)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .

      # Config seeding, Ollama install, and systemd --user session setup
      # (lingering/DBUS) are all handled inside the script itself.
      - name: Run systemd native smoke
        run: ./scripts/systemd-native-smoke.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          systemctl --user list-units 'nyxgpt-*' --all --no-pager || true
          nyxgpt ops status || true
          for svc in api web ollama cassandra; do
            echo "--- nyxgpt ops logs $svc ---"
            nyxgpt ops logs "$svc" --tail 100 || true
          done
