name: Release Artifacts

# Publishes the artifacts a repo-less, credential-holding machine needs to
# install nyxGPT (#3622, split B of the repo-less portability requirement --
# CLAUDE.md 2026-08-01): container images to GHCR and a remote Homebrew tap.
#
# PyPI is NOT published here -- every PyPI upload, on every channel, goes
# through the one publish pipeline, release-publish-pypi.yml (#3727, owner
# decision 2026-08-11: a single release pipeline). That workflow publishes
# `3.0.0rcN` on dispatch and `3.0.0` when scripts/release_ceremony.sh Phase 2
# delegates to it with the release tag and its confirmation -- two channels,
# nothing on a schedule (#3735). This workflow picks up right after Phase 1 of that
# ceremony publishes the GitHub Release, which is what triggers it below.
#
# The `homebrew-tap` job below owns the STABLE formulas (`nyxgpt-api.rb`,
# `nyxgpt-web.rb`) exclusively -- `brew install nyxgpt-api` resolves to the
# latest stable release and nothing else may move it. Release candidates get
# their own `nyxgpt-api@<release>rc`/`nyxgpt-web@<release>rc` formulas,
# stamped from the same templates by release-publish-pypi.yml's
# `homebrew-tap-rc` job (#3727, named for the release line by #3735). The
# `released` trigger above is part of that separation: an rc prerelease fires
# `prereleased`, so it cannot start this workflow.
#
# The Homebrew tap job additionally needs a remote tap repository (e.g.
# dkblinux98/homebrew-nyxgpt) and a push token the owner provisions once --
# see docs/homebrew.md#remote-tap-repo-less-install. Until `vars.
# HOMEBREW_TAP_REPO` is set, that job's push step logs a skip and still
# succeeds; the stamped formulas are uploaded as a workflow artifact either
# way, and the tarballs are always published on a GitHub release (that part
# needs no owner secret -- the default GITHUB_TOKEN can create releases and
# write their assets on this repo).
#
# WHERE THE TARBALLS LIVE (#3763): on a release of their own, tagged
# `<version>-homebrew`, created with the assets attached in the same `gh
# release create` call. Releases in this repository are IMMUTABLE -- a
# published one can never gain an asset -- and the release named by the
# version is published by the ceremony before these tarballs are even built,
# so `gh release upload` against it is a guaranteed `HTTP 422: Cannot upload
# assets to an immutable release` (#3747's failure class; it is what killed
# both 2.1.0 backfill runs). The sidecar is a prerelease and never "latest",
# so it is not a second release of nyxGPT and cannot re-trigger this
# workflow. A version whose own release already carries both tarballs is
# served from that release instead, so nothing already published moves.
#
# GHCR image publishing also needs no owner secret: GITHUB_TOKEN with
# `packages: write` is sufficient to push to ghcr.io/<owner>/...  (the owner
# may still want to flip the resulting package's visibility to public in
# GitHub package settings after the first publish).

#
# BACKFILL (#3737): a tag that predates this machinery can still be published
# to the tap. The `homebrew-tap` job takes TWO checkouts -- the release
# tooling from the branch the run was dispatched from, and the target tag's
# source into `release-source/` -- so `brew install nyxgpt-api` can resolve to
# 2.1.0 even though the 2.1.0 tree contains neither
# `scripts/build_homebrew_artifacts.py` nor `homebrew/tap/*.rb.tmpl`. Dispatch
# it from a branch that has the tooling with `version: 2.1.0`, `tap_only:
# true`; see docs/homebrew.md#backfilling-a-release-that-predates-the-tap.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to (re-)publish artifacts for, e.g. 2.1.0 (must already exist as a tag)'
        required: true
      tap_only:
        description: 'Publish only the Homebrew tap formulas (skip images and the PyPI smokes) -- the backfill one-shot'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  container-images:
    if: ${{ !inputs.tap_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nyxgpt-api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nyxgpt-api:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/nyxgpt-api:latest

      - name: Build and push nyxgpt-web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nyxgpt-web:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/nyxgpt-web:latest

  homebrew-tap:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload (assets on this repo's own release)
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      # Two checkouts, deliberately (#3737). The tooling and the source it
      # vendors are the same commit for a normal release, but they are NOT
      # for a tag cut before this machinery existed -- and checking out only
      # the tag is what made the 2026-08-11 backfill attempt against 2.1.0
      # fail with "no such file: scripts/build_homebrew_artifacts.py".
      #
      # 1. This workspace: the release TOOLING (build script, templates,
      #    nyxgpt.ops) from the ref this run was started on -- the release
      #    commit itself on a `released` event, the dispatched branch on a
      #    backfill.
      - uses: actions/checkout@v4

      # 2. `release-source/`: the SOURCE the tarballs are vendored from,
      #    always the target tag, so what users install is that release's
      #    code and nothing newer.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
          path: release-source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify the target tag is a published stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Stable formulas are what `brew install nyxgpt-api` resolves to, so
          # they are only ever stamped from a real release. The `released`
          # trigger already guarantees that; this is the guard for the
          # dispatch path, where any tag string can be typed in.
          meta=$(gh release view "$VERSION" -R "$REPO" \
            --json tagName,isDraft,isPrerelease)
          echo "$meta"
          draft=$(echo "$meta" | jq -r .isDraft)
          prerelease=$(echo "$meta" | jq -r .isPrerelease)
          if [ "$draft" != "false" ] || [ "$prerelease" != "false" ]; then
            echo "::error::${VERSION} is a draft or prerelease -- the stable tap formulas"
            echo "::error::are published only for real releases (release candidates get"
            echo "::error::their own @<line>rc formulas from release-publish-pypi.yml)"
            exit 1
          fi

      - name: Resolve the release that will serve the tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Releases here are IMMUTABLE: once published, one can never gain an
          # asset (#3747). The release named by $VERSION is published by the
          # ceremony *before* these tarballs are built, so uploading them onto
          # it afterwards is a guaranteed `HTTP 422: Cannot upload assets to an
          # immutable release` -- the error that killed both 2.1.0 backfill
          # runs (#3763). The tarballs therefore get their own release,
          # `<version>-homebrew`, created with its assets attached.
          #
          # The one exception is a release that already carries both tarballs
          # (a historic release, or a re-run of this job): serving from it
          # keeps the formulas pointing where they already point.
          #
          # Whether the serving release ALREADY carries the bytes is the other
          # half of the answer, and it decides how the formulas get their
          # sha256. Tarball builds are not byte-reproducible (gzip stamps a
          # timestamp, tar members carry the checkout's mtimes), so stamping a
          # re-run's fresh build against assets published by an earlier run
          # would ship formulas that fail `brew install` checksum verification
          # on every machine -- and immutability means the served bytes can
          # never be corrected to match. When the assets are already there,
          # they are downloaded and stamped against instead (#3763).
          have_both() {
            case " $1 " in
              *" nyxgpt-api-${VERSION}.tar.gz "*)
                case " $1 " in
                  *" nyxgpt-web-${VERSION}.tar.gz "*) return 0 ;;
                esac ;;
            esac
            return 1
          }
          # A release that does not exist yet is a real answer (nothing is
          # published); an API failure is not. Suppressing the difference
          # would let a transient 5xx read a *serving* sidecar as empty, and
          # the retirement branch below would then delete assets the formulas
          # of earlier runs are stamped against.
          assets_on() {
            local err out
            err=$(mktemp)
            if out=$(gh release view "$1" -R "$REPO" --json assets \
                --jq '[.assets[].name] | join(" ")' 2>"$err"); then
              rm -f "$err"
              printf '%s' "$out"
              return 0
            fi
            if grep -qi 'release not found' "$err"; then
              rm -f "$err"
              return 0
            fi
            echo "::error::could not read the assets on release $1 -- refusing to guess" >&2
            cat "$err" >&2
            rm -f "$err"
            return 1
          }

          HAVE=$(assets_on "$VERSION")
          echo "assets on ${VERSION}: ${HAVE:-(none)}"
          if have_both "$HAVE"; then
            ASSET_TAG="$VERSION"
            SERVED=true
          else
            ASSET_TAG=$(python scripts/build_homebrew_artifacts.py --asset-tag "$VERSION")
            SIDECAR_HAVE=$(assets_on "$ASSET_TAG")
            echo "assets on ${ASSET_TAG}: ${SIDECAR_HAVE:-(none)}"
            if have_both "$SIDECAR_HAVE"; then SERVED=true; else SERVED=false; fi
          fi
          echo "::notice::${VERSION} tarballs will be served from release ${ASSET_TAG}"
          if [ "$SERVED" = "true" ]; then
            echo "::notice::${ASSET_TAG} already carries both tarballs -- the formulas will be"
            echo "::notice::stamped against those published bytes, not a fresh build"
          fi
          echo "ASSET_TAG=${ASSET_TAG}" >> "$GITHUB_ENV"
          echo "SERVED=${SERVED}" >> "$GITHUB_ENV"

      - name: Download the tarballs the serving release already carries
        if: ${{ env.SERVED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The bytes brew will actually download, fetched so the formulas can
          # be stamped with *their* sha256 (see the resolve step above).
          rm -rf served-tarballs && mkdir -p served-tarballs
          for name in nyxgpt-api nyxgpt-web; do
            gh release download "$ASSET_TAG" -R "$REPO" \
              --pattern "${name}-${VERSION}.tar.gz" --dir served-tarballs
          done
          (cd served-tarballs && sha256sum ./*.tar.gz)

      - name: Build tarballs and stamp formulas
        run: |
          set -euo pipefail
          # BASE_URL is the serving release resolved above -- the formulas'
          # `url` must name the release the assets are actually published on,
          # not the version's own release.
          #
          # Where the sha256 comes from is the other half: the tag's source
          # when the tarballs are still to be published, and the already-served
          # bytes when they are not (a re-run, or a historic release). A fresh
          # build cannot stand in for published bytes -- see the resolve step.
          if [ "${SERVED}" = "true" ]; then
            SOURCE_ARGS=(--tarballs-from served-tarballs)
          else
            SOURCE_ARGS=(--source-root release-source)
          fi
          python scripts/build_homebrew_artifacts.py "$VERSION" dist/homebrew \
            "https://github.com/${{ github.repository }}/releases/download/${ASSET_TAG}" \
            "${SOURCE_ARGS[@]}"

      - name: Assert only the stable formulas were stamped
        run: |
          set -euo pipefail
          # The rc formulas belong to release-publish-pypi.yml and to the
          # acceptance round they were cut for: this job must never write or
          # push one, whatever tag it was pointed at.
          stamped=$(cd dist/homebrew && ls -1 ./*.rb | sed 's|^\./||' | sort | tr '\n' ' ')
          echo "stamped: ${stamped}"
          if [ "$stamped" != "nyxgpt-api.rb nyxgpt-web.rb " ]; then
            echo "::error::expected exactly the two stable formulas, got: ${stamped}"
            exit 1
          fi

      - name: Publish the tarballs with their release (assets at creation)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API_TARBALL="dist/homebrew/dist/nyxgpt-api-${VERSION}.tar.gz"
          WEB_TARBALL="dist/homebrew/dist/nyxgpt-web-${VERSION}.tar.gz"
          for tarball in "$API_TARBALL" "$WEB_TARBALL"; do
            if [ ! -s "$tarball" ]; then
              echo "::error::${tarball} was not built -- refusing to publish a release the"
              echo "::error::stamped formulas would point at with nothing behind it"
              exit 1
            fi
          done

          # Resolved before anything was stamped, because it is what decided
          # where the formulas' sha256 came from: the served bytes stay served,
          # and the formulas already agree with them.
          if [ "${SERVED}" = "true" ]; then
            echo "::notice::${ASSET_TAG} already carries both tarballs -- reusing it"
            exit 0
          fi

          if gh release view "$ASSET_TAG" -R "$REPO" >/dev/null 2>&1; then
            if [ "$ASSET_TAG" = "$VERSION" ]; then
              # Unreachable by construction (the resolve step only picks
              # $VERSION when both tarballs are already on it), and a guard
              # rather than a comment because the alternative below deletes
              # what it is pointed at -- never a real release.
              echo "::error::${VERSION} is incomplete and an immutable release cannot gain"
              echo "::error::assets -- re-run so the tarballs are served from their own release"
              exit 1
            fi
            # A half-published sidecar (an interrupted create leaves a draft):
            # it can never gain the missing asset, so it is retired and cut
            # again rather than pointed at.
            echo "::notice::${ASSET_TAG} exists without both tarballs -- retiring it"
            if ! gh release delete "$ASSET_TAG" -R "$REPO" --yes --cleanup-tag; then
              echo "::error::${ASSET_TAG} is incomplete and could not be deleted, and an"
              echo "::error::immutable release can never gain the missing tarball. Delete it"
              echo "::error::by hand (or publish under the next patch version) and re-run."
              exit 1
            fi
          fi

          # The sidecar names the code it ships: the target tag's own commit,
          # from the release-source checkout.
          TARGET_SHA=$(git -C release-source rev-parse HEAD)
          cat > /tmp/homebrew-assets-notes.md <<NOTES
          Homebrew source tarballs for **nyxGPT ${VERSION}**.

          **This is not a release** -- see [${VERSION}](https://github.com/${REPO}/releases/tag/${VERSION})
          for that. Releases in this repository are immutable, so a published release can
          never gain an asset; the vendored \`nyxgpt-api\` / \`nyxgpt-web\` source tarballs the
          stable Homebrew formulas install from are published here instead, attached at
          creation (#3763).

          \`\`\`bash
          brew tap dkblinux98/nyxgpt && (brew tap-trust dkblinux98/nyxgpt || brew trust dkblinux98/nyxgpt || true) && brew install nyxgpt-api nyxgpt-web
          \`\`\`
          NOTES

          # Assets go on AT CREATION -- never uploaded afterwards, which
          # immutability forbids. `--prerelease --latest=false` keeps this off
          # the repository's "Latest" release and out of the `released` event,
          # so it cannot re-trigger this workflow.
          gh release create "$ASSET_TAG" \
            -R "$REPO" \
            --target "$TARGET_SHA" \
            --title "nyxGPT $VERSION (Homebrew tarballs)" \
            --prerelease \
            --latest=false \
            --notes-file /tmp/homebrew-assets-notes.md \
            "$API_TARBALL" "$WEB_TARBALL"

      - name: Verify the serving release carries both tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Verifying the mutation, not assuming it: the formulas pushed below
          # point at these two assets by URL, so a release missing either one
          # is an uninstallable formula on every Mac that taps it.
          ASSETS=$(gh release view "$ASSET_TAG" -R "$REPO" --json assets \
            --jq '[.assets[].name] | join(" ")')
          echo "assets on ${ASSET_TAG}: ${ASSETS}"
          for name in "nyxgpt-api-${VERSION}.tar.gz" "nyxgpt-web-${VERSION}.tar.gz"; do
            case " $ASSETS " in
              *" $name "*) ;;
              *)
                echo "::error::release ${ASSET_TAG} does not carry ${name}"
                exit 1 ;;
            esac
          done
          # The sidecar must never displace the release itself as "Latest".
          LATEST=$(gh release view -R "$REPO" --json tagName --jq .tagName 2>/dev/null || echo "(none)")
          echo "repository latest=${LATEST}"
          if [ "$ASSET_TAG" != "$VERSION" ] && [ "$LATEST" = "$ASSET_TAG" ]; then
            echo "::error::${ASSET_TAG} became the repository's latest release"
            exit 1
          fi

          # The formulas' `url` must name the release the assets are on --
          # a mismatch here is a formula that 404s at `brew install`.
          for formula in dist/homebrew/nyxgpt-api.rb dist/homebrew/nyxgpt-web.rb; do
            grep -q "releases/download/${ASSET_TAG}/" "$formula" || {
              echo "::error::${formula} is not stamped against ${ASSET_TAG}"
              exit 1; }
          done

          # ...and its `sha256` must be the digest of the bytes that release
          # actually serves. A formula pointing at the right URL with the wrong
          # digest fails `brew install` checksum verification on every machine,
          # and an immutable release can never be corrected to match -- so this
          # is checked against the downloaded asset, not against what this run
          # believes it published. Tarball builds are not byte-reproducible, so
          # "we just built these" is not evidence (#3763).
          CHECK_DIR="$(mktemp -d)"
          for name in nyxgpt-api nyxgpt-web; do
            asset="${name}-${VERSION}.tar.gz"
            gh release download "$ASSET_TAG" -R "$REPO" --pattern "$asset" --dir "$CHECK_DIR"
            served=$(sha256sum "${CHECK_DIR}/${asset}" | cut -d ' ' -f 1)
            stamped=$(sed -n 's/^[[:space:]]*sha256 "\([0-9a-f]\{64\}\)"[[:space:]]*$/\1/p' \
              "dist/homebrew/${name}.rb" | head -1)
            echo "${name}: served=${served} stamped=${stamped:-(none)}"
            if [ "$served" != "$stamped" ]; then
              echo "::error::${name}.rb is stamped sha256=${stamped:-(none)} but ${ASSET_TAG}"
              echo "::error::serves ${served} -- every \`brew install ${name}\` would fail"
              echo "::error::checksum verification, and the released bytes cannot be changed."
              exit 1
            fi
          done
          rm -rf "$CHECK_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-tap-formulas-${{ env.VERSION }}
          path: dist/homebrew/*.rb

      - name: Push stamped formulas to the remote tap
        if: ${{ vars.HOMEBREW_TAP_REPO != '' }}
        env:
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_REPO is set but HOMEBREW_TAP_TOKEN is missing -- skipping tap push."
            echo "::warning::Formulas are still uploaded as a workflow artifact, and the tarballs"
            echo "::warning::they point at are published on the ${ASSET_TAG} release."
            exit 0
          fi
          TAP_DIR="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula"
          cp dist/homebrew/nyxgpt-api.rb "$TAP_DIR/Formula/nyxgpt-api.rb"
          cp dist/homebrew/nyxgpt-web.rb "$TAP_DIR/Formula/nyxgpt-web.rb"
          cd "$TAP_DIR"
          git config user.name "nyxgpt-release-bot"
          git config user.email "actions@github.com"
          git add Formula/nyxgpt-api.rb Formula/nyxgpt-web.rb
          if git diff --cached --quiet; then
            echo "Tap formulas unchanged for ${VERSION} -- nothing to push"
          else
            git commit -m "nyxgpt ${VERSION}"
            git push origin HEAD
          fi

      - name: Remote tap not configured
        if: ${{ vars.HOMEBREW_TAP_REPO == '' }}
        run: |
          echo "::notice::HOMEBREW_TAP_REPO is not set -- the owner needs to create a remote tap repo"
          echo "::notice::(e.g. dkblinux98/homebrew-nyxgpt), set this repo variable, and add a"
          echo "::notice::HOMEBREW_TAP_TOKEN secret with push access. See docs/homebrew.md#remote-tap."
          echo "::notice::Stamped formulas for this release are attached as a workflow artifact meanwhile."

  artifact-install-smoke:
    # Closes #3622's CI acceptance criterion (carried from #3508): installs
    # nyxgpt purely from the just-published PyPI artifact, with NO repo
    # checkout anywhere in this job, then runs the same
    # install -> verify -> down cycle as scripts/systemd-native-smoke.sh
    # (that script itself lives in the repo, so it can't be invoked here
    # without a checkout -- the cycle is inlined instead).
    if: ${{ !inputs.tap_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Wait for PyPI to serve this version
        run: |
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/nyxgpt/${VERSION}/json")
            [ "$code" = "200" ] && break
            echo "pypi.org does not serve nyxgpt==${VERSION} yet (attempt $i/30, http $code) -- retrying in 20s"
            sleep 20
          done
          if [ "$code" != "200" ]; then
            echo "::error::pypi.org never served nyxgpt==${VERSION} -- is release_ceremony.sh Phase 2 done?"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nyxgpt from PyPI (no repo checkout)
        run: pip install "nyxgpt==${VERSION}"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Ensure a systemd --user session is reachable
        run: |
          if ! systemctl --user status >/dev/null 2>&1; then
            echo "No systemd --user session detected; enabling lingering for $(whoami)"
            sudo loginctl enable-linger "$(whoami)" || true
            RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
            echo "XDG_RUNTIME_DIR=${RUNTIME_DIR}" >> "$GITHUB_ENV"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=${RUNTIME_DIR}/bus" >> "$GITHUB_ENV"
          fi

      - name: Seed ~/.nyxGPT/config.ini from the installed package
        run: |
          EXAMPLE_CONFIG=$(python -c "from nyxgpt import config_wizard; print(config_wizard._EXAMPLE_CONFIG_PATH)")
          mkdir -p "$HOME/.nyxGPT"
          cp "$EXAMPLE_CONFIG" "$HOME/.nyxGPT/config.ini"

      - name: nyxgpt ops install
        run: nyxgpt ops install --skip-observability

      - name: Verify systemd --user units and endpoints are up
        run: |
          fail=0
          for unit in nyxgpt-api nyxgpt-web nyxgpt-ollama nyxgpt-cassandra-logs nyxgpt-ollama-logs; do
            state=$(systemctl --user is-active "$unit.service" 2>/dev/null || echo inactive)
            echo "  $unit -> $state"
            [ "$state" = "active" ] || { echo "::error::$unit is not active"; fail=1; }
          done
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$2")
            echo "  $1 -> $code (expect $3)"
            [ "$code" = "$3" ] || { echo "::error::$1 expected $3, got $code"; fail=1; }
          }
          check "api  /health" http://127.0.0.1:8000/health 200
          check "web  /"       http://127.0.0.1:3000/ 200
          exit "$fail"

      - name: Diagnostics on failure
        if: failure()
        run: |
          systemctl --user status nyxgpt-api nyxgpt-web nyxgpt-ollama --no-pager -l || true
          tail -n 80 "$HOME/.nyxGPT/logs/nyxgpt-api.err.log" 2>/dev/null || true
          tail -n 80 "$HOME/.nyxGPT/logs/nyxgpt-web.err.log" 2>/dev/null || true

      - name: nyxgpt ops down
        if: always()
        run: nyxgpt ops down || true

  ec2-linux-user-data-smoke:
    # Target-OS provisioning CI coverage (P6-12/#3511): renders the Linux
    # EC2 user-data bootstrap script via `nyxgpt cloud user-data` from the
    # just-published PyPI artifact (no repo checkout), then executes the
    # *rendered script itself* as root -- exercising the actual artifact
    # this feature produces, not a hand-copied equivalent of its steps
    # (unlike artifact-install-smoke above, which drives the same
    # install -> verify -> down cycle by hand). See docs/cloud.md's target-OS
    # support matrix: this covers the Linux-AMI half; EC2 Mac has no
    # available GitHub Actions runner and is documentation-verified only.
    if: ${{ !inputs.tap_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
      # A purpose-created account that has never logged in -- the same state
      # `ec2-user`/`ubuntu` are in on an EC2 instance's first boot.
      #
      # Deliberately NOT the `runner` account. `runner` already has an active
      # logind session (so /run/user/<uid> and its D-Bus bus exist) and is
      # already in the `docker` group, which would mask the two failure modes
      # this job exists to catch: a bootstrap that never forwards
      # XDG_RUNTIME_DIR/DBUS_SESSION_BUS_ADDRESS across the `sudo -u`
      # boundary, and one that never installs Docker or grants the target
      # user access to it. The "Create a fresh, never-logged-in target user"
      # step below asserts both preconditions actually hold before the
      # bootstrap runs, so this job can never silently drift back to masking.
      NYXGPT_TARGET_USER: nyxgpt-ec2
    steps:
      - name: Wait for PyPI to serve this version
        run: |
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/nyxgpt/${VERSION}/json")
            [ "$code" = "200" ] && break
            echo "pypi.org does not serve nyxgpt==${VERSION} yet (attempt $i/30, http $code) -- retrying in 20s"
            sleep 20
          done
          if [ "$code" != "200" ]; then
            echo "::error::pypi.org never served nyxgpt==${VERSION} -- is release_ceremony.sh Phase 2 done?"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nyxgpt from PyPI (no repo checkout)
        run: pip install "nyxgpt==${VERSION}"

      - name: Create a fresh, never-logged-in target user
        run: |
          sudo useradd --create-home --shell /bin/bash "$NYXGPT_TARGET_USER"
          uid=$(id -u "$NYXGPT_TARGET_USER")

          # Assert the preconditions that make this job meaningful. If either
          # is already satisfied the run would prove nothing, so fail loudly
          # rather than quietly going back to masking the bugs.
          if [ -d "/run/user/$uid" ]; then
            echo "::error::$NYXGPT_TARGET_USER already has a runtime dir (/run/user/$uid) -- this job would mask the D-Bus/session bug"
            exit 1
          fi
          if sudo -u "$NYXGPT_TARGET_USER" docker info >/dev/null 2>&1; then
            echo "::error::$NYXGPT_TARGET_USER can already reach the Docker daemon -- this job would mask the docker-group bug"
            exit 1
          fi
          echo "$NYXGPT_TARGET_USER: no logind session, no Docker access -- matches an EC2 instance's first boot"

      - name: Render and run the Linux EC2 user-data bootstrap script
        run: |
          nyxgpt cloud user-data --os linux --version "$VERSION" --output /tmp/ec2-user-data.sh
          sudo env "NYXGPT_TARGET_USER=${NYXGPT_TARGET_USER}" bash /tmp/ec2-user-data.sh

      - name: Verify systemd --user units and endpoints are up
        run: |
          uid=$(id -u "$NYXGPT_TARGET_USER")
          # Every check runs as the target user, through the same environment
          # the bootstrap is responsible for making usable -- inspecting the
          # `runner` account's own units would not test anything the
          # bootstrap did.
          as_target() {
            sudo -u "$NYXGPT_TARGET_USER" -H env \
              "XDG_RUNTIME_DIR=/run/user/$uid" \
              "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" "$@"
          }

          fail=0
          units="nyxgpt-api nyxgpt-web nyxgpt-cassandra-logs nyxgpt-ollama-logs"
          # Ollama's official installer enables a *system-wide* ollama.service
          # on the same port; `ops install` adopts it rather than starting its
          # own nyxgpt-ollama.service when it is already up
          # (_reconcile_system_ollama_service, #3632).
          if systemctl is-active --quiet ollama.service; then
            echo "  nyxgpt-ollama -> skipped (system ollama.service adopted instead)"
          else
            units="$units nyxgpt-ollama"
          fi
          for unit in $units; do
            state=$(as_target systemctl --user is-active "$unit.service" 2>/dev/null || echo inactive)
            echo "  $unit -> $state"
            [ "$state" = "active" ] || { echo "::error::$unit is not active"; fail=1; }
          done

          # The Docker install and docker-group membership the bootstrap adds
          # are what let `_ensure_cassandra_container` run as the target user
          # -- assert the container it is supposed to create is actually up,
          # not just that `ops install` exited 0.
          cassandra=$(docker inspect -f '{{.State.Status}}' nyxgpt-cassandra 2>/dev/null || echo absent)
          echo "  nyxgpt-cassandra (docker) -> $cassandra"
          [ "$cassandra" = "running" ] || { echo "::error::nyxgpt-cassandra container is not running"; fail=1; }

          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$2")
            echo "  $1 -> $code (expect $3)"
            [ "$code" = "$3" ] || { echo "::error::$1 expected $3, got $code"; fail=1; }
          }
          check "api  /health" http://127.0.0.1:8000/health 200
          check "web  /"       http://127.0.0.1:3000/ 200
          exit "$fail"

      - name: Diagnostics on failure
        if: failure()
        run: |
          uid=$(id -u "$NYXGPT_TARGET_USER") || exit 0
          target_home=$(getent passwd "$NYXGPT_TARGET_USER" | cut -d: -f6)
          as_target() {
            sudo -u "$NYXGPT_TARGET_USER" -H env \
              "XDG_RUNTIME_DIR=/run/user/$uid" \
              "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" "$@"
          }
          as_target systemctl --user status nyxgpt-api nyxgpt-web nyxgpt-ollama --no-pager -l || true
          sudo tail -n 80 "$target_home/.nyxGPT/logs/nyxgpt-api.err.log" 2>/dev/null || true
          sudo tail -n 80 "$target_home/.nyxGPT/logs/nyxgpt-web.err.log" 2>/dev/null || true
          docker logs --tail 40 nyxgpt-cassandra 2>&1 || true

      - name: nyxgpt ops down
        if: always()
        run: |
          uid=$(id -u "$NYXGPT_TARGET_USER") || exit 0
          target_home=$(getent passwd "$NYXGPT_TARGET_USER" | cut -d: -f6)
          sudo -u "$NYXGPT_TARGET_USER" -H env \
            "XDG_RUNTIME_DIR=/run/user/$uid" \
            "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" \
            "$target_home/.nyxGPT/opt/nyxgpt-cli/bin/nyxgpt" ops down || true
