name: Release Artifacts

# Publishes the artifacts a repo-less, credential-holding machine needs to
# install nyxGPT (#3622, split B of the repo-less portability requirement --
# CLAUDE.md 2026-08-01): container images to GHCR and a remote Homebrew tap.
#
# PyPI is NOT published here -- every PyPI upload, on every channel, goes
# through the one publish pipeline, release-publish-pypi.yml (#3727, owner
# decision 2026-08-11: a single release pipeline). That workflow publishes
# `3.0.0rcN` on dispatch and `3.0.0` when scripts/release_ceremony.sh Phase 2
# delegates to it with the release tag and its confirmation -- two channels,
# nothing on a schedule (#3735). This workflow picks up right after Phase 1 of that
# ceremony publishes the GitHub Release, which is what triggers it below.
#
# The `homebrew-tap` job below owns the STABLE formulas (`nyxgpt-api.rb`,
# `nyxgpt-web.rb`) exclusively -- `brew install nyxgpt-api` resolves to the
# latest stable release and nothing else may move it. Release candidates get
# their own `nyxgpt-api@<release>rc`/`nyxgpt-web@<release>rc` formulas,
# stamped from the same templates by release-publish-pypi.yml's
# `homebrew-tap-rc` job (#3727, named for the release line by #3735). The
# `released` trigger above is part of that separation: an rc prerelease fires
# `prereleased`, so it cannot start this workflow.
#
# The Homebrew tap job additionally needs a remote tap repository (e.g.
# dkblinux98/homebrew-nyxgpt) and a push token the owner provisions once --
# see docs/homebrew.md#remote-tap-repo-less-install. Until `vars.
# HOMEBREW_TAP_REPO` is set, that job's push step logs a skip and still
# succeeds; the stamped formulas are uploaded as a workflow artifact either
# way, and the tarballs are always attached to the GitHub Release (that part
# needs no owner secret -- the default GITHUB_TOKEN can write release
# assets on this repo).
#
# GHCR image publishing also needs no owner secret: GITHUB_TOKEN with
# `packages: write` is sufficient to push to ghcr.io/<owner>/...  (the owner
# may still want to flip the resulting package's visibility to public in
# GitHub package settings after the first publish).

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to (re-)publish artifacts for, e.g. 2.1.0 (must already exist as a tag)'
        required: true

permissions:
  contents: read

jobs:
  container-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nyxgpt-api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nyxgpt-api:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/nyxgpt-api:latest

      - name: Build and push nyxgpt-web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nyxgpt-web:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/nyxgpt-web:latest

  homebrew-tap:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload (assets on this repo's own release)
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build tarballs and stamp formulas
        run: |
          python scripts/build_homebrew_artifacts.py "$VERSION" dist/homebrew \
            "https://github.com/${{ github.repository }}/releases/download/${VERSION}"

      - name: Attach tarballs to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$VERSION" \
            dist/homebrew/dist/nyxgpt-api-"$VERSION".tar.gz \
            dist/homebrew/dist/nyxgpt-web-"$VERSION".tar.gz \
            --clobber -R "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-tap-formulas-${{ env.VERSION }}
          path: dist/homebrew/*.rb

      - name: Push stamped formulas to the remote tap
        if: ${{ vars.HOMEBREW_TAP_REPO != '' }}
        env:
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_REPO is set but HOMEBREW_TAP_TOKEN is missing -- skipping tap push."
            echo "::warning::Formulas are still attached as a workflow artifact and on the release."
            exit 0
          fi
          TAP_DIR="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula"
          cp dist/homebrew/nyxgpt-api.rb "$TAP_DIR/Formula/nyxgpt-api.rb"
          cp dist/homebrew/nyxgpt-web.rb "$TAP_DIR/Formula/nyxgpt-web.rb"
          cd "$TAP_DIR"
          git config user.name "nyxgpt-release-bot"
          git config user.email "actions@github.com"
          git add Formula/nyxgpt-api.rb Formula/nyxgpt-web.rb
          if git diff --cached --quiet; then
            echo "Tap formulas unchanged for ${VERSION} -- nothing to push"
          else
            git commit -m "nyxgpt ${VERSION}"
            git push origin HEAD
          fi

      - name: Remote tap not configured
        if: ${{ vars.HOMEBREW_TAP_REPO == '' }}
        run: |
          echo "::notice::HOMEBREW_TAP_REPO is not set -- the owner needs to create a remote tap repo"
          echo "::notice::(e.g. dkblinux98/homebrew-nyxgpt), set this repo variable, and add a"
          echo "::notice::HOMEBREW_TAP_TOKEN secret with push access. See docs/homebrew.md#remote-tap."
          echo "::notice::Stamped formulas for this release are attached as a workflow artifact meanwhile."

  artifact-install-smoke:
    # Closes #3622's CI acceptance criterion (carried from #3508): installs
    # nyxgpt purely from the just-published PyPI artifact, with NO repo
    # checkout anywhere in this job, then runs the same
    # install -> verify -> down cycle as scripts/systemd-native-smoke.sh
    # (that script itself lives in the repo, so it can't be invoked here
    # without a checkout -- the cycle is inlined instead).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Wait for PyPI to serve this version
        run: |
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/nyxgpt/${VERSION}/json")
            [ "$code" = "200" ] && break
            echo "pypi.org does not serve nyxgpt==${VERSION} yet (attempt $i/30, http $code) -- retrying in 20s"
            sleep 20
          done
          if [ "$code" != "200" ]; then
            echo "::error::pypi.org never served nyxgpt==${VERSION} -- is release_ceremony.sh Phase 2 done?"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nyxgpt from PyPI (no repo checkout)
        run: pip install "nyxgpt==${VERSION}"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Ensure a systemd --user session is reachable
        run: |
          if ! systemctl --user status >/dev/null 2>&1; then
            echo "No systemd --user session detected; enabling lingering for $(whoami)"
            sudo loginctl enable-linger "$(whoami)" || true
            RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
            echo "XDG_RUNTIME_DIR=${RUNTIME_DIR}" >> "$GITHUB_ENV"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=${RUNTIME_DIR}/bus" >> "$GITHUB_ENV"
          fi

      - name: Seed ~/.nyxGPT/config.ini from the installed package
        run: |
          EXAMPLE_CONFIG=$(python -c "from nyxgpt import config_wizard; print(config_wizard._EXAMPLE_CONFIG_PATH)")
          mkdir -p "$HOME/.nyxGPT"
          cp "$EXAMPLE_CONFIG" "$HOME/.nyxGPT/config.ini"

      - name: nyxgpt ops install
        run: nyxgpt ops install --skip-observability

      - name: Verify systemd --user units and endpoints are up
        run: |
          fail=0
          for unit in nyxgpt-api nyxgpt-web nyxgpt-ollama nyxgpt-cassandra-logs nyxgpt-ollama-logs; do
            state=$(systemctl --user is-active "$unit.service" 2>/dev/null || echo inactive)
            echo "  $unit -> $state"
            [ "$state" = "active" ] || { echo "::error::$unit is not active"; fail=1; }
          done
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$2")
            echo "  $1 -> $code (expect $3)"
            [ "$code" = "$3" ] || { echo "::error::$1 expected $3, got $code"; fail=1; }
          }
          check "api  /health" http://127.0.0.1:8000/health 200
          check "web  /"       http://127.0.0.1:3000/ 200
          exit "$fail"

      - name: Diagnostics on failure
        if: failure()
        run: |
          systemctl --user status nyxgpt-api nyxgpt-web nyxgpt-ollama --no-pager -l || true
          tail -n 80 "$HOME/.nyxGPT/logs/nyxgpt-api.err.log" 2>/dev/null || true
          tail -n 80 "$HOME/.nyxGPT/logs/nyxgpt-web.err.log" 2>/dev/null || true

      - name: nyxgpt ops down
        if: always()
        run: nyxgpt ops down || true

  ec2-linux-user-data-smoke:
    # Target-OS provisioning CI coverage (P6-12/#3511): renders the Linux
    # EC2 user-data bootstrap script via `nyxgpt cloud user-data` from the
    # just-published PyPI artifact (no repo checkout), then executes the
    # *rendered script itself* as root -- exercising the actual artifact
    # this feature produces, not a hand-copied equivalent of its steps
    # (unlike artifact-install-smoke above, which drives the same
    # install -> verify -> down cycle by hand). See docs/cloud.md's target-OS
    # support matrix: this covers the Linux-AMI half; EC2 Mac has no
    # available GitHub Actions runner and is documentation-verified only.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
      # A purpose-created account that has never logged in -- the same state
      # `ec2-user`/`ubuntu` are in on an EC2 instance's first boot.
      #
      # Deliberately NOT the `runner` account. `runner` already has an active
      # logind session (so /run/user/<uid> and its D-Bus bus exist) and is
      # already in the `docker` group, which would mask the two failure modes
      # this job exists to catch: a bootstrap that never forwards
      # XDG_RUNTIME_DIR/DBUS_SESSION_BUS_ADDRESS across the `sudo -u`
      # boundary, and one that never installs Docker or grants the target
      # user access to it. The "Create a fresh, never-logged-in target user"
      # step below asserts both preconditions actually hold before the
      # bootstrap runs, so this job can never silently drift back to masking.
      NYXGPT_TARGET_USER: nyxgpt-ec2
    steps:
      - name: Wait for PyPI to serve this version
        run: |
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/nyxgpt/${VERSION}/json")
            [ "$code" = "200" ] && break
            echo "pypi.org does not serve nyxgpt==${VERSION} yet (attempt $i/30, http $code) -- retrying in 20s"
            sleep 20
          done
          if [ "$code" != "200" ]; then
            echo "::error::pypi.org never served nyxgpt==${VERSION} -- is release_ceremony.sh Phase 2 done?"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nyxgpt from PyPI (no repo checkout)
        run: pip install "nyxgpt==${VERSION}"

      - name: Create a fresh, never-logged-in target user
        run: |
          sudo useradd --create-home --shell /bin/bash "$NYXGPT_TARGET_USER"
          uid=$(id -u "$NYXGPT_TARGET_USER")

          # Assert the preconditions that make this job meaningful. If either
          # is already satisfied the run would prove nothing, so fail loudly
          # rather than quietly going back to masking the bugs.
          if [ -d "/run/user/$uid" ]; then
            echo "::error::$NYXGPT_TARGET_USER already has a runtime dir (/run/user/$uid) -- this job would mask the D-Bus/session bug"
            exit 1
          fi
          if sudo -u "$NYXGPT_TARGET_USER" docker info >/dev/null 2>&1; then
            echo "::error::$NYXGPT_TARGET_USER can already reach the Docker daemon -- this job would mask the docker-group bug"
            exit 1
          fi
          echo "$NYXGPT_TARGET_USER: no logind session, no Docker access -- matches an EC2 instance's first boot"

      - name: Render and run the Linux EC2 user-data bootstrap script
        run: |
          nyxgpt cloud user-data --os linux --version "$VERSION" --output /tmp/ec2-user-data.sh
          sudo env "NYXGPT_TARGET_USER=${NYXGPT_TARGET_USER}" bash /tmp/ec2-user-data.sh

      - name: Verify systemd --user units and endpoints are up
        run: |
          uid=$(id -u "$NYXGPT_TARGET_USER")
          # Every check runs as the target user, through the same environment
          # the bootstrap is responsible for making usable -- inspecting the
          # `runner` account's own units would not test anything the
          # bootstrap did.
          as_target() {
            sudo -u "$NYXGPT_TARGET_USER" -H env \
              "XDG_RUNTIME_DIR=/run/user/$uid" \
              "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" "$@"
          }

          fail=0
          units="nyxgpt-api nyxgpt-web nyxgpt-cassandra-logs nyxgpt-ollama-logs"
          # Ollama's official installer enables a *system-wide* ollama.service
          # on the same port; `ops install` adopts it rather than starting its
          # own nyxgpt-ollama.service when it is already up
          # (_reconcile_system_ollama_service, #3632).
          if systemctl is-active --quiet ollama.service; then
            echo "  nyxgpt-ollama -> skipped (system ollama.service adopted instead)"
          else
            units="$units nyxgpt-ollama"
          fi
          for unit in $units; do
            state=$(as_target systemctl --user is-active "$unit.service" 2>/dev/null || echo inactive)
            echo "  $unit -> $state"
            [ "$state" = "active" ] || { echo "::error::$unit is not active"; fail=1; }
          done

          # The Docker install and docker-group membership the bootstrap adds
          # are what let `_ensure_cassandra_container` run as the target user
          # -- assert the container it is supposed to create is actually up,
          # not just that `ops install` exited 0.
          cassandra=$(docker inspect -f '{{.State.Status}}' nyxgpt-cassandra 2>/dev/null || echo absent)
          echo "  nyxgpt-cassandra (docker) -> $cassandra"
          [ "$cassandra" = "running" ] || { echo "::error::nyxgpt-cassandra container is not running"; fail=1; }

          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$2")
            echo "  $1 -> $code (expect $3)"
            [ "$code" = "$3" ] || { echo "::error::$1 expected $3, got $code"; fail=1; }
          }
          check "api  /health" http://127.0.0.1:8000/health 200
          check "web  /"       http://127.0.0.1:3000/ 200
          exit "$fail"

      - name: Diagnostics on failure
        if: failure()
        run: |
          uid=$(id -u "$NYXGPT_TARGET_USER") || exit 0
          target_home=$(getent passwd "$NYXGPT_TARGET_USER" | cut -d: -f6)
          as_target() {
            sudo -u "$NYXGPT_TARGET_USER" -H env \
              "XDG_RUNTIME_DIR=/run/user/$uid" \
              "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" "$@"
          }
          as_target systemctl --user status nyxgpt-api nyxgpt-web nyxgpt-ollama --no-pager -l || true
          sudo tail -n 80 "$target_home/.nyxGPT/logs/nyxgpt-api.err.log" 2>/dev/null || true
          sudo tail -n 80 "$target_home/.nyxGPT/logs/nyxgpt-web.err.log" 2>/dev/null || true
          docker logs --tail 40 nyxgpt-cassandra 2>&1 || true

      - name: nyxgpt ops down
        if: always()
        run: |
          uid=$(id -u "$NYXGPT_TARGET_USER") || exit 0
          target_home=$(getent passwd "$NYXGPT_TARGET_USER" | cut -d: -f6)
          sudo -u "$NYXGPT_TARGET_USER" -H env \
            "XDG_RUNTIME_DIR=/run/user/$uid" \
            "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" \
            "$target_home/.nyxGPT/opt/nyxgpt-cli/bin/nyxgpt" ops down || true
