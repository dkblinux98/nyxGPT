name: PyPI Publish (dev / rc / stable)

run-name: >-
  publish ${{ inputs.channel || 'dev' }}${{ inputs.dry_run && ' [dry run]' || '' }}
  from ${{ github.ref_name }}

# The ONE build-and-publish pipeline for PyPI (#3727, owner decision
# 2026-08-11: "single release pipeline -- no parallel release
# workflows/scripts"). One core, three entry points:
#
#   dev     nightly schedule -> `3.0.0.devN` from the release-branch tip,
#           skipped when the tip has not moved since the last successful
#           nightly. This is what makes acceptance testing of *unreleased*
#           code possible: every repo-less path installs from PyPI, so
#           without a published build it can only ever exercise the last
#           stable release -- never the tip carrying the acceptance-failure
#           fixes merged during that same round of testing.
#   rc      manual dispatch  -> a deliberate `3.0.0rcN`. The rc channel is the
#           only one with a step beyond PyPI: `homebrew-tap-rc` below also
#           cuts a GitHub *prerelease* carrying the service tarballs and
#           stamps `nyxgpt-api-rc` / `nyxgpt-web-rc` into the tap, so a
#           candidate is installable on macOS the same repo-less way a
#           release is. It never writes the stable formulas.
#   stable  scripts/release_ceremony.sh Phase 2 delegates here. The ceremony
#           keeps only its ceremony-exclusive steps (master merge, tag,
#           Homebrew tap, GitHub Release, sign-off); a dev or rc build never
#           runs any of them.
#
# PEP 440 orders `3.0.0.devN < 3.0.0rcN < 3.0.0`, so a nightly can never
# shadow a candidate and neither can shadow the release.
#
# Guardrails (each one enforced, not just described):
#   * scheduled + dispatch triggers only -- there is no push, tag or release
#     trigger below;
#   * release branches only -- the version step refuses any ref that is not
#     `v<X.Y.Z>` matching pyproject.toml's declared version;
#   * pre-release version for dev and rc -- what gets uploaded is always
#     `<release>.devN` / `<release>rcN`, so `pip install nyxgpt` cannot
#     resolve to it (pip excludes pre-releases unless the user passes
#     `--pre` or pins the version exactly);
#   * stable is ceremony-only -- it additionally requires the release tag at
#     the built commit (the ceremony creates it in Phase 1, before it
#     delegates) and a confirmation token only the ceremony passes, so a
#     release cannot be published by dispatching this workflow by hand;
#   * no version reuse -- the next number is read from what PyPI already
#     serves, and PyPI itself rejects a re-upload.
#
# The guardrails and the version arithmetic live in
# `src/nyxgpt/release_candidate.py` (unit-tested), not in shell here, so CI,
# the ceremony and `nyxgpt release publish` can never disagree about what a
# channel publishes.
#
# AUTH: PyPI Trusted Publishing (OIDC) only -- there is no stored PyPI token
# in this repo or in Actions. The publisher on pypi.org must name THIS file:
#   pypi.org -> project `nyxgpt` -> Publishing -> add a GitHub publisher with
#   owner `dkblinux98`, repository `nyxGPT`, workflow
#   `release-publish-pypi.yml`, environment blank.
# See docs/cloud.md#pypi-publishing-dev-rc-and-stable.

on:
  schedule:
    # Nightly dev build from the default branch (the active release line).
    - cron: '27 7 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Publish channel'
        type: choice
        options:
          - rc
          - dev
          - stable
        default: rc
      number:
        description: 'Explicit rc/dev number (blank = next unused, resolved from PyPI)'
        required: false
        default: ''
      dry_run:
        description: 'Build, check and smoke-install only -- upload nothing to PyPI'
        type: boolean
        default: false
      confirm:
        description: 'stable channel only: the ceremony confirmation token'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read this workflow's own run history (nightly no-op check)
      id-token: write # PyPI Trusted Publishing (OIDC) -- the only credential
    outputs:
      # Consumed by homebrew-tap-rc below, which is the rc channel's only
      # additional step. `publish` is 'false' when a nightly no-ops.
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are the stable channel's guardrail: the release tag must be
          # at the built commit, and a shallow checkout carries none.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: pip install --quiet build twine httpx

      - name: Resolve the version and pin pyproject.toml
        id: version
        env:
          CHANNEL: ${{ inputs.channel || 'dev' }}
          NUMBER: ${{ inputs.number }}
          CONFIRM: ${{ inputs.confirm }}
          # The nightly no-op check reads this workflow's own run history.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `nyxgpt.release_candidate` only needs stdlib + httpx, so it runs
          # straight from the checkout -- no need to install the package
          # (whose own version is what this step is about to rewrite).
          PYTHONPATH: src
        run: |
          set -euo pipefail
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          # This is the guardrail: the module exits non-zero for any ref that
          # is not v<X.Y.Z> matching the declared version, for a stable build
          # without the ceremony's tag and confirmation, and for a version
          # PyPI already serves.
          ARGS=(--branch "$GITHUB_REF_NAME" --channel "$CHANNEL" --pin pyproject.toml)
          if [ -n "${NUMBER}" ]; then
            ARGS+=(--number "${NUMBER}")
          fi
          if [ "${CHANNEL}" = "dev" ]; then
            # Unique per run (PyPI versions are immutable) and a no-op when
            # the tip has not moved since the last successful nightly.
            ARGS+=(--run-number "$GITHUB_RUN_NUMBER" --skip-if-unchanged \
                   --head-sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
                   --exclude-run-id "$GITHUB_RUN_ID")
          fi
          if [ "${CHANNEL}" = "stable" ]; then
            ARGS+=(--confirm "${CONFIRM}" \
                   --tags-at-head "$(git tag --points-at HEAD | tr '\n' ' ')")
          fi
          VERSION=$(python -m nyxgpt.release_candidate "${ARGS[@]}")
          if [ "${VERSION}" = "SKIP" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} is unchanged since the last nightly -- nothing to publish."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION} (${CHANNEL}) from ${GITHUB_REF_NAME}"
          # The pin is build-time only -- it is never committed, so the
          # release branch keeps declaring the stable version it heads for.
          git --no-pager diff -- pyproject.toml

      - name: Build sdist + wheel
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: python -m build

      - name: twine check
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: twine check dist/*

      - name: Clean-venv smoke (the artifact must import and answer --help)
        if: ${{ steps.version.outputs.publish == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv /tmp/smokeenv
          /tmp/smokeenv/bin/pip install --quiet dist/*.whl
          /tmp/smokeenv/bin/python -c "import nyxgpt"
          INSTALLED=$(/tmp/smokeenv/bin/python -c "from importlib.metadata import version; print(version('nyxgpt'))")
          echo "installed version: ${INSTALLED}"
          # The artifact must report the version it claims to be: a pin that
          # resolves to something else would make an acceptance run lie.
          if [ "$INSTALLED" != "$VERSION" ]; then
            echo "::error::built artifact reports ${INSTALLED}, expected ${VERSION}"
            exit 1
          fi
          /tmp/smokeenv/bin/nyxgpt --help >/dev/null

      - uses: actions/upload-artifact@v4
        if: ${{ steps.version.outputs.publish == 'true' }}
        with:
          name: nyxgpt-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Dry run -- nothing uploaded
        if: ${{ steps.version.outputs.publish == 'true' && inputs.dry_run }}
        run: |
          echo "::notice::dry_run: built and verified ${{ steps.version.outputs.version }}, uploaded nothing."

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        if: ${{ steps.version.outputs.publish == 'true' && !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify PyPI serves the build
        if: ${{ steps.version.outputs.publish == 'true' && !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          code=000
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/nyxgpt/${VERSION}/json")
            [ "$code" = "200" ] && break
            echo "pypi.org does not serve nyxgpt==${VERSION} yet (attempt $i/20, http $code) -- retrying in 15s"
            sleep 15
          done
          if [ "$code" != "200" ]; then
            echo "::error::pypi.org never served nyxgpt==${VERSION}"
            exit 1
          fi

      - name: Summary
        if: ${{ steps.version.outputs.publish == 'true' && !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          {
            echo "### \`${VERSION}\` published (${CHANNEL} channel)"
            echo ""
            echo "Built from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`."
            if [ "${CHANNEL}" = "stable" ]; then
              echo "This is the release itself -- published by the owner's ceremony."
            else
              echo "Acceptance-only pre-release. \`pip install nyxgpt\` still resolves"
              echo "to the latest **stable** release."
            fi
            echo ""
            echo '```'
            echo "pip install nyxgpt==${VERSION}"
            echo "nyxgpt cloud user-data --os linux --version ${VERSION}"
            echo "nyxgpt cloud deploy --version ${VERSION}"
            echo '```'
            if [ "${CHANNEL}" = "rc" ]; then
              echo ""
              echo "macOS acceptance (the tap job below stamps these):"
              echo ""
              echo '```'
              echo "brew tap dkblinux98/nyxgpt"
              echo "brew install nyxgpt-api-rc nyxgpt-web-rc"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  homebrew-tap-rc:
    # The rc channel's ONLY additional step (#3727, owner decision
    # 2026-08-11): a candidate has to be installable on macOS the same
    # repo-less way a release is, so an rc publish also cuts a GitHub
    # *prerelease* carrying the service tarballs and stamps `-rc` formulas
    # into the tap.
    #
    # Clobber-safety is the hard requirement, and it is structural rather
    # than conditional:
    #   * this job runs for the rc channel only -- `dev` (the nightly) and
    #     `stable` never reach it, so a nightly is PyPI-only by construction;
    #   * what it writes is `nyxgpt-api-rc.rb` / `nyxgpt-web-rc.rb`. The
    #     stable `nyxgpt-api.rb` / `nyxgpt-web.rb` are different files and
    #     are never built, copied or `git add`ed here, so `brew install
    #     nyxgpt-api` keeps resolving to the latest stable release. (Homebrew
    #     has no pre-release semantics -- channel separation has to live in
    #     the formula names.) The `-rc` formulas declare `conflicts_with`
    #     their stable counterparts, so switching channels on one machine is
    #     an explicit uninstall, never a silent swap;
    #   * the GitHub release is created with `--prerelease --latest=false`,
    #     so it is never the repository's "Latest" release. That also keeps
    #     release-artifacts.yml (which triggers on `release: [released]`,
    #     not `prereleased`) out of this path -- the stable tap push stays
    #     tied to the ceremony's own release.
    needs: publish
    if: >-
      ${{ needs.publish.outputs.publish == 'true'
          && needs.publish.outputs.channel == 'rc'
          && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the prerelease and upload its assets
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit the publish job built, not the branch tip --
          # the branch may have moved while PyPI was being polled, and the
          # tarballs must match the wheel that was just published.
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build tarballs and stamp the rc formulas
        run: |
          python scripts/build_homebrew_artifacts.py "$VERSION" dist/homebrew \
            "https://github.com/${{ github.repository }}/releases/download/${VERSION}" \
            --channel rc

      - name: Assert no stable formula was written
        run: |
          set -euo pipefail
          for stable in nyxgpt-api.rb nyxgpt-web.rb; do
            if [ -e "dist/homebrew/${stable}" ]; then
              echo "::error::an rc build produced ${stable} -- stable formulas must never be"
              echo "::error::written by an rc or dev publish (see this job's header)"
              exit 1
            fi
          done
          ls -1 dist/homebrew/*.rb

      - name: Cut the GitHub prerelease with the service tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > /tmp/rc-notes.md <<NOTES
          Acceptance-only release candidate built from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`.

          **This is not a release.** \`pip install nyxgpt\` and \`brew install nyxgpt-api\`
          both keep resolving to the latest stable version.

          \`\`\`bash
          pip install nyxgpt==${VERSION}
          brew tap dkblinux98/nyxgpt && brew install nyxgpt-api-rc nyxgpt-web-rc
          \`\`\`
          NOTES

          if gh release view "$VERSION" -R "$REPO" >/dev/null 2>&1; then
            echo "::notice::release ${VERSION} already exists -- re-uploading its assets"
          else
            gh release create "$VERSION" \
              -R "$REPO" \
              --target "$GITHUB_SHA" \
              --title "nyxGPT $VERSION (release candidate)" \
              --prerelease \
              --latest=false \
              --notes-file /tmp/rc-notes.md
          fi
          gh release upload "$VERSION" \
            dist/homebrew/dist/nyxgpt-api-"$VERSION".tar.gz \
            dist/homebrew/dist/nyxgpt-web-"$VERSION".tar.gz \
            --clobber -R "$REPO"

      - name: Verify the release is a prerelease and not "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IS_PRERELEASE=$(gh release view "$VERSION" -R "$REPO" --json isPrerelease --jq .isPrerelease)
          # `gh release view` with no tag resolves the repository's "Latest"
          # release; it exits non-zero when there is none at all, which is
          # itself a pass for this check.
          LATEST=$(gh release view -R "$REPO" --json tagName --jq .tagName 2>/dev/null || echo "(none)")
          echo "prerelease=${IS_PRERELEASE}  repository latest=${LATEST}"
          if [ "$IS_PRERELEASE" != "true" ]; then
            echo "::error::${VERSION} is not marked as a prerelease"
            exit 1
          fi
          if [ "$LATEST" = "$VERSION" ]; then
            echo "::error::${VERSION} became the repository's latest release"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-tap-rc-formulas-${{ needs.publish.outputs.version }}
          path: dist/homebrew/*.rb

      - name: Push the rc formulas to the remote tap
        if: ${{ vars.HOMEBREW_TAP_REPO != '' }}
        env:
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_REPO is set but HOMEBREW_TAP_TOKEN is missing -- skipping tap push."
            echo "::warning::The -rc formulas are still attached as a workflow artifact."
            exit 0
          fi
          TAP_DIR="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula"
          # Only the `-rc` formulas -- the stable ones in this tap belong to the
          # ceremony's release-artifacts.yml run and are left exactly as they are.
          cp "dist/homebrew/nyxgpt-api-rc.rb" "$TAP_DIR/Formula/nyxgpt-api-rc.rb"
          cp "dist/homebrew/nyxgpt-web-rc.rb" "$TAP_DIR/Formula/nyxgpt-web-rc.rb"
          cd "$TAP_DIR"
          git config user.name "nyxgpt-release-bot"
          git config user.email "actions@github.com"
          git add "Formula/nyxgpt-api-rc.rb" "Formula/nyxgpt-web-rc.rb"
          # Verifying the mutation: an rc push that touched a stable formula
          # would break `brew install nyxgpt-api` for every user.
          if ! git status --porcelain -- Formula/nyxgpt-api.rb Formula/nyxgpt-web.rb | grep -q .; then
            echo "stable formulas untouched by this rc push (verified)"
          else
            echo "::error::this rc push modified a stable formula -- refusing to push"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "-rc formulas unchanged for ${VERSION} -- nothing to push"
          else
            git commit -m "nyxgpt ${VERSION} (release candidate)"
            git push origin HEAD
          fi

      - name: Remote tap not configured
        if: ${{ vars.HOMEBREW_TAP_REPO == '' }}
        run: |
          echo "::notice::HOMEBREW_TAP_REPO is not set -- the `-rc` formulas for ${VERSION} are"
          echo "::notice::attached as a workflow artifact instead. See docs/homebrew.md#remote-tap."

      - name: Summary
        run: |
          {
            echo "### \`${VERSION}\` also stamped into the Homebrew tap"
            echo ""
            echo "GitHub **prerelease** (never \"latest\") with the service tarballs, plus"
            echo "\`nyxgpt-api-rc\` / \`nyxgpt-web-rc\` formulas. The stable formulas are untouched."
            echo ""
            echo '```bash'
            echo "brew tap dkblinux98/nyxgpt"
            echo "brew install nyxgpt-api-rc nyxgpt-web-rc"
            echo "brew services start nyxgpt-api-rc"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
