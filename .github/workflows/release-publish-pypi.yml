name: PyPI Publish (rc / stable)

# LOAD-BEARING (#3729): both channels arrive as a `workflow_dispatch`, so
# this rendered title is the only record of which channel a finished run
# built. `release_candidate.run_published_channel` matches "publish rc from
# <ref>" to find the commit the last candidate was cut from -- keep the
# wording, the order and the `[dry run]` marker (a dry run uploads nothing
# and must not read as a published candidate).
run-name: >-
  publish ${{ inputs.channel || 'rc' }}${{ inputs.dry_run && ' [dry run]' || '' }}
  from ${{ github.ref_name }}

# The ONE build-and-publish pipeline for PyPI (#3727, owner decision
# 2026-08-11: "single release pipeline -- no parallel release
# workflows/scripts"; channels revised 2026-08-12 by #3735). One core, two
# entry points -- and nothing is ever published on a schedule:
#
#   rc      dispatch -> a deliberate `3.0.0rcN`, by hand or from the sprint
#           autopilot when the sprint reaches agentic-work-complete (#3729).
#           This is what makes acceptance testing of *unreleased* code
#           possible: every repo-less path installs from PyPI, so without a
#           published candidate it can only ever exercise the last stable
#           release -- never the tip carrying the acceptance-failure fixes
#           merged during that same round of testing. The rc channel is the
#           one with a step beyond PyPI: `homebrew-tap-rc` below also cuts a
#           GitHub *prerelease* carrying the service tarballs and stamps
#           `nyxgpt-api@<release>rc` / `nyxgpt-web@<release>rc` into the tap,
#           so a candidate is installable on macOS the same repo-less way a
#           release is. It never writes the stable formulas. It no-ops when
#           the tip has not moved since the last published candidate -- that
#           is what lets the autopilot dispatch at every park without
#           duplicating candidates.
#   stable  scripts/release_ceremony.sh Phase 2 delegates here. The ceremony
#           keeps only its ceremony-exclusive steps (master merge, tag,
#           Homebrew tap, GitHub Release, sign-off); an rc build never runs
#           any of them.
#
# PEP 440 orders `3.0.0rcN < 3.0.0`, so a candidate can never shadow the
# release.
#
# Guardrails (each one enforced, not just described):
#   * dispatch trigger only -- there is no schedule, push, tag or release
#     trigger below, so nothing publishes without being asked;
#   * release branches only -- the version step refuses any ref that is not
#     `v<X.Y.Z>` matching pyproject.toml's declared version;
#   * pre-release version for rc -- what gets uploaded is always
#     `<release>rcN`, so `pip install nyxgpt` cannot resolve to it (pip
#     excludes pre-releases unless the user passes `--pre` or pins the
#     version exactly);
#   * stable is ceremony-only -- it additionally requires the release tag at
#     the built commit (the ceremony creates it in Phase 1, before it
#     delegates) and a confirmation token only the ceremony passes, so a
#     release cannot be published by dispatching this workflow by hand;
#   * no version reuse -- the next number is read from what PyPI already
#     serves, and PyPI itself rejects a re-upload.
#
# The guardrails and the version arithmetic live in
# `src/nyxgpt/release_candidate.py` (unit-tested), not in shell here, so CI,
# the ceremony and `nyxgpt release publish` can never disagree about what a
# channel publishes.
#
# AUTH: PyPI Trusted Publishing (OIDC) only -- there is no stored PyPI token
# in this repo or in Actions. The publisher on pypi.org must name THIS file:
#   pypi.org -> project `nyxgpt` -> Publishing -> add a GitHub publisher with
#   owner `dkblinux98`, repository `nyxGPT`, workflow
#   `release-publish-pypi.yml`, environment blank.
# See docs/cloud.md#pypi-publishing-rc-and-stable.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Publish channel'
        type: choice
        options:
          - rc
          - stable
        default: rc
      number:
        description: 'Explicit rc number (blank = next unused, resolved from PyPI)'
        required: false
        default: ''
      dry_run:
        description: 'Build, check and smoke-install only -- upload nothing to PyPI'
        type: boolean
        default: false
      confirm:
        description: 'stable channel only: the ceremony confirmation token'
        required: false
        default: ''

permissions:
  contents: read

# ONE CUT AT A TIME (#3771). The tip-unchanged no-op guard below can only
# answer for candidates that are already *registered* -- it reads this
# workflow's finished run history -- so two runs that overlap in the window
# before either has published both read "no candidate for this tip" and both
# publish. That is not hypothetical: on 2026-08-14 two rc dispatches 34
# seconds apart cut `3.0.0rc7` and `3.0.0rc8` from the identical tip, burning
# rc7 dead (PyPI versions are immutable -- a burned number is never reused).
# This group is what makes the guard's answer true: a second cut does not
# evaluate it until the first run has finished and is in the history it reads.
#
# `cancel-in-progress: false` is load-bearing, not a default worth changing:
# a queued cut must WAIT, never kill the running one. A run cancelled
# mid-upload can leave PyPI serving a version that no successful run records,
# which is exactly the state the guard cannot see -- so the next cut would
# burn another number. Queuing costs a few minutes; cancelling costs an rc.
#
# The group is deliberately global rather than per-ref or per-channel: every
# channel and every release line publishes into the one `nyxgpt` PyPI project,
# and each resolves its version from what that project already serves, so any
# two overlapping runs race over the same numbers.
concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read this workflow's own run history (rc no-op check)
      id-token: write # PyPI Trusted Publishing (OIDC) -- the only credential
    outputs:
      # Consumed by homebrew-tap-rc below, which is the rc channel's only
      # additional step. `publish` is 'false' when an rc no-ops.
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are the stable channel's guardrail: the release tag must be
          # at the built commit, and a shallow checkout carries none.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: pip install --quiet build twine httpx

      - name: Resolve the version and pin pyproject.toml
        id: version
        env:
          CHANNEL: ${{ inputs.channel || 'rc' }}
          NUMBER: ${{ inputs.number }}
          CONFIRM: ${{ inputs.confirm }}
          DRY_RUN: ${{ inputs.dry_run }}
          # The rc no-op check reads this workflow's own run history.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `nyxgpt.release_candidate` only needs stdlib + httpx, so it runs
          # straight from the checkout -- no need to install the package
          # (whose own version is what this step is about to rewrite).
          PYTHONPATH: src
        run: |
          set -euo pipefail
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          # This is the guardrail: the module exits non-zero for any ref that
          # is not v<X.Y.Z> matching the declared version, for a stable build
          # without the ceremony's tag and confirmation, and for a version
          # PyPI already serves.
          ARGS=(--branch "$GITHUB_REF_NAME" --channel "$CHANNEL" --pin pyproject.toml)
          if [ -n "${NUMBER}" ]; then
            ARGS+=(--number "${NUMBER}")
          fi
          if [ "${CHANNEL}" = "rc" ] && [ -z "${NUMBER}" ] && [ "${DRY_RUN}" != "true" ]; then
            # The tip guard on the rc channel (#3729). The sprint
            # autopilot dispatches a candidate every time the sprint parks at
            # agentic-work-complete, so repeated observations of that state
            # must not cut duplicate candidates -- only a release-branch tip
            # that moved since the last published rc earns a new rcN.
            # Skipped for an explicit --number (the operator is deliberately
            # naming a version) and for a dry run (which uploads nothing, so
            # it must stay reproducible on an unchanged tip).
            ARGS+=(--skip-if-unchanged --head-sha "$GITHUB_SHA" \
                   --repo "$GITHUB_REPOSITORY" --exclude-run-id "$GITHUB_RUN_ID")
          fi
          if [ "${CHANNEL}" = "stable" ]; then
            ARGS+=(--confirm "${CONFIRM}" \
                   --tags-at-head "$(git tag --points-at HEAD | tr '\n' ' ')")
          fi
          VERSION=$(python -m nyxgpt.release_candidate "${ARGS[@]}")
          if [ "${VERSION}" = "SKIP" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} is unchanged since the last ${CHANNEL} publish -- nothing to publish."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION} (${CHANNEL}) from ${GITHUB_REF_NAME}"
          # The pin is build-time only -- it is never committed, so the
          # release branch keeps declaring the stable version it heads for.
          git --no-pager diff -- pyproject.toml

      - name: Build sdist + wheel
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: python -m build

      - name: twine check
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: twine check dist/*

      - name: Clean-venv smoke (the artifact must import and answer --help)
        if: ${{ steps.version.outputs.publish == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv /tmp/smokeenv
          /tmp/smokeenv/bin/pip install --quiet dist/*.whl
          /tmp/smokeenv/bin/python -c "import nyxgpt"
          INSTALLED=$(/tmp/smokeenv/bin/python -c "from importlib.metadata import version; print(version('nyxgpt'))")
          echo "installed version: ${INSTALLED}"
          # The artifact must report the version it claims to be: a pin that
          # resolves to something else would make an acceptance run lie.
          if [ "$INSTALLED" != "$VERSION" ]; then
            echo "::error::built artifact reports ${INSTALLED}, expected ${VERSION}"
            exit 1
          fi
          /tmp/smokeenv/bin/nyxgpt --help >/dev/null

      - uses: actions/upload-artifact@v4
        if: ${{ steps.version.outputs.publish == 'true' }}
        with:
          name: nyxgpt-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Dry run -- nothing uploaded
        if: ${{ steps.version.outputs.publish == 'true' && inputs.dry_run }}
        run: |
          echo "::notice::dry_run: built and verified ${{ steps.version.outputs.version }}, uploaded nothing."

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        if: ${{ steps.version.outputs.publish == 'true' && !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify PyPI serves the build
        if: ${{ steps.version.outputs.publish == 'true' && !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          code=000
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/nyxgpt/${VERSION}/json")
            [ "$code" = "200" ] && break
            echo "pypi.org does not serve nyxgpt==${VERSION} yet (attempt $i/20, http $code) -- retrying in 15s"
            sleep 15
          done
          if [ "$code" != "200" ]; then
            echo "::error::pypi.org never served nyxgpt==${VERSION}"
            exit 1
          fi

      - name: Summary
        if: ${{ steps.version.outputs.publish == 'true' && !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          {
            echo "### \`${VERSION}\` published (${CHANNEL} channel)"
            echo ""
            echo "Built from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`."
            if [ "${CHANNEL}" = "stable" ]; then
              echo "This is the release itself -- published by the owner's ceremony."
            else
              echo "Acceptance-only pre-release. \`pip install nyxgpt\` still resolves"
              echo "to the latest **stable** release."
            fi
            echo ""
            echo '```'
            echo "pip install nyxgpt==${VERSION}"
            echo "nyxgpt cloud user-data --os linux --version ${VERSION}"
            echo "nyxgpt cloud deploy --version ${VERSION}"
            echo '```'
            if [ "${CHANNEL}" = "rc" ]; then
              # The candidate formulas are named for the release line
              # (#3735), so derive the names rather than hard-coding them.
              RELEASE="${VERSION%%rc*}"
              echo ""
              echo "macOS acceptance (the tap job below stamps these):"
              echo ""
              echo '```'
              echo "brew tap dkblinux98/nyxgpt"
              # Homebrew gates formulas from third-party taps: without the
              # trust step `brew install` stops at the prompt instead of
              # installing (#3752). Tolerated failure -- a Homebrew old
              # enough not to gate has no `tap-trust` subcommand.
              echo "brew tap-trust dkblinux98/nyxgpt || true"
              echo "brew install nyxgpt-api@${RELEASE}rc nyxgpt-web@${RELEASE}rc"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  homebrew-tap-rc:
    # The rc channel's ONLY additional step (#3727, owner decision
    # 2026-08-11): a candidate has to be installable on macOS the same
    # repo-less way a release is, so an rc publish also cuts a GitHub
    # *prerelease* carrying the service tarballs and stamps the candidate
    # formulas into the tap.
    #
    # Clobber-safety is the hard requirement, and it is structural rather
    # than conditional:
    #   * this job runs for the rc channel only -- `stable` never reaches
    #     it, so the ceremony's formulas stay the ceremony's;
    #   * what it writes is `nyxgpt-api@<release>rc.rb` /
    #     `nyxgpt-web@<release>rc.rb` (#3735 -- the name carries the release
    #     line, so a candidate can never silently cross to the next one). The
    #     stable `nyxgpt-api.rb` / `nyxgpt-web.rb` are different files and
    #     are never built, copied or `git add`ed here, so `brew install
    #     nyxgpt-api` keeps resolving to the latest stable release. (Homebrew
    #     has no pre-release semantics -- channel separation has to live in
    #     the formula names.) The candidate formulas declare `conflicts_with`
    #     their stable counterparts, so switching channels on one machine is
    #     an explicit uninstall, never a silent swap;
    #   * the GitHub release is created with `--prerelease --latest=false`,
    #     so it is never the repository's "Latest" release. That also keeps
    #     release-artifacts.yml (which triggers on `release: [released]`,
    #     not `prereleased`) out of this path -- the stable tap push stays
    #     tied to the ceremony's own release;
    #   * the tarballs are attached AT CREATION, in the same `gh release
    #     create` call. Releases in this repository are immutable, so an asset
    #     that is not on a release when it is published can never be added to
    #     it (#3747): a candidate is therefore published complete or not
    #     published at all, and the formulas are only ever stamped against a
    #     release whose assets have been read back and verified.
    needs: publish
    if: >-
      ${{ needs.publish.outputs.publish == 'true'
          && needs.publish.outputs.channel == 'rc'
          && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the prerelease and upload its assets
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit the publish job built, not the branch tip --
          # the branch may have moved while PyPI was being polled, and the
          # tarballs must match the wheel that was just published.
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build tarballs and stamp the rc formulas
        run: |
          python scripts/build_homebrew_artifacts.py "$VERSION" dist/homebrew \
            "https://github.com/${{ github.repository }}/releases/download/${VERSION}" \
            --channel rc

      - name: Assert no stable formula was written
        run: |
          set -euo pipefail
          for stable in nyxgpt-api.rb nyxgpt-web.rb; do
            if [ -e "dist/homebrew/${stable}" ]; then
              echo "::error::an rc build produced ${stable} -- stable formulas must never be"
              echo "::error::written by an rc publish (see this job's header)"
              exit 1
            fi
          done
          ls -1 dist/homebrew/*.rb

      - name: Retire any incomplete candidate release on this line
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # #3747: a candidate release that is missing a tarball is deleted (or,
          # if the platform refuses, marked superseded in its notes) before this
          # run cuts a new one -- including the `3.0.0rc3` the old
          # upload-after-publish step left behind. Best-effort by design: a
          # leftover nobody can retire must not block the next candidate, and
          # the create/verify steps below are what actually gate the formulas.
          scripts/supersede_incomplete_rc_releases.sh "${VERSION%%rc*}" --repo "$REPO"

      - name: Cut the GitHub prerelease with the service tarballs attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `3.0.0rc4` -> `3.0.0`: the candidate formulas are named for the
          # release line they are a candidate for (#3735).
          RELEASE="${VERSION%%rc*}"
          API_TARBALL="dist/homebrew/dist/nyxgpt-api-${VERSION}.tar.gz"
          WEB_TARBALL="dist/homebrew/dist/nyxgpt-web-${VERSION}.tar.gz"
          for tarball in "$API_TARBALL" "$WEB_TARBALL"; do
            if [ ! -s "$tarball" ]; then
              echo "::error::${tarball} was not built -- refusing to cut a release the"
              echo "::error::candidate formulas would point at with nothing behind it"
              exit 1
            fi
          done

          cat > /tmp/rc-notes.md <<NOTES
          Acceptance-only release candidate built from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`.

          **This is not a release.** \`pip install nyxgpt\` and \`brew install nyxgpt-api\`
          both keep resolving to the latest stable version.

          \`\`\`bash
          pip install nyxgpt==${VERSION}
          brew tap dkblinux98/nyxgpt && (brew tap-trust dkblinux98/nyxgpt || true) && brew install nyxgpt-api@${RELEASE}rc nyxgpt-web@${RELEASE}rc
          \`\`\`
          NOTES

          if gh release view "$VERSION" -R "$REPO" >/dev/null 2>&1; then
            # Releases in this repository are IMMUTABLE: once published, one can
            # never gain or change an asset -- run 31663088319 died on
            # `HTTP 422: Cannot upload assets to an immutable release` creating
            # the release first and uploading afterwards (#3747). So an existing
            # release is either already complete (a re-run: reuse it) or beyond
            # repair, and the sweep above already tried to retire it.
            HAVE=$(gh release view "$VERSION" -R "$REPO" --json assets --jq '[.assets[].name] | join(" ")')
            for name in "nyxgpt-api-${VERSION}.tar.gz" "nyxgpt-web-${VERSION}.tar.gz"; do
              case " $HAVE " in
                *" $name "*) ;;
                *)
                  echo "::error::release ${VERSION} already exists without ${name}, and an"
                  echo "::error::immutable release can never gain one. Publish the next candidate"
                  echo "::error::instead -- rcN numbers are cheap and PyPI has burned this one."
                  exit 1 ;;
              esac
            done
            echo "::notice::release ${VERSION} already carries both tarballs -- reusing it"
            exit 0
          fi

          # The assets go on AT CREATION -- never uploaded afterwards, which
          # immutability forbids. `gh release create` takes them as positional
          # arguments, so the release is published complete or not at all.
          gh release create "$VERSION" \
            -R "$REPO" \
            --target "$GITHUB_SHA" \
            --title "nyxGPT $VERSION (release candidate)" \
            --prerelease \
            --latest=false \
            --notes-file /tmp/rc-notes.md \
            "$API_TARBALL" "$WEB_TARBALL"

      - name: Verify the release is a complete prerelease and not "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IS_PRERELEASE=$(gh release view "$VERSION" -R "$REPO" --json isPrerelease --jq .isPrerelease)
          # Verifying the mutation, not assuming it: the formulas stamped below
          # point at these two assets by URL, so a release missing either one is
          # an uninstallable candidate (#3747).
          ASSETS=$(gh release view "$VERSION" -R "$REPO" --json assets --jq '[.assets[].name] | join(" ")')
          echo "assets=${ASSETS}"
          for name in "nyxgpt-api-${VERSION}.tar.gz" "nyxgpt-web-${VERSION}.tar.gz"; do
            case " $ASSETS " in
              *" $name "*) ;;
              *)
                echo "::error::release ${VERSION} does not carry ${name}"
                exit 1 ;;
            esac
          done
          # `gh release view` with no tag resolves the repository's "Latest"
          # release; it exits non-zero when there is none at all, which is
          # itself a pass for this check.
          LATEST=$(gh release view -R "$REPO" --json tagName --jq .tagName 2>/dev/null || echo "(none)")
          echo "prerelease=${IS_PRERELEASE}  repository latest=${LATEST}"
          if [ "$IS_PRERELEASE" != "true" ]; then
            echo "::error::${VERSION} is not marked as a prerelease"
            exit 1
          fi
          if [ "$LATEST" = "$VERSION" ]; then
            echo "::error::${VERSION} became the repository's latest release"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-tap-rc-formulas-${{ needs.publish.outputs.version }}
          path: dist/homebrew/*.rb

      - name: Push the rc formulas to the remote tap
        if: ${{ vars.HOMEBREW_TAP_REPO != '' }}
        env:
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_REPO is set but HOMEBREW_TAP_TOKEN is missing -- skipping tap push."
            echo "::warning::The candidate formulas are still attached as a workflow artifact."
            exit 0
          fi
          RELEASE="${VERSION%%rc*}"
          API_FORMULA="nyxgpt-api@${RELEASE}rc.rb"
          WEB_FORMULA="nyxgpt-web@${RELEASE}rc.rb"
          TAP_DIR="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula"
          # Only this line's candidate formulas -- the stable ones in this tap
          # belong to the ceremony's release-artifacts.yml run, and another
          # line's candidates are differently named files, so both are left
          # exactly as they are.
          cp "dist/homebrew/${API_FORMULA}" "$TAP_DIR/Formula/${API_FORMULA}"
          cp "dist/homebrew/${WEB_FORMULA}" "$TAP_DIR/Formula/${WEB_FORMULA}"
          cd "$TAP_DIR"
          git config user.name "nyxgpt-release-bot"
          git config user.email "actions@github.com"
          git add "Formula/${API_FORMULA}" "Formula/${WEB_FORMULA}"
          # Verifying the mutation: an rc push that touched a stable formula
          # would break `brew install nyxgpt-api` for every user.
          if ! git status --porcelain -- Formula/nyxgpt-api.rb Formula/nyxgpt-web.rb | grep -q .; then
            echo "stable formulas untouched by this rc push (verified)"
          else
            echo "::error::this rc push modified a stable formula -- refusing to push"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "candidate formulas unchanged for ${VERSION} -- nothing to push"
          else
            git commit -m "nyxgpt ${VERSION} (release candidate)"
            git push origin HEAD
          fi

      - name: Remote tap not configured
        if: ${{ vars.HOMEBREW_TAP_REPO == '' }}
        run: |
          echo "::notice::HOMEBREW_TAP_REPO is not set -- the candidate formulas for ${VERSION}"
          echo "::notice::are attached as a workflow artifact instead. See docs/homebrew.md#remote-tap."

      - name: Summary
        run: |
          RELEASE="${VERSION%%rc*}"
          {
            echo "### \`${VERSION}\` also stamped into the Homebrew tap"
            echo ""
            echo "GitHub **prerelease** (never \"latest\") with the service tarballs, plus"
            echo "\`nyxgpt-api@${RELEASE}rc\` / \`nyxgpt-web@${RELEASE}rc\` formulas. The stable"
            echo "formulas are untouched."
            echo ""
            echo '```bash'
            echo "brew tap dkblinux98/nyxgpt"
            # See the acceptance summary above: the tap has to be trusted
            # before Homebrew will install from it (#3752).
            echo "brew tap-trust dkblinux98/nyxgpt || true"
            echo "brew install nyxgpt-api@${RELEASE}rc nyxgpt-web@${RELEASE}rc"
            echo "brew services start nyxgpt-api@${RELEASE}rc"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  macos-brew-smoke:
    # Verifies the candidate the tap job just published actually installs on a
    # real macOS Homebrew (#3753). Runs after the tap push rather than before
    # it -- the point is to exercise `brew tap` + `brew install` exactly as the
    # owner does, which needs the formulas to be published first. A failure
    # here therefore reports a broken candidate; it cannot un-publish one, and
    # deliberately does not gate the tap push.
    needs: [publish, homebrew-tap-rc]
    if: >-
      ${{ needs.publish.outputs.publish == 'true'
          && needs.publish.outputs.channel == 'rc'
          && !inputs.dry_run }}
    uses: ./.github/workflows/macos-brew-smoke.yml
    with:
      formula_version: ${{ needs.publish.outputs.version }}
