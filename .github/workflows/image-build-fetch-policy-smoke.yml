name: Image Build Fetch Policy Smoke

# The question this job answers: when a build step cannot reach the package
# registry, does the build fail loudly and get reported as a registry failure?
#
# No existing job can answer it. Every image-building smoke here
# (terraform-local-smoke, k8s-local-smoke, k8s-artifact-smoke,
# canary-track-metrics-smoke) builds with the network UP, so all of them are
# green by luck on this path -- which is exactly the condition #3753 named and
# D-006 records. A registry blip reddens one of them at random and says nothing
# about the commit; that is how #4205 was filed.
#
# Reproducing it deliberately found worse than the report. With the registry
# unreachable, `npm ci` prints "npm error Exit handler never called!" and
# **exits 0**, having created one empty directory per dependency and no
# `node_modules/.package-lock.json` -- so `docker build` reports DONE and
# BuildKit caches the layer. One blip, a green build, and a web image whose
# service cannot start.
#
# So this job injects the condition (`docker build --network none`) and proves
# both halves the executed-verification gate asks for (CLAUDE.md #3775): the
# pre-fix step silently succeeds over an empty tree, and the fixed step fails,
# names itself, and is attributed to the registry by the one classifier in
# `src/nyxgpt/build_fetch_policy.py`. It then checks the retry policy is live
# inside the build rather than inert, and that a genuine build defect is still
# reported as a defect.
#
# Scope: the policy module, the Dockerfiles it governs, the ops callers that
# report through it, the script and this workflow. Cheap by the standards of
# the smokes above -- two short builds plus one real `npm ci`.
on:
  pull_request:
    paths:
      - 'src/nyxgpt/build_fetch_policy.py'
      - 'src/nyxgpt/ops.py'
      - 'web/Dockerfile'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'Dockerfile'
      - 'scripts/cloud/*.Dockerfile'
      - 'scripts/image-build-fetch-policy-smoke.sh'
      - '.github/workflows/image-build-fetch-policy-smoke.yml'
  push:
    paths:
      - 'src/nyxgpt/build_fetch_policy.py'
      - 'src/nyxgpt/ops.py'
      - 'web/Dockerfile'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'Dockerfile'
      - 'scripts/cloud/*.Dockerfile'
      - 'scripts/image-build-fetch-policy-smoke.sh'
      - '.github/workflows/image-build-fetch-policy-smoke.yml'
  workflow_dispatch:

# Read-only: the job builds images locally and reads their contents. It never
# writes to the repository or its APIs (CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  image-build-fetch-policy-smoke:
    runs-on: ubuntu-latest
    # Phase 1's no-network `npm ci` burns npm's own retry backoff before giving
    # up (~2.5 min measured), phase 2's does the same, and phase 3 runs a real
    # `npm ci`. Bounded well above that so a slow runner reports a result
    # rather than a cancellation.
    timeout-minutes: 30
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inject an unreachable registry, then prove the fix
        run: ./scripts/image-build-fetch-policy-smoke.sh
