name: PR Project Status on Close

# Event-driven half of the #3742 PR lane invariant (owner decision
# 2026-08-12, reaffirmed 2026-08-13): when a PR leaves the review lane —
# merged OR closed without merging — its own project card moves to the
# terminal "Closed" status.
#
# review_accept_and_merge.sh already stamps the PRs the review agent merges;
# this covers every other exit path (rejected/abandoned PRs, owner merges,
# ceremony merges). The stamp is idempotent, so both running is harmless.
#
# Deliberately NOT the board's built-in "Pull request merged" automation:
# that rule is GitHub-proprietary (the agent system must stay portable to
# non-GitHub deployments), it is not retroactive, and it was enabled while
# merged PRs kept stranding in "In Review".

# `pull_request_target`, NOT `pull_request` (#4167). Same fault, same fix as
# `ensure_project_hygiene.yml`'s `pr-hygiene`: GitHub treats a
# Dependabot-authored `pull_request` run as a fork PR, withholds this
# repository's Actions secrets and substitutes the (empty) Dependabot store,
# so `SCRUMMASTER_AGENT_TOKEN` arrives blank and
# `scripts/agents/pr_close_project_status.sh` dies at `require_gh_auth`
# before it stamps anything.
#
# Why it had to move in the SAME change that fixed `pr-hygiene`: until then
# a Dependabot PR never got a project card, so a failed stamp stamped
# nothing and cost nothing. `pr-hygiene` on `pull_request_target` now puts
# every Dependabot PR on the board in `In Review` — and Dependabot routinely
# closes its own PRs without merging (superseded by a newer version,
# dependency dropped). That `closed` event is Dependabot-actored, so the only
# job that would move the card to the terminal `Closed` status would have
# been the one that cannot authenticate, stranding exactly the debris the
# #3742 lane invariant exists to prevent. There is no sweep backstop: the
# other `close_pr_project_item` callers are the review agent's merge path and
# owner-actored merges, neither of which sees a Dependabot supersede-close.
#
# SAFETY CONDITION (the thing that makes a secret-carrying run on an
# arbitrary author's PR acceptable, per ledger D-062): the single job below
# never checks out or executes PR head code. It checks out
# `vars.RELEASE_BRANCH` and the only event-derived value reaching a shell is
# the PR's number. `tests/unit/test_pull_request_target_safety.py` states
# that over every `pull_request_target` workflow in this repository, so this
# file is covered by it automatically, and
# `project-hygiene-smoke.yml`'s `pr-head-guard-discriminates` job executes
# that guard against deliberately broken copies of both files so it cannot
# pass by being vacuous.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-project-status-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  stamp-closed-lane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Stamp PR project item -> Closed
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat > /tmp/nyxgpt-config.ini <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          export NYXGPT_CONFIG_FILE=/tmp/nyxgpt-config.ini
          bash scripts/agents/pr_close_project_status.sh "$PR_NUMBER"
