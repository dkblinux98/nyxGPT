name: Handle Acceptance Failure

on:
  issue_comment:
    types: [created]

jobs:
  handle:
    # Triggers when the human owner comments @acceptance-failure on an issue.
    # This is the stakeholder acceptance stage (post-merge, issue assigned to human).
    # It is DISTINCT from the review-loop overrides (@approve-merge, @request-changes,
    # @send-to-developer) which live in review_agent_auto_review.yml and operate on PRs.
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@acceptance-failure') &&
      github.event.comment.user.login == vars.HUMAN_OWNER
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Write ephemeral config
        run: |
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"
          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"

      - name: Reopen issue, label, and assign to developer
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          source scripts/agents/lib/gh_project.sh
          load_config
          require_gh_auth

          # Reopen if closed (acceptance failures are found after merge closes the issue)
          STATE=$(gh issue view "$ISSUE" --json state -q '.state')
          if [[ "$STATE" == "CLOSED" ]]; then
            gh issue reopen "$ISSUE"
            echo "Reopened issue #$ISSUE"
          fi

          # Add Acceptance Failure label (remove Feature label if present)
          gh issue edit "$ISSUE" --add-label "Acceptance Failure" --remove-label "Feature" 2>/dev/null || \
            gh issue edit "$ISSUE" --add-label "Acceptance Failure"

          # Set status to In Progress and assign to developer agent
          set_issue_status "$ISSUE" "$STATUS_IN_PROGRESS"
          assign_and_trigger_developer "$ISSUE"

          echo "Issue #$ISSUE: reopened, labelled Acceptance Failure, assigned to $DEV_AGENT"

      - name: Post acknowledgement comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          script: |
            const issue_number = ${{ github.event.issue.number }};
            const dev_agent = process.env.DEV_AGENT;
            const human_owner = process.env.HUMAN_OWNER;
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body:
                `🔧 **Scrummaster Agent**: Acceptance failure acknowledged.\n\n` +
                `Issue reopened and assigned to @${dev_agent} for investigation and fix.\n\n` +
                `**Next steps (automated):**\n` +
                `- Developer agent will create a \`fix/${issue_number}-...\` branch\n` +
                `- Implement the fix described in your comment above\n` +
                `- Submit a PR with \`Closes #${issue_number}\` for review\n` +
                `- Review agent will review and merge\n\n` +
                `If the fix cycle escalates again, you will be notified via Slack.\n\n` +
                `[Monitor progress](${repoUrl}/issues/${issue_number})`
            });
        env:
          DEV_AGENT: ${{ vars.DEV_AGENT }}
          HUMAN_OWNER: ${{ vars.HUMAN_OWNER }}
