name: Handle Acceptance Failure

on:
  issue_comment:
    types: [created]

# Related-issue acceptance-failure model (owner decision 2026-08-02,
# superseding the sub-issue model of 2026-08-01; relationship storage moved
# to native relationships 2026-08-12, #3731):
#
# - A unique acceptance failure against a feature/doc/release/improvement
#   issue becomes a NEW issue labeled "Acceptance Failure" that BLOCKS the
#   original through GitHub's native blocked-by/blocks relationship — NOT a
#   sub-issue, and NOT a "Related feature: #N" body marker (that prose
#   convention is retired; it is only still READ for historical issues).
#   The original is never reopened or relabeled; it stays closed, parked in
#   "Acceptance Testing" or — at the owner's choice, #3780 — in
#   "Acceptance Failed". Both lanes park identically.
# - If the failure issue's fix later fails stakeholder re-test, commenting
#   @acceptance-failure ON THE FAILURE ISSUE reopens THAT SAME issue and
#   sends it back through dev -> review. No per-round issues are created;
#   the failure issue's own history is the trail of its resolution.
# - When every blocking issue reaches "For Release" — directly and
#   transitively — the original is promoted to "For Release" automatically by
#   promote_accepted_features.yml (scripts/agents/promote_accepted_features.sh),
#   which also heals any missing blocking links.
#
# Improvement issues (handle_improvement.yml) record the same native
# relationship; the two commands differ only in the label they apply and the
# copy they post.
#
# DRAIN GATE (owner decision 2026-08-12, #3730): a failure filed during an
# acceptance round is no longer worked immediately. It is placed in the
# `Acceptance Failed` lane and stays there until `Acceptance Testing` has
# drained (empty except the release issue) -- acceptance_drain_gate.yml
# then moves the HELD items to Backlog and kicks the queue once. Working
# failures mid-round floods Acceptance Testing with fresh fixes while the
# owner is still testing and burns RC cycles.
#
# Held means the OPEN part of that lane. The same lane is also where the
# owner parks features they have tested and FAILED (owner decision
# 2026-08-14, #3780); those are CLOSED, and the gate never moves them --
# they are moved only by promote_accepted_features.yml, once their whole
# transitive blocked-by closure has reached "For Release".
#
# Agent-process work bypasses the gate and is assigned immediately, per
# the rule encoded in scripts/agents/lib/drain_gate.py: an explicit
# process exception in the owner's comment (or in the related issue's
# body) opts out.
#
# NOTE: issue_comment workflows execute from the repository DEFAULT branch.
# Empirically that is the active release branch, so changes here go live
# on merge.

# Serialize per commented issue so two rapid comments compute distinct
# failure numbers. Distinct comments still create distinct issues.
concurrency:
  group: acceptance-failure-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # Layer 1 of the command trigger (#3790): cheap substring test here, the
  # anchored "does this comment ISSUE the command?" decision in the gate job.
  # Applied to every comment token in the repo, including the owner-only ones:
  # a bare substring match also fires on prose that merely quotes or discusses
  # the command ("I filed that as @improvement earlier"), and on an agent
  # quoting the owner's comment back.
  comment_gate:
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@acceptance-failure') &&
      !contains(github.event.comment.body, 'nyxgpt-token-mention') &&
      github.event.comment.user.login == vars.HUMAN_OWNER
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Comment token gate
        id: gate
        uses: ./.github/actions/comment-token-gate
        with:
          token: "@acceptance-failure"
          comment-body: ${{ github.event.comment.body }}
          author-association: ${{ github.event.comment.author_association }}

  handle:
    # Runs when the human owner ISSUES @acceptance-failure on an issue (the
    # command opens a line of the comment; see comment_gate above).
    # This is the stakeholder acceptance stage (post-merge, issue assigned to human).
    # It is DISTINCT from the review-loop overrides (@approve-merge, @request-changes,
    # @send-to-developer) which live in review_agent_auto_review.yml and operate on PRs.
    needs: [comment_gate]
    if: needs.comment_gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Write ephemeral config
        run: |
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"
          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"

      - name: Handle acceptance failure
        id: handle
        env:
          # Owner-authored comment text: passed via env (never interpolated
          # into the script) so backticks/quotes in the report can't inject.
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          set -euo pipefail
          COMMENTED="${{ github.event.issue.number }}"
          source scripts/agents/lib/gh_project.sh
          load_config
          require_gh_auth

          issue_json="$(gh api "repos/${REPO_OWNER}/${REPO_NAME}/issues/${COMMENTED}" \
            --jq '{state: (.state | ascii_upcase), title, labels: [.labels[].name], body: (.body // "")}')"
          COMMENTED_BODY="$(echo "$issue_json" | jq -r '.body')"

          # Is the commented issue one this loop FILED against something else
          # (a failure/improvement whose fix just failed re-test), or is it
          # the thing being acceptance-tested?
          #
          # Two conditions must both hold: it carries a handler label AND it
          # natively blocks another issue (#3731 — the relationship is the
          # storage; the retired body marker is the fallback for issues filed
          # before that). The label alone is not enough: owner-filed defect
          # issues like #3463/#3469 also carry "Acceptance Failure" and are
          # themselves PARENTS being acceptance-tested — keying on the label
          # reopened #3463 when the owner wanted a second failure issue
          # (2026-08-02). A blocking edge alone is not enough either: a plain
          # feature can block a sequenced successor.
          RELATED=""
          if echo "$issue_json" | jq -e '.labels | any(. == "Acceptance Failure" or . == "Improvement")' >/dev/null; then
            RELATED="$(related_feature_of "$COMMENTED" "$COMMENTED_BODY" || true)"
          fi

          # Drain gate (#3730): does this failure get worked now, or held
          # until the acceptance round drains? Process work bypasses;
          # product acceptance work is gated. The owner's own comment text
          # can declare the exception, and so can the commented issue.
          # Computed once here — both paths below branch on it.
          GATED=1
          if text_bypasses_drain_gate "$COMMENT_BODY" \
            || issue_bypasses_drain_gate "$COMMENTED"; then
            GATED=0
          fi
          echo "gated=$GATED" >> "$GITHUB_OUTPUT"

          # --- Path B: the commented issue is a handler-filed failure/
          # improvement issue (resolved above). Its fix failed the owner's
          # re-test -> reopen the SAME issue and send it back through the
          # process. Its own history is the trail; no new issue is created
          # for another round of the same failure.
          if [[ -n "$RELATED" ]]; then
            STATE="$(echo "$issue_json" | jq -r '.state')"
            if [[ "$STATE" == "CLOSED" ]]; then
              gh issue reopen "$COMMENTED" --repo "${REPO_OWNER}/${REPO_NAME}"
            fi
            if [[ "$GATED" == "1" ]]; then
              # Reopened, but parked in the holding lane: the owner is
              # still testing this round. The drain watcher releases it.
              drain_gate_hold "$COMMENTED" "re-tested acceptance failure" \
                || _warn "drain gate: could not put #${COMMENTED} in the holding lane --" \
                        "it may already be there, or the lane option may be missing. Check its Status."
            else
              set_issue_status "$COMMENTED" "$STATUS_IN_PROGRESS"
              assign_and_trigger_developer "$COMMENTED"
            fi
            {
              echo "mode=reopened"
              echo "issue=$COMMENTED"
              echo "feature=${RELATED}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- Path A: a unique failure against a feature/doc/release/
          # improvement issue -> file a NEW related failure issue. The
          # original is untouched.
          FEATURE="$COMMENTED"
          FEATURE_TITLE="$(echo "$issue_json" | jq -r '.title')"

          # Unique-failure number = existing failure issues against this
          # feature + 1. Read from the native relationship (the issues
          # blocking FEATURE that carry the "Acceptance Failure" label),
          # unioned with the retired body marker so numbering stays
          # continuous for features whose earlier failures predate #3731.
          # The prose arm matches the exact marker, not free text, so #34
          # never counts for #3.
          # --jq runs once per fetched page -- stream matching issues across
          # all pages first, then de-duplicate (see AGENTS.md).
          NATIVE_AFS="$(blocked_by_issues "$FEATURE" | while IFS= read -r b; do
            [[ -n "$b" ]] || continue
            gh api "repos/${REPO_OWNER}/${REPO_NAME}/issues/${b}" \
              --jq 'select([.labels[].name] | index("Acceptance Failure")) | .number' 2>/dev/null || true
          done)"
          PROSE_AFS="$(gh api "repos/${REPO_OWNER}/${REPO_NAME}/issues?labels=Acceptance%20Failure&state=all&per_page=100" \
            --paginate \
            --jq ".[] | select(has(\"pull_request\") | not) | select(.body | test(\"(Parent|Related) feature: #${FEATURE}\\\\b\")) | .number")"
          EXISTING="$(printf '%s\n%s\n' "$NATIVE_AFS" "$PROSE_AFS" \
            | grep -E '^[0-9]+$' | sort -u | wc -l | tr -d ' ')"
          NUM=$((EXISTING + 1))

          TITLE="bug: acceptance failure ${NUM} for #${FEATURE} - ${FEATURE_TITLE#*: }"
          TITLE="${TITLE:0:80}"

          BODY_FILE="$RUNNER_TEMP/af-body.md"
          {
            echo "## Problem / Motivation"
            echo
            echo "Stakeholder acceptance testing failed (unique failure ${NUM})."
            echo
            echo "Reported by: @${HUMAN_OWNER} — ${COMMENT_URL}"
            echo
            echo "## Reported Failure"
            echo
            printf '%s\n' "$COMMENT_BODY"
            echo
            echo "## Acceptance Criteria"
            echo
            echo "- [ ] The reported failure is fixed and verified"
            echo "- [ ] If this issue's fix fails re-test, it is REOPENED (comment @acceptance-failure here) — not replaced by a new issue"
            echo
            echo "## Notes"
            echo
            echo "- The issue this blocks is recorded in GitHub's **Relationships** panel (native blocked-by), not in this body — see the \"Blocking\" section of this issue. It is promoted to \"For Release\" automatically once everything blocking it, transitively, reaches \"For Release\"."
          } > "$BODY_FILE"

          # Rework happens in the active sprint; everything else (Module,
          # Priority, Effort, Milestone) is inherited from the related
          # feature so this issue stays inside the same release wall.
          ACTIVE_SPRINT="$(iteration_active_title "${SPRINT_FIELD:-Sprint}" 2>/dev/null || echo "")"

          # Gated failures are FILED into the holding lane -- they never
          # pass through In Progress, so nothing can pick them up in the
          # window between creation and the hold (#3730).
          FILE_STATUS="$STATUS_IN_PROGRESS"
          [[ "$GATED" == "1" ]] && FILE_STATUS="$STATUS_ACCEPTANCE_FAILED"

          ARGS=(--title "$TITLE" --body-file "$BODY_FILE"
                --label "Acceptance Failure"
                --copy-from-issue "$FEATURE"
                --status "$FILE_STATUS")
          if [[ -n "$ACTIVE_SPRINT" && "$ACTIVE_SPRINT" != "null" ]]; then
            ARGS+=(--sprint "$ACTIVE_SPRINT")
          fi
          NEW="$(scripts/agents/create_issue.sh "${ARGS[@]}" | tail -1)"
          echo "Created related acceptance-failure issue #$NEW (unique failure ${NUM}) for feature #$FEATURE"

          # THE relationship record (owner requirement 2026-08-02, sole
          # storage since #3731): the failure issue BLOCKS the feature, so
          # the feature's Relationships panel shows exactly what is holding
          # it out of For Release. Transitive blocking is not written as
          # extra edges — promote/drain logic walks the chain instead.
          # Best-effort; the promotion sweep heals missing links.
          if mark_issue_blocked_by "$FEATURE" "$NEW"; then
            echo "Marked #$NEW as blocking #$FEATURE"
          else
            echo "[warn] Could not mark #$NEW as blocking #$FEATURE (promotion sweep will retry)"
          fi

          # Only the new issue enters the rework cycle; the feature is
          # untouched. Under the drain gate, "enters the cycle" means
          # "waits in Acceptance Failed until the round drains" (#3730).
          if [[ "$GATED" == "1" ]]; then
            drain_gate_hold "$NEW" "acceptance failure" \
              || _warn "drain gate: could not put #${NEW} in the holding lane --" \
                      "it may already be there, or the lane option may be missing. Check its Status."
          else
            assign_and_trigger_developer "$NEW"
          fi

          {
            echo "mode=filed"
            echo "issue=$NEW"
            echo "feature=$FEATURE"
            echo "num=$NUM"
          } >> "$GITHUB_OUTPUT"

      - name: Post acknowledgement comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          script: |
            const commented = context.payload.issue.number;
            const mode = process.env.MODE;
            const issue = Number(process.env.ISSUE);
            const feature = process.env.FEATURE;
            const num = process.env.NUM;
            const dev_agent = process.env.DEV_AGENT;
            const gated = process.env.GATED === '1';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;

            // Drain gate (#3730): a gated failure waits in Acceptance
            // Failed until this acceptance round drains, so the flow the
            // acknowledgement describes must be the one that will actually
            // happen -- promising "assigned to the developer agent" while
            // the issue sits parked is exactly the confusion the lane
            // exists to remove.
            const startLine = gated
              ? `- Held in **Acceptance Failed** — the fix process starts when **Acceptance Testing** drains (only the release issue left), which moves it to Backlog and kicks the queue once\n`
              : `- Assigned to @${dev_agent} immediately (process exception — the drain gate does not apply)\n`;

            let body;
            if (mode === 'reopened') {
              const featNote = feature
                ? `\n- #${feature} continues to wait on this issue — it is blocked by it in GitHub's Relationships panel — before it can move to **For Release**`
                : '';
              body =
                `🔧 **Scrummaster Agent**: Acceptance failure on this fix acknowledged.\n\n` +
                `This issue is **reopened** and sent back through the process. ` +
                `Its own history is the trail of this failure's resolution; no new issue is created.\n\n` +
                `**Flow (automated):**\n` +
                startLine +
                `- Developer agent fixes on a new \`fix/${issue}-...\` branch, PR with \`Closes #${issue}\`\n` +
                `- Review agent reviews and merges; this issue returns to Acceptance Testing for your re-test${featNote}`;
            } else {
              body =
                `🔧 **Scrummaster Agent**: Acceptance failure acknowledged.\n\n` +
                `Filed as **#${issue}** — unique failure ${num} for #${feature}. It is recorded as **blocking** this issue through GitHub's native Relationships (no body markers).\n\n` +
                `**Flow (automated):**\n` +
                `- This issue stays closed in **Acceptance Testing** and is otherwise untouched\n` +
                startLine +
                `- Developer agent fixes via a \`fix/${issue}-...\` branch and a PR with \`Closes #${issue}\`\n` +
                `- Review agent reviews and merges; #${issue} then lands in Acceptance Testing for your re-test\n` +
                `- If #${issue}'s fix fails your re-test, comment \`@acceptance-failure\` **on #${issue}** — it is reopened and re-cycled, not replaced\n` +
                `- When everything blocking this issue reaches **For Release** — directly and transitively — it is promoted to For Release automatically\n\n` +
                `[Monitor progress](${repoUrl}/issues/${issue})`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: commented,
              body
            });
        env:
          DEV_AGENT: ${{ vars.DEV_AGENT }}
          MODE: ${{ steps.handle.outputs.mode }}
          ISSUE: ${{ steps.handle.outputs.issue }}
          FEATURE: ${{ steps.handle.outputs.feature }}
          NUM: ${{ steps.handle.outputs.num }}
          GATED: ${{ steps.handle.outputs.gated }}
