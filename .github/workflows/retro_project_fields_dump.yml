name: Retro Dashboard - Dump Project Fields

# Dumps per-issue Project v2 field assignments (Sprint, Module, Status) plus the
# Sprint iteration calendar to scripts/retrospective/data/project_fields.json and
# publishes the file to the retro data branch. Read-only against the Project;
# writes only the JSON snapshot. Used by the owner's retrospective dashboard.
#
# The snapshot does NOT get pushed at the dispatching branch: the default
# branch's ruleset requires a pull request, and the direct push was rejected
# with GH013 (#3815). publish_data_branch.sh puts it on claude/retro-data and
# merge_data_branch.sh lands it on the default branch through a pull request
# it opens and merges, so a green run of this workflow means the data landed.

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Dump project fields
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          set -euo pipefail
          mkdir -p scripts/retrospective/data

          FIELDS_Q='query($login:String!,$number:Int!){
            user(login:$login){ projectV2(number:$number){
              fields(first:30){ nodes{
                ... on ProjectV2IterationField { name configuration {
                  iterations { title startDate duration }
                  completedIterations { title startDate duration } } }
              } }
            } } }'
          gh api graphql -f query="$FIELDS_Q" \
            -F login="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" \
            --jq '{sprints: [.data.user.projectV2.fields.nodes[]
                    | select(.name == "Sprint")
                    | (.configuration.completedIterations + .configuration.iterations)[]
                    | {title, startDate, duration}]}' > /tmp/sprints.json

          ITEMS_Q='query($login:String!,$number:Int!,$after:String){
            user(login:$login){ projectV2(number:$number){
              items(first:100, after:$after){
                pageInfo{ hasNextPage endCursor }
                nodes{
                  type
                  content{ ... on Issue { number } ... on PullRequest { number } }
                  fieldValues(first:20){ nodes{
                    ... on ProjectV2ItemFieldSingleSelectValue {
                      name field { ... on ProjectV2SingleSelectField { name } } }
                    ... on ProjectV2ItemFieldIterationValue {
                      title startDate field { ... on ProjectV2IterationField { name } } }
                  } }
                }
              }
            } } }'
          after=""
          : > /tmp/items.ndjson
          while :; do
            if [ -n "$after" ]; then
              resp="$(gh api graphql -f query="$ITEMS_Q" -F login="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" -F after="$after")"
            else
              resp="$(gh api graphql -f query="$ITEMS_Q" -F login="$PROJECT_OWNER" -F number="$PROJECT_NUMBER")"
            fi
            echo "$resp" | jq -c '.data.user.projectV2.items.nodes[]
              | select(.content.number != null)
              | {type, number: .content.number,
                 fields: [.fieldValues.nodes[] | select(.field.name != null)
                          | {field: .field.name, value: (.name // .title), start: (.startDate // null)}]}' \
              >> /tmp/items.ndjson
            has_next="$(echo "$resp" | jq -r '.data.user.projectV2.items.pageInfo.hasNextPage')"
            after="$(echo "$resp" | jq -r '.data.user.projectV2.items.pageInfo.endCursor')"
            [ "$has_next" = "true" ] || break
          done

          jq -s --slurpfile cal /tmp/sprints.json \
            '{generated_at: (now | todate), sprints: $cal[0].sprints, items: .}' \
            /tmp/items.ndjson > scripts/retrospective/data/project_fields.json
          jq '{items: (.items | length), sprints: (.sprints | length)}' \
            scripts/retrospective/data/project_fields.json

      - name: Publish snapshot to the retro data branch
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          scripts/retrospective/publish_data_branch.sh \
            "chore(retro): refresh project fields snapshot" \
            scripts/retrospective/data/project_fields.json

      - name: Land it on the default branch
        env:
          # The publish above pushes with GITHUB_TOKEN, and a GITHUB_TOKEN push
          # deliberately does NOT trigger other workflows -- so this job lands
          # the refresh itself rather than relying on retro_data_merge.yml
          # firing. That also makes a green dump mean the data landed, which
          # #3815 was precisely the absence of. retro_data_merge.yml still
          # covers the runbook's manual step 8 (an operator's PAT push does
          # trigger it); the merge is idempotent either way.
          GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN || secrets.SCRUMMASTER_AGENT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          DATA_BRANCH: claude/retro-data
        run: scripts/retrospective/merge_data_branch.sh
