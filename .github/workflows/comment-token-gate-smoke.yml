name: Comment Token Gate Smoke

# Which question does this job answer? (#3775 executed verification)
#
#   "When a comment that merely NAMES a command token arrives, does the
#    trigger gate actually refuse to start work -- and does a comment that
#    ISSUES the token still start it?"
#
# The unit tests cover the decision function. They cannot cover the part that
# broke on 2026-08-15 (#3790): the gate as a *composite action executing on a
# runner* -- the shell quoting of an arbitrary comment body, the env
# hand-off, the exit-code plumbing into `proceed`. This job runs the real
# action, on a real runner, over the real comment bodies from the incident.
#
# Both halves are proved, per the macos-brew-smoke.yml fault-injection
# template: the bare substring test that shipped before this fix MATCHES the
# looping message (so the loop is reproduced), while the gate REFUSES it.

on:
  push:
    paths:
      - ".github/actions/comment-token-gate/**"
      - ".github/workflows/comment-token-gate-smoke.yml"
      - "scripts/agents/lib/comment_tokens.py"
      - "scripts/agents/lib/stop_loop_guard.py"
  pull_request:
    paths:
      - ".github/actions/comment-token-gate/**"
      - ".github/workflows/comment-token-gate-smoke.yml"
      - "scripts/agents/lib/comment_tokens.py"
      - "scripts/agents/lib/stop_loop_guard.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-behavior:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- the message that caused the loop -------------------------------
      - name: "Reproduce: the old substring rule matches the stop message"
        shell: bash
        run: |
          set -euo pipefail
          BODY='⏹️ **Developer Agent**: Stopping -- issue is no longer In Progress in the project (or is not in the project). This run will not proceed past this check. If this was a manual circuit breaker, no action is needed; move the issue back to In Progress and comment `RETRY_IMPLEMENTATION` to resume.'
          # This is what the job `if:` did before #3790 -- and why a stop
          # produced a start, ~500 times across #3782/#3784.
          if printf '%s' "$BODY" | grep -q 'RETRY_IMPLEMENTATION'; then
            echo "::notice::Confirmed: the bare substring test matches this message (the defect)."
          else
            echo "::error::Fault injection failed -- the incident message no longer contains the token, so this job proves nothing."
            exit 1
          fi

      - name: "Fix: the gate refuses the stop message"
        id: incident
        uses: ./.github/actions/comment-token-gate
        with:
          token: RETRY_IMPLEMENTATION
          comment-body: "⏹️ **Developer Agent**: Stopping -- issue is no longer In Progress in the project (or is not in the project). This run will not proceed past this check. If this was a manual circuit breaker, no action is needed; move the issue back to In Progress and comment `RETRY_IMPLEMENTATION` to resume."

      - name: "Fix: a genuine auto-retry comment still starts work"
        id: auto_retry
        uses: ./.github/actions/comment-token-gate
        with:
          token: RETRY_IMPLEMENTATION
          comment-body: |
            ⚠️ **Developer Agent**: Workflow failed - auto-retry triggered.

            **Failed step:** Check if PR already exists

            RETRY_IMPLEMENTATION
            <!-- nyxgpt-retry: step=check_if_pr_already_exists sig=abc123 n=1 -->

      - name: "Escalation guidance naming the token is inert"
        id: escalation
        uses: ./.github/actions/comment-token-gate
        with:
          token: RETRY_IMPLEMENTATION
          comment-body: |
            ❌ **Developer Agent**: Auto-retry stopped.

            3. Comment on this issue (as the repo owner) to reset the budget, then comment `RETRY_IMPLEMENTATION` to try again

            <!-- nyxgpt-token-mention -->

      # --- the sibling tokens, same gate ----------------------------------
      - name: "Kick token: a real kick proceeds"
        id: kick
        uses: ./.github/actions/comment-token-gate
        with:
          token: READY_FOR_NEXT_ISSUE
          comment-body: "READY_FOR_NEXT_ISSUE"

      - name: "Kick token: a park note naming it does not"
        id: park
        uses: ./.github/actions/comment-token-gate
        with:
          token: READY_FOR_NEXT_ISSUE
          comment-body: "Sprint boundary reached -- parking. A READY_FOR_NEXT_ISSUE from the owner pulls work forward."

      - name: "Owner command: @improvement issued proceeds"
        id: improvement
        uses: ./.github/actions/comment-token-gate
        with:
          token: "@improvement"
          comment-body: "@improvement the settings page needs a save button"

      - name: "Owner command: @improvement discussed does not"
        id: improvement_prose
        uses: ./.github/actions/comment-token-gate
        with:
          token: "@improvement"
          comment-body: "I already filed that as an @improvement on #3731, no need to file another."

      - name: "Quoted commands cannot be replayed"
        id: quoted
        uses: ./.github/actions/comment-token-gate
        with:
          token: RETRY_IMPLEMENTATION
          comment-body: |
            Quoting the earlier comment for context:

            > RETRY_IMPLEMENTATION

            That run already happened.

      - name: Assert every verdict
        shell: bash
        env:
          INCIDENT: ${{ steps.incident.outputs.proceed }}
          AUTO_RETRY: ${{ steps.auto_retry.outputs.proceed }}
          ESCALATION: ${{ steps.escalation.outputs.proceed }}
          KICK: ${{ steps.kick.outputs.proceed }}
          PARK: ${{ steps.park.outputs.proceed }}
          IMPROVEMENT: ${{ steps.improvement.outputs.proceed }}
          IMPROVEMENT_PROSE: ${{ steps.improvement_prose.outputs.proceed }}
          QUOTED: ${{ steps.quoted.outputs.proceed }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" actual="$2" expected="$3"
            if [[ "$actual" == "$expected" ]]; then
              echo "ok   $name -> proceed=$actual"
            else
              echo "FAIL $name -> proceed=$actual (expected $expected)"
              fail=1
            fi
          }
          check "incident stop message"        "$INCIDENT"          false
          check "auto-retry command"           "$AUTO_RETRY"        true
          check "escalation guidance"          "$ESCALATION"        false
          check "owner kick"                   "$KICK"              true
          check "park note"                    "$PARK"              false
          check "@improvement issued"          "$IMPROVEMENT"       true
          check "@improvement discussed"       "$IMPROVEMENT_PROSE" false
          check "quoted command"               "$QUOTED"            false
          exit "$fail"

  loop-guard-behavior:
    # The other half of #3790: after N stop-without-progress cycles in M
    # minutes, the stop path escalates once and then goes silent.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Three stop cycles escalate exactly once, then go quiet
        shell: bash
        run: |
          set -euo pipefail
          GUARD="scripts/agents/lib/stop_loop_guard.py"
          NOW="2026-08-15T03:00:00Z"
          thread='[]'
          actions=""
          for i in 1 2 3 4 5; do
            decision=$(printf '%s' "$thread" | python3 "$GUARD" evaluate --now "$NOW")
            action=$(jq -r '.action' <<<"$decision")
            actions="$actions $action"
            case "$action" in
              stop-comment) marker="<!-- nyxgpt-dev-stop-cycle -->" ;;
              escalate)     marker="<!-- nyxgpt-dev-stop-halted -->" ;;
              *)            marker="" ;;
            esac
            if [[ -n "$marker" ]]; then
              thread=$(jq -c --arg b "$marker" --arg t "2026-08-15T02:5${i}:00Z" \
                '. + [{body: $b, created_at: $t, author_association: "NONE"}]' <<<"$thread")
            fi
          done
          echo "actions:$actions"
          [[ "$actions" == " stop-comment stop-comment escalate silent silent" ]] || {
            echo "::error::loop guard did not converge to one escalation then silence"
            exit 1
          }

      - name: An owner comment clears the halt
        shell: bash
        run: |
          set -euo pipefail
          thread='[
            {"body":"<!-- nyxgpt-dev-stop-cycle -->","created_at":"2026-08-15T02:50:00Z","author_association":"NONE"},
            {"body":"<!-- nyxgpt-dev-stop-cycle -->","created_at":"2026-08-15T02:52:00Z","author_association":"NONE"},
            {"body":"<!-- nyxgpt-dev-stop-halted -->","created_at":"2026-08-15T02:54:00Z","author_association":"NONE"},
            {"body":"put it back In Progress","created_at":"2026-08-15T02:56:00Z","author_association":"OWNER"}
          ]'
          cleared=$(printf '%s' "$thread" \
            | python3 scripts/agents/lib/stop_loop_guard.py gate --now "2026-08-15T03:00:00Z" \
            | jq -r '.proceed')
          [[ "$cleared" == "true" ]] || {
            echo "::error::owner comment did not clear the stop-loop halt"
            exit 1
          }
          still_halted=$(jq -c 'del(.[3])' <<<"$thread" \
            | python3 scripts/agents/lib/stop_loop_guard.py gate --now "2026-08-15T03:00:00Z" \
            | jq -r '.proceed')
          [[ "$still_halted" == "false" ]] || {
            echo "::error::the halt did not block an agent retry in the first place"
            exit 1
          }
