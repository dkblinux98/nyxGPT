name: Comment Token Gate Smoke

# Which question does this job answer? (#3775 executed verification)
#
#   "When a comment that merely NAMES a command token arrives, does the
#    trigger gate actually refuse to start work -- and does a comment that
#    ISSUES the token still start it? And are the two retired levers
#    (#3882) really gone rather than merely unused?"
#
# The unit tests cover the decision function. They cannot cover the part that
# broke on 2026-08-15 (#3790): the gate as a *composite action executing on a
# runner* -- the shell quoting of an arbitrary comment body, the env
# hand-off, the exit-code plumbing into `proceed`. This job runs the real
# action, on a real runner, over the real comment bodies from the incident.
#
# Both halves are proved, per the macos-brew-smoke.yml fault-injection
# template: the bare substring test that shipped before this fix MATCHES the
# looping message (so the loop is reproduced), while the gate REFUSES it.

on:
  push:
    paths:
      - ".github/actions/comment-token-gate/**"
      - ".github/workflows/comment-token-gate-smoke.yml"
      - ".github/workflows/developer_auto_implement.yml"
      - "scripts/agents/lib/comment_tokens.py"
      - "scripts/agents/lib/stop_loop_guard.py"
  pull_request:
    paths:
      - ".github/actions/comment-token-gate/**"
      - ".github/workflows/comment-token-gate-smoke.yml"
      - ".github/workflows/developer_auto_implement.yml"
      - "scripts/agents/lib/comment_tokens.py"
      - "scripts/agents/lib/stop_loop_guard.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-behavior:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- the incident shape, on a token that still exists ---------------
      # The 2026-08-15 loop was a stop message that NAMED the retry token
      # being matched by the trigger's bare `contains()`. That token is gone
      # (#3882: work is dispatched by assignment, never by comment text), so
      # the same shape is injected here with a surviving token: an agent
      # comment that discusses a command must never issue it.
      - name: "Reproduce: the old substring rule matches a comment that only names the token"
        shell: bash
        run: |
          set -euo pipefail
          BODY='🚫 **Dispatch refused**: if rework is genuinely needed, file it with `@improvement` on the feature issue instead.'
          if printf '%s' "$BODY" | grep -q '@improvement'; then
            echo "::notice::Confirmed: the bare substring test matches this message (the defect)."
          else
            echo "::error::Fault injection failed -- the message no longer contains the token, so this job proves nothing."
            exit 1
          fi

      - name: "Fix: the gate refuses a comment that only names the token"
        id: incident
        uses: ./.github/actions/comment-token-gate
        with:
          token: "@improvement"
          comment-body: "🚫 **Dispatch refused**: if rework is genuinely needed, file it with `@improvement` on the feature issue instead."

      - name: "Guidance carrying the informational marker is inert"
        id: escalation
        uses: ./.github/actions/comment-token-gate
        with:
          token: "@improvement"
          comment-body: |
            ❌ **Developer Agent**: Auto-retry stopped.

            @improvement is how a spec gap gets filed -- but not from this comment.

            <!-- nyxgpt-token-mention -->

      # --- the sibling tokens, same gate ----------------------------------
      - name: "Owner command: @improvement issued proceeds"
        id: improvement
        uses: ./.github/actions/comment-token-gate
        with:
          token: "@improvement"
          comment-body: "@improvement the settings page needs a save button"

      - name: "Owner command: @improvement discussed does not"
        id: improvement_prose
        uses: ./.github/actions/comment-token-gate
        with:
          token: "@improvement"
          comment-body: "I already filed that as an @improvement on #3731, no need to file another."

      - name: "Owner command: the conflict escalation token issued proceeds"
        id: conflict
        uses: ./.github/actions/comment-token-gate
        with:
          token: CONFLICT_REQUIRES_OWNER_DECISION
          comment-body: |
            CONFLICT_REQUIRES_OWNER_DECISION

            Both sides of this conflict are owner-accepted behavior.

      - name: "Quoted commands cannot be replayed"
        id: quoted
        uses: ./.github/actions/comment-token-gate
        with:
          token: "@acceptance-failure"
          comment-body: |
            Quoting the earlier comment for context:

            > @acceptance-failure the install fails on a clean Mac

            That issue was already filed.

      # --- the retired levers, proved absent (#3882) -----------------------
      - name: "Retired: no token can start developer work any more"
        shell: bash
        run: |
          set -euo pipefail
          TOKENS="$(python3 scripts/agents/lib/comment_tokens.py tokens)"
          echo "$TOKENS"
          fail=0
          # Split so this file is not itself a mention of either token.
          for retired in "RETRY_""IMPLEMENTATION" "READY_FOR_NEXT""_ISSUE"; do
            if printf '%s\n' "$TOKENS" | grep -qx "$retired"; then
              echo "::error::$retired is a live command token again -- #3882 deleted it"
              fail=1
            fi
            if grep -rq "$retired" .github/workflows/developer_auto_implement.yml; then
              echo "::error::the developer workflow names $retired again"
              fail=1
            fi
          done
          # And the workflow subscribes to no comment event at all.
          if python3 -c "import sys,yaml; d=yaml.safe_load(open('.github/workflows/developer_auto_implement.yml')); t=d[True] if True in d else d['on']; sys.exit(0 if 'issue_comment' in t else 1)"; then
            echo "::error::developer_auto_implement.yml is comment-triggered again"
            fail=1
          fi
          exit "$fail"

      - name: Assert every verdict
        shell: bash
        env:
          INCIDENT: ${{ steps.incident.outputs.proceed }}
          ESCALATION: ${{ steps.escalation.outputs.proceed }}
          IMPROVEMENT: ${{ steps.improvement.outputs.proceed }}
          IMPROVEMENT_PROSE: ${{ steps.improvement_prose.outputs.proceed }}
          CONFLICT: ${{ steps.conflict.outputs.proceed }}
          QUOTED: ${{ steps.quoted.outputs.proceed }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" actual="$2" expected="$3"
            if [[ -z "$actual" ]]; then
              # `steps.<id>.outputs.proceed` for a step that no longer exists
              # expands to the empty string, so deleting a gate step without
              # its assertion reds this job with no hint of why. #3917 retired
              # READY_FOR_NEXT_ISSUE and removed its two steps but left the
              # `kick`/`park` checks behind; say what happened instead.
              echo "FAIL $name -> no verdict (its gate step is missing -- delete this check or restore the step)"
              fail=1
            elif [[ "$actual" == "$expected" ]]; then
              echo "ok   $name -> proceed=$actual"
            else
              echo "FAIL $name -> proceed=$actual (expected $expected)"
              fail=1
            fi
          }
          check "comment naming the token"      "$INCIDENT"          false
          check "marked guidance"               "$ESCALATION"        false
          check "@improvement issued"           "$IMPROVEMENT"       true
          check "@improvement discussed"        "$IMPROVEMENT_PROSE" false
          check "conflict token issued"         "$CONFLICT"          true
          check "quoted command"                "$QUOTED"            false
          exit "$fail"

  loop-guard-behavior:
    # The other half of #3790: after N stop-without-progress cycles in M
    # minutes, the stop path escalates once and then goes silent.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Three stop cycles escalate exactly once, then go quiet
        shell: bash
        run: |
          set -euo pipefail
          GUARD="scripts/agents/lib/stop_loop_guard.py"
          NOW="2026-08-15T03:00:00Z"
          thread='[]'
          actions=""
          for i in 1 2 3 4 5; do
            decision=$(printf '%s' "$thread" | python3 "$GUARD" evaluate --now "$NOW")
            action=$(jq -r '.action' <<<"$decision")
            actions="$actions $action"
            case "$action" in
              stop-comment) marker="<!-- nyxgpt-dev-stop-cycle -->" ;;
              escalate)     marker="<!-- nyxgpt-dev-stop-halted -->" ;;
              *)            marker="" ;;
            esac
            if [[ -n "$marker" ]]; then
              thread=$(jq -c --arg b "$marker" --arg t "2026-08-15T02:5${i}:00Z" \
                '. + [{body: $b, created_at: $t, author_association: "NONE"}]' <<<"$thread")
            fi
          done
          echo "actions:$actions"
          [[ "$actions" == " stop-comment stop-comment escalate silent silent" ]] || {
            echo "::error::loop guard did not converge to one escalation then silence"
            exit 1
          }

      - name: An owner comment clears the halt
        shell: bash
        run: |
          set -euo pipefail
          thread='[
            {"body":"<!-- nyxgpt-dev-stop-cycle -->","created_at":"2026-08-15T02:50:00Z","author_association":"NONE"},
            {"body":"<!-- nyxgpt-dev-stop-cycle -->","created_at":"2026-08-15T02:52:00Z","author_association":"NONE"},
            {"body":"<!-- nyxgpt-dev-stop-halted -->","created_at":"2026-08-15T02:54:00Z","author_association":"NONE"},
            {"body":"put it back In Progress","created_at":"2026-08-15T02:56:00Z","author_association":"OWNER"}
          ]'
          cleared=$(printf '%s' "$thread" \
            | python3 scripts/agents/lib/stop_loop_guard.py gate --now "2026-08-15T03:00:00Z" \
            | jq -r '.proceed')
          [[ "$cleared" == "true" ]] || {
            echo "::error::owner comment did not clear the stop-loop halt"
            exit 1
          }
          still_halted=$(jq -c 'del(.[3])' <<<"$thread" \
            | python3 scripts/agents/lib/stop_loop_guard.py gate --now "2026-08-15T03:00:00Z" \
            | jq -r '.proceed')
          [[ "$still_halted" == "false" ]] || {
            echo "::error::the halt did not block an agent retry in the first place"
            exit 1
          }
