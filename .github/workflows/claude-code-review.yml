name: Claude Code Review

on:
  # Triggered when review-agent is assigned as reviewer or new commits pushed
  pull_request:
    types: [review_requested, synchronize]
  # Manual trigger via issue comment
  issue_comment:
    types: [created]
  # Manual trigger via Actions UI
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

jobs:
  claude-review:
    # Only run when:
    # 1. Review-agent is requested as reviewer (review_requested)
    # 2. PR updated (synchronize) and review-agent is already assigned
    # 3. Manual trigger via @review comment on PR
    # 4. Manual trigger via workflow_dispatch
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'review_requested' &&
       github.event.requested_reviewer.login == vars.REVIEW_AGENT) ||
      (github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
       (contains(toJSON(github.event.pull_request.requested_reviewers.*.login),
                 vars.REVIEW_AGENT) ||
        contains(toJSON(github.event.pull_request.assignees.*.login),
                 vars.REVIEW_AGENT))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '@review') &&
       (github.event.comment.user.login == vars.HUMAN_OWNER ||
        github.event.comment.user.login == vars.REVIEW_AGENT ||
        github.event.comment.user.login == vars.DEV_AGENT)) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for complete PR diff review

      - name: Determine PR number
        id: pr_number
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "pr=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify PR head repo (fork guard)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR="${{ steps.pr_number.outputs.pr }}"

          # A review that reaches APPROVE feeds review_agent_auto_review.yml's
          # merge path via the pull_request_review event. Refusing fork PRs
          # here closes the chain at its first link, regardless of trigger
          # (review_requested/synchronize/@review comment/workflow_dispatch).
          HEAD_REPO=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.head.repo.full_name')

          if [[ "$HEAD_REPO" != "${{ github.repository }}" ]]; then
            echo "::error::PR #$PR head repo ($HEAD_REPO) is not this repo -- refusing fork PR"
            exit 1
          fi

          echo "✓ PR #$PR head repo matches ${{ github.repository }}"

      - name: Checkout PR head (workflow_dispatch / issue_comment)
        # workflow_dispatch and issue_comment have no pull_request context, so
        # the initial checkout above just gets the default branch.
        # Without this, everything downstream - local lint/test runs, and the
        # review action's own PR resolution - operates against the wrong ref:
        # workflow_dispatch runs failed PR resolution (observed 2026-07-06,
        # run 28809504157), and @review-triggered re-reviews silently ran the
        # entire lint/test/coverage gate against the base branch instead of the PR
        # head - producing verdicts about code the PR didn't contain (observed
        # 2026-07-29, run 30442477033, the #3420 escalation: four REQUEST_CHANGES
        # cycles blocked on a coverage failure that lived in the base).
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.pr_number.outputs.pr }}"
          HEAD_REF="$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.head.ref')"
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

      - name: Detect changed languages
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.pr_number.outputs.pr }}"
          # Cached to $RUNNER_TEMP/pr-changed-files.txt: the coverage and
          # docs-check steps below reuse this instead of re-fetching the
          # same file list from the API.
          CHANGED_FILES=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" \
            --paginate --jq '.[].filename')
          echo "$CHANGED_FILES" > "$RUNNER_TEMP/pr-changed-files.txt"

          if echo "$CHANGED_FILES" | grep -qE '^web/'; then
            echo "web_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED_FILES" | grep -qE '^(src|tests)/.*\.py$'; then
            echo "python_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "python_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linters
        id: lint
        run: |
          echo "Running code quality checks..."

          # Run ruff (if configured)
          if command -v ruff &> /dev/null; then
            echo "Running ruff..."
            python -m ruff check . || echo "ruff_failed=true" >> "$GITHUB_OUTPUT"
          fi

          # Run mypy (if configured)
          if [ -f "pyproject.toml" ] && grep -q "mypy" pyproject.toml; then
            echo "Running mypy..."
            python -m mypy src/ || echo "mypy_failed=true" >> "$GITHUB_OUTPUT"
          fi

          # Run black --check (if configured)
          if command -v black &> /dev/null; then
            echo "Running black --check..."
            python -m black --check . || echo "black_failed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Linter checks complete"

      - name: Run tests
        id: test
        run: |
          echo "Running pytest (unit tests only)..."
          python -m pytest tests/unit/ -v \
            --cov=src/nyxgpt --cov-report=term-missing \
            || echo "pytest_failed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.changed.outputs.web_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        if: steps.changed.outputs.web_changed == 'true'
        run: cd web && npm ci

      - name: Run web checks
        id: web_lint
        if: steps.changed.outputs.web_changed == 'true'
        run: |
          echo "Running tsc --noEmit..."
          (cd web && npx tsc --noEmit) || echo "tsc_failed=true" >> "$GITHUB_OUTPUT"

          echo "Running vitest..."
          (cd web && npx vitest run --coverage) || echo "vitest_failed=true" >> "$GITHUB_OUTPUT"

      - name: Check test coverage
        id: test_coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.pr_number.outputs.pr }}"

          echo "Checking if tests were updated with code changes..."

          # Reuse the file list cached by the "Detect changed languages" step
          # instead of re-fetching it from the API.
          CHANGED_FILES=$(cat "$RUNNER_TEMP/pr-changed-files.txt")

          # Check if source code changed (Python src/, or web/src TS/JS, excluding test files)
          SRC_CODE_CHANGED=$(echo "$CHANGED_FILES" |
                             grep -E '^(src/.*\.py|web/src/.*\.(ts|tsx|js|jsx))$' |
                             grep -v -E '(test_|_test\.py|/tests/|\.test\.|\.spec\.)' || echo "")

          # Check if test files changed (Python tests/, or web/tests TS/JS specs)
          TESTS_CHANGED=$(echo "$CHANGED_FILES" |
                         grep -E '(^tests/|test_.*\.py$|.*_test\.py$|^web/tests/)' ||
                         echo "")
          WEB_SPEC_CHANGED=$(echo "$CHANGED_FILES" |
                             grep -E '\.(test|spec)\.(ts|tsx|js|jsx)$' || echo "")
          TESTS_CHANGED="${TESTS_CHANGED}${WEB_SPEC_CHANGED}"

          if [[ -n "$SRC_CODE_CHANGED" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"

            if [[ -z "$TESTS_CHANGED" ]]; then
              echo "tests_updated=false" >> "$GITHUB_OUTPUT"
              echo "::error::Source code changed but no test files updated"
            else
              echo "tests_updated=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Test files updated with code changes"
            fi
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "tests_updated=true" >> "$GITHUB_OUTPUT"  # Not applicable
          fi

      - name: Check documentation updates
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.pr_number.outputs.pr }}"

          echo "Checking if documentation was updated..."

          # Reuse the file list cached by the "Detect changed languages" step
          # instead of re-fetching it from the API.
          CHANGED_FILES=$(cat "$RUNNER_TEMP/pr-changed-files.txt")

          # Check if code files changed (Python src/, or web/src TS/JS, excluding tests)
          CODE_CHANGED=$(echo "$CHANGED_FILES" |
                        grep -E '^(src/.*\.py|web/src/.*\.(ts|tsx|js|jsx))$' |
                        grep -v -E '(test_|\.test\.|\.spec\.)' || echo "")

          # Check if docs changed
          DOCS_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^(docs/|README\.md|.*\.md$)' || echo "")

          # Check if this is a user-facing change (API, CLI, config, or any web UI surface)
          USER_FACING=$(echo "$CHANGED_FILES" |
                        grep -E '^(src/nyxgpt/(api|cli|app)\.py|example\.config\.ini|web/src/.*\.(ts|tsx|js|jsx))' |
                        grep -v -E '(\.test\.|\.spec\.)' ||
                        echo "")

          if [[ -n "$CODE_CHANGED" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"

            if [[ -z "$DOCS_CHANGED" ]]; then
              echo "docs_updated=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Code changed but no documentation files updated"

              if [[ -n "$USER_FACING" ]]; then
                echo "user_facing_undocumented=true" >> "$GITHUB_OUTPUT"
                echo "::error::User-facing code changed but no documentation updated"
              fi
            else
              echo "docs_updated=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Documentation files updated"
            fi
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "docs_updated=true" >> "$GITHUB_OUTPUT"  # Not applicable
          fi

      - name: Check for previous REQUEST_CHANGES reviews
        id: previous_review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.pr_number.outputs.pr }}"

          # Get most recent CHANGES_REQUESTED review
          # Check actual GitHub reviews, not comments
          # --jq runs once per fetched page, not once over the combined
          # result set -- stream matching reviews across all pages first,
          # then slurp+last in a second jq pass (see AGENTS.md).
          PREVIOUS_ISSUES=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" --paginate --jq '
            .[] | select(.state == "CHANGES_REQUESTED")
          ' | jq -s -r '
            last | .body // ""
          ')

          if [[ -n "$PREVIOUS_ISSUES" ]]; then
            echo "is_rereview=true" >> "$GITHUB_OUTPUT"
            # Save to file for Claude to read
            echo "$PREVIOUS_ISSUES" > "$RUNNER_TEMP/previous-review.txt"
            echo "previous_review_file=$RUNNER_TEMP/previous-review.txt" >> "$GITHUB_OUTPUT"
            echo "::notice::Found previous REQUEST_CHANGES review - will focus on fix verification"
          else
            echo "is_rereview=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No previous REQUEST_CHANGES - will perform full review"
          fi

      - name: Write MCP config
        run: |
          cat > $RUNNER_TEMP/mcp-config.json <<'EOF'
          {
            "mcpServers": {
              "sequential-thinking": {
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-sequential-thinking"]
              }
            }
          }
          EOF

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.REVIEW_AGENT_TOKEN }}
          prompt: |
            Review PR #${{ steps.pr_number.outputs.pr }} according to the review-agent charter and runbook.

            ## Test and Linter Results (REQUIRED for APPROVE)

            **Linter Status:**
            - Ruff: ${{ steps.lint.outputs.ruff_failed == 'true' && '❌ FAILED' || '✅ PASSED' }}
            - Mypy: ${{ steps.lint.outputs.mypy_failed == 'true' && '❌ FAILED' || '✅ PASSED' }}
            - Black: ${{ steps.lint.outputs.black_failed == 'true' && '❌ FAILED' || '✅ PASSED' }}

            **Test Status:**
            - Pytest: ${{ steps.test.outputs.pytest_failed == 'true' && '❌ FAILED' || '✅ PASSED' }}
            - Code changed: ${{ steps.test_coverage.outputs.code_changed }}
            - Tests updated: ${{ steps.test_coverage.outputs.tests_updated }}
            - Code changed without test updates: >-
              ${{ steps.test_coverage.outputs.code_changed == 'true' &&
                 steps.test_coverage.outputs.tests_updated == 'false' &&
                 '❌ YES (BLOCKS APPROVE)' || '✅ NO' }}

            **Web Status (PR touches `web/**`: ${{ steps.changed.outputs.web_changed }}):**
            - TypeScript (tsc --noEmit): >-
              ${{ steps.changed.outputs.web_changed != 'true' && 'N/A' ||
                 steps.web_lint.outputs.tsc_failed == 'true' && '❌ FAILED' || '✅ PASSED' }}
            - Vitest: >-
              ${{ steps.changed.outputs.web_changed != 'true' && 'N/A' ||
                 steps.web_lint.outputs.vitest_failed == 'true' && '❌ FAILED' || '✅ PASSED' }}

            **Documentation Status:**
            - Code changed: ${{ steps.docs.outputs.code_changed }}
            - Docs updated: ${{ steps.docs.outputs.docs_updated }}
            - User-facing changes without docs: >-
              ${{ steps.docs.outputs.user_facing_undocumented == 'true' &&
                 '❌ YES (BLOCKS APPROVE)' || '✅ NO' }}

            MANDATORY: You MUST REQUEST_CHANGES if:
            - ANY linter or test failed (including TypeScript/Vitest when web/** changed)
            - Source code changed WITHOUT test updates (tests_updated=false)
            - User-facing code changed WITHOUT documentation updates (user_facing_undocumented=true)

            Do not APPROVE until all checks pass, tests are updated, AND documentation is complete.

            ## Review Instructions

            **CRITICAL: Review ALL changes in this PR from base branch to feature branch HEAD**
            - Use `gh pr diff ${{ steps.pr_number.outputs.pr }}` to see the COMPLETE diff
            - This shows ALL files that differ between the base and feature branch
            - Review the ENTIRE changeset - every file, every line that would be merged
            - Do NOT review only recent commits - review the complete branch state

            ${{ steps.previous_review.outputs.is_rereview == 'true' && format('
            ## Previous Review Context

            🔄 This is a re-review after previous REQUEST_CHANGES.

            Previous review is in: {0}

            **For each previous Critical/Medium issue:**
            - Check if it is FIXED or STILL PRESENT in the current branch state
            - If STILL PRESENT anywhere in the branch, REQUEST_CHANGES immediately
            - Note: Developer may have fixed issues but also introduced new ones

            ', steps.previous_review.outputs.previous_review_file) || '
            ## Initial Review

            📋 No previous reviews found. This is the first review of this PR.
            ' }}

            **Review Scope (applies to ALL reviews):**
            - Review every file changed between base branch and feature branch HEAD
            - Check for correctness, security, maintainability, test coverage
            - Verify all Critical AND Medium issues are addressed
            - Look for new issues introduced by changes
            - Ensure no regressions in existing functionality

            Perform comprehensive code review checking:

            From agents/runbooks/review-runbook.md checklist:
            - Correctness vs issue acceptance criteria
            - Tests added/updated AND effective: for each new/changed test, ask "would this
              test fail if the implementation was wrong?" If a test would pass even with a
              broken implementation (wrong URL, wrong return value, missing logic, etc.),
              it does not count as test coverage — treat it as missing tests (Medium issue).
            - No architecture boundary violations
            - No secrets committed
            - Clear docs updates for user-facing changes
            - Reasonable maintainability

            Additional quality checks:
            - Code quality and best practices (from CLAUDE.md)
            - Performance considerations and potential bottlenecks
            - Security concerns beyond secret detection
            - Potential bugs or edge cases not covered by tests
            - API contract consistency and backward compatibility

            Severity model:
            - Critical: correctness/security/data-loss/performance regression (MUST block merge)
            - Medium: significant bug risk, missing tests, broken contract, poor maintainability (MUST block merge)
            - Minor: style/nits, minor optimization opportunities (may proceed)

            CRITICAL: Your ONLY task is to post the review comment. DO NOT:
            - Merge the PR
            - Execute any scripts in scripts/agents/
            - Modify issue status or assignments

            A separate automated workflow will read your review decision and execute the appropriate actions.

            REQUIRED: Post your review using the appropriate gh pr review command:
            - For APPROVE: `gh pr review ${{ steps.pr_number.outputs.pr }} --approve --body "<review>"`
            - For REQUEST_CHANGES: `gh pr review ${{ steps.pr_number.outputs.pr }} --request-changes --body "<review>"`

            Use this EXACT format for the review body:

            ## Code Review - [APPROVE|REQUEST_CHANGES]

            ### Summary
            [Brief summary of review findings]
            ${{ steps.previous_review.outputs.is_rereview == 'true' &&
               '[For re-reviews: State whether fixes resolved previous issues]' || '' }}

            ### Test/Linter Results
            - All tests: [PASS/FAIL]
            - All linters: [PASS/FAIL]
            [If any failed, this BLOCKS APPROVE]

            ### Test Coverage
            - Source code changed: [YES/NO]
            - Test files updated: [YES/NO]
            - Tests are effective: [YES/NO/N/A]
              [For each new or changed test, verify: would it fail if the implementation
              was wrong? e.g. wrong URL, wrong return value, missing logic, off-by-one.
              If a test would pass even with a broken implementation, answer NO.]
            [If source code changed without test updates, this BLOCKS APPROVE]
            [If tests exist but would not catch a broken implementation, this BLOCKS APPROVE]

            ### Documentation Status
            - User-facing code changed: [YES/NO]
            - Documentation updated: [YES/NO]
            [If user-facing code changed without docs, this BLOCKS APPROVE]

            ${{ steps.previous_review.outputs.is_rereview == 'true' && '
            ### Fix Verification (for re-reviews)
            [For each previous Critical/Medium issue:]
            - **[Original Issue Title]**: [FIXED ✅ / STILL PRESENT ❌]
              - [If fixed: How it was resolved]
              - [If not fixed: What is still wrong]
            ' || '' }}

            ### Findings
            [Detailed findings organized by severity]
            ${{ steps.previous_review.outputs.is_rereview == 'true' &&
               '[For re-reviews: Only include NEW issues found, not previously reported ones]' || '' }}

            ### Critical Issues (if any)
            - **[Title]**: [Description, file:line references, how to fix]

            ### Medium Issues (if any)
            - **[Title]**: [Description, file:line references, how to fix]

            ### Minor Issues (if any)
            - **[Title]**: [Description or note that these don't block merge]

            ### Disagreement Type (REQUIRED if REQUEST_CHANGES -- #3687 huddle protocol)

            Classify this REQUEST_CHANGES round as exactly one of:
            - **(a) verifiable defect**: a failing test/CI or a reproducible bug. You
              MUST state a *new* diagnosis in this round -- do not just restate or
              lightly reword the previous review's diagnosis. If the previous fix
              attempt did not change your diagnosis at all, treat this as a signal
              you may be looking at a (b) judgment call instead: the fix keeps not
              landing not because the diagnosis is wrong, but because the
              approach itself needs to change.
            - **(b) judgment call**: a design/approach disagreement -- the code
              does what was asked, but you believe a different approach is
              needed. This type never loops -- it goes straight to a huddle
              instead of another fix cycle.
            - **(c) spec ambiguity**: the issue itself is unclear, or resolving
              this needs owner authority no agent conversation can supply
              (product/scope decision, not a code problem). This escalates to
              the owner immediately, cycle zero.

            **[a|b|c]**: [one letter, plus a one-sentence justification]
            [If APPROVE, omit this section entirely.]

            ### Decision
            **[APPROVE|REQUEST_CHANGES]**

            ---

            IMPORTANT:
            - The first line MUST be exactly "## Code Review - APPROVE" or "## Code Review - REQUEST_CHANGES"
            - MUST REQUEST_CHANGES if:
              * Tests or linters failed
              * Source code changed without test updates
              * User-facing code changed without documentation updates
            - For re-reviews: MUST verify ALL previous Critical/Medium issues are resolved
            - Be specific with file paths and line numbers for all issues
            - Explain how to fix blocking issues
            - If tests are missing, add as a Medium issue: "Missing tests for code changes"
            - If documentation is missing, add as a Medium issue: "Missing documentation for user-facing changes"
            - If REQUEST_CHANGES, you MUST include the "### Disagreement Type" section and its
              a/b/c classification -- an automated workflow reads it to decide whether to loop,
              huddle, or escalate (#3687). Type (a) with no new diagnosis this round should
              usually be reclassified as (b).

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          show_full_output: true
          # track_progress is NOT used here: the primary trigger is 'review_requested'
          # which is not in the supported list (opened, synchronize, ready_for_review, reopened)
          # yamllint disable rule:line-length
          claude_args: >-
            --allowed-tools "Bash,Read,Write,Edit,Glob,Grep"
            --mcp-config ${{ runner.temp }}/mcp-config.json
            --json-schema '{"type":"object","properties":{"decision":{"type":"string","enum":["APPROVE","REQUEST_CHANGES"]},"summary":{"type":"string"},"critical_issues":{"type":"array","items":{"type":"string"}},"medium_issues":{"type":"array","items":{"type":"string"}},"disagreement_type":{"type":"string","enum":["a","b","c"],"description":"REQUIRED when decision is REQUEST_CHANGES (#3687 huddle protocol): (a) verifiable defect, (b) judgment call, (c) spec ambiguity. Omit for APPROVE."}},"required":["decision"]}'
          # yamllint enable rule:line-length
          # Note: review_agent_auto_review.yml triggers automatically on the comment
          # via issue_comment event

      - name: Persist structured review output to PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
          STRUCTURED_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          PR="${{ steps.pr_number.outputs.pr }}"
          if [[ -z "$STRUCTURED_OUTPUT" || "$STRUCTURED_OUTPUT" == "null" ]]; then
            echo "No structured output to persist"
            exit 0
          fi
          BODY="<!-- nyxgpt-structured-review: ${STRUCTURED_OUTPUT} -->"
          gh pr comment "$PR" --body "$BODY"
          echo "Persisted structured review output to PR #$PR"

      - name: Check Claude review progress completion
        if: always() && steps.claude-review.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
        run: |
          PR="${{ steps.pr_number.outputs.pr }}"
          # Find the most recent progress comment posted by track_progress.
          # --jq runs once per fetched page -- stream matching comments
          # across all pages first, then slurp+last (see AGENTS.md).
          PROGRESS_BODY=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | test("- \\[[ x]\\]"))' \
            | jq -s -r 'last | .body // ""')
          if [[ -n "$PROGRESS_BODY" ]]; then
            TOTAL=$(echo "$PROGRESS_BODY" | grep -cE -- "- \[[ x]\]" || true)
            DONE=$(echo "$PROGRESS_BODY" | grep -cE -- "- \[x\]" || true)
            PENDING=$(( TOTAL - DONE ))
            echo "Review progress: $DONE/$TOTAL items completed"
            if [[ $PENDING -gt 0 ]]; then
              echo "::warning::$PENDING of $TOTAL review tasks not marked complete in progress comment"
            else
              echo "::notice::All $TOTAL review tasks completed"
            fi
          else
            echo "No progress comment with checkboxes found on PR #$PR"
          fi

      - name: Detect usage-limit signature (self-heal)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
          PR: ${{ steps.pr_number.outputs.pr }}
        run: |
          set +e
          # Same mechanism as developer_auto_implement.yml Phase 0: a review
          # run whose Claude step "completes" in seconds hit the Claude usage
          # limit. Label the PR usage-limit-retry with a retry-after marker;
          # the usage_limit_retry.yml cron re-requests the review agent once
          # the ~5h window has reset.
          #
          # count_fast_claude_steps requires the matching step's own
          # conclusion to be "failure" and excludes skipped/"Post *" steps —
          # without that, the auto-generated "Post Run Claude Code Review"
          # cleanup step (near-zero duration, name matches "claude") made
          # this fire on every failure regardless of cause (#3360).
          source scripts/agents/lib/gh_project.sh
          [ -z "$PR" ] && exit 0

          JOBS_JSON=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" 2>/dev/null)
          [ -z "$JOBS_JSON" ] && exit 0

          FAST_CLAUDE_STEPS=$(count_fast_claude_steps "$JOBS_JSON" "Run Claude Code Review" true)
          [ -z "$FAST_CLAUDE_STEPS" ] && FAST_CLAUDE_STEPS=0

          if [ "$FAST_CLAUDE_STEPS" -lt 1 ]; then
            echo "::notice::No usage-limit signature detected"
            exit 0
          fi
          echo "::warning::Usage-limit signature: $FAST_CLAUDE_STEPS Claude step(s) finished in <90s"

          # --jq runs once per fetched page -- stream matching comments
          # across all pages first, then slurp+count (see AGENTS.md).
          ATTEMPTS=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[].body | select(test("<!-- usage-limit-retry-after:"))' 2>/dev/null \
            | jq -s 'length' || echo 0)
          if [ "${ATTEMPTS:-0}" -ge 8 ]; then
            gh pr comment "$PR" --body "🛑 **Review Agent**: Usage-limit auto-retry gave up after $ATTEMPTS attempts — manual investigation needed (check the CLAUDE_CODE_OAUTH_TOKEN account's limits). Re-request @${{ vars.REVIEW_AGENT }} as reviewer to retry."
            gh pr edit "$PR" --remove-label "usage-limit-retry" 2>/dev/null || true
            exit 0
          fi

          gh label create "usage-limit-retry" \
            --description "Auto-retry pending: run hit Claude usage limits; cron retries after the window resets" \
            --color "C5DEF5" 2>/dev/null || true

          RETRY_AFTER=$(( $(date +%s) + 18000 ))
          RETRY_AT_UTC=$(date -u -d "@$RETRY_AFTER" '+%H:%M UTC' 2>/dev/null || echo "in ~5h")
          gh pr edit "$PR" --add-label "usage-limit-retry"
          gh pr comment "$PR" --body "⏳ **Review Agent**: This review run hit the Claude usage limit. **Auto-retry $((ATTEMPTS + 1))/8 scheduled** for ~$RETRY_AT_UTC — the retry cron will re-request the review automatically.
          <!-- usage-limit-retry-after: $RETRY_AFTER -->"
          exit 0
