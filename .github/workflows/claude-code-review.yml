name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    if: vars.CLAUDE_REVIEW_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for complete PR diff review

      - name: Determine PR number
        id: pr_number
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "pr=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linters
        id: lint
        run: |
          echo "Running code quality checks..."

          # Run ruff (if configured)
          if command -v ruff &> /dev/null; then
            echo "Running ruff..."
            ruff check . || echo "ruff_failed=true" >> "$GITHUB_OUTPUT"
          fi

          # Run mypy (if configured)
          if [ -f "pyproject.toml" ] && grep -q "mypy" pyproject.toml; then
            echo "Running mypy..."
            mypy src/ || echo "mypy_failed=true" >> "$GITHUB_OUTPUT"
          fi

          # Run black --check (if configured)
          if command -v black &> /dev/null; then
            echo "Running black --check..."
            black --check . || echo "black_failed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Linter checks complete"

      - name: Run tests
        id: test
        run: |
          echo "Running pytest..."
          pytest -v || echo "pytest_failed=true" >> "$GITHUB_OUTPUT"

      - name: Check for previous REQUEST_CHANGES reviews
        id: previous_review
        run: |
          PR="${{ steps.pr_number.outputs.pr }}"

          # Get most recent REQUEST_CHANGES comment from claude[bot]
          PREVIOUS_ISSUES=$(gh pr view "$PR" --json comments --jq '
            [.comments[] |
             select(.author.login == "claude" and
                    (.body | startswith("## Code Review - REQUEST_CHANGES")))] |
            last |
            .body // ""
          ')

          if [[ -n "$PREVIOUS_ISSUES" ]]; then
            echo "is_rereview=true" >> "$GITHUB_OUTPUT"
            # Save to file for Claude to read
            echo "$PREVIOUS_ISSUES" > "$RUNNER_TEMP/previous-review.txt"
            echo "previous_review_file=$RUNNER_TEMP/previous-review.txt" >> "$GITHUB_OUTPUT"
            echo "::notice::Found previous REQUEST_CHANGES review - will focus on fix verification"
          else
            echo "is_rereview=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No previous REQUEST_CHANGES - will perform full review"
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ steps.pr_number.outputs.pr }} according to the review-agent charter and runbook.

            ## Test and Linter Results (REQUIRED for APPROVE)

            **Linter Status:**
            - Ruff: ${{ steps.lint.outputs.ruff_failed == 'true' && '❌ FAILED' || '✅ PASSED' }}
            - Mypy: ${{ steps.lint.outputs.mypy_failed == 'true' && '❌ FAILED' || '✅ PASSED' }}
            - Black: ${{ steps.lint.outputs.black_failed == 'true' && '❌ FAILED' || '✅ PASSED' }}

            **Test Status:**
            - Pytest: ${{ steps.test.outputs.pytest_failed == 'true' && '❌ FAILED' || '✅ PASSED' }}

            MANDATORY: You MUST REQUEST_CHANGES if ANY linter or test failed. Do not APPROVE until all checks pass.

            ## Review Context

            ${{ steps.previous_review.outputs.is_rereview == 'true' && format('
            🔄 **This is a RE-REVIEW after previous REQUEST_CHANGES**

            Previous issues are in: {0}

            Read the previous review to see Critical and Medium issues that were identified.

            FOCUS YOUR REVIEW ON:
            1. Verify each Critical issue from the previous review has been FULLY resolved
            2. Verify each Medium issue from the previous review has been FULLY resolved
            3. Check that fixes did not introduce new bugs
            4. Ensure tests were added/updated to prevent regression

            DO NOT re-evaluate the entire codebase. Your job is to verify the fixes to previously identified issues.

            For each previous Critical/Medium issue:
            - State the issue title from the previous review
            - Confirm if it is FIXED or STILL PRESENT
            - If still present, explain what is still wrong
            - If fixed, briefly note how it was resolved

            ', steps.previous_review.outputs.previous_review_file) || format('
            📋 **This is a FULL INITIAL REVIEW**

            No previous REQUEST_CHANGES found. Perform comprehensive code review.

            CRITICAL: Review ALL changes in this PR from base branch to HEAD.
            - Use `gh pr diff {0}` to see the COMPLETE diff
            - Review the ENTIRE changeset, not just the most recent commit
            - This is important for auto-fix loops where multiple commits may exist
            - Every review must assess the full state of the PR, not incremental changes
            ', steps.pr_number.outputs.pr) }}

            Perform comprehensive code review checking:

            From RUNBOOKS/review-runbook.md checklist:
            - Correctness vs issue acceptance criteria
            - Tests added/updated and meaningful
            - No architecture boundary violations
            - No secrets committed
            - Clear docs updates for user-facing changes
            - Reasonable maintainability

            Additional quality checks:
            - Code quality and best practices (from CLAUDE.md)
            - Performance considerations and potential bottlenecks
            - Security concerns beyond secret detection
            - Potential bugs or edge cases not covered by tests
            - API contract consistency and backward compatibility

            Severity model:
            - Critical: correctness/security/data-loss/performance regression (MUST block merge)
            - Medium: significant bug risk, missing tests, broken contract, poor maintainability (MUST block merge)
            - Minor: style/nits, minor optimization opportunities (may proceed)

            CRITICAL: Your ONLY task is to post the review comment. DO NOT:
            - Run review_request_changes.sh
            - Run review_accept_and_merge.sh
            - Create sub-issues
            - Merge the PR
            - Execute any scripts in scripts/agents/

            A separate automated workflow will read your comment and execute the appropriate actions.

            REQUIRED: Post your review as a PR comment using `gh pr comment ${{ steps.pr_number.outputs.pr }} --body "<review>"` with this EXACT format:

            ## Code Review - [APPROVE|REQUEST_CHANGES]

            ### Summary
            [Brief summary of review findings]
            ${{ steps.previous_review.outputs.is_rereview == 'true' && '[For re-reviews: State whether fixes resolved previous issues]' || '' }}

            ### Test/Linter Results
            - All tests: [PASS/FAIL]
            - All linters: [PASS/FAIL]
            [If any failed, this BLOCKS APPROVE]

            ${{ steps.previous_review.outputs.is_rereview == 'true' && '
            ### Fix Verification (for re-reviews)
            [For each previous Critical/Medium issue:]
            - **[Original Issue Title]**: [FIXED ✅ / STILL PRESENT ❌]
              - [If fixed: How it was resolved]
              - [If not fixed: What is still wrong]
            ' || '' }}

            ### Findings
            [Detailed findings organized by severity]
            ${{ steps.previous_review.outputs.is_rereview == 'true' && '[For re-reviews: Only include NEW issues found, not previously reported ones]' || '' }}

            ### Critical Issues (if any)
            - **[Title]**: [Description, file:line references, how to fix]

            ### Medium Issues (if any)
            - **[Title]**: [Description, file:line references, how to fix]

            ### Minor Issues (if any)
            - **[Title]**: [Description or note that these don't block merge]

            ### Decision
            **[APPROVE|REQUEST_CHANGES]**

            ---

            IMPORTANT:
            - The first line MUST be exactly "## Code Review - APPROVE" or "## Code Review - REQUEST_CHANGES"
            - MUST REQUEST_CHANGES if tests or linters failed
            - For re-reviews: MUST verify ALL previous Critical/Medium issues are resolved
            - Each Critical/Medium issue needs a clear title and description for sub-issue creation
            - Be specific with file paths and line numbers
            - Explain how to fix blocking issues

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash,Read,Write,Edit,Glob,Grep"'

      # Note: review_agent_auto_review.yml triggers automatically on the comment via issue_comment event

