name: Claude Code Review

on:
  # Triggered when review-agent is assigned as reviewer or new commits pushed
  pull_request:
    types: [review_requested, synchronize]
  # Manual trigger via issue comment
  issue_comment:
    types: [created]
  # Manual trigger via Actions UI
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

# One review run per pull request, newest wins (#3815).
#
# Without this, two runs can review the same head concurrently -- a
# `review_requested` and a `synchronize`, or a re-review racing an @review
# comment. On PR #3817 that produced CHANGES_REQUESTED and APPROVED from the
# same author two seconds apart over head 6b72c2d9: one run approved and
# merged while the other was still reading the diff and submitted its verdict
# two minutes after the branch was already on the release branch. Downstream
# that verdict re-entered review_agent_auto_review.yml, posted a duplicate
# "approved and merged" comment, mis-counted a first-time finding as a second
# unconverged REQUEST_CHANGES cycle, and burned a huddle on a merged PR --
# also corrupting the review-round statistics the retrospective reports.
#
# cancel-in-progress because a review of a superseded head is worse than no
# review: it is the stale verdict above, and the newer run re-reviews the same
# PR anyway.
concurrency:
  group: >-
    claude-review-${{ github.event.pull_request.number
      || github.event.issue.number
      || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  # A red or pending head is not reviewable (#3971).
  #
  # This job is the only thing between a trigger and a paid review invocation,
  # and it exists because ~36% of blocking review findings in the
  # 2026-08-13..19 window were the review agent relaying check state the PR
  # page already displays -- at a reject round (median 7.2M tokens) plus a
  # review-fix round (median 10.7M) each time.
  #
  #   pending -> WAIT. Nothing is posted, no invocation is spent, and the
  #              review starts when the checks conclude. A PR that is merely
  #              mid-CI is never bounced back to the developer.
  #   failed  -> hand the head back to the developer (head-not-reviewable
  #              below). Still no invocation.
  #   clear   -> review, exactly as before.
  #
  # The decision itself is `await_required_checks` in
  # scripts/agents/lib/gh_project.sh, not inline YAML, so it can be EXECUTED
  # in a test rather than inspected in a diff (D-006);
  # tests/test_reviewable_head_gate.sh drives it and
  # .github/workflows/reviewable-head-smoke.yml runs that on a real runner.
  head-gate:
    # Only run when:
    # 1. Review-agent is requested as reviewer (review_requested)
    # 2. PR updated (synchronize) and review-agent is already assigned
    # 3. Manual trigger via @review comment on PR
    # 4. Manual trigger via workflow_dispatch
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'review_requested' &&
       github.event.requested_reviewer.login == vars.REVIEW_AGENT) ||
      (github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
       (contains(toJSON(github.event.pull_request.requested_reviewers.*.login),
                 vars.REVIEW_AGENT) ||
        contains(toJSON(github.event.pull_request.assignees.*.login),
                 vars.REVIEW_AGENT))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '@review') &&
       (github.event.comment.user.login == vars.HUMAN_OWNER ||
        github.event.comment.user.login == vars.REVIEW_AGENT ||
        github.event.comment.user.login == vars.DEV_AGENT ||
        github.event.comment.user.login == 'claude[bot]')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The wait cap below plus headroom. A job that dies mid-wait is a review
    # that never starts, so this must never be the thing that expires first.
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      pr: ${{ steps.pr_number.outputs.pr }}
      head_sha: ${{ steps.check_state.outputs.head_sha }}
      decision: ${{ steps.check_state.outputs.decision }}
      failed: ${{ steps.check_state.outputs.failed }}
      pending: ${{ steps.check_state.outputs.pending }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine PR number
        id: pr_number
        env:
          # #3837: a dispatch input is typed by whoever dispatched the run, so
          # it reaches the shell as data, never as substituted source.
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "pr=$INPUT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            echo "pr=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify PR head repo (fork guard)
        env:
          PR: ${{ steps.pr_number.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A review that reaches APPROVE feeds review_agent_auto_review.yml's
          # merge path via the pull_request_review event. Refusing fork PRs
          # here closes the chain at its first link, regardless of trigger
          # (review_requested/synchronize/@review comment/workflow_dispatch).
          # It is in the gate, not only in the review job, because the gate
          # runs first and the hand-back job writes to the PR.
          HEAD_REPO=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.head.repo.full_name')

          if [[ "$HEAD_REPO" != "${{ github.repository }}" ]]; then
            echo "::error::PR #$PR head repo ($HEAD_REPO) is not this repo -- refusing fork PR"
            exit 1
          fi

          echo "✓ PR #$PR head repo matches ${{ github.repository }}"

      - name: Checkout PR head (workflow_dispatch / issue_comment)
        # Same reason as in the review job below: those two events carry no
        # pull_request context, so the checkout above is the default branch --
        # and the gate would then read the DEFAULT BRANCH's required-check
        # list, which under this project's branch rules (D-003) only moves at
        # a release ceremony.
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment'
        env:
          PR: ${{ steps.pr_number.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_REF="$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.head.ref')"
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

      - name: Wait for the required checks on this head
        id: check_state
        env:
          PR: ${{ steps.pr_number.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
          WAIT_MINUTES: ${{ vars.REVIEW_CI_WAIT_MINUTES || '60' }}
        run: |
          set -euo pipefail

          # load_config is deliberately NOT used: the two values the check
          # read needs are the repository's own halves, and requiring the
          # project config here would make the gate fail on a missing project
          # variable -- i.e. jam every review to protect against a rare wasted
          # one, which is the trade this whole path refuses.
          source scripts/agents/lib/gh_project.sh
          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          export REPO_OWNER REPO_NAME

          HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.head.sha')"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          # Clamped to the job's own cap. The wait is configurable and the job
          # timeout is not, so a REVIEW_CI_WAIT_MINUTES longer than the job
          # would be killed by the runner mid-wait instead of reporting a
          # timeout: no comment, no notification, no review, and nothing on
          # the PR to say why. Clamp loudly rather than trusting the variable.
          if [[ "$WAIT_MINUTES" -gt 60 ]]; then
            echo "::warning::REVIEW_CI_WAIT_MINUTES=$WAIT_MINUTES exceeds this job's timeout -- waiting 60m instead"
            WAIT_MINUTES=60
          fi

          STATE_BLOCK="$(await_required_checks "$HEAD_SHA" "$((WAIT_MINUTES * 60))" 60 300)"
          echo "$STATE_BLOCK"

          STATE="$(printf '%s\n' "$STATE_BLOCK" | sed -n 's/^state=//p')"
          FAILED="$(printf '%s\n' "$STATE_BLOCK" | sed -n 's/^failed=//p')"
          PENDING="$(printf '%s\n' "$STATE_BLOCK" | sed -n 's/^pending=//p')"

          case "$STATE" in
            failed)
              DECISION="failed"
              echo "::warning::PR #$PR head $HEAD_SHA has failing required" \
                "checks ($FAILED) -- no review invocation will be spent"
              ;;
            timeout)
              DECISION="timeout"
              echo "::warning::PR #$PR head $HEAD_SHA still has pending" \
                "required checks ($PENDING) after ${WAIT_MINUTES}m"
              ;;
            *)
              # clear, and also `unknown` -- an unreadable check list or a
              # GitHub blip proceeds exactly as every review did before this
              # gate existed (see required_check_state's fail-open note).
              DECISION="proceed"
              echo "::notice::PR #$PR head $HEAD_SHA is reviewable (state=$STATE)"
              ;;
          esac

          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"

  claude-review:
    needs: head-gate
    if: needs.head-gate.outputs.decision == 'proceed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for complete PR diff review

      - name: Determine PR number
        id: pr_number
        env:
          PR_FROM_GATE: ${{ needs.head-gate.outputs.pr }}
        run: echo "pr=$PR_FROM_GATE" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head (workflow_dispatch / issue_comment)
        # workflow_dispatch and issue_comment have no pull_request context, so
        # the initial checkout above just gets the default branch.
        # Without this, everything downstream - local lint/test runs, and the
        # review action's own PR resolution - operates against the wrong ref:
        # workflow_dispatch runs failed PR resolution (observed 2026-07-06,
        # run 28809504157), and @review-triggered re-reviews silently ran the
        # entire lint/test/coverage gate against the base branch instead of the PR
        # head - producing verdicts about code the PR didn't contain (observed
        # 2026-07-29, run 30442477033, the #3420 escalation: four REQUEST_CHANGES
        # cycles blocked on a coverage failure that lived in the base).
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment'
        env:
          PR: ${{ steps.pr_number.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_REF="$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.head.ref')"
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

      - name: Detect changed languages
        id: changed
        env:
          PR: ${{ steps.pr_number.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cached to $RUNNER_TEMP/pr-changed-files.txt: the coverage and
          # docs-check steps below reuse this instead of re-fetching the
          # same file list from the API.
          CHANGED_FILES=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" \
            --paginate --jq '.[].filename')
          echo "$CHANGED_FILES" > "$RUNNER_TEMP/pr-changed-files.txt"

          if echo "$CHANGED_FILES" | grep -qE '^web/'; then
            echo "web_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED_FILES" | grep -qE '^(src|tests)/.*\.py$'; then
            echo "python_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "python_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The review no longer re-runs the gates (owner decision, 2026-08-18),
      # and since #3971 it no longer READS them either. AGENTS.md already
      # required the developer to land black/ruff/mypy/pytest green before
      # submitting; the review workflow re-ran all of them anyway, on every
      # round, so an N-round issue paid N times for the same answer -- and
      # then, having stopped re-running them, spent a third of its blocking
      # findings relaying the verdict instead. The `gate` job above decides
      # that now: this job only ever runs on a head whose required checks are
      # green (or on a head the developer overrode, below).
      - name: Read the developer's CI override claim, if any
        id: ci_override
        env:
          PR: ${{ steps.pr_number.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # `developer_submit_for_review.sh --ci-override` writes this marker
          # into the PR body when it submits over a failing required check.
          # It is a CLAIM (typically "the same failure reproduces on the base
          # branch"), and the reviewer's job is to verify it -- which is why
          # it is surfaced here rather than silently trusted.
          BODY="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.body // ""')"
          if [[ "$BODY" == *"<!-- nyxgpt-ci-override -->"* ]]; then
            CLAIM="$(printf '%s\n' "$BODY" | sed -n '/<!-- nyxgpt-ci-override -->/,$p')"
            {
              echo "present=true"
              echo "claim<<NYXGPT_OVERRIDE_EOF"
              printf '%s\n' "$CLAIM"
              echo "NYXGPT_OVERRIDE_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$PR carries a developer CI override -- the review must verify its stated reason"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "claim=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check test coverage
        id: test_coverage
        env:
          PR: ${{ steps.pr_number.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |

          echo "Checking if tests were updated with code changes..."

          # Reuse the file list cached by the "Detect changed languages" step
          # instead of re-fetching it from the API.
          CHANGED_FILES=$(cat "$RUNNER_TEMP/pr-changed-files.txt")

          # Check if source code changed (Python src/, or web/src TS/JS, excluding test files)
          SRC_CODE_CHANGED=$(echo "$CHANGED_FILES" |
                             grep -E '^(src/.*\.py|web/src/.*\.(ts|tsx|js|jsx))$' |
                             grep -v -E '(test_|_test\.py|/tests/|\.test\.|\.spec\.)' || echo "")

          # Check if test files changed (Python tests/, or web/tests TS/JS specs)
          TESTS_CHANGED=$(echo "$CHANGED_FILES" |
                         grep -E '(^tests/|test_.*\.py$|.*_test\.py$|^web/tests/)' ||
                         echo "")
          WEB_SPEC_CHANGED=$(echo "$CHANGED_FILES" |
                             grep -E '\.(test|spec)\.(ts|tsx|js|jsx)$' || echo "")
          TESTS_CHANGED="${TESTS_CHANGED}${WEB_SPEC_CHANGED}"

          if [[ -n "$SRC_CODE_CHANGED" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"

            if [[ -z "$TESTS_CHANGED" ]]; then
              echo "tests_updated=false" >> "$GITHUB_OUTPUT"
              echo "::error::Source code changed but no test files updated"
            else
              echo "tests_updated=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Test files updated with code changes"
            fi
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "tests_updated=true" >> "$GITHUB_OUTPUT"  # Not applicable
          fi

      - name: Check documentation updates
        id: docs
        env:
          PR: ${{ steps.pr_number.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |

          echo "Checking if documentation was updated..."

          # Reuse the file list cached by the "Detect changed languages" step
          # instead of re-fetching it from the API.
          CHANGED_FILES=$(cat "$RUNNER_TEMP/pr-changed-files.txt")

          # Check if code files changed (Python src/, or web/src TS/JS, excluding tests)
          CODE_CHANGED=$(echo "$CHANGED_FILES" |
                        grep -E '^(src/.*\.py|web/src/.*\.(ts|tsx|js|jsx))$' |
                        grep -v -E '(test_|\.test\.|\.spec\.)' || echo "")

          # Check if docs changed
          DOCS_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^(docs/|README\.md|.*\.md$)' || echo "")

          # Check if this is a user-facing change (API, CLI, config, or any web UI surface)
          USER_FACING=$(echo "$CHANGED_FILES" |
                        grep -E '^(src/nyxgpt/(api|cli|app)\.py|example\.config\.ini|web/src/.*\.(ts|tsx|js|jsx))' |
                        grep -v -E '(\.test\.|\.spec\.)' ||
                        echo "")

          if [[ -n "$CODE_CHANGED" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"

            if [[ -z "$DOCS_CHANGED" ]]; then
              echo "docs_updated=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Code changed but no documentation files updated"

              if [[ -n "$USER_FACING" ]]; then
                echo "user_facing_undocumented=true" >> "$GITHUB_OUTPUT"
                echo "::error::User-facing code changed but no documentation updated"
              fi
            else
              echo "docs_updated=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Documentation files updated"
            fi
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
            echo "docs_updated=true" >> "$GITHUB_OUTPUT"  # Not applicable
          fi

      - name: Check for previous REQUEST_CHANGES reviews
        id: previous_review
        env:
          PR: ${{ steps.pr_number.outputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |

          # Get most recent CHANGES_REQUESTED review
          # Check actual GitHub reviews, not comments
          # --jq runs once per fetched page, not once over the combined
          # result set -- stream matching reviews across all pages first,
          # then slurp+last in a second jq pass (see AGENTS.md).
          PREVIOUS_ISSUES=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" --paginate --jq '
            .[] | select(.state == "CHANGES_REQUESTED")
          ' | jq -s -r '
            last | .body // ""
          ')

          if [[ -n "$PREVIOUS_ISSUES" ]]; then
            echo "is_rereview=true" >> "$GITHUB_OUTPUT"
            # Save to file for Claude to read
            echo "$PREVIOUS_ISSUES" > "$RUNNER_TEMP/previous-review.txt"
            echo "previous_review_file=$RUNNER_TEMP/previous-review.txt" >> "$GITHUB_OUTPUT"
            echo "::notice::Found previous REQUEST_CHANGES review - will focus on fix verification"
          else
            echo "is_rereview=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No previous REQUEST_CHANGES - will perform full review"
          fi

      - name: Write MCP config
        run: |
          cat > $RUNNER_TEMP/mcp-config.json <<'EOF'
          {
            "mcpServers": {
              "sequential-thinking": {
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-sequential-thinking"]
              }
            }
          }
          EOF

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.REVIEW_AGENT_TOKEN }}
          # Claude remote sessions act as the claude[bot] GitHub App and are
          # an allowed trigger identity (owner decision 2026-08-18, #3870);
          # without this the action refuses bot-actored runs outright.
          allowed_bots: "claude"
          prompt: |
            Review PR #${{ steps.pr_number.outputs.pr }} according to the review-agent charter and runbook.

            ## CI state is not your job (#3971)

            **The required checks on this head are green.** A gate ran before
            you: a head with a failing required check is refused at submit and
            handed back to the developer, and a head whose checks are still
            pending is waited on, not reviewed. You are only ever invoked on a
            head that passed that gate.

            So do NOT run the gates, do NOT read the check list, and do NOT
            report check state. "CI is red", "N checks pending", "the web
            coverage gate fails", "<job> fails on this head" are NOT findings
            any more -- they are machine-observable facts the PR page already
            shows, and relaying one costs a reject round plus a re-fix round
            (~18M tokens) to say what a glance at the PR says for free. That
            relay was ~36% of all blocking findings in the 2026-08-13..19
            window; this instruction exists to end it.

            Your job is the code: correctness, security, maintainability, the
            acceptance criteria, and whether the tests that exist are the right
            ones.

            ${{ steps.ci_override.outputs.present == 'true' && format('
            ### A developer CI override is on this PR -- VERIFY IT

            This PR was submitted over a failing required check under an
            explicit developer override. The stated reason is a CLAIM, not an
            accepted exception, and verifying it IS your job (unlike the check
            state itself):

            ```
            {0}
            ```

            Check the claim against reality -- e.g. `gh api
            repos/${{ github.repository }}/commits/<base-sha>/check-runs` for
            the same check on the base branch, or the check''s own log. If the
            reason holds, say so in your review and move on. If it does not
            hold (the failure is this PR''s, or nothing supports the claim),
            that IS a blocking finding: cite what you checked and what you
            found. An override is never accepted silently.
            ', steps.ci_override.outputs.claim) || '' }}

            MANDATORY: You MUST REQUEST_CHANGES if:
            - Source code changed WITHOUT test updates (tests_updated=false)
            - User-facing code changed WITHOUT documentation updates
              (user_facing_undocumented=true)
            - This change falsifies a claim written elsewhere in the tree and
              the PR does not fix it (inverse-claims check, review-runbook §1a)
            - The PR makes a runtime/install/platform behavior claim with NO
              executed evidence on the target platform (executed-verification
              gate, review-runbook §1c)
            - The PR fixes a defect whose cause was never established — no
              stated cause, no evidence behind it, or one the thread's own
              evidence contradicts (diagnosis gate, review-runbook §1d)
            - The PR patches one instance of a fault that exists elsewhere in
              the tree, without fixing the class or reporting the search
              (generality gate, review-runbook §1e)

            Do not APPROVE until tests are updated AND documentation is
            complete. CI is not on that list: the gate already answered it.

            ## Inverse-claims check (REQUIRED, review-runbook.md §1a, #3744)

            The documentation criterion above only asks "are docs for this
            change updated?" You MUST also ask the inverse: **what does this
            change make untrue elsewhere?** Consequences for existing prose
            are in scope even when that prose is nowhere near the diff.

            Motivating incident (#3743, 2026-08-13): #3727/#3735 shipped
            repo-less PyPI publishing while README.md still asserted "this has
            not shipped in a PyPI release yet… a repo checkout is still
            required". Both dev and reviewer passed the docs criterion
            honestly — that section was outside the diff's surfaces — and the
            tree shipped a claim the PR itself had falsified.

            Run it like this, before deciding:

            1. Name the capability/behavior/constraint this PR adds, removes,
               or inverts.
            2. Search the WHOLE tree for existing assertions about it — not
               just changed files. e.g.
               `grep -rin "<capability terms>" README.md docs/ agents/ CLAUDE.md product_management/ web/src src/`
               using the capability's own vocabulary plus expiry phrasing
               ("not yet", "does not support", "currently", "still required",
               "will ship", "planned").
            3. Read each hit: is that sentence still true after this merges?
               A sentence this PR turns false — or that describes a workaround
               it makes unnecessary — must be fixed in THIS PR.
            4. A falsified claim found and left unfixed is a **Medium
               (blocking)** finding: cite `file:line`, quote the claim, state
               what is true instead.
            5. Newly introduced world-state claims with built-in expiry
               ("currently published version…", "not yet shipped", "requires a
               checkout") are themselves a **Medium** finding — docs must
               point at living sources instead (PyPI project page,
               `docs/portability-matrix.md`, generated docs, release tracking
               issue). Pre-existing ones are Minor unless this PR falsifies
               them.

            Report the search you actually ran in the `### Documentation
            Status` section, so "no falsified claims" is distinguishable from
            "never checked".

            ## Executed-verification gate (REQUIRED, review-runbook.md §1c, #3775)

            Your review is an *inspection*. Inspection reads a formula and
            concludes the venv bootstraps; it cannot see `ensurepip` exit 1 on
            stock Homebrew, `platform.mac_ver()` answering empty, `npm` absent
            from a cloud image, or a path resolving relative to a repo the
            target does not have. Those four defects (#3753 twice, #3761,
            #3759) all passed review and were all found by the owner running
            the thing once.

            **Nothing reaches owner acceptance testing whose runtime claim has
            not been demonstrated by execution on the target platform.**

            IN SCOPE (executed evidence required): installs and packaging
            (formulas, tarballs, wheels, venv bootstrap, dependency
            resolution); service lifecycle (`nyxgpt ops` install/up/restart/
            down, launchd, systemd, container start, health); provisioning and
            deployment (Terraform, cloud-init, EC2, Kubernetes, Compose);
            cross-platform or OS-specific behavior; anything depending on what
            exists on the target (interpreter version, `npm`, `brew`, `docker`,
            filesystem layout, repo-relative path resolution).

            ACCEPTED EVIDENCE — at least one, cited in the PR by run URL, job
            name, or command transcript:
            1. a CI job run on the target platform; the existing smoke
               workflows count (`macos-brew-smoke.yml`,
               `linux-native-smoke.yml`, `terraform-local-smoke.yml`);
            2. a `workflow_dispatch` run of one of those or another workflow
               exercising the changed path;
            3. `nyxgpt ops verify`, where the change is in its coverage;
            4. the actual command run on the target, with its output.

            It must exercise the CHANGED path on the TARGET platform — a Linux
            job does not verify a macOS keg, and a unit test mocking
            `systemctl` does not verify a systemd unit. Where the runner does
            not naturally reproduce the failure, the evidence must INJECT the
            condition and show both halves: it fails without the fix and
            passes with it (`macos-brew-smoke.yml`'s "Reproduce the empty
            mac_ver() failure, then prove the shim fixes it" step is the
            template — the rc5 candidate passed here and died on the owner's
            Mac precisely because the job only ran the install).

            If NO job covers the changed path, that is the finding, not the
            excuse: the PR must add one (developer-runbook §4a).

            EXEMPT: pure-logic changes fully covered by unit tests; prose-only
            changes (docs, runbooks, prompts) whose contract text is pinned by
            tests; and what `docs/live-verification-ci.md` documents as
            genuinely not-CI-coverable (the native launchd/brew-services
            *operate* path, real Slack delivery, LLM answer quality), plus EC2
            Mac hardware, which has no hosted runner — name which applies and
            what the owner must exercise. The Homebrew keg *install* is NOT on
            that list: `macos-brew-smoke.yml` runs it on a real macos-15
            runner, so "macOS can't be tested in CI" does not excuse a formula
            change. Never REQUEST_CHANGES demanding evidence that is
            structurally impossible to produce, or that a cited run already
            produced.

            Missing executed evidence on an in-scope change is a **Medium
            (blocking)** finding: cite the claim, name the platform it was
            never run on, and say which job would have run it.

            ## Review Instructions

            **CRITICAL: Review ALL changes in this PR from base branch to feature branch HEAD**
            - Use `gh pr diff ${{ steps.pr_number.outputs.pr }}` to see the COMPLETE diff
            - This shows ALL files that differ between the base and feature branch
            - Review the ENTIRE changeset - every file, every line that would be merged
            - Do NOT review only recent commits - review the complete branch state

            ${{ steps.previous_review.outputs.is_rereview == 'true' && format('
            ## Previous Review Context

            🔄 This is a re-review after previous REQUEST_CHANGES.

            Previous review is in: {0}

            **For each previous Critical/Medium issue:**
            - Check if it is FIXED or STILL PRESENT in the current branch state
            - If STILL PRESENT anywhere in the branch, REQUEST_CHANGES immediately
            - Note: Developer may have fixed issues but also introduced new ones

            ', steps.previous_review.outputs.previous_review_file) || '
            ## Initial Review

            📋 No previous reviews found. This is the first review of this PR.
            ' }}

            **Review Scope (applies to ALL reviews):**
            - Review every file changed between base branch and feature branch HEAD
            - Check for correctness, security, maintainability, test coverage
            - Verify all Critical AND Medium issues are addressed
            - Look for new issues introduced by changes
            - Ensure no regressions in existing functionality

            Perform comprehensive code review checking:

            From agents/runbooks/review-runbook.md checklist:
            - Correctness vs issue acceptance criteria
            - Tests added/updated AND effective: for each new/changed test, ask "would this
              test fail if the implementation was wrong?" If a test would pass even with a
              broken implementation (wrong URL, wrong return value, missing logic, etc.),
              it does not count as test coverage — treat it as missing tests (Medium issue).
            - No architecture boundary violations
            - No secrets committed
            - Clear docs updates for user-facing changes
            - Inverse-claims check (§1a): the change does not leave falsified
              claims elsewhere in the tree — check the change's *consequences*
              for existing prose, not only its own surfaces
            - Executed-verification gate (§1c): a runtime/install/platform
              claim is demonstrated by execution on the target platform and
              cited in the PR — inspection alone is not evidence
            - Reasonable maintainability

            Additional quality checks:
            - Code quality and best practices (from CLAUDE.md)
            - Performance considerations and potential bottlenecks
            - Security concerns beyond secret detection
            - Potential bugs or edge cases not covered by tests
            - API contract consistency and backward compatibility

            Severity model:
            - Critical: correctness/security/data-loss/performance regression (MUST block merge)
            - Medium: significant bug risk, missing tests, broken contract, poor maintainability (MUST block merge)
            - Minor: style/nits, minor optimization opportunities (may proceed)

            CRITICAL: Your ONLY task is to post the review comment. DO NOT:
            - Merge the PR
            - Execute any scripts in scripts/agents/
            - Modify issue status or assignments

            A separate automated workflow will read your review decision and execute the appropriate actions.

            REQUIRED: Post your review using the appropriate gh pr review command:
            - For APPROVE: `gh pr review ${{ steps.pr_number.outputs.pr }} --approve --body "<review>"`
            - For REQUEST_CHANGES: `gh pr review ${{ steps.pr_number.outputs.pr }} --request-changes --body "<review>"`

            Use this EXACT format for the review body:

            ## Code Review - [APPROVE|REQUEST_CHANGES]

            ### Summary
            [Brief summary of review findings]
            ${{ steps.previous_review.outputs.is_rereview == 'true' &&
               '[For re-reviews: State whether fixes resolved previous issues]' || '' }}

            ### CI State
            - Required checks on this head: GREEN (the gate would not have
              invoked you otherwise -- do not re-check, do not report)
            - Developer CI override present: [NO / YES + whether the stated
              reason held, and what you checked to decide]

            ### Test Coverage
            - Source code changed: [YES/NO]
            - Test files updated: [YES/NO]
            - Tests are effective: [YES/NO/N/A]
              [For each new or changed test, verify: would it fail if the implementation
              was wrong? e.g. wrong URL, wrong return value, missing logic, off-by-one.
              If a test would pass even with a broken implementation, answer NO.]
            [If source code changed without test updates, this BLOCKS APPROVE]
            [If tests exist but would not catch a broken implementation, this BLOCKS APPROVE]

            ### Documentation Status
            - User-facing code changed: [YES/NO]
            - Documentation updated: [YES/NO]
            [If user-facing code changed without docs, this BLOCKS APPROVE]
            - Inverse-claims check (§1a, #3744) — capability this PR
              adds/removes/inverts: [one line]
            - Tree searched for claims about it: [the exact grep terms and
              paths you ran — required, "N/A" is not an acceptable answer]
            - Claims falsified by this change: [NONE / file:line + quote for each]
            - New expiry-dated world-state claims introduced: [NONE / file:line each]
            [If this change falsifies an existing claim the PR does not fix,
            this BLOCKS APPROVE (Medium)]
            [If the PR introduces a new expiry-dated world-state claim instead
            of pointing at a living source, this BLOCKS APPROVE (Medium)]

            ### Executed Verification
            - Runtime/install/platform claim in this PR: [one line, or NONE —
              pure logic covered by unit tests / prose-only change]
            - Target platform(s) the claim is about: [e.g. macOS Homebrew keg,
              Linux systemd --user, EC2 cloud-init, N/A]
            - Executed evidence cited: [run URL / workflow + job name /
              command transcript — required when a claim is named above;
              "reviewed the code" is NOT evidence]
            - Failure reproduced without the fix: [YES + where / N/A — required
              when the runner does not naturally exhibit the condition (#3753)]
            - Not-CI-coverable items deferred to owner acceptance: [NONE, or
              the specific entries from docs/live-verification-ci.md]
            [If a runtime/install/platform claim has no executed evidence on
            its target, this BLOCKS APPROVE (Medium) — §1c]

            ${{ steps.previous_review.outputs.is_rereview == 'true' && '
            ### Fix Verification (for re-reviews)
            [For each previous Critical/Medium issue:]
            - **[Original Issue Title]**: [FIXED ✅ / STILL PRESENT ❌]
              - [If fixed: How it was resolved]
              - [If not fixed: What is still wrong]
            ' || '' }}

            ### Findings
            [Detailed findings organized by severity]
            ${{ steps.previous_review.outputs.is_rereview == 'true' &&
               '[For re-reviews: Only include NEW issues found, not previously reported ones]' || '' }}

            ### Critical Issues (if any)
            - **[Title]**: [Description, file:line references, how to fix]

            ### Medium Issues (if any)
            - **[Title]**: [Description, file:line references, how to fix]

            ### Minor Issues (if any)
            - **[Title]**: [Description or note that these don't block merge]

            ### Disagreement Type (REQUIRED if REQUEST_CHANGES -- #3687 huddle protocol)

            Classify this REQUEST_CHANGES round as exactly one of:
            - **(a) verifiable defect**: a failing test/CI or a reproducible bug. You
              MUST state a *new* diagnosis in this round -- do not just restate or
              lightly reword the previous review's diagnosis. If the previous fix
              attempt did not change your diagnosis at all, treat this as a signal
              you may be looking at a (b) judgment call instead: the fix keeps not
              landing not because the diagnosis is wrong, but because the
              approach itself needs to change.
            - **(b) judgment call**: a design/approach disagreement -- the code
              does what was asked, but you believe a different approach is
              needed. This type never loops -- it goes straight to a huddle
              instead of another fix cycle.
            - **(c) spec ambiguity**: the issue itself is unclear, or resolving
              this needs owner authority no agent conversation can supply
              (product/scope decision, not a code problem). This escalates to
              the owner immediately, cycle zero.

            **[a|b|c]**: [one letter, plus a one-sentence justification]
            [If APPROVE, omit this section entirely.]

            ### Decision
            **[APPROVE|REQUEST_CHANGES]**

            ---

            IMPORTANT:
            - The first line MUST be exactly "## Code Review - APPROVE" or "## Code Review - REQUEST_CHANGES"
            - MUST REQUEST_CHANGES if:
              * Source code changed without test updates
              * User-facing code changed without documentation updates
              * The change falsifies a claim elsewhere in the tree and the PR
                does not fix it (inverse-claims check, §1a/#3743)
              * A runtime/install/platform claim has no executed evidence on
                its target platform (executed-verification gate, §1c/#3775)
            - For re-reviews: MUST verify ALL previous Critical/Medium issues are resolved
            - Be specific with file paths and line numbers for all issues
            - Explain how to fix blocking issues
            - If tests are missing, add as a Medium issue: "Missing tests for code changes"
            - If documentation is missing, add as a Medium issue: "Missing documentation for user-facing changes"
            - If executed evidence is missing on a runtime/install/platform
              change, add as a Medium issue: "Missing executed verification on
              <target platform>" and name the job that would have run it
            - If REQUEST_CHANGES, you MUST include the "### Disagreement Type" section and its
              a/b/c classification -- an automated workflow reads it to decide whether to loop,
              huddle, or escalate (#3687). Type (a) with no new diagnosis this round should
              usually be reclassified as (b).

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          show_full_output: true
          # track_progress is NOT used here: the primary trigger is 'review_requested'
          # which is not in the supported list (opened, synchronize, ready_for_review, reopened)
          # yamllint disable rule:line-length
          claude_args: >-
            --model ${{ vars.AGENT_MODEL_REVIEW || 'claude-fable-5' }}
            --allowed-tools "Bash,Read,Write,Edit,Glob,Grep"
            --mcp-config ${{ runner.temp }}/mcp-config.json
            --json-schema '{"type":"object","properties":{"decision":{"type":"string","enum":["APPROVE","REQUEST_CHANGES"]},"summary":{"type":"string"},"critical_issues":{"type":"array","items":{"type":"string"}},"medium_issues":{"type":"array","items":{"type":"string"}},"disagreement_type":{"type":"string","enum":["a","b","c"],"description":"REQUIRED when decision is REQUEST_CHANGES (#3687 huddle protocol): (a) verifiable defect, (b) judgment call, (c) spec ambiguity. Omit for APPROVE."}},"required":["decision"]}'
          # yamllint enable rule:line-length
          # Note: review_agent_auto_review.yml triggers automatically on the comment
          # via issue_comment event

      - name: Persist structured review output to PR
        if: always()
        env:
          PR: ${{ steps.pr_number.outputs.pr }}
          GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
          STRUCTURED_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          if [[ -z "$STRUCTURED_OUTPUT" || "$STRUCTURED_OUTPUT" == "null" ]]; then
            echo "No structured output to persist"
            exit 0
          fi
          BODY="<!-- nyxgpt-structured-review: ${STRUCTURED_OUTPUT} -->"
          gh pr comment "$PR" --body "$BODY"
          echo "Persisted structured review output to PR #$PR"

      - name: Ensure REQUEST_CHANGES handoff (workflow_dispatch backstop)
        # The verdict itself is executed by review_agent_auto_review.yml,
        # which only ever reacts to a downstream event: the
        # pull_request_review submission, or the structured-review comment
        # via issue_comment. A dispatched review run cannot observe whether
        # either link fired, and when one drops a REQUEST_CHANGES verdict
        # goes nowhere -- APPROVE merged fine on dispatch (PR #3613) while
        # REQUEST_CHANGES sat for 9+ hours with zero fix activity on PRs
        # #3684/#3683/#3606 until a human re-dispatched the developer by
        # hand (#3704).
        #
        # The script gives the event chain a head start and only acts if no
        # handoff footprint appears, so this is a no-op whenever the normal
        # path works. Scoped to workflow_dispatch: that is the recovery
        # path this issue covers, and event-triggered reviews keep their
        # existing (working) chain untouched.
        #
        # Requiring claude-review to have succeeded keeps this off two paths
        # it has no business on: a fork PR (the fork guard fails earlier, so
        # the review step reports 'skipped'), and a usage-limited run whose
        # review never produced a verdict (that has its own retry handler
        # below). `always()` is still needed so a failure in the persist
        # step above doesn't skip the handoff.
        if: always() && github.event_name == 'workflow_dispatch' && steps.claude-review.conclusion == 'success'
        env:
          PR: ${{ steps.pr_number.outputs.pr }}
          GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
          # #3695 escalation DM, best-effort -- absent secrets degrade to
          # the GitHub comment alone (notify_human_escalation). #3911 signs it
          # as the review agent; the role is set by the called script.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          SLACK_USER_TOKEN_REVIEW: ${{ secrets.SLACK_USER_TOKEN_REVIEW }}
        run: |
          set -euo pipefail

          # Earlier steps checked out the PR head so the review ran against
          # the right code. The handoff scripts must NOT come from there: an
          # older PR branch predates this backstop entirely. Take
          # scripts/agents from the release branch instead -- same source
          # review_agent_auto_review.yml uses (it checks out RELEASE_BRANCH).
          git fetch --no-tags origin "${{ vars.RELEASE_BRANCH }}"
          git checkout FETCH_HEAD -- scripts/agents

          CFG="$RUNNER_TEMP/nyxgpt-config.ini"
          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          RELEASE_ISSUE_NUMBER=${{ vars.RELEASE_ISSUE_NUMBER }}
          SPRINT_AUTOPILOT=${{ vars.SPRINT_AUTOPILOT }}
          SPRINT_FIELD=${{ vars.SPRINT_FIELD }}
          EOF

          NYXGPT_CONFIG_FILE="$CFG" bash scripts/agents/review_ensure_handoff.sh "$PR"

      - name: Check Claude review progress completion
        if: always() && steps.claude-review.conclusion == 'success'
        env:
          PR: ${{ steps.pr_number.outputs.pr }}
          GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
        run: |
          # Find the most recent progress comment posted by track_progress.
          # --jq runs once per fetched page -- stream matching comments
          # across all pages first, then slurp+last (see AGENTS.md).
          PROGRESS_BODY=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | test("- \\[[ x]\\]"))' \
            | jq -s -r 'last | .body // ""')
          if [[ -n "$PROGRESS_BODY" ]]; then
            TOTAL=$(echo "$PROGRESS_BODY" | grep -cE -- "- \[[ x]\]" || true)
            DONE=$(echo "$PROGRESS_BODY" | grep -cE -- "- \[x\]" || true)
            PENDING=$(( TOTAL - DONE ))
            echo "Review progress: $DONE/$TOTAL items completed"
            if [[ $PENDING -gt 0 ]]; then
              echo "::warning::$PENDING of $TOTAL review tasks not marked complete in progress comment"
            else
              echo "::notice::All $TOTAL review tasks completed"
            fi
          else
            echo "No progress comment with checkboxes found on PR #$PR"
          fi

      - name: Detect usage-limit signature (self-heal)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
          PR: ${{ steps.pr_number.outputs.pr }}
        run: |
          set +e
          # Same mechanism as developer_auto_implement.yml Phase 0: a review
          # run whose Claude step "completes" in seconds hit the Claude usage
          # limit. Label the PR usage-limit-retry with a retry-after marker;
          # the usage_limit_retry.yml cron re-requests the review agent once
          # the ~5h window has reset.
          #
          # count_fast_claude_steps requires the matching step's own
          # conclusion to be "failure" and excludes skipped/"Post *" steps —
          # without that, the auto-generated "Post Run Claude Code Review"
          # cleanup step (near-zero duration, name matches "claude") made
          # this fire on every failure regardless of cause (#3360).
          source scripts/agents/lib/gh_project.sh
          [ -z "$PR" ] && exit 0

          JOBS_JSON=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" 2>/dev/null)
          [ -z "$JOBS_JSON" ] && exit 0

          FAST_CLAUDE_STEPS=$(count_fast_claude_steps "$JOBS_JSON" "Run Claude Code Review" true)
          [ -z "$FAST_CLAUDE_STEPS" ] && FAST_CLAUDE_STEPS=0

          if [ "$FAST_CLAUDE_STEPS" -lt 1 ]; then
            echo "::notice::No usage-limit signature detected"
            exit 0
          fi
          echo "::warning::Usage-limit signature: $FAST_CLAUDE_STEPS Claude step(s) finished in <90s"

          # --jq runs once per fetched page -- stream matching comments
          # across all pages first, then slurp+count (see AGENTS.md).
          ATTEMPTS=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[].body | select(test("<!-- usage-limit-retry-after:"))' 2>/dev/null \
            | jq -s 'length' || echo 0)
          if [ "${ATTEMPTS:-0}" -ge 8 ]; then
            gh pr comment "$PR" --body "🛑 **Review Agent**: Usage-limit auto-retry gave up after $ATTEMPTS attempts — manual investigation needed (check the CLAUDE_CODE_OAUTH_TOKEN account's limits). Re-request @${{ vars.REVIEW_AGENT }} as reviewer to retry."
            gh pr edit "$PR" --remove-label "usage-limit-retry" 2>/dev/null || true
            exit 0
          fi

          gh label create "usage-limit-retry" \
            --description "Auto-retry pending: run hit Claude usage limits; cron retries after the window resets" \
            --color "C5DEF5" 2>/dev/null || true

          RETRY_AFTER=$(( $(date +%s) + 18000 ))
          RETRY_AT_UTC=$(date -u -d "@$RETRY_AFTER" '+%H:%M UTC' 2>/dev/null || echo "in ~5h")
          gh pr edit "$PR" --add-label "usage-limit-retry"
          gh pr comment "$PR" --body "⏳ **Review Agent**: This review run hit the Claude usage limit. **Auto-retry $((ATTEMPTS + 1))/8 scheduled** for ~$RETRY_AT_UTC — the retry cron will re-request the review automatically.
          <!-- usage-limit-retry-after: $RETRY_AFTER -->"
          exit 0

  # The head is not reviewable, and saying so costs no review invocation.
  #
  # `failed`  -> a red head is the developer's problem (#3971): hand it back by
  #              assignment, which is the workflow lever (D-028). This is NOT a
  #              REQUEST_CHANGES round -- no verdict is posted, the review cycle
  #              counter is untouched, and the 3-strike escalation is unchanged.
  # `timeout` -> required checks never concluded. Nobody is handed anything;
  #              the PR is told once and the owner is notified.
  #
  # Bounded per head SHA inside the script, so a developer round that
  # re-requests review on the same unchanged head escalates rather than
  # ping-ponging.
  head-not-reviewable:
    needs: head-gate
    if: needs.head-gate.outputs.decision == 'failed' || needs.head-gate.outputs.decision == 'timeout'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
      # #3695 human-channel escalation, best-effort: absent secrets degrade to
      # the PR comment alone (notify_human_escalation). #3911 signs it as the
      # review agent; the role is set by the called script.
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
      SLACK_USER_TOKEN_REVIEW: ${{ secrets.SLACK_USER_TOKEN_REVIEW }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout PR head (workflow_dispatch / issue_comment)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment'
        env:
          PR: ${{ needs.head-gate.outputs.pr }}
        run: |
          set -euo pipefail
          HEAD_REF="$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.head.ref')"
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

      - name: Write ephemeral config.ini
        shell: bash
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"

          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          RELEASE_ISSUE_NUMBER=${{ vars.RELEASE_ISSUE_NUMBER }}
          SPRINT_AUTOPILOT=${{ vars.SPRINT_AUTOPILOT }}
          SPRINT_FIELD=${{ vars.SPRINT_FIELD }}
          EOF

          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"

      - name: Report the unreviewable head
        shell: bash
        env:
          # Every value reaches the script as an argument, never as substituted
          # shell source (#3820/#3837).
          PR: ${{ needs.head-gate.outputs.pr }}
          HEAD_SHA: ${{ needs.head-gate.outputs.head_sha }}
          DECISION: ${{ needs.head-gate.outputs.decision }}
          FAILED: ${{ needs.head-gate.outputs.failed }}
          PENDING: ${{ needs.head-gate.outputs.pending }}
        run: |
          set -euo pipefail
          if [[ "$DECISION" == "failed" ]]; then
            NAMES="$FAILED"
          else
            NAMES="$PENDING"
          fi
          bash scripts/agents/review_head_gate_action.sh "$PR" "$HEAD_SHA" "$DECISION" "$NAMES"
