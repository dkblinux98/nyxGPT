name: Ensure Project Hygiene

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    # `Support`-labeled issues are user support reports (#3745): they belong
    # to the separate nyxGPT Support project's own auto-add workflow, never
    # to the code project. Skipping here is what keeps them out of the agent
    # loop entirely -- no project item, no field stamping, no sprint.
    if: >-
      github.event_name == 'issues'
      && !contains(github.event.issue.labels.*.name, 'Support')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Setup environment
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          # Write config for scripts
          cat > /tmp/nyxgpt-config.ini <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF

          echo "NYXGPT_CONFIG_FILE=/tmp/nyxgpt-config.ini" >> "$GITHUB_ENV"

      - name: Fill missing project fields
        id: set_fields
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          ISSUE=${{ github.event.issue.number }}

          echo "Applying fill-if-missing project hygiene for issue #$ISSUE..."

          # Source library functions
          source scripts/agents/lib/gh_project.sh
          load_config
          require_gh_auth

          # Add to project if not already there (idempotent: a no-op if the
          # issue is already on the board, e.g. via create_issue.sh or
          # assign_backlog.yml).
          ITEM_ID=$(ensure_issue_in_project "$ISSUE")
          echo "Issue #$ISSUE in project: $ITEM_ID"

          # Get issue details for intelligent defaults (plain issue data --
          # REST; no Projects-v2 dependency)
          ISSUE_DATA=$(gh api "repos/${REPO_OWNER}/${REPO_NAME}/issues/${ISSUE}" \
            --jq '{title, body, labels, milestone}')
          TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          BODY=$(echo "$ISSUE_DATA" | jq -r '.body // ""')
          LABELS=$(echo "$ISSUE_DATA" | jq -r '.labels[].name' | tr '\n' ' ')

          FILLED=()

          # Every field below is fill-if-missing: project_field_value is the
          # ONLY signal consulted (owner design principle, #3666) -- a field
          # that already carries any value, however it got there, is left
          # untouched. This makes the creation-time race with create_issue.sh
          # (or a human editing fields on a fresh issue) harmless by
          # construction, so no author-based special case is needed.

          # Status
          CURRENT_STATUS=$(project_field_value "$ITEM_ID" "$STATUS_FIELD")
          if [[ -z "$CURRENT_STATUS" ]]; then
            set_issue_status "$ISSUE" "Backlog"
            echo "✓ Status: Backlog (was unset)"
            FILLED+=("Status: Backlog")
          else
            echo "✓ Status: already '$CURRENT_STATUS' — leaving as-is"
          fi

          # Priority
          CURRENT_PRIORITY=$(project_field_value "$ITEM_ID" "Priority")
          if [[ -z "$CURRENT_PRIORITY" ]]; then
            set_project_field_value "$ITEM_ID" "Priority" "P1 - High"
            echo "✓ Priority: P1 - High (was unset)"
            FILLED+=("Priority: P1 - High")
          else
            echo "✓ Priority: already '$CURRENT_PRIORITY' — leaving as-is"
          fi

          # Effort
          CURRENT_EFFORT=$(project_field_value "$ITEM_ID" "Effort")
          if [[ -z "$CURRENT_EFFORT" ]]; then
            set_project_field_value "$ITEM_ID" "Effort" "XS"
            echo "✓ Effort: XS (was unset)"
            FILLED+=("Effort: XS")
          else
            echo "✓ Effort: already '$CURRENT_EFFORT' — leaving as-is"
          fi

          # Label (Feature by default) -- but only when the issue carries no
          # recognized label yet. The single-label rule
          # (developer_submit_for_review.sh requires exactly one) means adding
          # Feature on top of an existing Improvement/Release Management label
          # created a two-label deadlock that had to be trimmed by hand every
          # time (#3390, #3413, #3415).
          if echo "$LABELS" | grep -qE "Acceptance Failure|Improvement|Release Management|Feature"; then
            echo "✓ Label: already labeled ($LABELS), leaving as-is"
          else
            gh issue edit "$ISSUE" --add-label "Feature"
            echo "✓ Label: Feature (was unset)"
            FILLED+=("Label: Feature")
          fi

          # Module -- determined from title/body keywords, only when unset.
          # The sre branch runs FIRST: observability/SRE issues routinely
          # mention "web"/"api"/"log" in passing, and the old greedy
          # web|ui first-match mis-stamped them (e.g. #3415 stamped web-ui
          # because its body said "Web tier"). The project's Module option
          # was renamed observability -> sre (owner, 2026-07-29).
          CURRENT_MODULE=$(project_field_value "$ITEM_ID" "Module")
          if [[ -z "$CURRENT_MODULE" ]]; then
            MODULE=""
            if echo "$TITLE $BODY" | grep -qiE "\bsre\b|observab|monitor|metric|grafana|prometheus|loki|jaeger|glitchtip|self.heal|tracing|instrumentation"; then
              MODULE="sre"
            elif echo "$TITLE $BODY" | grep -qiE "web|ui|frontend|react|vue"; then
              MODULE="web-ui"
            elif echo "$TITLE $BODY" | grep -qiE "api|endpoint|rest|graphql"; then
              MODULE="api"
            elif echo "$TITLE $BODY" | grep -qiE "rag|embedding|vector|semantic"; then
              MODULE="rag"
            elif echo "$TITLE $BODY" | grep -qiE "cli|command.line|terminal"; then
              MODULE="cli"
            elif echo "$TITLE $BODY" | grep -qiE "tui|terminal.ui"; then
              MODULE="tui"
            elif echo "$TITLE $BODY" | grep -qiE "test|testing|pytest"; then
              MODULE="testing"
            elif echo "$TITLE $BODY" | grep -qiE "doc|documentation|readme"; then
              MODULE="documentation"
            elif echo "$TITLE $BODY" | grep -qiE "security|auth|permission"; then
              MODULE="security"
            elif echo "$TITLE $BODY" | grep -qiE "logging|\blogs?\b"; then
              # Logging/observability catch-all that didn't match the sre
              # branch above (option renamed observability -> sre).
              MODULE="sre"
            else
              MODULE="api"  # Default fallback
            fi
            set_project_field_value "$ITEM_ID" "Module" "$MODULE"
            echo "✓ Module: $MODULE (was unset)"
            FILLED+=("Module: $MODULE")
          else
            echo "✓ Module: already '$CURRENT_MODULE' — leaving as-is"
          fi

          # Sprint -- current sprint (first active iteration), only when unset.
          CURRENT_SPRINT=$(project_field_value "$ITEM_ID" "Sprint")
          if [[ -z "$CURRENT_SPRINT" ]]; then
            # Capture raw output first so a transport/API failure (empty due
            # to error) is distinguishable from a genuinely empty iteration
            # list.
            if ! SPRINT_JSON=$(gh api graphql -f query='
              query($owner:String!, $number:Int!) {
                user(login:$owner) {
                  projectV2(number:$number) {
                    fields(first:20) {
                      nodes {
                        ... on ProjectV2IterationField {
                          name
                          configuration {
                            iterations {
                              id
                              title
                              startDate
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' -F owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" 2>&1); then
              echo "::error::Failed to query Sprint iterations for issue #$ISSUE: $SPRINT_JSON"
              exit 1
            fi

            # sprint_today() evaluates "today" in SPRINT_TIMEZONE (owner rule:
            # sprint midnights are Eastern, not UTC) -- from lib/gh_project.sh,
            # sourced above.
            ACTIVE_SPRINT=$(echo "$SPRINT_JSON" | jq -r --arg today "$(sprint_today)" '
                     .data.user.projectV2.fields.nodes[] |
                     select(.name=="Sprint") |
                     .configuration.iterations |
                     map(select(.startDate <= $today)) |
                     sort_by(.startDate) |
                     (last // empty) | .title // empty')

            if [[ -n "$ACTIVE_SPRINT" ]]; then
              if set_project_field_value "$ITEM_ID" "Sprint" "$ACTIVE_SPRINT"; then
                echo "✓ Sprint: $ACTIVE_SPRINT (was unset)"
                FILLED+=("Sprint: $ACTIVE_SPRINT")
              else
                echo "⚠ Sprint: could not set '$ACTIVE_SPRINT' (iteration may have ended) — continuing"
              fi
            else
              echo "⚠ Sprint: No active sprint found — skipping"
            fi
          else
            echo "✓ Sprint: already '$CURRENT_SPRINT' — leaving as-is"
          fi

          # Milestone -- current open milestone, only when unset. Milestone is
          # an issue attribute, not a project field, so read it straight from
          # the issue payload fetched above rather than project_field_value.
          CURRENT_MILESTONE=$(echo "$ISSUE_DATA" | jq -r '.milestone.title // empty')
          if [[ -z "$CURRENT_MILESTONE" ]]; then
            # Distinguish an API error from a genuinely empty open-milestone
            # list: a transient failure (e.g. rate limit) must fail the step
            # loud (red, re-runnable) rather than silently reporting "no open
            # milestone found".
            if ! MILESTONES_JSON=$(gh api repos/"$REPO_OWNER"/"$REPO_NAME"/milestones 2>&1); then
              echo "::error::Failed to list milestones for issue #$ISSUE: $MILESTONES_JSON"
              exit 1
            fi

            OPEN_MILESTONE=$(echo "$MILESTONES_JSON" | jq -r \
              'map(select(.state=="open")) | sort_by(.due_on) | .[0].title // empty')

            if [[ -n "$OPEN_MILESTONE" ]]; then
              gh issue edit "$ISSUE" --milestone "$OPEN_MILESTONE"
              echo "✓ Milestone: $OPEN_MILESTONE (was unset)"
              FILLED+=("Milestone: $OPEN_MILESTONE")
            else
              echo "⚠ Milestone: No open milestone found"
            fi
          else
            echo "✓ Milestone: already '$CURRENT_MILESTONE' — leaving as-is"
          fi

          echo ""
          echo "✅ Project hygiene complete for issue #$ISSUE"

          # Comment only when hygiene actually filled something -- a fully
          # pre-populated issue (e.g. create_issue.sh already ran) gets no
          # redundant "configured" comment.
          if [[ "${#FILLED[@]}" -gt 0 ]]; then
            COMMENT_BODY="✅ **Project Hygiene**: filled missing fields on issue #$ISSUE:"$'\n\n'
            for line in "${FILLED[@]}"; do
              COMMENT_BODY+="- ${line}"$'\n'
            done
            gh issue comment "$ISSUE" --body "$COMMENT_BODY"
          else
            echo "No fields needed filling — skipping comment"
          fi

  pr-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Setup environment
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          cat > /tmp/nyxgpt-config.ini <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          echo "NYXGPT_CONFIG_FILE=/tmp/nyxgpt-config.ini" >> "$GITHUB_ENV"

      - name: Check if PR hygiene needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          # projectItems is Projects-v2 data -- GraphQL-only, stays on GraphQL.
          STATUS=$(gh pr view "$PR" --json projectItems \
                   --jq '.projectItems[0].status.name // empty' 2>/dev/null || echo "")
          if [[ -n "$STATUS" ]]; then
            echo "PR #$PR already has Status: $STATUS — skipping (submit script handled it)"
            echo "needs_hygiene=false" >> "$GITHUB_OUTPUT"
          else
            echo "PR #$PR has no project Status — applying hygiene"
            echo "needs_hygiene=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply PR project hygiene
        if: steps.check.outputs.needs_hygiene == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          # Give developer_submit_for_review.sh (the normal path) a head start
          # so we only act when the PR really came in outside the script.
          sleep 60
          STATUS=$(gh pr view "$PR" --json projectItems \
                   --jq '.projectItems[0].status.name // empty' 2>/dev/null || echo "")
          if [[ -n "$STATUS" ]]; then
            echo "PR #$PR gained Status '$STATUS' meanwhile — nothing to do"
            exit 0
          fi

          source scripts/agents/lib/gh_project.sh
          load_config
          require_gh_auth

          # Linked issue from "Closes #N" in the body, if any (plain PR data
          # -- REST; no Projects-v2 dependency).
          BODY=$(gh api "repos/${REPO_OWNER}/${REPO_NAME}/pulls/${PR}" --jq '.body // ""')
          ISSUE=$(echo "$BODY" | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)

          if [[ -n "$ISSUE" ]]; then
            echo "PR #$PR links issue #$ISSUE — full hygiene via ensure_pr_project_hygiene"
            ensure_pr_project_hygiene "$PR" "$ISSUE"
          else
            echo "PR #$PR has no linked issue — minimal hygiene (project + In Review + defaults)"
            ITEM_ID=$(ensure_issue_in_project "$PR")
            set_field_with_retry "$ITEM_ID" "$STATUS_FIELD" "$STATUS_IN_REVIEW" \
              || { echo "::error::Failed to set Status on PR #$PR"; exit 1; }
            set_field_with_retry "$ITEM_ID" "Priority" "P1 - High" || true
            set_field_with_retry "$ITEM_ID" "Effort" "XS" || true
          fi
          echo "PR #$PR hygiene applied"
