name: Ensure Project Hygiene

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Setup environment
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          # Write config for scripts
          cat > /tmp/nyxgpt-config.ini <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF

          echo "NYXGPT_CONFIG_FILE=/tmp/nyxgpt-config.ini" >> "$GITHUB_ENV"

      - name: Check if hygiene needed
        id: check_hygiene
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          ISSUE=${{ github.event.issue.number }}

          # Check if issue already has Status set (web UI issues will)
          STATUS=$(gh issue view "$ISSUE" --json projectItems \
                   --jq '.projectItems[0].status.name // empty' \
                   2>/dev/null || echo "")

          if [[ -n "$STATUS" ]]; then
            echo "Issue #$ISSUE already has Status: $STATUS"
            echo "Skipping - likely created via web UI with proper hygiene"
            echo "needs_hygiene=false" >> "$GITHUB_OUTPUT"
          else
            echo "Issue #$ISSUE has no Status - needs hygiene setup"
            echo "needs_hygiene=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set all required project fields
        id: set_fields
        if: steps.check_hygiene.outputs.needs_hygiene == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          ISSUE=${{ github.event.issue.number }}

          echo "Setting up project hygiene for issue #$ISSUE..."

          # Source library functions
          source scripts/agents/lib/gh_project.sh
          load_config
          require_gh_auth

          # Add to project if not already there
          ITEM_ID=$(ensure_issue_in_project "$ISSUE")
          echo "Issue #$ISSUE in project: $ITEM_ID"

          # Get issue details for intelligent defaults
          ISSUE_DATA=$(gh issue view "$ISSUE" --json title,body,labels)
          TITLE=$(echo "$ISSUE_DATA" | jq -r '.title')
          BODY=$(echo "$ISSUE_DATA" | jq -r '.body // ""')
          LABELS=$(echo "$ISSUE_DATA" | jq -r '.labels[].name' | tr '\n' ' ')

          # Set Status to Backlog (required)
          set_issue_status "$ISSUE" "Backlog"
          echo "✓ Status: Backlog"

          # Set Priority to P1 (required default)
          set_project_field_value "$ITEM_ID" "Priority" "P1 - High"
          echo "✓ Priority: P1 - High"

          # Set Effort to XS (required default)
          set_project_field_value "$ITEM_ID" "Effort" "XS"
          echo "✓ Effort: XS"

          # Set Label (Feature by default) -- but only when the issue carries
          # no recognized label yet. The single-label rule
          # (developer_submit_for_review.sh requires exactly one) means adding
          # Feature on top of an existing Improvement/Release Management label
          # created a two-label deadlock that had to be trimmed by hand every
          # time (#3390, #3413, #3415).
          if echo "$LABELS" | grep -qE "Acceptance Failure|Improvement|Release Management|Feature"; then
            echo "✓ Label: already labeled ($LABELS), leaving as-is"
          else
            gh issue edit "$ISSUE" --add-label "Feature"
            echo "✓ Label: Feature"
          fi

          # Determine Module based on title/body keywords.
          # The sre branch runs FIRST: observability/SRE issues routinely
          # mention "web"/"api"/"log" in passing, and the old greedy
          # web|ui first-match mis-stamped them (e.g. #3415 stamped web-ui
          # because its body said "Web tier"). The project's Module option
          # was renamed observability -> sre (owner, 2026-07-29).
          MODULE=""
          if echo "$TITLE $BODY" | grep -qiE "\bsre\b|observab|monitor|metric|grafana|prometheus|loki|jaeger|glitchtip|self.heal|tracing|instrumentation"; then
            MODULE="sre"
          elif echo "$TITLE $BODY" | grep -qiE "web|ui|frontend|react|vue"; then
            MODULE="web-ui"
          elif echo "$TITLE $BODY" | grep -qiE "api|endpoint|rest|graphql"; then
            MODULE="api"
          elif echo "$TITLE $BODY" | grep -qiE "rag|embedding|vector|semantic"; then
            MODULE="rag"
          elif echo "$TITLE $BODY" | grep -qiE "cli|command.line|terminal"; then
            MODULE="cli"
          elif echo "$TITLE $BODY" | grep -qiE "tui|terminal.ui"; then
            MODULE="tui"
          elif echo "$TITLE $BODY" | grep -qiE "test|testing|pytest"; then
            MODULE="testing"
          elif echo "$TITLE $BODY" | grep -qiE "doc|documentation|readme"; then
            MODULE="documentation"
          elif echo "$TITLE $BODY" | grep -qiE "security|auth|permission"; then
            MODULE="security"
          elif echo "$TITLE $BODY" | grep -qiE "logging|\blogs?\b"; then
            # Logging/observability catch-all that didn't match the sre
            # branch above (option renamed observability -> sre).
            MODULE="sre"
          else
            MODULE="api"  # Default fallback
          fi
          set_project_field_value "$ITEM_ID" "Module" "$MODULE"
          echo "✓ Module: $MODULE"

          # Set Sprint to current sprint (get first active/current sprint).
          # Capture raw output first so a transport/API failure (empty due to
          # error) is distinguishable from a genuinely empty iteration list.
          if ! SPRINT_JSON=$(gh api graphql -f query='
            query($owner:String!, $number:Int!) {
              user(login:$owner) {
                projectV2(number:$number) {
                  fields(first:20) {
                    nodes {
                      ... on ProjectV2IterationField {
                        name
                        configuration {
                          iterations {
                            id
                            title
                            startDate
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' -F owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER" 2>&1); then
            echo "::error::Failed to query Sprint iterations for issue #$ISSUE: $SPRINT_JSON"
            echo "sprint_result=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          CURRENT_SPRINT=$(echo "$SPRINT_JSON" | jq -r --arg today "$(date -u +%Y-%m-%d)" '
                   .data.user.projectV2.fields.nodes[] |
                   select(.name=="Sprint") |
                   .configuration.iterations |
                   map(select(.startDate <= $today)) |
                   sort_by(.startDate) |
                   (last // empty) | .title // empty')

          # set_project_field_value resolves iteration by TITLE (not id), and a
          # failed Sprint set must never abort hygiene — Milestone still needs
          # to be applied below (Sprint is "current sprint (if active)").
          if [[ -n "$CURRENT_SPRINT" ]]; then
            if set_project_field_value "$ITEM_ID" "Sprint" "$CURRENT_SPRINT"; then
              echo "✓ Sprint: $CURRENT_SPRINT"
              echo "sprint_result=set:$CURRENT_SPRINT" >> "$GITHUB_OUTPUT"
            else
              echo "⚠ Sprint: could not set '$CURRENT_SPRINT' (iteration may have ended) — continuing"
              echo "sprint_result=failed-set" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "⚠ Sprint: No active sprint found — skipping"
            echo "sprint_result=none" >> "$GITHUB_OUTPUT"
          fi

          # Set Milestone to current open milestone. Distinguish an API error
          # from a genuinely empty open-milestone list: a transient failure
          # (e.g. rate limit) must fail the step loud (red, re-runnable)
          # rather than silently reporting "no open milestone found".
          if ! MILESTONES_JSON=$(gh api repos/"$REPO_OWNER"/"$REPO_NAME"/milestones 2>&1); then
            echo "::error::Failed to list milestones for issue #$ISSUE: $MILESTONES_JSON"
            echo "milestone_result=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          CURRENT_MILESTONE=$(echo "$MILESTONES_JSON" | jq -r \
            'map(select(.state=="open")) | sort_by(.due_on) | .[0].title // empty')

          if [[ -n "$CURRENT_MILESTONE" ]]; then
            gh issue edit "$ISSUE" --milestone "$CURRENT_MILESTONE"
            echo "✓ Milestone: $CURRENT_MILESTONE"
            echo "milestone_result=set:$CURRENT_MILESTONE" >> "$GITHUB_OUTPUT"
          else
            echo "⚠ Milestone: No open milestone found"
            echo "milestone_result=none" >> "$GITHUB_OUTPUT"
          fi

          echo ""
          echo "✅ Project hygiene complete for issue #$ISSUE"

      - name: Comment on issue
        if: success() && steps.check_hygiene.outputs.needs_hygiene == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;

            // Status/Priority/Effort/Label/Module don't need per-field outcome
            // tracking: Actions `run:` steps use `bash -e`, so a `gh` failure
            // on any of those already aborts the step and this comment step
            // (gated on success()) never runs. Sprint/Milestone are different:
            // the previous step deliberately continues past a Sprint/Milestone
            // skip, so we render their actual outcome here instead of a static
            // "always succeeded" claim.
            const sprintResult = `${{ steps.set_fields.outputs.sprint_result }}`;
            const milestoneResult = `${{ steps.set_fields.outputs.milestone_result }}`;

            const sprintLine = sprintResult.startsWith('set:')
              ? `- Sprint: ${sprintResult.slice(4)}\n`
              : `- ⚠ Sprint: not set (${sprintResult === 'none' ? 'no active sprint' : 'failed to apply'})\n`;

            const milestoneLine = milestoneResult.startsWith('set:')
              ? `- Milestone: ${milestoneResult.slice(4)}\n`
              : `- ⚠ Milestone: not set (${milestoneResult === 'none' ? 'no open milestone' : 'API error'})\n`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `✅ **Project Hygiene**: Issue automatically configured with required fields:\n\n` +
                    `- Status: Backlog\n` +
                    `- Priority: P1 - High\n` +
                    `- Effort: XS\n` +
                    `- Label: Feature\n` +
                    `- Module: (auto-detected)\n` +
                    sprintLine +
                    milestoneLine
            });

  pr-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Setup environment
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          cat > /tmp/nyxgpt-config.ini <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          echo "NYXGPT_CONFIG_FILE=/tmp/nyxgpt-config.ini" >> "$GITHUB_ENV"

      - name: Check if PR hygiene needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          STATUS=$(gh pr view "$PR" --json projectItems \
                   --jq '.projectItems[0].status.name // empty' 2>/dev/null || echo "")
          if [[ -n "$STATUS" ]]; then
            echo "PR #$PR already has Status: $STATUS — skipping (submit script handled it)"
            echo "needs_hygiene=false" >> "$GITHUB_OUTPUT"
          else
            echo "PR #$PR has no project Status — applying hygiene"
            echo "needs_hygiene=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply PR project hygiene
        if: steps.check.outputs.needs_hygiene == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          # Give developer_submit_for_review.sh (the normal path) a head start
          # so we only act when the PR really came in outside the script.
          sleep 60
          STATUS=$(gh pr view "$PR" --json projectItems \
                   --jq '.projectItems[0].status.name // empty' 2>/dev/null || echo "")
          if [[ -n "$STATUS" ]]; then
            echo "PR #$PR gained Status '$STATUS' meanwhile — nothing to do"
            exit 0
          fi

          source scripts/agents/lib/gh_project.sh
          load_config
          require_gh_auth

          # Linked issue from "Closes #N" in the body, if any.
          BODY=$(gh pr view "$PR" --json body --jq '.body // ""')
          ISSUE=$(echo "$BODY" | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)

          if [[ -n "$ISSUE" ]]; then
            echo "PR #$PR links issue #$ISSUE — full hygiene via ensure_pr_project_hygiene"
            ensure_pr_project_hygiene "$PR" "$ISSUE"
          else
            echo "PR #$PR has no linked issue — minimal hygiene (project + In Review + defaults)"
            ITEM_ID=$(ensure_issue_in_project "$PR")
            set_field_with_retry "$ITEM_ID" "$STATUS_FIELD" "$STATUS_IN_REVIEW" \
              || { echo "::error::Failed to set Status on PR #$PR"; exit 1; }
            set_field_with_retry "$ITEM_ID" "Priority" "P1 - High" || true
            set_field_with_retry "$ITEM_ID" "Effort" "XS" || true
          fi
          echo "PR #$PR hygiene applied"
