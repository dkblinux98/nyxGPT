name: Ensure Project Hygiene

on:
  issues:
    # `opened` fills blanks; `closed` applies the non-completed closure rule
    # (#3871). Deliberately not `edited`: re-running the fill on a live issue
    # would re-open the clobber window #3816 closed.
    types: [opened, closed]
  # `pull_request_target`, NOT `pull_request` (#4167). GitHub treats a
  # Dependabot-authored `pull_request` run as a fork PR: Actions secrets are
  # withheld and replaced by the (empty) Dependabot secret store, so
  # `SCRUMMASTER_AGENT_TOKEN` arrived blank and `pr-hygiene` died at
  # `require_gh_auth` on every single Dependabot PR -- which is also why none
  # of them ever reached the board in `In Review`, and so never reached the
  # review agent (#4163, #4165, the latter carrying a critical alert).
  # `pull_request_target` runs the BASE branch's copy of this file with the
  # repository's own secrets regardless of who opened the PR. The safety
  # condition that makes that acceptable is below, on the job.
  #
  # Copying the token into the Dependabot secret store was the rejected
  # alternative: it hands a `workflow`-scoped PAT to jobs that install the
  # PR's dependency tree, which is the exposure GitHub's restriction exists
  # to prevent.
  pull_request_target:
    types: [opened, reopened]

jobs:
  add-to-project:
    # `Support`-labeled issues are user support reports (#3745): they belong
    # to the separate nyxGPT Support project's own auto-add workflow, never
    # to the code project. Skipping here is what keeps them out of the agent
    # loop entirely -- no project item, no field stamping, no sprint.
    if: >-
      github.event_name == 'issues'
      && github.event.action == 'opened'
      && !contains(github.event.issue.labels.*.name, 'Support')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Setup environment
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          # Write config for scripts
          cat > /tmp/nyxgpt-config.ini <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF

          echo "NYXGPT_CONFIG_FILE=/tmp/nyxgpt-config.ini" >> "$GITHUB_ENV"

      - name: Fill missing project fields
        id: set_fields
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        # The hygiene logic lives in scripts/agents/ensure_issue_hygiene.sh
        # (#3816) rather than inline here, so the "never overwrite a populated
        # field" invariant can be executed against a stubbed `gh` by
        # tests/test_issue_hygiene.sh + project-hygiene-smoke.yml. Inline
        # workflow bash cannot be run by a test, and this job's defect
        # signature is a SUCCESSFUL run that overwrote a good value -- exactly
        # what a green run does not catch.
        run: bash scripts/agents/ensure_issue_hygiene.sh "${{ github.event.issue.number }}"

  closure-hygiene:
    # Owner rule (2026-08-18, #3871; refined 2026-08-19): an issue closed for
    # any reason other than completion ends up carrying the `Phase X:
    # Rejected` milestone, assigned to the owner and only the owner, with
    # every project field stripped -- Status, Priority, Effort, Module, Phase
    # and Sprint. The milestone is the only marker it keeps: the purpose of
    # Phase X is to take dead issues out of the picture, and a field left
    # behind keeps them in somebody's lane, sprint or statistic. It was being done by hand -- a remote Claude session
    # cannot do it itself, because Projects v2 is GraphQL-only and the session
    # proxy blocks GraphQL, which is why #3870 needed the owner to finish it.
    #
    # The state_reason test is repeated inside the script rather than trusted
    # from here alone: this `if:` is the cheap filter, and the script is what
    # a test can execute.
    #
    # The null test is not redundant with the script's (#3871 review): the
    # pipeline's DOMINANT closure path is `gh issue close` after a merge, which
    # records `state_reason: null` (live on #3917/#3918/#3919). Without this
    # clause every routine merge spins a runner, checks out the release branch
    # and exits at the script's null branch -- a permanent per-merge cost for a
    # guaranteed no-op. The script keeps its own null test, which is what
    # protects a by-hand invocation.
    if: >-
      github.event_name == 'issues'
      && github.event.action == 'closed'
      && github.event.issue.state_reason != 'completed'
      && github.event.issue.state_reason != null
      && !contains(github.event.issue.labels.*.name, 'Support')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Setup environment
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          cat > /tmp/nyxgpt-config.ini <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          echo "NYXGPT_CONFIG_FILE=/tmp/nyxgpt-config.ini" >> "$GITHUB_ENV"

      - name: Apply the non-completed closure rule
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: bash scripts/agents/ensure_issue_hygiene.sh --closure "${{ github.event.issue.number }}"

  pr-hygiene:
    # SAFETY CONDITION for the `pull_request_target` trigger above (#4167):
    # this job NEVER checks out or executes PR head code. It checks out
    # `vars.RELEASE_BRANCH` -- the base branch, i.e. the same code whose copy
    # of this workflow is running -- and otherwise only makes GitHub API
    # calls about the PR's number. That is what makes running with the
    # repository's secrets on an arbitrary author's PR safe; a `ref:` pointing
    # at the PR head, a `gh pr checkout`, or running anything out of the PR's
    # tree would hand this job's token to that author.
    # `tests/unit/test_pull_request_target_safety.py` fails the build on any
    # of those, and `project-hygiene-smoke.yml`'s `pr-head-guard-discriminates`
    # job executes that guard against a deliberately broken copy so it cannot
    # pass by being vacuous.
    #
    # One consequence worth naming: a `pull_request_target` run is associated
    # with the base branch's commit, not the PR head, so `pr-hygiene` must
    # stay in `.github/required-checks.txt`'s `[not-required]` section -- it
    # was already there as project bookkeeping, and the guard pins it.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Setup environment
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          cat > /tmp/nyxgpt-config.ini <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          echo "NYXGPT_CONFIG_FILE=/tmp/nyxgpt-config.ini" >> "$GITHUB_ENV"

      - name: Check if PR hygiene needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          # projectItems is Projects-v2 data -- GraphQL-only, stays on GraphQL.
          STATUS=$(gh pr view "$PR" --json projectItems \
                   --jq '.projectItems[0].status.name // empty' 2>/dev/null || echo "")
          if [[ -n "$STATUS" ]]; then
            echo "PR #$PR already has Status: $STATUS — skipping (submit script handled it)"
            echo "needs_hygiene=false" >> "$GITHUB_OUTPUT"
          else
            echo "PR #$PR has no project Status — applying hygiene"
            echo "needs_hygiene=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply PR project hygiene
        if: steps.check.outputs.needs_hygiene == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          # Give developer_submit_for_review.sh (the normal path) a head start
          # so we only act when the PR really came in outside the script.
          sleep 60
          STATUS=$(gh pr view "$PR" --json projectItems \
                   --jq '.projectItems[0].status.name // empty' 2>/dev/null || echo "")
          if [[ -n "$STATUS" ]]; then
            echo "PR #$PR gained Status '$STATUS' meanwhile — nothing to do"
            exit 0
          fi

          source scripts/agents/lib/gh_project.sh
          load_config
          require_gh_auth

          # Self-contained on purpose: no config, no sourced library. A
          # `pull_request`-triggered workflow runs the PR's copy of this file
          # against a RELEASE_BRANCH checkout, so calling a helper the base
          # branch does not have yet fails with exit 127 -- which is exactly
          # how this step and pr-hygiene went red on the PR that introduced
          # the helper. A query needs nothing checked out to work.
          #
          # Since #4167 this job runs on `pull_request_target`, so for THIS
          # file the file and the checkout are both the base branch and that
          # version skew is gone. The inline query stays anyway: it is still
          # correct, it costs nothing, and the same idiom in the four other
          # workflows that read this link is still `pull_request`-triggered.
          ISSUE=$(gh api graphql -f query='
            query($owner:String!, $name:String!, $pr:Int!){
              repository(owner:$owner, name:$name){
                pullRequest(number:$pr){
                  closingIssuesReferences(first:5){ nodes { number } }
                }
              }
            }' -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY##*/}" \
            -F pr="$PR" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[0].number // empty' \
            2>/dev/null || true)

          # Fallback for PRs opened before the link existed. Read, never required.
          if [[ -z "$ISSUE" ]]; then
            ISSUE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.body // ""' \
              | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          fi
          if [[ -n "$ISSUE" ]]; then
            echo "PR #$PR links issue #$ISSUE — full hygiene via ensure_pr_project_hygiene"
            ensure_pr_project_hygiene "$PR" "$ISSUE"
          else
            echo "PR #$PR has no linked issue — minimal hygiene (project + In Review + defaults)"
            ITEM_ID=$(ensure_issue_in_project "$PR")
            set_field_with_retry "$ITEM_ID" "$STATUS_FIELD" "$STATUS_IN_REVIEW" \
              || { echo "::error::Failed to set Status on PR #$PR"; exit 1; }
            set_field_with_retry "$ITEM_ID" "Priority" "P1 - High" || true
            set_field_with_retry "$ITEM_ID" "Effort" "XS" || true
          fi
          echo "PR #$PR hygiene applied"
