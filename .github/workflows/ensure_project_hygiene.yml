name: Ensure Project Hygiene

on:
  issues:
    # `opened` fills blanks; `closed` applies the non-completed closure rule
    # (#3871). Deliberately not `edited`: re-running the fill on a live issue
    # would re-open the clobber window #3816 closed.
    types: [opened, closed]
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    # `Support`-labeled issues are user support reports (#3745): they belong
    # to the separate nyxGPT Support project's own auto-add workflow, never
    # to the code project. Skipping here is what keeps them out of the agent
    # loop entirely -- no project item, no field stamping, no sprint.
    if: >-
      github.event_name == 'issues'
      && github.event.action == 'opened'
      && !contains(github.event.issue.labels.*.name, 'Support')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Setup environment
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          # Write config for scripts
          cat > /tmp/nyxgpt-config.ini <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF

          echo "NYXGPT_CONFIG_FILE=/tmp/nyxgpt-config.ini" >> "$GITHUB_ENV"

      - name: Fill missing project fields
        id: set_fields
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        # The hygiene logic lives in scripts/agents/ensure_issue_hygiene.sh
        # (#3816) rather than inline here, so the "never overwrite a populated
        # field" invariant can be executed against a stubbed `gh` by
        # tests/test_issue_hygiene.sh + project-hygiene-smoke.yml. Inline
        # workflow bash cannot be run by a test, and this job's defect
        # signature is a SUCCESSFUL run that overwrote a good value -- exactly
        # what a green run does not catch.
        run: bash scripts/agents/ensure_issue_hygiene.sh "${{ github.event.issue.number }}"

  closure-hygiene:
    # Owner rule (2026-08-18, #3871): an issue closed for any reason other
    # than completion ends up with Phase = `Phase X`, assigned to the owner,
    # and Sprint cleared. It was being done by hand -- a remote Claude session
    # cannot do it itself, because Projects v2 is GraphQL-only and the session
    # proxy blocks GraphQL, which is why #3870 needed the owner to finish it.
    #
    # The state_reason test is repeated inside the script rather than trusted
    # from here alone: this `if:` is the cheap filter, and the script is what
    # a test can execute.
    #
    # The null test is not redundant with the script's (#3871 review): the
    # pipeline's DOMINANT closure path is `gh issue close` after a merge, which
    # records `state_reason: null` (live on #3917/#3918/#3919). Without this
    # clause every routine merge spins a runner, checks out the release branch
    # and exits at the script's null branch -- a permanent per-merge cost for a
    # guaranteed no-op. The script keeps its own null test, which is what
    # protects a by-hand invocation.
    if: >-
      github.event_name == 'issues'
      && github.event.action == 'closed'
      && github.event.issue.state_reason != 'completed'
      && github.event.issue.state_reason != null
      && !contains(github.event.issue.labels.*.name, 'Support')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Setup environment
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          cat > /tmp/nyxgpt-config.ini <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          echo "NYXGPT_CONFIG_FILE=/tmp/nyxgpt-config.ini" >> "$GITHUB_ENV"

      - name: Apply the non-completed closure rule
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: bash scripts/agents/ensure_issue_hygiene.sh --closure "${{ github.event.issue.number }}"

  pr-hygiene:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Setup environment
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          cat > /tmp/nyxgpt-config.ini <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          echo "NYXGPT_CONFIG_FILE=/tmp/nyxgpt-config.ini" >> "$GITHUB_ENV"

      - name: Check if PR hygiene needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          # projectItems is Projects-v2 data -- GraphQL-only, stays on GraphQL.
          STATUS=$(gh pr view "$PR" --json projectItems \
                   --jq '.projectItems[0].status.name // empty' 2>/dev/null || echo "")
          if [[ -n "$STATUS" ]]; then
            echo "PR #$PR already has Status: $STATUS — skipping (submit script handled it)"
            echo "needs_hygiene=false" >> "$GITHUB_OUTPUT"
          else
            echo "PR #$PR has no project Status — applying hygiene"
            echo "needs_hygiene=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply PR project hygiene
        if: steps.check.outputs.needs_hygiene == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          # Give developer_submit_for_review.sh (the normal path) a head start
          # so we only act when the PR really came in outside the script.
          sleep 60
          STATUS=$(gh pr view "$PR" --json projectItems \
                   --jq '.projectItems[0].status.name // empty' 2>/dev/null || echo "")
          if [[ -n "$STATUS" ]]; then
            echo "PR #$PR gained Status '$STATUS' meanwhile — nothing to do"
            exit 0
          fi

          source scripts/agents/lib/gh_project.sh
          load_config
          require_gh_auth

          # The PR's linked issue, read from the native edge first and the
          # body convention only as a fallback (owner rule, 2026-08-19).
          ISSUE=$(pr_linked_issue "$PR")

          if [[ -n "$ISSUE" ]]; then
            echo "PR #$PR links issue #$ISSUE — full hygiene via ensure_pr_project_hygiene"
            ensure_pr_project_hygiene "$PR" "$ISSUE"
          else
            echo "PR #$PR has no linked issue — minimal hygiene (project + In Review + defaults)"
            ITEM_ID=$(ensure_issue_in_project "$PR")
            set_field_with_retry "$ITEM_ID" "$STATUS_FIELD" "$STATUS_IN_REVIEW" \
              || { echo "::error::Failed to set Status on PR #$PR"; exit 1; }
            set_field_with_retry "$ITEM_ID" "Priority" "P1 - High" || true
            set_field_with_retry "$ITEM_ID" "Effort" "XS" || true
          fi
          echo "PR #$PR hygiene applied"
