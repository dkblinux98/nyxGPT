name: Retro Dashboard - Merge Data Branch

# Lands the owner's retrospective data-refresh branch (claude/retro-data) on
# the repository default branch immediately on push, by opening a pull request
# and merging it. Owner tooling for the retrospective dashboard (see
# scripts/retrospective/REFRESH_RUNBOOK.md); the merge without human review is
# the owner-approved exception to the review loop for this tooling
# (2026-07-31). Guard: refuses if the branch changes anything outside
# scripts/retrospective/ — that guard lives in merge_data_branch.sh, which the
# dump workflows call too, so both entry points are bounded identically.
#
# It goes through a pull request because the default branch's ruleset requires
# one — the previous `git push origin HEAD:$DEFAULT` was rejected with GH013
# ("Changes must be made through a pull request"), which silently discarded
# every refresh (#3815). No ruleset bypass is needed: the PR path satisfies
# the rule by construction.
#
# This workflow serves the runbook's manual step 8 (an operator pushes the
# branch with their own credentials, which does trigger it). The dump
# workflows do NOT rely on it: they push with GITHUB_TOKEN, which by design
# triggers no workflow, and call merge_data_branch.sh themselves. The script
# is idempotent — a second lander finds nothing to merge.

on:
  push:
    branches: [claude/retro-data]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: retro-data-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge into default branch via pull request
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          DATA_BRANCH: claude/retro-data
        run: scripts/retrospective/merge_data_branch.sh
