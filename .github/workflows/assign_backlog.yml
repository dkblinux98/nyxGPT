name: Assign Backlog Issues to scrummaster-agent

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  assign:
    # Never assign a user support report to the scrummaster (#3745) --
    # `Support` issues are invisible to the agent loop by construction.
    if: >-
      vars.AGENTS_ENABLED == 'true'
      && !contains(github.event.issue.labels.*.name, 'Support')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const scrum_agent = process.env.SCRUM_AGENT;
            const project_number = process.env.PROJECT_NUMBER;
            const project_owner = process.env.PROJECT_OWNER;
            const status_field = process.env.STATUS_FIELD;
            const status_backlog = process.env.STATUS_BACKLOG;

            // Query issue's project status
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    projectItems(first: 10) {
                      nodes {
                        project {
                          number
                        }
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              field {
                                ... on ProjectV2SingleSelectField {
                                  name
                                }
                              }
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: issue_number
            });

            // Find the project item and status
            const projectItems = result.repository.issue.projectItems.nodes;
            const projectItem = projectItems.find(item => item.project.number === parseInt(project_number));

            if (!projectItem) {
              console.log(`Issue #${issue_number} is not in project ${project_number}. Skipping assignment.`);
              return;
            }

            const statusField = projectItem.fieldValues.nodes.find(
              fv => fv.field && fv.field.name === status_field
            );

            const currentStatus = statusField ? statusField.name : null;

            console.log(`Issue #${issue_number} current status: ${currentStatus}`);

            // Only assign to scrummaster if status is Backlog (or newly created without status)
            if (currentStatus === status_backlog || currentStatus === null) {
              console.log(`Assigning issue #${issue_number} to ${scrum_agent}`);
              // SET, not add: an issue carries exactly one assignee (owner
              // rule). addAssignees appends, which is how issues came to
              // show two or three agents at once and made "who owns this?"
              // unanswerable from the board.
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                assignees: [scrum_agent]
              });
            } else {
              console.log(`Issue #${issue_number} is in "${currentStatus}" status, not Backlog. Skipping assignment.`);
            }
        env:
          SCRUM_AGENT: ${{ vars.SCRUM_AGENT }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          STATUS_FIELD: ${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG: ${{ vars.STATUS_BACKLOG }}
