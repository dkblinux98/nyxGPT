name: Web Validation

on:
  pull_request:
    paths:
      - 'web/**/*.ts'
      - 'web/**/*.tsx'
      - 'src/nyxgpt/app.py'
  push:
    branches:
      - v2.0.0
    paths:
      - 'web/**/*.ts'
      - 'web/**/*.tsx'
      - 'src/nyxgpt/app.py'

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: cd web && npm ci

      - name: TypeScript type check
        run: cd web && npm run type-check

      - name: Validate web proxy routes exist
        run: |
          chmod +x scripts/agents/validate-web-routes.sh
          ./scripts/agents/validate-web-routes.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy

      - name: Python type check (mypy)
        run: mypy src/ || echo "⚠️  mypy found type errors (not blocking)"
