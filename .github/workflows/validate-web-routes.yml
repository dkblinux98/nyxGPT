name: Web Validation

on:
  pull_request:
    paths:
      - 'web/**/*.ts'
      - 'web/**/*.tsx'
      - 'src/nyxgpt/app.py'
  push:
    branches:
      - v2.0.0
    paths:
      - 'web/**/*.ts'
      - 'web/**/*.tsx'
      - 'src/nyxgpt/app.py'

jobs:
  validate-web:
    uses: dkblinux98/nyxAgent/.github/workflows/reusable-validate-web-routes.yml@v1.0.0
    with:
      repository: ${{ github.repository }}
      web_directory: 'web'
      python_src_directory: 'src'
      node_version: '20'
      python_version: '3.11'
      enable_route_validation: false
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
