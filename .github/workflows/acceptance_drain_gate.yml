name: Acceptance Drain Gate

# Owner decision 2026-08-12 (#3730): acceptance failures and improvements
# filed during an acceptance round are HELD in the `Acceptance Failed`
# Status lane instead of being worked immediately -- otherwise the loop
# floods `Acceptance Testing` with freshly-merged fixes while the owner is
# still testing the round, burning RC cycles.
#
# This is the watcher that opens the hold. The gate opens when
# `Acceptance Testing` has drained -- empty EXCEPT the release tracking
# issue, which is exempt and stays there until the whole release is
# accepted. On the opening, every held item moves to `Backlog` and the
# scrummaster queue is kicked exactly once.
#
# "Held" is the OPEN part of the lane. Owner decision 2026-08-14 (#3780):
# the owner also parks features they have tested and failed in the same
# lane, and those are CLOSED. This workflow reports them and leaves them
# alone -- only `promote_accepted_features.sh` moves them, and only once
# their whole blocked-by closure has reached `For Release`.
#
# Detection is event-driven, plus an explicit manual dispatch:
#   * `workflow_run` on the promotion sweep and the parked-blocked sweep --
#     those are what MOVE items out of (and into) Acceptance Testing, so a
#     drain is usually detected seconds after it happens;
#   * `issues: [closed]` -- a closing acceptance item is the other way the
#     lane changes shape;
#   * `workflow_dispatch` -- the owner opens the gate by hand at the end of a
#     round.
#
# THE SCHEDULE WAS REMOVED (owner decision, 2026-08-25). It was a 15-minute
# cron backstop for the one case no event covers: the owner moving the last
# item by hand on the project board raises nothing this workflow can
# subscribe to (`projects_v2_item` is organization-projects only; this
# project belongs to a user). That case is real and has NOT gone away -- it
# is now covered by the owner dispatching this workflow, deliberately,
# instead of by polling for it 96 times a day. First principle 1: do not
# keep a watch armed over a process that is idle by design; the same
# reasoning D-013 applied to branch cleanup.
#
# The consequence, stated so a future session does not "restore" the cron on
# discovering it: **accepting the last issue of a round no longer wakes this
# workflow.** Nothing is broken and nothing is stranded permanently -- the
# next `issues: [closed]` or sweep completion evaluates the gate normally --
# but the end-of-round opening is now an owner action:
#
#   gh workflow run acceptance_drain_gate.yml --ref <release branch> -f dry_run=true
#   gh workflow run acceptance_drain_gate.yml --ref <release branch>
#
# Evaluation remains free of side effects by construction: with the lane
# already empty the run releases nothing and posts nothing (drain_gate_release
# in scripts/agents/lib/gh_project.sh).

on:
  issues:
    types: [closed]
  workflow_run:
    workflows:
      - "Promote Accepted Features"
      - "Sweep Parked Blocked Issues"
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be released without changing anything"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

# One evaluation at a time: two runs opening the gate concurrently would
# both see the same held lane and post two kicks.
concurrency:
  group: acceptance-drain-gate
  cancel-in-progress: false

jobs:
  gate:
    # Actor gate (#3600, going-public hardening): the job carries a
    # secret-backed GH_TOKEN, so the `issues` path only runs for the owner
    # or one of the agents. The evaluation is identical on every path (the
    # event payload is never read) -- schedule / workflow_run / dispatch
    # are unaffected, so a stranger closing an issue simply raises nothing.
    if: >-
      vars.AGENTS_ENABLED == 'true' &&
      (github.event_name != 'issues' ||
      github.actor == vars.HUMAN_OWNER ||
      github.actor == vars.SCRUM_AGENT ||
      github.actor == vars.DEV_AGENT ||
      github.actor == vars.REVIEW_AGENT)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Write ephemeral config
        run: |
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"
          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          RELEASE_ISSUE_NUMBER=${{ vars.RELEASE_ISSUE_NUMBER }}
          SPRINT_FIELD=${{ vars.SPRINT_FIELD }}
          SPRINT_AUTOPILOT=${{ vars.SPRINT_AUTOPILOT }}
          EOF
          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"

      - name: Evaluate the drain gate
        env:
          # #3837: dispatch inputs are typed by the dispatcher, so they reach
          # the shell as data, never as substituted source.
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          DRY_RUN=0
          if [[ "$DRY_RUN_INPUT" == "true" ]]; then
            DRY_RUN=1
          fi
          DRY_RUN="$DRY_RUN" scripts/agents/drain_gate.sh release | tee "$RUNNER_TEMP/gate.json"

      - name: Summary
        if: always()
        run: |
          RESULT="$(cat "$RUNNER_TEMP/gate.json" 2>/dev/null || echo '{}')"
          {
            echo "### Acceptance drain gate"
            echo ""
            echo "\`\`\`json"
            echo "$RESULT"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
