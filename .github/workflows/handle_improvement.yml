name: Handle Improvement

# Owner decisions 2026-08-01 / 2026-08-02: an improvement filed during
# acceptance testing of a feature is a PRODUCT MANAGEMENT failure (a spec
# gap), distinct from an Acceptance Failure (an implementation defect). It
# is filed as a normal issue labeled "Improvement".
#
# Owner decision 2026-08-12 (#3731), superseding the "improvements never
# gate" half of the 2026-08-01 decision: BOTH acceptance-testing commands
# record the same semantics — the filed issue BLOCKS acceptance of the issue
# it was filed against, and transitively anything blocked by that one. The
# storage is GitHub's NATIVE blocked-by/blocks relationship: no
# "Related feature: #N" body prose, no comment markers. The retired prose
# marker is still READ as a fallback for issues filed before that change.
# The Improvement label still distinguishes the failure statistic (a spec
# gap, cause `pm`) from an Acceptance Failure (an implementation defect) —
# only the gating behaviour changed.
#
# Owner decision 2026-08-12 (#3730): like acceptance failures, an
# improvement filed DURING a round lands in the `Acceptance Failed` Status
# lane and is not worked immediately. acceptance_drain_gate.yml moves the
# HELD items in that lane to Backlog once `Acceptance Testing` has drained
# (empty except the release tracking issue) and kicks the queue once.
#
# Held means the OPEN part of the lane. Owner decision 2026-08-14 (#3780):
# the same lane is also where the owner parks features they have tested and
# FAILED. Those are CLOSED, the gate never moves them, and they leave the
# lane only via promote_accepted_features.yml once everything blocking them
# has reached "For Release".
#
# This is the `@improvement` counterpart of handle_acceptance_failure.yml
# (`@acceptance-failure`). Both are stakeholder-acceptance commands: only
# the human owner can issue them, and both are DISTINCT from the review
# loop overrides (@approve-merge, @request-changes, @send-to-developer),
# which operate on PRs.
#
# NOTE: issue_comment workflows execute from the repository DEFAULT branch.
# Empirically that is the active release branch, so changes here go live
# on merge.

# Serialize per commented issue so two rapid comments file two distinct
# improvements rather than racing on the same one.
concurrency:
  group: improvement-${{ github.event.issue.number }}
  cancel-in-progress: false

on:
  issue_comment:
    types: [created]

jobs:
  # Layer 1 of the command trigger (#3790): cheap substring test here, the
  # anchored "does this comment ISSUE the command?" decision in the gate job.
  # Mirrors handle_acceptance_failure.yml exactly -- the two commands stay
  # mirror images of each other.
  comment_gate:
    if: |
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '@improvement') &&
      !contains(github.event.comment.body, 'nyxgpt-token-mention') &&
      github.event.comment.user.login == vars.HUMAN_OWNER
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Comment token gate
        id: gate
        uses: ./.github/actions/comment-token-gate
        with:
          token: "@improvement"
          comment-body: ${{ github.event.comment.body }}
          author-association: ${{ github.event.comment.author_association }}

  handle:
    needs: [comment_gate]
    if: needs.comment_gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    env:
      GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
      # See handle_acceptance_failure.yml: a failure here eats an owner
      # report just as completely, so the same #3695 DM alert is wired
      # (#3999 -- the two commands stay mirror images of each other).
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
      SLACK_USER_TOKEN_SCRUM: ${{ secrets.SLACK_USER_TOKEN_SCRUM }}
      AGENT_ROLE: scrum

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Write ephemeral config
        run: |
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"
          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          RELEASE_ISSUE_NUMBER=${{ vars.RELEASE_ISSUE_NUMBER }}
          EOF
          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"

      - name: File the improvement
        id: handle
        env:
          # Owner-authored comment text: passed via env (never interpolated
          # into the script) so backticks/quotes in it can't inject.
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          set -euo pipefail
          COMMENTED="${{ github.event.issue.number }}"
          source scripts/agents/lib/gh_project.sh
          load_config
          require_gh_auth

          issue_json="$(gh api "repos/${REPO_OWNER}/${REPO_NAME}/issues/${COMMENTED}" \
            --jq '{title, labels: [.labels[].name], body: (.body // "")}')"
          COMMENTED_BODY="$(echo "$issue_json" | jq -r '.body')"

          # The feature is the commented issue itself, unless the commented
          # issue is already a handler-filed failure/improvement -- then the
          # improvement belongs to the issue THAT one blocks, exactly like
          # handle_acceptance_failure.yml resolves it. Resolution is native
          # (#3731): the label plus a real blocking edge, with the retired
          # body marker as the historical fallback.
          RELATED=""
          if echo "$issue_json" | jq -e '.labels | any(. == "Acceptance Failure" or . == "Improvement")' >/dev/null; then
            RELATED="$(related_feature_of "$COMMENTED" "$COMMENTED_BODY" || true)"
          fi
          FEATURE="${RELATED:-$COMMENTED}"
          FEATURE_TITLE="$(gh api "repos/${REPO_OWNER}/${REPO_NAME}/issues/${FEATURE}" --jq '.title')"

          # Drain gate (#3730): improvements are held with the failures.
          # Process work bypasses -- the rule lives in drain_gate.py.
          GATED=1
          if text_bypasses_drain_gate "$COMMENT_BODY" \
            || issue_bypasses_drain_gate "$COMMENTED"; then
            GATED=0
          fi
          echo "gated=$GATED" >> "$GITHUB_OUTPUT"

          TITLE="improvement: ${FEATURE_TITLE#*: }"
          TITLE="${TITLE:0:80}"

          BODY_FILE="$RUNNER_TEMP/improvement-body.md"
          {
            echo "## Problem / Motivation"
            echo
            echo "Improvement identified during stakeholder acceptance testing (spec gap, not an implementation defect)."
            echo
            echo "Reported by: @${HUMAN_OWNER} — ${COMMENT_URL}"
            echo
            echo "## Requested Improvement"
            echo
            printf '%s\n' "$COMMENT_BODY"
            echo
            echo "## Acceptance Criteria"
            echo
            echo "- [ ] The requested improvement is implemented and verified"
            echo
            echo "## Notes"
            echo
            echo "- The issue this blocks is recorded in GitHub's **Relationships** panel (native blocked-by), not in this body. It is promoted to \"For Release\" automatically once everything blocking it, transitively, reaches \"For Release\" (owner decision 2026-08-12, #3731)."
            echo "- An Improvement is a product-management gap (spec), not an implementation defect — that distinction lives in the label, and the retrospective counts it separately."
          } > "$BODY_FILE"

          ACTIVE_SPRINT="$(iteration_active_title "${SPRINT_FIELD:-Sprint}" 2>/dev/null || echo "")"

          # Gated improvements are FILED into the holding lane so nothing
          # can pick them up between creation and the hold.
          FILE_STATUS="$STATUS_BACKLOG"
          [[ "$GATED" == "1" ]] && FILE_STATUS="$STATUS_ACCEPTANCE_FAILED"

          ARGS=(--title "$TITLE" --body-file "$BODY_FILE"
                --label "Improvement"
                --copy-from-issue "$FEATURE"
                --status "$FILE_STATUS")
          if [[ -n "$ACTIVE_SPRINT" && "$ACTIVE_SPRINT" != "null" ]]; then
            ARGS+=(--sprint "$ACTIVE_SPRINT")
          fi
          NEW="$(scripts/agents/create_issue.sh "${ARGS[@]}" | tail -1)"
          echo "Filed improvement #$NEW for feature #$FEATURE (gated=${GATED})"

          # THE relationship record (#3731): the improvement BLOCKS the issue
          # it was filed against, in GitHub's native relationships — the same
          # write handle_acceptance_failure.yml makes. Nothing is written to
          # the body or to a comment. Best-effort; promote_accepted_features.sh
          # heals a missing link on its next sweep.
          # Precondition for the reopen below, not a nice-to-have: a reopened
          # original with no blocked_by edge is classified `work` forever and
          # dispatched against an issue with nothing to implement. And it does
          # not heal itself -- the sweep's heal loop only reaches candidates it
          # can already resolve from a native edge or the retired prose marker,
          # and this derived issue writes no marker (#3999 review). Same fix as
          # handle_acceptance_failure.yml: the two commands differ only in label
          # and copy, and a fix applied to one and not the other is how they
          # diverge.
          EDGE_OK=1
          if mark_issue_blocked_by "$FEATURE" "$NEW"; then
            echo "Marked #$NEW as blocking #$FEATURE"
          else
            EDGE_OK=0
            echo "[warn] Could not mark #$NEW as blocking #$FEATURE."
            echo "[warn] NOT reopening #$FEATURE: without that edge the gate would"
            echo "[warn] classify it as work and dispatch it. The improvement is"
            echo "[warn] recorded on #$NEW; re-issue the command when the API is healthy."
          fi

          if [[ "$GATED" == "1" ]]; then
            drain_gate_hold "$NEW" "improvement" \
              || _warn "drain gate: could not put #${NEW} in the holding lane --" \
                      "it may already be there, or the lane option may be missing. Check its Status."
          fi

          # The ORIGINAL is reopened as the signal that it did not pass
          # acceptance, assigned to the scrummaster and parked in the
          # holding lane (owner standard D-042, 2026-08-22) -- the same
          # write handle_acceptance_failure.yml makes. The two commands
          # differ only in label and copy, and a fix applied to one but not
          # the other is exactly how they diverge (#3999).
          #
          # Only when the command was issued ON the original. When the owner
          # comments on a failure/improvement issue, FEATURE resolves to the
          # issue THAT one blocks -- reopening that would be reopening
          # something the owner never marked.
          REOPENED=0
          if [[ -z "$RELATED" && "$EDGE_OK" == "1" ]]; then
            acceptance_reopen_original "$FEATURE" "$NEW"
            echo "Reopened #$FEATURE as the acceptance signal (D-042)"
            REOPENED=1
          elif [[ -z "$RELATED" ]]; then
            echo "Skipped the reopen of #$FEATURE -- see the edge warning above."
          fi

          {
            echo "issue=$NEW"
            echo "feature=$FEATURE"
            echo "reopened=$REOPENED"
          } >> "$GITHUB_OUTPUT"

      - name: Post acknowledgement comment
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ steps.handle.outputs.issue }}
          FEATURE: ${{ steps.handle.outputs.feature }}
          GATED: ${{ steps.handle.outputs.gated }}
          REOPENED: ${{ steps.handle.outputs.reopened }}
        with:
          github-token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          script: |
            const commented = context.payload.issue.number;
            const issue = Number(process.env.ISSUE);
            const feature = process.env.FEATURE;
            const gated = process.env.GATED === '1';
            const reopened = process.env.REOPENED === '1';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;

            const reopenLine = reopened
              ? `- #${feature} is **reopened** and parked in **Acceptance Failed**, `
                + `assigned to the scrummaster — the reopen is the record that it `
                + `did not pass acceptance (owner standard D-042). `
                + `Nothing is dispatched against it\n`
              : '';

            const startLine = gated
              ? `- Held in **Acceptance Failed** — work starts when **Acceptance Testing** drains (only the release issue left), which moves it to Backlog and kicks the queue once\n`
              : `- Queued in **Backlog** for normal scrummaster selection (process exception — the drain gate does not apply)\n`;

            const body =
              `💡 **Scrummaster Agent**: Improvement acknowledged.\n\n` +
              `Filed as **#${issue}**, recorded as **blocking** #${feature} through GitHub's native Relationships ` +
              `(no body markers). Improvements are product-management gaps, not acceptance failures — the label keeps ` +
              `that distinction in the retrospective — but #${feature} now waits on #${issue}, and on anything blocking ` +
              `#${issue}, before it can move to **For Release** (owner decision 2026-08-12, #3731).\n\n` +
              `**Flow (automated):**\n` +
              reopenLine +
              startLine +
              `- Developer agent implements it via a \`feat/${issue}-...\` branch and a PR with \`Closes #${issue}\`\n` +
              `- Review agent reviews and merges; #${issue} then lands in Acceptance Testing for your review\n\n` +
              `[Monitor progress](${repoUrl}/issues/${issue})`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: commented,
              body
            });

      # FAIL LOUDLY (#3999) -- the mirror of the same step in
      # handle_acceptance_failure.yml. A failure here files no issue and
      # writes no blocking edge, so the owner's improvement report reaches
      # nothing; both channels are used for the same reason given there.
      - name: Alert the owner if the handler failed
        if: failure()
        env:
          COMMENT_URL: ${{ github.event.comment.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENTED: ${{ github.event.issue.number }}
        run: |
          set -uo pipefail
          source scripts/agents/lib/gh_project.sh
          load_config

          # Body via a file, not a heredoc inside "$( … )" -- see the same
          # step in handle_acceptance_failure.yml for why.
          BODY_FILE="${RUNNER_TEMP:-/tmp}/handler-failure.md"
          cat > "$BODY_FILE" <<EOF
          🚨 **\`@improvement\` handler FAILED** — this report was **not** filed.

          No improvement issue was created and no blocking relationship was written,
          so nothing is pointing at this issue and no agent has been dispatched. The
          owner's report is the comment above; it is not lost, but nothing is
          acting on it.

          - Failing run: ${RUN_URL}
          - Reporting comment: ${COMMENT_URL}

          Re-issuing the command on this issue re-runs the handler once the cause is fixed.

          <!-- nyxgpt-token-mention -->
          EOF

          issue_comment "$COMMENTED" "$(cat "$BODY_FILE")" \
            || _warn "could not post the handler-failure comment on #${COMMENTED}"

          notify_human_escalation "$COMMENTED" "improvement handler FAILED" \
            "The @improvement handler exited non-zero on #${COMMENTED}: nothing filed, no edge written." \
            "Read ${RUN_URL}, fix the cause, then re-issue @improvement on #${COMMENTED} (${COMMENT_URL})." \
            "${COMMENTED}:improvement-handler-failed" 60
