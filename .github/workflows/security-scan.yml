name: Security Scan

on:
  pull_request: {}
  push: {}

# Least-privilege token: this scan gate only reads the checked-out code
# (CodeQL actions/missing-workflow-permissions, alert #30 — same pattern
# as validate-web-routes.yml / terraform-local-smoke.yml from #3628).
permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    # For push events, only run on the configured release branch (vars.RELEASE_BRANCH).
    # pull_request events always run regardless of target branch.
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python project + security tooling
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Python SAST (bandit) -- blocking on high severity/confidence
        run: bandit -c pyproject.toml -r src/ --severity-level high --confidence-level high

      - name: Python SAST (bandit) -- full report, informational only
        if: always()
        run: bandit -c pyproject.toml -r src/ -f txt || true

      # Fails on any finding security/pip-audit-ignore.txt does not accept --
      # unchanged -- and ALSO on any entry in that file which accepts nothing
      # (#4239). `--ignore-vuln` silently tolerates an ID that matches no
      # finding, so the inline loop this step used to run could not tell a
      # live suppression from a dead one; the gate derives both from one
      # unfiltered pip-audit report instead. Same rule, same message and same
      # exit code as the npm allowlist gate below, which is why they share a
      # module.
      - name: Python dependency audit (pip-audit) -- blocking, dead ignores included
        run: python3 scripts/ci/stale_suppressions.py pip-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install web dependencies
        run: cd web && npm ci

      # `audit:ci` routes through scripts/ci/stale_suppressions.py, so this
      # blocks on high/critical findings AND on an allowlist entry that
      # matches nothing. The command is deliberately the same one the
      # developer runbook tells a human to run locally.
      - name: npm dependency audit (audit-ci) -- blocking on high/critical
        run: cd web && npm run audit:ci

      # FAULT INJECTION (#4239, following macos-brew-smoke.yml's template).
      # Every step above passes on a clean tree whether or not the
      # stale-suppression gate works -- which is exactly how the defect
      # survived: audit-ci printed "Consider not allowlisting paths" on four
      # consecutive GREEN runs. So re-arm the defect and require the gate to
      # fail on it, by its own message rather than by any non-zero exit (a
      # real finding would also exit non-zero and would prove nothing about
      # the stale-entry path).
      #
      # The injected allowlist entry is #4239's own: a path-scoped entry for
      # the withdrawn GHSA-vfj7-8cjw-p6xm, which matches nothing while both
      # dependency paths still exist.
      - name: Prove the stale-suppression gate fails on a dead entry
        run: |
          set -euo pipefail
          cp web/audit-ci.jsonc /tmp/audit-ci.jsonc.orig
          cp security/pip-audit-ignore.txt /tmp/pip-audit-ignore.txt.orig
          restore() {
            cp /tmp/audit-ci.jsonc.orig web/audit-ci.jsonc
            cp /tmp/pip-audit-ignore.txt.orig security/pip-audit-ignore.txt
          }
          trap restore EXIT

          python3 - <<'PY'
          from pathlib import Path

          config = Path("web/audit-ci.jsonc")
          dead = "GHSA-vfj7-8cjw-p6xm|@ducanh2912/next-pwa>fast-glob>micromatch>braces"
          text = config.read_text()
          assert '"allowlist": []' in text, "expected an empty allowlist to inject into"
          config.write_text(text.replace('"allowlist": []', f'"allowlist": ["{dead}"]'))
          PY

          (cd web && npm run --silent audit:ci) >/tmp/npm-gate.log 2>&1 && status=0 || status=$?
          if [ "$status" -eq 0 ] || ! grep -q "STALE SUPPRESSION" /tmp/npm-gate.log; then
            cat /tmp/npm-gate.log
            echo "::error::the npm half of the stale-suppression gate did not fail on a \
          dead allowlist entry (exit $status). web/package.json's audit:ci must route \
          through scripts/ci/stale_suppressions.py."
            exit 1
          fi
          echo "npm half: failed as required (exit $status)"
          restore

          printf '\n# fault injection -- #4239, removed by the trap\nGHSA-0000-dead-0000\n' \
            >> security/pip-audit-ignore.txt
          python3 scripts/ci/stale_suppressions.py pip-audit >/tmp/pip-gate.log 2>&1 \
            && status=0 || status=$?
          if [ "$status" -eq 0 ] || ! grep -q "STALE SUPPRESSION" /tmp/pip-gate.log; then
            cat /tmp/pip-gate.log
            echo "::error::the pip-audit half of the stale-suppression gate did not fail \
          on a dead ignore entry (exit $status)."
            exit 1
          fi
          echo "pip-audit half: failed as required (exit $status)"
