name: CI - Tests & Type Check

# The blocking gates, evaluated where the change is reviewed AND again at the
# merge boundary. #4209 added the first half; the second was always here.
#
# ON A PULL REQUEST (#4209). Until 2026-10-22 every job in this file was
# `if: github.ref == RELEASE_BRANCH` on a workflow with no `pull_request`
# trigger, so `ruff`, `black`, `mypy`, `pytest`, `tsc`, `eslint` and
# `vitest --coverage` -- every step this file labels "(blocking)" -- were only
# ever evaluated AFTER the merge that broke them. That is not a gate. A web
# regression was invisible for the whole life of the PR that introduced it and
# surfaced as a red release branch attributed to whichever change touched
# `web/` next. It happened: #4207 shipped two failing web tests and nothing on
# the PR went red; the review round found them by running the suite by hand.
#
# The premise the old arrangement rested on -- "the developer runs the gates
# before cutting the PR, so re-running them at PR time answers a question
# already answered" -- is a premise about an agent remembering to, and
# `web/package.json`'s `test:coverage` was `vitest --coverage` in watch mode,
# so the one documented way to answer it locally did not terminate.
#
# ON A PUSH TO THE RELEASE BRANCH (owner decision, 2026-08-18). This half is
# unchanged and is not redundant with the half above. What a PR run cannot see
# is a change that did not exist when it ran: two PRs with no overlapping
# lines, each green, that break each other once both land. That happened twice
# on 2026-08-18 -- a new workflow merging against a new index guard, and three
# branches each allocating ledger id V-046 -- and both left the release branch
# red for hours before anyone noticed. So the suite also runs after the merge,
# as the alarm.
#
# Pushes to any other branch skip every job here, which reports as a skipped
# check run rather than as nothing. `required_check_state`
# (scripts/agents/lib/gh_project.sh) treats `skipped` as "did not apply", so
# the PR-event run on the same head is the one that counts -- see the three
# entries this file's jobs have in `.github/required-checks.txt`.
#
# Both halves share ONE scope decision (`scripts/ci/diff_scope.py`): a `push`
# measures its diff from `github.event.before`, a pull request from the merge
# base with its base branch, and a run with no identifiable base runs
# everything. That used to be three inline copies of the same `github.event.before`
# read, which is why pointing this workflow at a PR head was not a one-line
# change (CLAUDE.md, "one source per decision").
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff_scope needs both sides of the diff

      # One resolver, three consumers (this job, `determinism`, `web`). See
      # scripts/ci/diff_scope.py.
      - name: Scope this change
        id: scope
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # GITHUB_SHA on a pull_request is the synthesised MERGE commit,
          # whose first parent is the base tip -- so a merge-base against it
          # returns base.sha itself. The head is the real subject (#4209).
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/diff_scope.py --github-output >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install nyxgpt (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check . (blocking)
        run: ruff check .

      - name: black --check . (blocking)
        run: black --check .

      - name: mypy src/ (blocking)
        run: mypy src/

      # #3896: a docs-only diff used to pay exactly what a src/ rewrite paid.
      # A change runs the suites its diff can actually reach -- except that
      # product code and the root conftest can reach any suite, so those are
      # never narrowed, and neither is a run whose base commit could not be
      # identified. Both of those decisions are `diff_scope`'s `full_suite`.
      - name: Select suites for this change
        id: select
        env:
          FULL_SUITE: ${{ steps.scope.outputs.full_suite }}
          CHANGED: ${{ steps.scope.outputs.changed }}
        run: |
          set -euo pipefail
          if [[ "$FULL_SUITE" == "true" ]]; then
            echo "product code, the root conftest, or no identifiable base -- full unit suite"
            echo "pytest_args=tests/unit/" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$CHANGED"
          # shellcheck disable=SC2086  # intentional split: one argv per path
          python3 scripts/ci/select_tests.py --files $CHANGED --github-output \
            >> "$GITHUB_OUTPUT"

      - name: pytest - unit tests (integration tests skipped in CI, no live services)
        env:
          PYTEST_ARGS: ${{ steps.select.outputs.pytest_args }}
        run: pytest $PYTEST_ARGS -v

  # #4020: the suite was non-deterministic for eight months and nothing here
  # could see it, because a clean runner has none of the shared machine state
  # the flakes came from -- one operator `~/.nyxGPT/config.ini` that concurrent
  # pytest sessions took turns overwriting. The single run above passes either
  # way, so it is not a guard against that class returning.
  #
  # This job is. It runs the same suite twice in the same session with a second
  # session deliberately overlapping the first, and fails if the two runs
  # disagree about which tests failed. Under the fix each session has a private
  # `$HOME` (tests/home_sandbox.py) and the overlap is a no-op; if anyone
  # reintroduces a shared path under the real home, the concurrent run diverges
  # from the solo one and this fails with both lists.
  #
  # Comparing the *set of failed node ids*, not the count: two runs failing 3
  # tests each for different reasons is exactly the bug, and a count comparison
  # calls it green.
  #
  # #4209: it now runs on PR heads too, because the thing that breaks it is a
  # *test* writing under the real `$HOME` and a PR is where a test is reviewed.
  # On a pull request its steps are scoped to diffs that can reach Python
  # (`diff_scope`'s `python`) -- an agents/ or docs-only PR cannot make the
  # suite non-deterministic, and this job costs three suite runs. The release
  # branch stays unscoped: the merge boundary is where collisions appear, and a
  # collision does not announce which half of it touched `src/`.
  determinism:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff_scope needs both sides of the diff

      - name: Scope this change
        id: scope
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # GITHUB_SHA on a pull_request is the synthesised MERGE commit,
          # whose first parent is the base tip -- so a merge-base against it
          # returns base.sha itself. The head is the real subject (#4209).
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/diff_scope.py --github-output >> "$GITHUB_OUTPUT"

      # Self-gating on the diff rather than a workflow-level `paths:` filter,
      # so the job reports a definite conclusion on every PR instead of
      # vanishing -- a check that disappears is indistinguishable from one that
      # has not run yet.
      - name: Does this change reach Python
        id: want
        if: github.event_name != 'pull_request' || steps.scope.outputs.python == 'true'
        run: echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.want.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install nyxgpt (editable, dev extras)
        if: steps.want.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # An operator config is what turned this defect on: a runner with no
      # ~/.nyxGPT never reproduced it. Seeding one whose values are the
      # *opposite* of the suite's expectations means a leak of the machine's
      # config into the suite shows up as failures rather than as nothing.
      #
      # This seed makes a leak *loud*; it is not what detects one. A read-only
      # leak would fail both runs identically and slip past the diff below --
      # `test_suite_runs_in_a_private_home` (tests/unit/test_session_config_isolation.py)
      # is the assertion that catches the sandbox not being in effect, and it
      # runs in the `test` job above like any other test.
      - name: Seed an operator-style ~/.nyxGPT/config.ini
        if: steps.want.outputs.run == 'true'
        run: |
          mkdir -p "$HOME/.nyxGPT"
          cat > "$HOME/.nyxGPT/config.ini" <<'EOF'
          [nyxgpt]
          default_model = operator-choice:latest
          session_backend = cassandra

          [tracing]
          enabled = true

          [monitoring]
          enabled = true

          [log_aggregation]
          enabled = true

          [error_tracking]
          enabled = true
          EOF
          sha256sum "$HOME/.nyxGPT/config.ini" | tee /tmp/config-before.sha

      - name: Run the unit suite twice, the second overlapping a third session
        if: steps.want.outputs.run == 'true'
        run: |
          set -uo pipefail
          # GitHub runs `run:` with `bash -e` whatever the script sets, and the
          # old body piped pytest into `grep`. A green suite means grep matches
          # nothing and exits 1; `pipefail` propagates that, and `-e` aborts
          # INSIDE the function before its `return 0` can neutralise it. So this
          # guard failed precisely when the suite was clean -- three minutes of
          # work, no output at all, exit 1 -- and it started doing so the moment
          # #4020/#4023 actually fixed the non-determinism it exists to police.
          # The pipeline is split so grep reads the log as a plain file and its
          # "no matches" is handled explicitly rather than by a `return` that
          # errexit never reaches.
          run_suite() {  # $1 = report path
            set +e
            pytest tests/unit -p no:cacheprovider -q --no-header > "$1.log" 2>&1
            grep -E '^(FAILED|ERROR) ' "$1.log" | sed 's/ - .*//' | sort > "$1"
            set -e
            return 0
          }
          run_suite /tmp/run1.txt
          # A concurrent session is the condition that produced #4020's
          # 5/28/53/67 spread, and what it takes to reproduce is another
          # session's *fixture setup and teardown* -- not a whole second suite.
          # So the overlap is a one-file session on a loop: same hazard, far
          # more of it per minute, and it costs a fraction of a suite run.
          touch /tmp/keep-overlapping
          ( while [ -e /tmp/keep-overlapping ]; do
              pytest tests/unit/test_session_config_isolation.py \
                -p no:cacheprovider -q --no-header >>/tmp/overlap.log 2>&1
            done ) &
          OVERLAP=$!
          run_suite /tmp/run2.txt
          rm -f /tmp/keep-overlapping
          wait $OVERLAP || true

          echo "::group::run 1 failures"; cat /tmp/run1.txt; echo "::endgroup::"
          echo "::group::run 2 failures (concurrent)"; cat /tmp/run2.txt; echo "::endgroup::"
          if ! diff -u /tmp/run1.txt /tmp/run2.txt; then
            echo "::error::the unit suite is not deterministic -- two runs of the same" \
                 "tree disagreed about which tests failed (see the diff above, #4020)"
            exit 1
          fi
          echo "both runs agreed on $(wc -l < /tmp/run1.txt) failing test(s)"

      - name: The suite must not have touched the operator's config
        if: steps.want.outputs.run == 'true'
        run: |
          sha256sum -c /tmp/config-before.sha \
            || { echo "::error::pytest modified ~/.nyxGPT/config.ini (#4020)"; exit 1; }
          test ! -e "$HOME/.nyxGPT/config.ini.pytest-bak" \
            || { echo "::error::pytest left a backup in the operator's ~/.nyxGPT (#4020)"; exit 1; }

  # The web gates (tsc / eslint / vitest). Self-gating on the diff rather than
  # a workflow-level `paths:` filter, so the job reports a definite conclusion
  # on every PR instead of vanishing -- a check that disappears is
  # indistinguishable from one that has not run yet.
  web:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff_scope needs both sides of the diff

      - name: Scope this change
        id: scope
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # GITHUB_SHA on a pull_request is the synthesised MERGE commit,
          # whose first parent is the base tip -- so a merge-base against it
          # returns base.sha itself. The head is the real subject (#4209).
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/diff_scope.py --github-output >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.scope.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install web dependencies
        if: steps.scope.outputs.web == 'true'
        run: cd web && npm ci

      - name: tsc --noEmit (blocking)
        if: steps.scope.outputs.web == 'true'
        run: cd web && npm run type-check

      # Lints THIS change's web files, not the whole tree. `npx eslint .`
      # reports ~114 errors that predate every PR it was blocking -- two
      # different merges on 2026-08-19 (#3926, #3934) each produced exactly
      # 114, which is what "pre-existing" looks like -- so a blocking
      # whole-tree lint failed every web change for debt none of them
      # introduced, and the gate could never go green without a big-bang
      # cleanup nobody had scheduled.
      #
      # Linting the diff holds the line where it can actually be held: new
      # and edited web files must be clean, and the standing debt is
      # reported (below, non-blocking) rather than blocking unrelated work.
      - name: eslint the files this change touched (blocking)
        if: steps.scope.outputs.web == 'true'
        env:
          IDENTIFIED: ${{ steps.scope.outputs.identified }}
          CHANGED: ${{ steps.scope.outputs.changed }}
        run: |
          set -euo pipefail
          if [[ "$IDENTIFIED" != "true" ]]; then
            # No identifiable diff -- a branch-creation push sends an
            # all-zeros `before`, which is exactly the first push of the next
            # release line. Blocking on `eslint src` here would re-create the
            # defect this step removes: `src` carries standing errors, so that
            # push would fail on debt it never touched. The report-only step
            # below still surfaces the whole tree.
            echo "::notice::no identifiable base commit -- nothing identifiable to block on"
            exit 0
          fi
          # Filtering in a tested script rather than in a git pathspec: the
          # pathspec form `web/**/*.ts` requires an intermediate directory and
          # silently missed `web/next.config.ts`, so a merge touching only
          # that file linted nothing and passed (#3938 review).
          FILES=$(printf '%s\n' "$CHANGED" | python3 scripts/ci/select_web_lint_files.py)
          if [[ -z "$FILES" ]]; then
            echo "::notice::this change edited no web TS/TSX files -- nothing to lint"
            exit 0
          fi
          echo "Linting:"; printf '  %s\n' $FILES
          # shellcheck disable=SC2086  # intentional split: one argv per file
          cd web && npx eslint $FILES

      # The standing debt, visible on every web change and blocking none of
      # them. It is a real backlog item, not noise -- when it reaches zero,
      # delete this step and make the whole-tree lint blocking again.
      - name: eslint the whole tree (report only)
        if: steps.scope.outputs.web == 'true'
        continue-on-error: true
        run: |
          cd web
          npx eslint . || echo "::warning::web/ carries standing eslint debt -- see the log above"

      # The 100% coverage gate (#3266). `npm run test:coverage` is the same
      # command, so what a developer runs locally and what blocks here cannot
      # drift -- which they did: this step said `vitest run` and the script
      # said `vitest`, i.e. watch mode (#4209).
      - name: vitest --coverage (blocking)
        if: steps.scope.outputs.web == 'true'
        run: cd web && npm run test:coverage
