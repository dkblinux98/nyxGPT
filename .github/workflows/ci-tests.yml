name: CI - Tests & Type Check

# Post-merge integration tripwire (owner decision, 2026-08-18). The developer
# runs the gates before cutting the PR and green is green for that diff, so
# re-running them at PR time answers a question already answered. What a
# developer's run cannot see is a change that did not exist when it ran: two
# PRs with no overlapping lines, each green, that break each other once both
# land. That happened twice on 2026-08-18 -- a new workflow merging against a
# new index guard, and three branches each allocating ledger id V-046 -- and
# both left the release branch red for hours before anyone noticed. So the
# suite runs once, here, after the merge, as the alarm.
on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the selector diffs against the base ref

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install nyxgpt (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check . (blocking)
        run: ruff check .

      - name: black --check . (blocking)
        run: black --check .

      - name: mypy src/ (blocking)
        run: mypy src/

      # #3896: a docs-only diff used to pay exactly what a src/ rewrite paid.
      # Pull requests run the suites their diff can actually reach; pushes to
      # the release branch stay unscoped, so the merge boundary is still
      # protected by the whole tree.
      # Agentic merges do not run the app suite (owner decision, 2026-08-18).
      # The tripwire exists to catch collisions between changes that could not
      # see each other, and a collision can only happen inside the domain that
      # changed: a ledger or workflow merge cannot break test_ops. A merge that
      # touches src/ or web/ still runs everything, because that is exactly the
      # product-vs-product case the tripwire is for.
      - name: Select suites for this merge
        id: select
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if ! git rev-parse --quiet --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            echo "no usable before-sha -- running everything"
            echo "pytest_args=tests/unit/" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(src/|web/|pyproject\.toml|tests/conftest\.py)'; then
            echo "product code changed -- full suite"
            echo "pytest_args=tests/unit/" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/select_tests.py --files $CHANGED --github-output \
              >> "$GITHUB_OUTPUT"
          fi

      - name: pytest - unit tests (integration tests skipped in CI, no live services)
        env:
          PYTEST_ARGS: ${{ steps.select.outputs.pytest_args }}
        run: pytest $PYTEST_ARGS -v

  # #4020: the suite was non-deterministic for eight months and nothing here
  # could see it, because a clean runner has none of the shared machine state
  # the flakes came from -- one operator `~/.nyxGPT/config.ini` that concurrent
  # pytest sessions took turns overwriting. The single run above passes either
  # way, so it is not a guard against that class returning.
  #
  # This job is. It runs the same suite twice in the same session with a second
  # session deliberately overlapping the first, and fails if the two runs
  # disagree about which tests failed. Under the fix each session has a private
  # `$HOME` (tests/home_sandbox.py) and the overlap is a no-op; if anyone
  # reintroduces a shared path under the real home, the concurrent run diverges
  # from the solo one and this fails with both lists.
  #
  # Comparing the *set of failed node ids*, not the count: two runs failing 3
  # tests each for different reasons is exactly the bug, and a count comparison
  # calls it green.
  determinism:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install nyxgpt (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # An operator config is what turned this defect on: a runner with no
      # ~/.nyxGPT never reproduced it. Seeding one whose values are the
      # *opposite* of the suite's expectations means a leak of the machine's
      # config into the suite shows up as failures rather than as nothing.
      #
      # This seed makes a leak *loud*; it is not what detects one. A read-only
      # leak would fail both runs identically and slip past the diff below --
      # `test_suite_runs_in_a_private_home` (tests/unit/test_session_config_isolation.py)
      # is the assertion that catches the sandbox not being in effect, and it
      # runs in the `test` job above like any other test.
      - name: Seed an operator-style ~/.nyxGPT/config.ini
        run: |
          mkdir -p "$HOME/.nyxGPT"
          cat > "$HOME/.nyxGPT/config.ini" <<'EOF'
          [nyxgpt]
          default_model = operator-choice:latest
          session_backend = cassandra

          [tracing]
          enabled = true

          [monitoring]
          enabled = true

          [log_aggregation]
          enabled = true

          [error_tracking]
          enabled = true
          EOF
          sha256sum "$HOME/.nyxGPT/config.ini" | tee /tmp/config-before.sha

      - name: Run the unit suite twice, the second overlapping a third session
        run: |
          set -uo pipefail
          # GitHub runs `run:` with `bash -e` whatever the script sets, and the
          # old body piped pytest into `grep`. A green suite means grep matches
          # nothing and exits 1; `pipefail` propagates that, and `-e` aborts
          # INSIDE the function before its `return 0` can neutralise it. So this
          # guard failed precisely when the suite was clean -- three minutes of
          # work, no output at all, exit 1 -- and it started doing so the moment
          # #4020/#4023 actually fixed the non-determinism it exists to police.
          # The pipeline is split so grep reads the log as a plain file and its
          # "no matches" is handled explicitly rather than by a `return` that
          # errexit never reaches.
          run_suite() {  # $1 = report path
            set +e
            pytest tests/unit -p no:cacheprovider -q --no-header > "$1.log" 2>&1
            grep -E '^(FAILED|ERROR) ' "$1.log" | sed 's/ - .*//' | sort > "$1"
            set -e
            return 0
          }
          run_suite /tmp/run1.txt
          # A concurrent session is the condition that produced #4020's
          # 5/28/53/67 spread, and what it takes to reproduce is another
          # session's *fixture setup and teardown* -- not a whole second suite.
          # So the overlap is a one-file session on a loop: same hazard, far
          # more of it per minute, and it costs a fraction of a suite run.
          touch /tmp/keep-overlapping
          ( while [ -e /tmp/keep-overlapping ]; do
              pytest tests/unit/test_session_config_isolation.py \
                -p no:cacheprovider -q --no-header >>/tmp/overlap.log 2>&1
            done ) &
          OVERLAP=$!
          run_suite /tmp/run2.txt
          rm -f /tmp/keep-overlapping
          wait $OVERLAP || true

          echo "::group::run 1 failures"; cat /tmp/run1.txt; echo "::endgroup::"
          echo "::group::run 2 failures (concurrent)"; cat /tmp/run2.txt; echo "::endgroup::"
          if ! diff -u /tmp/run1.txt /tmp/run2.txt; then
            echo "::error::the unit suite is not deterministic -- two runs of the same" \
                 "tree disagreed about which tests failed (see the diff above, #4020)"
            exit 1
          fi
          echo "both runs agreed on $(wc -l < /tmp/run1.txt) failing test(s)"

      - name: The suite must not have touched the operator's config
        run: |
          sha256sum -c /tmp/config-before.sha \
            || { echo "::error::pytest modified ~/.nyxGPT/config.ini (#4020)"; exit 1; }
          test ! -e "$HOME/.nyxGPT/config.ini.pytest-bak" \
            || { echo "::error::pytest left a backup in the operator's ~/.nyxGPT (#4020)"; exit 1; }

  # The web gates (tsc / eslint / vitest) also lived only in the review workflow.
  # Self-gating on the diff rather than a workflow-level `paths:` filter, so the
  # job reports a definite conclusion on every PR instead of vanishing -- a check
  # that disappears is indistinguishable from one that has not run yet.
  web:
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this diff touch web/
        id: touched
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if ! git rev-parse --quiet --verify "$BASE_SHA^{commit}" >/dev/null 2>&1; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "no usable before-sha -- running the web gates"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -q '^web/'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "no web/ changes -- skipping web gates"
          fi

      - name: Set up Node.js
        if: steps.touched.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        if: steps.touched.outputs.web == 'true'
        run: cd web && npm ci

      - name: tsc --noEmit (blocking)
        if: steps.touched.outputs.web == 'true'
        run: cd web && npx tsc --noEmit

      # Lints THIS merge's web files, not the whole tree. `npx eslint .`
      # reports ~114 errors that predate every PR it was blocking -- two
      # different merges on 2026-08-19 (#3926, #3934) each produced exactly
      # 114, which is what "pre-existing" looks like -- so a blocking
      # whole-tree lint failed every web change for debt none of them
      # introduced, and the gate could never go green without a big-bang
      # cleanup nobody had scheduled.
      #
      # Linting the diff holds the line where it can actually be held: new
      # and edited web files must be clean, and the standing debt is
      # reported (below, non-blocking) rather than blocking unrelated work.
      - name: eslint the files this merge touched (blocking)
        if: steps.touched.outputs.web == 'true'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if ! git rev-parse --quiet --verify "$BASE_SHA^{commit}" >/dev/null 2>&1; then
            # No identifiable diff -- a branch-creation push sends an
            # all-zeros `before`, which is exactly the first push of the next
            # release line. Blocking on `eslint src` here would re-create the
            # defect this step removes: `src` carries 17 standing errors, so
            # that push would fail on debt it never touched. The report-only
            # step below still surfaces the whole tree.
            echo "::notice::no usable before-sha -- nothing identifiable to block on"
            exit 0
          fi
          # Filtering in a tested script rather than in a git pathspec: the
          # pathspec form `web/**/*.ts` requires an intermediate directory and
          # silently missed `web/next.config.ts`, so a merge touching only
          # that file linted nothing and passed (#3938 review).
          FILES=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$GITHUB_SHA" -- web \
                  | python3 scripts/ci/select_web_lint_files.py)
          if [[ -z "$FILES" ]]; then
            echo "::notice::this merge changed no web TS/TSX files -- nothing to lint"
            exit 0
          fi
          echo "Linting:"; printf '  %s\n' $FILES
          cd web && npx eslint $FILES

      # The standing debt, visible on every web merge and blocking none of
      # them. It is a real backlog item, not noise -- when it reaches zero,
      # delete this step and make the whole-tree lint blocking again.
      - name: eslint the whole tree (report only)
        if: steps.touched.outputs.web == 'true'
        continue-on-error: true
        run: |
          cd web
          npx eslint . || echo "::warning::web/ carries standing eslint debt -- see the log above"

      - name: vitest (blocking)
        if: steps.touched.outputs.web == 'true'
        run: cd web && npx vitest run --coverage
