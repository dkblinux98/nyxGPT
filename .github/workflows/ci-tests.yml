name: CI - Tests & Type Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Same push/PR scoping as terraform-local-smoke.yml: run on every PR, but
    # only on pushes that land on the release branch (not every feature branch).
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the selector diffs against the base ref

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install nyxgpt (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check . (blocking)
        run: ruff check .

      - name: black --check . (blocking)
        run: black --check .

      - name: mypy src/ (blocking)
        run: mypy src/

      # #3896: a docs-only diff used to pay exactly what a src/ rewrite paid.
      # Pull requests run the suites their diff can actually reach; pushes to
      # the release branch stay unscoped, so the merge boundary is still
      # protected by the whole tree.
      - name: Select test suites for this diff
        id: select
        env:
          # Never interpolated into the body: expressions in a `run:` block are
          # source, not data (V-027, and the run:-block extension of it).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "push to $GITHUB_REF -- merge boundary, running the full suite"
            echo "pytest_args=tests/unit/" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          python3 scripts/ci/select_tests.py --base "$BASE_SHA" --github-output \
            >> "$GITHUB_OUTPUT"

      - name: pytest - unit tests (integration tests skipped in CI, no live services)
        env:
          PYTEST_ARGS: ${{ steps.select.outputs.pytest_args }}
        run: pytest $PYTEST_ARGS -v

  # The web gates (tsc / eslint / vitest) also lived only in the review workflow.
  # Self-gating on the diff rather than a workflow-level `paths:` filter, so the
  # job reports a definite conclusion on every PR instead of vanishing -- a check
  # that disappears is indistinguishable from one that has not run yet.
  web:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this diff touch web/
        id: touched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          if git diff --name-only "$BASE_SHA...HEAD" | grep -q '^web/'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "no web/ changes -- skipping web gates"
          fi

      - name: Set up Node.js
        if: steps.touched.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        if: steps.touched.outputs.web == 'true'
        run: cd web && npm ci

      - name: tsc --noEmit (blocking)
        if: steps.touched.outputs.web == 'true'
        run: cd web && npx tsc --noEmit

      - name: eslint (blocking)
        if: steps.touched.outputs.web == 'true'
        run: cd web && npx eslint .

      - name: vitest (blocking)
        if: steps.touched.outputs.web == 'true'
        run: cd web && npx vitest run --coverage
