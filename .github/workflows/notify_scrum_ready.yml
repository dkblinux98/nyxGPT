name: Notify scrummaster-agent when issue is ready for next

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  notify:
    if: >
      vars.AGENTS_ENABLED == 'true' &&
      contains(github.event.comment.body, 'READY_FOR_NEXT_ISSUE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCRUMMASTER_TOKEN }}
          script: |
            // Simple notification: mention scrummaster-agent on the issue
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: '@scrummaster-agent next issue may be dispatched (signal received).'
            });
