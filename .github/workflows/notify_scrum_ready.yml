name: Scrummaster Agent - Select and Start Next Issue

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  dispatch-next-issue:
    if: >
      vars.AGENTS_ENABLED == 'true' &&
      contains(github.event.comment.body, 'READY_FOR_NEXT_ISSUE') &&
      (github.event.comment.user.login == vars.HUMAN_OWNER ||
       github.event.comment.user.login == vars.SCRUM_AGENT ||
       github.event.comment.user.login == vars.DEV_AGENT ||
       github.event.comment.user.login == vars.REVIEW_AGENT)
    runs-on: ubuntu-latest
    # Serialize dispatches: a burst of READY_FOR_NEXT_ISSUE triggers landing
    # within seconds of each other (post-merge autopilot kick + a manual
    # kick + a stray retry, observed on #3647) each ran select-and-start
    # independently, so more than one picked the same Backlog issue before
    # the earlier run's status/assignment write had propagated -- producing
    # duplicate developer runs. A single, non-cancelling concurrency group
    # makes every dispatch see the prior run's committed state before it
    # selects, on top of the per-issue idempotency guard in
    # scrummaster_start_issue.sh (classify_backlog_claim_state).
    concurrency:
      group: scrummaster-dispatch
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
      # #3695 human-channel (Slack DM) escalation notifications, sent by
      # scrummaster_dispatch_next.sh on the dispatch-paused/queue-blocked
      # terminal outcomes below. Absent/failing degrades gracefully to the
      # existing comment-only behavior (see notify_human_escalation,
      # scripts/agents/lib/gh_project.sh).
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Auth gh
        run: gh auth status

      - name: Write ephemeral config.ini (runner temp)
        shell: bash
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"

          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          RELEASE_ISSUE_NUMBER=${{ vars.RELEASE_ISSUE_NUMBER }}
          SPRINT_AUTOPILOT=${{ vars.SPRINT_AUTOPILOT }}
          SPRINT_FIELD=${{ vars.SPRINT_FIELD }}
          EOF

          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"
          echo "Wrote ephemeral config at $CFG"

      - name: Verify config loads
        shell: bash
        run: |
          set -euo pipefail
          bash -lc '
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            echo "config ok: $REPO_OWNER/$REPO_NAME project $PROJECT_OWNER#$PROJECT_NUMBER release=$RELEASE_BRANCH"
          '

      - name: Post start comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: (
                '🤖 **Scrummaster Agent**: Signal received. ' +
                'Selecting next backlog issue...\n\n' +
                '[View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
              )
            });

      - name: Select and start next issue (fall through on unclaimable candidates)
        id: start
        shell: bash
        run: |
          set -euo pipefail
          # Sprint-scope selection while autopilot is on (#3480) -- the
          # script itself falls back to unscoped selection if no Sprint is
          # currently active, so this is safe to pass unconditionally.
          SPRINT_ARGS=""
          if [[ "${{ vars.SPRINT_AUTOPILOT }}" == "true" ]]; then
            SPRINT_ARGS="--sprint-scoped"
          fi

          # scrummaster_dispatch_next.sh (#3665) runs the fall-through
          # loop: the #3647-era guard treated ANY existing assignee
          # (including assign_backlog.yml's normal scrummaster stamp) as
          # "already claimed" and halted the whole dispatch on the
          # lowest-numbered candidate, silently blocking the entire queue
          # behind a single bad-state issue (#3593, ~5 days). The dispatch
          # script now classifies *who* holds the claim per-candidate and
          # excludes/retries on any skip, bounded so a systemic problem
          # fails loudly instead of looping forever. Its stdout is exactly
          # `next_issue=...` and a `tried<<NYXGPT_TRIED_EOF ... EOF` block --
          # both already in $GITHUB_OUTPUT format.
          bash -lc "./scripts/agents/scrummaster_dispatch_next.sh $SPRINT_ARGS" >> "$GITHUB_OUTPUT"

      - name: Post escalation-pause comment
        if: steps.start.outputs.paused == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const reason = '${{ steps.start.outputs.pause_reason }}';
            const body = reason === 'cross_issue_anomaly'
              ? '⏸️ **Scrummaster Agent**: Dispatch paused -- an unresolved cross-issue ' +
                'infrastructure anomaly is open. See the loud report on the release ' +
                'tracking issue (#3694 cross-issue infrastructure-anomaly pause backstop). ' +
                'Dispatch resumes once the anomaly is resolved (an owner `RESOLVE_ANOMALY` ' +
                'comment) or its detection window elapses.'
              : '⏸️ **Scrummaster Agent**: Dispatch paused -- 2 or more unresolved ' +
                'escalations (open issues assigned to the owner). See the loud report on ' +
                'the release tracking issue (#3687 unresolved-escalation pause backstop). ' +
                'Dispatch resumes automatically once the count drops below 2.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });

      - name: Post no issues comment
        if: steps.start.outputs.paused != 'true' && steps.start.outputs.next_issue == '' && steps.start.outputs.tried == ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: (
                '⚠️ **Scrummaster Agent**: No eligible issues found in Backlog status.\n\n' +
                'All work may be complete, or backlog needs replenishment.'
              )
            });

      - name: Post queue-blocked comment
        if: steps.start.outputs.paused != 'true' && steps.start.outputs.next_issue == '' && steps.start.outputs.tried != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const tried = `${{ steps.start.outputs.tried }}`.trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: (
                `🛑 **Scrummaster Agent**: Started nothing this dispatch -- every eligible ` +
                `Backlog candidate was unclaimable:\n\n` +
                '```\n' + tried + '\n```\n\n' +
                'This is a head-of-line block on the whole queue. Please inspect the listed ' +
                'issue(s) and resolve manually (see #3665 for the decision matrix).'
              )
            });

      - name: Fail run on queue block
        if: steps.start.outputs.next_issue == '' && steps.start.outputs.tried != ''
        shell: bash
        run: |
          echo "::error::Dispatch started nothing -- every eligible Backlog candidate was unclaimable. See the queue-blocked comment on this issue for details."
          exit 1

      - name: Post completion comment
        if: steps.start.outputs.next_issue != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const next_issue = '${{ steps.start.outputs.next_issue }}';
            const dev_agent = '${{ vars.DEV_AGENT }}';
            const tried = `${{ steps.start.outputs.tried }}`.trim();
            const skippedNote = tried
              ? `\n\nSkipped ${tried.split('\n').length} unclaimable candidate(s) before this one:\n\`\`\`\n${tried}\n\`\`\``
              : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: (
                `🚀 **Scrummaster Agent**: Issue #${next_issue} has been moved to ` +
                `**In Progress** and assigned to @${dev_agent}\n\n` +
                `Developer auto-implementation workflow will begin momentarily.\n\n` +
                `[View issue](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${next_issue})` +
                skippedNote
              )
            });
