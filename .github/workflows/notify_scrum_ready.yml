name: Scrummaster Agent - Select and Start Next Issue

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  dispatch-next-issue:
    if: >
      vars.AGENTS_ENABLED == 'true' &&
      contains(github.event.comment.body, 'READY_FOR_NEXT_ISSUE') &&
      (github.event.comment.user.login == vars.HUMAN_OWNER ||
       github.event.comment.user.login == vars.SCRUM_AGENT ||
       github.event.comment.user.login == vars.DEV_AGENT ||
       github.event.comment.user.login == vars.REVIEW_AGENT)
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Auth gh
        run: gh auth status

      - name: Write ephemeral config.ini (runner temp)
        shell: bash
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"

          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          RELEASE_ISSUE_NUMBER=${{ vars.RELEASE_ISSUE_NUMBER }}
          SPRINT_AUTOPILOT=${{ vars.SPRINT_AUTOPILOT }}
          SPRINT_FIELD=${{ vars.SPRINT_FIELD }}
          EOF

          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"
          echo "Wrote ephemeral config at $CFG"

      - name: Verify config loads
        shell: bash
        run: |
          set -euo pipefail
          bash -lc '
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            echo "config ok: $REPO_OWNER/$REPO_NAME project $PROJECT_OWNER#$PROJECT_NUMBER release=$RELEASE_BRANCH"
          '

      - name: Post start comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: (
                '🤖 **Scrummaster Agent**: Signal received. ' +
                'Selecting next backlog issue...\n\n' +
                '[View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
              )
            });

      - name: Select next issue
        id: select
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Selecting next issue from Backlog"
          # Use --select-only since workflow handles starting separately.
          # Sprint-scope selection while autopilot is on (#3480) -- the
          # script itself falls back to unscoped selection if no Sprint is
          # currently active, so this is safe to pass unconditionally.
          SPRINT_ARGS=""
          if [[ "${{ vars.SPRINT_AUTOPILOT }}" == "true" ]]; then
            SPRINT_ARGS="--sprint-scoped"
          fi
          NEXT_ISSUE=$(bash -lc "./scripts/agents/scrummaster_next_issue.sh --select-only $SPRINT_ARGS" || echo "")

          if [[ -z "$NEXT_ISSUE" ]]; then
            echo "::warning::No eligible issues found in Backlog"
            echo "next_issue=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Selected issue #$NEXT_ISSUE (lowest Phase, lowest issue number)"
          echo "next_issue=$NEXT_ISSUE" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Post no issues comment
        if: steps.select.outputs.next_issue == ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: (
                '⚠️ **Scrummaster Agent**: No eligible issues found in Backlog status.\n\n' +
                'All work may be complete, or backlog needs replenishment.'
              )
            });

      - name: Post selection comment
        if: steps.select.outputs.next_issue != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const next_issue = '${{ steps.select.outputs.next_issue }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `✅ **Scrummaster Agent**: Selected issue #${next_issue}\n\nStarting issue now...`
            });

      - name: Start next issue
        if: steps.select.outputs.next_issue != ''
        shell: bash
        run: |
          set -euo pipefail
          ISSUE="${{ steps.select.outputs.next_issue }}"
          echo "::group::Starting issue #$ISSUE"
          bash -lc "./scripts/agents/scrummaster_start_issue.sh $ISSUE"
          echo "::notice::Started issue #$ISSUE -> In Progress, assigned to @${{ vars.DEV_AGENT }}"
          echo "::endgroup::"

      - name: Post completion comment
        if: steps.select.outputs.next_issue != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const next_issue = '${{ steps.select.outputs.next_issue }}';
            const dev_agent = '${{ vars.DEV_AGENT }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: (
                `🚀 **Scrummaster Agent**: Issue #${next_issue} has been moved to ` +
                `**In Progress** and assigned to @${dev_agent}\n\n` +
                `Developer auto-implementation workflow will begin momentarily.\n\n` +
                `[View issue](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/${next_issue})`
              )
            });
