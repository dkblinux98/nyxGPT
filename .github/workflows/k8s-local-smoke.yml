name: Kubernetes Local Smoke

# The question this job answers: does `nyxgpt ops install --kubernetes --local`
# produce a stack a user can actually CHAT with?
#
# #3786 was an acceptance failure where every api and web Pod reported
# Running, the web UI loaded, and nothing worked -- the deployment shipped no
# Cassandra and no Ollama, and the host's own services are stopped in this
# mode. "Pods Running" is not a working nyxGPT (the #2688 lesson), and no
# amount of manifest review catches it. scripts/k8s-local-smoke.sh runs the
# real bring-up on a real kind cluster, drives a real chat through the web
# Service's own proxy routes, and then DELETES the data/LLM tier and asserts
# the same chat fails -- so a build that drops the tier again cannot pass this
# job green (the fault-injection rule from macos-brew-smoke.yml / #3753).
#
# It runs the DEFAULT install -- observability included (#3826). It used to
# pass `--skip-observability`, which meant the only job covering the k8s path
# tested a command no user types, and could not have supplied #3787's executed
# evidence because it excluded the layer #3787 added.
#
# Since #3825 it runs that default install on a node ballasted down to the
# 7936Mi a stock 8GiB Docker Desktop VM offers, and asserts every Pod was
# SCHEDULED. That defect was a stack whose requests exceeded the operator's
# node: chat worked, install reported success, and prometheus sat Pending
# forever. On the runner's own ~16GiB node it would not have reproduced --
# hence the ballast. Footprint of the default stack's own requests, after
# #3825's right-sizing and #3833's elastic canary pool: 1625m of CPU and
# 5632Mi of memory against the 4 vCPU / 7936Mi that VM gives, with the 450m
# and 1344Mi a rollout borrows (both tracks grown to the default 4-replica
# ceiling) left free rather than reserved standing. The smoke prints the
# arithmetic either way, so a future footprint increase reads as a number
# rather than as a mystery timeout.
#
# Scoped like linux-native-smoke.yml and terraform-local-smoke.yml: a full
# cluster bring-up with two image builds is expensive, so it runs only when
# the manifests, the k8s half of the ops layer, the smoke script, or this
# workflow change.
#
# Since #3987 it also runs `nyxgpt ops status` and `nyxgpt ops doctor` against
# the live deployment (step 4) and asserts they report on IT, not on the
# runner: the required models resolve PRESENT out of the in-cluster Ollama,
# the "Deployment mode" block names Kubernetes, and neither command prints a
# traceback. That defect is invisible to unit tests -- it is about which
# machine the command asks -- and its pre-fix output (`127.0.0.1:11434` in the
# Required models header, models UNKNOWN) happens naturally here, so no fault
# injection is needed for the step to fail on a revert.
#
# A second, cheap job (`k8s-pod-state`) answers the narrower question #3827
# asked: does the install tell a Pod that is merely starting apart from one
# that will never start? See scripts/k8s-pod-state-smoke.py.
on:
  pull_request:
    paths:
      - 'k8s/**'
      - 'src/nyxgpt/ops.py'
      # The Kubernetes half of self-heal is asserted against the live cluster
      # in step 9 (#3828), so a change to it must re-run this job.
      - 'src/nyxgpt/self_heal.py'
      - 'Dockerfile'
      - 'docker/entrypoint.sh'
      - 'scripts/k8s-local-smoke.sh'
      - 'scripts/k8s-pod-state-smoke.py'
      - 'scripts/k8s-self-heal-coverage-smoke.py'
      - '.github/workflows/k8s-local-smoke.yml'
  push:
    paths:
      - 'k8s/**'
      - 'src/nyxgpt/ops.py'
      # The Kubernetes half of self-heal is asserted against the live cluster
      # in step 9 (#3828), so a change to it must re-run this job.
      - 'src/nyxgpt/self_heal.py'
      - 'Dockerfile'
      - 'docker/entrypoint.sh'
      - 'scripts/k8s-local-smoke.sh'
      - 'scripts/k8s-pod-state-smoke.py'
      - 'scripts/k8s-self-heal-coverage-smoke.py'
      - '.github/workflows/k8s-local-smoke.yml'
  workflow_dispatch:

# Read-only workflow: it checks out the repo and drives a local cluster; it
# never writes to the repository or its APIs (CodeQL #33,
# actions/missing-workflow-permissions -- same pattern as linux-native-smoke.yml).
permissions:
  contents: read

jobs:
  k8s-local-smoke:
    runs-on: ubuntu-latest
    # The bring-up builds the api and web images, provisions a kind cluster,
    # boots Cassandra, pulls the default model, and rolls out the ten
    # observability workloads the default install brings with it (#3826).
    timeout-minutes: 90
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nyxgpt (editable)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .

      # `nyxgpt ops install --kubernetes --local` reads the native config as
      # the source of truth for the derived container config, same seeding the
      # other smoke workflows do.
      - name: Seed config
        run: |
          mkdir -p "$HOME/.nyxGPT"
          cp example.config.ini "$HOME/.nyxGPT/config.ini"

      # The kind node is a container on this runner, so the runner's own size
      # IS the node's size -- there is nothing to "size up" inside the cluster
      # (#3826). Assert it up front instead, before anything expensive: the
      # ballast below shrinks the node DOWN to a Docker Desktop VM, which it
      # can only do on a runner bigger than that VM, and the 4 vCPU it does
      # not ballast have to carry the stack's CPU requests on their own.
      - name: Preflight -- the runner can fit the ballasted default stack
        run: |
          set -euo pipefail
          cpus=$(nproc)
          mem_kb=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          echo "runner: ${cpus} vCPU, $((mem_kb / 1024))Mi RAM, $(df -h --output=avail / | tail -1) free on /"
          if [ "$cpus" -lt 4 ]; then
            echo "::error::need >= 4 vCPU to match a stock Docker Desktop VM" \
                 "(1625m of requests plus the 450m a rollout borrows), have ${cpus}"
            exit 1
          fi
          if [ "$mem_kb" -lt 14000000 ]; then
            echo "::error::need >= 14Gi RAM to ballast the node down to 7936Mi and still" \
                 "run the stack (5632Mi of requests plus real usage), have $((mem_kb / 1024))Mi"
            exit 1
          fi

      - name: Create the local cluster and shrink it to a Docker Desktop VM
        # Created here rather than by the install itself so the ballast is in
        # place before the stack lands on the node (#3825). `nyxgpt ops`
        # reuses a cluster of this reserved name instead of creating one.
        run: |
          kind create cluster --name nyxgpt-local --wait 120s
          ./scripts/k8s-node-ballast.sh 7936

      - name: Run Kubernetes local smoke
        run: ./scripts/k8s-local-smoke.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n nyxgpt get pods -o wide || true
          kubectl -n nyxgpt get statefulsets,deployments,daemonsets,svc,pvc || true
          # What the scheduler had to work with, against what the stack asked
          # for -- the first thing to look at when a Pod is stuck Pending.
          kubectl describe node | sed -n '/Allocated resources/,/Events/p' || true
          kubectl -n nyxgpt get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n nyxgpt describe pod -l tier=data || true
          kubectl -n nyxgpt describe pod -l tier=llm || true
          for pod in $(kubectl -n nyxgpt get pods -o name 2>/dev/null); do
            echo "--- logs $pod ---"
            kubectl -n nyxgpt logs "$pod" --tail 100 || true
          done

  # The question this job answers (#3827): on a real cluster, does ops report a
  # Pod that is merely starting differently from one that will never start?
  #
  # The acceptance run that filed the issue printed ten `[FAIL] pod ...:
  # Pending` lines for Pods that were all Running minutes later, and the wall of
  # false failures hid the one Pod that really was broken (`Insufficient
  # memory`). The classifier reads what a real kubelet and a real scheduler
  # write into `.status`, so a unit test over hand-written JSON cannot settle
  # it. The script injects all three conditions for real and also runs the
  # PRE-FIX rule over the same Pods, so it fails on a build without the fix
  # instead of passing vacuously.
  #
  # Cheap by design: one kind node, three Pods and a busybox image -- no nyxGPT
  # image builds, no Cassandra, no model pull. Minutes, not the hour above.
  k8s-pod-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nyxgpt (editable)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .

      - name: Pending is pending, unschedulable is a failure
        run: python3 scripts/k8s-pod-state-smoke.py

      - name: Tear down the smoke cluster
        if: always()
        run: kind delete cluster --name nyxgpt-local || true
