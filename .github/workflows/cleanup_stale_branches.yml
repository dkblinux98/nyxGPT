name: Cleanup Stale Agent Branches

# Belt-and-suspenders branch hygiene for the agent loop.
#
# The repo's "Automatically delete head branches" setting only deletes a
# branch when its PR is *merged*. Branches from issues that were abandoned,
# superseded, or closed as duplicates never merge, so nothing ever removes
# them. This workflow sweeps both cases across every prefix the agent loop
# creates branches under (`claude/`, `feat/`, `fix/`, `chore/` — see
# developer_create_branch.sh and reconcile_dead_branches.sh):
#   * merged/contained branches (in case the setting missed one), and
#   * unmerged branches with no open PR that are older than STALE_DAYS
#     (the orphans, e.g. #3693's dead `feat/*` stubs).
# Head branches of OPEN pull requests are always protected, as are the base
# branch, master/main, and any release branch (`v*`).

on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — list what would be deleted, delete nothing'
        type: boolean
        default: true
      stale_days:
        description: 'Delete unmerged orphan branches whose tip is older than this many days'
        default: '14'
      base_branch:
        description: 'Base/release branch to check merges against (blank = resolve dynamically)'
        default: ''

permissions:
  contents: write        # delete refs
  pull-requests: read     # read open PRs to protect their head branches

concurrency:
  group: cleanup-stale-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep merged and stale-orphan agent branches
        uses: actions/github-script@v7
        env:
          # On a scheduled run there are no inputs, so these fall back to the
          # defaults below (dry_run=false → real deletions on the weekly sweep).
          # BASE_BRANCH resolution order: workflow_dispatch override, then the
          # repo variable vars.RELEASE_BRANCH; if both are unset/blank the
          # script below falls back to the live repo default branch.
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          STALE_DAYS: ${{ github.event.inputs.stale_days || '14' }}
          BASE_BRANCH: ${{ github.event.inputs.base_branch || vars.RELEASE_BRANCH }}
        with:
          script: |
            const dryRun = (process.env.DRY_RUN || 'false') === 'true';
            const staleDays = parseInt(process.env.STALE_DAYS || '14', 10);
            const { owner, repo } = context.repo;

            // No literal branch name here on purpose: release branches roll
            // every version, so the base always resolves at run time —
            // vars.RELEASE_BRANCH first, live repo default branch fallback.
            let base = process.env.BASE_BRANCH || '';
            if (!base) {
              const repoInfo = await github.rest.repos.get({ owner, repo });
              base = repoInfo.data.default_branch;
            }
            core.info(`Resolved base branch: ${base}`);

            // Every prefix the agent loop creates branches under (#3693):
            // developer_create_branch.sh emits claude/issue-*, feat/*, fix/*,
            // chore/*; reconcile_dead_branches.sh and gh_project.sh sweep the
            // same set. Keep this list in sync with those.
            const PREFIXES = ['claude/', 'feat/', 'fix/', 'chore/'];

            // Never swept, regardless of prefix match — explicit rather than
            // relying on prefix mismatch (#3693): the resolved base branch,
            // master/main, and any release branch (v3.0.0, v3.1.0-rc1, ...).
            const ALWAYS_PROTECTED = new Set([base, 'master', 'main']);
            const isReleaseBranch = (name) => /^v[0-9]/.test(name);

            const now = Date.now();
            const staleMs = staleDays * 24 * 60 * 60 * 1000;

            // 1. Protect head branches of every OPEN PR.
            const openPRs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const protectedHeads = new Set(openPRs.map(p => p.head.ref));
            core.info(`Protected open-PR heads: ${[...protectedHeads].join(', ') || '(none)'}`);

            // 2. Candidate branches: any tracked prefix, minus always-protected.
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            const prefixOf = (name) => PREFIXES.find(p => name.startsWith(p));
            const candidates = branches.filter(b =>
              prefixOf(b.name) && !ALWAYS_PROTECTED.has(b.name) && !isReleaseBranch(b.name)
            );
            core.info(`Candidates by prefix: ${PREFIXES.map(p => `${p}=${candidates.filter(b => b.name.startsWith(p)).length}`).join(', ')}`);

            const deleted = []; // { prefix, line }
            const kept = [];    // { prefix, line }

            for (const b of candidates) {
              const name = b.name;
              const prefix = prefixOf(name);

              if (protectedHeads.has(name)) { kept.push({ prefix, line: `${name} — open PR` }); continue; }

              let reason = null;
              try {
                // Octokit percent-encodes the {basehead} path parameter itself;
                // pre-encoding the branch name double-encodes the "/" in every
                // prefixed ref (%2F -> %252F) and 404s the compare, so every
                // candidate was skipped as "inspection failed".
                const cmp = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `${base}...${name}`,
                });
                if (cmp.data.ahead_by === 0) {
                  // No commits beyond base → already merged/contained.
                  reason = 'merged/contained';
                } else {
                  // Unmerged. Delete only if the tip commit is stale.
                  const tip = await github.rest.repos.getCommit({ owner, repo, ref: name });
                  const tipMs = new Date(tip.data.commit.committer.date).getTime();
                  const ageDays = Math.floor((now - tipMs) / 86400000);
                  if (now - tipMs > staleMs) {
                    reason = `stale orphan — unmerged, no open PR, tip ${ageDays}d old`;
                  } else {
                    kept.push({ prefix, line: `${name} — unmerged but fresh (tip ${ageDays}d < ${staleDays}d)` });
                  }
                }
              } catch (e) {
                kept.push({ prefix, line: `${name} — skipped (inspection failed: ${e.message})` });
                continue;
              }

              if (!reason) continue;

              if (dryRun) {
                deleted.push({ prefix, line: `[dry run] would delete ${name} — ${reason}` });
              } else {
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
                  deleted.push({ prefix, line: `deleted ${name} — ${reason}` });
                } catch (e) {
                  kept.push({ prefix, line: `${name} — delete failed: ${e.message}` });
                }
              }
            }

            // Itemize per prefix so each tracked prefix's outcome is visible
            // on its own in the job summary (#3693), not just a flat list.
            function renderByPrefix(entries) {
              if (!entries.length) return '_none_';
              const sections = PREFIXES
                .map(p => ({ p, lines: entries.filter(e => e.prefix === p).map(e => e.line) }))
                .filter(s => s.lines.length);
              return sections
                .map(s => `**${s.p}** (${s.lines.length})\n` + s.lines.map(x => `- ${x}`).join('\n'))
                .join('\n\n');
            }

            core.summary
              .addHeading(`Branch cleanup${dryRun ? ' (dry run)' : ''}`)
              .addRaw(`Base: \`${base}\` · stale threshold: ${staleDays}d · prefixes: ${PREFIXES.join(', ')} · candidates: ${candidates.length}\n\n`)
              .addHeading(dryRun ? 'Would delete' : 'Deleted', 3)
              .addRaw(renderByPrefix(deleted) + '\n\n')
              .addHeading('Kept', 3)
              .addRaw(renderByPrefix(kept));
            await core.summary.write();
            core.info(`Result — removed: ${deleted.length}, kept: ${kept.length}`);
