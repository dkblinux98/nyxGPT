name: Developer Agent Auto-Implement

on:
  issues:
    types: [assigned]

jobs:
  implement:
    if: >-
      ${{ vars.AGENTS_ENABLED == 'true'
          && vars.DEV_AUTO_IMPLEMENT_ENABLED == 'true'
          && github.event.assignee.login == vars.DEV_AGENT }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      GH_TOKEN: ${{ secrets.DEV_AGENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auth gh
        run: gh auth status

      - name: Write ephemeral config.ini (runner temp)
        shell: bash
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/mygpt-config.ini"

          cat > "$CFG" <<'EOF'
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF

          echo "MYGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"
          echo "Wrote ephemeral config at $CFG"

      - name: Verify config loads
        shell: bash
        run: |
          set -euo pipefail
          bash -lc '
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            echo "config ok: $REPO_OWNER/$REPO_NAME project $PROJECT_OWNER#$PROJECT_NUMBER release=$RELEASE_BRANCH"
          '

      - name: Verify issue is In Progress in ProjectV2 (otherwise exit)
        shell: bash
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"

          bash -lc '
            set -euo pipefail
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth

            issue="'"$ISSUE"'"
            project_id="$(get_project_id)"

            q='\''query($project:ID!, $after:String){
              node(id:$project){
                ... on ProjectV2{
                  items(first:100, after:$after){
                    pageInfo{ hasNextPage endCursor }
                    nodes{
                      content{ __typename ... on Issue { number } }
                      fieldValues(first:50){
                        nodes{
                          __typename
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            field{ ... on ProjectV2SingleSelectField { name } }
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            }'\''

            after=""
            found=0
            while :; do
              resp="$(graphql "$q" -F project="$project_id" -F after="$after")"

              status="$(echo "$resp" | jq -r --argjson n "$issue" --arg f "$STATUS_FIELD" '
                .data.node.items.nodes[]
                | select(.content.__typename=="Issue" and .content.number==$n)
                | (.fieldValues.nodes[]
                    | select(.__typename=="ProjectV2ItemFieldSingleSelectValue" and .field.name==$f)
                    | .name) // empty
              ' | head -n 1)"

              if [[ -n "$status" ]]; then
                echo "[auto-implement] issue #$issue status=$status"
                if [[ "$status" != "$STATUS_IN_PROGRESS" ]]; then
                  echo "[auto-implement] Not In Progress; exiting with success."
                  exit 0
                fi
                found=1
                break
              fi

              has_next="$(echo "$resp" | jq -r ".data.node.items.pageInfo.hasNextPage")"
              cursor="$(echo "$resp" | jq -r ".data.node.items.pageInfo.endCursor // empty")"
              [[ "$has_next" == "true" && -n "$cursor" ]] || break
              after="$cursor"
            done

            if [[ "$found" != "1" ]]; then
              echo "[auto-implement] Issue not found in project; exiting with success."
              exit 0
            fi
          '

      - name: Create branch for issue
        shell: bash
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          ./scripts/agents/developer_create_branch.sh "$ISSUE" feat auto

      - name: Run Claude Code to implement issue
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Implement issue #${{ github.event.issue.number }} on the current branch.
            Requirements:
            - Make the minimal correct change to resolve the issue.
            - Add/update tests.
            - Run the test suite and fix failures.
            - Update docs if needed.
            - Commit changes with a clear message.
            Output: commit(s) pushed to the current branch.

      - name: Submit PR for review
        shell: bash
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          ./scripts/agents/developer_submit_for_review.sh "$ISSUE"