name: Developer Agent Auto-Implement

on:
  issues:
    types: [assigned]

jobs:
  implement:
    # Triggers on assignment to DEV_AGENT
    # Developer agent reads issue history to determine if this is new work or a retry
    # Status verification will exit early if not "In Progress"
    if: >-
      ${{ vars.AGENTS_ENABLED == 'true'
          && github.event.assignee.login == vars.DEV_AGENT }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Auth gh
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: gh auth status

      - name: Write ephemeral config.ini (runner temp)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"

          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF

          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"
          echo "Wrote ephemeral config at $CFG"

      - name: Verify config loads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          bash -lc '
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            echo "config ok: $REPO_OWNER/$REPO_NAME project $PROJECT_OWNER#$PROJECT_NUMBER release=$RELEASE_BRANCH"
          '

      - name: Verify issue is assigned to developer-agent (comment trigger only)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number
            });
            const devAgent = '${{ vars.DEV_AGENT }}';
            const isAssigned = issue.data.assignees.some(a => a.login === devAgent);
            if (!isAssigned) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `❌ **Developer Agent**: Cannot retry - issue is not assigned to @${devAgent}`
              });
              core.setFailed(`Issue not assigned to ${devAgent}`);
            }

      - name: Post workflow start comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const isRetry = '${{ github.event_name }}' === 'issue_comment';
            const repo = '${{ github.repository }}';
            const runId = '${{ github.run_id }}';
            const message = isRetry
              ? `🔄 **Developer Agent**: Retry requested. Restarting implementation...\n\n` +
                `Verifying issue status...\n\n[View workflow run](https://github.com/${repo}/actions/runs/${runId})`
              : `🤖 **Developer Agent**: Auto-implementation workflow triggered.\n\n` +
                `Verifying issue status...\n\n[View workflow run](https://github.com/${repo}/actions/runs/${runId})`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: message
            });

      - name: Verify issue is In Progress in ProjectV2 (otherwise exit)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          echo "::group::Verifying issue #$ISSUE_NUMBER status"
          bash -lc '
            set -euo pipefail
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth

            issue="$ISSUE_NUMBER"
            project_id="$(get_project_id)"

            q='\''query($project:ID!, $after:String){
              node(id:$project){
                ... on ProjectV2{
                  items(first:100, after:$after){
                    pageInfo{ hasNextPage endCursor }
                    nodes{
                      content{ __typename ... on Issue { number } }
                      fieldValues(first:50){
                        nodes{
                          __typename
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            field{ ... on ProjectV2SingleSelectField { name } }
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            }'\''

            after=""
            found=0
            while :; do
              resp="$(graphql "$q" -F project="$project_id" -F after="$after")"

              status="$(echo "$resp" | jq -r --argjson n "$issue" --arg f "$STATUS_FIELD" '\''
                .data.node.items.nodes[]
                | select(.content.__typename=="Issue" and .content.number==$n)
                | (.fieldValues.nodes[]
                    | select(.__typename=="ProjectV2ItemFieldSingleSelectValue" and .field.name==$f)
                    | .name) // empty
              '\'' | head -n 1)"

              if [[ -n "$status" ]]; then
                echo "::notice::Issue #$issue status=$status"
                if [[ "$status" != "$STATUS_IN_PROGRESS" ]]; then
                  echo "::warning::Not In Progress; exiting workflow."
                  exit 0
                fi
                found=1
                break
              fi

              has_next="$(echo "$resp" | jq -r ".data.node.items.pageInfo.hasNextPage")"
              cursor="$(echo "$resp" | jq -r ".data.node.items.pageInfo.endCursor // empty")"
              [[ "$has_next" == "true" && -n "$cursor" ]] || break
              after="$cursor"
            done

            if [[ "$found" != "1" ]]; then
              echo "::warning::Issue not found in project; exiting workflow."
              exit 0
            fi
          '
          echo "::endgroup::"

      - name: Check if PR already exists
        id: check_pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"

          # Check for existing PRs linked to this issue
          # Look for PRs that have "Closes #ISSUE" in the body
          EXISTING_PR=$(gh pr list --json number,body \
            --jq ".[] | select(.body | contains(\"Closes #${ISSUE}\")) | .number" \
            | head -1 || echo "")

          if [[ -n "$EXISTING_PR" ]]; then
            echo "pr_exists=true" >> "$GITHUB_OUTPUT"
            echo "existing_pr=$EXISTING_PR" >> "$GITHUB_OUTPUT"
            echo "::notice::PR already exists for issue #$ISSUE: #$EXISTING_PR"
          else
            echo "pr_exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No existing PR found for issue #$ISSUE"
          fi

      - name: Check for review comments (if PR exists)
        if: steps.check_pr.outputs.pr_exists == 'true'
        id: check_review
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.check_pr.outputs.existing_pr }}"

          # Check if there are CHANGES_REQUESTED reviews (not comments!)
          # Review agent posts actual GitHub PR Reviews with state CHANGES_REQUESTED
          REVIEW_COMMENT=$(gh pr view "$PR" --json reviews --jq '
            [.reviews[] |
             select(.state == "CHANGES_REQUESTED")] |
            last |
            .body // ""
          ')

          if [[ -n "$REVIEW_COMMENT" ]]; then
            echo "has_review_issues=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR has CHANGES_REQUESTED review - will fix issues"
          else
            echo "has_review_issues=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR has no pending review changes - skipping"
          fi

      - name: Save review comments to file (if review issues found)
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_review.outputs.has_review_issues == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          PR="${{ steps.check_pr.outputs.existing_pr }}"
          # Get the latest CHANGES_REQUESTED review (not comment)
          gh pr view "$PR" --json reviews \
            --jq '[.reviews[] | select(.state == "CHANGES_REQUESTED")] | last | .body' \
            > /tmp/review-comments.txt
          echo "Saved review feedback to /tmp/review-comments.txt"

      - name: Post review fix start comment (if review issues found)
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_review.outputs.has_review_issues == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const pr_number = '${{ steps.check_pr.outputs.existing_pr }}';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `🔧 **Developer Agent**: Fixing review issues for PR #${pr_number}\n\n` +
                    `🤖 Starting Claude Code to address review comments...\n\n` +
                    `Claude will:\n` +
                    `- Read the review comments from PR #${pr_number}\n` +
                    `- Implement the requested fixes\n` +
                    `- Run all tests (3-try loop to fix any failures)\n` +
                    `- Commit and push fixes\n\n` +
                    `[View workflow logs](${repoUrl}/actions/runs/${context.runId})`
            });

      - name: Post PR exists notice (if no review issues)
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_review.outputs.has_review_issues == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const pr_number = '${{ steps.check_pr.outputs.existing_pr }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `✅ **Developer Agent**: PR #${pr_number} already exists and ` +
                    `has no review issues.\n\nSkipping implementation step.`
            });

      - name: Run Claude Code to fix review issues (Review Fix)
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_review.outputs.has_review_issues == 'true'
        id: claude_review_fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: '--allowed-tools "Bash,Read,Write,Edit,Glob,Grep"'
          prompt: |
            Fix the code review issues for issue #${{ github.event.issue.number }}.

            **Context:**
            - PR exists: #${{ steps.check_pr.outputs.existing_pr }}
            - Code review requested changes

            **Instructions:**

            ### Step 1: Ensure you're on the correct branch
            First, determine which branch this PR is from:
            ```bash
            gh pr view ${{ steps.check_pr.outputs.existing_pr }} --json headRefName -q .headRefName
            ```

            Then check it out. If checkout fails (branch doesn't exist locally, ref issues, etc.):
            - Diagnose the problem (read error message)
            - Fix it yourself (fetch, clean stale refs, recreate if needed)
            - Do NOT wait for human intervention

            ### Step 2: Fix review issues
            1. Read review comments from: /tmp/review-comments.txt
            2. Identify all Critical and Medium issues from the review
            3. Implement fixes for each issue

            ### Step 3: Validate before committing
            BEFORE committing, run ALL validation checks (ALL must pass):
            - black --check . (if fails: black . then re-check)
            - ruff check src/ tests/ (0 errors required)
            - mypy src/ (0 errors required)
            - pytest tests/unit/ -v (0 failures, 0 errors required)
            - cd web && npm run type-check (if web files modified)
            - ./scripts/agents/validate-web-routes.sh (if API endpoints added)

            If any check fails: fix and re-run ALL checks (up to 3 attempts)

            ### Step 4: Commit and push
            Commit: "fix: address code review findings (#${{ github.event.issue.number }})"

            **CRITICAL**:
            - Handle ALL infrastructure errors yourself (branch checkout, git operations)
            - Do NOT commit until ALL checks pass with 0 errors/failures
            - Do NOT create or update PRs - the workflow handles that

      - name: Post implementation start comment
        if: steps.check_pr.outputs.pr_exists == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `🤖 **Developer Agent**: Starting implementation...\n\n` +
                    `This may take several minutes. Claude will:\n` +
                    `- Create/checkout feature branch\n` +
                    `- Analyze the issue requirements\n` +
                    `- Implement the solution\n` +
                    `- Add/update tests\n` +
                    `- Run the test suite\n` +
                    `- Commit changes\n\n` +
                    `You can watch progress in the ` +
                    `[workflow logs](https://github.com/${context.repo.owner}/` +
                    `${context.repo.repo}/actions/runs/${context.runId}).`
            });

      - name: Run Claude Code to implement issue (Initial)
        if: steps.check_pr.outputs.pr_exists == 'false'
        id: claude_initial
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: '--allowed-tools "Bash,Read,Write,Edit,Glob,Grep"'
          prompt: |
            Implement issue #${{ github.event.issue.number }}.

            ## Step 1: Create/Checkout Feature Branch

            Run this command to create the feature branch:
            ```bash
            ./scripts/agents/developer_create_branch.sh ${{ github.event.issue.number }} feat auto
            ```

            This will create a branch like `feat/ISSUE-slug` and check it out.

            **If the command fails:**
            - Read the error message carefully
            - Diagnose the problem (branch exists? fetch failed? permissions? git state?)
            - Fix it yourself using appropriate git commands
            - Examples of fixes you might need:
              - If branch exists remotely but checkout fails:
                `git fetch origin BRANCH && git checkout -b BRANCH origin/BRANCH`
              - If stale refs: `git remote prune origin`
              - If local branch conflicts: `git branch -D BRANCH` then retry
              - If script has a bug: read the script, fix it, then retry
            - Do NOT wait for human intervention - you are responsible for handling this

            Once you have successfully checked out the feature branch, proceed to implementation.

            ## Step 2: Implement the Solution

            Requirements:
            - Make the minimal correct change to resolve the issue.
            - Add/update tests for ALL code changes.

            ## Step 3: Mandatory Validation Before Commit

            You MUST run ALL of the following checks and ensure they ALL PASS before committing:

              1. **Code Formatting (ALWAYS RUN)**:
                 - Run: black --check .
                 - If it fails, run: black . (to auto-format)
                 - Re-check: black --check . (must pass)

              2. **Linting (ALWAYS RUN)**:
                 - Run: ruff check src/ tests/
                 - Fix ALL linting errors before proceeding
                 - Must show 0 errors

              3. **Type Checking (ALWAYS RUN)**:
                 - Run: mypy src/
                 - Fix ALL type errors before proceeding
                 - Must show 0 errors

              4. **Tests (ALWAYS RUN)**:
                 - Run: pytest -v
                 - ALL tests MUST PASS (0 failures, 0 errors)
                 - If ANY test fails: analyze, fix, re-run
                 - Verify output shows "passed" with no "FAILED" or "ERROR"

              5. **TypeScript (if you modified web/ files)**:
                 - Run: cd web && npm run type-check
                 - Fix any TypeScript errors before committing

              6. **Route Validation (if you added backend API endpoints)**:
                 - Run: ./scripts/agents/validate-web-routes.sh
                 - Fix any missing routes before committing

              **CRITICAL**: Do NOT commit until ALL checks pass. Run checks in a loop:
              - Try to fix issues up to 3 times
              - If still failing after 3 attempts, report what's blocking you
            - **MANDATORY DOCUMENTATION**: Update documentation for ALL user-facing changes:
              * If you modify src/nyxgpt/api.py or src/nyxgpt/app.py → Update docs/api.md
              * If you modify src/nyxgpt/cli.py → Update docs/configuration.md or README.md CLI section
              * If you add/change config options → Update example.config.ini AND docs/configuration.md
              * If you add new features → Update README.md feature list
              * For ANY code change, check if docs/ files need updates
            - Commit changes with clear messages that MUST include issue references.

            CRITICAL COMMIT MESSAGE FORMAT:
            All commit messages MUST reference issue numbers using this format:

            Format:
            "<type>: <description> (#${{ github.event.issue.number }})"

            Examples:
            - "feat: add user authentication (#${{ github.event.issue.number }})"
            - "fix: resolve null pointer in validator (#${{ github.event.issue.number }})"
            - "test: add integration tests per review (#${{ github.event.issue.number }})"
            - "docs: update API documentation (#${{ github.event.issue.number }})"

            Valid commit types: feat, fix, test, docs, refactor, chore

            **CRITICAL PROHIBITIONS:**
            - Do NOT create or update pull requests (no `gh pr create`, `gh pr edit`, etc.)
            - Do NOT use any `gh` CLI commands - you don't have GitHub API access
            - The workflow will create the PR after verification passes

            Output: commit(s) pushed to the current branch with proper issue references.

      - name: Post implementation complete comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: '✅ **Developer Agent**: Implementation complete. Running verification checks...'
            });

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: web
        run: npm ci

      - name: Run Verification (Attempt 1)
        id: verify1
        continue-on-error: true
        run: |
          set +e  # Don't exit immediately on error - we want to capture all failures
          FAILED=0

          # Run ALL checks unconditionally on the entire codebase
          # This ensures no regressions are introduced regardless of what files changed

          echo "::group::Running black format check"
          python -m black --check . 2>&1 | tee /tmp/black_attempt1.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running ruff"
          python -m ruff check src/ tests/ 2>&1 | tee /tmp/ruff_attempt1.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running pytest (unit tests - integration tests skipped in CI)"
          # Integration tests require running API server (not available in CI)
          python -m pytest tests/unit/ -v 2>&1 | tee /tmp/pytest_attempt1.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running mypy"
          python -m mypy src/ 2>&1 | tee /tmp/mypy_attempt1.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running TypeScript type check"
          (cd web && npm run type-check) 2>&1 | tee /tmp/tsc_attempt1.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running web route validation"
          ./scripts/agents/validate-web-routes.sh 2>&1 | tee /tmp/routes_attempt1.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          if [ $FAILED -eq 1 ]; then
            echo "verification_passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Verification failed on attempt 1, will retry with fixes"
            exit 1
          else
            echo "verification_passed=true" >> "$GITHUB_OUTPUT"
            echo "✅ All verification checks passed!"
          fi

      - name: Claude Fix Issues (Attempt 2)
        if: steps.verify1.outputs.verification_passed == 'false'
        id: claude_fix2
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: '--allowed-tools "Bash,Read,Write,Edit,Glob,Grep"'
          prompt: |
            VERIFICATION FAILED - YOU MUST FIX THE ISSUES

            The previous implementation for issue #${{ github.event.issue.number }} failed verification checks.

            **Important:** You should already be on the feature branch from the previous step.
            If for some reason you're not, check out the branch yourself using git commands.

            Failure logs have been saved to:
            - /tmp/pytest_attempt1.log (if pytest failed)
            - /tmp/ruff_attempt1.log (if ruff linting failed)
            - /tmp/mypy_attempt1.log (if mypy failed)
            - /tmp/black_attempt1.log (if black formatting failed)
            - /tmp/tsc_attempt1.log (if TypeScript type checking failed)
            - /tmp/routes_attempt1.log (if route validation failed)

            YOUR TASK:
            1. Read each log file that exists using the Read tool
            2. Understand what failed and why
            3. Fix ALL the issues in the code
            4. BEFORE committing, re-run ALL verification commands (ALL must pass):
               - black --check . (if fails: black . then re-check)
               - ruff check src/ tests/
               - mypy src/
               - pytest -v
               - cd web && npm run type-check (if web files modified)
               - ./scripts/agents/validate-web-routes.sh (if API endpoints added)
            5. Do NOT commit until ALL checks pass with 0 errors/failures
            6. Commit your fixes with message:
               "fix: address verification failures (attempt 2) (#${{ github.event.issue.number }})"

            DO NOT create a PR. Just fix the code and commit.
            The workflow will handle PR creation after verification passes.

      - name: Run Verification (Attempt 2)
        if: steps.claude_fix2.conclusion == 'success'
        id: verify2
        continue-on-error: true
        run: |
          set +e
          FAILED=0

          # Run ALL checks unconditionally on the entire codebase

          echo "::group::Running black format check"
          python -m black --check . 2>&1 | tee /tmp/black_attempt2.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running ruff"
          python -m ruff check src/ tests/ 2>&1 | tee /tmp/ruff_attempt2.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running pytest (unit tests - integration tests skipped in CI)"
          # Integration tests require running API server (not available in CI)
          python -m pytest tests/unit/ -v 2>&1 | tee /tmp/pytest_attempt2.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running mypy"
          python -m mypy src/ 2>&1 | tee /tmp/mypy_attempt2.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running TypeScript type check"
          (cd web && npm run type-check) 2>&1 | tee /tmp/tsc_attempt2.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running web route validation"
          ./scripts/agents/validate-web-routes.sh 2>&1 | tee /tmp/routes_attempt2.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          if [ $FAILED -eq 1 ]; then
            echo "verification_passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Verification failed on attempt 2, will retry with fixes"
            exit 1
          else
            echo "verification_passed=true" >> "$GITHUB_OUTPUT"
            echo "✅ All verification checks passed!"
          fi

      - name: Claude Fix Issues (Attempt 3)
        if: steps.verify2.outputs.verification_passed == 'false'
        id: claude_fix3
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: '--allowed-tools "Bash,Read,Write,Edit,Glob,Grep"'
          prompt: |
            VERIFICATION STILL FAILING - FINAL ATTEMPT TO FIX

            Issue #${{ github.event.issue.number }} verification failed AGAIN after your previous fix attempt.

            Latest failure logs:
            - /tmp/black_attempt2.log (if black formatting failed)
            - /tmp/ruff_attempt2.log (if ruff linting failed)
            - /tmp/mypy_attempt2.log (if mypy failed)
            - /tmp/pytest_attempt2.log (if pytest failed)
            - /tmp/tsc_attempt2.log (if TypeScript type checking failed)
            - /tmp/routes_attempt2.log (if route validation failed)

            This is your LAST CHANCE to fix the issues before the workflow fails completely.

            YOUR TASK:
            1. Read the latest failure logs
            2. Compare with previous logs at /tmp/*_attempt1.log to see if you made progress
            3. Fix ALL remaining issues
            4. BEFORE committing, re-run ALL verification commands (ALL must pass):
               - black --check . (if fails: black . then re-check)
               - ruff check src/ tests/
               - mypy src/
               - pytest -v
               - cd web && npm run type-check (if web files modified)
               - ./scripts/agents/validate-web-routes.sh (if API endpoints added)
            5. Do NOT commit until ALL checks pass with 0 errors/failures
            6. Commit with message:
               "fix: address remaining verification failures (attempt 3) (#${{ github.event.issue.number }})"

      - name: Final Verification (Must Pass)
        id: verify_final
        run: |
          # Run ALL checks unconditionally on the entire codebase
          # This is the final gate - no regressions allowed

          echo "::group::Final black format check"
          python -m black --check .
          echo "::endgroup::"

          echo "::group::Final ruff verification"
          python -m ruff check src/ tests/
          echo "::endgroup::"

          echo "::group::Final mypy verification"
          python -m mypy src/
          echo "::endgroup::"

          echo "::group::Final pytest verification (unit tests - integration tests skipped in CI)"
          # Integration tests require running API server (not available in CI)
          python -m pytest tests/unit/ -v
          echo "::endgroup::"

          echo "::group::Final TypeScript verification"
          (cd web && npm run type-check)
          echo "::endgroup::"

          echo "::group::Final route validation"
          ./scripts/agents/validate-web-routes.sh
          echo "::endgroup::"

          echo "✅ All verification checks passed on final attempt!"

      - name: Post verification failure comment
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `❌ **Developer Agent**: Failed after 3 attempts

            The implementation failed verification even after 3 fix attempts.
            This indicates a more complex issue that requires manual intervention.

            **What happened:**
            - Attempt 1: Initial implementation failed verification
            - Attempt 2: Agent attempted fixes, verification still failed
            - Attempt 3: Agent attempted more fixes, verification STILL failed

            **Next steps:**
            1. Review the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
               to see what's failing
            2. Check the commit history on the branch to see what the agent tried
            3. Manual debugging may be required - the agent may not have enough context

            **Note:** No PR was created because verification never passed.`
            });

      - name: Request review for existing PR
        if: |
          steps.check_pr.outputs.pr_exists == 'true' &&
          success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          PR="${{ steps.check_pr.outputs.existing_pr }}"

          echo "::group::Requesting review for existing PR #$PR"

          # Assign PR to review-agent
          gh pr edit "$PR" --add-assignee "${{ vars.REVIEW_AGENT }}" || \
            echo "::warning::Failed to set PR assignee"

          # Request review from review-agent (critical)
          if ! gh pr edit "$PR" --add-reviewer "${{ vars.REVIEW_AGENT }}"; then
            echo "::error::Failed to request review from review-agent"
            exit 1
          fi

          # Update issue status and assignee using project scripts
          bash -lc "cd '$GITHUB_WORKSPACE' && \
            source scripts/agents/lib/gh_project.sh && \
            load_config && \
            require_gh_auth && \
            set_issue_status '$ISSUE' \"\$STATUS_IN_REVIEW\" && \
            issue_assign_only '$ISSUE' \"\$REVIEW_AGENT\""

          echo "::notice::PR #$PR submitted for review"
          echo "::endgroup::"

      - name: Post review requested comment (existing PR)
        if: |
          steps.check_pr.outputs.pr_exists == 'true' &&
          steps.check_review.outputs.has_review_issues == 'false' &&
          success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const pr_number = '${{ steps.check_pr.outputs.existing_pr }}';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const body = `✅ **Developer Agent**: Verification passed ` +
              `for existing PR #${pr_number}\n\n` +
              `All checks passed:\n` +
              `- ✅ Black formatting\n` +
              `- ✅ Ruff linting\n` +
              `- ✅ Mypy type checking\n` +
              `- ✅ Pytest unit tests\n\n` +
              `PR #${pr_number} has been submitted for review.\n\n` +
              `[View PR](${repoUrl}/pull/${pr_number})`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: body
            });

      - name: Submit PR for review
        if: steps.check_pr.outputs.pr_exists == 'false' && success()
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          echo "::group::Submitting PR for review"
          PR_NUMBER=$(./scripts/agents/developer_submit_for_review.sh "$ISSUE")
          echo "::notice::Created PR #$PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Post PR created comment
        if: steps.check_pr.outputs.pr_exists == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const pr_number = '${{ steps.pr.outputs.pr_number }}';
            const review_agent = '${{ vars.REVIEW_AGENT }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `🎉 **Developer Agent**: Implementation complete!\n\n` +
                    `📝 Pull Request: #${pr_number}\n` +
                    `📊 Status: **In Review**\n` +
                    `👤 Assigned to: @${review_agent}\n\n` +
                    `The review agent will now:\n` +
                    `1. Wait for CI checks to complete\n` +
                    `2. Review the code changes\n` +
                    `3. Either merge or request changes\n\n` +
                    `[View PR](https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pr_number})`
            });

      - name: Classify error (Phase 1)
        if: failure()
        id: classify_error
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set +e  # Don't exit on error - we're analyzing the error

          echo "::group::Extracting error from workflow logs"

          # Get error messages from this workflow run
          ERROR_LOG=$(gh run view ${{ github.run_id }} --log 2>&1 | \
            grep -E "\[error\]|Error:|fatal:|FAILED" | \
            head -20)

          echo "Error messages found:"
          echo "$ERROR_LOG"
          echo "::endgroup::"

          # Source the library to get classification functions
          source scripts/agents/lib/gh_project.sh

          # Classify the error
          ERROR_CLASS=$(classify_error "$ERROR_LOG")

          echo "::notice::Error classification: $ERROR_CLASS"
          echo "error_class=$ERROR_CLASS" >> "$GITHUB_OUTPUT"

          # Determine if retriable
          if is_retriable_error "$ERROR_CLASS"; then
            echo "retriable=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Error is retriable - will attempt auto-retry"
          elif is_fatal_error "$ERROR_CLASS"; then
            echo "retriable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Error is fatal - will NOT retry (would be futile)"
          else
            # Unknown - default to not retriable (conservative approach)
            echo "retriable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Error type unknown - defaulting to no retry"
          fi

      - name: Attempt intelligent fix (Phase 2)
        if: failure() && steps.classify_error.outputs.retriable == 'true'
        id: intelligent_fix
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        continue-on-error: true
        run: |
          set +e  # Don't exit on error - we're handling it

          echo "::group::Running intelligent failure analysis"

          # Run the analysis script
          ./scripts/agents/developer_analyze_failure.sh \
            "${{ github.event.issue.number }}" \
            "${{ github.run_id }}"

          RESULT=$?

          echo "::endgroup::"

          # Store the result
          case $RESULT in
            0)
              echo "fix_status=FIXED" >> "$GITHUB_OUTPUT"
              echo "::notice::Auto-fix successful - problem resolved"
              ;;
            1)
              echo "fix_status=FATAL" >> "$GITHUB_OUTPUT"
              echo "::warning::Error is fatal - no fix available"
              ;;
            2)
              echo "fix_status=TRANSIENT" >> "$GITHUB_OUTPUT"
              echo "::notice::Error is transient - retry recommended"
              ;;
            *)
              echo "fix_status=UNKNOWN" >> "$GITHUB_OUTPUT"
              echo "::error::Analysis script returned unexpected code: $RESULT"
              ;;
          esac

          # Read analysis details if available (parse safely)
          if [[ -f /tmp/analysis_result.txt ]]; then
            while IFS='=' read -r key value; do
              [[ -z "$key" || "$key" =~ ^# || -z "$value" ]] && continue
              [[ "$key" =~ ^[A-Z_][A-Z0-9_]*$ ]] || continue
              export "$key=$value"
            done < /tmp/analysis_result.txt

            echo "action=${ACTION:-none}" >> "$GITHUB_OUTPUT"
            echo "wait_seconds=${WAIT_SECONDS:-0}" >> "$GITHUB_OUTPUT"
            echo "::notice::Analysis: $STATUS - $ERROR_TYPE"
          fi

          exit 0  # Don't fail the workflow - we're handling errors

      - name: Deep analysis with Claude (Phase 3 - complex reasoning)
        if: |
          failure() && (
            steps.intelligent_fix.outputs.fix_status == 'UNKNOWN' ||
            steps.classify_error.outputs.error_class == 'unknown'
          )
        id: claude_analysis
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: false
          claude_args: '--allowed-tools "Bash,Read,Grep"'
          prompt: |
            The developer workflow failed for issue #${{ github.event.issue.number }}, and automatic
            analysis was inconclusive. You need to perform deep reasoning to diagnose the failure.

            ## Your Task

            Determine whether this error is:
            - **AUTO-FIXABLE:** Can be fixed now (reopen issue, fix git state, etc.)
            - **TRANSIENT:** Should retry (rate limits, network issues)
            - **FATAL:** Needs human intervention (auth failures, intentional closures)

            ## Step 1: Get Failure Details

            Extract the error from workflow logs:
            ```bash
            gh run view ${{ github.run_id }} --log | grep -E "\[error\]|Error:|fatal:" | head -30
            ```

            ## Step 2: Gather Context

            Based on the error type, gather relevant information:

            **For issue-related errors:**
            ```bash
            gh issue view ${{ github.event.issue.number }} \
              --json state,closedAt,assignees,createdAt,updatedAt
            ```

            **For PR-related errors:**
            ```bash
            gh pr list --search "${{ github.event.issue.number }}" --state all \
              --json number,state,mergedAt,closedAt
            ```

            **For rate limits:**
            ```bash
            gh api rate_limit
            ```

            ## Step 3: Reasoning Guidelines

            Use human-like reasoning to make nuanced decisions:

            **Timing matters:**
            - Closed 30 minutes ago + assigned to dev → Likely accidental
            - Closed 3 days ago → Likely intentional
            - Closed with merged PR → Work complete, don't reopen

            **Context matters:**
            - Issue closed but PR still open → Review in progress, don't interfere
            - Issue closed, PR merged → Completion, issue should stay closed
            - Issue closed, no PR → Investigate why

            **Error patterns:**
            - "Issue is CLOSED" → Check timing and PR status
            - "No commits between" → Check if work already merged
            - "Authentication failed" → Always fatal
            - "Rate limit" → Check reset time

            ## Step 4: Take Action or Recommend

            **If AUTO-FIXABLE:**
            1. Fix the problem (reopen issue, etc.)
            2. Write to /tmp/analysis_result.txt:
               ```
               STATUS=FIXED
               ERROR_TYPE=<type>
               ACTION=<what you did>
               ```

            **If TRANSIENT:**
            Write to /tmp/analysis_result.txt:
            ```
            STATUS=TRANSIENT
            ERROR_TYPE=<type>
            WAIT_SECONDS=<if applicable>
            ```

            **If FATAL:**
            Write to /tmp/analysis_result.txt:
            ```
            STATUS=FATAL
            ERROR_TYPE=<type>
            DIAGNOSIS=<detailed explanation of why this needs human intervention>
            ```

            ## Critical Rules

            - DO use nuanced reasoning (time elapsed, context clues)
            - DO fix accidental closures (recent + assigned + no merged PR)
            - DON'T reopen intentionally closed issues (old + merged PR)
            - DON'T just retry without understanding WHY it failed
            - DO provide detailed diagnosis for fatal errors

      - name: Read Claude analysis result (Phase 3)
        if: failure() && steps.claude_analysis.conclusion == 'success'
        id: claude_result
        shell: bash
        run: |
          if [[ -f /tmp/analysis_result.txt ]]; then
            # Parse file safely - only read KEY=VALUE lines
            while IFS='=' read -r key value; do
              # Skip empty lines, comments, and lines without =
              [[ -z "$key" || "$key" =~ ^# || -z "$value" ]] && continue
              # Only process valid variable names
              [[ "$key" =~ ^[A-Z_][A-Z0-9_]*$ ]] || continue
              # Export the variable
              export "$key=$value"
            done < /tmp/analysis_result.txt

            echo "status=${STATUS:-UNKNOWN}" >> "$GITHUB_OUTPUT"
            echo "error_type=${ERROR_TYPE:-unknown}" >> "$GITHUB_OUTPUT"
            echo "action=${ACTION:-none}" >> "$GITHUB_OUTPUT"
            echo "diagnosis=${DIAGNOSIS:-}" >> "$GITHUB_OUTPUT"
            echo "wait_seconds=${WAIT_SECONDS:-0}" >> "$GITHUB_OUTPUT"
            echo "Claude analysis: $STATUS - $ERROR_TYPE"
          else
            echo "status=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "error_type=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Post fix success comment (Phase 2+3)
        if: |
          failure() && (
            steps.intelligent_fix.outputs.fix_status == 'FIXED' ||
            steps.claude_result.outputs.status == 'FIXED'
          )
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const phase2Action = '${{ steps.intelligent_fix.outputs.action }}';
            const phase3Action = '${{ steps.claude_result.outputs.action }}';
            const action = phase3Action || phase2Action;
            const phase = phase3Action ? 'Phase 3 (Claude reasoning)' : 'Phase 2 (Script analysis)';
            const repo = context.repo.owner + '/' + context.repo.repo;
            const runId = context.runId;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `✅ **Developer Agent**: Problem automatically resolved!\n\n` +
                    `**Auto-fix applied:** ${action}\n` +
                    `**Analysis:** ${phase}\n\n` +
                    `The workflow will now continue from where it left off.\n\n` +
                    `[Workflow run](https://github.com/${repo}/actions/runs/${runId})`
            });

      - name: Auto-retry on failure (Phase 2+3 - transient errors only)
        if: |
          failure() && (
            steps.intelligent_fix.outputs.fix_status == 'TRANSIENT' ||
            steps.claude_result.outputs.status == 'TRANSIENT'
          )
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const runId = context.runId;
            const errorClass = '${{ steps.classify_error.outputs.error_class }}';
            const phase3Status = '${{ steps.claude_result.outputs.status }}';
            const analysisPhase = phase3Status === 'TRANSIENT' ? 'Phase 3 (Claude)' : 'Phase 2 (Script)';

            // Intelligent retry counting - context-aware, error-type specific
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number
            });

            const MAX_RETRIES = 3;
            const waitSecondsPhase2 = parseInt('${{ steps.intelligent_fix.outputs.wait_seconds }}') || 0;
            const waitSecondsPhase3 = parseInt('${{ steps.claude_result.outputs.wait_seconds }}') || 0;
            const waitSeconds = waitSecondsPhase3 || waitSecondsPhase2;

            // Parse retry history with context
            const retryHistory = comments.data
              .filter(c => c.body.includes('RETRY_IMPLEMENTATION'))
              .map(c => ({
                timestamp: c.created_at,
                isManual: c.user.login !== 'github-actions[bot]',
                errorType: c.body.match(/\*\*Error type:\*\* ([\w:]+)/)?.[1] || 'unknown'
              }));

            // Find last manual intervention (resets the count)
            const lastManualIndex = retryHistory.findIndex(r => r.isManual);

            // Only count retries AFTER last manual intervention
            const relevantRetries = lastManualIndex >= 0
              ? retryHistory.slice(0, lastManualIndex)
              : retryHistory;

            // Count retries for THIS specific error type
            const retriesForCurrentError = relevantRetries.filter(r =>
              r.errorType === errorClass
            ).length;

            // Total retries (for context)
            const totalRetries = relevantRetries.length;

            core.notice(
              `Retry analysis: ${retriesForCurrentError} for error ${errorClass}, ` +
              `${totalRetries} total since last manual intervention`
            );

            // Only escalate if SAME error persists 3+ times
            if (retriesForCurrentError >= MAX_RETRIES) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: `❌ **Developer Agent**: Same error persisted through ${MAX_RETRIES} retry attempts.\n\n` +
                      `**Error type:** ${errorClass}\n` +
                      `**Retry count:** ${retriesForCurrentError} attempts for this specific error\n` +
                      `**Total retries:** ${totalRetries} (since last manual intervention)\n\n` +
                      `The same error has failed ${MAX_RETRIES} times, indicating a persistent issue ` +
                      `that cannot be resolved by automatic retries. Human intervention is required.\n\n` +
                      `**What to do:**\n` +
                      `1. Review the [failed workflow logs](https://github.com/${repo}/actions/runs/${runId})\n` +
                      `2. Identify why **${errorClass}** keeps failing\n` +
                      `3. Fix the underlying problem manually\n` +
                      `4. Comment \`RETRY_IMPLEMENTATION\` to try again once fixed\n\n` +
                      `**Note:** Manual intervention resets the retry counter.`
              });
              core.setFailed('Maximum retry limit reached');
              return;
            }

            // Wait if recommended (e.g., rate limits)
            if (waitSeconds > 0) {
              core.notice(`Waiting ${waitSeconds} seconds before retry (rate limit/backoff)...`);
              await new Promise(resolve => setTimeout(resolve, waitSeconds * 1000));
            }

            // Auto-retry: Post RETRY_IMPLEMENTATION comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `⚠️ **Developer Agent**: Workflow failed - auto-retry triggered.\n\n` +
                    `**Error type:** ${errorClass} (transient)\n` +
                    `**Analysis:** ${analysisPhase}\n` +
                    `**Retry count:** ${retriesForCurrentError + 1}/${MAX_RETRIES} attempts for this specific error\n` +
                    `**Total retries:** ${totalRetries} (since last manual intervention)\n` +
                    `**Action:** Analysis determined this error may resolve with retry.\n` +
                    (waitSeconds > 0 ? `**Wait time:** Waited ${waitSeconds} seconds before retry\n\n` : '\n') +
                    `The agent will attempt to:\n` +
                    `1. Diagnose and fix any infrastructure issues\n` +
                    `2. Handle branch creation/checkout problems\n` +
                    `3. Retry the implementation\n\n` +
                    `[Previous failed run](https://github.com/${repo}/actions/runs/${runId})\n\n` +
                    `RETRY_IMPLEMENTATION`
            });

            core.notice(
              `Auto-retry triggered (${retriesForCurrentError + 1}/${MAX_RETRIES}) ` +
              `for ${errorClass} (${totalRetries} total retries since last manual intervention)`
            );

      - name: Escalate fatal error (Phase 1+2+3 - no retry)
        if: |
          failure() && (
            steps.classify_error.outputs.retriable == 'false' ||
            steps.intelligent_fix.outputs.fix_status == 'FATAL' ||
            steps.claude_result.outputs.status == 'FATAL'
          )
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const runId = context.runId;
            const errorClass = '${{ steps.classify_error.outputs.error_class }}';
            const phase2Status = '${{ steps.intelligent_fix.outputs.fix_status }}';
            const phase3Status = '${{ steps.claude_result.outputs.status }}';
            const phase3Diagnosis = '${{ steps.claude_result.outputs.diagnosis }}';

            // Read diagnosis from Phase 2 if available
            const fs = require('fs');
            let phase2Diagnosis = '';
            try {
              const result = fs.readFileSync('/tmp/analysis_result.txt', 'utf8');
              const match = result.match(/DIAGNOSIS=(.+)/);
              if (match) phase2Diagnosis = match[1];
            } catch (e) {}

            // Use Phase 3 diagnosis if available, otherwise Phase 2
            let diagnosis = phase3Diagnosis || phase2Diagnosis;

            // Map error types to human-friendly explanations
            const errorExplanations = {
              'fatal:issue_closed': 'Issue is closed. This may be intentional or accidental.',
              'fatal:auth_failure': 'Authentication failed. Requires admin intervention to ' +
                                    'fix secrets/permissions.',
              'fatal:already_merged': 'Work already completed in a merged PR.',
              'unknown': 'Error type could not be determined. Manual investigation needed.'
            };

            const explanation = diagnosis || errorExplanations[errorClass] || 'Unrecognized error type.';
            const analysisPhase = phase3Status === 'FATAL' ? 'Phase 3 (Claude reasoning)' :
                                 phase2Status === 'FATAL' ? 'Phase 2 (Script analysis)' :
                                 'Phase 1 (Error classification)';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `❌ **Developer Agent**: Workflow failed with non-retriable error.\n\n` +
                    `**Error type:** ${errorClass}\n` +
                    `**Analysis:** ${analysisPhase}\n` +
                    `**Diagnosis:** ${explanation}\n\n` +
                    (phase3Status === 'FATAL' || phase2Status === 'FATAL' ?
                      'Intelligent analysis attempted auto-fix but determined error is fatal.\n\n' :
                      '') +
                    `Automatic retries would not resolve this type of error. ` +
                    `Manual intervention is required.\n\n` +
                    `**Next steps:**\n` +
                    `1. Review the [failed workflow logs](https://github.com/${repo}/actions/runs/${runId})\n` +
                    `2. Address the root cause:\n` +
                    `   - **issue_closed:** Check if issue should be reopened or work is complete\n` +
                    `   - **auth_failure:** Verify repository secrets and permissions\n` +
                    `   - **already_merged:** Work may already be done, check PRs\n` +
                    `   - **unknown:** Investigate logs for specific error details\n` +
                    `3. Once fixed, comment \`RETRY_IMPLEMENTATION\` to retry\n\n` +
                    `**Note:** Phase 2 intelligent analysis will auto-fix many of these errors.`
            });

            core.setFailed(`Fatal error (${errorClass}) - no auto-retry`);
