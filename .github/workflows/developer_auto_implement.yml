name: Developer Agent Auto-Implement

on:
  issues:
    types: [assigned]
  # RETRY_IMPLEMENTATION comments: the failure handler posts an auto-retry
  # comment ending in RETRY_IMPLEMENTATION, and the escalation comments tell
  # a human to "comment RETRY_IMPLEMENTATION to retry" -- but until this
  # trigger existed, those comments could never start anything (the job body
  # always supported issue_comment; the `on:` block just never subscribed).
  # Restarting a crashed run required manually cycling the assignee.
  issue_comment:
    types: [created]

jobs:
  implement:
    # Triggers on assignment to DEV_AGENT, or on a RETRY_IMPLEMENTATION
    # comment on an issue (not a PR) from the owner (manual retry per the
    # failure-comment instructions), the dev agent itself (bounded
    # auto-retry -- the retry-count scan over prior RETRY_IMPLEMENTATION
    # comments caps the loop), or the review agent (redispatch fallback:
    # assign_and_trigger_developer posts this comment whenever it has to
    # unassign-then-reassign an already-assigned dev agent, because that
    # assignment-cycling event alone proved unreliable in production --
    # #3647 -- and left a REQUEST_CHANGES redispatch stalled with no
    # developer run started).
    # Developer agent reads issue history to determine if this is new work or a retry
    # Status verification will exit early if not "In Progress"
    if: >-
      ${{ vars.AGENTS_ENABLED == 'true'
          && ((github.event_name == 'issues'
               && github.event.assignee.login == vars.DEV_AGENT)
              || (github.event_name == 'issue_comment'
                  && !github.event.issue.pull_request
                  && contains(github.event.comment.body, 'RETRY_IMPLEMENTATION')
                  && (github.event.comment.author_association == 'OWNER'
                      || github.event.comment.user.login == vars.DEV_AGENT
                      || github.event.comment.user.login == vars.REVIEW_AGENT))) }}
    runs-on: ubuntu-latest
    # Serialize runs per-issue: the redispatch fallback above deliberately
    # fires two independent triggers (the assignment-cycling event AND the
    # RETRY_IMPLEMENTATION comment) for the same handoff. Without this,
    # both can start a job for the same issue at once (#3647 scope
    # addition: duplicate developer runs observed 13s apart from an
    # unrelated burst of triggers). cancel-in-progress stays false so a
    # second trigger queues behind in-flight work instead of killing it.
    concurrency:
      group: developer-implement-${{ github.event.issue.number }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    # Attribute the developer agent's commits to myGPT-developer-agent instead
    # of the action's default `claude[bot]` identity. anthropics/claude-code-action
    # commits via git, which honors these GIT_* env vars over git config -- the
    # `git config user.name` step below is silently ignored by the action, which
    # is why ~579 commits landed as claude[bot] on a public repo (#3626). Set at
    # job level so all three action steps (initial / acceptance-failure / review
    # fix) and any conflict-resolution merge commits inherit the identity. No
    # history is rewritten; this changes future commits only.
    env:
      GIT_AUTHOR_NAME: myGPT-developer-agent
      GIT_AUTHOR_EMAIL: 253622687+myGPT-developer-agent@users.noreply.github.com
      GIT_COMMITTER_NAME: myGPT-developer-agent
      GIT_COMMITTER_EMAIL: 253622687+myGPT-developer-agent@users.noreply.github.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0
          # Push with the developer agent's PAT instead of the default
          # GITHUB_TOKEN: the default token can never create/update files
          # under .github/workflows/ (hard platform restriction, surfaced
          # on PR #3172), and PAT pushes are attributed to
          # myGPT-developer-agent per the identity policy. The PAT must
          # have the "workflow" scope for workflow-file changes to push.
          token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}

      - name: Configure git identity
        run: |
          git config --global user.name "myGPT-developer-agent"
          git config --global user.email "253622687+myGPT-developer-agent@users.noreply.github.com"

      - name: Write MCP config
        run: |
          cat > $RUNNER_TEMP/mcp-config.json <<'EOF'
          {
            "mcpServers": {
              "sequential-thinking": {
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-sequential-thinking"]
              },
              "context7": {
                "command": "npx",
                "args": ["-y", "@upstash/context7-mcp"]
              }
            }
          }
          EOF

      - name: Auth gh
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: gh auth status

      - name: Write ephemeral config.ini (runner temp)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"

          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          RELEASE_ISSUE_NUMBER=${{ vars.RELEASE_ISSUE_NUMBER }}
          EOF

          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"
          echo "Wrote ephemeral config at $CFG"

      - name: Verify config loads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          bash -lc '
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            echo "config ok: $REPO_OWNER/$REPO_NAME project $PROJECT_OWNER#$PROJECT_NUMBER release=$RELEASE_BRANCH"
          '

      - name: Verify issue is assigned to developer-agent (comment trigger only)
        if: github.event_name == 'issue_comment'
        id: verify_assignment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number
            });
            const devAgent = '${{ vars.DEV_AGENT }}';
            const isAssigned = issue.data.assignees.some(a => a.login === devAgent);
            // #3689: this is a policy gate, not an infra/implementation
            // failure -- gate_stopped lets the Phase 0 self-heal entry
            // point (and the post-verification-failure comment) tell the
            // difference and skip themselves instead of misfiring (observed
            // on this very issue: run 31320486307 posted a misleading
            // "Failed after 3 attempts" comment and then ran a full Phase 3
            // Claude diagnosis for a plain "not assigned yet" gate).
            core.setOutput('gate_stopped', isAssigned ? 'false' : 'true');
            if (!isAssigned) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `❌ **Developer Agent**: Cannot retry - issue is not assigned to @${devAgent}`
              });
              core.setFailed(`Issue not assigned to ${devAgent}`);
            }

      - name: Post workflow start comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const isRetry = '${{ github.event_name }}' === 'issue_comment';
            const repo = '${{ github.repository }}';
            const runId = '${{ github.run_id }}';
            const message = isRetry
              ? `🔄 **Developer Agent**: Retry requested. Restarting implementation...\n\n` +
                `Verifying issue status...\n\n[View workflow run](https://github.com/${repo}/actions/runs/${runId})`
              : `🤖 **Developer Agent**: Auto-implementation workflow triggered.\n\n` +
                `Verifying issue status...\n\n[View workflow run](https://github.com/${repo}/actions/runs/${runId})`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: message
            });

      - name: Verify issue is In Progress in ProjectV2 (otherwise exit)
        id: verify_status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # #3689: the previous version of this check ran inside a nested
          # `bash -lc '...'` subshell and called `exit 0` from there to stop
          # the workflow when the issue wasn't In Progress. That `exit 0`
          # only ended the nested subshell -- it never propagated to this
          # (outer) script, which fell through to `echo "::endgroup::"` and
          # reported success, so every later step still ran regardless of
          # status. Root cause of the incident this issue tracks: flipping
          # #3687 out of In Progress at 14:39:55 did NOT stop
          # RETRY_IMPLEMENTATION-triggered runs from proceeding to "Check if
          # PR already exists" at 14:39:30->14:41, ~14:42, and 14:44:48.
          #
          # Fix: read the status inside a real command-substitution subshell
          # (whose exit code IS visible via $? to this script) and actually
          # fail the step when the gate should stop the run. Also uses the
          # `issue_status` helper (gh_project.sh) instead of re-implementing
          # a full paginated project-items scan inline -- issue->projectItems
          # is O(1) vs O(project size).
          echo "::group::Verifying issue #$ISSUE_NUMBER status"
          set +e
          STATUS_OUTPUT="$(
            set -euo pipefail
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            status="$(issue_status "$ISSUE_NUMBER")"
            if [[ -z "$status" ]]; then
              echo "::warning::Issue not found in project." >&2
              exit 3
            fi
            echo "::notice::Issue #$ISSUE_NUMBER status=$status" >&2
            if [[ "$status" != "$STATUS_IN_PROGRESS" ]]; then
              echo "::warning::Not In Progress (status=$status)." >&2
              exit 3
            fi
            echo "$status"
          )"
          RC=$?
          set -e
          echo "::endgroup::"

          if [[ $RC -eq 0 ]]; then
            echo "gate_stopped=false" >> "$GITHUB_OUTPUT"
          elif [[ $RC -eq 3 ]]; then
            echo "gate_stopped=true" >> "$GITHUB_OUTPUT"
            echo "::error::Issue #$ISSUE_NUMBER is not In Progress; stopping the workflow (manual circuit breaker engaged -- this is an intentional stop, not a failure requiring self-heal)."
            gh issue comment "$ISSUE_NUMBER" --body "⏹️ **Developer Agent**: Stopping -- issue is no longer In Progress in the project (or is not in the project). This run will not proceed past this check. If this was a manual circuit breaker, no action is needed; move the issue back to In Progress and comment \`RETRY_IMPLEMENTATION\` to resume." 2>/dev/null || true
            exit 1
          else
            # #3689 review: RC here is neither 0 (verified In Progress) nor
            # 3 (this check's own explicit "not in progress" signal) -- it's
            # a genuine check failure (e.g. require_gh_auth's auth error, or
            # issue_status's underlying GraphQL call erroring on a transient
            # API hiccup). Do NOT set gate_stopped=true: that would make the
            # downstream `failure() && gate_stopped != 'true'` self-heal
            # conditions treat this run as an intentional policy-gate stop
            # and skip themselves, silently letting the run proceed past
            # this step as if the In-Progress status had been verified when
            # it wasn't -- the exact fail-open bug this rewrite was meant to
            # close, just via a different trigger. Leave gate_stopped unset
            # and fail with the original exit code so the run is routed
            # into the normal self-heal chain (Phase 0-3) instead.
            echo "::error::Failed to verify issue #$ISSUE_NUMBER status (exit $RC) -- not a policy-gate stop; routing to self-heal."
            exit "$RC"
          fi

      - name: Check if PR already exists
        id: check_pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"

          # Check for existing PRs linked to this issue (including merged/closed
          # ones). Look for a PR with "Closes #ISSUE" in the body via the REST
          # Search API (its own rate pool, separate from GraphQL and core
          # REST) instead of paging every PR in the repo via gh pr list.
          FOUND_PR=$(gh api search/issues \
            --method GET \
            -f q="\"Closes #${ISSUE}\" in:body type:pr repo:${{ github.repository }}" \
            --jq '.items[0].number // empty')

          # The Search API index is not guaranteed to be immediately
          # consistent with a just-created/just-updated PR. Fall back to a
          # direct (authoritative, if heavier) REST list scan when the
          # search turns up nothing, so a lagging index can't cause a
          # duplicate PR to be created for this issue.
          if [[ -z "$FOUND_PR" ]]; then
            echo "::notice::Search API found no PR for issue #$ISSUE; falling back to a direct PR list scan"
            FOUND_PR=$(gh api "repos/${{ github.repository }}/pulls?state=all&per_page=100" --paginate \
              --jq ".[] | select(.body // \"\" | contains(\"Closes #${ISSUE}\")) | .number" \
              | head -1)
          fi

          if [[ -n "$FOUND_PR" ]]; then
            PR_JSON=$(gh api "repos/${{ github.repository }}/pulls/${FOUND_PR}")
            EXISTING_PR="$FOUND_PR"
            PR_STATE=$(echo "$PR_JSON" | jq -r 'if .merged then "MERGED" elif .state == "closed" then "CLOSED" else "OPEN" end')
            PR_BRANCH=$(echo "$PR_JSON" | jq -r '.head.ref')

            echo "pr_exists=true" >> "$GITHUB_OUTPUT"
            echo "existing_pr=$EXISTING_PR" >> "$GITHUB_OUTPUT"
            echo "pr_state=$PR_STATE" >> "$GITHUB_OUTPUT"
            echo "pr_branch=$PR_BRANCH" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$EXISTING_PR found for issue #$ISSUE (state: $PR_STATE, branch: $PR_BRANCH)"
          else
            echo "pr_exists=false" >> "$GITHUB_OUTPUT"
            echo "pr_state=" >> "$GITHUB_OUTPUT"
            echo "pr_branch=" >> "$GITHUB_OUTPUT"
            echo "::notice::No existing PR found for issue #$ISSUE"
          fi

      - name: Check for review comments (if PR exists and is OPEN)
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_pr.outputs.pr_state == 'OPEN'
        id: check_review
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.check_pr.outputs.existing_pr }}"

          # Check if there are CHANGES_REQUESTED reviews (not comments!)
          # Review agent posts actual GitHub PR Reviews with state CHANGES_REQUESTED.
          # --jq runs once per fetched page, not once over the combined
          # result set -- stream matching reviews across all pages first,
          # then slurp+last in a second jq pass (see AGENTS.md).
          REVIEW_COMMENT=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" --paginate --jq '
            .[] | select(.state == "CHANGES_REQUESTED")
          ' | jq -s -r '
            last | .body // ""
          ')

          # A PR that conflicts with its base also routes through the fix
          # path: review_accept_and_merge.sh dispatches an automated
          # conflict-resolution round here when an approved PR can't merge
          # because the base moved (previously this escalated straight to a
          # human). Without this clause, an approved-but-conflicted PR with
          # no CHANGES_REQUESTED history would fall into the implement path.
          # REST splits GraphQL's single MERGEABLE/CONFLICTING/UNKNOWN enum
          # into mergeable (bool/null) + mergeable_state -- re-derive it.
          MERGEABLE=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq \
            'if .mergeable == null then "UNKNOWN" elif .mergeable_state == "dirty" then "CONFLICTING" else "MERGEABLE" end')

          if [[ -n "$REVIEW_COMMENT" || "$MERGEABLE" == "CONFLICTING" ]]; then
            echo "has_review_issues=true" >> "$GITHUB_OUTPUT"
            if [[ "$MERGEABLE" == "CONFLICTING" ]]; then
              echo "::notice::PR conflicts with its base branch - will resolve"
            else
              echo "::notice::PR has CHANGES_REQUESTED review - will fix issues"
            fi
          else
            echo "has_review_issues=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR has no pending review changes - skipping"
          fi

      - name: Detect acceptance failure (merged PR with bug)
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_pr.outputs.pr_state == 'MERGED'
        id: acceptance_failure
        shell: bash
        run: |
          MERGED_PR="${{ steps.check_pr.outputs.existing_pr }}"
          echo "::notice::Acceptance failure - PR #$MERGED_PR was merged but issue was reopened"

      - name: Post acceptance failure start comment
        if: steps.acceptance_failure.conclusion == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const merged_pr = '${{ steps.check_pr.outputs.existing_pr }}';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `🔧 **Developer Agent**: Acceptance failure detected\n\n` +
                    `PR #${merged_pr} was merged but a bug was found. Starting fix...\n\n` +
                    `Claude will:\n` +
                    `- Create a new fix branch\n` +
                    `- Fix the reported issue\n` +
                    `- Run all tests\n` +
                    `- Create a new PR for the fix\n\n` +
                    `[View workflow logs](${repoUrl}/actions/runs/${context.runId})`
            });

      - name: Run Claude Code to fix acceptance failure
        if: steps.acceptance_failure.conclusion == 'success'
        id: claude_acceptance_fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          track_progress: true
          show_full_output: true
          claude_args: >-
            --model claude-opus-5
            --allowed-tools "Bash,Read,Write,Edit,Glob,Grep"
            --mcp-config ${{ runner.temp }}/mcp-config.json
          prompt: |
            **Workflow-files exception (this repo's configuration):** git in this
            run authenticates with a PAT carrying the `workflow` scope, NOT the
            GitHub App installation token. You MAY create and modify files under
            `.github/workflows/` and push them. The default claude-code-action
            guidance claiming workflow modifications are not allowed does not
            apply here -- do not refuse or stop on that basis.

            Fix the acceptance failure for issue #${{ github.event.issue.number }}.

            **Context:**
            - Original PR #${{ steps.check_pr.outputs.existing_pr }} was merged
            - A bug was found after merge and the issue was reopened by the human owner

            **Instructions:**

            ### Step 1: Create a fix branch
            Run this command to create the branch using the standard naming convention:
            ```bash
            ./scripts/agents/developer_create_branch.sh ${{ github.event.issue.number }} fix auto
            ```

            The script handles both creating a new branch and reusing an existing one.
            If it fails, diagnose and fix the problem yourself — do NOT wait for intervention.

            ### Step 2: Understand and fix the problem
            1. Read the full issue #${{ github.event.issue.number }} including all comments
            2. The human owner has left a comment explaining what is broken — read it carefully
            3. Implement the minimal fix to resolve the reported problem
            4. Add/update tests to cover the fixed scenario

            ### Step 3: Validate before committing
            BEFORE committing, run ALL validation checks (ALL must pass):
            - black --check . (if fails: black . then re-check)
            - ruff check src/ tests/ (0 errors required)
            - mypy src/ (0 errors required)
            - pytest tests/unit/ -v (0 failures, 0 errors required)
            - cd web && npm run type-check (if web files modified)
            - ./scripts/agents/validate-web-routes.sh (if API endpoints added)

            If any check fails: fix and re-run ALL checks (up to 3 attempts)

            ### Step 4: Commit and push
            Commit: "fix: address acceptance failure (#${{ github.event.issue.number }})"

            **CRITICAL**:
            - Handle ALL infrastructure errors yourself (branch checkout, git operations)
            - Do NOT commit until ALL checks pass with 0 errors/failures
            - Do NOT use any `gh` CLI commands - no `gh issue`, `gh pr`, etc.
            - Do NOT close issues, create PRs, or edit issues/PRs in any way
            - The workflow manages all GitHub state (issues, PRs, status)

      - name: Save review comments to file (if review issues found)
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_review.outputs.has_review_issues == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          PR="${{ steps.check_pr.outputs.existing_pr }}"
          # Get the latest CHANGES_REQUESTED review (not comment).
          # --jq runs once per fetched page -- stream matching reviews
          # across all pages first, then slurp+last (see AGENTS.md).
          gh api "repos/${{ github.repository }}/pulls/$PR/reviews" --paginate \
            --jq '.[] | select(.state == "CHANGES_REQUESTED")' \
            | jq -s -r 'last | .body' \
            > /tmp/review-comments.txt
          echo "Saved review feedback to /tmp/review-comments.txt"

          # Extract structured critical_issues from hidden review comment if available.
          # Same per-page --jq pitfall as above -- stream, then slurp+last.
          STRUCTURED_COMMENT=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- nyxgpt-structured-review:"))' \
            | jq -s -r 'last | .body // ""')
          if [[ -n "$STRUCTURED_COMMENT" ]]; then
            CRITICAL_ISSUES=$(echo "$STRUCTURED_COMMENT" \
              | sed 's/<!-- nyxgpt-structured-review: //' \
              | sed 's/ -->//' \
              | jq -r '.critical_issues[]? // empty' 2>/dev/null || true)
            if [[ -n "$CRITICAL_ISSUES" ]]; then
              echo "=== STRUCTURED CRITICAL ISSUES ===" > /tmp/critical-issues.txt
              echo "$CRITICAL_ISSUES" >> /tmp/critical-issues.txt
              echo "Extracted $(echo "$CRITICAL_ISSUES" | wc -l | tr -d ' ') critical issues from structured output"
            fi
          fi

      - name: Post review fix start comment (if review issues found)
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_review.outputs.has_review_issues == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const pr_number = '${{ steps.check_pr.outputs.existing_pr }}';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `🔧 **Developer Agent**: Fixing review issues for PR #${pr_number}\n\n` +
                    `🤖 Starting Claude Code to address review comments...\n\n` +
                    `Claude will:\n` +
                    `- Read the review comments from PR #${pr_number}\n` +
                    `- Implement the requested fixes\n` +
                    `- Run all tests (3-try loop to fix any failures)\n` +
                    `- Commit and push fixes\n\n` +
                    `[View workflow logs](${repoUrl}/actions/runs/${context.runId})`
            });

      - name: Post PR exists notice (if no review issues and not merged)
        if: |
          steps.check_pr.outputs.pr_exists == 'true' &&
          steps.check_pr.outputs.pr_state == 'OPEN' &&
          steps.check_review.outputs.has_review_issues == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const pr_number = '${{ steps.check_pr.outputs.existing_pr }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `✅ **Developer Agent**: PR #${pr_number} already exists and ` +
                    `has no review issues.\n\nSkipping implementation step.`
            });

      - name: Run Claude Code to fix review issues (Review Fix)
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_review.outputs.has_review_issues == 'true'
        id: claude_review_fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          track_progress: true
          show_full_output: true
          claude_args: >-
            --model claude-opus-5
            --allowed-tools "Bash,Read,Write,Edit,Glob,Grep"
            --mcp-config ${{ runner.temp }}/mcp-config.json
          prompt: |
            **Workflow-files exception (this repo's configuration):** git in this
            run authenticates with a PAT carrying the `workflow` scope, NOT the
            GitHub App installation token. You MAY create and modify files under
            `.github/workflows/` and push them. The default claude-code-action
            guidance claiming workflow modifications are not allowed does not
            apply here -- do not refuse or stop on that basis.

            Fix the code review issues for issue #${{ github.event.issue.number }}.

            **Context:**
            - PR exists: #${{ steps.check_pr.outputs.existing_pr }}
            - Code review requested changes

            **Instructions:**

            ### Step 1: Ensure you're on the correct branch
            First, determine which branch this PR is from:
            ```bash
            gh api repos/${{ github.repository }}/pulls/${{ steps.check_pr.outputs.existing_pr }} --jq .head.ref
            ```

            Then check it out. If checkout fails (branch doesn't exist locally, ref issues, etc.):
            - Diagnose the problem (read error message)
            - Fix it yourself (fetch, clean stale refs, recreate if needed)
            - Do NOT wait for human intervention

            ### Step 1.5: Check for a huddle decision (#3687)
            Check whether a comment containing `HUDDLE_DECISION:` exists on this PR
            (`gh pr view ${{ steps.check_pr.outputs.existing_pr }} --comments`). If one
            does, this fix cycle is executing the *agreed* plan from a review huddle,
            not an independent decision:
            - `HUDDLE_DECISION: proceed` -- fix per the review's stated issues as usual.
            - `HUDDLE_DECISION: change-approach` -- follow the specific different
              approach stated in that comment's "What happens next" section, not the
              original approach.
            - `HUDDLE_DECISION: descope` -- perform the specific descope stated in
              that comment (e.g. delete a named flaky test, split off a follow-up
              issue) rather than continuing to chase the original ask as-is.
            - `HUDDLE_DECISION: escalate` -- do not attempt a fix; this cycle should
              not normally run at all when escalate was chosen (the issue goes to the
              owner instead), so if you see this, stop and note it in your summary
              rather than pushing a speculative fix.
            If no `HUDDLE_DECISION:` comment exists, this is an ordinary review-fix
            cycle -- proceed as below.

            ### Step 2: Fix review issues
            1. Read the issues to fix:
               - If /tmp/critical-issues.txt exists, these are the exact blocking issues (structured list — start here)
               - Read /tmp/review-comments.txt for full review context and medium/minor issues
            2. Use sequential-thinking to plan your fixes before touching any code:
               - List every Critical and Medium issue
               - For each: identify the root cause, plan the fix, and anticipate side effects
               - Confirm your plan covers all issues before writing a single line
            3. Implement fixes for each issue

            ### Step 2.5: Resolve merge conflicts with the release branch (if any)
            Check mergeability: `gh api repos/${{ github.repository }}/pulls/${{ steps.check_pr.outputs.existing_pr }} --jq 'if .mergeable == null then "UNKNOWN" elif .mergeable_state == "dirty" then "CONFLICTING" else "MERGEABLE" end'`
            If it reports CONFLICTING (or a conflict-resolution comment on the
            PR/issue requests it):
            - `git fetch origin` and merge `origin/${{ vars.RELEASE_BRANCH }}` into the PR branch
            - Resolve every conflict preserving BOTH sides' intents: this PR's
              feature content AND everything merged into the release branch
              since (never discard either side wholesale)
            - This can be the round's only work: if the review findings were
              already addressed by earlier commits and only conflicts remain,
              resolve the conflicts, validate, and push the merge commit

            ### Step 3: Validate before committing
            BEFORE committing, run ALL validation checks (ALL must pass):
            - black --check . (if fails: black . then re-check)
            - ruff check src/ tests/ (0 errors required)
            - mypy src/ (0 errors required)
            - pytest tests/unit/ -v (0 failures, 0 errors required)
            - cd web && npm run type-check (if web files modified)
            - ./scripts/agents/validate-web-routes.sh (if API endpoints added)

            If any check fails: fix and re-run ALL checks (up to 3 attempts)

            ### Step 4: Commit and push
            Commit: "fix: address code review findings (#${{ github.event.issue.number }})"

            **CRITICAL**:
            - Handle ALL infrastructure errors yourself (branch checkout, git operations)
            - Do NOT commit until ALL checks pass with 0 errors/failures
            - Do NOT use any `gh` CLI commands - no `gh issue`, `gh pr`, etc.
            - Do NOT close issues, create PRs, or edit issues/PRs in any way
            - The workflow manages all GitHub state (issues, PRs, status)

      - name: Ensure review fixes landed on PR branch
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_review.outputs.has_review_issues == 'true' && steps.claude_review_fix.conclusion == 'success'
        shell: bash
        env:
          PR_BRANCH: ${{ steps.check_pr.outputs.pr_branch }}
        run: |
          set -euo pipefail
          # claude-code-action in issue context can create its own
          # claude/issue-N-<timestamp> branch instead of committing to the PR head
          # branch (this wedged PR #3145: three identical reviews of an unchanged
          # PR while correct fixes landed on stray branches). Deterministically
          # sync whatever branch Claude pushed onto the PR branch so the review
          # loop converges.
          git fetch origin --prune
          CURRENT="$(git branch --show-current || true)"
          if [ -z "$CURRENT" ]; then
            echo "::warning::Detached HEAD after review fix; cannot determine work branch. Manual check needed."
            exit 0
          fi
          if [ "$CURRENT" = "$PR_BRANCH" ]; then
            echo "Fixes are on the PR branch ($PR_BRANCH); nothing to sync."
            exit 0
          fi
          # Safety: only sync when Claude actually committed new work. A
          # fresh action branch with no commits beyond the release branch
          # must never be force-pushed over the PR branch (it would destroy
          # the PR's commits).
          if [ -z "$(git rev-list "origin/${{ vars.RELEASE_BRANCH }}..HEAD" 2>/dev/null)" ]; then
            echo "No new commits beyond ${{ vars.RELEASE_BRANCH }} on $CURRENT; nothing to sync."
            exit 0
          fi
          if git diff --quiet "origin/$PR_BRANCH" "$CURRENT" 2>/dev/null; then
            echo "Stray branch $CURRENT matches PR branch content; cleaning up stray branch only."
          else
            echo "Syncing $CURRENT -> $PR_BRANCH (force: review fix supersedes stale PR tip)"
            git push --force origin "HEAD:refs/heads/$PR_BRANCH"
          fi
          git push origin --delete "$CURRENT" || echo "Could not delete stray branch $CURRENT (non-fatal)"

      - name: Post implementation start comment
        if: steps.check_pr.outputs.pr_exists == 'false'
