name: Developer Agent Auto-Implement

on:
  issues:
    types: [assigned]

jobs:
  implement:
    # Triggers on assignment to DEV_AGENT
    # Developer agent reads issue history to determine if this is new work or a retry
    # Status verification will exit early if not "In Progress"
    if: >-
      ${{ vars.AGENTS_ENABLED == 'true'
          && github.event.assignee.login == vars.DEV_AGENT }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0
          # Push with the developer agent's PAT instead of the default
          # GITHUB_TOKEN: the default token can never create/update files
          # under .github/workflows/ (hard platform restriction, surfaced
          # on PR #3172), and PAT pushes are attributed to
          # myGPT-developer-agent per the identity policy. The PAT must
          # have the "workflow" scope for workflow-file changes to push.
          token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}

      - name: Configure git identity
        run: |
          git config --global user.name "myGPT-developer-agent"
          git config --global user.email "253622687+myGPT-developer-agent@users.noreply.github.com"

      - name: Write MCP config
        run: |
          cat > $RUNNER_TEMP/mcp-config.json <<'EOF'
          {
            "mcpServers": {
              "sequential-thinking": {
                "command": "npx",
                "args": ["-y", "@modelcontextprotocol/server-sequential-thinking"]
              },
              "context7": {
                "command": "npx",
                "args": ["-y", "@upstash/context7-mcp"]
              }
            }
          }
          EOF

      - name: Auth gh
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: gh auth status

      - name: Write ephemeral config.ini (runner temp)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"

          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF

          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"
          echo "Wrote ephemeral config at $CFG"

      - name: Verify config loads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          bash -lc '
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            echo "config ok: $REPO_OWNER/$REPO_NAME project $PROJECT_OWNER#$PROJECT_NUMBER release=$RELEASE_BRANCH"
          '

      - name: Verify issue is assigned to developer-agent (comment trigger only)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number
            });
            const devAgent = '${{ vars.DEV_AGENT }}';
            const isAssigned = issue.data.assignees.some(a => a.login === devAgent);
            if (!isAssigned) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `❌ **Developer Agent**: Cannot retry - issue is not assigned to @${devAgent}`
              });
              core.setFailed(`Issue not assigned to ${devAgent}`);
            }

      - name: Post workflow start comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const isRetry = '${{ github.event_name }}' === 'issue_comment';
            const repo = '${{ github.repository }}';
            const runId = '${{ github.run_id }}';
            const message = isRetry
              ? `🔄 **Developer Agent**: Retry requested. Restarting implementation...\n\n` +
                `Verifying issue status...\n\n[View workflow run](https://github.com/${repo}/actions/runs/${runId})`
              : `🤖 **Developer Agent**: Auto-implementation workflow triggered.\n\n` +
                `Verifying issue status...\n\n[View workflow run](https://github.com/${repo}/actions/runs/${runId})`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: message
            });

      - name: Verify issue is In Progress in ProjectV2 (otherwise exit)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          echo "::group::Verifying issue #$ISSUE_NUMBER status"
          bash -lc '
            set -euo pipefail
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth

            issue="$ISSUE_NUMBER"
            project_id="$(get_project_id)"

            q='\''query($project:ID!, $after:String){
              node(id:$project){
                ... on ProjectV2{
                  items(first:100, after:$after){
                    pageInfo{ hasNextPage endCursor }
                    nodes{
                      content{ __typename ... on Issue { number } }
                      fieldValues(first:50){
                        nodes{
                          __typename
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            field{ ... on ProjectV2SingleSelectField { name } }
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            }'\''

            after=""
            found=0
            while :; do
              resp="$(graphql "$q" -F project="$project_id" -F after="$after")"

              status="$(echo "$resp" | jq -r --argjson n "$issue" --arg f "$STATUS_FIELD" '\''
                .data.node.items.nodes[]
                | select(.content.__typename=="Issue" and .content.number==$n)
                | (.fieldValues.nodes[]
                    | select(.__typename=="ProjectV2ItemFieldSingleSelectValue" and .field.name==$f)
                    | .name) // empty
              '\'' | head -n 1)"

              if [[ -n "$status" ]]; then
                echo "::notice::Issue #$issue status=$status"
                if [[ "$status" != "$STATUS_IN_PROGRESS" ]]; then
                  echo "::warning::Not In Progress; exiting workflow."
                  exit 0
                fi
                found=1
                break
              fi

              has_next="$(echo "$resp" | jq -r ".data.node.items.pageInfo.hasNextPage")"
              cursor="$(echo "$resp" | jq -r ".data.node.items.pageInfo.endCursor // empty")"
              [[ "$has_next" == "true" && -n "$cursor" ]] || break
              after="$cursor"
            done

            if [[ "$found" != "1" ]]; then
              echo "::warning::Issue not found in project; exiting workflow."
              exit 0
            fi
          '
          echo "::endgroup::"

      - name: Check if PR already exists
        id: check_pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"

          # Check for existing PRs linked to this issue (including merged/closed ones)
          # Look for PRs that have "Closes #ISSUE" in the body
          PR_DATA=$(gh pr list --state all --json number,body,state,headRefName \
            --jq ".[] | select(.body | contains(\"Closes #${ISSUE}\")) | {number, state, headRefName}" \
            | head -1 || echo "")

          if [[ -n "$PR_DATA" ]]; then
            EXISTING_PR=$(echo "$PR_DATA" | jq -r '.number')
            PR_STATE=$(echo "$PR_DATA" | jq -r '.state')
            PR_BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')

            echo "pr_exists=true" >> "$GITHUB_OUTPUT"
            echo "existing_pr=$EXISTING_PR" >> "$GITHUB_OUTPUT"
            echo "pr_state=$PR_STATE" >> "$GITHUB_OUTPUT"
            echo "pr_branch=$PR_BRANCH" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$EXISTING_PR found for issue #$ISSUE (state: $PR_STATE, branch: $PR_BRANCH)"
          else
            echo "pr_exists=false" >> "$GITHUB_OUTPUT"
            echo "pr_state=" >> "$GITHUB_OUTPUT"
            echo "pr_branch=" >> "$GITHUB_OUTPUT"
            echo "::notice::No existing PR found for issue #$ISSUE"
          fi

      - name: Check for review comments (if PR exists and is OPEN)
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_pr.outputs.pr_state == 'OPEN'
        id: check_review
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.check_pr.outputs.existing_pr }}"

          # Check if there are CHANGES_REQUESTED reviews (not comments!)
          # Review agent posts actual GitHub PR Reviews with state CHANGES_REQUESTED
          REVIEW_COMMENT=$(gh pr view "$PR" --json reviews --jq '
            [.reviews[] |
             select(.state == "CHANGES_REQUESTED")] |
            last |
            .body // ""
          ')

          if [[ -n "$REVIEW_COMMENT" ]]; then
            echo "has_review_issues=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR has CHANGES_REQUESTED review - will fix issues"
          else
            echo "has_review_issues=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR has no pending review changes - skipping"
          fi

      - name: Detect acceptance failure (merged PR with bug)
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_pr.outputs.pr_state == 'MERGED'
        id: acceptance_failure
        shell: bash
        run: |
          MERGED_PR="${{ steps.check_pr.outputs.existing_pr }}"
          echo "::notice::Acceptance failure - PR #$MERGED_PR was merged but issue was reopened"

      - name: Post acceptance failure start comment
        if: steps.acceptance_failure.conclusion == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const merged_pr = '${{ steps.check_pr.outputs.existing_pr }}';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `🔧 **Developer Agent**: Acceptance failure detected\n\n` +
                    `PR #${merged_pr} was merged but a bug was found. Starting fix...\n\n` +
                    `Claude will:\n` +
                    `- Create a new fix branch\n` +
                    `- Fix the reported issue\n` +
                    `- Run all tests\n` +
                    `- Create a new PR for the fix\n\n` +
                    `[View workflow logs](${repoUrl}/actions/runs/${context.runId})`
            });

      - name: Run Claude Code to fix acceptance failure
        if: steps.acceptance_failure.conclusion == 'success'
        id: claude_acceptance_fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          track_progress: true
          show_full_output: true
          claude_args: >-
            --allowed-tools "Bash,Read,Write,Edit,Glob,Grep"
            --model claude-fable-5
            --mcp-config ${{ runner.temp }}/mcp-config.json
          prompt: |
            Fix the acceptance failure for issue #${{ github.event.issue.number }}.

            **Context:**
            - Original PR #${{ steps.check_pr.outputs.existing_pr }} was merged
            - A bug was found after merge and the issue was reopened by the human owner

            **Instructions:**

            ### Step 1: Create a fix branch
            Run this command to create the branch using the standard naming convention:
            ```bash
            ./scripts/agents/developer_create_branch.sh ${{ github.event.issue.number }} fix auto
            ```

            The script handles both creating a new branch and reusing an existing one.
            If it fails, diagnose and fix the problem yourself — do NOT wait for intervention.

            ### Step 2: Understand and fix the problem
            1. Read the full issue #${{ github.event.issue.number }} including all comments
            2. The human owner has left a comment explaining what is broken — read it carefully
            3. Implement the minimal fix to resolve the reported problem
            4. Add/update tests to cover the fixed scenario

            ### Step 3: Validate before committing
            BEFORE committing, run ALL validation checks (ALL must pass):
            - black --check . (if fails: black . then re-check)
            - ruff check src/ tests/ (0 errors required)
            - mypy src/ (0 errors required)
            - pytest tests/unit/ -v (0 failures, 0 errors required)
            - cd web && npm run type-check (if web files modified)
            - ./scripts/agents/validate-web-routes.sh (if API endpoints added)

            If any check fails: fix and re-run ALL checks (up to 3 attempts)

            ### Step 4: Commit and push
            Commit: "fix: address acceptance failure (#${{ github.event.issue.number }})"

            **CRITICAL**:
            - Handle ALL infrastructure errors yourself (branch checkout, git operations)
            - Do NOT commit until ALL checks pass with 0 errors/failures
            - Do NOT use any `gh` CLI commands - no `gh issue`, `gh pr`, etc.
            - Do NOT close issues, create PRs, or edit issues/PRs in any way
            - The workflow manages all GitHub state (issues, PRs, status)

      - name: Save review comments to file (if review issues found)
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_review.outputs.has_review_issues == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          PR="${{ steps.check_pr.outputs.existing_pr }}"
          # Get the latest CHANGES_REQUESTED review (not comment)
          gh pr view "$PR" --json reviews \
            --jq '[.reviews[] | select(.state == "CHANGES_REQUESTED")] | last | .body' \
            > /tmp/review-comments.txt
          echo "Saved review feedback to /tmp/review-comments.txt"

          # Extract structured critical_issues from hidden review comment if available
          STRUCTURED_COMMENT=$(gh pr view "$PR" --json comments \
            --jq '[.comments[] | select(.body | startswith("<!-- nyxgpt-structured-review:"))] | last | .body // ""')
          if [[ -n "$STRUCTURED_COMMENT" ]]; then
            CRITICAL_ISSUES=$(echo "$STRUCTURED_COMMENT" \
              | sed 's/<!-- nyxgpt-structured-review: //' \
              | sed 's/ -->//' \
              | jq -r '.critical_issues[]? // empty' 2>/dev/null || true)
            if [[ -n "$CRITICAL_ISSUES" ]]; then
              echo "=== STRUCTURED CRITICAL ISSUES ===" > /tmp/critical-issues.txt
              echo "$CRITICAL_ISSUES" >> /tmp/critical-issues.txt
              echo "Extracted $(echo "$CRITICAL_ISSUES" | wc -l | tr -d ' ') critical issues from structured output"
            fi
          fi

      - name: Post review fix start comment (if review issues found)
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_review.outputs.has_review_issues == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const pr_number = '${{ steps.check_pr.outputs.existing_pr }}';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `🔧 **Developer Agent**: Fixing review issues for PR #${pr_number}\n\n` +
                    `🤖 Starting Claude Code to address review comments...\n\n` +
                    `Claude will:\n` +
                    `- Read the review comments from PR #${pr_number}\n` +
                    `- Implement the requested fixes\n` +
                    `- Run all tests (3-try loop to fix any failures)\n` +
                    `- Commit and push fixes\n\n` +
                    `[View workflow logs](${repoUrl}/actions/runs/${context.runId})`
            });

      - name: Post PR exists notice (if no review issues and not merged)
        if: |
          steps.check_pr.outputs.pr_exists == 'true' &&
          steps.check_pr.outputs.pr_state == 'OPEN' &&
          steps.check_review.outputs.has_review_issues == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const pr_number = '${{ steps.check_pr.outputs.existing_pr }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `✅ **Developer Agent**: PR #${pr_number} already exists and ` +
                    `has no review issues.\n\nSkipping implementation step.`
            });

      - name: Run Claude Code to fix review issues (Review Fix)
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_review.outputs.has_review_issues == 'true'
        id: claude_review_fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          track_progress: true
          show_full_output: true
          claude_args: >-
            --allowed-tools "Bash,Read,Write,Edit,Glob,Grep"
            --model claude-fable-5
            --mcp-config ${{ runner.temp }}/mcp-config.json
          prompt: |
            Fix the code review issues for issue #${{ github.event.issue.number }}.

            **Context:**
            - PR exists: #${{ steps.check_pr.outputs.existing_pr }}
            - Code review requested changes

            **Instructions:**

            ### Step 1: Ensure you're on the correct branch
            First, determine which branch this PR is from:
            ```bash
            gh pr view ${{ steps.check_pr.outputs.existing_pr }} --json headRefName -q .headRefName
            ```

            Then check it out. If checkout fails (branch doesn't exist locally, ref issues, etc.):
            - Diagnose the problem (read error message)
            - Fix it yourself (fetch, clean stale refs, recreate if needed)
            - Do NOT wait for human intervention

            ### Step 2: Fix review issues
            1. Read the issues to fix:
               - If /tmp/critical-issues.txt exists, these are the exact blocking issues (structured list — start here)
               - Read /tmp/review-comments.txt for full review context and medium/minor issues
            2. Use sequential-thinking to plan your fixes before touching any code:
               - List every Critical and Medium issue
               - For each: identify the root cause, plan the fix, and anticipate side effects
               - Confirm your plan covers all issues before writing a single line
            3. Implement fixes for each issue

            ### Step 3: Validate before committing
            BEFORE committing, run ALL validation checks (ALL must pass):
            - black --check . (if fails: black . then re-check)
            - ruff check src/ tests/ (0 errors required)
            - mypy src/ (0 errors required)
            - pytest tests/unit/ -v (0 failures, 0 errors required)
            - cd web && npm run type-check (if web files modified)
            - ./scripts/agents/validate-web-routes.sh (if API endpoints added)

            If any check fails: fix and re-run ALL checks (up to 3 attempts)

            ### Step 4: Commit and push
            Commit: "fix: address code review findings (#${{ github.event.issue.number }})"

            **CRITICAL**:
            - Handle ALL infrastructure errors yourself (branch checkout, git operations)
            - Do NOT commit until ALL checks pass with 0 errors/failures
            - Do NOT use any `gh` CLI commands - no `gh issue`, `gh pr`, etc.
            - Do NOT close issues, create PRs, or edit issues/PRs in any way
            - The workflow manages all GitHub state (issues, PRs, status)

      - name: Ensure review fixes landed on PR branch
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_review.outputs.has_review_issues == 'true' && steps.claude_review_fix.conclusion == 'success'
        shell: bash
        env:
          PR_BRANCH: ${{ steps.check_pr.outputs.pr_branch }}
        run: |
          set -euo pipefail
          # claude-code-action in issue context can create its own
          # claude/issue-N-<timestamp> branch instead of committing to the PR head
          # branch (this wedged PR #3145: three identical reviews of an unchanged
          # PR while correct fixes landed on stray branches). Deterministically
          # sync whatever branch Claude pushed onto the PR branch so the review
          # loop converges.
          git fetch origin --prune
          CURRENT="$(git branch --show-current || true)"
          if [ -z "$CURRENT" ]; then
            echo "::warning::Detached HEAD after review fix; cannot determine work branch. Manual check needed."
            exit 0
          fi
          if [ "$CURRENT" = "$PR_BRANCH" ]; then
            echo "Fixes are on the PR branch ($PR_BRANCH); nothing to sync."
            exit 0
          fi
          # Safety: only sync when Claude actually committed new work. A
          # fresh action branch with no commits beyond the release branch
          # must never be force-pushed over the PR branch (it would destroy
          # the PR's commits).
          if [ -z "$(git rev-list "origin/${{ vars.RELEASE_BRANCH }}..HEAD" 2>/dev/null)" ]; then
            echo "No new commits beyond ${{ vars.RELEASE_BRANCH }} on $CURRENT; nothing to sync."
            exit 0
          fi
          if git diff --quiet "origin/$PR_BRANCH" "$CURRENT" 2>/dev/null; then
            echo "Stray branch $CURRENT matches PR branch content; cleaning up stray branch only."
          else
            echo "Syncing $CURRENT -> $PR_BRANCH (force: review fix supersedes stale PR tip)"
            git push --force origin "HEAD:refs/heads/$PR_BRANCH"
          fi
          git push origin --delete "$CURRENT" || echo "Could not delete stray branch $CURRENT (non-fatal)"

      - name: Post implementation start comment
        if: steps.check_pr.outputs.pr_exists == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `🤖 **Developer Agent**: Starting implementation...\n\n` +
                    `This may take several minutes. Claude will:\n` +
                    `- Create/checkout feature branch\n` +
                    `- Analyze the issue requirements\n` +
                    `- Implement the solution\n` +
                    `- Add/update tests\n` +
                    `- Run the test suite\n` +
                    `- Commit changes\n\n` +
                    `You can watch progress in the ` +
                    `[workflow logs](https://github.com/${context.repo.owner}/` +
                    `${context.repo.repo}/actions/runs/${context.runId}).`
            });

      - name: Run Claude Code to implement issue (Initial)
        if: steps.check_pr.outputs.pr_exists == 'false'
        id: claude_initial
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          track_progress: true
          show_full_output: true
          claude_args: >-
            --allowed-tools "Bash,Read,Write,Edit,Glob,Grep"
            --model claude-fable-5
            --mcp-config ${{ runner.temp }}/mcp-config.json
          prompt: |
            Implement issue #${{ github.event.issue.number }}.

            ## Step 1: Create/Checkout Feature Branch

            Run this command to create the feature branch:
            ```bash
            ./scripts/agents/developer_create_branch.sh ${{ github.event.issue.number }} feat auto
            ```

            This will create a branch like `feat/ISSUE-slug` and check it out.

            **If the command fails:**
            - Read the error message carefully
            - Diagnose the problem (branch exists? fetch failed? permissions? git state?)
            - Fix it yourself using appropriate git commands
            - Examples of fixes you might need:
              - If branch exists remotely but checkout fails:
                `git fetch origin BRANCH && git checkout -b BRANCH origin/BRANCH`
              - If stale refs: `git remote prune origin`
              - If local branch conflicts: `git branch -D BRANCH` then retry
              - If script has a bug: read the script, fix it, then retry
            - Do NOT wait for human intervention - you are responsible for handling this

            Once you have successfully checked out the feature branch, proceed to implementation.

            ## Step 2: Implement the Solution

            **Before writing any code**, if your implementation touches an external library
            (FastAPI, SQLAlchemy, Pydantic, httpx, etc.), use context7 to fetch current docs:
            1. Call `resolve-library-id` with the library name to get its context7 ID
            2. Call `get-library-docs` to retrieve the relevant module/API docs
            This ensures you use current APIs rather than outdated patterns from training data.

            Requirements:
            - Make the minimal correct change to resolve the issue.
            - Add/update tests for ALL code changes.

            ## Step 3: Mandatory Validation Before Commit

            You MUST run ALL of the following checks and ensure they ALL PASS before committing:

              1. **Code Formatting (ALWAYS RUN)**:
                 - Run: black --check .
                 - If it fails, run: black . (to auto-format)
                 - Re-check: black --check . (must pass)

              2. **Linting (ALWAYS RUN)**:
                 - Run: ruff check src/ tests/
                 - Fix ALL linting errors before proceeding
                 - Must show 0 errors

              3. **Type Checking (ALWAYS RUN)**:
                 - Run: mypy src/
                 - Fix ALL type errors before proceeding
                 - Must show 0 errors

              4. **Tests (ALWAYS RUN)**:
                 - Run: pytest -v
                 - ALL tests MUST PASS (0 failures, 0 errors)
                 - If ANY test fails: analyze, fix, re-run
                 - Verify output shows "passed" with no "FAILED" or "ERROR"

              5. **TypeScript (if you modified web/ files)**:
                 - Run: cd web && npm run type-check
                 - Fix any TypeScript errors before committing

              6. **Route Validation (if you added backend API endpoints)**:
                 - Run: ./scripts/agents/validate-web-routes.sh
                 - Fix any missing routes before committing

              **CRITICAL**: Do NOT commit until ALL checks pass. Run checks in a loop:
              - Try to fix issues up to 3 times
              - If still failing after 3 attempts, report what's blocking you
            - **MANDATORY DOCUMENTATION**: Update documentation for ALL user-facing changes:
              * If you modify src/nyxgpt/api.py or src/nyxgpt/app.py → Update docs/api.md
              * If you modify src/nyxgpt/cli.py → Update docs/configuration.md or README.md CLI section
              * If you add/change config options → Update example.config.ini AND docs/configuration.md
              * If you add new features → Update README.md feature list
              * For ANY code change, check if docs/ files need updates
            - Commit changes with clear messages that MUST include issue references.

            CRITICAL COMMIT MESSAGE FORMAT:
            All commit messages MUST reference issue numbers using this format:

            Format:
            "<type>: <description> (#${{ github.event.issue.number }})"

            Examples:
            - "feat: add user authentication (#${{ github.event.issue.number }})"
            - "fix: resolve null pointer in validator (#${{ github.event.issue.number }})"
            - "test: add integration tests per review (#${{ github.event.issue.number }})"
            - "docs: update API documentation (#${{ github.event.issue.number }})"

            Valid commit types: feat, fix, test, docs, refactor, chore

            **CRITICAL PROHIBITIONS:**
            - Do NOT use any `gh` CLI commands - no `gh issue`, `gh pr`, `gh api`, etc.
            - Do NOT close issues, create PRs, or edit issues/PRs in any way
            - The workflow manages all GitHub state (issues, PRs, status, assignments)

            Output: commit(s) pushed to the current branch with proper issue references.

            **COMMIT INCREMENTALLY**: commit and push after EACH completed component
            (backend module, endpoints, CLI, UI page, tests, docs) — do NOT save all
            committing for the end. If your session hits its turn/time limit,
            uncommitted work is lost with the runner. The workflow snapshots leftover
            changes as a safety net, but deliberate incremental commits with real
            messages are strongly preferred.

      - name: Check Claude progress completion
        id: check_progress
        if: |
          always() &&
          (steps.claude_initial.conclusion == 'success' ||
           steps.claude_review_fix.conclusion == 'success' ||
           steps.claude_acceptance_fix.conclusion == 'success')
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          ISSUE="${{ github.event.issue.number }}"
          # Find the most recent progress comment posted by track_progress
          PROGRESS_BODY=$(gh issue view "$ISSUE" --json comments \
            --jq '[.comments[] | select(.body | test("- \\[[ x]\\]"))] | last | .body // ""')
          if [[ -n "$PROGRESS_BODY" ]]; then
            TOTAL=$(echo "$PROGRESS_BODY" | grep -cE -- "- \[[ x]\]" || true)
            DONE=$(echo "$PROGRESS_BODY" | grep -cE -- "- \[x\]" || true)
            PENDING=$(( TOTAL - DONE ))
            echo "progress_total=$TOTAL" >> "$GITHUB_OUTPUT"
            echo "progress_done=$DONE" >> "$GITHUB_OUTPUT"
            echo "Progress: $DONE/$TOTAL items completed"
            if [[ $PENDING -gt 0 ]]; then
              echo "::warning::$PENDING of $TOTAL planned tasks not marked complete in progress comment"
              echo "progress_complete=false" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::All $TOTAL planned tasks completed"
              echo "progress_complete=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No progress comment with checkboxes found"
            echo "progress_complete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post implementation complete comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const progressComplete = '${{ steps.check_progress.outputs.progress_complete }}';
            const progressDone = '${{ steps.check_progress.outputs.progress_done }}';
            const progressTotal = '${{ steps.check_progress.outputs.progress_total }}';
            const progressSuffix = progressTotal
              ? ` (${progressDone}/${progressTotal} tasks completed)`
              : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: '✅ **Developer Agent**: Implementation complete. Running verification checks...' + progressSuffix
            });

      - name: Snapshot uncommitted implementation work
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Long implementations can hit the Claude step's turn/time limit
          # before committing (observed: run 29256847864 lost a complete,
          # verified canary backend that was never committed). Snapshot any
          # uncommitted work so verification, PR submission, and the review
          # cycle proceed on it — partial work then converges via review-fix
          # cycles instead of evaporating with the runner.
          BRANCH="$(git branch --show-current || true)"
          [ -z "$BRANCH" ] && { echo "Detached HEAD; nothing to snapshot."; exit 0; }
          [ "$BRANCH" = "${{ vars.RELEASE_BRANCH }}" ] && { echo "On release branch; nothing to snapshot."; exit 0; }

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "wip: snapshot uncommitted implementation work (#${{ github.event.issue.number }})" \
              -m "Auto-committed by the workflow: the implementation step ended with uncommitted changes (e.g. the Claude step hit its turn/time limit before committing). Verification and review proceed on this snapshot; gaps are completed in review-fix cycles."
            echo "::warning::Snapshot-committed uncommitted implementation work on $BRANCH"
          fi

          # Make sure the branch (and any local-only commits) reach origin so
          # PR submission has a ref to target.
          if ! git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git push -u origin "$BRANCH"
            echo "::notice::Pushed new branch $BRANCH to origin"
          elif [ -n "$(git rev-list "origin/$BRANCH..HEAD" 2>/dev/null)" ]; then
            git push origin "$BRANCH"
            echo "::notice::Pushed local-only commits on $BRANCH to origin"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        working-directory: web
        run: npm ci

      - name: Run Verification (Attempt 1)
        id: verify1
        continue-on-error: true
        run: |
          set +e  # Don't exit immediately on error - we want to capture all failures
          FAILED=0

          # Run ALL checks unconditionally on the entire codebase
          # This ensures no regressions are introduced regardless of what files changed

          echo "::group::Running black format check"
          python -m black --check . 2>&1 | tee /tmp/black_attempt1.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running ruff"
          python -m ruff check src/ tests/ 2>&1 | tee /tmp/ruff_attempt1.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running pytest (unit tests - integration tests skipped in CI)"
          # Integration tests require running API server (not available in CI)
          python -m pytest tests/unit/ -v --cov=src/nyxgpt --cov-report=term-missing 2>&1 | tee /tmp/pytest_attempt1.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running mypy"
          python -m mypy src/ 2>&1 | tee /tmp/mypy_attempt1.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running TypeScript type check"
          (cd web && npm run type-check) 2>&1 | tee /tmp/tsc_attempt1.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          echo "::group::Running web route validation"
          ./scripts/agents/validate-web-routes.sh 2>&1 | tee /tmp/routes_attempt1.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
          echo "::endgroup::"

          if [ $FAILED -eq 1 ]; then
            echo "verification_passed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Verification failed on attempt 1, will retry with fixes"
            exit 1
          else
            echo "verification_passed=true" >> "$GITHUB_OUTPUT"
            echo "✅ All verification checks passed!"
          fi

      - name: Claude Fix Issues (Attempt 2)
        if: steps.verify1.outputs.verification_passed == 'false'
        id: claude_fix2
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          track_progress: true
          show_full_output: true
          claude_args: >-
            --allowed-tools "Bash,Read,Write,Edit,Glob,Grep"
            --model claude-fable-5
            --mcp-config ${{ runner.temp }}/mcp-config.json
          prompt: |
            VERIFICATION FAILED - YOU MUST FIX THE ISSUES

            The previous implementation for issue #${{ github.event.issue.number }} failed verification checks.

            **Important:** You should already be on the feature branch from the previous step.
            If for some reason you're not, check out the branch yourself using git commands.

            Failure logs have been saved to:
            - /tmp/pytest_attempt1.log (if pytest failed)
            - /tmp/ruff_attempt1.log (if ruff linting failed)
            - /tmp/mypy_attempt1.log (if mypy failed)
            - /tmp/black_attempt1.log (if black formatting failed)
            - /tmp/tsc_attempt1.log (if TypeScript type checking failed)
            - /tmp/routes_attempt1.log (if route validation failed)

            YOUR TASK:
            0. Use sequential-thinking to diagnose before touching any code:
               - Read each log file and identify the root cause (not just the symptom)
               - Determine whether failures are related or independent
               - Plan your fix completely before writing a single line of code
            1. Read each log file that exists using the Read tool
            2. Understand what failed and why
            3. Fix ALL the issues in the code
            4. BEFORE committing, re-run ALL verification commands (ALL must pass):
               - black --check . (if fails: black . then re-check)
               - ruff check src/ tests/
               - mypy src/
               - pytest -v
               - cd web && npm run type-check (if web files modified)
               - ./scripts/agents/validate-web-routes.sh (if API endpoints added)
            5. Do NOT commit until ALL checks pass with 0 errors/failures
            6. Commit your fixes with message:
               "fix: address verification failures (attempt 2) (#${{ github.event.issue.number }})"

            Do NOT use any `gh` CLI commands - no `gh issue`, `gh pr`, `gh api`, etc.
            Do NOT close issues, create PRs, or edit issues/PRs in any way.
            The workflow manages all GitHub state - just fix the code and commit.

      - name: Run Verification (Attempt 2)
        if: steps.claude_fix2.conclusion == 'success'
        id: verify2
        continue-on-error: true
        run: |
          set +e
          FAILED=0

          # Run ALL checks unconditionally on the entire codebase

          echo "::group::Running black format check"
          python -m black --check . 2>&1 | tee /tmp/black_attempt2.log
          [ ${PIPESTATUS[0]} -eq 0 ] || FAILED=1
