      - name: Snapshot uncommitted implementation work
        id: snapshot
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Long implementations can hit the Claude step's turn/time limit
          # before committing (observed: run 29256847864 lost a complete,
          # verified canary backend that was never committed). Snapshot any
          # uncommitted work so verification, PR submission, and the review
          # cycle proceed on it — partial work then converges via review-fix
          # cycles instead of evaporating with the runner.
          #
          # This must NOT be a blanket `git add -A`: on #3352 that swept in
          # the runner's own .venv-agent/ (uncovered by .gitignore at the
          # time), committing 7,032 files / ~1.8M lines to the feature
          # branch and making the next step (verification) crawl for 30+
          # minutes against a ~75s baseline. snapshot_safe_add.sh stages
          # tracked modifications plus an explicit allowlist of
          # source/test/doc paths, defensively excludes venv/node_modules/
          # cache-style junk even if .gitignore misses it, and fails loudly
          # (see #3370) instead of silently committing an oversized tree.
          BRANCH="$(git branch --show-current || true)"
          [ -z "$BRANCH" ] && { echo "Detached HEAD; nothing to snapshot."; exit 0; }
          [ "$BRANCH" = "${{ vars.RELEASE_BRANCH }}" ] && { echo "On release branch; nothing to snapshot."; exit 0; }

          SNAPSHOT_FAILED=0
          if [ -n "$(git status --porcelain)" ]; then
            if ./scripts/agents/snapshot_safe_add.sh; then
              if [ -n "$(git diff --cached --name-only)" ]; then
                git commit -m "wip: snapshot uncommitted implementation work (#${{ github.event.issue.number }})" \
                  -m "Auto-committed by the workflow: the implementation step ended with uncommitted changes (e.g. the Claude step hit its turn/time limit before committing). Verification and review proceed on this snapshot; gaps are completed in review-fix cycles."
                echo "::warning::Snapshot-committed uncommitted implementation work on $BRANCH"
              else
                echo "No changes matched the snapshot allowlist; nothing committed."
              fi
            else
              # The size guard tripped: snapshot_safe_add.sh already unstaged
              # everything and printed the offending paths. Don't let `set -e`
              # abort the step here -- fall through to the push below first,
              # so any commits already made during implementation still reach
              # origin. Only the oversized uncommitted delta is discarded;
              # nothing that was already committed is lost.
              SNAPSHOT_FAILED=1
              echo "::error::Snapshot size guard tripped on $BRANCH; the oversized uncommitted delta was NOT committed (see errors above for offending paths)."
            fi
          fi

          # Make sure the branch (and any local-only commits) reach origin so
          # PR submission has a ref to target. This must run even if the
          # snapshot guard tripped above, or already-committed implementation
          # work would be stranded on the runner and lost when it's torn down.
          if ! git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git push -u origin "$BRANCH"
            echo "::notice::Pushed new branch $BRANCH to origin"
          elif [ -n "$(git rev-list "origin/$BRANCH..HEAD" 2>/dev/null)" ]; then
            git push origin "$BRANCH"
            echo "::notice::Pushed local-only commits on $BRANCH to origin"
          fi

          if [ "$SNAPSHOT_FAILED" -eq 1 ]; then
            echo "::error::Failing this step after pushing: the uncommitted implementation delta exceeded the snapshot size guard on $BRANCH."
            exit 1
          fi

