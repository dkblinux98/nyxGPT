          fi

      - name: Claude Fix Issues (Attempt 3)
        if: steps.verify2.outputs.verification_passed == 'false'
        id: claude_fix3
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          track_progress: true
          show_full_output: true
          claude_args: >-
            --model claude-opus-5
            --allowed-tools "Bash,Read,Write,Edit,Glob,Grep"
            --mcp-config ${{ runner.temp }}/mcp-config.json
          prompt: |
            **Workflow-files exception (this repo's configuration):** git in this
            run authenticates with a PAT carrying the `workflow` scope, NOT the
            GitHub App installation token. You MAY create and modify files under
            `.github/workflows/` and push them. The default claude-code-action
            guidance claiming workflow modifications are not allowed does not
            apply here -- do not refuse or stop on that basis.

            VERIFICATION STILL FAILING - FINAL ATTEMPT TO FIX

            Issue #${{ github.event.issue.number }} verification failed AGAIN after your previous fix attempt.

            Latest failure logs:
            - /tmp/black_attempt2.log (if black formatting failed)
            - /tmp/ruff_attempt2.log (if ruff linting failed)
            - /tmp/mypy_attempt2.log (if mypy failed)
            - /tmp/pytest_attempt2.log (if pytest failed)
            - /tmp/tsc_attempt2.log (if TypeScript type checking failed)
            - /tmp/routes_attempt2.log (if route validation failed)

            This is your LAST CHANCE to fix the issues before the workflow fails completely.

            YOUR TASK:
            0. Use sequential-thinking for exhaustive diagnosis before touching any code:
               - Compare /tmp/*_attempt2.log vs /tmp/*_attempt1.log line by line
               - Identify exactly what changed and what did NOT change between attempts
               - Determine the true root cause of each remaining failure
               - Produce a complete fix plan before writing a single line of code
            1. Read the latest failure logs
            2. Compare with previous logs at /tmp/*_attempt1.log to see if you made progress
            3. Fix ALL remaining issues
            4. BEFORE committing, re-run ALL verification commands (ALL must pass):
               - black --check . (if fails: black . then re-check)
               - ruff check src/ tests/
               - mypy src/
               - pytest -v
               - cd web && npm run type-check (if web files modified)
               - ./scripts/agents/validate-web-routes.sh (if API endpoints added)
            5. Do NOT commit until ALL checks pass with 0 errors/failures
            6. Do NOT use any `gh` CLI commands - no `gh issue`, `gh pr`, `gh api`, etc.
               Do NOT close issues, create PRs, or edit issues/PRs in any way.
            7. Commit with message:
               "fix: address remaining verification failures (attempt 3) (#${{ github.event.issue.number }})"

      - name: Final Verification (Must Pass)
        id: verify_final
        timeout-minutes: 15
        run: |
          # Run ALL checks unconditionally on the entire codebase
          # This is the final gate - no regressions allowed

          echo "::group::Final black format check"
          python -m black --check .
          echo "::endgroup::"

          echo "::group::Final ruff verification"
          python -m ruff check src/ tests/
          echo "::endgroup::"

          echo "::group::Final mypy verification"
          python -m mypy src/
          echo "::endgroup::"

          echo "::group::Final pytest verification (unit tests - integration tests skipped in CI)"
          # Integration tests require running API server (not available in CI)
          python -m pytest tests/unit/ -v --cov=src/nyxgpt --cov-report=term-missing
          echo "::endgroup::"

          echo "::group::Final TypeScript verification"
          (cd web && npm run type-check)
          echo "::endgroup::"

          echo "::group::Final route validation"
          ./scripts/agents/validate-web-routes.sh
          echo "::endgroup::"

          echo "✅ All verification checks passed on final attempt!"

      - name: Post verification failure comment
        # #3689: skip when the job failed at a policy gate (not In Progress
        # / not assigned) -- those already posted their own accurate
        # comment; this generic "Failed after 3 attempts" message would be
        # misleading (and never even reached the verification steps).
        if: |
          failure() &&
          steps.verify_assignment.outputs.gate_stopped != 'true' &&
          steps.verify_status.outputs.gate_stopped != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const snapshotFailed = '${{ steps.snapshot.conclusion }}' === 'failure';
            const body = snapshotFailed
              ? `❌ **Developer Agent**: Snapshot size guard tripped

            The "Snapshot uncommitted implementation work" step found an uncommitted
            delta too large to be a plausible agent-authored change (see the
            [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            for the offending paths) and refused to commit it. Verification never ran.

            Any work already committed before this step was still pushed to the branch.

            **Next steps:**
            1. Review the workflow logs above to see which paths tripped the guard
            2. If they're legitimate (a large but intentional change), adjust the
               allowlist in \`scripts/agents/snapshot_safe_add.sh\` or commit the work
               manually on the branch
            3. If they're untracked junk (a venv, build cache, etc.), extend
               \`.gitignore\` and/or the guard's junk patterns

            **Note:** No PR was created because verification never ran.`
              : `❌ **Developer Agent**: Failed after 3 attempts

            The implementation failed verification even after 3 fix attempts.
            This indicates a more complex issue that requires manual intervention.

            **What happened:**
            - Attempt 1: Initial implementation failed verification
            - Attempt 2: Agent attempted fixes, verification still failed
            - Attempt 3: Agent attempted more fixes, verification STILL failed

            **Next steps:**
            1. Review the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
               to see what's failing
            2. Check the commit history on the branch to see what the agent tried
            3. Manual debugging may be required - the agent may not have enough context

            **Note:** No PR was created because verification never passed.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });

      - name: Request review for existing PR
        if: |
          steps.check_pr.outputs.pr_exists == 'true' &&
          steps.check_pr.outputs.pr_state == 'OPEN' &&
          success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          PR="${{ steps.check_pr.outputs.existing_pr }}"

          echo "::group::Requesting review for existing PR #$PR"

          # Assign PR to review-agent
          gh pr edit "$PR" --add-assignee "${{ vars.REVIEW_AGENT }}" || \
            echo "::warning::Failed to set PR assignee"

          # Request review from review-agent (critical)
          if ! gh pr edit "$PR" --add-reviewer "${{ vars.REVIEW_AGENT }}"; then
            echo "::error::Failed to request review from review-agent"
            exit 1
          fi

          # Update issue status and assignee using project scripts
          bash -lc "cd '$GITHUB_WORKSPACE' && \
            source scripts/agents/lib/gh_project.sh && \
            load_config && \
            require_gh_auth && \
            set_issue_status '$ISSUE' \"\$STATUS_IN_REVIEW\" && \
            issue_assign_only '$ISSUE' \"\$REVIEW_AGENT\""

          echo "::notice::PR #$PR submitted for review"
          echo "::endgroup::"

      - name: Post review requested comment (existing PR)
        if: |
          steps.check_pr.outputs.pr_exists == 'true' &&
          steps.check_review.outputs.has_review_issues == 'false' &&
          success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const pr_number = '${{ steps.check_pr.outputs.existing_pr }}';
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const body = `✅ **Developer Agent**: Verification passed ` +
              `for existing PR #${pr_number}\n\n` +
              `All checks passed:\n` +
              `- ✅ Black formatting\n` +
              `- ✅ Ruff linting\n` +
              `- ✅ Mypy type checking\n` +
              `- ✅ Pytest unit tests\n\n` +
              `PR #${pr_number} has been submitted for review.\n\n` +
              `[View PR](${repoUrl}/pull/${pr_number})`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: body
            });

      - name: Submit PR for review
        if: (steps.check_pr.outputs.pr_exists == 'false' || steps.check_pr.outputs.pr_state == 'MERGED') && success()
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"

          # If the implementation deliberately produced no commits (e.g. the
          # developer agent stopped on a scope conflict per CLAUDE.md), there
          # is nothing to submit — exit cleanly instead of failing on
          # "No commits between" and triggering the failure-diagnosis chain.
          git fetch origin "${{ vars.RELEASE_BRANCH }}" --quiet
          if [ -z "$(git rev-list "origin/${{ vars.RELEASE_BRANCH }}..HEAD" 2>/dev/null)" ]; then
            echo "::warning::No commits beyond ${{ vars.RELEASE_BRANCH }} — implementation produced no changes."
            echo "pr_number=" >> "$GITHUB_OUTPUT"

            # A zero-commit run is either (a) an EARLY CUTOFF — the Claude step
            # ended in seconds having done almost nothing (a turn/budget/usage
            # cutoff, e.g. #3194/#3196 stopped ~66s into a 9-task issue with no
            # commits), or (b) a DELIBERATE block — the agent read + reasoned +
            # wrote a real blockage report, which takes real time (the #3160
            # capstone block ran ~118s). This success path bypasses the
            # failure-only usage-limit detector, so an early cutoff would
            # otherwise stall silently on "awaiting human decision". Detect the
            # early-cutoff signature here (a sub-90s Claude step) and auto-retry;
            # only genuine blocks (or an exhausted retry budget) await a human.
            #
            # count_fast_claude_steps (scripts/agents/lib/gh_project.sh) excludes
            # skipped steps and "Post *" cleanup steps, both of which report
            # near-zero durations and would otherwise always match here (#3360).
            source scripts/agents/lib/gh_project.sh
            JOBS_JSON=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" 2>/dev/null || echo '')
            FAST_CLAUDE_STEPS=0
            if [ -n "$JOBS_JSON" ]; then
              FAST_CLAUDE_STEPS=$(count_fast_claude_steps "$JOBS_JSON" "Run Claude Code|Claude Fix Issues|Claude review fix" false)
              [ -z "$FAST_CLAUDE_STEPS" ] && FAST_CLAUDE_STEPS=0
            fi

            # --jq runs once per fetched page -- stream matching comments
            # across all pages first, then slurp+count (see AGENTS.md).
            EC_ATTEMPTS=$(gh api "repos/${{ github.repository }}/issues/$ISSUE/comments" --paginate \
              --jq '.[].body | select(test("<!-- early-cutoff-retry:"))' 2>/dev/null \
              | jq -s 'length' || echo 0)
            EC_ATTEMPTS=${EC_ATTEMPTS:-0}

            if [ "$FAST_CLAUDE_STEPS" -ge 1 ] && [ "$EC_ATTEMPTS" -lt 3 ]; then
              echo "::warning::Early-cutoff no-op detected (Claude step <90s, 0 commits) — auto-retrying (attempt $((EC_ATTEMPTS + 1))/3)."
              gh issue comment "$ISSUE" --body "🔁 **Developer Agent**: The implementation step ended early with no changes (a turn/budget cutoff, not a real block). **Auto-retry $((EC_ATTEMPTS + 1))/3** — re-assigning @${{ vars.DEV_AGENT }} to resume.
          <!-- early-cutoff-retry: $((EC_ATTEMPTS + 1)) -->" || true
              # Re-fire: unassign then re-assign to emit the 'assigned' event
              # that re-triggers this workflow (the issue stays In Progress).
              gh api -X DELETE "repos/${{ github.repository }}/issues/$ISSUE/assignees" \
                -f "assignees[]=${{ vars.DEV_AGENT }}" >/dev/null 2>&1 || true
              sleep 3
              gh api -X POST "repos/${{ github.repository }}/issues/$ISSUE/assignees" \
                -f "assignees[]=${{ vars.DEV_AGENT }}" >/dev/null || true
              exit 0
            fi

            if [ "$EC_ATTEMPTS" -ge 3 ]; then
              gh issue comment "$ISSUE" --body "🛑 **Developer Agent**: Still no changes after 3 early-cutoff auto-retries. This is a persistent cutoff or a genuine blocker — awaiting human decision." || true
            else
              gh issue comment "$ISSUE" --body "⏸️ **Developer Agent**: Implementation produced no changes (see the blockage report above). No PR submitted; awaiting human decision." || true
            fi
            exit 0
          fi

          echo "::group::Submitting PR for review"
          PR_NUMBER=$(./scripts/agents/developer_submit_for_review.sh "$ISSUE")
          echo "::notice::Created PR #$PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # For acceptance failures (merged PR), apply the Acceptance Failure label to the new PR
          if [[ "${{ steps.check_pr.outputs.pr_state }}" == "MERGED" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "Acceptance Failure" || \
              echo "::warning::Could not add Acceptance Failure label to PR #$PR_NUMBER"
            echo "::notice::Applied 'Acceptance Failure' label to PR #$PR_NUMBER"
          fi

          echo "::endgroup::"

      - name: Post PR created comment
        if: steps.pr.conclusion == 'success' && steps.pr.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const pr_number = '${{ steps.pr.outputs.pr_number }}';
            const review_agent = '${{ vars.REVIEW_AGENT }}';
            const is_acceptance = '${{ steps.check_pr.outputs.pr_state }}' === 'MERGED';
            const prefix = is_acceptance
              ? '🔧 **Developer Agent**: Acceptance failure fix complete!'
              : '🎉 **Developer Agent**: Implementation complete!';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `${prefix}\n\n` +
                    `📝 Pull Request: #${pr_number}\n` +
                    `📊 Status: **In Review**\n` +
                    `👤 Assigned to: @${review_agent}\n\n` +
                    `The review agent will now:\n` +
                    `1. Wait for CI checks to complete\n` +
                    `2. Review the code changes\n` +
                    `3. Either merge or request changes\n\n` +
                    `[View PR](https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pr_number})`
            });

      - name: Clear stale usage-limit-retry label
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          # Once a run gets all the way past PR submission / review request,
          # any leftover usage-limit-retry label (from an earlier misfire, or
          # a manual re-assign that raced the retry cron's removal) no longer
          # reflects reality and must not linger to trip the one-label
          # invariant on a future run (#3360). Idempotent no-op if absent.
          gh issue edit "${{ github.event.issue.number }}" --remove-label "usage-limit-retry" 2>/dev/null || true

      - name: Detect usage-limit signature (Phase 0 - self-heal)
        # #3689: never enter the self-heal chain for a policy-gate stop
        # (not In Progress / not assigned) -- those are intentional exits,
        # not infra failures, and previously fell through into a full
        # Phase 1-3 diagnosis for no reason (observed on this issue: run
        # 31320486307 ran Phase 3 Claude reasoning over a plain "not
        # assigned yet" gate failure).
        if: |
          failure() &&
          steps.verify_assignment.outputs.gate_stopped != 'true' &&
          steps.verify_status.outputs.gate_stopped != 'true'
        id: usage_limit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set +e
          # Usage-limit exhaustion signature: a Claude implementation/fix step
          # "completes" in seconds because every model call fails immediately.
          # Observed 1-17s vs 4-25 min for real work (runs 28810049590,
          # 28909002900, 29220860744). When detected, schedule a delayed
          # retry via the usage-limit-retry label + cron workflow instead of
          # escalating "unknown fatal - manual intervention".
          #
          # count_fast_claude_steps requires the matching Claude step's own
          # conclusion to be "failure" (require_failure=true) and excludes
          # skipped/"Post *" steps. Without that corroboration this fired on
          # *any* job failure — including e.g. the PR-submission label check —
          # because the other, non-executed Claude steps in this job are
          # always "skipped" with a near-zero reported duration (#3360).
          source scripts/agents/lib/gh_project.sh
          echo "handled=false" >> "$GITHUB_OUTPUT"

          JOBS_JSON=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" 2>/dev/null)
          [ -z "$JOBS_JSON" ] && exit 0

          FAST_CLAUDE_STEPS=$(count_fast_claude_steps "$JOBS_JSON" "Run Claude Code|Claude Fix Issues|Claude review fix" true)
          [ -z "$FAST_CLAUDE_STEPS" ] && FAST_CLAUDE_STEPS=0

          if [ "$FAST_CLAUDE_STEPS" -lt 1 ]; then
            echo "::notice::No usage-limit signature (no sub-90s Claude steps)"
            exit 0
          fi
          echo "::warning::Usage-limit signature detected: $FAST_CLAUDE_STEPS Claude step(s) finished in <90s"

          # Count prior scheduled retries for this issue; give up after 8.
          # --jq runs once per fetched page -- stream matching comments
          # across all pages first, then slurp+count (see AGENTS.md).
          ATTEMPTS=$(gh api "repos/${{ github.repository }}/issues/$ISSUE/comments" --paginate \
            --jq '.[].body | select(test("<!-- usage-limit-retry-after:"))' 2>/dev/null \
            | jq -s 'length' || echo 0)
          if [ "${ATTEMPTS:-0}" -ge 8 ]; then
            gh issue comment "$ISSUE" --body "🛑 **Developer Agent**: Usage-limit auto-retry gave up after $ATTEMPTS attempts. The Claude usage window does not appear to be recovering — manual investigation needed (check the CLAUDE_CODE_OAUTH_TOKEN account's limits). Re-assign @${{ vars.DEV_AGENT }} to try again."
            gh issue edit "$ISSUE" --remove-label "usage-limit-retry" 2>/dev/null || true
            echo "handled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ensure the label exists (idempotent), then schedule the retry.
          gh label create "usage-limit-retry" \
            --description "Auto-retry pending: run hit Claude usage limits; cron retries after the window resets" \
            --color "C5DEF5" 2>/dev/null || true

          # Owner-confirmed: the Claude usage window takes ~5 hours to reset.
          RETRY_AFTER=$(( $(date +%s) + 18000 ))
          RETRY_AT_UTC=$(date -u -d "@$RETRY_AFTER" '+%H:%M UTC' 2>/dev/null || echo "in ~5h")
          gh issue edit "$ISSUE" --add-label "usage-limit-retry"
          gh issue comment "$ISSUE" --body "⏳ **Developer Agent**: This run hit the Claude usage limit (model calls terminating in ~1s). **Auto-retry $((ATTEMPTS + 1))/8 scheduled** for ~$RETRY_AT_UTC — the retry cron will re-assign @${{ vars.DEV_AGENT }} automatically once the window has had time to reset. No manual action needed unless retries keep failing.
          <!-- usage-limit-retry-after: $RETRY_AFTER -->"

          echo "handled=true" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Classify error (Phase 1)
        # #3689: usage_limit itself is skipped (not run-with-handled=false)
        # for a policy-gate stop, so its `handled` output alone can't be
        # relied on here -- check gate_stopped directly too, or this step
        # (and everything chained off it: retry_budget, Phase 2/3) would
        # still run for a plain "not assigned"/"not In Progress" gate.
        if: |
          failure() && steps.usage_limit.outputs.handled != 'true' &&
          steps.verify_assignment.outputs.gate_stopped != 'true' &&
          steps.verify_status.outputs.gate_stopped != 'true'
        id: classify_error
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set +e  # Don't exit on error - we're analyzing the error

          echo "::group::Extracting error from workflow logs"

          # NOTE: gh run view --log downloads a zip archive that only exists after the
          # run completes. Calling it mid-run (while this error handler is executing)
          # always returns 403 regardless of token permissions.
          # Use the jobs API instead — step-level status is available mid-run.
          JOBS_JSON=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs 2>&1)
          JOB_ID=$(echo "$JOBS_JSON" | jq -r '.jobs[0].id // empty')

          # Failed step names are always available mid-run
          FAILED_STEPS=$(echo "$JOBS_JSON" | jq -r '
            .jobs[0].steps[] |
            select(.conclusion == "failure") |
            .name' 2>/dev/null || echo "")

          echo "Failed steps: $FAILED_STEPS"

          # Try per-job log endpoint — works for completed jobs, may work mid-run
          ERROR_LOG=""
          if [[ -n "$JOB_ID" ]]; then
            ERROR_LOG=$(gh api repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs 2>/dev/null | \
              grep -E "\[error\]|Error:|fatal:|FAILED" | head -20 || echo "")
          fi

          # Fall back to failed step names when log content is unavailable
          if [[ -z "$ERROR_LOG" && -n "$FAILED_STEPS" ]]; then
            ERROR_LOG="$FAILED_STEPS"
          fi

          echo "Error messages found:"
          echo "$ERROR_LOG"
          echo "::endgroup::"

          # Persist the concrete failing step + error excerpt to a file so
          # downstream comment steps can surface the real error instead of a
          # generic classification (#3360 — a misdiagnosed run previously
          # posted a misleading usage-limit retry notice with no trace of
          # the actual "[error] Issue #N must have exactly one label" text).
          {
            echo "**Failed step(s):**"
            if [[ -n "$FAILED_STEPS" ]]; then
              echo '```'
              echo "$FAILED_STEPS"
              echo '```'
            else
              echo "(unknown — could not determine from the jobs API)"
            fi
            echo
            echo "**Error output (excerpt):**"
            echo '```'
            if [[ -n "$ERROR_LOG" ]]; then
              echo "$ERROR_LOG" | head -10
            else
              echo "(no matching error lines found in logs)"
            fi
            echo '```'
          } > /tmp/failure_detail.txt

          # Source the library to get classification functions
          source scripts/agents/lib/gh_project.sh

          # Classify the error
          ERROR_CLASS=$(classify_error "$ERROR_LOG")

          echo "::notice::Error classification: $ERROR_CLASS"
          echo "error_class=$ERROR_CLASS" >> "$GITHUB_OUTPUT"

          # #3689: the (issue, failed step) pair and a deterministic
          # signature of (failed step, error text) are the keys the
          # unforgeable retry budget and same-signature-disproof checks are
          # built on -- computed once here so every downstream step
          # (retry-budget lookup, Phase 3 prompt, auto-retry marker) uses
          # the exact same values.
          FAILED_STEP_NAME="$(echo "$FAILED_STEPS" | head -1)"
          [[ -z "$FAILED_STEP_NAME" ]] && FAILED_STEP_NAME="unknown"
          SIGNATURE="$(printf '%s' "$ERROR_LOG" | python3 "$GITHUB_WORKSPACE/scripts/agents/lib/retry_budget.py" signature "$FAILED_STEP_NAME")"
          echo "failed_step=$FAILED_STEP_NAME" >> "$GITHUB_OUTPUT"
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "::notice::Failure signature for step '$FAILED_STEP_NAME': $SIGNATURE"

          # Determine if retriable
          if is_retriable_error "$ERROR_CLASS"; then
            echo "retriable=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Error is retriable - will attempt auto-retry"
          elif is_fatal_error "$ERROR_CLASS"; then
            echo "retriable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Error is fatal - will NOT retry (would be futile)"
          else
            # Unknown - default to not retriable (conservative approach)
            echo "retriable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Error type unknown - defaulting to no retry"
          fi

      - name: Compute retry budget (unforgeable cap)
        # Runs on every genuine failure (not just retriable ones) so the
        # budget/signature figures are available to the Phase 3 prompt even
        # when Phase 1 classified the error as unknown. Gated on
        # classify_error's own conclusion (rather than re-deriving the
        # gate_stopped/usage_limit checks again) so it never runs when
        # classify_error itself was skipped -- see the comment there (#3689).
        if: failure() && steps.classify_error.conclusion == 'success'
        id: retry_budget
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          FAILED_STEP="${{ steps.classify_error.outputs.failed_step }}"
          SIGNATURE="${{ steps.classify_error.outputs.signature }}"

          # Full comment thread, chronological, with only the fields
          # retry_budget.py needs. author_association is the same signal
          # this workflow's own RETRY_IMPLEMENTATION trigger gate already
          # uses for "human intervention" (see the `on:` block's `if:`) --
          # unlike `user.login != 'github-actions[bot]'` (the old check),
          # it is not spuriously true for this workflow's own PAT-driven
          # comments (posted as myGPT-developer-agent, not
          # github-actions[bot]).
          #
          # --jq runs once per fetched page -- stream each page's array
          # literal, then combine with a second jq pass (see AGENTS.md).
          COMMENTS_JSON=$(gh api "repos/${{ github.repository }}/issues/$ISSUE/comments" --paginate \
            --jq '[.[] | {body: .body, author_association: .author_association}]' \
            | jq -s 'add // []')

          DECISION=$(echo "$COMMENTS_JSON" \
            | python3 "$GITHUB_WORKSPACE/scripts/agents/lib/retry_budget.py" decide "$FAILED_STEP" "$SIGNATURE")

          echo "$DECISION" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_OUTPUT"
          echo "::notice::Retry budget for step '$FAILED_STEP': $DECISION"

      - name: Check cross-issue infra anomaly (#3694)
        # The 2026-08-09 postmortem: 5 in-flight issues hit the identical
        # `gh api search/issues` infra fault in the same step and each ran
        # its own full Phase 1-3 diagnosis independently (~45-50 Claude
        # invocations for one fault). Before Phase 2/3 spend anything on
        # this failure, check whether another issue already opened a
        # matching, unresolved, in-window tracking record for this exact
        # failed step -- if so, this is the same infrastructure event, not
        # a new coding problem, and diagnosis is skipped entirely in favor
        # of a link to the shared incident. Runs on the same gate as
        # "Compute retry budget" so it's available even when Phase 1
        # classified the error as unknown.
        if: failure() && steps.classify_error.conclusion == 'success'
        id: cross_issue_anomaly
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/agents/lib/gh_project.sh
          load_config

          ISSUE="${{ github.event.issue.number }}"
          FAILED_STEP="${{ steps.classify_error.outputs.failed_step }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NOW_EPOCH="$(date +%s)"

          DECISION="$(cross_issue_anomaly_decision "${RELEASE_ISSUE_NUMBER:-}" "$ISSUE" "$FAILED_STEP" "$NOW_EPOCH")"
          echo "::notice::Cross-issue anomaly decision for step '$FAILED_STEP': $DECISION"
          ACTION="$(echo "$DECISION" | jq -r '.action')"

          if [[ "$ACTION" == "skip" ]]; then
            ORIGIN_ISSUE="$(echo "$DECISION" | jq -r '.origin_issue')"
            echo "matched=true" >> "$GITHUB_OUTPUT"
            echo "origin_issue=$ORIGIN_ISSUE" >> "$GITHUB_OUTPUT"
            # A heredoc here would break YAML's block-scalar indentation (an
            # unindented body line starting with e.g. `**` reads as new YAML,
            # not scalar content) -- build the body with printf instead, same
            # as the auto-retry/escalation comments below (#3689).
            BODY="$(printf '⏭️ **Developer Agent**: Skipping redundant diagnosis -- step `%s` failing here matches an already-open cross-issue infrastructure anomaly tracked on #%s (#3694).\n\nThis is being treated as one infrastructure event affecting multiple issues, not a problem specific to this one. This issue'"'"'s retry loop is stopped until the anomaly resolves.\n\n**What to do:** once #%s'"'"'s tracking comment shows the anomaly resolved, comment `RETRY_IMPLEMENTATION` here to resume.\n' \
              "$FAILED_STEP" "$ORIGIN_ISSUE" "$ORIGIN_ISSUE")"
            gh issue comment "$ISSUE" --body "$BODY"
            exit 0
          fi

          echo "matched=false" >> "$GITHUB_OUTPUT"
          if [[ "$ACTION" == "open" ]]; then
            open_cross_issue_anomaly "${RELEASE_ISSUE_NUMBER:-}" "$ISSUE" "$FAILED_STEP" "$NOW_EPOCH" "$RUN_URL"
          fi

      - name: Attempt intelligent fix (Phase 2)
        if: |
          failure() && steps.classify_error.outputs.retriable == 'true' &&
          steps.cross_issue_anomaly.outputs.matched != 'true'
        id: intelligent_fix
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        continue-on-error: true
        run: |
          set +e  # Don't exit on error - we're handling it

          echo "::group::Running intelligent failure analysis"

          # Run the analysis script
          ./scripts/agents/developer_analyze_failure.sh \
            "${{ github.event.issue.number }}" \
            "${{ github.run_id }}"

          RESULT=$?

          echo "::endgroup::"

          # Store the result
          case $RESULT in
            0)
              echo "fix_status=FIXED" >> "$GITHUB_OUTPUT"
              echo "::notice::Auto-fix successful - problem resolved"
              ;;
            1)
              echo "fix_status=FATAL" >> "$GITHUB_OUTPUT"
              echo "::warning::Error is fatal - no fix available"
              ;;
            2)
              echo "fix_status=TRANSIENT" >> "$GITHUB_OUTPUT"
              echo "::notice::Error is transient - retry recommended"
              ;;
            *)
              echo "fix_status=UNKNOWN" >> "$GITHUB_OUTPUT"
              echo "::error::Analysis script returned unexpected code: $RESULT"
              ;;
          esac

          # Read analysis details if available (parse safely)
          if [[ -f /tmp/analysis_result.txt ]]; then
            while IFS='=' read -r key value; do
              [[ -z "$key" || "$key" =~ ^# || -z "$value" ]] && continue
              [[ "$key" =~ ^[A-Z_][A-Z0-9_]*$ ]] || continue
              export "$key=$value"
            done < /tmp/analysis_result.txt

            echo "action=${ACTION:-none}" >> "$GITHUB_OUTPUT"
            echo "wait_seconds=${WAIT_SECONDS:-0}" >> "$GITHUB_OUTPUT"
            echo "::notice::Analysis: $STATUS - $ERROR_TYPE"
          fi

          exit 0  # Don't fail the workflow - we're handling errors

      - name: Deep analysis with Claude (Phase 3 - complex reasoning)
        if: |
          failure() && steps.cross_issue_anomaly.outputs.matched != 'true' && (
            steps.intelligent_fix.outputs.fix_status == 'UNKNOWN' ||
            steps.classify_error.outputs.error_class == 'unknown'
          )
        id: claude_analysis
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          track_progress: true
          show_full_output: false
          claude_args: >-
            --model claude-fable-5
            --allowed-tools "Bash,Read,Grep"
            --mcp-config ${{ runner.temp }}/mcp-config.json
          prompt: |
            **Workflow-files exception (this repo's configuration):** git in this
            run authenticates with a PAT carrying the `workflow` scope, NOT the
            GitHub App installation token. You MAY create and modify files under
            `.github/workflows/` and push them. The default claude-code-action
            guidance claiming workflow modifications are not allowed does not
            apply here -- do not refuse or stop on that basis.

            The developer workflow failed for issue #${{ github.event.issue.number }}, and automatic
            analysis was inconclusive. You need to perform deep reasoning to diagnose the failure.

            ## Your Task

            Determine whether this error is:
            - **AUTO-FIXABLE:** Can be fixed now (reopen issue, fix git state, etc.)
            - **TRANSIENT:** Should retry (rate limits, network issues)
            - **FATAL:** Needs human intervention (auth failures, intentional closures)

            ## Step 0: Retry-budget and same-signature context (#3689 -- read this first)

            - Failed step: `${{ steps.classify_error.outputs.failed_step }}`
            - Retries already used for this (issue, step) since the last owner
              comment: `${{ steps.retry_budget.outputs.retry_count }}`/3
            - Same failure signature (step + error text) as the immediately
              preceding failed run: `${{ steps.retry_budget.outputs.same_signature_as_last }}`

            **If the same-signature flag above is `true`:** the immediately
            preceding run failed with this exact step + error, and if that
            prior cycle retried it as TRANSIENT, the retry did not fix
            anything. This empirically disproves "transient" -- **you MUST
            NOT write `STATUS=TRANSIENT` again for this failure.** Reclassify
            as AUTO-FIXABLE (with the reachability check in Step 4 below) or
            FATAL instead.

            ## Step 1: Get Failure Details

            The run log archive (gh run view --log) is unavailable while the run is
            in progress — it only exists after the run completes and always returns 403
            mid-run. Use the jobs API instead:
            ```bash
            # Get failed step names (always available mid-run)
            gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
              | jq -r '.jobs[0].steps[] | select(.conclusion == "failure") | .name'

            # Get job logs if needed (works for completed jobs)
            JOB_ID=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
              | jq -r '.jobs[0].id')
            gh api repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs 2>/dev/null \
              | grep -E "\[error\]|Error:|fatal:" | head -30
            ```

            ## Step 2: Gather Context

            Based on the error type, gather relevant information:

            **For issue-related errors:**
            ```bash
            gh api repos/${{ github.repository }}/issues/${{ github.event.issue.number }} \
              --jq '{state, closed_at, assignees, created_at, updated_at}'
            ```

            **For PR-related errors:** (REST Search API -- its own rate pool,
            separate from both core REST and GraphQL)
            ```bash
            gh api search/issues \
              --method GET \
              -f q="${{ github.event.issue.number }} in:body type:pr repo:${{ github.repository }}" \
              --jq '.items[] | {number, state, closed_at, merged_at: .pull_request.merged_at}'
            ```

            **For rate limits:**
            ```bash
            gh api rate_limit
            ```

            ## Step 3: Reasoning Guidelines

            Use sequential-thinking to work through your diagnosis — this is a multi-step
            reasoning problem with conditional branches. Think through each signal before
            reaching a conclusion, and revise your assessment if new evidence contradicts it.

            Use human-like reasoning to make nuanced decisions:

            **Timing matters:**
            - Closed 30 minutes ago + assigned to dev → Likely accidental
            - Closed 3 days ago → Likely intentional
            - Closed with merged PR → Work complete, don't reopen

            **Context matters:**
            - Issue closed but PR still open → Review in progress, don't interfere
            - Issue closed, PR merged → Completion, issue should stay closed
            - Issue closed, no PR → Investigate why

            **Error patterns:**
            - "Issue is CLOSED" → Check timing and PR status
            - "No commits between" → Check if work already merged
            - "Authentication failed" → Always fatal
            - "Rate limit" → Check reset time

            ## Step 4: Take Action or Recommend

            **If AUTO-FIXABLE:**
            1. Fix the problem (reopen issue, fix git state, etc.) -- OR, if
               the fix is a code change, it may already exist as a commit on
               some branch (e.g. from an earlier implementation cycle).
               Determine the fix commit's SHA if so (`git log`, `git log
               --all --oneline`, etc.).
            2. **Reachability check (#3689) -- required whenever the fix is a
               code/script/workflow-file change, not just an issue-state
               action:** determine whether the failing step can actually see
               that fix on its NEXT run, not just whether the fix is
               correct. `issue_comment`-triggered runs of THIS workflow (the
               retry path) always execute the workflow definition, and any
               scripts it shells out to (e.g.
               scripts/agents/developer_analyze_failure.sh), from the
               repository's **default branch** -- never from whatever
               feature/fix branch the commit landed on (see
               agents/runbooks/developer-runbook.md §3c). Check:
               ```bash
               git fetch origin ${{ vars.RELEASE_BRANCH }} --quiet
               git merge-base --is-ancestor <FIX_SHA> origin/${{ vars.RELEASE_BRANCH }} && echo REACHABLE || echo NOT_REACHABLE
               ```
               - If the failing step doesn't execute code from the default
                 branch at all (e.g. a one-off `gh` API call with no
                 workflow/script dependency), the fix is inherently reachable
                 on retry -- treat it as REACHABLE.
               - **REACHABLE** (fix is an ancestor of
                 `origin/${{ vars.RELEASE_BRANCH }}`, or no branch dependency
                 exists): write
                 ```
                 STATUS=FIXED
                 ERROR_TYPE=<type>
                 ACTION=<what you did>
                 ```
               - **NOT_REACHABLE** (the failing step executes from the
                 default branch and the fix is stranded on a work branch):
                 do NOT claim FIXED -- the next run will fail identically.
                 Write:
                 ```
                 STATUS=FIXED_REQUIRES_MERGE
                 ERROR_TYPE=<type>
                 COMMIT_SHA=<the fix commit SHA>
                 RECOMMENDATION=<cherry-pick or merge instructions for a human/EA to land the fix on the default branch>
                 ```
                 This status is terminal -- it does NOT auto-retry. The
                 workflow escalates it to the owner with the commit SHA
                 attached.

            **If TRANSIENT:**
            Write to /tmp/analysis_result.txt:
            ```
            STATUS=TRANSIENT
            ERROR_TYPE=<type>
            WAIT_SECONDS=<if applicable>
            ```

            **If FATAL:**
            Write to /tmp/analysis_result.txt:
            ```
            STATUS=FATAL
            ERROR_TYPE=<type>
            DIAGNOSIS=<detailed explanation of why this needs human intervention>
            ```

            ## Critical Rules

            - DO use nuanced reasoning (time elapsed, context clues)
            - DO fix accidental closures (recent + assigned + no merged PR)
            - DON'T reopen intentionally closed issues (old + merged PR)
            - DON'T just retry without understanding WHY it failed
            - DO provide detailed diagnosis for fatal errors

      - name: Read Claude analysis result (Phase 3)
        if: failure() && steps.claude_analysis.conclusion == 'success'
        id: claude_result
        shell: bash
        run: |
          if [[ -f /tmp/analysis_result.txt ]]; then
            # Parse file safely - only read KEY=VALUE lines
            while IFS='=' read -r key value; do
              # Skip empty lines, comments, and lines without =
              [[ -z "$key" || "$key" =~ ^# || -z "$value" ]] && continue
              # Only process valid variable names
              [[ "$key" =~ ^[A-Z_][A-Z0-9_]*$ ]] || continue
              # Export the variable
              export "$key=$value"
            done < /tmp/analysis_result.txt

            echo "status=${STATUS:-UNKNOWN}" >> "$GITHUB_OUTPUT"
            echo "error_type=${ERROR_TYPE:-unknown}" >> "$GITHUB_OUTPUT"
            echo "action=${ACTION:-none}" >> "$GITHUB_OUTPUT"
            echo "diagnosis=${DIAGNOSIS:-}" >> "$GITHUB_OUTPUT"
            echo "wait_seconds=${WAIT_SECONDS:-0}" >> "$GITHUB_OUTPUT"
            # #3689: only present for STATUS=FIXED_REQUIRES_MERGE (a fix
            # exists but isn't reachable from the default branch yet).
            echo "commit_sha=${COMMIT_SHA:-}" >> "$GITHUB_OUTPUT"
            echo "recommendation=${RECOMMENDATION:-}" >> "$GITHUB_OUTPUT"
            echo "Claude analysis: $STATUS - $ERROR_TYPE"
          else
            echo "status=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "error_type=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Escalate FIXED_REQUIRES_MERGE (Phase 3 - fix stranded off default branch)
        if: failure() && steps.claude_result.outputs.status == 'FIXED_REQUIRES_MERGE'
        id: escalate_requires_merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const runId = context.runId;
            const commitSha = '${{ steps.claude_result.outputs.commit_sha }}';
            const recommendation = '${{ steps.claude_result.outputs.recommendation }}';
            const humanOwner = '${{ vars.HUMAN_OWNER }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `🛑 **Developer Agent**: Fix found but not reachable -- escalating.\n\n` +
                    `Phase 3 diagnosis determined the correct fix for this failure exists as commit ` +
                    `\`${commitSha || 'unknown'}\`, but that commit is not on the default branch the ` +
                    `failing step executes from -- retrying would just reproduce the same failure.\n\n` +
                    `**Recommendation:** ${recommendation || 'Cherry-pick or merge the fix commit onto the release branch.'}\n\n` +
                    `[Workflow run](https://github.com/${repo}/actions/runs/${runId})\n\n` +
                    (humanOwner ? `@${humanOwner} -- ` : '') +
                    `this needs the fix landed on the default branch before a retry can succeed. ` +
                    `Commenting \`RETRY_IMPLEMENTATION\` before then will just reproduce this escalation.`
            });

            if (humanOwner) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                assignees: [humanOwner]
              });
            }

            core.setOutput('developer_escalated', 'true');
            // #3695: one-line diagnosis + recommended action for the human-
            // channel (Slack) notification the "Sprint autopilot kick"
            // step sends after this one.
            core.setOutput('diagnosis', `Fix commit ${commitSha || 'unknown'} exists but is not reachable from the default branch -- retrying would just reproduce the same failure.`);
            core.setOutput('action', recommendation || `Cherry-pick or merge commit ${commitSha || 'unknown'} onto the release branch.`);
            core.setFailed('Fix found but not reachable from the default branch (FIXED_REQUIRES_MERGE) -- escalated to owner');

      - name: Post fix success comment (Phase 2+3)
        if: |
          failure() && (
            steps.intelligent_fix.outputs.fix_status == 'FIXED' ||
            steps.claude_result.outputs.status == 'FIXED'
          )
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const phase2Action = '${{ steps.intelligent_fix.outputs.action }}';
            const phase3Action = '${{ steps.claude_result.outputs.action }}';
            const action = phase3Action || phase2Action;
            const phase = phase3Action ? 'Phase 3 (Claude reasoning)' : 'Phase 2 (Script analysis)';
            const repo = context.repo.owner + '/' + context.repo.repo;
            const runId = context.runId;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `✅ **Developer Agent**: Problem automatically resolved!\n\n` +
                    `**Auto-fix applied:** ${action}\n` +
                    `**Analysis:** ${phase}\n\n` +
                    `The workflow will now continue from where it left off.\n\n` +
                    `[Workflow run](https://github.com/${repo}/actions/runs/${runId})`
            });

      - name: Auto-retry on failure (Phase 2+3 - transient errors only)
        if: |
          failure() && steps.cross_issue_anomaly.outputs.matched != 'true' && (
            steps.intelligent_fix.outputs.fix_status == 'TRANSIENT' ||
            steps.claude_result.outputs.status == 'TRANSIENT'
          )
        id: auto_retry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
        run: |
          set -euo pipefail
          ISSUE="${{ github.event.issue.number }}"
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          FAILED_STEP="${{ steps.classify_error.outputs.failed_step }}"
          ERROR_CLASS="${{ steps.classify_error.outputs.error_class }}"
          SIGNATURE="${{ steps.classify_error.outputs.signature }}"

          PHASE3_STATUS="${{ steps.claude_result.outputs.status }}"
          ANALYSIS_PHASE="Phase 2 (Script)"
          [[ "$PHASE3_STATUS" == "TRANSIENT" ]] && ANALYSIS_PHASE="Phase 3 (Claude)"

          # #3689: budget/signature are computed once by the "Compute retry
          # budget" step from an unforgeable marker embedded in every prior
          # auto-retry comment for this (issue, step) pair -- independent of
          # whatever error-type label or STATUS this cycle's diagnosis
          # produced (the old counter was keyed to that label, and its
          # "manual intervention resets it" check matched this workflow's
          # own bot comments too, so it never actually bound anything).
          RETRY_COUNT="${{ steps.retry_budget.outputs.retry_count }}"
          CAP_EXCEEDED="${{ steps.retry_budget.outputs.cap_exceeded }}"
          SAME_SIG="${{ steps.retry_budget.outputs.same_signature_as_last }}"
          NEXT_N="${{ steps.retry_budget.outputs.next_retry_number }}"
          # Defensive defaults: if the "Compute retry budget" step itself
          # failed (e.g. a transient `gh api` error fetching the comment
          # thread), don't let an empty CAP_EXCEEDED/SAME_SIG silently block
          # or crash this step -- fail open on the cap/disproof checks
          # (worst case a comment-fetch flake costs one extra retry, not a
          # stuck run) while still marking the retry as attempt 1 rather
          # than crashing on an empty retry-number argument.
          RETRY_COUNT="${RETRY_COUNT:-0}"
          CAP_EXCEEDED="${CAP_EXCEEDED:-false}"
          SAME_SIG="${SAME_SIG:-false}"
          NEXT_N="${NEXT_N:-1}"

          WAIT_SECONDS="${{ steps.claude_result.outputs.wait_seconds }}"
          WAIT_SECONDS="${WAIT_SECONDS:-0}"
          if [[ "$WAIT_SECONDS" -eq 0 ]]; then
            WAIT_SECONDS="${{ steps.intelligent_fix.outputs.wait_seconds }}"
            WAIT_SECONDS="${WAIT_SECONDS:-0}"
          fi

          # Same-signature disproof (#3689): a second consecutive TRANSIENT
          # verdict for the *identical* step+error signature empirically
          # disproves "transient" -- force escalation instead of another
          # blind retry. Scoped to the reclassification-prone paths (Phase 3
          # LLM reasoning, and test failures which are either flaky or
          # deterministic -- either way a second identical failure needs a
          # human look, not a third blind retry); deterministic rate-limit/
          # network/stale-ref backoffs are excluded since their signature is
          # expected to legitimately repeat across successive waits.
          FORCE_DISPROOF=false
          if [[ "$SAME_SIG" == "true" ]] && \
             { [[ "$ANALYSIS_PHASE" == "Phase 3 (Claude)" ]] || [[ "$ERROR_CLASS" == "retriable:test_failure" ]]; }; then
            FORCE_DISPROOF=true
          fi

          if [[ "$CAP_EXCEEDED" == "true" || "$FORCE_DISPROOF" == "true" ]]; then
            if [[ "$FORCE_DISPROOF" == "true" ]]; then
              REASON="The identical failure signature repeated on the immediately preceding retry, disproving \"transient\" -- this is a deterministic failure, not a transient one."
            else
              REASON="Same failure signature persisted through the retry cap (${RETRY_COUNT}/3 attempts for this step)."
            fi

            # A heredoc here would break YAML's block-scalar indentation
            # (an unindented body line starting with e.g. `**` or `-` reads
            # as new YAML, not scalar content) -- build the body with printf
            # instead, keeping every source line normally indented.
            BODY="$(printf '%s\n\n**Failed step:** %s\n**Retry count:** %s/3 for this step (since last owner comment)\n**Same signature as immediately preceding run:** %s\n**Analysis:** %s\n\n%s\n\n**What to do:**\n1. Review the [failed workflow logs](https://github.com/%s/actions/runs/%s)\n2. Fix the underlying problem manually\n3. Comment on this issue (as the repo owner) to reset the budget, then comment `RETRY_IMPLEMENTATION` to try again\n\n**Note:** Only a comment from the repo owner resets this budget -- relabeling the error or a bot comment does not (#3689).\n' \
              "❌ **Developer Agent**: Auto-retry stopped -- unforgeable budget exhausted or signature disproof triggered." \
              "$FAILED_STEP" "$RETRY_COUNT" "$SAME_SIG" "$ANALYSIS_PHASE" "$REASON" "$REPO" "$RUN_ID")"
            gh issue comment "$ISSUE" --body "$BODY"
            echo "escalated=true" >> "$GITHUB_OUTPUT"
            # #3695: one-line diagnosis + recommended action for the human-
            # channel (Slack) notification the "Sprint autopilot kick" step
            # sends after this one. GITHUB_OUTPUT writes persist even though
            # this step exits 1 below.
            {
              echo "diagnosis=${REASON} (failed step: ${FAILED_STEP})"
              echo "action=Review the failed workflow logs, fix the underlying problem manually, then comment on the issue (as the repo owner) to reset the budget and RETRY_IMPLEMENTATION."
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [[ "$WAIT_SECONDS" -gt 0 ]]; then
            echo "::notice::Waiting ${WAIT_SECONDS}s before retry (rate limit/backoff)..."
            sleep "$WAIT_SECONDS"
          fi

          MARKER="$(python3 "$GITHUB_WORKSPACE/scripts/agents/lib/retry_budget.py" marker "$FAILED_STEP" "$SIGNATURE" "$NEXT_N")"

          BODY="$(printf '%s\n\n**Failed step:** %s\n**Analysis:** %s\n**Retry count:** %s/3 for this step (since last owner comment)\n\nThe agent will attempt to:\n1. Diagnose and fix any infrastructure issues\n2. Handle branch creation/checkout problems\n3. Retry the implementation\n\n[Previous failed run](https://github.com/%s/actions/runs/%s)\n\nRETRY_IMPLEMENTATION\n%s\n' \
            "⚠️ **Developer Agent**: Workflow failed - auto-retry triggered." \
            "$FAILED_STEP" "$ANALYSIS_PHASE" "$NEXT_N" "$REPO" "$RUN_ID" "$MARKER")"
          gh issue comment "$ISSUE" --body "$BODY"
          echo "::notice::Auto-retry triggered (${NEXT_N}/3) for step '${FAILED_STEP}'"

      - name: Escalate fatal error (Phase 1+2+3 - no retry)
        if: |
          failure() && steps.cross_issue_anomaly.outputs.matched != 'true' && (
            steps.classify_error.outputs.retriable == 'false' ||
            steps.intelligent_fix.outputs.fix_status == 'FATAL' ||
            steps.claude_result.outputs.status == 'FATAL'
          )
        id: escalate_fatal
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          script: |
            const issue_number = context.payload.issue.number;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const runId = context.runId;
            const errorClass = '${{ steps.classify_error.outputs.error_class }}';
            const phase2Status = '${{ steps.intelligent_fix.outputs.fix_status }}';
            const phase3Status = '${{ steps.claude_result.outputs.status }}';
            const phase3Diagnosis = '${{ steps.claude_result.outputs.diagnosis }}';

            // Read diagnosis from Phase 2 if available
            const fs = require('fs');
            let phase2Diagnosis = '';
            try {
              const result = fs.readFileSync('/tmp/analysis_result.txt', 'utf8');
              const match = result.match(/DIAGNOSIS=(.+)/);
              if (match) phase2Diagnosis = match[1];
            } catch (e) {}

            // Read the concrete failing step + error excerpt captured by
            // Phase 1 (read from a file, not a GitHub Actions expression,
            // so arbitrary log content can never break out of this script).
            let failureDetail = '';
            try {
              failureDetail = fs.readFileSync('/tmp/failure_detail.txt', 'utf8').trim();
            } catch (e) {}

            // Use Phase 3 diagnosis if available, otherwise Phase 2
            let diagnosis = phase3Diagnosis || phase2Diagnosis;

            // Map error types to human-friendly explanations
            const errorExplanations = {
              'fatal:issue_closed': 'Issue is closed. This may be intentional or accidental.',
              'fatal:auth_failure': 'Authentication failed. Requires admin intervention to ' +
                                    'fix secrets/permissions.',
              'fatal:already_merged': 'Work already completed in a merged PR.',
              'unknown': 'Error type could not be determined. Manual investigation needed.'
            };

            const explanation = diagnosis || errorExplanations[errorClass] || 'Unrecognized error type.';
            const analysisPhase = phase3Status === 'FATAL' ? 'Phase 3 (Claude reasoning)' :
                                 phase2Status === 'FATAL' ? 'Phase 2 (Script analysis)' :
                                 'Phase 1 (Error classification)';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `❌ **Developer Agent**: Workflow failed with non-retriable error.\n\n` +
                    `**Error type:** ${errorClass}\n` +
                    `**Analysis:** ${analysisPhase}\n` +
                    `**Diagnosis:** ${explanation}\n\n` +
                    (failureDetail ? `${failureDetail}\n\n` : '') +
                    (phase3Status === 'FATAL' || phase2Status === 'FATAL' ?
                      'Intelligent analysis attempted auto-fix but determined error is fatal.\n\n' :
                      '') +
                    `Automatic retries would not resolve this type of error. ` +
                    `Manual intervention is required.\n\n` +
                    `**Next steps:**\n` +
                    `1. Review the [failed workflow logs](https://github.com/${repo}/actions/runs/${runId})\n` +
                    `2. Address the root cause:\n` +
                    `   - **issue_closed:** Check if issue should be reopened or work is complete\n` +
                    `   - **auth_failure:** Verify repository secrets and permissions\n` +
                    `   - **already_merged:** Work may already be done, check PRs\n` +
                    `   - **unknown:** Investigate logs for specific error details\n` +
                    `3. Once fixed, comment \`RETRY_IMPLEMENTATION\` to retry\n\n` +
                    `**Note:** Phase 2 intelligent analysis will auto-fix many of these errors.`
            });

            core.setOutput('developer_escalated', 'true');
            // #3695: one-line diagnosis + recommended action for the human-
            // channel (Slack) notification the "Sprint autopilot kick"
            // step sends after this one.
            core.setOutput('diagnosis', explanation);
            core.setOutput('action', 'Review the failed workflow logs, address the root cause, then comment RETRY_IMPLEMENTATION.');
            core.setFailed(`Fatal error (${errorClass}) - no auto-retry`);

      - name: Sprint autopilot kick (developer-side escalation)
        # Mirrors review_accept_and_merge.sh / review_agent_auto_review.yml
        # (sprint_autopilot_kick, #3480): a developer-side escalation frees
        # the issue from further automatic dev-agent work just as surely as
        # a review-cycle escalation does, so it must post the same
        # READY_FOR_NEXT_ISSUE continuation kick -- otherwise a stuck issue
        # silently parks the sprint-autopilot queue instead of moving on.
        # Also sends the #3695 human-channel (Slack DM) notification for
        # this terminal outcome -- whichever of the three escalation steps
        # above actually ran is the one with non-empty outputs (a skipped
        # step's outputs are always empty, never an error).
        if: |
          failure() && (
            steps.auto_retry.outputs.escalated == 'true' ||
            steps.escalate_requires_merge.outputs.developer_escalated == 'true' ||
            steps.escalate_fatal.outputs.developer_escalated == 'true' ||
            steps.cross_issue_anomaly.outputs.matched == 'true'
          )
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}
          STATE_FATAL: ${{ steps.escalate_fatal.outputs.developer_escalated }}
          STATE_REQUIRES_MERGE: ${{ steps.escalate_requires_merge.outputs.developer_escalated }}
          STATE_RETRY_EXHAUSTED: ${{ steps.auto_retry.outputs.escalated }}
          DIAG_FATAL: ${{ steps.escalate_fatal.outputs.diagnosis }}
          DIAG_REQUIRES_MERGE: ${{ steps.escalate_requires_merge.outputs.diagnosis }}
          DIAG_RETRY_EXHAUSTED: ${{ steps.auto_retry.outputs.diagnosis }}
          ACTION_FATAL: ${{ steps.escalate_fatal.outputs.action }}
          ACTION_REQUIRES_MERGE: ${{ steps.escalate_requires_merge.outputs.action }}
          ACTION_RETRY_EXHAUSTED: ${{ steps.auto_retry.outputs.action }}
          STATE_ANOMALY: ${{ steps.cross_issue_anomaly.outputs.matched }}
          ANOMALY_ORIGIN: ${{ steps.cross_issue_anomaly.outputs.origin_issue }}
          ANOMALY_STEP: ${{ steps.classify_error.outputs.failed_step }}
        run: |
          set -euo pipefail
          source scripts/agents/lib/gh_project.sh
          load_config
          require_gh_auth
          ISSUE="${{ github.event.issue.number }}"

          if [[ "$STATE_ANOMALY" == "true" ]]; then
            # #3694: distinct verb -- this issue was not escalated to the
            # owner and no review cycles occurred; it hit a cross-issue
            # infrastructure anomaly another issue already diagnosed.
            sprint_autopilot_kick "$ISSUE" anomaly
            STATE="cross-issue-anomaly"
            DIAGNOSIS="Step '${ANOMALY_STEP}' failing here matches the unresolved cross-issue infrastructure anomaly tracked on #${ANOMALY_ORIGIN} (#3694) -- redundant diagnosis skipped."
            ACTION="Resolve the shared anomaly tracked on #${ANOMALY_ORIGIN}; each affected issue resumes via RETRY_IMPLEMENTATION once it clears."
            # Dedup on the ORIGIN issue, not this one: one infrastructure
            # event should produce one Slack DM total, not one per affected
            # issue (the same collapse #3694 applies to diagnosis).
            DEDUP_KEY="${ANOMALY_ORIGIN}:developer:${STATE}"
          else
            sprint_autopilot_kick "$ISSUE" escalated
            if [[ "$STATE_FATAL" == "true" ]]; then
              STATE="FATAL"
              DIAGNOSIS="$DIAG_FATAL"
              ACTION="$ACTION_FATAL"
            elif [[ "$STATE_REQUIRES_MERGE" == "true" ]]; then
              STATE="FIXED_REQUIRES_MERGE"
              DIAGNOSIS="$DIAG_REQUIRES_MERGE"
              ACTION="$ACTION_REQUIRES_MERGE"
            else
              STATE="retry-budget-exhausted"
              DIAGNOSIS="$DIAG_RETRY_EXHAUSTED"
              ACTION="$ACTION_RETRY_EXHAUSTED"
            fi
            DEDUP_KEY="${ISSUE}:developer:${STATE}"
          fi

          notify_human_escalation "$ISSUE" "$STATE" "$DIAGNOSIS" "$ACTION" "$DEDUP_KEY" \
            || echo "::warning::Human-channel notification failed for issue #${ISSUE} — escalation itself is unaffected."
