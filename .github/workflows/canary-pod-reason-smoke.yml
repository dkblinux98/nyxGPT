name: Canary Pod Reason Smoke

# The question this job answers: when a canary Pod cannot run, does the reason
# Kubernetes gives actually reach the operator -- parsed out of a live cluster,
# not out of a fixture?
#
# #3831 was an acceptance failure where the canary dashboard rendered
# "[object Object]" over a rollout that had really failed with
# "FailedScheduling: Insufficient memory". Fixing the rendering is not enough:
# the reason was never in the payload either, because deployment_health() and
# _wait_rollout() reported "0/1 ready" / "did not become healthy" without ever
# asking the Pods why. That code reads real `kubectl get pods -o json`, and a
# hand-written fixture only proves the parser agrees with its author -- so the
# executed-evidence gate (#3775) applies and this job supplies it.
#
# scripts/canary-pod-reason-smoke.sh runs both halves on a real kind cluster: a
# Deployment the scheduler refuses (asserting the scheduler's own sentence
# survives into deployment_health, _wait_rollout and the API's 409 detail), and
# the same Deployment made schedulable (asserting no reason is appended when
# there is nothing to explain).
#
# Cheap on purpose: one kind node and two `registry.k8s.io/pause` Pods, no
# image build. The full stack bring-up is k8s-local-smoke.yml's job.
on:
  pull_request:
    paths:
      - 'src/nyxgpt/canary.py'
      - 'src/nyxgpt/app.py'
      - 'scripts/canary-pod-reason-smoke.sh'
      - '.github/workflows/canary-pod-reason-smoke.yml'
  push:
    paths:
      - 'src/nyxgpt/canary.py'
      - 'src/nyxgpt/app.py'
      - 'scripts/canary-pod-reason-smoke.sh'
      - '.github/workflows/canary-pod-reason-smoke.yml'
  workflow_dispatch:

# Read-only workflow: it checks out the repo and drives a throwaway local
# cluster; it never writes to the repository or its APIs (CodeQL #33,
# actions/missing-workflow-permissions -- same pattern as k8s-local-smoke.yml).
permissions:
  contents: read

jobs:
  canary-pod-reason-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install nyxgpt (editable)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Run the canary pod-reason smoke
        run: ./scripts/canary-pod-reason-smoke.sh
