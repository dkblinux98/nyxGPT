name: QA Agent Workflow

on:
  pull_request:
    types: [closed]  # Trigger when PR is closed (merged)
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test'
        required: true
        type: string

jobs:
  qa-test:
    # Only run QA if the PR was actually merged (not just closed)
    # QA is MANDATORY for all merges
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    uses: dkblinux98/nyxAgent/.github/workflows/qa-agent.yml@v1.0.0
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      config_path: '.nyxagent/config.yaml'
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NYXAGENT_WORKFLOW_TOKEN: ${{ secrets.NYXAGENT_WORKFLOW_TOKEN }}
