name: Review Huddle - Session

# One run, one huddle (#3911).
#
# The #3687 protocol was three comment-triggered workflows in a chain: the
# review agent posted HUDDLE_TRIGGERED, which woke a developer-position run,
# which posted HUDDLE_MEDIATION_REQUESTED, which woke a mediation run. Each
# leg's *essay* was also its trigger, so three long structured comments landed
# on every huddled PR, and the chain needed race guards added after the fact
# when a duplicated trigger produced two positions and two mediations (#3728,
# #3733, guarded in #3736).
#
# This is that chain as a single job. The races are structurally impossible
# now -- one concurrency group per PR, and no leg can be started twice because
# no leg is started by a comment. What replaces the comment bus is a Slack
# thread (#3910): the conversation happens there under each agent's own
# identity, and the PR keeps only the short decision summary plus the full
# transcript in a collapsed block.
#
# What is deliberately preserved:
#
#   * **Memorylessness.** Every turn is its own `claude-code-action`
#     invocation. #3687 relies on each agent reasoning from what is written
#     down rather than from a conversation it remembers, and one long-lived
#     context would quietly remove that. One job is not one session.
#   * **`huddle_decision_dispatch.yml` is untouched.** It keys on the
#     `HUDDLE_DECISION:` line in a scrummaster comment, and this workflow
#     still posts exactly that.
#   * **`escalate` still escalates**, through the same helpers.
#
# Crash safety: HUDDLE_SESSION_STARTED (carrying the thread id) is posted
# before round 1 and HUDDLE_FAILED on failure, so a session that dies
# mid-round leaves a recoverable record instead of a half-written Slack thread
# nothing on the PR refers to.

on:
  issue_comment:
    types: [created]
  # Executed verification (#3775). The session's shell control flow is
  # executed on every change by `huddle-session-smoke.yml`; this input is how
  # a *live* huddle -- real turns, real Slack identities, a real decision
  # comment -- is run on a chosen PR on demand. GitHub only offers
  # workflow_dispatch for workflows present on the default branch, so this
  # becomes available once the file lands there.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to huddle on"
        required: true

concurrency:
  # The #3736 guards existed because two triggers could each start a leg.
  # A single non-cancelling group per PR replaces them for the *within-run*
  # races: no leg can be started twice, because no leg is started by a
  # comment. What the group alone does NOT do is stop a duplicated trigger --
  # it serializes the second run rather than cancelling it, and a queued run
  # left to itself would open a second thread and spend a second huddle's
  # invocations. That is what the `gate` job below is for.
  group: huddle-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  # The dedupe of last resort, kept from #3736 and reduced to one question.
  #
  # #3728 happened because both of `review_agent_auto_review.yml`'s trigger
  # paths passed their check-before-post guards minutes apart and each posted
  # a HUDDLE_TRIGGERED comment; those upstream guards are unchanged, so the
  # duplicate trigger is a live shape, not a historical one. Only the round's
  # first marker comment owns the round -- precisely what
  # `is_primary_marker_comment` answers -- and asking it in a *job* rather
  # than a step is deliberate: a stand-down that depends on every one of ~20
  # steps remembering a condition is one forgotten `if:` away from running a
  # whole second huddle.
  gate:
    if: >-
      vars.AGENTS_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.pull_request &&
        contains(github.event.comment.body, 'HUDDLE_TRIGGERED') &&
        !contains(github.event.comment.body, 'nyxgpt-token-mention') &&
        github.event.comment.user.login == vars.REVIEW_AGENT))
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read

    outputs:
      primary: ${{ steps.primary.outputs.primary }}

    env:
      GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 1

      - name: Is this the round's first trigger?
        id: primary
        env:
          # #3837: every event value the shell reads arrives as data.
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || inputs.pr_number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            # A manual run has no trigger comment to be second to.
            echo "primary=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PRIMARY=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[]' \
            | jq -s '{comments: .}' \
            | python3 "$GITHUB_WORKSPACE/scripts/agents/lib/huddle_state.py" \
                guard HUDDLE_TRIGGERED "$COMMENT_ID")
          echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"
          if [[ "$PRIMARY" == "true" ]]; then
            echo "::notice::Comment $COMMENT_ID owns this review round's huddle"
          else
            echo "::notice::Comment $COMMENT_ID is not this round's first HUDDLE_TRIGGERED -- standing down"
          fi

  huddle:
    needs: gate
    if: needs.gate.outputs.primary == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    env:
      GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
      SLACK_HUDDLE_CHANNEL: ${{ vars.SLACK_HUDDLE_CHANNEL }}
      SLACK_USER_TOKEN_DEV: ${{ secrets.SLACK_USER_TOKEN_DEV }}
      SLACK_USER_TOKEN_REVIEW: ${{ secrets.SLACK_USER_TOKEN_REVIEW }}
      SLACK_USER_TOKEN_SCRUM: ${{ secrets.SLACK_USER_TOKEN_SCRUM }}
      HUDDLE_DIR: ${{ github.workspace }}/.huddle
      PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
      # The cap is configurable downward only: the rounds are three explicit
      # pairs of steps, so a value above 3 behaves as 3. Lowering it to 1 or 2
      # is the useful direction (a cheaper huddle); raising it needs steps.
      MAX_ROUNDS: ${{ vars.HUDDLE_MAX_ROUNDS || '3' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Auth gh
        run: gh auth status

      - name: Validate required secrets
        env:
          # #3837: read secrets as data, never as shell source.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_AGENT_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
          DEVELOPER_AGENT_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          SCRUMMASTER_AGENT_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        run: |
          for name in CLAUDE_CODE_OAUTH_TOKEN REVIEW_AGENT_TOKEN \
                      DEVELOPER_AGENT_TOKEN SCRUMMASTER_AGENT_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name secret is not configured"
              exit 1
            fi
          done
          # Slack is NOT validated here on purpose: an unconfigured channel
          # degrades to a transcript-only huddle (#3910), and refusing to
          # huddle because a chat integration is missing would be a worse
          # failure than the one it reports.

      - name: Resolve the PR, its issue, and why the huddle fired
        id: context
        run: |
          set -euo pipefail
          mkdir -p "$HUDDLE_DIR"
          # Self-contained on purpose: no checkout, no config, no sourced
          # library. A PR-triggered workflow runs the PR's copy of this file
          # against a RELEASE_BRANCH checkout, so calling a helper the base
          # branch does not have yet fails with exit 127 -- which is exactly
          # how this step and pr-hygiene went red on the PR that introduced
          # the helper. A query needs nothing checked out to work.
          ISSUE=$(gh api graphql -f query='
            query($owner:String!, $name:String!, $pr:Int!){
              repository(owner:$owner, name:$name){
                pullRequest(number:$pr){
                  closingIssuesReferences(first:5){ nodes { number } }
                }
              }
            }' -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY##*/}" \
            -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[0].number // empty' \
            2>/dev/null || true)

          # Fallback for PRs opened before the link existed. Read, never required.
          if [[ -z "$ISSUE" ]]; then
            ISSUE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' \
              | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          fi
          if [[ -z "$ISSUE" ]]; then
            echo "::error::PR #$PR_NUMBER closes no issue -- a huddle needs the acceptance criteria"
            exit 1
          fi
          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "::notice::Huddle on PR #$PR_NUMBER (issue #$ISSUE)"

      - name: Open the huddle thread
        id: thread
        env:
          # #3820/#3837: values reach a run: body as data through env, never
          # as interpolated shell source.
          REASON: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ steps.context.outputs.issue_number }}
        run: |
          set -euo pipefail
          # First line of the trigger comment, trimmed: enough for a thread
          # head, and it keeps an arbitrarily long comment body out of argv.
          SUMMARY=$(printf '%s' "${REASON:-manual dispatch}" | tr '\n' ' ' | cut -c1-280)
          TS=$(python3 scripts/agents/lib/huddle_channel.py open \
                 "$PR_NUMBER" "$ISSUE_NUMBER" "$SUMMARY")
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          if [[ -n "$TS" ]]; then
            echo "::notice::Huddle thread $TS opened"
          else
            echo "::warning::No huddle thread (Slack unconfigured or unreachable) -- the transcript still lands on the PR"
          fi

      # Crash safety: the marker goes up BEFORE round 1, carrying the thread
      # id, so a session that dies mid-round leaves something that names where
      # the conversation went.
      - name: Record that the session started
        env:
          THREAD_TS: ${{ steps.thread.outputs.ts }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body "$(printf '%s\n\n%s\n%s' \
            ':speech_balloon: **Review huddle**: session started; the conversation is running now.' \
            "<!-- HUDDLE_SESSION_STARTED thread=${THREAD_TS:-none} run=${GITHUB_RUN_ID} -->" \
            '<!-- nyxgpt-token-mention -->')"

      - name: "Round 1 - dev turn"
        id: dev1
        if: >-
          !cancelled()
          && steps.thread.outcome == 'success'
          && fromJSON(env.MAX_ROUNDS) >= 1
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          allowed_bots: "claude"
          track_progress: false
          prompt: |
            You are the developer agent in a review huddle on PR #${{ env.PR_NUMBER }}
            (issue #${{ steps.context.outputs.issue_number }}), round 1 of at most
            ${{ env.MAX_ROUNDS }}.

            This invocation is memoryless on purpose (#3687): reason from what is
            written down, not from anything you believe about earlier rounds.

            1. Read the PR thread and diff:
               `gh pr view ${{ env.PR_NUMBER }} --comments` and
               `gh pr diff ${{ env.PR_NUMBER }}`.
            2. Read issue #${{ steps.context.outputs.issue_number }} for the acceptance
               criteria the work is actually judged against.
            3. Read every earlier turn of THIS huddle: the files already in
               `${{ env.HUDDLE_DIR }}/` (empty on round 1, turn by turn after that).
            4. Write your turn -- and nothing else -- to
               `${{ env.HUDDLE_DIR }}/01-dev.md`:

               ## Developer Position (round 1)

               ### What I believe the problem is
               [your diagnosis]

               ### What was tried
               [prior attempts and why they did not land]

               ### What I propose
               [proceed as-is / a specific different approach / a specific descope /
               escalate -- be concrete; a fresh reviewer reads this next]

            Do NOT write, edit or commit any project code. Do NOT post comments, change
            issue status, or change assignments. Writing that one file is the whole task;
            the workflow posts it to the huddle thread for you.
          claude_args: >-
            --model ${{ vars.AGENT_MODEL_HUDDLE || 'claude-fable-5' }}
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Read,Grep,Write"
          show_full_output: true

      - name: "Round 1 - post the dev turn"
        if: >-
          !cancelled() && steps.dev1.outcome == 'success'
        env:
          THREAD_TS: ${{ steps.thread.outputs.ts }}
        run: |
          set -euo pipefail
          FILE="$HUDDLE_DIR/01-dev.md"
          if [[ ! -s "$FILE" ]]; then
            echo "::warning::round 1 dev turn wrote no file -- nothing to post"
            exit 0
          fi
          python3 scripts/agents/lib/huddle_channel.py post \
            "$THREAD_TS" dev < "$FILE"

      - name: "Round 1 - review turn"
        id: rev1
        if: >-
          !cancelled()
          && steps.thread.outcome == 'success'
          && fromJSON(env.MAX_ROUNDS) >= 1
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.REVIEW_AGENT_TOKEN }}
          allowed_bots: "claude"
          track_progress: false
          prompt: |
            You are the review agent in a review huddle on PR #${{ env.PR_NUMBER }}
            (issue #${{ steps.context.outputs.issue_number }}), round 1 of at most
            ${{ env.MAX_ROUNDS }}.

            This invocation is memoryless on purpose (#3687): reason from what is
            written down, not from anything you believe about earlier rounds.

            1. Read the PR thread and diff:
               `gh pr view ${{ env.PR_NUMBER }} --comments` and
               `gh pr diff ${{ env.PR_NUMBER }}`.
            2. Read issue #${{ steps.context.outputs.issue_number }} for the acceptance
               criteria the work is actually judged against.
            3. Read every earlier turn of THIS huddle: the files already in
               `${{ env.HUDDLE_DIR }}/` (empty on round 1, turn by turn after that).
            4. Write your turn -- and nothing else -- to
               `${{ env.HUDDLE_DIR }}/02-review.md`:

               ## Review Position (round 1)

               ### Where I still disagree
               [the specific finding, or "nothing -- settled" if the developer's
               round has answered it]

               ### What would satisfy me
               [concretely: the change, the test, or the evidence you need]

               If the developer's position has resolved your finding, end the file
               with the single line `HUDDLE_SETTLED` -- that closes the huddle early
               instead of spending the remaining rounds.

            Do NOT write, edit or commit any project code. Do NOT post comments, change
            issue status, or change assignments. Writing that one file is the whole task;
            the workflow posts it to the huddle thread for you.
          claude_args: >-
            --model ${{ vars.AGENT_MODEL_HUDDLE || 'claude-fable-5' }}
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Read,Grep,Write"
          show_full_output: true

      - name: "Round 1 - post the review turn"
        if: >-
          !cancelled() && steps.rev1.outcome == 'success'
        env:
          THREAD_TS: ${{ steps.thread.outputs.ts }}
        run: |
          set -euo pipefail
          FILE="$HUDDLE_DIR/02-review.md"
          if [[ ! -s "$FILE" ]]; then
            echo "::warning::round 1 review turn wrote no file -- nothing to post"
            exit 0
          fi
          python3 scripts/agents/lib/huddle_channel.py post \
            "$THREAD_TS" review < "$FILE"

      - name: "Round 1 - has it settled?"
        id: settle1
        if: "!cancelled()"
        run: |
          set -euo pipefail
          FILE="$HUDDLE_DIR/02-review.md"
          if [[ -s "$FILE" ]] && grep -qx 'HUDDLE_SETTLED' "$FILE"; then
            echo "settled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Huddle settled in round 1"
          else
            echo "settled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Round 2 - dev turn"
        id: dev2
        if: >-
          !cancelled()
          && steps.thread.outcome == 'success'
          && fromJSON(env.MAX_ROUNDS) >= 2
          && steps.settle1.outputs.settled != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          allowed_bots: "claude"
          track_progress: false
          prompt: |
            You are the developer agent in a review huddle on PR #${{ env.PR_NUMBER }}
            (issue #${{ steps.context.outputs.issue_number }}), round 2 of at most
            ${{ env.MAX_ROUNDS }}.

            This invocation is memoryless on purpose (#3687): reason from what is
            written down, not from anything you believe about earlier rounds.

            1. Read the PR thread and diff:
               `gh pr view ${{ env.PR_NUMBER }} --comments` and
               `gh pr diff ${{ env.PR_NUMBER }}`.
            2. Read issue #${{ steps.context.outputs.issue_number }} for the acceptance
               criteria the work is actually judged against.
            3. Read every earlier turn of THIS huddle: the files already in
               `${{ env.HUDDLE_DIR }}/` (empty on round 1, turn by turn after that).
            4. Write your turn -- and nothing else -- to
               `${{ env.HUDDLE_DIR }}/03-dev.md`:

               ## Developer Position (round 2)

               ### What I believe the problem is
               [your diagnosis]

               ### What was tried
               [prior attempts and why they did not land]

               ### What I propose
               [proceed as-is / a specific different approach / a specific descope /
               escalate -- be concrete; a fresh reviewer reads this next]

            Do NOT write, edit or commit any project code. Do NOT post comments, change
            issue status, or change assignments. Writing that one file is the whole task;
            the workflow posts it to the huddle thread for you.
          claude_args: >-
            --model ${{ vars.AGENT_MODEL_HUDDLE || 'claude-fable-5' }}
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Read,Grep,Write"
          show_full_output: true

      - name: "Round 2 - post the dev turn"
        if: >-
          !cancelled() && steps.dev2.outcome == 'success'
        env:
          THREAD_TS: ${{ steps.thread.outputs.ts }}
        run: |
          set -euo pipefail
          FILE="$HUDDLE_DIR/03-dev.md"
          if [[ ! -s "$FILE" ]]; then
            echo "::warning::round 2 dev turn wrote no file -- nothing to post"
            exit 0
          fi
          python3 scripts/agents/lib/huddle_channel.py post \
            "$THREAD_TS" dev < "$FILE"

      - name: "Round 2 - review turn"
        id: rev2
        if: >-
          !cancelled()
          && steps.thread.outcome == 'success'
          && fromJSON(env.MAX_ROUNDS) >= 2
          && steps.settle1.outputs.settled != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.REVIEW_AGENT_TOKEN }}
          allowed_bots: "claude"
          track_progress: false
          prompt: |
            You are the review agent in a review huddle on PR #${{ env.PR_NUMBER }}
            (issue #${{ steps.context.outputs.issue_number }}), round 2 of at most
            ${{ env.MAX_ROUNDS }}.

            This invocation is memoryless on purpose (#3687): reason from what is
            written down, not from anything you believe about earlier rounds.

            1. Read the PR thread and diff:
               `gh pr view ${{ env.PR_NUMBER }} --comments` and
               `gh pr diff ${{ env.PR_NUMBER }}`.
            2. Read issue #${{ steps.context.outputs.issue_number }} for the acceptance
               criteria the work is actually judged against.
            3. Read every earlier turn of THIS huddle: the files already in
               `${{ env.HUDDLE_DIR }}/` (empty on round 1, turn by turn after that).
            4. Write your turn -- and nothing else -- to
               `${{ env.HUDDLE_DIR }}/04-review.md`:

               ## Review Position (round 2)

               ### Where I still disagree
               [the specific finding, or "nothing -- settled" if the developer's
               round has answered it]

               ### What would satisfy me
               [concretely: the change, the test, or the evidence you need]

               If the developer's position has resolved your finding, end the file
               with the single line `HUDDLE_SETTLED` -- that closes the huddle early
               instead of spending the remaining rounds.

            Do NOT write, edit or commit any project code. Do NOT post comments, change
            issue status, or change assignments. Writing that one file is the whole task;
            the workflow posts it to the huddle thread for you.
          claude_args: >-
            --model ${{ vars.AGENT_MODEL_HUDDLE || 'claude-fable-5' }}
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Read,Grep,Write"
          show_full_output: true

      - name: "Round 2 - post the review turn"
        if: >-
          !cancelled() && steps.rev2.outcome == 'success'
        env:
          THREAD_TS: ${{ steps.thread.outputs.ts }}
        run: |
          set -euo pipefail
          FILE="$HUDDLE_DIR/04-review.md"
          if [[ ! -s "$FILE" ]]; then
            echo "::warning::round 2 review turn wrote no file -- nothing to post"
            exit 0
          fi
          python3 scripts/agents/lib/huddle_channel.py post \
            "$THREAD_TS" review < "$FILE"

      # Settling is sticky, and it has to be: round N gates on round N-1's
      # answer alone, so a huddle that settled in round 1 skips round 2 --
      # which means 04-review.md is never written, which read naively says
      # "not settled" and would run round 3 on a closed disagreement. Two
      # paid invocations, on a question nobody is still asking.
      - name: "Round 2 - has it settled?"
        id: settle2
        if: "!cancelled()"
        env:
          ALREADY: ${{ steps.settle1.outputs.settled }}
        run: |
          set -euo pipefail
          FILE="$HUDDLE_DIR/04-review.md"
          if [[ "$ALREADY" == "true" ]]; then
            echo "settled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Huddle already settled in an earlier round"
          elif [[ -s "$FILE" ]] && grep -qx 'HUDDLE_SETTLED' "$FILE"; then
            echo "settled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Huddle settled in round 2"
          else
            echo "settled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Round 3 - dev turn"
        id: dev3
        if: >-
          !cancelled()
          && steps.thread.outcome == 'success'
          && fromJSON(env.MAX_ROUNDS) >= 3
          && steps.settle2.outputs.settled != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          allowed_bots: "claude"
          track_progress: false
          prompt: |
            You are the developer agent in a review huddle on PR #${{ env.PR_NUMBER }}
            (issue #${{ steps.context.outputs.issue_number }}), round 3 of at most
            ${{ env.MAX_ROUNDS }}.

            This invocation is memoryless on purpose (#3687): reason from what is
            written down, not from anything you believe about earlier rounds.

            1. Read the PR thread and diff:
               `gh pr view ${{ env.PR_NUMBER }} --comments` and
               `gh pr diff ${{ env.PR_NUMBER }}`.
            2. Read issue #${{ steps.context.outputs.issue_number }} for the acceptance
               criteria the work is actually judged against.
            3. Read every earlier turn of THIS huddle: the files already in
               `${{ env.HUDDLE_DIR }}/` (empty on round 1, turn by turn after that).
            4. Write your turn -- and nothing else -- to
               `${{ env.HUDDLE_DIR }}/05-dev.md`:

               ## Developer Position (round 3)

               ### What I believe the problem is
               [your diagnosis]

               ### What was tried
               [prior attempts and why they did not land]

               ### What I propose
               [proceed as-is / a specific different approach / a specific descope /
               escalate -- be concrete; a fresh reviewer reads this next]

            Do NOT write, edit or commit any project code. Do NOT post comments, change
            issue status, or change assignments. Writing that one file is the whole task;
            the workflow posts it to the huddle thread for you.
          claude_args: >-
            --model ${{ vars.AGENT_MODEL_HUDDLE || 'claude-fable-5' }}
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Read,Grep,Write"
          show_full_output: true

      - name: "Round 3 - post the dev turn"
        if: >-
          !cancelled() && steps.dev3.outcome == 'success'
        env:
          THREAD_TS: ${{ steps.thread.outputs.ts }}
        run: |
          set -euo pipefail
          FILE="$HUDDLE_DIR/05-dev.md"
          if [[ ! -s "$FILE" ]]; then
            echo "::warning::round 3 dev turn wrote no file -- nothing to post"
            exit 0
          fi
          python3 scripts/agents/lib/huddle_channel.py post \
            "$THREAD_TS" dev < "$FILE"

      - name: "Round 3 - review turn"
        id: rev3
        if: >-
          !cancelled()
          && steps.thread.outcome == 'success'
          && fromJSON(env.MAX_ROUNDS) >= 3
          && steps.settle2.outputs.settled != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.REVIEW_AGENT_TOKEN }}
          allowed_bots: "claude"
          track_progress: false
          prompt: |
            You are the review agent in a review huddle on PR #${{ env.PR_NUMBER }}
            (issue #${{ steps.context.outputs.issue_number }}), round 3 of at most
            ${{ env.MAX_ROUNDS }}.

            This invocation is memoryless on purpose (#3687): reason from what is
            written down, not from anything you believe about earlier rounds.

            1. Read the PR thread and diff:
               `gh pr view ${{ env.PR_NUMBER }} --comments` and
               `gh pr diff ${{ env.PR_NUMBER }}`.
            2. Read issue #${{ steps.context.outputs.issue_number }} for the acceptance
               criteria the work is actually judged against.
            3. Read every earlier turn of THIS huddle: the files already in
               `${{ env.HUDDLE_DIR }}/` (empty on round 1, turn by turn after that).
            4. Write your turn -- and nothing else -- to
               `${{ env.HUDDLE_DIR }}/06-review.md`:

               ## Review Position (round 3)

               ### Where I still disagree
               [the specific finding, or "nothing -- settled" if the developer's
               round has answered it]

               ### What would satisfy me
               [concretely: the change, the test, or the evidence you need]

               If the developer's position has resolved your finding, end the file
               with the single line `HUDDLE_SETTLED` -- that closes the huddle early
               instead of spending the remaining rounds.

            Do NOT write, edit or commit any project code. Do NOT post comments, change
            issue status, or change assignments. Writing that one file is the whole task;
            the workflow posts it to the huddle thread for you.
          claude_args: >-
            --model ${{ vars.AGENT_MODEL_HUDDLE || 'claude-fable-5' }}
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Read,Grep,Write"
          show_full_output: true

      - name: "Round 3 - post the review turn"
        if: >-
          !cancelled() && steps.rev3.outcome == 'success'
        env:
          THREAD_TS: ${{ steps.thread.outputs.ts }}
        run: |
          set -euo pipefail
          FILE="$HUDDLE_DIR/06-review.md"
          if [[ ! -s "$FILE" ]]; then
            echo "::warning::round 3 review turn wrote no file -- nothing to post"
            exit 0
          fi
          python3 scripts/agents/lib/huddle_channel.py post \
            "$THREAD_TS" review < "$FILE"

      - name: "Round 3 - has it settled?"
        id: settle3
        if: "!cancelled()"
        env:
          ALREADY: ${{ steps.settle2.outputs.settled }}
        run: |
          set -euo pipefail
          FILE="$HUDDLE_DIR/06-review.md"
          if [[ "$ALREADY" == "true" ]]; then
            echo "settled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Huddle already settled in an earlier round"
          elif [[ -s "$FILE" ]] && grep -qx 'HUDDLE_SETTLED' "$FILE"; then
            echo "settled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Huddle settled in round 3"
          else
            echo "settled=false" >> "$GITHUB_OUTPUT"
          fi


      - name: The scrummaster's decision
        id: decision
        if: "!cancelled() && steps.thread.outcome == 'success'"
        env:
          # The escalate path shells out to `gh` (assign_issue_verified,
          # `gh pr edit`, sprint_autopilot_kick), and `gh` reads the ambient
          # GH_TOKEN -- which at job level is the *review* agent's. The old
          # `scrummaster_huddle_mediation.yml` ran wholly under the
          # scrummaster's token; this step is that run, so it carries that
          # identity too. Step env wins over job env for the tools this
          # action spawns.
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          allowed_bots: "claude"
          track_progress: false
          prompt: |
            You are mediating the review huddle on PR #${{ env.PR_NUMBER }}
            (issue #${{ steps.context.outputs.issue_number }}). Fresh and memoryless on
            purpose: decide from what is written down.

            1. Read every turn of this huddle: the files in `${{ env.HUDDLE_DIR }}/`,
               in name order. They are the developer's and reviewer's positions.
            2. Read `gh pr view ${{ env.PR_NUMBER }} --comments`, `gh pr diff
               ${{ env.PR_NUMBER }}`, and issue #${{ steps.context.outputs.issue_number }}
               for the acceptance criteria.
            3. Decide exactly one of:
               - **proceed** -- the developer's approach is right; continue as-is.
               - **change-approach** -- state the specific different approach.
               - **descope** -- state the specific descope (a named test dropped, a
                 follow-up split off) that resolves the disagreement.
               - **escalate** -- only the owner can resolve this (spec ambiguity or a
                 real deadlock). If and ONLY if you choose escalate, also run:
                 `bash -lc "cd '$GITHUB_WORKSPACE' && source scripts/agents/lib/gh_project.sh && load_config && require_gh_auth && assign_issue_verified '${{ steps.context.outputs.issue_number }}' \"\$HUMAN_OWNER\" && gh pr edit ${{ env.PR_NUMBER }} --add-assignee \"\$HUMAN_OWNER\" && sprint_autopilot_kick '${{ steps.context.outputs.issue_number }}' escalated"`
            4. Write the decision to `${{ env.HUDDLE_DIR }}/90-decision.md`, structured as:

               ## Huddle Decision

               **Decision:** [proceed|change-approach|descope|escalate]

               ### Rationale
               [why, referencing the positions above]

               ### What happens next
               [for proceed/change-approach/descope: what the developer does in the
               next fix cycle; for escalate: note that the owner has been assigned]

               HUDDLE_DECISION: [proceed|change-approach|descope|escalate]

            The `HUDDLE_DECISION:` line must be exactly one of those four words --
            huddle_decision_dispatch.yml keys on it and starts the next fix cycle.
            Do not post the comment yourself; the workflow posts it, so it carries the
            thread link.
          claude_args: >-
            --model ${{ vars.AGENT_MODEL_HUDDLE || 'claude-fable-5' }}
            --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh issue view:*),Bash(bash -lc*),Read,Grep,Write"
          show_full_output: true

      # Posted as the SCRUMMASTER, and that is load-bearing, not cosmetic:
      # `huddle_decision_dispatch.yml` fires only for a HUDDLE_DECISION
      # comment authored by `vars.SCRUM_AGENT` or the owner. Under the job's
      # review-agent token the decision would land, look right, and dispatch
      # nothing -- the issue would sit In Review exactly as it did on #3733,
      # which is the stall that workflow was built to close. The old
      # `scrummaster_huddle_mediation.yml` satisfied the gate by construction
      # (the whole run was the scrummaster); here it is this one override.
      # `tests/unit/test_huddle_session.py::TestTheDecisionCanActuallyDispatch`
      # pins the two ends together.
      - name: Post the decision to the thread and the PR
        if: "!cancelled() && steps.decision.outcome == 'success'"
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          THREAD_TS: ${{ steps.thread.outputs.ts }}
        run: |
          set -euo pipefail
          FILE="$HUDDLE_DIR/90-decision.md"
          if [[ ! -s "$FILE" ]]; then
            echo "::error::the mediation turn wrote no decision -- nothing to dispatch"
            exit 1
          fi
          python3 scripts/agents/lib/huddle_channel.py post \
            "$THREAD_TS" scrum < "$FILE"

          PERMALINK=$(python3 scripts/agents/lib/huddle_channel.py permalink "$THREAD_TS")
          {
            cat "$FILE"
            printf '\n\n'
            if [[ -n "$PERMALINK" ]]; then
              printf '[Huddle thread](%s)\n' "$PERMALINK"
            fi
          } > "$HUDDLE_DIR/decision-comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$HUDDLE_DIR/decision-comment.md"

      # The record has to survive Slack: retention is somebody else's setting,
      # and a decision whose reasoning is unreachable to a future session is
      # exactly what agents/LEDGER.md exists to prevent.
      #
      # Two sources, and the order between them is the whole design:
      #
      #   * the **turn files** are the floor. They are written on this runner,
      #     so the archive is complete even when the channel was unavailable
      #     for the entire huddle -- which is exactly how every huddle ran
      #     before the tokens existed, and why this step must never depend on
      #     Slack answering.
      #   * the **thread, read back**, is the part the files cannot hold:
      #     anything said in the huddle by someone who is not one of the three
      #     turn-writing agents -- the owner weighing in, a human correcting a
      #     premise -- exists only in Slack, and evaporates with Slack's
      #     retention. Adding it is the difference between archiving the
      #     agents' essays and archiving the conversation.
      #
      # This is also the only call to `read()` on the session's live path.
      # #3911 reopened partly because that operation had never been executed
      # by anything but its own smoke: it was dead code inside the workflow
      # that supposedly relied on it (it shipped broken, #3974, and the huddle
      # could not have noticed).
      - name: Append the transcript to the PR
        if: "!cancelled()"
        env:
          THREAD_TS: ${{ steps.thread.outputs.ts }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          TURNS=("$HUDDLE_DIR"/[0-9][0-9]-*.md)

          # `|| true`: a Slack read that fails must cost the extra section,
          # never the archive. Its warnings go to the runner log as usual.
          THREAD_MD=""
          if [[ -n "${THREAD_TS:-}" ]]; then
            THREAD_MD=$(python3 scripts/agents/lib/huddle_channel.py read "$THREAD_TS" || true)
          fi

          if [[ ${#TURNS[@]} -eq 0 && -z "$THREAD_MD" ]]; then
            echo "::notice::no huddle turns were written -- nothing to transcribe"
            exit 0
          fi
          {
            printf '<details>\n<summary>Huddle transcript (%d turns)</summary>\n\n' "${#TURNS[@]}"
            for turn in "${TURNS[@]}"; do
              printf '### %s\n\n' "$(basename "$turn" .md)"
              cat "$turn"
              printf '\n\n'
            done
            if [[ -n "$THREAD_MD" ]]; then
              printf '### The huddle thread, as it was read back from Slack\n\n'
              printf '%s\n\n' "$THREAD_MD"
            fi
            printf '</details>\n\n<!-- nyxgpt-token-mention -->\n'
          } > "$HUDDLE_DIR/transcript.md"
          gh pr comment "$PR_NUMBER" --body-file "$HUDDLE_DIR/transcript.md"

      - name: Record a failed session
        if: failure()
        env:
          # Same shape as the started marker, including the `:-none` default:
          # a session that died before the thread opened still has to say so,
          # and `thread=` with nothing after it reads as a truncated marker.
          THREAD_TS: ${{ steps.thread.outputs.ts }}
        run: |
          # The thread is told first, and it is told at all because of what
          # the acceptance criterion actually asks for: a session that dies
          # mid-round must not leave "a half-written Slack thread". The PR
          # marker alone does not achieve that -- it makes the failure
          # recoverable for anyone reading the *PR*, while the thread itself
          # just stops, indistinguishable from a huddle still thinking. The
          # people reading a huddle are reading it in Slack.
          #
          # No `set -e` here on purpose (unchanged): this step runs *because*
          # something already failed, and each notice is best-effort.
          if [[ -n "${THREAD_TS:-}" ]]; then
            python3 scripts/agents/lib/huddle_channel.py post "$THREAD_TS" scrum \
              ":warning: This huddle session failed part-way through (run ${GITHUB_RUN_ID}). Nothing further will be posted here; the PR carries a HUDDLE_FAILED marker." || true
          fi
          gh pr comment "$PR_NUMBER" --body "$(printf '%s\n\n%s\n%s' \
            ':warning: **Review huddle**: the session failed part-way through. The transcript above (if any) is what was written before it stopped.' \
            "<!-- HUDDLE_FAILED thread=${THREAD_TS:-none} run=${GITHUB_RUN_ID} -->" \
            '<!-- nyxgpt-token-mention -->')" || true
