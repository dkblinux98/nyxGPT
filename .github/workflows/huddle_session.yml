               [your diagnosis]

               ### What was tried
               [prior attempts and why they did not land]

               ### What I propose
               [proceed as-is / a specific different approach / a specific descope /
               escalate -- be concrete; a fresh reviewer reads this next]

            Do NOT write, edit or commit any project code. Do NOT post comments, change
            issue status, or change assignments. Writing that one file is the whole task;
            the workflow posts it to the huddle thread for you.
          claude_args: >-
