name: Link Revert PR to Original Issue

on:
  pull_request:
    types: [opened]

jobs:
  link-revert-to-issue:
    # Only run if PR body starts with "Reverts" (GitHub's revert PR pattern)
    if: startsWith(github.event.pull_request.body, 'Reverts')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read

    steps:
      - name: Extract original PR from revert body
        id: extract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_BODY="${{ github.event.pull_request.body }}"

          echo "Revert PR body: $PR_BODY"

          # Extract original PR number from "Reverts owner/repo#123" pattern
          ORIGINAL_PR=$(echo "$PR_BODY" | sed -n 's/^Reverts .*#\([0-9]*\).*/\1/p')

          if [[ -z "$ORIGINAL_PR" ]]; then
            echo "::warning::Could not extract original PR number from revert PR body"
            echo "has_original=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Original PR: #$ORIGINAL_PR"
          echo "original_pr=$ORIGINAL_PR" >> "$GITHUB_OUTPUT"
          echo "has_original=true" >> "$GITHUB_OUTPUT"

      - name: Find issue linked to original PR
        if: steps.extract.outputs.has_original == 'true'
        id: find_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ORIGINAL_PR="${{ steps.extract.outputs.original_pr }}"

          # Get original PR body
          ORIGINAL_BODY=$(gh pr view "$ORIGINAL_PR" --json body -q '.body')

          echo "Original PR #$ORIGINAL_PR body:"
          echo "$ORIGINAL_BODY"

          # Extract issue number from "Closes #123" pattern
          ISSUE=$(echo "$ORIGINAL_BODY" | sed -n 's/.*Closes #\([0-9]*\).*/\1/p' | head -1)

          if [[ -z "$ISSUE" ]]; then
            echo "::warning::Original PR #$ORIGINAL_PR has no linked issue (no 'Closes #N' found)"
            echo "has_issue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found linked issue: #$ISSUE"
          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "has_issue=true" >> "$GITHUB_OUTPUT"

      - name: Update revert PR body with issue link
        if: steps.find_issue.outputs.has_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          ISSUE="${{ steps.find_issue.outputs.issue_number }}"
          ORIGINAL_PR="${{ steps.extract.outputs.original_pr }}"

          # Update PR body to link to issue
          NEW_BODY=$(cat <<EOF
          Closes #${ISSUE}

          Reverts dkblinux98/nyxGPT#${ORIGINAL_PR}

          This reverts the changes from PR #${ORIGINAL_PR}, which addressed issue #${ISSUE}.
          EOF
          )

          echo "Updating PR #$PR_NUMBER with new body:"
          echo "$NEW_BODY"

          # Update PR body
          gh pr edit "$PR_NUMBER" --body "$NEW_BODY"

          echo "✓ Revert PR #$PR_NUMBER now linked to issue #$ISSUE"

      - name: Post informational comment
        if: steps.find_issue.outputs.has_issue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = ${{ github.event.pull_request.number }};
            const issue_number = '${{ steps.find_issue.outputs.issue_number }}';
            const original_pr = '${{ steps.extract.outputs.original_pr }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: `ℹ️ **Revert PR Auto-Linker**: This revert PR has been automatically linked to issue #${issue_number} (from original PR #${original_pr}).`
            });
