name: Link Revert PR to Original Issue

on:
  pull_request:
    types: [opened]

jobs:
  link-revert-to-issue:
    # Only run if PR body starts with "Reverts" (GitHub's revert PR pattern)
    if: startsWith(github.event.pull_request.body, 'Reverts')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: read

    steps:
      - name: Extract original PR from revert body
        id: extract
        env:
          GH_TOKEN: ${{ github.token }}
          # Untrusted PR body passed via env, never interpolated into the
          # script body, so a crafted revert PR description cannot break out
          # and inject shell (same class as CodeQL #1).
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"

          echo "Revert PR body: $PR_BODY"

          # Extract original PR number from "Reverts owner/repo#123" pattern
          ORIGINAL_PR=$(echo "$PR_BODY" | sed -n 's/^Reverts .*#\([0-9]*\).*/\1/p')

          if [[ -z "$ORIGINAL_PR" ]]; then
            echo "::warning::Could not extract original PR number from revert PR body"
            echo "has_original=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Original PR: #$ORIGINAL_PR"
          echo "original_pr=$ORIGINAL_PR" >> "$GITHUB_OUTPUT"
          echo "has_original=true" >> "$GITHUB_OUTPUT"

      - name: Find issue linked to original PR
        if: steps.extract.outputs.has_original == 'true'
        id: find_issue
        env:
          GH_TOKEN: ${{ github.token }}
          # #3837: step outputs reach the shell as data, never as source. This
          # one is `sed`-extracted from an attacker-influenceable PR body.
          ORIGINAL_PR: ${{ steps.extract.outputs.original_pr }}
        run: |
          set -euo pipefail

          # Get original PR body (REST -- plain PR data has no GraphQL-only
          # dependency, keeps this off the GraphQL/Projects-v2 rate pool)
          ORIGINAL_BODY=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${ORIGINAL_PR}" --jq '.body')

          echo "Original PR #$ORIGINAL_PR body:"
          echo "$ORIGINAL_BODY"

          # The link, not the sentence (owner rule, 2026-08-19): read the
          # original PR's native closing-issue edge, falling back to the body
          # convention for PRs that predate it.
          ISSUE=$(bash -lc "source scripts/agents/lib/gh_project.sh && load_config && require_gh_auth && pr_linked_issue '$ORIGINAL_PR'")

          if [[ -z "$ISSUE" ]]; then
            echo "::warning::Original PR #$ORIGINAL_PR closes no issue"
            echo "has_issue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found linked issue: #$ISSUE"
          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "has_issue=true" >> "$GITHUB_OUTPUT"

      - name: Update revert PR body with issue link
        if: steps.find_issue.outputs.has_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # #3837: step outputs reach the shell as data, never as source.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE: ${{ steps.find_issue.outputs.issue_number }}
          ORIGINAL_PR: ${{ steps.extract.outputs.original_pr }}
        run: |
          set -euo pipefail

          # Update PR body to link to issue
          NEW_BODY=$(cat <<EOF
          Closes #${ISSUE}

          Reverts dkblinux98/nyxGPT#${ORIGINAL_PR}

          This reverts the changes from PR #${ORIGINAL_PR}, which addressed issue #${ISSUE}.
          EOF
          )

          echo "Updating PR #$PR_NUMBER with new body:"
          echo "$NEW_BODY"

          # Update PR body
          gh pr edit "$PR_NUMBER" --body "$NEW_BODY"

          echo "✓ Revert PR #$PR_NUMBER now linked to issue #$ISSUE"

      - name: Post informational comment
        if: steps.find_issue.outputs.has_issue == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
          ORIGINAL_PR: ${{ steps.extract.outputs.original_pr }}
        with:
          script: |
            const pr_number = context.payload.pull_request.number;
            const issue_number = process.env.ISSUE_NUMBER;
            const original_pr = process.env.ORIGINAL_PR;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: (
                `ℹ️ **Revert PR Auto-Linker**: This revert PR has been ` +
                `automatically linked to issue #${issue_number} ` +
                `(from original PR #${original_pr}).`
              )
            });
