name: Promote Accepted Features

# Owner flow 2026-08-02 (companion to handle_acceptance_failure.yml), with
# the dual-lane extension of 2026-08-14 (#3780): a feature parks CLOSED
# while the acceptance failures and improvements blocking it are reworked.
# It parks in EITHER "Acceptance Testing" OR "Acceptance Failed" — the
# owner uses the latter to keep what they have tested and failed visible in
# one place — and both lanes are handled identically here. When every issue
# in the feature's TRANSITIVE blocked-by closure (#3731) has reached
# "For Release", the feature is promoted to "For Release" automatically;
# while any blocker is still open the sweep moves nothing at all, so the
# owner's lane placement is read, never rearranged. In "Acceptance Failed"
# only CLOSED items are candidates: the OPEN ones there are the drain
# gate's held rework (#3730) and are never promoted.
#
# The sweep also heals the native blocking relationship (failure blocks
# feature) if the handler couldn't set it.
#
# THE SCHEDULE WAS REMOVED (#4201, ledger D-070). It was `*/30 * * * *`:
# 48 runs a day, each checking out the release branch and walking every
# parked issue's transitive blocked-by closure to report "Promoted 0
# issue(s)". Same removal, same reasoning as the release ceremony's cron
# (D-060, 2026-10-05) and the drain gate's (2026-08-25) -- GitHub throttles
# a busy cron to every 3-8 hours, so the poll was unreliable as well as
# expensive, and first principle 1 says do not poll what will notify you.
#
# This workflow is DISPATCH-ONLY. Every actor that changes the state it
# waits on dispatches it, through the one shared helper
# `dispatch_acceptance_sweeps` (scripts/agents/lib/gh_project.sh): the
# review merge path, the release ceremony and the drain gate release. The
# one state change no actor can announce is the OWNER moving an issue on
# the project board -- a user project raises no `projects_v2_item` event --
# so that case is one deliberate dispatch, the same shape D-060 uses for
# the ceremony:
#
#   gh workflow run promote_accepted_features.yml --ref <release branch> -f dry_run=true
#   gh workflow run promote_accepted_features.yml --ref <release branch>
#
# Stated so a future session does not "restore" the cron on finding it
# gone: nothing is stranded by its absence. The sweep converges in ONE run
# (the fixed-point loop in promote_accepted_features.sh -- the cron used to
# double as the cascade iterator, one hop per tick), and running it when
# nothing is promotable moves nothing and posts nothing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be promoted/linked without changing anything"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

jobs:
  promote:
    if: vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}

      - name: Write ephemeral config
        run: |
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"
          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF
          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"

      - name: Promote accepted features
        env:
          # #3837: dispatch inputs reach the shell as data, never as source.
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          DRY_RUN=0
          if [[ "$DRY_RUN_INPUT" == "true" ]]; then
            DRY_RUN=1
          fi
          DRY_RUN="$DRY_RUN" scripts/agents/promote_accepted_features.sh
