name: Review Agent Auto-Fix Loop

on:
  issue_comment:
    types: [created]

jobs:
  auto-fix:
    if: >-
      ${{ github.event.issue.pull_request
          && (github.event.comment.user.login == 'claude[bot]' || github.event.comment.user.login == vars.DEV_AGENT)
          && startsWith(github.event.comment.body, '## Code Review - REQUEST_CHANGES') }}
    uses: dkblinux98/nyxAgent/.github/workflows/reusable-review-auto-fix.yml@v1.0.0
    with:
      pr_number: ${{ github.event.issue.number }}
      repository: ${{ github.repository }}
      config_path: '.nyxagent/config.yaml'
      release_branch: ${{ vars.RELEASE_BRANCH }}
      human_owner: ${{ vars.HUMAN_OWNER }}
      dev_agent: ${{ vars.DEV_AGENT }}
    secrets:
      GH_TOKEN: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN_NYXAGENT: ${{ secrets.GH_TOKEN_NYXAGENT }}
