name: Restart Activation Smoke

# Answers one question that inspection and unit tests structurally cannot:
#
#   When the auth key is rotated on a RUNNING stack, does the product say so
#   -- or does the web UI just start 401-ing?
#
# The defect behind #3806 lives in what a real Next.js process holds in its
# environment after the real service wrapper started it. A unit test can
# assert that `[auth] api_key` is *classified* restart-required for `web`; it
# cannot see the frozen NYXGPT_AUTH_API_KEY, and it cannot see the blank 401
# wall that follows. scripts/restart-activation-smoke.py runs both tiers for
# real -- uvicorn plus the web tier launched through the wrapper `ops.py`
# itself generates -- and drives the owner's acceptance scenario: rotate,
# reproduce the 401, see the notice, defer, restart, healthy stack.
#
# Step 11 of that script is the fault injection required by #3753's rule: it
# rebuilds the classification WITHOUT `auth.api_key` -- the pre-#3806 product
# -- and asserts no notice is raised. Without it, steps 3-4 would pass on a
# build that never fixed anything.
#
# Scoped to the files that can break it: the activation classification, the
# pending-restart state, the wrapper template, the proxy that sends the key,
# and the endpoints/UI that report the notice.
on:
  pull_request:
    paths:
      - 'src/nyxgpt/config_wizard.py'
      - 'src/nyxgpt/restart_state.py'
      - 'src/nyxgpt/secrets_setup.py'
      - 'src/nyxgpt/ops.py'
      - 'src/nyxgpt/app.py'
      - 'web/src/lib/apiProxy.ts'
      - 'web/src/components/PendingRestartNotice.tsx'
      - 'example.config.ini'
      - 'scripts/restart-activation-smoke.py'
      - '.github/workflows/restart-activation-smoke.yml'
  push:
    paths:
      - 'src/nyxgpt/config_wizard.py'
      - 'src/nyxgpt/restart_state.py'
      - 'src/nyxgpt/secrets_setup.py'
      - 'src/nyxgpt/ops.py'
      - 'src/nyxgpt/app.py'
      - 'web/src/lib/apiProxy.ts'
      - 'web/src/components/PendingRestartNotice.tsx'
      - 'example.config.ini'
      - 'scripts/restart-activation-smoke.py'
      - '.github/workflows/restart-activation-smoke.yml'
  workflow_dispatch:

# Read-only: the smoke run checks out the repo and drives two local processes;
# it never writes to the repository or its APIs.
permissions:
  contents: read

jobs:
  restart-activation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install nyxgpt (editable) and uvicorn
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .
          pip install uvicorn

      - name: Rotate the auth key on a running stack
        run: python3 scripts/restart-activation-smoke.py
