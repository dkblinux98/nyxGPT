name: Review Agent Auto-Review

on:
  issue_comment:
    types: [created]

jobs:
  execute-review-decision:
    # Only run if comment is on a PR and starts with "## Code Review"
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '## Code Review')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    env:
      GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Auth gh
        run: gh auth status

      - name: Write ephemeral config.ini
        shell: bash
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/mygpt-config.ini"

          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF

          echo "MYGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"
          echo "Wrote ephemeral config at $CFG"

      - name: Verify config loads
        shell: bash
        run: |
          set -euo pipefail
          bash -lc '
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            echo "config ok: $REPO_OWNER/$REPO_NAME project $PROJECT_OWNER#$PROJECT_NUMBER release=$RELEASE_BRANCH"
          '

      - name: Get PR number from comment event
        id: get_pr
        shell: bash
        run: |
          set -euo pipefail

          # Get PR number from issue_comment event
          PR_NUMBER="${{ github.event.issue.number }}"

          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::No PR number in issue_comment event"
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Processing review for PR #$PR_NUMBER"

      - name: Parse review decision from comment
        id: parse_review
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Parsing review comment"

          # Get review comment body from event
          REVIEW_COMMENT='${{ github.event.comment.body }}'

          # Parse decision from first line
          DECISION_LINE=$(echo "$REVIEW_COMMENT" | head -1)

          if echo "$DECISION_LINE" | grep -q "APPROVE"; then
            DECISION="APPROVE"
          elif echo "$DECISION_LINE" | grep -q "REQUEST_CHANGES"; then
            DECISION="REQUEST_CHANGES"
          else
            echo "::error::Could not parse decision from: $DECISION_LINE"
            exit 1
          fi

          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "Decision: $DECISION"

          # Save full comment to file for sub-issue parsing if needed
          echo "$REVIEW_COMMENT" > /tmp/review-comment.txt

      - name: Extract issue number from PR
        id: get_issue
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ steps.get_pr.outputs.pr_number }}"

          ISSUE=$(gh pr view "$PR" --json body -q '.body' | grep -oP 'Closes #\K\d+' || echo "")

          if [[ -z "$ISSUE" ]]; then
            echo "::error::PR #$PR body does not contain 'Closes #N'"
            exit 1
          fi

          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "Found issue #$ISSUE"

      - name: Execute merge (if approved)
        if: steps.parse_review.outputs.decision == 'APPROVE'
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ steps.get_pr.outputs.pr_number }}"
          ISSUE="${{ steps.get_issue.outputs.issue_number }}"

          echo "::notice::Review approved - executing merge"
          bash -lc "cd $GITHUB_WORKSPACE && source scripts/agents/lib/gh_project.sh && load_config && bash scripts/agents/review_accept_and_merge.sh $PR $ISSUE"

      - name: Create sub-issues (if changes requested)
        if: steps.parse_review.outputs.decision == 'REQUEST_CHANGES'
        shell: bash
        run: |
          set -euo pipefail
          ISSUE="${{ steps.get_issue.outputs.issue_number }}"

          echo "::notice::Changes requested - parsing sub-issues from review comment"

          # Parse Critical and Medium issues from the review comment
          REVIEW_COMMENT=$(cat /tmp/review-comment.txt)

          # Extract Critical Issues section
          CRITICAL_SECTION=$(echo "$REVIEW_COMMENT" | sed -n '/### Critical Issues/,/### Medium Issues\|### Minor Issues\|### Decision/p' | grep '^\- \*\*' || echo "")

          # Extract Medium Issues section
          MEDIUM_SECTION=$(echo "$REVIEW_COMMENT" | sed -n '/### Medium Issues/,/### Minor Issues\|### Decision/p' | grep '^\- \*\*' || echo "")

          # Combine Critical and Medium issues
          BLOCKING_ISSUES=$(echo -e "$CRITICAL_SECTION\n$MEDIUM_SECTION" | grep '^\- \*\*' || echo "")

          if [[ -z "$BLOCKING_ISSUES" ]]; then
            echo "::error::REQUEST_CHANGES decision but no Critical/Medium issues found in review comment"
            exit 1
          fi

          # Create a sub-issue for each blocking issue
          echo "$BLOCKING_ISSUES" | while IFS= read -r line; do
            if [[ -z "$line" ]]; then continue; fi

            # Extract title from **Title**: format
            TITLE=$(echo "$line" | sed -n 's/^- \*\*\(.*\)\*\*:.*/\1/p')
            DESCRIPTION=$(echo "$line" | sed -n 's/^- \*\*.*\*\*: \(.*\)/\1/p')

            if [[ -z "$TITLE" ]]; then
              echo "::warning::Could not parse title from: $line"
              continue
            fi

            # Create body file for sub-issue
            BODY_FILE="/tmp/sub-issue-$(echo "$TITLE" | tr ' ' '-' | tr -cd '[:alnum:]-').md"
            cat > "$BODY_FILE" << EOFBODY
## Acceptance Failure

**From code review of parent issue ${ISSUE}**

### Issue
${DESCRIPTION}

### How to Fix
See code review comment for details and specific file/line references.

### Parent Issue
Issue ${ISSUE}
EOFBODY

            echo "Creating sub-issue: $TITLE"
            bash -lc "cd $GITHUB_WORKSPACE && source scripts/agents/lib/gh_project.sh && load_config && bash scripts/agents/review_request_changes.sh $ISSUE '$TITLE' '$BODY_FILE'"
          done

      - name: Post completion comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REVIEW_AGENT_TOKEN }}
          script: |
            const pr_number = ${{ steps.get_pr.outputs.pr_number }};
            const decision = '${{ steps.parse_review.outputs.decision }}';

            let body;
            if (decision === 'APPROVE') {
              body = '✅ **Review Agent**: PR merged successfully.\n\nNo blocking issues found. Changes have been merged to release branch.';
            } else if (decision === 'REQUEST_CHANGES') {
              body = '🔄 **Review Agent**: Changes requested.\n\nAcceptance failure sub-issues have been created for Critical/Medium findings. Issue assigned back to developer-agent.';
            } else {
              body = '❌ **Review Agent**: Review decision execution failed.\n\nCheck workflow logs for details.\n\n[View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: body
            });
