name: Review Agent Execute Decision

on:
  issue_comment:
    types: [created]

jobs:
  execute-review-decision:
    # Automated workflow - triggers on review decisions or manual override
    # Auto-triggers:
    #   - APPROVE decision: Automatically merges when review approves
    #   - REQUEST_CHANGES: Only when REVIEW_AUTO_FIX_ENABLED=false (else review_auto_fix.yml handles it)
    # Manual triggers:
    #   - @approve-merge: Manual merge override
    #   - @request-changes: Manual auto-fix trigger (when auto-fix disabled)
    if: |
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '@approve-merge') ||
       (contains(github.event.comment.body, '@request-changes') && vars.REVIEW_AUTO_FIX_ENABLED != 'true') ||
       (vars.REVIEW_AUTO_FIX_ENABLED == 'true' && startsWith(github.event.comment.body, '## Code Review - APPROVE') && (github.event.comment.user.login == 'claude[bot]' || github.event.comment.user.login == vars.DEV_AGENT)))
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    env:
      GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Auth gh
        run: gh auth status

      - name: Validate required secrets
        run: |
          if [[ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not configured"
            echo "::error::Configure it at: Settings → Secrets and variables → Actions → Secrets"
            exit 1
          fi

          if [[ -z "${{ secrets.REVIEW_AGENT_TOKEN }}" ]]; then
            echo "::error::REVIEW_AGENT_TOKEN secret is not configured"
            exit 1
          fi

          echo "✓ Required secrets validated"

      - name: Write ephemeral config.ini
        shell: bash
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/mygpt-config.ini"

          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF

          echo "MYGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"
          echo "Wrote ephemeral config at $CFG"

      - name: Verify config loads
        shell: bash
        run: |
          set -euo pipefail
          bash -lc '
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            echo "config ok: $REPO_OWNER/$REPO_NAME project $PROJECT_OWNER#$PROJECT_NUMBER release=$RELEASE_BRANCH"
          '

      - name: Get PR number from comment event
        id: get_pr
        shell: bash
        run: |
          set -euo pipefail

          # Get PR number from issue_comment event
          PR_NUMBER="${{ github.event.issue.number }}"

          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::No PR number in issue_comment event"
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Processing review for PR #$PR_NUMBER"

      - name: Parse human decision from comment
        id: parse_decision
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Parsing human decision"

          # Get comment body from event - use heredoc to safely handle special chars
          COMMENT=$(cat <<'COMMENT_EOF'
          ${{ github.event.comment.body }}
          COMMENT_EOF
          )

          # Parse decision from human trigger phrase
          # CRITICAL: Match only when trigger appears on its own line (not in example text or code blocks)
          # This prevents false triggers when review comments discuss the commands
          if echo "$COMMENT" | grep -qE '^\s*@approve-merge\s*$'; then
            DECISION="APPROVE"
            echo "::notice::Human approved merge"
          elif echo "$COMMENT" | grep -qE '^\s*@request-changes\s*$'; then
            DECISION="REQUEST_CHANGES"
            echo "::notice::Human requested changes"
          else
            echo "::error::No valid trigger phrase found (@approve-merge or @request-changes on own line)"
            exit 1
          fi

          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "Decision: $DECISION"

          echo "::endgroup::"

      - name: Extract issue number from PR
        id: get_issue
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ steps.get_pr.outputs.pr_number }}"

          ISSUE=$(gh pr view "$PR" --json body -q '.body' | sed -n 's/.*Closes #\([0-9]*\).*/\1/p' | head -1)

          if [[ -z "$ISSUE" ]]; then
            echo "::error::PR #$PR body does not contain 'Closes #N'"
            exit 1
          fi

          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "Found issue #$ISSUE"

      - name: Execute merge (if approved)
        if: steps.parse_decision.outputs.decision == 'APPROVE'
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ steps.get_pr.outputs.pr_number }}"
          ISSUE="${{ steps.get_issue.outputs.issue_number }}"

          echo "::notice::Human approved merge - executing merge"
          bash -lc "cd '$GITHUB_WORKSPACE' && source scripts/agents/lib/gh_project.sh && load_config && bash scripts/agents/review_accept_and_merge.sh '$PR' '$ISSUE'"

      - name: Count review iterations (if changes requested)
        if: steps.parse_decision.outputs.decision == 'REQUEST_CHANGES'
        id: count
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ steps.get_pr.outputs.pr_number }}"

          # Query PR comments from claude (Claude Code Action OAuth user) starting with "## Code Review - REQUEST_CHANGES"
          # Only count REQUEST_CHANGES iterations, not APPROVE comments
          COUNT=$(gh pr view "$PR" --json comments --jq '
            [.comments[] |
             select(.author.login == "claude" and
                    (.body | startswith("## Code Review - REQUEST_CHANGES")))] |
            length
          ')

          echo "loop_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Review loop count (REQUEST_CHANGES only): $COUNT"

          # Escalate when COUNT >= 3 (already 3 reviews exist, this would be 4th attempt)
          if [[ "$COUNT" -ge 3 ]]; then
            echo "escalate=true" >> "$GITHUB_OUTPUT"
            echo "Escalation required: 3 review loops completed"
          else
            echo "escalate=false" >> "$GITHUB_OUTPUT"
            echo "Continuing with auto-fix (loop $(($COUNT + 1))/3)"
          fi

      - name: Escalate to human (if 3+ loops)
        if: steps.parse_decision.outputs.decision == 'REQUEST_CHANGES' && steps.count.outputs.escalate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ steps.get_pr.outputs.pr_number }}"

          echo "Escalating PR #$PR to human after 3 review attempts"

          gh pr comment "$PR" --body "@${{ vars.HUMAN_OWNER }} claude bot has attempted to review and fix this PR 3 times but issues persist. Manual intervention is required."

          gh pr edit "$PR" --add-assignee "${{ vars.HUMAN_OWNER }}"

          echo "✓ Escalation complete"
          exit 0

      - name: Get PR branch name (if changes requested and not escalated)
        if: steps.parse_decision.outputs.decision == 'REQUEST_CHANGES' && steps.count.outputs.escalate == 'false'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ steps.get_pr.outputs.pr_number }}"
          BRANCH=$(gh pr view "$PR" --json headRefName -q .headRefName)

          if [[ -z "$BRANCH" ]]; then
            echo "ERROR: Could not get PR branch name"
            exit 1
          fi

          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "PR branch: $BRANCH"

      - name: Checkout PR branch (if changes requested and not escalated)
        if: steps.parse_decision.outputs.decision == 'REQUEST_CHANGES' && steps.count.outputs.escalate == 'false'
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ steps.branch.outputs.branch_name }}"

          echo "Fetching and checking out branch: $BRANCH"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"

          echo "✓ Checked out PR branch"

      - name: Parse review findings (if changes requested and not escalated)
        if: steps.parse_decision.outputs.decision == 'REQUEST_CHANGES' && steps.count.outputs.escalate == 'false'
        id: findings
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ steps.get_pr.outputs.pr_number }}"

          echo "Extracting most recent Code Review comment..."

          # Get most recent "## Code Review - REQUEST_CHANGES" comment
          REVIEW_BODY=$(gh pr view "$PR" --json comments --jq '
            [.comments[] |
             select(.author.login == "claude" and
                    (.body | startswith("## Code Review - REQUEST_CHANGES")))] |
            last |
            .body
          ')

          if [[ -z "$REVIEW_BODY" ]]; then
            echo "ERROR: Could not find review comment"
            exit 1
          fi

          # Validate review body has expected structure
          if ! echo "$REVIEW_BODY" | head -1 | grep -q "^## Code Review - REQUEST_CHANGES"; then
            echo "ERROR: Review comment does not have expected header format"
            exit 1
          fi

          # Validate presence of Critical or Medium issues sections OR CI/test failures
          # REQUEST_CHANGES can be for code issues OR test failures
          HAS_CODE_ISSUES=$(echo "$REVIEW_BODY" | grep -qE "^### (Critical|Medium) Issues" && echo "true" || echo "false")
          HAS_CI_FAILURES=$(echo "$REVIEW_BODY" | grep -qiE "(test.*fail|mypy.*fail|ruff.*fail|black.*fail|CI.*fail|linter.*fail)" && echo "true" || echo "false")

          if [[ "$HAS_CODE_ISSUES" == "false" && "$HAS_CI_FAILURES" == "false" ]]; then
            echo "WARNING: Review has no Critical/Medium issues and no CI/test failures mentioned"
            echo "This may be a malformed review - skipping auto-fix"
            gh pr comment "$PR" --body "⚠️ **Review Agent**: Auto-fix skipped - review comment appears malformed (no Critical/Medium issues or CI failures found).

          @${{ vars.HUMAN_OWNER }} Please review manually."
            exit 1
          fi

          # If only CI failures (no code issues), skip auto-fix - developer must fix tests
          if [[ "$HAS_CODE_ISSUES" == "false" && "$HAS_CI_FAILURES" == "true" ]]; then
            echo "Review indicates CI/test failures only (no code issues)"
            echo "Auto-fix cannot resolve test failures - developer intervention required"

            ISSUE=$(gh pr view "$PR" --json body -q '.body' | sed -n 's/.*Closes #\([0-9]*\).*/\1/p' | head -1)

            if [[ -n "$ISSUE" ]]; then
              gh pr comment "$PR" --body "⚠️ **Review Agent**: Auto-fix skipped - review indicates CI/test failures only.

          Issue #$ISSUE has been set to 'In Progress' and assigned to developer-agent to fix test failures.

          Code issues were resolved, but tests are still failing. Developer must investigate and fix test failures."
            else
              gh pr comment "$PR" --body "⚠️ **Review Agent**: Auto-fix skipped - review indicates CI/test failures only.

          Developer must fix test failures before merge."
            fi
            exit 0
          fi

          # Use GitHub runner temp directory instead of /tmp for security
          FINDINGS_FILE="$RUNNER_TEMP/review-findings.txt"
          echo "$REVIEW_BODY" > "$FINDINGS_FILE"

          # Verify file was written correctly
          if [[ ! -f "$FINDINGS_FILE" ]]; then
            echo "ERROR: Failed to write review findings file"
            exit 1
          fi

          echo "findings_file=$FINDINGS_FILE" >> "$GITHUB_OUTPUT"
          echo "✓ Review findings extracted to $FINDINGS_FILE"

      - name: Verify PR is still open (if changes requested and not escalated)
        if: steps.parse_decision.outputs.decision == 'REQUEST_CHANGES' && steps.count.outputs.escalate == 'false'
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ steps.get_pr.outputs.pr_number }}"

          PR_STATE=$(gh pr view "$PR" --json state -q .state)

          if [[ "$PR_STATE" != "OPEN" ]]; then
            echo "ERROR: PR #$PR is no longer open (state: $PR_STATE)"
            echo "Aborting auto-fix to prevent push to deleted branch"
            exit 1
          fi

          echo "✓ PR is still open"

      - name: Run Claude Code to fix issues (if changes requested and not escalated)
        if: steps.parse_decision.outputs.decision == 'REQUEST_CHANGES' && steps.count.outputs.escalate == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DEVELOPER_AGENT_TOKEN }}
          claude_args: '--allowed-tools "Bash,Read,Write,Edit,Glob,Grep"'
          prompt: |
            You are the developer agent fixing code review issues for PR #${{ steps.get_pr.outputs.pr_number }}.

            ## Context

            - PR: #${{ steps.get_pr.outputs.pr_number }}
            - Issue: #${{ steps.get_issue.outputs.issue_number }}
            - Branch: ${{ steps.branch.outputs.branch_name }}
            - Review iteration: $((${{ steps.count.outputs.loop_count }} + 1))/3

            ## Review Findings

            The code review findings are in `${{ steps.findings.outputs.findings_file }}`. Read that file to see all the issues.

            ## Your Task

            Fix ALL Critical and Medium issues identified in the code review. DO NOT fix Minor issues (they are style/nits and don't block merge).

            ## Requirements

            1. Read and parse `${{ steps.findings.outputs.findings_file }}` to understand all Critical and Medium issues
            2. Fix each issue thoroughly with proper testing
            3. Run relevant tests to verify your fixes work
            4. Make a SINGLE commit with all fixes included
            5. Use this exact commit message format:
               ```
               fix: address code review findings (review loop $((${{ steps.count.outputs.loop_count }} + 1))) (#${{ steps.get_issue.outputs.issue_number }})
               ```
            6. Push the commit to update the PR

            ## Important Notes

            - You are already on the PR branch `${{ steps.branch.outputs.branch_name }}`
            - All fixes must be in ONE commit (not multiple commits)
            - After you push, the PR will be automatically re-reviewed
            - This is iteration $((${{ steps.count.outputs.loop_count }} + 1)) of maximum 3 loops

            Begin by reading the review findings file, then implement all the fixes.

      - name: Post completion comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REVIEW_AGENT_TOKEN }}
          script: |
            const pr_number = ${{ steps.get_pr.outputs.pr_number }};
            const decision = '${{ steps.parse_decision.outputs.decision }}';
            const escalate = '${{ steps.count.outputs.escalate }}';
            const loop_count = '${{ steps.count.outputs.loop_count }}';

            let body;
            if (decision === 'APPROVE') {
              body = '✅ **Review Agent**: PR merged successfully.\n\nHuman approved merge. Changes have been merged to release branch.';
            } else if (decision === 'REQUEST_CHANGES') {
              if (escalate === 'true') {
                body = '⚠️ **Review Agent**: Escalated after 3 review loops.\n\nHuman confirmed changes needed. 3 auto-fix attempts completed but issues persist. Manual intervention assigned to @${{ vars.HUMAN_OWNER }}.';
              } else {
                const next_iteration = parseInt(loop_count) + 1;
                body = `🔧 **Review Agent**: Auto-fix loop iteration ${next_iteration}/3 complete.\n\nHuman confirmed changes needed. Fixes have been pushed to branch. PR will be automatically re-reviewed shortly.`;
              }
            } else {
              body = '❌ **Review Agent**: Execution failed.\n\nCheck workflow logs for details.\n\n[View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: body
            });
