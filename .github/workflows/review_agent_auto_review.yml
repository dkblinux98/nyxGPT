name: Review Agent Auto-Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    if: >-
      ${{ vars.AGENTS_ENABLED == 'true'
          && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    env:
      GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Auth gh
        run: gh auth status

      - name: Write ephemeral config.ini (runner temp)
        shell: bash
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/mygpt-config.ini"

          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF

          echo "MYGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"
          echo "Wrote ephemeral config at $CFG"

      - name: Verify config loads
        shell: bash
        run: |
          set -euo pipefail
          bash -lc '
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            echo "config ok: $REPO_OWNER/$REPO_NAME project $PROJECT_OWNER#$PROJECT_NUMBER release=$RELEASE_BRANCH"
          '

      - name: Post review start comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REVIEW_AGENT_TOKEN }}
          script: |
            const pr_number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: '🔍 **Review Agent**: Auto-review workflow triggered.\n\nWaiting for CI checks to complete...\n\n[View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            });

      - name: Wait for CI checks
        id: ci_check
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"

          echo "::group::Waiting for CI checks on PR #$PR"

          # Poll for checks (excluding this review workflow) with timeout
          MAX_WAIT_SECONDS=1800  # 30 minutes
          POLL_INTERVAL=30
          ELAPSED=0

          while [[ $ELAPSED -lt $MAX_WAIT_SECONDS ]]; do
            # Get checks excluding this review workflow
            CHECKS=$(gh pr view "$PR" --json statusCheckRollup -q '.statusCheckRollup[] | select(.workflowName != "Review Agent Auto-Review") | {name: .name, status: .status, conclusion: .conclusion}')

            if [[ -z "$CHECKS" ]]; then
              echo "::notice::No other CI checks configured for this PR - treating as success"
              echo "ci_status=success" >> "$GITHUB_OUTPUT"
              break
            fi

            # Count pending checks (not COMPLETED)
            PENDING=$(echo "$CHECKS" | jq -s '[.[] | select(.status != "COMPLETED")] | length')

            if [[ "$PENDING" -eq 0 ]]; then
              echo "::notice::All CI checks completed"

              # Check if any failed
              FAILED=$(echo "$CHECKS" | jq -s '[.[] | select(.conclusion != "SUCCESS" and .conclusion != "SKIPPED" and .conclusion != null)] | length')

              if [[ "$FAILED" -eq 0 ]]; then
                echo "ci_status=success" >> "$GITHUB_OUTPUT"
                echo "::notice::All CI checks passed"
              else
                echo "ci_status=failed" >> "$GITHUB_OUTPUT"
                echo "::warning::Some CI checks failed"
              fi
              break
            fi

            echo "::notice::Waiting for $PENDING CI checks to complete... (${ELAPSED}s elapsed)"
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          if [[ $ELAPSED -ge $MAX_WAIT_SECONDS ]]; then
            echo "ci_status=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::CI checks timed out after 30 minutes"
          fi

          echo "::endgroup::"

      - name: Handle CI failure
        if: steps.ci_check.outputs.ci_status == 'failed'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REVIEW_AGENT_TOKEN }}
          script: |
            const pr_number = context.payload.pull_request.number;

            // Get linked issue from PR body
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });

            const body = pr.data.body || '';
            const match = body.match(/Closes #(\d+)/i);

            if (match) {
              const issue_number = match[1];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issue_number),
                body: `❌ **Review Agent**: CI checks failed on PR #${pr_number}\n\nIssue moved back to **In Progress** and assigned to @${{ vars.DEV_AGENT }} to fix.\n\n[View PR](https://github.com/${{ github.repository }}/pull/${pr_number})\n[View CI results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
              });
            }

            core.setFailed('CI checks failed - PR cannot be merged');

      - name: Set issue back to In Progress on CI failure
        if: steps.ci_check.outputs.ci_status == 'failed'
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"

          # Extract issue number from PR body - MUST contain "Closes #N" per project hygiene rules
          ISSUE=$(gh pr view "$PR" --json body -q '.body' | grep -oP 'Closes #\K\d+' || echo "")

          if [[ -z "$ISSUE" ]]; then
            echo "::error::PR #$PR body does not contain 'Closes #N' - cannot identify parent issue for CI failure handling"
            echo "::error::Review runbook requires all PRs link to issues via 'Closes #ISSUE' in PR body"
            exit 1
          fi

          echo "::group::Moving issue #$ISSUE back to In Progress"
          bash -lc "source scripts/agents/lib/gh_project.sh && load_config && set_issue_status $ISSUE '\$STATUS_IN_PROGRESS'"
          bash -lc "source scripts/agents/lib/gh_project.sh && load_config && issue_assign_only $ISSUE '\$DEV_AGENT'"
          echo "::notice::Issue #$ISSUE moved to In Progress"
          echo "::endgroup::"

      - name: Run Claude Code review
        if: steps.ci_check.outputs.ci_status == 'success'
        id: claude_review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.REVIEW_AGENT_TOKEN }}
          show_full_output: true
          claude_args: '--allowed-tools "Bash,Read,Write,Edit,Glob,Grep"'
          prompt: |
            Review PR #${{ github.event.pull_request.number }} according to the review-agent charter and runbook.

            IMPORTANT: CI checks have already been verified by the workflow. Do NOT wait for or check CI status.
            Do NOT run "gh pr checks" or similar commands - the workflow has already confirmed all CI checks passed.

            CRITICAL: You must ONLY perform the code review. DO NOT merge the PR or run review_accept_and_merge.sh.
            Instead, write your decision to a file that the workflow will read.

            Perform a comprehensive code review checking:

            From RUNBOOKS/review-runbook.md checklist:
            - Correctness vs issue acceptance criteria
            - Tests added/updated and meaningful
            - No architecture boundary violations
            - No secrets committed
            - Clear docs updates for user-facing changes
            - Reasonable maintainability

            Additional quality checks:
            - Code quality and best practices (from CLAUDE.md)
            - Performance considerations and potential bottlenecks
            - Security concerns beyond secret detection
            - Potential bugs or edge cases not covered by tests
            - API contract consistency and backward compatibility

            Severity model:
            - Critical: correctness/security/data-loss/performance regression (MUST block merge)
            - Medium: significant bug risk, missing tests, broken contract, poor maintainability (MUST block merge)
            - Minor: style/nits, minor optimization opportunities (may proceed)

            After your review, write your decision to /tmp/review-decision.json with this format:
            {
              "decision": "APPROVE" or "REQUEST_CHANGES",
              "pr_number": <pr_number>,
              "issue_number": <issue_number>,
              "summary": "<brief summary of findings>",
              "sub_issues": [
                {"title": "<title>", "body_file": "<path>"}
              ]
            }

            If Critical or Medium issues found:
            - Set decision to "REQUEST_CHANGES"
            - Create sub-issue body files in /tmp/sub-issue-*.md
            - List them in the sub_issues array
            - Include specific details for reproduction and resolution

            If no blocking issues:
            - Set decision to "APPROVE"
            - Provide detailed reasoning in summary

            The workflow will handle the actual merge or sub-issue creation based on your decision file.

      - name: Execute review decision
        if: steps.ci_check.outputs.ci_status == 'success' && (success() || failure())
        id: execute_decision
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"

          # Extract issue number from PR body
          ISSUE=$(gh pr view "$PR" --json body -q '.body' | grep -oP 'Closes #\K\d+' || echo "")

          if [[ -z "$ISSUE" ]]; then
            echo "::error::PR #$PR body does not contain 'Closes #N'"
            exit 1
          fi

          # Check if Claude Code produced a decision file
          if [[ ! -f "/tmp/review-decision.json" ]]; then
            echo "::warning::No review decision file found - Claude Code may have crashed before completing review"
            echo "::error::Review incomplete - manual intervention required"
            exit 1
          fi

          # Read decision
          DECISION=$(jq -r '.decision' /tmp/review-decision.json)
          SUMMARY=$(jq -r '.summary' /tmp/review-decision.json)

          echo "::group::Review Decision"
          echo "Decision: $DECISION"
          echo "Summary: $SUMMARY"
          echo "::endgroup::"

          if [[ "$DECISION" == "APPROVE" ]]; then
            echo "::notice::Review approved - executing merge"
            bash -lc "cd /home/runner/work/myGPT/myGPT && source scripts/agents/lib/gh_project.sh && load_config && bash scripts/agents/review_accept_and_merge.sh $PR $ISSUE"
            echo "merge_executed=true" >> "$GITHUB_OUTPUT"

          elif [[ "$DECISION" == "REQUEST_CHANGES" ]]; then
            echo "::notice::Changes requested - creating acceptance failure sub-issues"

            # Create each sub-issue
            SUB_ISSUE_COUNT=$(jq -r '.sub_issues | length' /tmp/review-decision.json)
            for i in $(seq 0 $((SUB_ISSUE_COUNT - 1))); do
              TITLE=$(jq -r ".sub_issues[$i].title" /tmp/review-decision.json)
              BODY_FILE=$(jq -r ".sub_issues[$i].body_file" /tmp/review-decision.json)

              if [[ ! -f "$BODY_FILE" ]]; then
                echo "::error::Sub-issue body file not found: $BODY_FILE"
                continue
              fi

              echo "Creating sub-issue: $TITLE"
              bash -lc "cd /home/runner/work/myGPT/myGPT && source scripts/agents/lib/gh_project.sh && load_config && bash scripts/agents/review_request_changes.sh $ISSUE '$TITLE' '$BODY_FILE'"
            done

            echo "changes_requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown decision: $DECISION"
            exit 1
          fi

      - name: Post review complete comment
        if: steps.ci_check.outputs.ci_status == 'success' && (success() || failure())
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REVIEW_AGENT_TOKEN }}
          script: |
            const pr_number = context.payload.pull_request.number;

            // Determine outcome based on execute_decision step
            const mergeExecuted = '${{ steps.execute_decision.outputs.merge_executed }}' === 'true';
            const changesRequested = '${{ steps.execute_decision.outputs.changes_requested }}' === 'true';
            const executeStepConclusion = '${{ steps.execute_decision.conclusion }}';

            let body;
            if (executeStepConclusion === 'failure') {
              body = '❌ **Review Agent**: Review failed to complete properly.\n\nManual intervention required. Check workflow logs for details.\n\n[View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            } else if (mergeExecuted) {
              body = '✅ **Review Agent**: Code review complete - PR merged.\n\nNo blocking issues found. PR has been merged to release branch.\n\n[View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            } else if (changesRequested) {
              body = '🔄 **Review Agent**: Changes requested.\n\nAcceptance failure sub-issues have been created. Check issue comments for details.\n\n[View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            } else {
              body = '⚠️ **Review Agent**: Review completed with unknown outcome.\n\nCheck workflow logs for details.\n\n[View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: body
            });
