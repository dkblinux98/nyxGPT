name: Review Agent Execute Decision

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  execute-review-decision:
    # Automated workflow - triggers on review decisions or manual override
    # Auto-triggers:
    #   - APPROVE decision: Auto-executes merge
    #   - REQUEST_CHANGES: Returns issue to developer-agent (In Progress)
    #     Developer fixes issues and pushes, triggering re-review
    #     After 3 review cycles, escalates to human
    # Manual triggers:
    #   - @approve-merge: Manual merge override
    #   - @request-changes: Manual request changes (returns to developer)
    #   - @send-to-developer: Send back to developer after escalation (human override)
    if: |
      (github.event_name == 'pull_request_review' &&
       github.event.pull_request &&
       (github.event.review.state == 'approved' ||
        github.event.review.state == 'changes_requested') &&
       github.event.review.user.login == vars.REVIEW_AGENT) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       ((github.event.comment.user.login == vars.HUMAN_OWNER &&
         (contains(github.event.comment.body, '@approve-merge') ||
          contains(github.event.comment.body, '@request-changes') ||
          contains(github.event.comment.body, '@send-to-developer'))) ||
        (contains(github.event.comment.body, 'nyxgpt-structured-review') &&
         github.event.comment.user.login == vars.REVIEW_AGENT)))
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    env:
      GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
      # #3695 human-channel (Slack DM) escalation notifications -- reused
      # from the secrets notify-merge-conflicts.yml already configures.
      # Absent/failing degrades gracefully to comment-only (see
      # notify_human_escalation, scripts/agents/lib/gh_project.sh).
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_USER_ID: ${{ secrets.SLACK_USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Auth gh
        run: gh auth status

      - name: Validate required secrets
        env:
          # #3837: a secret interpolated here is substituted as shell source;
          # read it as data instead. Presence is all this step checks.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REVIEW_AGENT_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}
        run: |
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is not configured"
            echo "::error::Configure it at: Settings → Secrets and variables → Actions → Secrets"
            exit 1
          fi

          if [[ -z "$REVIEW_AGENT_TOKEN" ]]; then
            echo "::error::REVIEW_AGENT_TOKEN secret is not configured"
            exit 1
          fi

          echo "✓ Required secrets validated"

      - name: Write ephemeral config.ini
        shell: bash
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"

          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          RELEASE_ISSUE_NUMBER=${{ vars.RELEASE_ISSUE_NUMBER }}
          SPRINT_AUTOPILOT=${{ vars.SPRINT_AUTOPILOT }}
          SPRINT_FIELD=${{ vars.SPRINT_FIELD }}
          EOF

          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"
          echo "Wrote ephemeral config at $CFG"

      - name: Verify config loads
        shell: bash
        run: |
          set -euo pipefail
          bash -lc '
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            echo "config ok: $REPO_OWNER/$REPO_NAME project $PROJECT_OWNER#$PROJECT_NUMBER release=$RELEASE_BRANCH"
          '

      - name: Get PR number from event
        id: get_pr
        shell: bash
        run: |
          set -euo pipefail

          # Get PR number from either pull_request_review or issue_comment event
          if [[ "${{ github.event_name }}" == "pull_request_review" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER="${{ github.event.issue.number }}"
          fi

          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::No PR number in event"
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Processing review for PR #$PR_NUMBER"

      - name: Verify PR head repo (fork guard)
        shell: bash
        env:
          PR: ${{ steps.get_pr.outputs.pr_number }}
        run: |
          set -euo pipefail

          # A merge decision (auto or manual) must never execute against a
          # fork PR: this job runs with contents/pull-requests/issues write
          # and REVIEW_AGENT_TOKEN, so a fork PR reaching the merge step
          # would let an external contributor's code land on the release
          # branch with no additional review.
          HEAD_REPO=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.head.repo.full_name')

          if [[ "$HEAD_REPO" != "${{ github.repository }}" ]]; then
            echo "::error::PR #$PR head repo ($HEAD_REPO) is not this repo -- refusing fork PR"
            exit 1
          fi

          echo "✓ PR #$PR head repo matches ${{ github.repository }}"

      - name: Parse decision from event
        id: parse_decision
        shell: bash
        env:
          REVIEW_STATE: ${{ github.event.review.state }}
          PR: ${{ steps.get_pr.outputs.pr_number }}
          COMMENT_CREATED: ${{ github.event.comment.created_at }}
          # Untrusted comment body passed via env, never interpolated into the
          # script body, so a crafted comment cannot break out of the heredoc
          # and inject shell (CodeQL alert #1: code injection).
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          echo "::group::Parsing decision"

          # Parse decision from structured review state or manual trigger commands
          # Auto triggers: pull_request_review with approved/changes_requested state from review agent
          # Manual triggers: @approve-merge, @request-changes, @send-to-developer in issue comments
          if [[ "${{ github.event_name }}" == "pull_request_review" ]]; then
            # Use structured review state instead of brittle text matching
            if [[ "$REVIEW_STATE" == "approved" ]]; then
              DECISION="APPROVE"
              TRIGGER_TYPE="auto"
              echo "::notice::Auto-approved by review agent (structured review state)"
            elif [[ "$REVIEW_STATE" == "changes_requested" ]]; then
              DECISION="REQUEST_CHANGES"
              TRIGGER_TYPE="auto"
              echo "::notice::Review agent requested changes (structured review state)"
            else
              echo "::error::Unexpected review state: $REVIEW_STATE"
              exit 1
            fi
          else
            COMMENT="${COMMENT_BODY:-}"
            if echo "$COMMENT" | grep -q 'nyxgpt-structured-review'; then
              # Fallback trigger: the structured-review comment the review
              # workflow persists after every review. The primary trigger is
              # the pull_request_review event, but that event only fires when
              # the review submission propagates (reviews posted under the
              # workflow's own GITHUB_TOKEN never trigger downstream
              # workflows) -- several stalled cycles came from exactly that.
              DECISION=$(echo "$COMMENT" | grep -o '"decision":"[A-Z_]*"' | head -1 | cut -d'"' -f4 || true)
              TRIGGER_TYPE="auto"
              if [[ "$DECISION" != "APPROVE" && "$DECISION" != "REQUEST_CHANGES" ]]; then
                echo "::error::Structured review comment carried unexpected decision: '$DECISION'"
                exit 1
              fi
              # Dedup against the primary path: if the pull_request_review
              # event DID fire for this same review, it executes the same
              # decision in parallel. Give it a head start, then check for
              # its footprint; if found, no-op (ALREADY_HANDLED matches no
              # downstream step condition).
              sleep 75
              if [[ "$DECISION" == "APPROVE" ]]; then
                STATE=$(gh api "repos/${{ github.repository }}/pulls/$PR" \
                  --jq 'if .merged then "MERGED" else (.state | ascii_upcase) end' || echo "")
                if [[ "$STATE" == "MERGED" ]]; then
                  DECISION="ALREADY_HANDLED"
                  echo "::notice::PR #$PR already merged by the pull_request_review path; skipping"
                fi
              else
                # Footprint check shared with the dispatch-mode backstop
                # (lib/review_handoff.py HANDOFF_MARKERS). It must cover the
                # huddle trigger too: this check used to look only for the
                # return-to-developer and escalation footprints, so a huddle
                # round left no footprint here and both paths posted a
                # HUDDLE_TRIGGERED -- two dev-position runs, two mediations
                # (#3736, PR #3728 2026-08-11).
                # --jq runs once per fetched page -- stream matching comments
                # across all pages first, then slurp (see AGENTS.md).
                # The thread is piped, never passed in argv: a long thread
                # serializes to hundreds of KB and a single execve argument
                # is capped at MAX_ARG_STRLEN (128KB), so `jq -n --argjson
                # comments "$JSON"` dies with "Argument list too long" on
                # exactly the contentious threads this step must govern.
                HANDLED_FLAG=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
                  --paginate --jq '.[]' | jq -s '{comments: .}' \
                  | python3 "$GITHUB_WORKSPACE/scripts/agents/lib/review_handoff.py" \
                      handoff-recorded "$COMMENT_CREATED")
                if [[ "$HANDLED_FLAG" == "true" ]]; then
                  DECISION="ALREADY_HANDLED"
                  echo "::notice::REQUEST_CHANGES for PR #$PR already executed by the pull_request_review path; skipping"
                fi
              fi
              echo "::notice::Structured-review comment fallback path (decision: $DECISION)"
            elif echo "$COMMENT" | grep -qE '^\s*@approve-merge\s*$'; then
              DECISION="APPROVE"
              TRIGGER_TYPE="manual"
              echo "::notice::Human approved merge"
            elif echo "$COMMENT" | grep -qE '^\s*@request-changes\s*$'; then
              DECISION="REQUEST_CHANGES"
              TRIGGER_TYPE="manual"
              echo "::notice::Human requested changes"
            elif echo "$COMMENT" | grep -qE '^\s*@send-to-developer\s*$'; then
              DECISION="SEND_TO_DEVELOPER"
              TRIGGER_TYPE="manual"
              echo "::notice::Human sending PR back to developer"
            else
              echo "::error::No valid trigger phrase found"
              echo "::error::Expected: @approve-merge, @request-changes, or @send-to-developer"
              exit 1
            fi
          fi

          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "trigger_type=$TRIGGER_TYPE" >> "$GITHUB_OUTPUT"
          echo "Decision: $DECISION (trigger: $TRIGGER_TYPE)"

          echo "::endgroup::"

      - name: Extract issue number from PR
        id: get_issue
        shell: bash
        env:
          PR: ${{ steps.get_pr.outputs.pr_number }}
        run: |
          set -euo pipefail

          ISSUE=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.body // ""' | sed -n 's/.*Closes #\([0-9]*\).*/\1/p' | head -1)

          if [[ -z "$ISSUE" ]]; then
            echo "::error::PR #$PR body does not contain 'Closes #N'"
            exit 1
          fi

          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "Found issue #$ISSUE"

      - name: Execute merge (if approved)
        if: steps.parse_decision.outputs.decision == 'APPROVE'
        shell: bash
        env:
          PR: ${{ steps.get_pr.outputs.pr_number }}
          ISSUE: ${{ steps.get_issue.outputs.issue_number }}
        run: |
          set -euo pipefail

          echo "::notice::Approved - executing merge"
          bash -lc "cd '$GITHUB_WORKSPACE' && \
            source scripts/agents/lib/gh_project.sh && \
            load_config && \
            bash scripts/agents/review_accept_and_merge.sh '$PR' '$ISSUE'"

      - name: Count review iterations and classify disagreement (if changes requested)
        if: steps.parse_decision.outputs.decision == 'REQUEST_CHANGES'
        id: count
        shell: bash
        env:
          PR: ${{ steps.get_pr.outputs.pr_number }}
        run: |
          set -euo pipefail

          # Routing is not computed here: lib/review_handoff.py's plan_round
          # is the single decision for both this workflow and the
          # dispatch-mode backstop (review_ensure_handoff.sh), so the two can
          # never disagree (#3704, #3687). It combines the cumulative
          # REQUEST_CHANGES count, the a/b/c disagreement classification the
          # review agent posted in its latest nyxgpt-structured-review
          # comment, and -- since #3736 -- the state of the huddle:
          #
          #   * huddle pending (triggered, no decision yet) -> action "none".
          #     Nothing fires, which is also what stops a second run of the
          #     same verdict from posting a duplicate trigger.
          #   * huddle decided proceed/change-approach/descope -> the cycle
          #     counter is re-armed, so the round runs the fix cycle the
          #     decision called for instead of the 3-cycle escalation that
          #     used to race it (PR #3733, 2026-08-12).
          #   * huddle escalated -> the mediation already handed off to the
          #     owner; this path stays quiet.
          #
          # Both endpoints are paginated: --jq runs once per fetched page, so
          # matching objects are streamed first and slurped after (AGENTS.md).
          REVIEW_AGENT="${{ vars.REVIEW_AGENT }}"
          REVIEWS_JSON=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" \
            --paginate --jq '.[]' | jq -s '.')
          COMMENTS_JSON=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
            --paginate --jq '.[]' | jq -s '.')

          # The two payloads are joined by `printf`, a bash *builtin*, so the
          # thread never crosses an execve boundary. `jq -n --argjson reviews
          # "$REVIEWS_JSON" ...` would: jq is an external binary and a single
          # argument is capped at MAX_ARG_STRLEN (128KB), so a long thread
          # fails the step with "Argument list too long" -- and the threads
          # that reach three cycles, a huddle or an escalation are precisely
          # the long ones (incident PR #3728 is already at ~96KB of comment
          # JSON). A step that dies here never executes the REQUEST_CHANGES
          # verdict, i.e. the stall this issue exists to remove.
          PLAN=$(printf '{"reviews":%s,"comments":%s}' "$REVIEWS_JSON" "$COMMENTS_JSON" \
            | python3 "$GITHUB_WORKSPACE/scripts/agents/lib/review_handoff.py" \
                plan-round "$REVIEW_AGENT")
          echo "$PLAN"

          action=""; route=""; escalate_reason=""; disagreement_type=""
          request_changes_count=""; effective_count=""; loop_number=""
          huddle_decision=""; huddle_pending=""; reason=""
          eval "$PLAN"

          echo "loop_count=$effective_count" >> "$GITHUB_OUTPUT"
          echo "total_count=$request_changes_count" >> "$GITHUB_OUTPUT"
          echo "disagreement_type=$disagreement_type" >> "$GITHUB_OUTPUT"
          echo "huddle_decision=$huddle_decision" >> "$GITHUB_OUTPUT"
          echo "route=$route" >> "$GITHUB_OUTPUT"

          case "$action" in
            escalate)
              echo "escalate=true" >> "$GITHUB_OUTPUT"
              echo "escalate_reason=$escalate_reason" >> "$GITHUB_OUTPUT"
              echo "huddle=false" >> "$GITHUB_OUTPUT"
              ;;
            huddle)
              echo "escalate=false" >> "$GITHUB_OUTPUT"
              echo "escalate_reason=" >> "$GITHUB_OUTPUT"
              echo "huddle=true" >> "$GITHUB_OUTPUT"
              ;;
            return_to_developer)
              echo "escalate=false" >> "$GITHUB_OUTPUT"
              echo "escalate_reason=" >> "$GITHUB_OUTPUT"
              echo "huddle=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # "none" -- the huddle owns this round (pending or escalated).
              echo "escalate=false" >> "$GITHUB_OUTPUT"
              echo "escalate_reason=" >> "$GITHUB_OUTPUT"
              echo "huddle=false" >> "$GITHUB_OUTPUT"
              echo "defer=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Deferring to the huddle protocol on PR #$PR (route=$route) -- no loop, no escalation"
              ;;
          esac

      - name: Escalate to human (if 3+ loops, or immediately on spec ambiguity)
        if: steps.parse_decision.outputs.decision == 'REQUEST_CHANGES' && steps.count.outputs.escalate == 'true'
        shell: bash
        env:
          PR: ${{ steps.get_pr.outputs.pr_number }}
          ISSUE: ${{ steps.get_issue.outputs.issue_number }}
          REASON: ${{ steps.count.outputs.escalate_reason }}
        run: |
          set -euo pipefail

          echo "::group::Escalating to human ($REASON)"

          # Escalate at most once per event (#3736). The two trigger paths
          # (pull_request_review and the structured-comment fallback) raced
          # on PR #3733 and each ran the whole escalation, so the owner got
          # two escalation comments per run, twice over. The fallback's own
          # dedupe is timing-based (it sleeps, then looks for a footprint);
          # this is the state-based backstop right before the irreversible
          # part -- if an escalation for this review round is already on the
          # thread, this run stands down instead of repeating it.
          ALREADY=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
            --paginate --jq '.[]' | jq -s '{comments: .}' \
            | python3 "$GITHUB_WORKSPACE/scripts/agents/lib/huddle_state.py" escalation-recorded)
          if [[ "$ALREADY" == "true" ]]; then
            echo "::notice::PR #$PR already carries an escalation for this review round -- skipping duplicate escalation"
            echo "::endgroup::"
            exit 0
          fi

          # Keep issue in "In Review" status and assign to human owner.
          # Verified + retried (not a bare issue_assign_only call) because
          # escalation exists specifically to hand off to the human — a
          # silently-failed assignment here means nobody ever finds out the
          # PR needs attention (#3332).
          ASSIGN_OK=1
          bash -lc "cd '$GITHUB_WORKSPACE' && \
            source scripts/agents/lib/gh_project.sh && \
            load_config && \
            require_gh_auth && \
            assign_issue_verified '$ISSUE' \"\$HUMAN_OWNER\"" || ASSIGN_OK=0

          if [[ "$ASSIGN_OK" != "1" ]]; then
            echo "::error::Could not verify issue #${ISSUE} was assigned to" \
              "@${{ vars.HUMAN_OWNER }} on escalation ($REASON) — it may still show" \
              "@${{ vars.REVIEW_AGENT }} as assignee. Manual fix:" \
              "gh issue edit ${ISSUE} --add-assignee ${{ vars.HUMAN_OWNER }}"
          fi

          # Assign PR to human owner
          gh pr edit "$PR" --add-assignee "${{ vars.HUMAN_OWNER }}"

          # Post escalation comment. Wording depends on why (#3687): the
          # 3-cycle outer breaker is unchanged (cycle_limit), but a type-(c)
          # spec-ambiguity classification escalates at cycle zero -- no
          # agent conversation can resolve what only the PM knows, so it
          # never gets to loop first.
          HUMAN_OWNER="${{ vars.HUMAN_OWNER }}"
          REPO="${{ github.repository }}"
          if [[ "$REASON" == "spec_ambiguity" ]]; then
            BODY=$(printf '%s\n\n%s\n\n%s\n%s\n%s\n\n%s' \
              "⚠️ **Review Agent**: Escalated immediately — spec ambiguity (#3687 huddle protocol, type c)" \
              "@${HUMAN_OWNER} The review agent classified this REQUEST_CHANGES round as a spec ambiguity: the issue itself is unclear, or resolving it needs owner authority no agent conversation can supply. Escalating at cycle zero rather than looping." \
              "**Status:**" \
              "- Issue #${ISSUE} remains in **In Review** status" \
              "- Issue and PR assigned to you for a scope/spec decision" \
              "[View all review comments](https://github.com/${REPO}/pull/${PR})")
          else
            BODY=$(printf '%s\n\n%s\n\n%s\n%s\n%s\n%s\n\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n\n%s' \
              "⚠️ **Review Agent**: Escalated after 3 review cycles" \
              "@${HUMAN_OWNER} This PR has gone through 3 review cycles with requested changes, but issues persist." \
              "**Review History:**" \
              "- 3 code reviews completed with REQUEST_CHANGES" \
              "- Developer made fixes after each review" \
              "- Issues still remain after 3 cycles" \
              "**Status:**" \
              "- Issue #${ISSUE} remains in **In Review** status" \
              "- Issue and PR assigned to you for manual review" \
              "- You can either:" \
              "  - Manually review and merge if acceptable" \
              "  - Provide specific guidance to developer" \
              "  - Close PR if not viable" \
              "[View all review comments](https://github.com/${REPO}/pull/${PR})")
          fi
          gh pr comment "$PR" --body "$BODY"

          # #3695: human-visible channel outside GitHub threads for this
          # terminal outcome -- the GitHub comment above already carries the
          # full escalation, this is additive (Slack DM, best-effort).
          if [[ "$REASON" == "spec_ambiguity" ]]; then
            NOTIFY_DIAGNOSIS="Review agent classified a REQUEST_CHANGES round on PR #$PR as spec ambiguity -- the issue is unclear, or needs owner authority no agent conversation can supply."
          else
            NOTIFY_DIAGNOSIS="PR #$PR has gone through 3 review cycles with requested changes and issues still remain."
          fi
          NOTIFY_ACTION="Review PR #$PR: merge if acceptable, give the developer specific guidance, or close it."

          # Sprint-autopilot continuation kick: only merges used to post
          # READY_FOR_NEXT_ISSUE, so an escalation starved dispatch even
          # though nothing was blocked. The reviewer has handed this PR to
          # the owner — post the same gated kick a merge posts (identical
          # SPRINT_AUTOPILOT / pause / release-drained checks) so the queue
          # continues with other work. Best-effort: neither the kick nor the
          # notification failing blocks the escalation itself.
          bash -lc "cd '$GITHUB_WORKSPACE' && \
            source scripts/agents/lib/gh_project.sh && \
            load_config && \
            require_gh_auth && \
            sprint_autopilot_kick '$ISSUE' escalated && \
            notify_human_escalation '$ISSUE' 'review-escalation' '$NOTIFY_DIAGNOSIS' '$NOTIFY_ACTION' '$ISSUE:review_escalation'" \
            || echo "::warning::Sprint-autopilot kick / human notification after escalation failed for issue #${ISSUE} — escalation itself is unaffected."

          echo "::endgroup::"

          if [[ "$ASSIGN_OK" != "1" ]]; then
            echo "✗ Escalation comment posted, but issue assignment could not be verified — see ::error:: above"
            exit 1
          fi

          echo "✓ Escalation complete - issue kept in 'In Review', assigned to human"
          exit 0

      - name: Return to developer (if changes requested and not escalated or huddling)
        if: steps.parse_decision.outputs.decision == 'REQUEST_CHANGES' && steps.count.outputs.escalate == 'false' && steps.count.outputs.huddle == 'false' && steps.count.outputs.defer != 'true'
        shell: bash
        env:
          PR: ${{ steps.get_pr.outputs.pr_number }}
          ISSUE: ${{ steps.get_issue.outputs.issue_number }}
          LOOP_COUNT: ${{ steps.count.outputs.loop_count }}
        run: |
          set -euo pipefail

          echo "::group::Returning issue #$ISSUE to developer"

          # Set issue status to "In Progress" and assign to developer-agent (with workflow trigger)
          bash -lc "cd '$GITHUB_WORKSPACE' && \
            source scripts/agents/lib/gh_project.sh && \
            load_config && \
            require_gh_auth && \
            set_issue_status '$ISSUE' \"\$STATUS_IN_PROGRESS\" && \
            assign_and_trigger_developer '$ISSUE'"

          # #3837: substituting the output straight into $(( )) made it
          # arithmetic *source* -- non-numeric text is evaluated there, and
          # bash arithmetic expansion recurses into variable names.
          LOOP_NUM=$((LOOP_COUNT + 1))

          # Post comment to PR explaining what needs to be fixed
          DEV_AGENT="${{ vars.DEV_AGENT }}"
          HUMAN_OWNER="${{ vars.HUMAN_OWNER }}"
          BODY=$(printf '%s\n\n%s\n\n%s\n%s\n%s\n%s\n%s\n%s\n\n%s' \
            "🔄 **Review Agent**: Changes requested (review loop ${LOOP_NUM}/3)" \
            "Issue #${ISSUE} has been returned to **In Progress** and assigned to @${DEV_AGENT}." \
            "**Developer Instructions:**" \
            "1. Read the code review comment above to understand what needs to be fixed" \
            "2. Implement the necessary changes" \
            "3. Run all tests locally and fix any test failures (3-try loop)" \
            "4. Commit and push your fixes" \
            "5. The PR will be automatically re-reviewed" \
            "**Note:** This is review iteration ${LOOP_NUM} of 3." \
            "After 3 review cycles, the issue will be escalated to @${HUMAN_OWNER}.")
          gh pr comment "$PR" --body "$BODY"

          echo "::endgroup::"
          echo "✓ Issue returned to developer-agent, auto-fix triggered"

      - name: Trigger huddle (judgment call, or 2nd failed verifiable-defect cycle)
        if: steps.parse_decision.outputs.decision == 'REQUEST_CHANGES' && steps.count.outputs.huddle == 'true'
        shell: bash
        env:
          PR: ${{ steps.get_pr.outputs.pr_number }}
          ISSUE: ${{ steps.get_issue.outputs.issue_number }}
          DTYPE: ${{ steps.count.outputs.disagreement_type }}
        run: |
          set -euo pipefail
          DEV_AGENT="${{ vars.DEV_AGENT }}"

          echo "::group::Triggering huddle for issue #$ISSUE (type $DTYPE)"

          # At most one huddle per review round (#3736). The routing step
          # already refuses to route a round that has a trigger on it, but
          # the two trigger paths of this workflow can be minutes apart, so
          # the state is re-read here, immediately before posting. A trigger
          # that slips through both checks is still absorbed downstream:
          # huddle_session.yml's `gate` job stands the run down unless its
          # trigger comment is the round's *first* marker comment (#3911).
          TRIGGERED=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
            --paginate --jq '.[]' | jq -s '{comments: .}' \
            | python3 "$GITHUB_WORKSPACE/scripts/agents/lib/huddle_state.py" status \
            | sed -n 's/^triggered=//p')
          if [[ "$TRIGGERED" == "true" ]]; then
            echo "::notice::A huddle is already open for this review round on PR #$PR -- not triggering a second one"
            echo "::endgroup::"
            exit 0
          fi

          if [[ "$DTYPE" == "b" ]]; then
            REASON_LINE="This is a **judgment call** (design/approach disagreement) -- those never loop through another blind fix cycle, they go straight to a huddle."
          else
            REASON_LINE="This is the **2nd** REQUEST_CHANGES cycle for a verifiable defect that still hasn't converged -- instead of a 3rd blind retry, the team huddles first."
          fi

          # Not another auto-fix dispatch: the huddle needs the dev agent's
          # *position* (what it believes the problem is, what was tried,
          # what it proposes), not another attempted patch. The review
          # agent's position is the code review comment already posted
          # above on this PR. HUDDLE_TRIGGERED is the marker
          # huddle_session.yml listens for.
          #
          # This body is read by a memoryless developer turn a few minutes
          # from now, so it must describe the flow that actually runs: since
          # #3911 the turns are written to the huddle thread by the workflow
          # and nobody posts a position comment here. The old wording told
          # the dev agent to post one and promised a separate mediation run,
          # both of which would now contradict the turn's own prompt.
          BODY=$(printf '%s\n\n%s\n\n%s\n%s\n%s\n%s\n\n%s' \
            "🤝 **Review Agent**: Huddle triggered" \
            "$REASON_LINE" \
            "**Review position:** see the code review comment above on this PR -- that is the review agent's position." \
            "**What happens now:** the huddle runs as a single workflow run (#3911) -- a developer turn and a review turn per round, up to the round cap, then the scrummaster's decision. Each turn is posted to the huddle thread by the workflow under its own agent identity; no position comment is posted here, and nothing is expected of @${DEV_AGENT} until the decision lands. That decision arrives on this PR as a short summary with the machine-readable decision line, plus the full transcript in a collapsed block." \
            "Issue #${ISSUE} stays in **In Review** status pending the huddle decision." \
            "See agents/runbooks/review-runbook.md for the huddle protocol (#3687)." \
            "HUDDLE_TRIGGERED")
          gh pr comment "$PR" --body "$BODY"

          echo "::endgroup::"
          echo "✓ Huddle triggered for issue #${ISSUE} -- huddle_session.yml takes it from here"

      - name: Send to developer (human override after escalation)
        if: steps.parse_decision.outputs.decision == 'SEND_TO_DEVELOPER'
        shell: bash
        env:
          PR: ${{ steps.get_pr.outputs.pr_number }}
          ISSUE: ${{ steps.get_issue.outputs.issue_number }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail

          echo "::group::Human override: sending issue #$ISSUE back to developer"

          # Set issue status to "In Progress" and assign to developer-agent (with workflow trigger)
          bash -lc "cd '$GITHUB_WORKSPACE' && \
            source scripts/agents/lib/gh_project.sh && \
            load_config && \
            require_gh_auth && \
            set_issue_status '$ISSUE' \"\$STATUS_IN_PROGRESS\" && \
            assign_and_trigger_developer '$ISSUE'"

          # Post comment to PR explaining human override
          DEV_AGENT="${{ vars.DEV_AGENT }}"
          HUMAN_OWNER="${{ vars.HUMAN_OWNER }}"
          BODY=$(printf '%s\n\n%s\n\n%s\n%s\n%s\n%s\n%s\n%s' \
            "👤 **Human Override by @${COMMENTER}**: Sent back to developer" \
            "Issue #${ISSUE} has been returned to **In Progress** and assigned to @${DEV_AGENT}." \
            "**Developer Instructions:**" \
            "1. Review the feedback from @${COMMENTER} above" \
            "2. Address all identified issues" \
            "3. Run all tests locally and ensure they pass" \
            "4. Commit and push your fixes" \
            "5. The PR will be automatically re-reviewed")
          gh pr comment "$PR" --body "$BODY"

          echo "::endgroup::"
          echo "✓ Issue sent to developer-agent by human override"

      # Merge-only (#3736). This step used to post a second escalation
      # comment restating the one the escalation step had already posted,
      # so every escalation arrived as a pair -- and when the two trigger
      # paths raced, as two pairs (PR #3733, 2026-08-12). The escalation
      # step's comment is the record; nothing is added by echoing it.
      - name: Post completion comment
        if: always() && steps.parse_decision.outputs.decision == 'APPROVE'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.get_pr.outputs.pr_number }}
          DECISION: ${{ steps.parse_decision.outputs.decision }}
        with:
          github-token: ${{ secrets.REVIEW_AGENT_TOKEN }}
          script: |
            const pr_number = Number(process.env.PR_NUMBER);
            const decision = process.env.DECISION;

            let body;
            if (decision === 'APPROVE') {
              // The merge script can succeed (exit 0) without merging -- e.g.
              // an approved-but-conflicted PR dispatches an automated
              // conflict-resolution round instead (#3479). Verify the PR is
              // actually merged before claiming so; when it isn't, the merge
              // script's own comments (conflict dispatch / failure detail)
              // are the accurate record, so post nothing here.
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr_number,
              });
              if (!pr.data.merged) {
                core.notice(`PR #${pr_number} approved but not merged (conflict dispatch or merge failure) -- skipping the merged-success comment.`);
                return;
              }
              body = '✅ **Review Agent**: Code review approved and PR merged.\n\n' +
                     'Changes have been merged to release branch.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: body
            });
