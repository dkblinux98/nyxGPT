name: Review Agent Execute Decision

on:
  issue_comment:
    types: [created]

jobs:
  execute-review-decision:
    # Only run if comment is on a PR and contains human approval trigger
    # NOTE: We use simple 'contains' here for quick filtering, then validate with regex in parse_decision step
    # This prevents workflow from running on unrelated comments while still catching valid triggers
    if: |
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '@approve-merge') || contains(github.event.comment.body, '@request-changes'))
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    env:
      GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Auth gh
        run: gh auth status

      - name: Write ephemeral config.ini
        shell: bash
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/mygpt-config.ini"

          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          EOF

          echo "MYGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"
          echo "Wrote ephemeral config at $CFG"

      - name: Verify config loads
        shell: bash
        run: |
          set -euo pipefail
          bash -lc '
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            echo "config ok: $REPO_OWNER/$REPO_NAME project $PROJECT_OWNER#$PROJECT_NUMBER release=$RELEASE_BRANCH"
          '

      - name: Get PR number from comment event
        id: get_pr
        shell: bash
        run: |
          set -euo pipefail

          # Get PR number from issue_comment event
          PR_NUMBER="${{ github.event.issue.number }}"

          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::No PR number in issue_comment event"
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Processing review for PR #$PR_NUMBER"

      - name: Parse human decision from comment
        id: parse_decision
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Parsing human decision"

          # Get comment body from event - use heredoc to safely handle special chars
          COMMENT=$(cat <<'COMMENT_EOF'
          ${{ github.event.comment.body }}
          COMMENT_EOF
          )

          # Parse decision from human trigger phrase
          # CRITICAL: Match only when trigger appears on its own line (not in example text or code blocks)
          # This prevents false triggers when review comments discuss the commands
          if echo "$COMMENT" | grep -qE '^\s*@approve-merge\s*$'; then
            DECISION="APPROVE"
            echo "::notice::Human approved merge"
          elif echo "$COMMENT" | grep -qE '^\s*@request-changes\s*$'; then
            DECISION="REQUEST_CHANGES"
            echo "::notice::Human requested changes"
          else
            echo "::error::No valid trigger phrase found (@approve-merge or @request-changes on own line)"
            exit 1
          fi

          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "Decision: $DECISION"

          echo "::endgroup::"

      - name: Extract issue number from PR
        id: get_issue
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ steps.get_pr.outputs.pr_number }}"

          ISSUE=$(gh pr view "$PR" --json body -q '.body' | sed -n 's/.*Closes #\([0-9]*\).*/\1/p' | head -1)

          if [[ -z "$ISSUE" ]]; then
            echo "::error::PR #$PR body does not contain 'Closes #N'"
            exit 1
          fi

          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"
          echo "Found issue #$ISSUE"

      - name: Execute merge (if approved)
        if: steps.parse_decision.outputs.decision == 'APPROVE'
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ steps.get_pr.outputs.pr_number }}"
          ISSUE="${{ steps.get_issue.outputs.issue_number }}"

          echo "::notice::Human approved merge - executing merge"
          bash -lc "cd '$GITHUB_WORKSPACE' && source scripts/agents/lib/gh_project.sh && load_config && bash scripts/agents/review_accept_and_merge.sh '$PR' '$ISSUE'"

      - name: Find review-agent's review comment (if changes requested)
        if: steps.parse_decision.outputs.decision == 'REQUEST_CHANGES'
        id: find_review
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ steps.get_pr.outputs.pr_number }}"

          echo "::notice::Finding review-agent's review comment on PR #$PR"

          # Get all comments on this PR, find most recent from REVIEW_AGENT starting with "## Code Review"
          REVIEW_COMMENT=$(gh pr view "$PR" --json comments --jq '.comments[] | select(.author.login == "${{ vars.REVIEW_AGENT }}" and (.body | startswith("## Code Review"))) | .body' | tail -1)

          if [[ -z "$REVIEW_COMMENT" ]]; then
            echo "::error::Could not find review comment from @${{ vars.REVIEW_AGENT }}"
            echo "::error::Human requested changes, but no review comment found to parse issues from"
            exit 1
          fi

          # Save review comment to file for parsing (use RUNNER_TEMP for security)
          echo "$REVIEW_COMMENT" > "$RUNNER_TEMP/review-comment.txt"
          echo "review_file=$RUNNER_TEMP/review-comment.txt" >> "$GITHUB_OUTPUT"
          echo "::notice::Found review comment from @${{ vars.REVIEW_AGENT }}"

      - name: Create sub-issues (if changes requested)
        if: steps.parse_decision.outputs.decision == 'REQUEST_CHANGES'
        shell: bash
        run: |
          set -euo pipefail
          ISSUE="${{ steps.get_issue.outputs.issue_number }}"

          echo "::notice::Human confirmed changes requested - parsing sub-issues from review comment"

          # Parse Critical and Medium issues from the review comment
          REVIEW_COMMENT=$(cat "${{ steps.find_review.outputs.review_file }}")

          # Extract Critical Issues section
          CRITICAL_SECTION=$(echo "$REVIEW_COMMENT" | sed -n '/### Critical Issues/,/### Medium Issues\|### Minor Issues\|### Decision/p' | grep '^\- \*\*' || echo "")

          # Extract Medium Issues section
          MEDIUM_SECTION=$(echo "$REVIEW_COMMENT" | sed -n '/### Medium Issues/,/### Minor Issues\|### Decision/p' | grep '^\- \*\*' || echo "")

          # Combine Critical and Medium issues
          BLOCKING_ISSUES=$(echo -e "$CRITICAL_SECTION\n$MEDIUM_SECTION" | grep '^\- \*\*' || echo "")

          if [[ -z "$BLOCKING_ISSUES" ]]; then
            echo "::error::REQUEST_CHANGES decision but no Critical/Medium issues found in review comment"
            exit 1
          fi

          # Create a sub-issue for each blocking issue
          echo "$BLOCKING_ISSUES" | while IFS= read -r line; do
            if [[ -z "$line" ]]; then continue; fi

            # Extract title from **Title**: format
            TITLE=$(echo "$line" | sed -n 's/^- \*\*\(.*\)\*\*:.*/\1/p')
            DESCRIPTION=$(echo "$line" | sed -n 's/^- \*\*.*\*\*: \(.*\)/\1/p')

            if [[ -z "$TITLE" ]]; then
              echo "::warning::Could not parse title from: $line"
              continue
            fi

            # Create body file for sub-issue - use timestamp to avoid filename length issues
            # Use RUNNER_TEMP for security instead of /tmp
            BODY_FILE="$RUNNER_TEMP/sub-issue-${ISSUE}-$(date +%s%N).md"
            cat > "$BODY_FILE" <<EOFBODY
          ## Acceptance Failure

          From code review of parent issue #${ISSUE}

          ### Issue
          ${DESCRIPTION}

          ### How to Fix
          See code review comment for details and specific file/line references.

          ### Parent Issue
          Issue ${ISSUE}
          EOFBODY

            echo "Creating sub-issue: $TITLE"
            bash -lc "cd '$GITHUB_WORKSPACE' && source scripts/agents/lib/gh_project.sh && load_config && bash scripts/agents/review_request_changes.sh '$ISSUE' '$TITLE' '$BODY_FILE'"
          done

      - name: Post completion comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.REVIEW_AGENT_TOKEN }}
          script: |
            const pr_number = ${{ steps.get_pr.outputs.pr_number }};
            const decision = '${{ steps.parse_decision.outputs.decision }}';

            let body;
            if (decision === 'APPROVE') {
              body = '✅ **Review Agent**: PR merged successfully.\n\nHuman approved merge. Changes have been merged to release branch.';
            } else if (decision === 'REQUEST_CHANGES') {
              body = '🔄 **Review Agent**: Changes requested.\n\nHuman confirmed changes needed. Acceptance failure sub-issues have been created for Critical/Medium findings. Issue assigned back to developer-agent.';
            } else {
              body = '❌ **Review Agent**: Execution failed.\n\nCheck workflow logs for details.\n\n[View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: body
            });
