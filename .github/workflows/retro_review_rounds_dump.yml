name: Retro Dashboard - Dump Review Rounds

# Derives review-round detail (rounds per PR, Critical/Medium/Minor finding
# titles, issue/PR linkage) from GitHub pull-request reviews and publishes
# scripts/retrospective/data/{reviews_final,dashboard_data}.json to the retro
# data branch. Replaces the Gmail notification-email parse (owner
# decision 2026-08-08, #3667) — the review agent posts every review round as a
# PR review, so this is queryable via the GitHub API instead of a personal
# mailbox. Read-only against GitHub; writes only the two JSON snapshots. Used
# by the owner's retrospective dashboard.
#
# The snapshots do NOT get pushed at the dispatching branch: the default
# branch's ruleset requires a pull request, and the direct push was rejected
# with GH013 (#3815). publish_data_branch.sh puts them on claude/retro-data
# and retro_data_merge.yml lands them through an auto-merged PR.

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Dump review rounds
        env:
          GH_TOKEN: ${{ secrets.SCRUMMASTER_AGENT_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/retrospective/dump_review_rounds.py

      - name: Publish snapshot to the retro data branch
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          scripts/retrospective/publish_data_branch.sh \
            "chore(retro): refresh review-rounds snapshot" \
            scripts/retrospective/data/reviews_final.json \
            scripts/retrospective/data/dashboard_data.json
