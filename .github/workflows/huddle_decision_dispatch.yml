name: Huddle Decision Dispatch

# #3736: execute a huddle decision's "what happens next".
#
# The #3687 protocol ends with the scrummaster posting a `## Huddle Decision`
# comment -- from `scrummaster_huddle_mediation.yml` when this was written,
# from `huddle_session.yml`'s decision step since #3911 consolidated the
# huddle into one run -- and, until now, nothing acting on it. The
# decision was advisory text that the *next* fix cycle would read, but no
# machinery started that fix cycle: the issue stayed In Review, assigned to
# the review agent, waiting for something to happen. On PR #3733 the thing
# that happened was the 3-cycle escalation firing six minutes after a
# "proceed" decision, parking the issue on the owner until a manual reset --
# the mediation had even written that escalating "would spend an owner turn
# on a small mechanical change nobody disputes".
#
# So the decision now dispatches itself: proceed / change-approach / descope
# hand the issue back to the developer agent exactly as a REQUEST_CHANGES
# round does (assign_and_trigger_developer -- and the developer moves the
# issue to In Progress itself, #3882), and the fix cycle
# reads the decision from the PR thread as it already does
# (developer_auto_implement.yml). `escalate` is terminal and left alone --
# the run that decided performs that escalation itself.
#
# The actor gate below is why `huddle_session.yml` posts its decision comment
# under SCRUMMASTER_AGENT_TOKEN rather than the review-agent token its job
# otherwise holds: a decision authored by anyone else lands, reads correctly,
# and dispatches nothing.
#
# Runs under REVIEW_AGENT_TOKEN because the review agent is one of the
# identities developer_auto_implement.yml accepts an assignment from.

on:
  issue_comment:
    types: [created]

jobs:
  dispatch:
    if: >-
      vars.AGENTS_ENABLED == 'true' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'HUDDLE_DECISION:') &&
      (github.event.comment.user.login == vars.SCRUM_AGENT ||
       github.event.comment.user.login == vars.HUMAN_OWNER)
    runs-on: ubuntu-latest

    # One dispatch at a time per PR: a duplicated mediation (the shape this
    # issue also fixes) must not produce two competing redispatches.
    concurrency:
      group: huddle-decision-dispatch-${{ github.event.issue.number }}
      cancel-in-progress: false

    permissions:
      contents: read
      pull-requests: write
      issues: write

    env:
      GH_TOKEN: ${{ secrets.REVIEW_AGENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Auth gh
        run: gh auth status

      - name: Write ephemeral config.ini
        shell: bash
        run: |
          set -euo pipefail
          CFG="$RUNNER_TEMP/nyxgpt-config.ini"

          cat > "$CFG" <<EOF
          REPO_OWNER=${{ vars.REPO_OWNER }}
          REPO_NAME=${{ vars.REPO_NAME }}
          PROJECT_OWNER=${{ vars.PROJECT_OWNER }}
          PROJECT_NUMBER=${{ vars.PROJECT_NUMBER }}

          DEV_AGENT=${{ vars.DEV_AGENT }}
          REVIEW_AGENT=${{ vars.REVIEW_AGENT }}
          SCRUM_AGENT=${{ vars.SCRUM_AGENT }}
          HUMAN_OWNER=${{ vars.HUMAN_OWNER }}

          STATUS_FIELD=${{ vars.STATUS_FIELD }}
          STATUS_BACKLOG=${{ vars.STATUS_BACKLOG }}
          STATUS_IN_PROGRESS=${{ vars.STATUS_IN_PROGRESS }}
          STATUS_IN_REVIEW=${{ vars.STATUS_IN_REVIEW }}
          STATUS_FOR_RELEASE=${{ vars.STATUS_FOR_RELEASE }}

          RELEASE_BRANCH=${{ vars.RELEASE_BRANCH }}
          RELEASE_ISSUE_NUMBER=${{ vars.RELEASE_ISSUE_NUMBER }}
          SPRINT_AUTOPILOT=${{ vars.SPRINT_AUTOPILOT }}
          SPRINT_FIELD=${{ vars.SPRINT_FIELD }}
          EOF

          echo "NYXGPT_CONFIG_FILE=$CFG" >> "$GITHUB_ENV"

      - name: Resolve decision and dedupe
        id: decide
        shell: bash
        env:
          # Untrusted comment body via env, never interpolated into the
          # script -- same rule as review_agent_auto_review.yml.
          COMMENT_BODY: ${{ github.event.comment.body }}
          # #3837 / CodeQL #124: every event value the shell reads arrives as
          # data through env. `${{ }}` substitution happens before bash parses
          # the body, so an interpolated value is shell *source* -- the same
          # fault class as #3820's `script:` bodies, one construct wider.
          PR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          LIB="$GITHUB_WORKSPACE/scripts/agents/lib/huddle_state.py"

          DECISION=$(printf '%s' "${COMMENT_BODY:-}" | python3 "$LIB" decision)
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "Huddle decision: '${DECISION:-<unparsable>}'"

          COMMENTS=$(gh api "repos/$REPO/issues/$PR/comments" \
            --paginate --jq '.[]' | jq -s '{comments: .}')

          # Only the round's first decision comment dispatches, and only if
          # no dispatch has already happened for it -- so a re-posted or
          # duplicated decision cannot start two fix cycles.
          PRIMARY=$(printf '%s' "$COMMENTS" | python3 "$LIB" guard 'HUDDLE_DECISION:' "$COMMENT_ID")
          DISPATCHED=$(printf '%s' "$COMMENTS" | python3 "$LIB" status | sed -n 's/^dispatched=//p')

          RUN=false
          case "$DECISION" in
            proceed|change-approach|descope)
              if [[ "$PRIMARY" == "true" && "$DISPATCHED" != "true" ]]; then
                RUN=true
              else
                echo "::notice::Decision already dispatched for this round (primary=$PRIMARY, dispatched=$DISPATCHED) -- standing down"
              fi
              ;;
            escalate)
              echo "::notice::Huddle escalated -- the mediation run owns that handoff, nothing to dispatch"
              ;;
            *)
              echo "::notice::No parsable decision in this comment -- nothing to dispatch"
              ;;
          esac
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

          # The link, not the sentence (owner rule, 2026-08-19).
          # Self-contained on purpose: no checkout, no config, no sourced
          # library. A PR-triggered workflow runs the PR's copy of this file
          # against a RELEASE_BRANCH checkout, so calling a helper the base
          # branch does not have yet fails with exit 127 -- which is exactly
          # how this step and pr-hygiene went red on the PR that introduced
          # the helper. A query needs nothing checked out to work.
          ISSUE=$(gh api graphql -f query='
            query($owner:String!, $name:String!, $pr:Int!){
              repository(owner:$owner, name:$name){
                pullRequest(number:$pr){
                  closingIssuesReferences(first:5){ nodes { number } }
                }
              }
            }' -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY##*/}" \
            -F pr="$PR" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[0].number // empty' \
            2>/dev/null || true)

          # Fallback for PRs opened before the link existed. Read, never required.
          if [[ -z "$ISSUE" ]]; then
            ISSUE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.body // ""' \
              | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          fi
          if [[ -z "$ISSUE" && "$RUN" == "true" ]]; then
            echo "::error::PR #$PR closes no issue -- cannot dispatch the huddle decision"
            exit 1
          fi
          echo "issue_number=$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Restart the fix cycle
        if: steps.decide.outputs.run == 'true'
        shell: bash
        env:
          # #3837 / CodeQL #124 (critical). These three were substituted into
          # this `run:` body as shell source, and `$ISSUE` was then substituted
          # a second time into the nested `bash -lc "..."` command string -- so
          # a single quote in a step output escaped two shells, in a job
          # holding REVIEW_AGENT_TOKEN. `decision` is parsed out of a
          # `## Huddle Decision` comment on an `issue_comment` trigger, which
          # is reachable input. All three now arrive as data.
          PR: ${{ github.event.issue.number }}
          ISSUE: ${{ steps.decide.outputs.issue_number }}
          DECISION: ${{ steps.decide.outputs.decision }}
          DEV_AGENT: ${{ vars.DEV_AGENT }}
        run: |
          set -euo pipefail

          echo "::group::Dispatching huddle decision '$DECISION' for issue #$ISSUE"

          # The inner script is a single-quoted literal, so the outer shell
          # expands nothing in it; `$ISSUE` reaches it through argv as "$1",
          # where it is an argument and never source. `$STATUS_IN_PROGRESS`
          # is set by the inner shell's own `load_config`.
          bash -lc '
            set -euo pipefail
            cd "$GITHUB_WORKSPACE"
            # shellcheck source=/dev/null
            source scripts/agents/lib/gh_project.sh
            load_config
            require_gh_auth
            assign_and_trigger_developer "$1"
          ' huddle-decision-dispatch "$ISSUE"

          BODY=$(printf '%s\n\n%s\n\n%s\n%s\n%s\n\n%s\n\n%s' \
            "🔁 **Huddle decision dispatched**: \`${DECISION}\`" \
            "Issue #${ISSUE} has been assigned to @${DEV_AGENT} to carry out the huddle decision above; the developer agent moves it to **In Progress** as it picks the work up (#3882)." \
            "**Developer Instructions:**" \
            "1. Read the \`## Huddle Decision\` comment on this PR -- its \"What happens next\" section is the plan; follow it rather than deciding independently" \
            "2. Implement, run the tests locally, commit and push -- the PR will be automatically re-reviewed" \
            "The review-cycle counter is re-armed by this decision (#3736): the rounds that led to the huddle no longer count toward the 3-cycle escalation." \
            "HUDDLE_DECISION_DISPATCHED")
          gh pr comment "$PR" --body "$BODY"

          echo "::endgroup::"
          echo "✓ Huddle decision '$DECISION' dispatched to @${DEV_AGENT} for issue #${ISSUE}"
