name: Project Hygiene Smoke

# Which question does this job answer? (#3775 executed verification)
#
#   "When a deliberate project-field write lands WHILE the hygiene job is
#    running, does the value the owner (or an agent) wrote survive — and does
#    hygiene still populate a genuinely empty issue?"
#
# And, since #3811:
#
#   "When the project item DISAPPEARS mid-run — the card deleted, or the
#    issue moved off this board — does hygiene finish cleanly instead of
#    going red on a dangling node id, while a failure that is not that still
#    fails loud?"
#
# Also inspection-proof, and for the same reason: the answer depends on what
# the API returns for an id it no longer knows, which only running it shows.
# The stub injects the disappearance at the point the real one happened (run
# 31926723483, after Status and Priority were written), and the counterpart
# case keeps "the read failed" from becoming a blanket excuse to exit 0.
#
# Inspection cannot answer that. This defect's signature is a *successful*
# hygiene run that overwrote a good value (#3814 lost its Status on
# 2026-08-16 by about a second; #3813, same code, survived), so a green run of
# the job itself is not evidence of anything.
#
# The suite this job runs executes scripts/agents/ensure_issue_hygiene.sh —
# the actual body of ensure_project_hygiene.yml's add-to-project job — against
# a stateful `gh` stub that INJECTS the concurrent write into the exact window
# between hygiene's check of a field and its write of that field. Both
# directions are proved, per the macos-brew-smoke.yml template:
#
#   * a copy of the script with the guard removed clobbers the deliberate
#     value (the defect reproduces on demand, so the pass is not luck), and
#   * the shipped script leaves it alone, while still filling every field of
#     an issue that really is empty.
#
# The one thing CI cannot do here is create a real issue on the live project
# board while the live workflow runs: agents have no way to drive the owner's
# board without mutating production state. The stub reproduces the ordering
# that live race depends on, which is the part that was untestable before.

on:
  push:
    paths:
      - "scripts/agents/ensure_issue_hygiene.sh"
      - "scripts/agents/lib/gh_project.sh"
      - ".github/workflows/ensure_project_hygiene.yml"
      - ".github/workflows/project-hygiene-smoke.yml"
      - "tests/test_issue_hygiene.sh"
      - "tests/gh_stub_issue_hygiene.py"
  pull_request:
    paths:
      - "scripts/agents/ensure_issue_hygiene.sh"
      - "scripts/agents/lib/gh_project.sh"
      - ".github/workflows/ensure_project_hygiene.yml"
      - ".github/workflows/project-hygiene-smoke.yml"
      - "tests/test_issue_hygiene.sh"
      - "tests/gh_stub_issue_hygiene.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-clobber:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The workflow must actually call the script this suite exercises. If
      # the logic is ever inlined back into the YAML, everything below still
      # passes while testing nothing that runs in production.
      - name: "Wiring: the hygiene job runs the script under test"
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'scripts/agents/ensure_issue_hygiene.sh' \
               .github/workflows/ensure_project_hygiene.yml; then
            echo "::error::ensure_project_hygiene.yml no longer calls the tested script (#3816)."
            exit 1
          fi
          echo "OK: the add-to-project job delegates to the tested script."

      - name: "Guard: no unconditional project-field write in the FILL path"
        shell: bash
        run: |
          set -euo pipefail
          # Every field write in the script's FILL path must go through the
          # re-read guard. A bare setter there is the pre-#3816 shape that
          # clobbered #3814.
          #
          # Scoped to the fill path on purpose (#3871). The closure rule is the
          # deliberate exception: a closure that was not a completion must
          # overwrite Phase and clear Sprint whatever they held, so
          # apply_closure_rule writes unguarded by design. Stating the
          # invariant over the whole file would make this guard assert
          # something the script no longer holds while still passing green --
          # the "invariant by proxy" fault fixed in test_no_author_based_exemption.
          # So the closure function's body is sliced out, and the setters it
          # legitimately uses are banned everywhere else.
          script=scripts/agents/ensure_issue_hygiene.sh
          if ! grep -q '^apply_closure_rule() {$' "$script"; then
            echo "::error::apply_closure_rule() not found in $script — this guard's slice is stale (#3871)."
            exit 1
          fi
          sed '/^apply_closure_rule() {$/,/^}$/d' "$script" > /tmp/hygiene-fill-path.sh
          # If the slice ever swallowed the fill path itself the grep below
          # would pass over nothing, so prove the fill path survived it.
          if ! grep -q 'fill_project_field_if_empty' /tmp/hygiene-fill-path.sh; then
            echo "::error::the closure-function slice removed the fill path — this guard would be vacuous (#3871)."
            exit 1
          fi
          if grep -nE '^[^#]*\b(set_project_field_value|set_issue_status|set_field_with_retry|clear_project_field_value)\b' \
             /tmp/hygiene-fill-path.sh; then
            echo "::error::the fill path in $script writes a field without the re-read guard (#3816)."
            echo "::error::(line numbers above are into the closure-sliced copy, not the file.)"
            exit 1
          fi
          echo "OK: every field write in the fill path goes through fill_project_field_if_empty;"
          echo "OK: the closure rule's deliberate unguarded writes (#3871) are excluded by name, not by accident."

      - name: "Both directions: the race clobbers without the guard, survives with it"
        shell: bash
        run: bash tests/test_issue_hygiene.sh
