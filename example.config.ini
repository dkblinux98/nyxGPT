[nyxgpt]
# Default model used for chat (hot-reload; no restart required)
default_model = qwen2.5:0.5b

# Timeout (seconds) for a single chat generation request to Ollama
# Increase this if RAG-assisted prompts are slow to respond
chat_timeout_seconds = 180

# Where chat sessions are stored (outside the repo)
sessions_dir = ~/.nyxGPT/sessions

# Where vector embeddings / RAG data will live
vectorstore_dir = ~/.nyxGPT/vectorstore

# Automatic session naming (hot-reload; no restart required)
# Automatically generate session title/summary/tags after N messages
auto_summarize_enabled = true

# Trigger auto-summarization after this many messages
# Set to 0 to disable auto-summarization
auto_summarize_after_messages = 5

# Automatically sync session filename with title when title changes
# Uses sanitized version of title (alphanumeric, hyphens, underscores only)
auto_sync_filename = true

# Default system prompt for new chat sessions
# Leave empty for no default system prompt
# Example: You are a helpful coding assistant.
system_prompt =

# System prompt minimization to reduce token usage
# When enabled, removes redundant whitespace and filler words from system prompts
# Preserves semantic meaning while reducing token count
system_prompt_minimize = false

[logging]
# Global log level for all components (hot-reload; no restart required)
level = INFO

# Centralized log directory (default shown)
dir = ~/.nyxGPT/logs

# Log output format: "text" (human-readable, default) or "json" (structured,
# one JSON object per line for log aggregation / Loki)
format = text

[cache]
# ----------------------------
# Embedding Cache Configuration
# ----------------------------
# Cache embeddings to avoid recomputing vectors for identical texts
# Significantly improves performance for repeated queries

# Enable/disable embedding caching (default: false for backward compatibility)
embedding_cache_enabled = false

# Cache backend: "memory" (fast, volatile) or "disk" (persistent across restarts)
# Memory cache uses LRU eviction; disk cache stores pickle files
embedding_cache_backend = memory

# Maximum number of cached embedding entries (memory backend only)
# Each entry caches the result of embed_texts() for a specific (texts, model, dimension) combination
embedding_cache_max_size = 1000

# Cache TTL (time-to-live) in seconds
# Memory backend default: 3600s (1 hour)
# Disk backend default: 86400s (24 hours)
# Set to 0 for no expiration (cache persists indefinitely until cleared)
embedding_cache_ttl_seconds = 3600

# Cache directory for disk backend (ignored for memory backend)
# Stores pickled embedding results with expiry metadata
embedding_cache_dir = ~/.nyxGPT/cache/embeddings

# ----------------------------
# Response Cache Configuration
# ----------------------------
# Cache LLM responses to avoid redundant API calls for identical prompts
# Useful for repeated queries in testing or batch processing

# Enable/disable response caching (default: false)
# WARNING: Enabling response cache may cause stale responses if context changes
# Only recommended for deterministic use cases or short TTL values
response_cache_enabled = false

# Cache backend: "memory" (fast, volatile) or "disk" (persistent across restarts)
response_cache_backend = memory

# Maximum number of cached response entries (memory backend only)
# Each entry caches the response for a specific (messages, model) combination
response_cache_max_size = 100

# Cache TTL (time-to-live) in seconds
# Memory backend default: 1800s (30 minutes)
# Disk backend default: 3600s (1 hour)
# Shorter TTL recommended to avoid serving stale responses
response_cache_ttl_seconds = 1800

# Cache directory for disk backend (ignored for memory backend)
response_cache_dir = ~/.nyxGPT/cache/responses

# ----------------------------
# Query Result Cache Configuration
# ----------------------------
# Cache the fully retrieved/fused/reranked RAG results for repeated queries,
# skipping vector search, BM25 indexing, fusion, and reranking on a hit.
# Automatically invalidated on document ingestion/update/deletion, so a
# generous TTL is safe. Monitor hit rate via GET /rag/cache/stats.

# Enable/disable query result caching (default: false)
query_cache_enabled = false

# Cache backend: "memory" (fast, volatile) or "disk" (persistent across restarts)
query_cache_backend = memory

# Maximum number of cached query results (memory backend only)
# Each entry caches retrieve_context() results for a specific query fingerprint
# (query text, top_k, collection, embedding model/dim, metadata filters, and
# retrieval settings)
query_cache_max_size = 500

# Cache TTL (time-to-live) in seconds
# Memory backend default: 300s (5 minutes)
# Disk backend default: 600s (10 minutes)
query_cache_ttl_seconds = 300

# Cache directory for disk backend (ignored for memory backend)
query_cache_dir = ~/.nyxGPT/cache/queries

[ollama]
# Base URL for Ollama service
base_url = http://127.0.0.1:11434

# Default model for Ollama (optional override)
# If not set, uses [nyxgpt] default_model
default_model = qwen2.5:latest

[api]
# Local FastAPI bind settings
host = 127.0.0.1
port = 8000

# Base URL clients use to reach the API
base_url = http://127.0.0.1:8000

[web]
# Local Next.js UI bind settings
host = 127.0.0.1
port = 3000

# Optional: override which FastAPI base URL the web UI proxies to.
# If blank, the web UI will use [api] host/port.
api_base_url =

[canary]
# Local canary deployment (see docs/kubernetes.md#canary-deployment). Only
# relevant if you run the API on a local cluster via `kubectl apply -k k8s/`.
namespace = nyxgpt

# Total replicas split between nyxgpt-api-stable and nyxgpt-api-canary; the
# canary's replica count relative to this total is its approximate traffic
# share (kube-proxy round-robins across every matching Pod endpoint).
total_replicas = 4

# Percentage points added to the canary's traffic share by `nyxgpt canary
# promote` (and the SRE/admin dashboard's Promote button) each time it's run.
step_percent = 25

# `nyxgpt canary evaluate` rolls back automatically if the live error rate
# (HTTP 5xx, see /api/v1/metrics) exceeds this percentage.
error_rate_threshold_percent = 5.0

# `nyxgpt canary evaluate` rolls back automatically if p95 request latency
# (see /api/v1/metrics) exceeds this many milliseconds.
latency_p95_threshold_ms = 2000.0

# Minimum number of requests observed before `evaluate` will judge the
# canary; below this it holds at the current weight instead of rolling back
# for lack of data.
min_requests_for_evaluation = 20

[auth]
# Optional API key authentication for the FastAPI backend
# Disabled by default for local-only usage
# Enforced: if [api] host below is bound non-loopback, the API refuses to
# start unless enabled = true here (see docs/security.md#network-security)
enabled = false

# Shared secret required when auth is enabled
# Requests to /api/v1/* must include this value
api_key =

# HTTP header used to pass the API key
header = X-API-Key

[rate_limit]
# Enable/disable rate limiting
# NOTE: Disabled by default (localhost-only app)
# Rate limiting protects against abuse and DoS attacks
enabled = false

# Global rate limit (requests per second per IP address)
# Maximum sustained request rate before blocking
requests_per_second = 10

# Burst size (allows short bursts above the sustained rate)
# Maximum tokens in the bucket (initial capacity)
burst_size = 20

[batch]
# Request batching for improved throughput
# Groups multiple independent chat/RAG requests for batch processing
# NOTE: Disabled by default for backward compatibility
enabled = false

# Maximum number of requests to batch together before processing
# Larger batches improve throughput but add latency
# Range: 1-50, Default: 4
batch_size = 4

# Maximum time to wait for batch to fill (milliseconds)
# Process batch after this timeout even if not full
# Lower values = lower latency, higher values = better batching efficiency
# Range: 10-5000ms, Default: 100ms
wait_time_ms = 100

[tracing]
# Distributed tracing via OpenTelemetry. Local-only: when enabled, spans for
# HTTP requests (chat/RAG), Ollama calls, and Cassandra queries are exported
# over OTLP to a *local* collector -- nothing is ever sent to an
# external/cloud endpoint.
#
# Requires the `tracing` Compose profile (local OTel collector + Jaeger
# all-in-one), started automatically by `nyxgpt ops install` (or standalone
# via `nyxgpt ops observability`). Then browse traces at jaeger_ui_url below
# (also linked from the SRE/admin dashboard).
# NOTE: Enabled by default (2026-07-28 owner decision). If the local
# collector isn't reachable yet (fresh install, `--skip-observability`,
# collector restart), span export degrades gracefully -- chat/API behavior
# is unaffected; `nyxgpt ops doctor` reports OTLP reachability (#3350).
enabled = true

# Service name attached to every span (shown in the Jaeger UI's service list)
service_name = nyxgpt-api

# OTLP/HTTP endpoint of the local collector
otlp_endpoint = http://localhost:4318/v1/traces

# Jaeger UI URL, used for the "Distributed Tracing" link in the SRE/admin
# dashboard
jaeger_ui_url = http://localhost:16686

[error_tracking]
# Self-hosted error tracking via the Sentry SDK protocol. Opt-in and
# local-only: when enabled, unhandled backend exceptions (and, if wired up,
# web UI client errors) are reported to a *self-hosted* tracker such as
# GlitchTip -- nothing is ever sent to Sentry's own SaaS.
#
# Zero-touch: `nyxgpt ops install` (or `nyxgpt ops glitchtip-init` on its
# own) starts the `errors` Compose profile (local GlitchTip instance) and
# auto-provisions its admin user, organization, project, and DSN -- no
# manual sign-in or DSN paste needed. `enabled`/`dsn` below are filled in
# automatically once that completes; leave them blank to let it happen.
#
# nyxGPT reports via the Python sentry_sdk, not the Node.js/@sentry/node
# instructions GlitchTip's own onboarding screen shows -- ignore those. See
# docs/self-healing.md and docs/ops.md#nyxgpt-ops-glitchtip-init.
enabled = false

# DSN of your self-hosted GlitchTip project, e.g.
# http://<public_key>@localhost:8080/<project_id>. Filled in automatically
# by `nyxgpt ops glitchtip-init` -- a containerized deployment automatically
# rewrites the localhost host to the Compose service name at startup, so
# there's nothing to edit here for either deployment mode.
dsn =

# Environment tag attached to every event (e.g. development, production)
environment = development

# Release tag attached to every event, for release tracking (e.g. a version
# or git SHA). Leave blank to omit.
release =

# Fraction of requests to also sample for performance monitoring, 0.0-1.0
# (0.0 disables performance monitoring; only exceptions are captured)
traces_sample_rate = 0.0

# GlitchTip UI URL, used for the "Error Tracking" link in the SRE/admin
# dashboard
glitchtip_ui_url = http://localhost:8080

# GlitchTip admin account `nyxgpt ops glitchtip-init` provisions. Leave
# blank to let it pick a default email and generate a strong password
# (persisted back here, chmod 600 -- same trust model as [auth] api_key).
# Set your own to control the admin login instead. Never sent anywhere --
# GlitchTip is loopback-only.
admin_email =
admin_password =

[monitoring]
# Grafana dashboards backed by Prometheus, scraping this API's /metrics
# endpoint. Opt-in and local-only -- no metrics are ever sent to an
# external/cloud service.
#
# Requires the `monitoring` Compose profile (local Prometheus + Grafana):
# `docker compose --profile monitoring up`. NOTE: Disabled by default --
# set enabled = true once the profile is running so the SRE/admin
# dashboard's "Monitoring Dashboards" link reflects reality.
enabled = false

# Grafana UI URL, used for the "Monitoring Dashboards" link in the
# SRE/admin dashboard. Update this if you changed GRAFANA_UI_PORT in .env.
grafana_ui_url = http://localhost:3001

# Prometheus UI URL, used for the "Open Prometheus" link in the SRE/admin
# dashboard's Observability submenu. Update this if you changed
# PROMETHEUS_UI_PORT in .env.
prometheus_ui_url = http://localhost:9090

# Grafana admin password -- config.ini is the single source of truth for
# this secret, generated automatically by `nyxgpt wizard`. If you run the
# Docker Compose stack's `monitoring` profile, run `nyxgpt ops env-sync` to
# derive .env's GRAFANA_ADMIN_PASSWORD from this value instead of editing
# .env by hand.
grafana_admin_password =

# Slack incoming webhook URL for Grafana's alerting contact point (the
# "nyxgpt-slack" receiver provisioned by
# docker/grafana/provisioning/alerting/contact-points.yml). Leave blank to
# still get real, visible Grafana alerts (firing/normal in the Alerting UI
# and on the SRE Home dashboard) -- you just won't get a Slack message until
# this is set. Create one at https://api.slack.com/messaging/webhooks, paste
# it here, then run `nyxgpt ops env-sync` (or `nyxgpt ops install`) to
# provision it into Grafana, and `nyxgpt ops alert-test` to verify delivery.
slack_webhook_url =

[log_aggregation]
# Centralized log search backed by Loki + promtail, shipping this API's log
# files under ~/.nyxGPT/logs. Reduced-footprint (not a full ELK stack) and
# local-only -- no logs are ever sent to an external/cloud service.
#
# Requires the `logging` Compose profile (local Loki + promtail), started
# via `nyxgpt ops observability`, plus the `monitoring` profile (Grafana is
# pre-provisioned with a Loki datasource and features log search on the SRE
# Home dashboard via the Logs Drilldown app). NOTE: Disabled by default --
# set enabled = true once the profile is running so the SRE/admin
# dashboard's log search link reflects reality.
enabled = false

# Grafana Explore URL (pointed at the Loki datasource), used for the log
# search link in the SRE/admin dashboard. Update this if you changed
# GRAFANA_UI_PORT in .env.
grafana_explore_url = http://localhost:3001/explore

[self_heal]
# Self-heal watchdog for the local deployed stack (see docs/self-healing.md).
# Periodically checks every running component (core services plus any of the
# monitoring/logging/tracing/errors profiles that are up) and automatically
# restarts anything unhealthy or stopped. Covers native/local-first
# (`nyxgpt ops install`), Docker Compose, Terraform (`--terraform --local`),
# and Kubernetes (`--kubernetes --local`) deployments alike -- for
# Kubernetes this is on top of, not instead of, kubelet's own liveness-probe
# restarts and [canary]'s metrics-gated rollout + auto-rollback.
#
# NOTE: this is only the *initial* state for a fresh install. Once
# ~/.nyxGPT/self_heal_state.json exists, the SRE/admin dashboard's toggle is
# the source of truth and this value is ignored.
enabled = false

# How often (seconds) the watchdog checks component health.
check_interval_seconds = 15

# Stop auto-restarting a component after this many consecutive failed
# recovery attempts, so a genuinely broken component doesn't get
# restart-looped forever. Surfaced in the dashboard as "give up" -- fix the
# underlying issue and use "heal now" to reset it.
max_consecutive_restarts = 5

# Minimum time (seconds) between automatic restart attempts for the same
# component.
backoff_seconds = 30

[context]
# Context window budget enforcement
# Default maximum context window size in tokens (applies to all models unless overridden)
# Common sizes: llama3.1 (128k), llama2 (4k), mistral (8k), qwen2.5 (32k)
default_window_size = 8192

# Warn when context usage exceeds this fraction of the limit (0.0-1.0)
# Set to 0.8 to warn at 80% capacity
warning_threshold = 0.8

# Model-specific context window overrides (optional)
# Format: context_window_<model_name> where : . / are replaced with _
# Example: context_window_llama3_1_8b = 131072
# Example: context_window_qwen2_5_0_5b = 32768

[prompt]
# Adaptive prompt mode - automatically adjusts system prompts based on conversation length
# When enabled, uses different prompt strategies for short, medium, and long conversations
# Disabled by default - only applies when no custom system_prompt is set
adaptive_mode_enabled = false

# Message count threshold for short mode (concise prompts)
# Conversations with fewer messages than this use short mode
short_threshold = 3

# Message count threshold for long mode (comprehensive prompts)
# Conversations with more messages than this use long mode
# Between short_threshold and long_threshold, medium mode is used
long_threshold = 10

[rag]
# Global RAG setting: enable/disable RAG context injection (hot-reload; no restart required)
# Can be overridden per-session via WebUI or API (rag_enabled parameter)
# Priority: API parameter > session metadata > this global setting
enable_chat_context = false

# Cassandra connection settings
cassandra_hosts = 127.0.0.1
cassandra_port = 9042
cassandra_keyspace = nyxgpt
cassandra_table = rag_chunks

# ----------------------------
# Cassandra Connection Pooling
# ----------------------------
# Number of connections to maintain per Cassandra host (driver-level pool size).
# Increase for higher concurrent RAG throughput.
# Range: 1-16, Default: 2
cassandra_pool_size = 2

# Interval (seconds) between background health checks on the shared connection.
# A lightweight query is issued to verify the connection is alive.
# Range: 5.0-300.0, Default: 30.0
cassandra_health_check_interval = 30.0

# Maximum reconnection attempts before giving up on a failed connection.
# Reconnects use exponential back-off (1 s, 2 s, 4 s, …, capped at 60 s).
# Range: 1-10, Default: 3
cassandra_reconnect_max_attempts = 3

# Number of chunk upserts grouped into a single Cassandra batch during ingestion.
# Larger batches reduce network round trips. Batches are also flushed early
# once their estimated payload nears Cassandra's default 50KB batch size
# limit, so this value is a ceiling rather than a guarantee - it does not
# need to be lowered for larger embedding_dim/chunk_size values.
# Range: 1-100, Default: 20
cassandra_batch_size = 20

# ----------------------------
# Vector Search (ANN) Tuning
# ----------------------------
# Similarity/distance function used both to build the Cassandra SAI vector
# index and to score ANN search results. Changing this after documents have
# been ingested requires recreating the vector index (drop and re-run
# ensure_schema) since the index is built around a specific metric.
# Options: cosine | dot_product | euclidean, Default: cosine
vector_similarity_function = cosine

# Multiplier applied on top of metadata-filter-based oversampling when
# fetching ANN candidates. Raise this to improve recall on approximate
# search at the cost of a larger candidate scan per query.
# Range: 1.0-5.0, Default: 1.0
ann_oversample_factor = 1.0

# Maximum number of ANN queries executed concurrently within a single
# batch search call (CassandraVectorStore.query_by_embeddings_batch).
# Bounds peak in-flight requests/memory regardless of batch size.
# Range: 1-32, Default: 4
cassandra_batch_query_concurrency = 4

# ----------------------------
# Embedding Model Configuration
# ----------------------------
# nyxGPT supports multiple embedding models via collections.
# Each collection uses a separate Cassandra table with appropriate vector dimensions.

# Default embedding model (used when no collection is specified)
embedding_model = nomic-embed-text
embedding_dim = 768

# Alternative embedding models (examples):
# Small, fast model:
# embedding_model = all-minilm:latest
# embedding_dim = 384

# High-quality model:
# embedding_model = mxbai-embed-large:latest
# embedding_dim = 1024

# Multilingual model:
# embedding_model = paraphrase-multilingual:latest
# embedding_dim = 768

# To use multiple models simultaneously:
# 1. Create collections with --collection flag during ingestion
# 2. Query specific collections during retrieval
# 3. Use model_compare.py to benchmark performance
# Example: nyxgpt rag ingest --collection all-minilm --model all-minilm:latest --dim 384 document.txt

# ----------------------------
# Embedding Performance Tuning
# ----------------------------
# Optimize embedding generation for better throughput and GPU utilization

# Batch size for embedding requests
# Smaller batch_size = lower memory / slower; larger = faster but heavier
embedding_batch_size = 16

# Timeout (seconds) for each embedding batch request to Ollama
embedding_timeout_seconds = 120

# Enable async/parallel processing for embedding generation
# When true, multiple batches are processed concurrently for improved throughput
# Recommended for large document ingestion or query expansion
embedding_async_enabled = false

# Maximum number of parallel workers for async embedding processing
# Higher values = more parallelism but higher resource usage
# Recommended: 2-8 depending on your system and Ollama configuration
embedding_max_workers = 4

# Enable GPU optimization and detection
# When true, detects GPU availability and adjusts batch sizes for better utilization
# Requires nvidia-smi for NVIDIA GPUs
embedding_gpu_enabled = false

# Enable adaptive batch sizing based on available memory and GPU
# When true, automatically adjusts batch size to optimize memory usage
# Prevents OOM errors and maximizes throughput based on system resources
embedding_adaptive_batching = false

# Chunking configuration
chunk_size = 800
chunk_overlap = 100

# Overlap strategy: "trailing" (legacy), "sentence" (complete sentences), "semantic" (paragraphs/sections)
# - trailing: Overlaps with trailing characters from previous chunk (word-safe)
# - sentence: Overlaps with complete sentences from previous chunk
# - semantic: Overlaps with complete paragraphs or sections from previous chunk
overlap_strategy = trailing

# Preserve Markdown headings with their content (keeps heading-content relationships intact)
preserve_headings = true

# Use sentence boundaries for better semantic chunking (splits long paragraphs into sentences)
sentence_aware = true

# ----------------------------
# RAG → Chat integration
# ----------------------------

# Number of candidate chunks to retrieve from the vector store
# (before filtering and pruning)
chat_top_k = 5

# Legacy alias for chat_top_k (deprecated, use chat_top_k instead)
top_k = 5

# Legacy alias for enable_chat_context (deprecated, use enable_chat_context instead)
enabled = false

# Minimum similarity score required for a chunk to be included
# Increase to reduce low-quality or weakly-related context
min_score = 0.0

# Score quality thresholds for visual indicators
# Scores >= good_score_threshold are shown in green (high confidence)
# Scores >= medium_score_threshold are shown in yellow (medium confidence)
# Scores < medium_score_threshold are shown in red (low confidence)
good_score_threshold = 0.7
medium_score_threshold = 0.4

# Hard cap on the number of chunks injected into the prompt
max_chunks = 6

# Maximum total characters of retrieved context to include in chat
# Context is truncated if this budget is exceeded
chat_context_max_chars = 2400

# NOTE: Large models or long contexts can be slow on CPU.
# Try a smaller model (like qwen2.5:0.5b) and keep chat_context_max_chars modest for responsiveness.

# Remove duplicate or near-duplicate chunks before injection
dedupe = true

# Debug mode: collect and return detailed RAG troubleshooting metrics
# When enabled, RAG operations return timing, query analysis, embedding details, and filtering stats
# Useful for performance tuning and understanding retrieval behavior
debug_mode = false

# Query expansion: generate alternative phrasings to improve retrieval
# This uses your local LLM (no external API calls)
enable_query_expansion = false

# Model to use for query expansion (optional, defaults to nyxgpt.default_model)
# You might want to use a faster/smaller model for this
# expansion_model = llama3.2:1b

# Include similarity scores in context headers (for debugging only)
include_scores = false

# Include per-chunk headers like "[Context 1]" in injected context
include_headers = true

# ----------------------------
# Hybrid Search (Keyword + Vector)
# ----------------------------
# Hybrid search combines BM25 keyword search with vector similarity search
# for improved retrieval quality. Enabled by default for better results.

# Enable hybrid search (combines keyword and vector retrieval)
# When false, uses vector-only search (legacy behavior)
enable_hybrid_search = true

# BM25 keyword search parameters
# k1: term frequency saturation (typical range: 1.2-2.0)
# Higher k1 = more weight to term frequency
bm25_k1 = 1.5

# b: document length normalization (typical range: 0.0-1.0)
# 0.0 = no length normalization, 1.0 = full normalization
# Higher b = longer documents penalized more
bm25_b = 0.75

# Reciprocal Rank Fusion (RRF) parameter
# k constant for rank weighting (typical: 60)
# Higher k = less emphasis on rank differences
rrf_k = 60

# Alternative: weighted fusion (optional, overrides RRF when set)
# Weight between vector (1.0) and keyword (0.0) search
# Uncomment to use weighted fusion instead of RRF:
# hybrid_alpha = 0.5

# ----------------------------
# Reranking (Cross-Encoder)
# ----------------------------
# Reranking re-scores initial retrieval results using a more sophisticated
# relevance model. This improves precision by applying cross-encoder scoring
# to the top candidates from first-pass retrieval.

# Enable reranking (disabled by default for performance)
enable_reranking = false

# Model to use for reranking (defaults to nyxgpt.default_model)
# Use a fast model for better performance (e.g., qwen2.5:0.5b)
# reranker_model = qwen2.5:0.5b

# Number of results to return after reranking (top-N selection)
# Reranking all results is expensive, so this limits the final output
rerank_top_n = 3

# Timeout (seconds) for each reranking score request
# Each result is scored individually, so total time = timeout * num_results
reranker_timeout_seconds = 30

# ----------------------------
# RAG Prompt Templates
# ----------------------------
# Configurable templates for RAG context injection.
# These templates control how retrieved context is presented to the LLM.
# Use {context} as a placeholder for the formatted retrieved chunks.

# Instruction template: tells the model how to use retrieved context
# Default matches current hardcoded behavior for backward compatibility
# instruction_template = Use the retrieved context below when it is relevant and helpful. Do not mention that you were given retrieved context unless the user explicitly asks about sources. If the context is insufficient, say so and answer from general knowledge.
#
# {context}

# Context format: wraps the retrieved chunks
# Default matches current hardcoded behavior for backward compatibility
# context_format = --- BEGIN RETRIEVED CONTEXT ---
# {context}
# --- END RETRIEVED CONTEXT ---

# Alternative template examples (uncomment and customize as needed):

# Minimal/concise template:
# instruction_template = Answer using the following context when relevant:
# {context}
# context_format = Context: {context}

# Verbose/detailed template with emphasis on citations:
# instruction_template = You have access to retrieved context below. Use it to inform your response when relevant. Always cite sources when using retrieved information. If the context doesn't contain relevant information, clearly state that and provide a general answer.
#
# {context}
# context_format = === RETRIEVED DOCUMENTS ===
# {context}
# === END DOCUMENTS ===

# Research-focused template:
# instruction_template = The following context has been retrieved from the knowledge base. Synthesize information from these sources to provide a comprehensive answer. Indicate confidence level based on the available context.
#
# {context}
# context_format = [KNOWLEDGE BASE CONTEXT]
# {context}
# [END CONTEXT]

[pdf]
# OCR (Optical Character Recognition) for image-based PDFs
# Enable OCR extraction for PDFs with minimal or no extractable text
ocr_enabled = true

# Minimum text threshold (characters) before triggering OCR
# PDFs with less text than this will attempt OCR extraction
ocr_min_text_threshold = 50

# OCR DPI resolution (higher = better quality but slower)
# Recommended: 300 for standard documents, 400-600 for high quality
ocr_dpi = 300

# OCR language (use ISO 639-2 language codes)
# Common: eng (English), spa (Spanish), fra (French), deu (German), chi_sim (Chinese Simplified)
# Multiple languages: eng+spa (requires trained data for each language)
ocr_lang = eng

# OCR Page Segmentation Mode (PSM)
# 3 = Fully automatic page segmentation (default, best for most documents)
# 6 = Assume a single uniform block of text
# 11 = Sparse text - Find as much text as possible in no particular order
# See: https://github.com/tesseract-ocr/tesseract/blob/main/doc/tesseract.1.asc#page-segmentation-modes
ocr_psm = 3

# Path to tesseract executable (optional, auto-detected on most systems)
# Uncomment and set if tesseract is not in your PATH
# Linux: /usr/bin/tesseract
# macOS (Homebrew): /opt/homebrew/bin/tesseract or /usr/local/bin/tesseract
# Windows: C:\Program Files\Tesseract-OCR\tesseract.exe
# tesseract_cmd = /usr/bin/tesseract

[paths]
# Absolute path to the nyxGPT repository
repo_dir = /Users/USERNAME/path/to/nyxGPT

# Absolute path to the Python executable used to run the API
# (typically the venv python for this project)
venv_python = /Users/USERNAME/path/to/nyxGPT/.venv/bin/python

# Absolute path to the Node.js executable used to run the web UI
# (usually whatever `which node` returns)
node_bin = /opt/homebrew/bin/node

# Absolute path to the npm executable (usually whatever `which npm` returns)
npm_bin = /opt/homebrew/bin/npm

[openai]
# OpenAI API key for accessing GPT models
# Required if using OpenAI models in addition to Ollama
# Get your API key from: https://platform.openai.com/api-keys
api_key =

[github]
# GitHub Personal Access Token (PAT) for repository operations
# Required for GitHub agent integration and automation
# Get your PAT from: https://github.com/settings/tokens
pat =

# Enable GitHub agent integration
# When true, allows automated workflows and agent operations
agents_enabled = false

# Repository configuration
repo_owner = your-username
repo_name = your-repo-name

# GitHub Project configuration
project_owner = your-username
project_number = 1

# Agent usernames
dev_agent = nyxGPT-developer-agent
review_agent = nyxGPT-review-agent
scrum_agent = nyxGPT-scrummaster-agent
human_owner = your-username

# Project field configuration (Status field values)
status_field = Status
status_backlog = Backlog
status_in_progress = In Progress
status_in_review = In Review
status_for_release = For Release

# Active release configuration
release_branch = v1.0.0
release_issue_number = 1

# Sprint autopilot (#3480): self-continuing merge -> next-issue loop, scoped
# to the active Sprint. sprint_autopilot defaults to false (off) if unset,
# reproducing the pre-#3480 manual-kick flow exactly. sprint_field defaults
# to "Sprint" if unset. See docs/sprint-autopilot.md.
sprint_autopilot = false
sprint_field = Sprint

# Agent-specific GitHub tokens (optional, for fine-grained permissions)
# If not set, falls back to the main PAT above
scrummaster_agent_token =
developer_agent_token =
review_agent_token =
myagent_review_agent_token =

# Claude Code OAuth token for AI-assisted operations
# Get from: https://claude.ai/settings/oauth
claude_code_oauth_token =

# ----------------------------
# GitHub Actions Variables
# ----------------------------
# The following variables are configured in GitHub repository settings
# (Settings → Secrets and variables → Actions → Variables)
# They are NOT stored in this config file.
#
# AGENTS_ENABLED: true
# DEV_AGENT: nyxGPT-developer-agent
# HUMAN_OWNER: dkblinux98
# PROJECT_NUMBER: 2
# PROJECT_OWNER: dkblinux98
# RELEASE_BRANCH: v1.0.0
# RELEASE_ISSUE_NUMBER: 2709
# REPO_NAME: nyxGPT
# REPO_OWNER: dkblinux98
# REVIEW_AGENT: nyxGPT-review-agent
# SCRUM_AGENT: nyxGPT-scrummaster-agent
# SPRINT_AUTOPILOT: false
# SPRINT_FIELD: Sprint
# STATUS_BACKLOG: Backlog
# STATUS_FIELD: Status
# STATUS_FOR_RELEASE: For Release
# STATUS_IN_PROGRESS: In Progress
# STATUS_IN_REVIEW: In Review

# Required Secrets (Settings → Secrets and variables → Actions → Secrets):
# - CLAUDE_CODE_OAUTH_TOKEN: OAuth token for Claude Code agent
# - DEVELOPER_AGENT_TOKEN: GitHub token for developer agent actions
# - SCRUMMASTER_AGENT_TOKEN: GitHub token for scrummaster agent actions
# - REVIEW_AGENT_TOKEN: GitHub token for review agent actions
# - RELEASE_TRACKING_TOKEN: Same as github pat
