# LOCAL-ONLY acceptance-testing override (2026-07-15 stakeholder sweep).
# Works around: web container has no NYXGPT_API_BASE_URL (its Next.js proxy
# routes default to 127.0.0.1:8000 = itself). Do not commit.
services:
  web:
    environment:
      NYXGPT_API_BASE_URL: http://api:8000
  # Works around: nested dashboards mount cannot create its mountpoint inside
  # the read-only provisioning mount (fails on Docker Desktop/macOS).
  grafana:
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
