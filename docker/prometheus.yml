global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules are provisioned as code in Grafana (unified alerting), which
# evaluates them directly against this Prometheus datasource -- see
# docker/grafana/provisioning/alerting/*.yml (#3466). Prometheus itself no
# longer runs its own rule evaluation, so there's no `rule_files:` here.

scrape_configs:
  - job_name: nyxgpt-api
    metrics_path: /metrics
    static_configs:
      # In the local-first layout the API is a native brew service on the
      # host, not a Compose service, so there is no `api` hostname on the
      # Docker network — scrape through the host gateway instead. This also
      # reaches the api container's published port when the full Compose
      # stack is used (Docker Desktop routes host.docker.internal to
      # host-published ports; on plain Linux engines the compose file maps
      # host.docker.internal via extra_hosts: host-gateway).
      #
      # On plain Linux that mapping resolves to the docker bridge gateway,
      # which a loopback-bound native uvicorn does NOT listen on -- so the
      # compose file also runs `host-api-relay` there, listening on that same
      # gateway address and forwarding to the host's 127.0.0.1 (#3721). That
      # keeps this target correct on every platform without widening
      # `[api] host` to 0.0.0.0.
      - targets: ["host.docker.internal:8000"]
