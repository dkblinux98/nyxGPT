[nyxgpt]
default_model = qwen2.5:0.5b
chat_timeout_seconds = 180
sessions_dir = /root/.nyxGPT/sessions
vectorstore_dir = /root/.nyxGPT/vectorstore

[logging]
level = INFO
dir = /root/.nyxGPT/logs

[ollama]
# "ollama" resolves via the Docker Compose network to the ollama service.
base_url = http://ollama:11434

[api]
host = 0.0.0.0
port = 8000

[auth]
# The API is reachable from the web container over the compose network
# rather than just localhost, so auth is enabled here. The key itself is
# injected from the NYXGPT_AUTH_API_KEY environment variable (see .env.example)
# and merged in by docker/entrypoint.sh.
enabled = true
api_key =
header = X-API-Key

[rate_limit]
enabled = false

[rag]
# Cassandra ships as part of this Compose stack, so RAG is enabled by default.
# Set to false if you don't need retrieval-augmented chat context.
enable_chat_context = true
cassandra_hosts = cassandra
cassandra_port = 9042
cassandra_keyspace = nyxgpt
cassandra_table = rag_chunks
