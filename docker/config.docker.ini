[nyxgpt]
default_model = qwen2.5:0.5b
chat_timeout_seconds = 180
sessions_dir = /root/.nyxGPT/sessions
vectorstore_dir = /root/.nyxGPT/vectorstore

[logging]
level = INFO
dir = /root/.nyxGPT/logs

[ollama]
# "ollama" resolves via the Docker Compose network to the ollama service.
base_url = http://ollama:11434

[api]
host = 0.0.0.0
port = 8000

[auth]
# The API is reachable from the web container over the compose network
# rather than just localhost, so auth is enabled here. The key itself is
# injected from the NYXGPT_AUTH_API_KEY environment variable (see .env.example)
# and merged in by docker/entrypoint.sh.
enabled = true
api_key =
header = X-API-Key

[rate_limit]
enabled = false

[rag]
# Cassandra ships as part of this Compose stack, so RAG is enabled by default.
# Set to false if you don't need retrieval-augmented chat context.
enable_chat_context = true
cassandra_hosts = cassandra
cassandra_port = 9042
cassandra_keyspace = nyxgpt
cassandra_table = rag_chunks
# Dedicated embedding model -- must be pulled separately from default_model
# (see the Quickstart in docs/docker-compose.md), since not every chat model
# serves Ollama's /api/embed endpoint. embedding_dim = 768 (the default,
# see docs/configuration.md) matches nomic-embed-text's output size.
embedding_model = nomic-embed-text

[tracing]
# Distributed tracing is opt-in and local-only: set enabled = true and start
# the `tracing` Compose profile (`docker compose --profile tracing up`) to
# run a local OTel collector + Jaeger all-in-one. Traces never leave the
# machine -- there is no external/cloud exporter.
enabled = false
service_name = nyxgpt-api
# "otel-collector" resolves via the Docker Compose network to the collector
# started by the `tracing` profile.
otlp_endpoint = http://otel-collector:4318/v1/traces
jaeger_ui_url = http://localhost:16686

[error_tracking]
# Error tracking is opt-in and local-only: set enabled = true and start the
# `errors` Compose profile (`docker compose --profile errors up`) to run a
# self-hosted GlitchTip instance. Exception data never leaves the machine --
# there is no default DSN and nothing here ever talks to Sentry's own SaaS.
enabled = false
# Create a project in the GlitchTip UI (http://localhost:8080) and paste its
# DSN here. "glitchtip" resolves via the Docker Compose network.
dsn =
environment = docker
release =
# Fraction of requests to also sample for performance monitoring (0.0-1.0).
traces_sample_rate = 0.0
glitchtip_ui_url = http://localhost:8080

[monitoring]
# Grafana dashboards are opt-in and local-only: set enabled = true and start
# the `monitoring` Compose profile (`docker compose --profile monitoring
# up`) to run local Prometheus + Grafana instances. Metrics never leave the
# machine.
enabled = false
grafana_ui_url = http://localhost:3001

[log_aggregation]
# Centralized log search (Loki + promtail) is opt-in and local-only: set
# enabled = true and start the `logging` Compose profile (`docker compose
# --profile logging up`) to ship the logs under /root/.nyxGPT/logs into a
# local Loki instance, searched via the Grafana instance from the
# `monitoring` profile. Logs never leave the machine.
enabled = false
grafana_explore_url = http://localhost:3001/explore
