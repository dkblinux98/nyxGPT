server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Every target below carries a fixed, bounded `service_name` label (api,
  # cli, ollama, cassandra -- web joins once #3430 lands) so Grafana's Logs
  # Drilldown service breakdown reflects the real services instead of one
  # flat, undifferentiated `job=nyxgpt` bucket (#3441). `job: nyxgpt` stays
  # on every target unchanged, so #3349's pipeline and the curated Explore
  # links (which filter on `job="nyxgpt"` alone) keep working.
  #
  # api/cli each get two targets -- Compose-mode (written inside the api
  # container into ~/.nyxGPT/volumes/nyxgpt-data, bind-mounted read-only at
  # /var/log/nyxgpt) and native-mode (written on the host to ~/.nyxGPT/logs,
  # bind-mounted at /var/log/nyxgpt-native -- see docker-compose.yml's
  # promtail service) -- since `nyxgpt.logging.configure_logging` now writes
  # api.py's process to api.log and every CLI invocation (`nyxgpt ops ...`)
  # to cli.log (previously both shared one `nyxgpt.log`, making them
  # indistinguishable). ollama/cassandra are never nyxgpt Python processes,
  # so they only ever appear in the native-mode directory, written as real
  # files (never symlinks -- see scripts/follow-ollama-logs.sh and
  # scripts/follow-cassandra-logs.sh, the only things that ever put them
  # there).
  - job_name: nyxgpt
    static_configs:
      - targets:
          - localhost
        labels:
          job: nyxgpt
          service_name: api
          __path__: /var/log/nyxgpt/logs/api.log*
      - targets:
          - localhost
        labels:
          job: nyxgpt
          service_name: cli
          __path__: /var/log/nyxgpt/logs/cli.log*
      - targets:
          - localhost
        labels:
          job: nyxgpt
          service_name: api
          __path__: /var/log/nyxgpt-native/logs/api.log*
      - targets:
          - localhost
        labels:
          job: nyxgpt
          service_name: cli
          __path__: /var/log/nyxgpt-native/logs/cli.log*
      - targets:
          - localhost
        labels:
          job: nyxgpt
          service_name: ollama
          __path__: /var/log/nyxgpt-native/logs/ollama.log*
      - targets:
          - localhost
        labels:
          job: nyxgpt
          service_name: cassandra
          __path__: /var/log/nyxgpt-native/logs/cassandra.log*
    pipeline_stages:
      # nyxgpt's default text log format (see nyxgpt.logging.DEFAULT_FMT):
      # "<timestamp> <LEVEL> [<request_id>] <logger>: <message>". Extract
      # the level and logger (module, e.g. "nyxgpt.self_heal") as labels so
      # both are filterable in Grafana Explore and the curated per-component
      # dashboard queries -- the logger name is a bounded set of module
      # names, not per-request-unique, so it's safe label cardinality.
      #
      # The millisecond suffix and the `[request_id]` bracket are both
      # optional so this same regex also matches lines that predate the
      # request-id filter (#3181) or were emitted with comma-millisecond
      # timestamps -- those lines still carry `level`/`logger` and would
      # otherwise be invisible to every curated query, which filters on
      # those labels (see #3349). Keep this expression's contract in sync
      # with tests/unit/test_log_aggregation_stack.py.
      #
      # Ollama/Cassandra lines don't match nyxGPT's own format (they're
      # upstream binary log output, not `nyxgpt.logging` records) -- this
      # stage simply fails to extract `level`/`logger` for them, and the
      # `timestamp` stage below no-ops, falling back to promtail's
      # ingestion time. Both are still fully text-searchable in
      # Drilldown/Explore via their `service_name` label.
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})(?:,\d{3})? (?P<level>\w+) (?:\[(?P<request_id>[^\]]*)\] )?(?P<logger>\S+): (?P<message>.*)$'
      - labels:
          level:
          logger:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05"
          # nyxgpt.logging writes log timestamps in UTC (see
          # nyxgpt.logging.configure_logging's `formatter.converter =
          # time.gmtime`), not host-local time -- this must stay UTC to
          # match, or every parsed line shifts by the host's UTC offset and
          # falls outside the curated Explore links' now-1h window (#3349).
          location: UTC
