server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Two static_configs entries, not one glob: Compose-mode logs (written by
  # the api container into the nyxgpt_data named volume, mounted at
  # /var/log/nyxgpt) and native-mode logs (written on the host to
  # ~/.nyxGPT/logs, bind-mounted at /var/log/nyxgpt-native -- see
  # docker-compose.yml's promtail service) live in different directories.
  # Both carry the same `job` label and pipeline_stages so they're
  # indistinguishable in Grafana regardless of which mode produced them.
  - job_name: nyxgpt
    static_configs:
      - targets:
          - localhost
        labels:
          job: nyxgpt
          __path__: /var/log/nyxgpt/logs/*.log*
      - targets:
          - localhost
        labels:
          job: nyxgpt
          __path__: /var/log/nyxgpt-native/logs/*.log*
    pipeline_stages:
      # nyxgpt's default text log format (see nyxgpt.logging.DEFAULT_FMT):
      # "<timestamp> <LEVEL> [<request_id>] <logger>: <message>". Extract
      # the level and logger (module, e.g. "nyxgpt.self_heal") as labels so
      # both are filterable in Grafana Explore and the curated per-component
      # dashboard queries -- the logger name is a bounded set of module
      # names, not per-request-unique, so it's safe label cardinality.
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) (?P<level>\w+) \[(?P<request_id>[^\]]*)\] (?P<logger>\S+): (?P<message>.*)$'
      - labels:
          level:
          logger:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05"
