server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nyxgpt
    static_configs:
      - targets:
          - localhost
        labels:
          job: nyxgpt
          __path__: /var/log/nyxgpt/logs/*.log*
    pipeline_stages:
      # nyxgpt's default text log format (see nyxgpt.logging.DEFAULT_FMT):
      # "<timestamp> <LEVEL> [<request_id>] <logger>: <message>". Extract
      # the level as a label so it's filterable in Grafana Explore.
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) (?P<level>\w+) \[(?P<request_id>[^\]]*)\] (?P<logger>\S+): (?P<message>.*)$'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05"
