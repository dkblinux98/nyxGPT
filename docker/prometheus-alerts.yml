groups:
  - name: nyxgpt
    rules:
      - alert: NyxGPTAPIDown
        expr: up{job="nyxgpt-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "nyxGPT API is unreachable"
          description: "Prometheus has been unable to scrape the nyxGPT API (/metrics) for 1 minute."

      - alert: NyxGPTHighErrorRate
        expr: >
          sum(rate(nyxgpt_http_errors_total[5m]))
          / sum(rate(nyxgpt_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "nyxGPT API error rate above 5%"
          description: "More than 5% of HTTP requests have resulted in 5xx errors over the last 5 minutes."

      - alert: NyxGPTHighLatency
        expr: >
          histogram_quantile(0.95,
            sum(rate(nyxgpt_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "nyxGPT API p95 latency above 2s"
          description: "The 95th percentile HTTP request latency has exceeded 2 seconds for 5 minutes."
