# Pinning the project name means `docker compose` commands run from inside
# the `api` container (see the self-heal watchdog below) always resolve to
# this project, regardless of what directory a user checked the repo out
# into -- Compose otherwise derives the project name from the checkout
# directory's basename, which the watchdog has no way to know from inside
# the container.
name: nyxgpt

# Every published port below is bound to NYXGPT_BIND_ADDR (default
# 127.0.0.1), matching the native deployment's workstation-only posture
# (docs/security.md) -- otherwise Docker publishes on 0.0.0.0 and the stack
# becomes reachable from anyone on the same LAN. Only widen this (e.g.
# `NYXGPT_BIND_ADDR=0.0.0.0` in .env) if you've also turned on
# `[auth] enabled = true` and understand the exposure -- see
# docs/security.md#network-security and docs/docker-compose.md.

networks:
  nyxgpt:
    driver: bridge

# All container data lives under $HOME/.nyxGPT/volumes/<component> on the
# host (see docs/docker-compose.md#volumes) -- plain bind mounts, not named
# Docker volumes, so it's visible/attributable on the host filesystem and
# survives switching between Compose/Terraform/native. `${HOME}` is
# interpolated from the environment `docker compose` runs in, same as the
# promtail native-log bind mount below. ollama/cassandra/nyxgpt-data are
# reused as-is by terraform/main.tf and (cassandra only) the native
# `nyxgpt ops install` Cassandra container -- keep those three paths
# identical across all three so switching deployment modes doesn't lose
# chats or re-download models. Migrating pre-#3346 named-volume data into
# these directories is handled by `nyxgpt ops migrate-volumes` (also run
# automatically by `nyxgpt ops install`).

services:
  ollama:
    # Keep this pin identical to terraform/main.tf's docker_image.ollama --
    # see docs/docker-compose.md#image-pinning for the policy and how to
    # bump both together.
    image: ollama/ollama:0.32.4
    # Fixed name (rather than Compose's default `nyxgpt-ollama-1`) so the
    # host-side `com.nyxgpt.ollama-logs` LaunchAgent (scripts/follow-ollama-logs.sh)
    # can find this container by a predictable name, mirroring how the
    # native-mode Cassandra container is always named `nyxgpt-cassandra` --
    # see docs/api.md#ollama-logs.
    container_name: nyxgpt-ollama
    restart: unless-stopped
    networks:
      - nyxgpt
    ports:
      - "${NYXGPT_BIND_ADDR:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${HOME}/.nyxGPT/volumes/ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cassandra:
    # Keep this pin identical to terraform/main.tf's docker_image.cassandra
    # and src/nyxgpt/ops.py's CASSANDRA_IMAGE -- see
    # docs/docker-compose.md#image-pinning for the policy and how to bump
    # all three together.
    image: cassandra:5.0.8
    restart: unless-stopped
    networks:
      - nyxgpt
    ports:
      - "${NYXGPT_BIND_ADDR:-127.0.0.1}:${CASSANDRA_PORT:-9042}:9042"
    environment:
      # Must match the cluster name stamped into cassandra_data's system
      # keyspace (and ops.py's CASSANDRA_CLUSTER_NAME) -- Cassandra refuses
      # to start against data saved under a different cluster name.
      CASSANDRA_CLUSTER_NAME: nyxgpt
    volumes:
      - ${HOME}/.nyxGPT/volumes/cassandra:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nyxgpt-api:${NYXGPT_API_IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
      - nyxgpt
    ports:
      - "${NYXGPT_BIND_ADDR:-127.0.0.1}:${NYXGPT_API_PORT:-8000}:8000"
    environment:
      # NYXGPT_AUTH_API_KEY's single source of truth is ~/.nyxGPT/config.ini's
      # [auth] api_key -- run `nyxgpt ops env-sync` to derive .env's value
      # from it instead of editing .env by hand.
      NYXGPT_AUTH_API_KEY: ${NYXGPT_AUTH_API_KEY:-}
      NYXGPT_CORS_ORIGINS: ${NYXGPT_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Tells the self-heal watchdog (src/nyxgpt/self_heal.py) which compose
      # file to run `docker compose ps/restart` against -- see the volume
      # mount below and docs/self-healing.md for why this can't just be
      # resolved from the module's own path inside the container, plus the
      # security tradeoffs of the docker.sock mount two lines down.
      NYXGPT_COMPOSE_FILE: /etc/nyxgpt/docker-compose.yml
    volumes:
      - ./docker/config.docker.ini:/etc/nyxgpt/config/config.ini:ro
      - ${HOME}/.nyxGPT/volumes/nyxgpt-data:/root/.nyxGPT
      - ./docker-compose.yml:/etc/nyxgpt/docker-compose.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      ollama:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        # Browser-side OTel/error-tracking correlation backbone (#3430) --
        # see web/Dockerfile for why these are build args, not env vars.
        NEXT_PUBLIC_NYXGPT_OTLP_ENDPOINT: ${NEXT_PUBLIC_NYXGPT_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}
        NEXT_PUBLIC_NYXGPT_TRACING_ENABLED: ${NEXT_PUBLIC_NYXGPT_TRACING_ENABLED:-true}
        NEXT_PUBLIC_NYXGPT_ERROR_TRACKING_DSN: ${NEXT_PUBLIC_NYXGPT_ERROR_TRACKING_DSN:-}
    image: nyxgpt-web:${NYXGPT_WEB_IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
      - nyxgpt
    ports:
      - "${NYXGPT_BIND_ADDR:-127.0.0.1}:${NYXGPT_WEB_PORT:-3000}:3000"
    environment:
      # Server-side base URL the Next.js proxy routes use to reach the API
      # over the compose network (see web/src/lib/apiProxy.ts). This is
      # distinct from the NEXT_PUBLIC_API_BASE_URL build arg above, which is
      # baked into the browser bundle instead.
      NYXGPT_API_BASE_URL: http://api:8000
      # Same shared secret as the api service, so the proxy routes can
      # attach X-API-Key on every backend call (see docker/config.docker.ini).
      NYXGPT_AUTH_API_KEY: ${NYXGPT_AUTH_API_KEY:-}
      # Next.js server-side OTel correlation backbone (#3430, src/instrumentation.ts):
      # the container-network hostname for the same otel-collector the api
      # service's [tracing] otlp_endpoint points at -- "localhost" here would
      # mean the web container itself, not otel-collector next to it (same
      # reasoning as error_tracking.py's GlitchTip DSN host rewrite). Unused
      # (and harmless) whenever NYXGPT_TRACING_ENABLED is "false".
      NYXGPT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      NYXGPT_TRACING_ENABLED: ${NYXGPT_TRACING_ENABLED:-true}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Monitoring dashboards (opt-in): `docker compose --profile monitoring up`.
  # Prometheus scrapes the API's `/metrics` endpoint (see docker/prometheus.yml)
  # and evaluates the alerting rules in docker/prometheus-alerts.yml; Grafana
  # is pre-provisioned with a Prometheus datasource and the dashboards under
  # docker/grafana/dashboards (system overview, RAG performance, API
  # metrics). Everything stays on this machine -- nothing is sent to an
  # external/cloud monitoring service.
  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - nyxgpt
    # The scrape target is the host-native API (see docker/prometheus.yml).
    # Docker Desktop provides host.docker.internal out of the box; this
    # mapping makes it resolve on plain Linux engines too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${HOME}/.nyxGPT/volumes/prometheus:/prometheus
    ports:
      - "${NYXGPT_BIND_ADDR:-127.0.0.1}:${PROMETHEUS_UI_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - nyxgpt
    environment:
      # GRAFANA_ADMIN_PASSWORD's single source of truth is ~/.nyxGPT/config.ini's
      # [monitoring] grafana_admin_password -- run `nyxgpt ops env-sync` to
      # derive .env's value from it instead of editing .env by hand.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana is the single pane of glass (#3411): guarantee the Logs
      # Drilldown app and the Infinity datasource (GlitchTip panels) are
      # present on a fresh install even if a given image build doesn't
      # bundle them by default.
      GF_INSTALL_PLUGINS: "grafana-lokiexplore-app,yesoreyeram-infinity-datasource"
      # SRE Home (docker/grafana/dashboards/sre-home.json, uid
      # nyxgpt-sre-home) is the landing page opened by the Admin Dashboard's
      # SRE Overview tile.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sre-home.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${HOME}/.nyxGPT/volumes/grafana:/var/lib/grafana
      # GlitchTip API token for the Infinity datasource, minted by `nyxgpt
      # ops glitchtip-init` -- see datasource.yml's `$__file{}` reference and
      # docs/docker-compose.md#grafana-single-pane-of-glass. Read-only,
      # outside grafana's own data dir so `nyxgpt ops down --volumes` never
      # deletes it.
      - ${HOME}/.nyxGPT/secrets:/etc/nyxgpt-secrets:ro
    ports:
      - "${NYXGPT_BIND_ADDR:-127.0.0.1}:${GRAFANA_UI_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Log aggregation (opt-in): `docker compose --profile logging up`. Promtail
  # ships logs to Loki from TWO sources, since promtail is always a
  # container regardless of whether the core app runs native or Compose:
  #   - Compose mode: the api container writes to /root/.nyxGPT, which is
  #     bind-mounted from ~/.nyxGPT/volumes/nyxgpt-data on the host (see
  #     docs/docker-compose.md#volumes) -- promtail mounts that same host
  #     directory read-only at /var/log/nyxgpt.
  #   - Native mode (the primary local path, see docs/ops.md): api/self-heal
  #     /ops run on the host and write to ~/.nyxGPT/logs, a separate plain
  #     host directory that is NOT part of ~/.nyxGPT/volumes/nyxgpt-data --
  #     promtail separately bind-mounts that host directory read-only at
  #     /var/log/nyxgpt-native.
  # Both paths are scraped by docker/promtail-config.yml so logs reach Loki
  # no matter which mode produced them. Grafana (see the `monitoring`
  # profile above) is pre-provisioned with a Loki datasource and a Logs
  # Explorer dashboard under docker/grafana/dashboards. Everything stays on
  # this machine -- nothing is sent to an external/cloud log service. Set
  # `[log_aggregation] enabled = true` in config.ini to have the SRE/admin
  # dashboard reflect that it's running. See docs/docker-compose.md#log-aggregation.
  loki:
    image: grafana/loki:3.6.13
    restart: unless-stopped
    profiles:
      - logging
    networks:
      - nyxgpt
    volumes:
      - ./docker/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ${HOME}/.nyxGPT/volumes/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.6.11
    restart: unless-stopped
    profiles:
      - logging
    networks:
      - nyxgpt
    volumes:
      - ./docker/promtail-config.yml:/etc/promtail/config.yml:ro
      - ${HOME}/.nyxGPT/volumes/nyxgpt-data:/var/log/nyxgpt:ro
      # Host bind for native-mode logs -- see the comment block above.
      # ${HOME} is interpolated from the environment `docker compose` runs
      # in, not from .env (matching how the api/web services' host user
      # already resolves paths natively); a fresh install with no native
      # logs yet just means this mounts (and scrapes) an empty directory.
      - ${HOME}/.nyxGPT/logs:/var/log/nyxgpt-native/logs:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # Distributed tracing (opt-in): `docker compose --profile tracing up`.
  # Traces stay on this machine -- the collector only forwards to the local
  # Jaeger all-in-one container, never to an external/cloud endpoint. Set
  # `[tracing] enabled = true` in config.ini (see docker/config.docker.ini)
  # to have the API actually emit spans to the collector below.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    restart: unless-stopped
    profiles:
      - tracing
    networks:
      - nyxgpt
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    # Publish the OTLP receivers to the host: the default deployment is
    # native (api runs on the host, not in this Compose network -- see
    # docs/ops.md), so the api's OTLPSpanExporter talks to
    # http://localhost:4318/v1/traces from outside Docker entirely. Without
    # a ports mapping here, that traffic has nowhere to land and every span
    # is silently dropped -- see #3350. Bound to 127.0.0.1 per #3195
    # (workstation-only, never exposed on the LAN).
    ports:
      - "${NYXGPT_BIND_ADDR:-127.0.0.1}:${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
      - "${NYXGPT_BIND_ADDR:-127.0.0.1}:${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
    # No healthcheck here: opentelemetry-collector-contrib ships FROM scratch
    # with no shell/wget/curl, so a CMD-SHELL probe isn't possible. Container
    # crash-restart (restart: unless-stopped) is the only signal available;
    # the self-heal watchdog falls back to Docker's own container State for
    # this service rather than a health check.
    depends_on:
      jaeger:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    profiles:
      - tracing
    networks:
      - nyxgpt
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${NYXGPT_BIND_ADDR:-127.0.0.1}:${JAEGER_UI_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:16686/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Self-hosted error tracking (opt-in): `docker compose --profile errors up`.
  # GlitchTip is a Sentry-protocol-compatible error tracker that runs
  # entirely on this machine -- exception data never leaves the host, and
  # nothing here ever talks to Sentry's own SaaS. After first boot, create a
  # project in the GlitchTip UI (http://localhost:8080) to get a DSN, then
  # set `[error_tracking] enabled = true` and `dsn = <that DSN>` in
  # config.ini (see docker/config.docker.ini) to have the API report
  # exceptions.
  glitchtip-postgres:
    image: postgres:16.14
    restart: unless-stopped
    profiles:
      - errors
    networks:
      - nyxgpt
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
      POSTGRES_DB: glitchtip
    volumes:
      - ${HOME}/.nyxGPT/volumes/glitchtip-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  glitchtip-redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    profiles:
      - errors
    networks:
      - nyxgpt
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  glitchtip-migrate:
    image: glitchtip/glitchtip:6.2.0
    profiles:
      - errors
    networks:
      - nyxgpt
    command: ./manage.py migrate
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me}
    depends_on:
      glitchtip-postgres:
        condition: service_healthy

  glitchtip:
    image: glitchtip/glitchtip:6.2.0
    restart: unless-stopped
    profiles:
      - errors
    networks:
      - nyxgpt
    ports:
      - "${NYXGPT_BIND_ADDR:-127.0.0.1}:${GLITCHTIP_UI_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me}
      PORT: 8080
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:${GLITCHTIP_UI_PORT:-8080}
      DEFAULT_FROM_EMAIL: errors@nyxgpt.local
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    volumes:
      - ${HOME}/.nyxGPT/volumes/glitchtip-uploads:/code/uploads
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
      glitchtip-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  glitchtip-worker:
    image: glitchtip/glitchtip:6.2.0
    restart: unless-stopped
    profiles:
      - errors
    networks:
      - nyxgpt
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me}
      EMAIL_URL: consolemail://
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    volumes:
      - ${HOME}/.nyxGPT/volumes/glitchtip-uploads:/code/uploads
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
      glitchtip-migrate:
        condition: service_completed_successfully
