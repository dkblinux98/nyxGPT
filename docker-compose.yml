# Pinning the project name means `docker compose` commands run from inside
# the `api` container (see the self-heal watchdog below) always resolve to
# this project, regardless of what directory a user checked the repo out
# into -- Compose otherwise derives the project name from the checkout
# directory's basename, which the watchdog has no way to know from inside
# the container.
name: nyxgpt

networks:
  nyxgpt:
    driver: bridge

volumes:
  ollama_data:
  cassandra_data:
  nyxgpt_data:
  glitchtip_postgres_data:
  glitchtip_uploads:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks:
      - nyxgpt
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cassandra:
    image: cassandra:5.0
    restart: unless-stopped
    networks:
      - nyxgpt
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nyxgpt-api:${NYXGPT_API_IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
      - nyxgpt
    ports:
      - "${NYXGPT_API_PORT:-8000}:8000"
    environment:
      NYXGPT_AUTH_API_KEY: ${NYXGPT_AUTH_API_KEY:-}
      NYXGPT_CORS_ORIGINS: ${NYXGPT_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Tells the self-heal watchdog (src/nyxgpt/self_heal.py) which compose
      # file to run `docker compose ps/restart` against -- see the volume
      # mount below and docs/self-healing.md for why this can't just be
      # resolved from the module's own path inside the container, plus the
      # security tradeoffs of the docker.sock mount two lines down.
      NYXGPT_COMPOSE_FILE: /etc/nyxgpt/docker-compose.yml
    volumes:
      - ./docker/config.docker.ini:/etc/nyxgpt/config/config.ini:ro
      - nyxgpt_data:/root/.nyxGPT
      - ./docker-compose.yml:/etc/nyxgpt/docker-compose.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      ollama:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: nyxgpt-web:${NYXGPT_WEB_IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
      - nyxgpt
    ports:
      - "${NYXGPT_WEB_PORT:-3000}:3000"
    environment:
      # Server-side base URL the Next.js proxy routes use to reach the API
      # over the compose network (see web/src/lib/apiProxy.ts). This is
      # distinct from the NEXT_PUBLIC_API_BASE_URL build arg above, which is
      # baked into the browser bundle instead.
      NYXGPT_API_BASE_URL: http://api:8000
      # Same shared secret as the api service, so the proxy routes can
      # attach X-API-Key on every backend call (see docker/config.docker.ini).
      NYXGPT_AUTH_API_KEY: ${NYXGPT_AUTH_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Monitoring dashboards (opt-in): `docker compose --profile monitoring up`.
  # Prometheus scrapes the API's `/metrics` endpoint (see docker/prometheus.yml)
  # and evaluates the alerting rules in docker/prometheus-alerts.yml; Grafana
  # is pre-provisioned with a Prometheus datasource and the dashboards under
  # docker/grafana/dashboards (system overview, RAG performance, API
  # metrics). Everything stays on this machine -- nothing is sent to an
  # external/cloud monitoring service.
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - nyxgpt
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_UI_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    profiles:
      - monitoring
    networks:
      - nyxgpt
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_UI_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Log aggregation (opt-in): `docker compose --profile logging up`. Promtail
  # tails the API's log files under ~/.nyxGPT/logs (the same nyxgpt_data
  # volume the api service writes to) and ships them to Loki; Grafana (see
  # the `monitoring` profile above) is pre-provisioned with a Loki
  # datasource and a Logs Explorer dashboard under docker/grafana/dashboards.
  # Everything stays on this machine -- nothing is sent to an
  # external/cloud log service. Set `[log_aggregation] enabled = true` in
  # config.ini to have the SRE/admin dashboard reflect that it's running.
  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    profiles:
      - logging
    networks:
      - nyxgpt
    volumes:
      - ./docker/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    profiles:
      - logging
    networks:
      - nyxgpt
    volumes:
      - ./docker/promtail-config.yml:/etc/promtail/config.yml:ro
      - nyxgpt_data:/var/log/nyxgpt:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # Distributed tracing (opt-in): `docker compose --profile tracing up`.
  # Traces stay on this machine -- the collector only forwards to the local
  # Jaeger all-in-one container, never to an external/cloud endpoint. Set
  # `[tracing] enabled = true` in config.ini (see docker/config.docker.ini)
  # to have the API actually emit spans to the collector below.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    profiles:
      - tracing
    networks:
      - nyxgpt
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_healthy
    # No healthcheck here: opentelemetry-collector-contrib ships FROM scratch
    # with no shell/wget/curl, so a CMD-SHELL probe isn't possible. Container
    # crash-restart (restart: unless-stopped) is the only signal available;
    # the self-heal watchdog falls back to Docker's own container State for
    # this service rather than a health check.

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    profiles:
      - tracing
    networks:
      - nyxgpt
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:16686/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Self-hosted error tracking (opt-in): `docker compose --profile errors up`.
  # GlitchTip is a Sentry-protocol-compatible error tracker that runs
  # entirely on this machine -- exception data never leaves the host, and
  # nothing here ever talks to Sentry's own SaaS. After first boot, create a
  # project in the GlitchTip UI (http://localhost:8080) to get a DSN, then
  # set `[error_tracking] enabled = true` and `dsn = <that DSN>` in
  # config.ini (see docker/config.docker.ini) to have the API report
  # exceptions.
  glitchtip-postgres:
    image: postgres:16
    restart: unless-stopped
    profiles:
      - errors
    networks:
      - nyxgpt
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  glitchtip-redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles:
      - errors
    networks:
      - nyxgpt
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  glitchtip-migrate:
    image: glitchtip/glitchtip:latest
    profiles:
      - errors
    networks:
      - nyxgpt
    command: ./manage.py migrate
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me}
    depends_on:
      glitchtip-postgres:
        condition: service_healthy

  glitchtip:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    profiles:
      - errors
    networks:
      - nyxgpt
    ports:
      - "${GLITCHTIP_UI_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me}
      PORT: 8080
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:${GLITCHTIP_UI_PORT:-8080}
      DEFAULT_FROM_EMAIL: errors@nyxgpt.local
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    volumes:
      - glitchtip_uploads:/code/uploads
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
      glitchtip-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    profiles:
      - errors
    networks:
      - nyxgpt
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me}
      EMAIL_URL: consolemail://
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    volumes:
      - glitchtip_uploads:/code/uploads
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
      glitchtip-migrate:
        condition: service_completed_successfully
