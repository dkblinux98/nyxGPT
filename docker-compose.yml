networks:
  nyxgpt:
    driver: bridge

volumes:
  ollama_data:
  cassandra_data:
  nyxgpt_data:
  glitchtip_postgres_data:
  glitchtip_uploads:

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks:
      - nyxgpt
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cassandra:
    image: cassandra:5.0
    restart: unless-stopped
    networks:
      - nyxgpt
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nyxgpt-api:${NYXGPT_API_IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
      - nyxgpt
    ports:
      - "${NYXGPT_API_PORT:-8000}:8000"
    environment:
      NYXGPT_AUTH_API_KEY: ${NYXGPT_AUTH_API_KEY:-}
      NYXGPT_CORS_ORIGINS: ${NYXGPT_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./docker/config.docker.ini:/etc/nyxgpt/config/config.ini:ro
      - nyxgpt_data:/root/.nyxGPT
    depends_on:
      ollama:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: nyxgpt-web:${NYXGPT_WEB_IMAGE_TAG:-local}
    restart: unless-stopped
    networks:
      - nyxgpt
    ports:
      - "${NYXGPT_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # Distributed tracing (opt-in): `docker compose --profile tracing up`.
  # Traces stay on this machine -- the collector only forwards to the local
  # Jaeger all-in-one container, never to an external/cloud endpoint. Set
  # `[tracing] enabled = true` in config.ini (see docker/config.docker.ini)
  # to have the API actually emit spans to the collector below.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    profiles:
      - tracing
    networks:
      - nyxgpt
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    profiles:
      - tracing
    networks:
      - nyxgpt
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  # Self-hosted error tracking (opt-in): `docker compose --profile errors up`.
  # GlitchTip is a Sentry-protocol-compatible error tracker that runs
  # entirely on this machine -- exception data never leaves the host, and
  # nothing here ever talks to Sentry's own SaaS. After first boot, create a
  # project in the GlitchTip UI (http://localhost:8080) to get a DSN, then
  # set `[error_tracking] enabled = true` and `dsn = <that DSN>` in
  # config.ini (see docker/config.docker.ini) to have the API report
  # exceptions.
  glitchtip-postgres:
    image: postgres:16
    restart: unless-stopped
    profiles:
      - errors
    networks:
      - nyxgpt
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  glitchtip-redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles:
      - errors
    networks:
      - nyxgpt

  glitchtip-migrate:
    image: glitchtip/glitchtip:latest
    profiles:
      - errors
    networks:
      - nyxgpt
    command: ./manage.py migrate
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me}
    depends_on:
      glitchtip-postgres:
        condition: service_healthy

  glitchtip:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    profiles:
      - errors
    networks:
      - nyxgpt
    ports:
      - "${GLITCHTIP_UI_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me}
      PORT: 8080
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:${GLITCHTIP_UI_PORT:-8080}
      DEFAULT_FROM_EMAIL: errors@nyxgpt.local
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    volumes:
      - glitchtip_uploads:/code/uploads
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
      glitchtip-migrate:
        condition: service_completed_successfully

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    profiles:
      - errors
    networks:
      - nyxgpt
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me}
      EMAIL_URL: consolemail://
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    volumes:
      - glitchtip_uploads:/code/uploads
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
      glitchtip-migrate:
        condition: service_completed_successfully
